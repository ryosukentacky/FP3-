</main><script>
const cards=[{"title": "FPが守るべき3つのこと", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>FPが守るべき3つのこと</strong>は、一言でいうと――」</p>\n<p><strong>FPは顧客利益を優先し、秘密を守り、専門外の独占業務へ踏み込まない姿勢が基本です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>FPは顧客利益を優先し、秘密を守り、専門外の独占業務へ踏み込まない姿勢が基本です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>FPが守るべき3つのこと</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>税務相談なら税理士、法律判断なら弁護士など、資格者の独占業務との境界</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>相続相談で具体的な税額計算まで依頼されたら、一般的説明にとどめ専門家につなぐ</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>FPが守るべき3つのこと</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>相続相談で具体的な税額計算まで依頼されたら、一般的説明にとどめ専門家につなぐ</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>相続相談で具体的な税額計算まで依頼されたら、一般的説明にとどめ専門家につなぐ</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>税務相談なら税理士、法律判断なら弁護士など、資格者の独占業務との境界</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>FPが守るべき3つのこと</strong>を一言で説明すると？<br><span class=\"answer\">FPは顧客利益を優先し、秘密を守り、専門外の独占業務へ踏み込まない姿勢が基本です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">相続相談で具体的な税額計算まで依頼されたら、一般的説明にとどめ専門家につなぐ</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">税務相談なら税理士、法律判断なら弁護士など、資格者の独占業務との境界</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>FPが守るべき3つのこと</dd>\n<dt>② 一番重要なのは？</dt><dd>FPは顧客利益を優先し、秘密を守り、専門外の独占業務へ踏み込まない姿勢が基本です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>相続相談で具体的な税額計算まで依頼されたら、一般的説明にとどめ専門家につなぐ</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>税務相談なら税理士、法律判断なら弁護士など、資格者の独占業務との境界</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>FPが守るべき3つのこと＝FPは顧客利益を優先し、秘密を守り、専門外の独占業務へ踏み込まない姿勢が基本です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>FPが守るべき3つのこと</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>キャッシュフロー表</strong>は、一言でいうと――」</p>\n<p><strong>将来の収入・支出・年間収支・貯蓄残高を年ごとに並べ、家計が将来どう動くかを見る表です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>将来の収入・支出・年間収支・貯蓄残高を年ごとに並べ、家計が将来どう動くかを見る表です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>キャッシュフロー表</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>年間収支と貯蓄残高、現在価値と将来価値を混同しない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>前年貯蓄500万円、今年収入600万円・支出550万円なら、単純化すれば年間収支+50万円で残高550万円</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>キャッシュフロー表</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>前年貯蓄500万円、今年収入600万円・支出550万円なら、単純化すれば年間収支+50万円で残高550万円</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>前年貯蓄500万円、今年収入600万円・支出550万円なら、単純化すれば年間収支+50万円で残高550万円</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>年間収支と貯蓄残高、現在価値と将来価値を混同しない</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>キャッシュフロー表</strong>を一言で説明すると？<br><span class=\"answer\">将来の収入・支出・年間収支・貯蓄残高を年ごとに並べ、家計が将来どう動くかを見る表です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">前年貯蓄500万円、今年収入600万円・支出550万円なら、単純化すれば年間収支+50万円で残高550万円</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">年間収支と貯蓄残高、現在価値と将来価値を混同しない</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>キャッシュフロー表</dd>\n<dt>② 一番重要なのは？</dt><dd>将来の収入・支出・年間収支・貯蓄残高を年ごとに並べ、家計が将来どう動くかを見る表です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>前年貯蓄500万円、今年収入600万円・支出550万円なら、単純化すれば年間収支+50万円で残高550万円</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>年間収支と貯蓄残高、現在価値と将来価値を混同しない</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>キャッシュフロー表＝将来の収入・支出・年間収支・貯蓄残高を年ごとに並べ、家計が将来どう動くかを見る表です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>キャッシュフロー表</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "終価係数", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>終価係数</strong>は、一言でいうと――」</p>\n<p><strong>今ある一括資金を複利運用したときの将来額を求める係数です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>今ある一括資金を複利運用したときの将来額を求める係数です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>終価係数</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>年金終価係数は『毎年積立』。終価係数は『今ある一括資金』</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>100万円を年2％で5年なら、100万円×終価係数で5年後の額を求める</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>終価係数</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>100万円を年2％で5年なら、100万円×終価係数で5年後の額を求める</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>100万円を年2％で5年なら、100万円×終価係数で5年後の額を求める</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>年金終価係数は『毎年積立』。終価係数は『今ある一括資金』</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>終価係数</strong>を一言で説明すると？<br><span class=\"answer\">今ある一括資金を複利運用したときの将来額を求める係数です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">100万円を年2％で5年なら、100万円×終価係数で5年後の額を求める</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">年金終価係数は『毎年積立』。終価係数は『今ある一括資金』</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>終価係数</dd>\n<dt>② 一番重要なのは？</dt><dd>今ある一括資金を複利運用したときの将来額を求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>100万円を年2％で5年なら、100万円×終価係数で5年後の額を求める</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>年金終価係数は『毎年積立』。終価係数は『今ある一括資金』</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>終価係数＝今ある一括資金を複利運用したときの将来額を求める係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>終価係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "現価係数", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>現価係数</strong>は、一言でいうと――」</p>\n<p><strong>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>現価係数</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>終価係数と方向が逆。将来→現在</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>5年後に100万円必要なら、100万円×現価係数で現在必要額を求める</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>現価係数</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>5年後に100万円必要なら、100万円×現価係数で現在必要額を求める</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>5年後に100万円必要なら、100万円×現価係数で現在必要額を求める</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>終価係数と方向が逆。将来→現在</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>現価係数</strong>を一言で説明すると？<br><span class=\"answer\">将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">5年後に100万円必要なら、100万円×現価係数で現在必要額を求める</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">終価係数と方向が逆。将来→現在</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>現価係数</dd>\n<dt>② 一番重要なのは？</dt><dd>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>5年後に100万円必要なら、100万円×現価係数で現在必要額を求める</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>終価係数と方向が逆。将来→現在</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>現価係数＝将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>現価係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "年金終価係数", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>年金終価係数</strong>は、一言でいうと――」</p>\n<p><strong>毎年同額を積み立てたとき、将来いくら貯まるかを求める係数です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>毎年同額を積み立てたとき、将来いくら貯まるかを求める係数です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>年金終価係数</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>減債基金係数は逆に『目標額から毎年積立額』を求める</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>毎年20万円を10年間積み立てるなら20万円×年金終価係数</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>年金終価係数</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>毎年20万円を10年間積み立てるなら20万円×年金終価係数</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>毎年20万円を10年間積み立てるなら20万円×年金終価係数</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>減債基金係数は逆に『目標額から毎年積立額』を求める</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>年金終価係数</strong>を一言で説明すると？<br><span class=\"answer\">毎年同額を積み立てたとき、将来いくら貯まるかを求める係数です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">毎年20万円を10年間積み立てるなら20万円×年金終価係数</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">減債基金係数は逆に『目標額から毎年積立額』を求める</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>年金終価係数</dd>\n<dt>② 一番重要なのは？</dt><dd>毎年同額を積み立てたとき、将来いくら貯まるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>毎年20万円を10年間積み立てるなら20万円×年金終価係数</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>減債基金係数は逆に『目標額から毎年積立額』を求める</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>年金終価係数＝毎年同額を積み立てたとき、将来いくら貯まるかを求める係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>年金終価係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "減債基金係数", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>減債基金係数</strong>は、一言でいうと――」</p>\n<p><strong>将来の目標額を作るため、毎年いくら積み立てる必要があるかを求める係数です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>将来の目標額を作るため、毎年いくら積み立てる必要があるかを求める係数です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>減債基金係数</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>年金終価係数の逆方向</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>10年後に300万円必要なら300万円×減債基金係数で毎年積立額</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>減債基金係数</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>10年後に300万円必要なら300万円×減債基金係数で毎年積立額</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>10年後に300万円必要なら300万円×減債基金係数で毎年積立額</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>年金終価係数の逆方向</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>減債基金係数</strong>を一言で説明すると？<br><span class=\"answer\">将来の目標額を作るため、毎年いくら積み立てる必要があるかを求める係数です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">10年後に300万円必要なら300万円×減債基金係数で毎年積立額</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">年金終価係数の逆方向</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>減債基金係数</dd>\n<dt>② 一番重要なのは？</dt><dd>将来の目標額を作るため、毎年いくら積み立てる必要があるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>10年後に300万円必要なら300万円×減債基金係数で毎年積立額</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>年金終価係数の逆方向</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>減債基金係数＝将来の目標額を作るため、毎年いくら積み立てる必要があるかを求める係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>減債基金係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "資本回収係数", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>資本回収係数</strong>は、一言でいうと――」</p>\n<p><strong>今ある元本を運用しながら一定期間で取り崩すとき、毎年の受取額を求める係数です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>今ある元本を運用しながら一定期間で取り崩すとき、毎年の受取額を求める係数です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>資本回収係数</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>年金現価係数は『毎年受取額から今必要な元本』を求める</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>1,000万円を10年間で取り崩すなら1,000万円×資本回収係数</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>資本回収係数</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>1,000万円を10年間で取り崩すなら1,000万円×資本回収係数</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>1,000万円を10年間で取り崩すなら1,000万円×資本回収係数</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>年金現価係数は『毎年受取額から今必要な元本』を求める</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>資本回収係数</strong>を一言で説明すると？<br><span class=\"answer\">今ある元本を運用しながら一定期間で取り崩すとき、毎年の受取額を求める係数です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">1,000万円を10年間で取り崩すなら1,000万円×資本回収係数</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">年金現価係数は『毎年受取額から今必要な元本』を求める</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>資本回収係数</dd>\n<dt>② 一番重要なのは？</dt><dd>今ある元本を運用しながら一定期間で取り崩すとき、毎年の受取額を求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>1,000万円を10年間で取り崩すなら1,000万円×資本回収係数</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>年金現価係数は『毎年受取額から今必要な元本』を求める</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>資本回収係数＝今ある元本を運用しながら一定期間で取り崩すとき、毎年の受取額を求める係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>資本回収係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "年金現価係数", "content": {"A": "\n<p>「先輩、いきなり細か の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>年金現価係数</dd>\n<dt>② 一番重要なのは？</dt><dd>将来毎年同額を受け取るために、今いくら元本が必要かを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>毎年100万円を10年受け取りたいなら100万円×年金現価係数</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>資本回収係数の逆方向</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>年金現価係数＝将来毎年同額を受け取るために、今いくら元本が必要かを求める係数です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>年金現価係数</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>こども保険（学資保険）</strong>は、一言でいうと――」</p>\n<p><strong>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>こども保険（学資保険）</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>単なる預金ではなく、契約者死亡時の払込免除など保障機能を持つ商品もある</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>大学入学時に200万円受け取る設計にし、保護者に万一があった場合の払込免除条件も確認</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>こども保険（学資保険）</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>大学入学時に200万円受け取る設計にし、保護者に万一があった場合の払込免除条件も確認</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>大学入学時に200万円受け取る設計にし、保護者に万一があった場合の払込免除条件も確認</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>単なる預金ではなく、契約者死亡時の払込免除など保障機能を持つ商品もある</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>こども保険（学資保険）</strong>を一言で説明すると？<br><span class=\"answer\">教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">大学入学時に200万円受け取る設計にし、保護者に万一があった場合の払込免除条件も確認</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">単なる預金ではなく、契約者死亡時の払込免除など保障機能を持つ商品もある</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>こども保険（学資保険）</dd>\n<dt>② 一番重要なのは？</dt><dd>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>大学入学時に200万円受け取る設計にし、保護者に万一があった場合の払込免除条件も確認</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>単なる預金ではなく、契約者死亡時の払込免除など保障機能を持つ商品もある</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>こども保険（学資保険）＝教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>こども保険（学資保険）</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>教育一般貸付（国の教育ローン）</strong>は、一言でいうと――」</p>\n<p><strong>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>教育一般貸付（国の教育ローン）</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>奨学金は学生本人が借りる形が中心。誰が債務者かを見る</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>入学金・授業料などを保護者が借り、返済主体も保護者になる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>教育一般貸付（国の教育ローン）</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>入学金・授業料などを保護者が借り、返済主体も保護者になる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>入学金・授業料などを保護者が借り、返済主体も保護者になる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>奨学金は学生本人が借りる形が中心。誰が債務者かを見る</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>教育一般貸付（国の教育ローン）</strong>を一言で説明すると？<br><span class=\"answer\">日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">入学金・授業料などを保護者が借り、返済主体も保護者になる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">奨学金は学生本人が借りる形が中心。誰が債務者かを見る</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>教育一般貸付（国の教育ローン）</dd>\n<dt>② 一番重要なのは？</dt><dd>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>入学金・授業料などを保護者が借り、返済主体も保護者になる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>奨学金は学生本人が借りる形が中心。誰が債務者かを見る</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>教育一般貸付（国の教育ローン）＝日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>教育一般貸付（国の教育ローン）</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "奨学金制度", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>奨学金制度</strong>は、一言でいうと――」</p>\n<p><strong>学生の修学を支える制度で、給付型と貸与型があり、貸与型は返還が必要です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>学生の修学を支える制度で、給付型と貸与型があり、貸与型は返還が必要です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>奨学金制度</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>教育ローンとの違いは、主な借り手・返済者と資金の受け取り方</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>月5万円の貸与を4年間受ければ元本だけで240万円。卒業後の返還負担も考える</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>奨学金制度</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>月5万円の貸与を4年間受ければ元本だけで240万円。卒業後の返還負担も考える</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>月5万円の貸与を4年間受ければ元本だけで240万円。卒業後の返還負担も考える</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>教育ローンとの違いは、主な借り手・返済者と資金の受け取り方</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>奨学金制度</strong>を一言で説明すると？<br><span class=\"answer\">学生の修学を支える制度で、給付型と貸与型があり、貸与型は返還が必要です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">月5万円の貸与を4年間受ければ元本だけで240万円。卒業後の返還負担も考える</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">教育ローンとの違いは、主な借り手・返済者と資金の受け取り方</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>奨学金制度</dd>\n<dt>② 一番重要なのは？</dt><dd>学生の修学を支える制度で、給付型と貸与型があり、貸与型は返還が必要です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>月5万円の貸与を4年間受ければ元本だけで240万円。卒業後の返還負担も考える</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>教育ローンとの違いは、主な借り手・返済者と資金の受け取り方</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>奨学金制度＝学生の修学を支える制度で、給付型と貸与型があり、貸与型は返還が必要です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>奨学金制度</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>固定金利期間選択型</strong>は、一言でいうと――」</p>\n<p><strong>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後に条件を選び直す方式です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後に条件を選び直す方式です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>固定金利期間選択型</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>全期間固定は完済まで固定。変動金利は定期的に金利が見直される</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>当初10年を固定し、11年目以降はその時点の条件で再選択する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>固定金利期間選択型</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>当初10年を固定し、11年目以降はその時点の条件で再選択する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>当初10年を固定し、11年目以降はその時点の条件で再選択する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>全期間固定は完済まで固定。変動金利は定期的に金利が見直される</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>固定金利期間選択型</strong>を一言で説明すると？<br><span class=\"answer\">住宅ローンの金利を当初の一定期間だけ固定し、期間終了後に条件を選び直す方式です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">当初10年を固定し、11年目以降はその時点の条件で再選択する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">全期間固定は完済まで固定。変動金利は定期的に金利が見直される</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>固定金利期間選択型</dd>\n<dt>② 一番重要なのは？</dt><dd>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後に条件を選び直す方式です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>当初10年を固定し、11年目以降はその時点の条件で再選択する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>全期間固定は完済まで固定。変動金利は定期的に金利が見直される</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>固定金利期間選択型＝住宅ローンの金利を当初の一定期間だけ固定し、期間終了後に条件を選び直す方式です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>固定金利期間選択型</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>元利均等返済と元金均等返済</strong>は、一言でいうと――」</p>\n<p><strong>元利均等は毎回の元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>元利均等は毎回の元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>元利均等返済と元金均等返済</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>同条件なら元金均等は当初返済額が大きい一方、元金減少が速く総利息が少なくなりやすい</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>3,000万円を借りた場合、元利均等は家計管理しやすく、元金均等は序盤の負担が重い</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>元利均等返済と元金均等返済</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>3,000万円を借りた場合、元利均等は家計管理しやすく、元金均等は序盤の負担が重い</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>3,000万円を借りた場合、元利均等は家計管理しやすく、元金均等は序盤の負担が重い</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>同条件なら元金均等は当初返済額が大きい一方、元金減少が速く総利息が少なくなりやすい</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>元利均等返済と元金均等返済</strong>を一言で説明すると？<br><span class=\"answer\">元利均等は毎回の元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">3,000万円を借りた場合、元利均等は家計管理しやすく、元金均等は序盤の負担が重い</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">同条件なら元金均等は当初返済額が大きい一方、元金減少が速く総利息が少なくなりやすい</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>元利均等返済と元金均等返済</dd>\n<dt>② 一番重要なのは？</dt><dd>元利均等は毎回の元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>3,000万円を借りた場合、元利均等は家計管理しやすく、元金均等は序盤の負担が重い</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>同条件なら元金均等は当初返済額が大きい一方、元金減少が速く総利息が少なくなりやすい</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>元利均等返済と元金均等返済＝元利均等は毎回の元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>元利均等返済と元金均等返済</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>は、一言でいうと――」</p>\n<p><strong>予定より早く元金を返し、返済期間を短くするか、毎回返済額を軽くする方法です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>予定より早く元金を返し、返済期間を短くするか、毎回返済額を軽くする方法です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>同額・同時期なら一般に期間短縮型の方が利息軽減効果が大きい</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>残高2,000万円の途中で100万円返す。期間短縮型なら完済を早め、軽減型なら月返済を下げる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>残高2,000万円の途中で100万円返す。期間短縮型なら完済を早め、軽減型なら月返済を下げる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>残高2,000万円の途中で100万円返す。期間短縮型なら完済を早め、軽減型なら月返済を下げる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>同額・同時期なら一般に期間短縮型の方が利息軽減効果が大きい</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>を一言で説明すると？<br><span class=\"answer\">予定より早く元金を返し、返済期間を短くするか、毎回返済額を軽くする方法です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">残高2,000万円の途中で100万円返す。期間短縮型なら完済を早め、軽減型なら月返済を下げる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">同額・同時期なら一般に期間短縮型の方が利息軽減効果が大きい</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>繰上げ返済（期間短縮型・返済額軽減型）</dd>\n<dt>② 一番重要なのは？</dt><dd>予定より早く元金を返し、返済期間を短くするか、毎回返済額を軽くする方法です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>残高2,000万円の途中で100万円返す。期間短縮型なら完済を早め、軽減型なら月返済を下げる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>同額・同時期なら一般に期間短縮型の方が利息軽減効果が大きい</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>繰上げ返済（期間短縮型・返済額軽減型）＝予定より早く元金を返し、返済期間を短くするか、毎回返済額を軽くする方法です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "財形住宅融資", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>財形住宅融資</strong>は、一言でいうと――」</p>\n<p><strong>財形貯蓄を行う勤労者が、一定条件で住宅取得・改良資金を借りられる制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>財形貯蓄を行う勤労者が、一定条件で住宅取得・改良資金を借りられる制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>財形住宅融資</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>フラット35とは利用条件・金利の仕組みが異なる。財形貯蓄とのつながりが鍵</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>給与天引きで財形を続けた会社員が住宅購入時に融資条件を確認する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>財形住宅融資</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>給与天引きで財形を続けた会社員が住宅購入時に融資条件を確認する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>給与天引きで財形を続けた会社員が住宅購入時に融資条件を確認する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>フラット35とは利用条件・金利の仕組みが異なる。財形貯蓄とのつながりが鍵</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>財形住宅融資</strong>を一言で説明すると？<br><span class=\"answer\">財形貯蓄を行う勤労者が、一定条件で住宅取得・改良資金を借りられる制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">給与天引きで財形を続けた会社員が住宅購入時に融資条件を確認する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">フラット35とは利用条件・金利の仕組みが異なる。財形貯蓄とのつながりが鍵</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>財形住宅融資</dd>\n<dt>② 一番重要なのは？</dt><dd>財形貯蓄を行う勤労者が、一定条件で住宅取得・改良資金を借りられる制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>給与天引きで財形を続けた会社員が住宅購入時に融資条件を確認する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>フラット35とは利用条件・金利の仕組みが異なる。財形貯蓄とのつながりが鍵</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>財形住宅融資＝財形貯蓄を行う勤労者が、一定条件で住宅取得・改良資金を借りられる制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>財形住宅融資</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "フラット35", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>フラット35</strong>は、一言でいうと――」</p>\n<p><strong>住宅金融支援機構と民間金融機関が提携する、長期の全期間固定金利型住宅ローンです。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>住宅金融支援機構と民間金融機関が提携する、長期の全期間固定金利型住宅ローンです。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>フラット35</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>固定期間選択型と違い、基本的に借入期間中の金利が固定</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>3,000万円を35年で借り、将来金利が上がっても契約時の固定条件で返済する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>フラット35</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>3,000万円を35年で借り、将来金利が上がっても契約時の固定条件で返済する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>3,000万円を35年で借り、将来金利が上がっても契約時の固定条件で返済する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>固定期間選択型と違い、基本的に借入期間中の金利が固定</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>フラット35</strong>を一言で説明すると？<br><span class=\"answer\">住宅金融支援機構と民間金融機関が提携する、長期の全期間固定金利型住宅ローンです。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">3,000万円を35年で借り、将来金利が上がっても契約時の固定条件で返済する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">固定期間選択型と違い、基本的に借入期間中の金利が固定</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>フラット35</dd>\n<dt>② 一番重要なのは？</dt><dd>住宅金融支援機構と民間金融機関が提携する、長期の全期間固定金利型住宅ローンです。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>3,000万円を35年で借り、将来金利が上がっても契約時の固定条件で返済する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>固定期間選択型と違い、基本的に借入期間中の金利が固定</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>フラット35＝住宅金融支援機構と民間金融機関が提携する、長期の全期間固定金利型住宅ローンです。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>フラット35</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>財形貯蓄制度</strong>は、一言でいうと――」</p>\n<p><strong>勤労者が給与天引きなどで計画的に貯蓄する制度で、一般・住宅・年金の3種類があります。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>勤労者が給与天引きなどで計画的に貯蓄する制度で、一般・住宅・年金の3種類があります。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>財形貯蓄制度</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>住宅財形・年金財形は目的が限定され、一般財形とは税制面も異なる</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>毎月2万円を給与天引きし、住宅取得目的なら住宅財形を検討する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>財形貯蓄制度</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>毎月2万円を給与天引きし、住宅取得目的なら住宅財形を検討する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>毎月2万円を給与天引きし、住宅取得目的なら住宅財形を検討する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>住宅財形・年金財形は目的が限定され、一般財形とは税制面も異なる</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>財形貯蓄制度</strong>を一言で説明すると？<br><span class=\"answer\">勤労者が給与天引きなどで計画的に貯蓄する制度で、一般・住宅・年金の3種類があります。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">毎月2万円を給与天引きし、住宅取得目的なら住宅財形を検討する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">住宅財形・年金財形は目的が限定され、一般財形とは税制面も異なる</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>財形貯蓄制度</dd>\n<dt>② 一番重要なのは？</dt><dd>勤労者が給与天引きなどで計画的に貯蓄する制度で、一般・住宅・年金の3種類があります。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>毎月2万円を給与天引きし、住宅取得目的なら住宅財形を検討する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>住宅財形・年金財形は目的が限定され、一般財形とは税制面も異なる</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>財形貯蓄制度＝勤労者が給与天引きなどで計画的に貯蓄する制度で、一般・住宅・年金の3種類があります。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>財形貯蓄制度</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "団体信用生命保険", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>団体信用生命保険</strong>は、一言でいうと――」</p>\n<p><strong>住宅ローン債務者が死亡・所定の高度障害等になったとき、保険金でローン残高を返済する仕組みです。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>住宅ローン債務者が死亡・所定の高度障害等になったとき、保険金でローン残高を返済する仕組みです。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>団体信用生命保険</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>通常の死亡保険は遺族が保険金を受け取るが、団信は住宅ローン残高の返済が中心</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>ローン残高2,000万円で対象事故が起きれば、契約条件に従い残高返済に充てられる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>団体信用生命保険</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>ローン残高2,000万円で対象事故が起きれば、契約条件に従い残高返済に充てられる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>ローン残高2,000万円で対象事故が起きれば、契約条件に従い残高返済に充てられる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>通常の死亡保険は遺族が保険金を受け取るが、団信は住宅ローン残高の返済が中心</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>団体信用生命保険</strong>を一言で説明すると？<br><span class=\"answer\">住宅ローン債務者が死亡・所定の高度障害等になったとき、保険金でローン残高を返済する仕組みです。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">ローン残高2,000万円で対象事故が起きれば、契約条件に従い残高返済に充てられる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">通常の死亡保険は遺族が保険金を受け取るが、団信は住宅ローン残高の返済が中心</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>団体信用生命保険</dd>\n<dt>② 一番重要なのは？</dt><dd>住宅ローン債務者が死亡・所定の高度障害等になったとき、保険金でローン残高を返済する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>ローン残高2,000万円で対象事故が起きれば、契約条件に従い残高返済に充てられる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>通常の死亡保険は遺族が保険金を受け取るが、団信は住宅ローン残高の返済が中心</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>団体信用生命保険＝住宅ローン債務者が死亡・所定の高度障害等になったとき、保険金でローン残高を返済する仕組みです。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>団体信用生命保険</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>住宅ローンの借り換え</strong>は、一言でいうと――」</p>\n<p><strong>今の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>今の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>住宅ローンの借り換え</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>金利差だけでなく、事務手数料・登記費用など借換え費用も含めて判断</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>残高2,000万円で金利が下がっても、諸費用が高ければ節約効果が小さくなる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>住宅ローンの借り換え</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>残高2,000万円で金利が下がっても、諸費用が高ければ節約効果が小さくなる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>残高2,000万円で金利が下がっても、諸費用が高ければ節約効果が小さくなる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>金利差だけでなく、事務手数料・登記費用など借換え費用も含めて判断</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>住宅ローンの借り換え</strong>を一言で説明すると？<br><span class=\"answer\">今の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">残高2,000万円で金利が下がっても、諸費用が高ければ節約効果が小さくなる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">金利差だけでなく、事務手数料・登記費用など借換え費用も含めて判断</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>住宅ローンの借り換え</dd>\n<dt>② 一番重要なのは？</dt><dd>今の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>残高2,000万円で金利が下がっても、諸費用が高ければ節約効果が小さくなる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>金利差だけでなく、事務手数料・登記費用など借換え費用も含めて判断</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>住宅ローンの借り換え＝今の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>住宅ローンの借り換え</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>埋葬に関する給付</strong>は、一言でいうと――」</p>\n<p><strong>健康保険では被保険者等が死亡した際、条件に応じて埋葬料・埋葬費などの給付があります。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>健康保険では被保険者等が死亡した際、条件に応じて埋葬料・埋葬費などの給付があります。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>埋葬に関する給付</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>誰が埋葬を行ったか、被保険者本人か被扶養者かで扱いを整理</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>会社員が死亡し、生計維持関係のある家族が埋葬したケースを制度要件に当てはめる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>埋葬に関する給付</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>会社員が死亡し、生計維持関係のある家族が埋葬したケースを制度要件に当てはめる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>会社員が死亡し、生計維持関係のある家族が埋葬したケースを制度要件に当てはめる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>誰が埋葬を行ったか、被保険者本人か被扶養者かで扱いを整理</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>埋葬に関する給付</strong>を一言で説明すると？<br><span class=\"answer\">健康保険では被保険者等が死亡した際、条件に応じて埋葬料・埋葬費などの給付があります。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">会社員が死亡し、生計維持関係のある家族が埋葬したケースを制度要件に当てはめる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">誰が埋葬を行ったか、被保険者本人か被扶養者かで扱いを整理</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>埋葬に関する給付</dd>\n<dt>② 一番重要なのは？</dt><dd>健康保険では被保険者等が死亡した際、条件に応じて埋葬料・埋葬費などの給付があります。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>会社員が死亡し、生計維持関係のある家族が埋葬したケースを制度要件に当てはめる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>誰が埋葬を行ったか、被保険者本人か被扶養者かで扱いを整理</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>埋葬に関する給付＝健康保険では被保険者等が死亡した際、条件に応じて埋葬料・埋葬費などの給付があります。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>埋葬に関する給付</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "任意継続被保険者", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>任意継続被保険者</strong>は、一言でいうと――」</p>\n<p><strong>退職後も一定要件を満たせば、退職前の健康保険に原則最長2年間加入できる制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>退職後も一定要件を満たせば、退職前の健康保険に原則最長2年間加入できる制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>任意継続被保険者</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>国民健康保険との比較では保険料・扶養家族の扱いなどを見る</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>退職前に継続して被保険者だった人が期限内に申請し、退職後も同じ健康保険を継続する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>任意継続被保険者</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>退職前に継続して被保険者だった人が期限内に申請し、退職後も同じ健康保険を継続する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>退職前に継続して被保険者だった人が期限内に申請し、退職後も同じ健康保険を継続する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>国民健康保険との比較では保険料・扶養家族の扱いなどを見る</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>任意継続被保険者</strong>を一言で説明すると？<br><span class=\"answer\">退職後も一定要件を満たせば、退職前の健康保険に原則最長2年間加入できる制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">退職前に継続して被保険者だった人が期限内に申請し、退職後も同じ健康保険を継続する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">国民健康保険との比較では保険料・扶養家族の扱いなどを見る</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>任意継続被保険者</dd>\n<dt>② 一番重要なのは？</dt><dd>退職後も一定要件を満たせば、退職前の健康保険に原則最長2年間加入できる制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>退職前に継続して被保険者だった人が期限内に申請し、退職後も同じ健康保険を継続する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>国民健康保険との比較では保険料・扶養家族の扱いなどを見る</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>任意継続被保険者＝退職後も一定要件を満たせば、退職前の健康保険に原則最長2年間加入できる制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>任意継続被保険者</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "国民健康保険", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>国民健康保険</strong>は、一言でいうと――」</p>\n<p><strong>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>国民健康保険</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>会社員の健康保険のような『被扶養者』という考え方と同じではない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>退職後、任意継続を選ばず市区町村の国保に加入し、世帯の条件等に応じた保険料を負担</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>国民健康保険</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>退職後、任意継続を選ばず市区町村の国保に加入し、世帯の条件等に応じた保険料を負担</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>退職後、任意継続を選ばず市区町村の国保に加入し、世帯の条件等に応じた保険料を負担</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>会社員の健康保険のような『被扶養者』という考え方と同じではない</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>国民健康保険</strong>を一言で説明すると？<br><span class=\"answer\">他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">退職後、任意継続を選ばず市区町村の国保に加入し、世帯の条件等に応じた保険料を負担</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">会社員の健康保険のような『被扶養者』という考え方と同じではない</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>国民健康保険</dd>\n<dt>② 一番重要なのは？</dt><dd>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>退職後、任意継続を選ばず市区町村の国保に加入し、世帯の条件等に応じた保険料を負担</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>会社員の健康保険のような『被扶養者』という考え方と同じではない</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>国民健康保険＝他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>国民健康保険</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>後期高齢者医療制度</strong>は、一言でいうと――」</p>\n<p><strong>原則75歳以上などを対象とする独立した公的医療保険制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>原則75歳以上などを対象とする独立した公的医療保険制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>後期高齢者医療制度</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤り</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>74歳まで国保だった人が75歳になり、後期高齢者医療制度へ移る</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>後期高齢者医療制度</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>74歳まで国保だった人が75歳になり、後期高齢者医療制度へ移る</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>74歳まで国保だった人が75歳になり、後期高齢者医療制度へ移る</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤り</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>後期高齢者医療制度</strong>を一言で説明すると？<br><span class=\"answer\">原則75歳以上などを対象とする独立した公的医療保険制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">74歳まで国保だった人が75歳になり、後期高齢者医療制度へ移る</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">75歳になっても国民健康保険にそのまま残る、という理解は誤り</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>後期高齢者医療制度</dd>\n<dt>② 一番重要なのは？</dt><dd>原則75歳以上などを対象とする独立した公的医療保険制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>74歳まで国保だった人が75歳になり、後期高齢者医療制度へ移る</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>75歳になっても国民健康保険にそのまま残る、という理解は誤り</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>後期高齢者医療制度＝原則75歳以上などを対象とする独立した公的医療保険制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>後期高齢者医療制度</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "公的介護保険", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>公的介護保険</strong>は、一言でいうと――」</p>\n<p><strong>介護が必要と認定された人が、自己負担をしながら介護サービスを利用する社会保険制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>介護が必要と認定された人が、自己負担をしながら介護サービスを利用する社会保険制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>公的介護保険</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の扱いも違う</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>65歳以上の人が要介護認定を受け、訪問介護等を利用する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>公的介護保険</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>65歳以上の人が要介護認定を受け、訪問介護等を利用する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>65歳以上の人が要介護認定を受け、訪問介護等を利用する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の扱いも違う</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>公的介護保険</strong>を一言で説明すると？<br><span class=\"answer\">介護が必要と認定された人が、自己負担をしながら介護サービスを利用する社会保険制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">65歳以上の人が要介護認定を受け、訪問介護等を利用する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の扱いも違う</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>公的介護保険</dd>\n<dt>② 一番重要なのは？</dt><dd>介護が必要と認定された人が、自己負担をしながら介護サービスを利用する社会保険制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>65歳以上の人が要介護認定を受け、訪問介護等を利用する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の扱いも違う</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>公的介護保険＝介護が必要と認定された人が、自己負担をしながら介護サービスを利用する社会保険制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>公的介護保険</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "労災保険", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>労災保険</strong>は、一言でいうと――」</p>\n<p><strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>労災保険</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>仕事・通勤が原因なら健康保険ではなく労災保険の対象をまず考える</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>通勤途中の合理的な経路で事故に遭った場合、通勤災害に該当するか確認する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>労災保険</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>通勤途中の合理的な経路で事故に遭った場合、通勤災害に該当するか確認する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>通勤途中の合理的な経路で事故に遭った場合、通勤災害に該当するか確認する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>仕事・通勤が原因なら健康保険ではなく労災保険の対象をまず考える</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>労災保険</strong>を一言で説明すると？<br><span class=\"answer\">業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">通勤途中の合理的な経路で事故に遭った場合、通勤災害に該当するか確認する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">仕事・通勤が原因なら健康保険ではなく労災保険の対象をまず考える</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>労災保険</dd>\n<dt>② 一番重要なのは？</dt><dd>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>通勤途中の合理的な経路で事故に遭った場合、通勤災害に該当するか確認する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>仕事・通勤が原因なら健康保険ではなく労災保険の対象をまず考える</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>労災保険＝業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>労災保険</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "雇用保険", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>雇用保険</strong>は、一言でいうと――」</p>\n<p><strong>失業・休業等に備え、生活と雇用の安定、再就職を支える制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>失業・休業等に備え、生活と雇用の安定、再就職を支える制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>雇用保険</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>基本手当だけでなく、育児・介護・教育訓練など複数の給付がある</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>離職した人が求職活動をしながら要件を満たして基本手当を受ける</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>雇用保険</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>離職した人が求職活動をしながら要件を満たして基本手当を受ける</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>離職した人が求職活動をしながら要件を満たして基本手当を受ける</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>基本手当だけでなく、育児・介護・教育訓練など複数の給付がある</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>雇用保険</strong>を一言で説明すると？<br><span class=\"answer\">失業・休業等に備え、生活と雇用の安定、再就職を支える制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">離職した人が求職活動をしながら要件を満たして基本手当を受ける</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">基本手当だけでなく、育児・介護・教育訓練など複数の給付がある</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>雇用保険</dd>\n<dt>② 一番重要なのは？</dt><dd>失業・休業等に備え、生活と雇用の安定、再就職を支える制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>離職した人が求職活動をしながら要件を満たして基本手当を受ける</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>基本手当だけでなく、育児・介護・教育訓練など複数の給付がある</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>雇用保険＝失業・休業等に備え、生活と雇用の安定、再就職を支える制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>雇用保険</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>就職促進給付と教育訓練給付</strong>は、一言でいうと――」</p>\n<p><strong>就職促進給付は早期再就職等を後押しし、教育訓練給付は指定講座の受講費用を支援します。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>就職促進給付は早期再就職等を後押しし、教育訓練給付は指定講座の受講費用を支援します。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>就職促進給付と教育訓練給付</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『仕事に就く支援』と『学び直す支援』を分ける</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>基本手当を残して早期就職するケースと、対象講座を受講するケースを別々に判断</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>就職促進給付と教育訓練給付</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>基本手当を残して早期就職するケースと、対象講座を受講するケースを別々に判断</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>基本手当を残して早期就職するケースと、対象講座を受講するケースを別々に判断</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>『仕事に就く支援』と『学び直す支援』を分ける</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>就職促進給付と教育訓練給付</strong>を一言で説明すると？<br><span class=\"answer\">就職促進給付は早期再就職等を後押しし、教育訓練給付は指定講座の受講費用を支援します。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">基本手当を残して早期就職するケースと、対象講座を受講するケースを別々に判断</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">『仕事に就く支援』と『学び直す支援』を分ける</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>就職促進給付と教育訓練給付</dd>\n<dt>② 一番重要なのは？</dt><dd>就職促進給付は早期再就職等を後押しし、教育訓練給付は指定講座の受講費用を支援します。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>基本手当を残して早期就職するケースと、対象講座を受講するケースを別々に判断</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>『仕事に就く支援』と『学び直す支援』を分ける</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>就職促進給付と教育訓練給付＝就職促進給付は早期再就職等を後押しし、教育訓練給付は指定講座の受講費用を支援します。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>就職促進給付と教育訓練給付</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>育児休業給付と雇用継続給付</strong>は、一言でいうと――」</p>\n<p><strong>雇用保険には、育児休業中の所得を支える給付や、雇用を継続するための給付があります。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>雇用保険には、育児休業中の所得を支える給付や、雇用を継続するための給付があります。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>育児休業給付と雇用継続給付</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>名称が似ていても、休業理由・年齢・賃金低下など要件が異なる</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>育児のため一定期間仕事を休み賃金が減る人について、育児休業給付の要件を確認</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>育児休業給付と雇用継続給付</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>育児のため一定期間仕事を休み賃金が減る人について、育児休業給付の要件を確認</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>育児のため一定期間仕事を休み賃金が減る人について、育児休業給付の要件を確認</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>名称が似ていても、休業理由・年齢・賃金低下など要件が異なる</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>育児休業給付と雇用継続給付</strong>を一言で説明すると？<br><span class=\"answer\">雇用保険には、育児休業中の所得を支える給付や、雇用を継続するための給付があります。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">育児のため一定期間仕事を休み賃金が減る人について、育児休業給付の要件を確認</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">名称が似ていても、休業理由・
