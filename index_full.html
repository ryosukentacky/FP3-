年齢・賃金低下など要件が異なる</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>育児休業給付と雇用継続給付</dd>\n<dt>② 一番重要なのは？</dt><dd>雇用保険には、育児休業中の所得を支える給付や、雇用を継続するための給付があります。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>育児のため一定期間仕事を休み賃金が減る人について、育児休業給付の要件を確認</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>名称が似ていても、休業理由・年齢・賃金低下など要件が異なる</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>育児休業給付と雇用継続給付＝雇用保険には、育児休業中の所得を支える給付や、雇用を継続するための給付があります。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>育児休業給付と雇用継続給付</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>高年齢雇用継続給付と介護休業給付</strong>は、一言でいうと――」</p>\n<p><strong>高年齢雇用継続給付は高齢期の就業継続を、介護休業給付は家族介護のための休業を支えます。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>高年齢雇用継続給付は高齢期の就業継続を、介護休業給付は家族介護のための休業を支えます。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>高年齢雇用継続給付と介護休業給付</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>本人が高齢になって賃金が下がる話か、家族介護で休む話かを分ける</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>60歳以降も働く人と、家族介護のため休業する人を同じ給付で処理しない</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>高年齢雇用継続給付と介護休業給付</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>60歳以降も働く人と、家族介護のため休業する人を同じ給付で処理しない</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>60歳以降も働く人と、家族介護のため休業する人を同じ給付で処理しない</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>本人が高齢になって賃金が下がる話か、家族介護で休む話かを分ける</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>高年齢雇用継続給付と介護休業給付</strong>を一言で説明すると？<br><span class=\"answer\">高年齢雇用継続給付は高齢期の就業継続を、介護休業給付は家族介護のための休業を支えます。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">60歳以降も働く人と、家族介護のため休業する人を同じ給付で処理しない</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">本人が高齢になって賃金が下がる話か、家族介護で休む話かを分ける</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>高年齢雇用継続給付と介護休業給付</dd>\n<dt>② 一番重要なのは？</dt><dd>高年齢雇用継続給付は高齢期の就業継続を、介護休業給付は家族介護のための休業を支えます。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>60歳以降も働く人と、家族介護のため休業する人を同じ給付で処理しない</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>本人が高齢になって賃金が下がる話か、家族介護で休む話かを分ける</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>高年齢雇用継続給付と介護休業給付＝高年齢雇用継続給付は高齢期の就業継続を、介護休業給付は家族介護のための休業を支えます。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>高年齢雇用継続給付と介護休業給付</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "公的年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>公的年金</strong>は、一言でいうと――」</p>\n<p><strong>日本の公的年金は国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族を保障します。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>日本の公的年金は国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族を保障します。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>公的年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『老後のお金だけ』ではなく、障害・死亡リスクへの給付もある</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>会社員なら国民年金の基礎部分に厚生年金が上乗せされる二階建てをイメージ</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>公的年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>会社員なら国民年金の基礎部分に厚生年金が上乗せされる二階建てをイメージ</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>会社員なら国民年金の基礎部分に厚生年金が上乗せされる二階建てをイメージ</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>『老後のお金だけ』ではなく、障害・死亡リスクへの給付もある</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>公的年金</strong>を一言で説明すると？<br><span class=\"answer\">日本の公的年金は国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族を保障します。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">会社員なら国民年金の基礎部分に厚生年金が上乗せされる二階建てをイメージ</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">『老後のお金だけ』ではなく、障害・死亡リスクへの給付もある</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>公的年金</dd>\n<dt>② 一番重要なのは？</dt><dd>日本の公的年金は国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族を保障します。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>会社員なら国民年金の基礎部分に厚生年金が上乗せされる二階建てをイメージ</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>『老後のお金だけ』ではなく、障害・死亡リスクへの給付もある</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>公的年金＝日本の公的年金は国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族を保障します。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>公的年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "任意加入被保険者", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>任意加入被保険者</strong>は、一言でいうと――」</p>\n<p><strong>国民年金の強制加入対象外でも、一定条件を満たす人が申出により加入できる仕組みです。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>国民年金の強制加入対象外でも、一定条件を満たす人が申出により加入できる仕組みです。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>任意加入被保険者</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>強制加入ではなく本人の申出。加入目的として受給資格や年金額の確保を考える</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>60歳時点で納付期間が不足する人が、条件を満たして任意加入を検討する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>任意加入被保険者</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>60歳時点で納付期間が不足する人が、条件を満たして任意加入を検討する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>60歳時点で納付期間が不足する人が、条件を満たして任意加入を検討する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>強制加入ではなく本人の申出。加入目的として受給資格や年金額の確保を考える</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>任意加入被保険者</strong>を一言で説明すると？<br><span class=\"answer\">国民年金の強制加入対象外でも、一定条件を満たす人が申出により加入できる仕組みです。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">60歳時点で納付期間が不足する人が、条件を満たして任意加入を検討する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">強制加入ではなく本人の申出。加入目的として受給資格や年金額の確保を考える</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>任意加入被保険者</dd>\n<dt>② 一番重要なのは？</dt><dd>国民年金の強制加入対象外でも、一定条件を満たす人が申出により加入できる仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>60歳時点で納付期間が不足する人が、条件を満たして任意加入を検討する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>強制加入ではなく本人の申出。加入目的として受給資格や年金額の確保を考える</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>任意加入被保険者＝国民年金の強制加入対象外でも、一定条件を満たす人が申出により加入できる仕組みです。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>任意加入被保険者</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>国民年金保険料の免除・猶予制度</strong>は、一言でいうと――」</p>\n<p><strong>保険料納付が難しい人について、一定要件で免除や納付猶予を認める制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>保険料納付が難しい人について、一定要件で免除や納付猶予を認める制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>国民年金保険料の免除・猶予制度</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>単なる未納とは違い、受給資格期間などへの扱いが異なる</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>所得低下で払えない人が放置せず申請し、免除・猶予の審査を受ける</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>国民年金保険料の免除・猶予制度</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>所得低下で払えない人が放置せず申請し、免除・猶予の審査を受ける</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>所得低下で払えない人が放置せず申請し、免除・猶予の審査を受ける</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>単なる未納とは違い、受給資格期間などへの扱いが異なる</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>国民年金保険料の免除・猶予制度</strong>を一言で説明すると？<br><span class=\"answer\">保険料納付が難しい人について、一定要件で免除や納付猶予を認める制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">所得低下で払えない人が放置せず申請し、免除・猶予の審査を受ける</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">単なる未納とは違い、受給資格期間などへの扱いが異なる</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>国民年金保険料の免除・猶予制度</dd>\n<dt>② 一番重要なのは？</dt><dd>保険料納付が難しい人について、一定要件で免除や納付猶予を認める制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>所得低下で払えない人が放置せず申請し、免除・猶予の審査を受ける</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>単なる未納とは違い、受給資格期間などへの扱いが異なる</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>国民年金保険料の免除・猶予制度＝保険料納付が難しい人について、一定要件で免除や納付猶予を認める制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>国民年金保険料の免除・猶予制度</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "老齢基礎年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>老齢基礎年金</strong>は、一言でいうと――」</p>\n<p><strong>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>老齢基礎年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『受給できるか』の資格期間と『いくらか』の納付済期間等を分けて考える</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>20歳から60歳までの加入・納付状況をもとに65歳からの年金を考える</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>老齢基礎年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>20歳から60歳までの加入・納付状況をもとに65歳からの年金を考える</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>20歳から60歳までの加入・納付状況をもとに65歳からの年金を考える</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>『受給できるか』の資格期間と『いくらか』の納付済期間等を分けて考える</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>老齢基礎年金</strong>を一言で説明すると？<br><span class=\"answer\">国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">20歳から60歳までの加入・納付状況をもとに65歳からの年金を考える</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">『受給できるか』の資格期間と『いくらか』の納付済期間等を分けて考える</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>老齢基礎年金</dd>\n<dt>② 一番重要なのは？</dt><dd>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>20歳から60歳までの加入・納付状況をもとに65歳からの年金を考える</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>『受給できるか』の資格期間と『いくらか』の納付済期間等を分けて考える</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>老齢基礎年金＝国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>老齢基礎年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>繰上げ支給と繰下げ支給</strong>は、一言でいうと――」</p>\n<p><strong>老齢年金を基準より早く受けると減額、遅く受けると増額され、その率は原則生涯続きます。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>老齢年金を基準より早く受けると減額、遅く受けると増額され、その率は原則生涯続きます。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>繰上げ支給と繰下げ支給</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>一時的な前借り・後払いではなく、受給開始時期に応じて年金額自体が調整される</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>65歳より早く受給開始する人と、70歳まで待つ人では生涯の年金月額が変わる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>繰上げ支給と繰下げ支給</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>65歳より早く受給開始する人と、70歳まで待つ人では生涯の年金月額が変わる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>65歳より早く受給開始する人と、70歳まで待つ人では生涯の年金月額が変わる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>一時的な前借り・後払いではなく、受給開始時期に応じて年金額自体が調整される</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>繰上げ支給と繰下げ支給</strong>を一言で説明すると？<br><span class=\"answer\">老齢年金を基準より早く受けると減額、遅く受けると増額され、その率は原則生涯続きます。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">65歳より早く受給開始する人と、70歳まで待つ人では生涯の年金月額が変わる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">一時的な前借り・後払いではなく、受給開始時期に応じて年金額自体が調整される</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>繰上げ支給と繰下げ支給</dd>\n<dt>② 一番重要なのは？</dt><dd>老齢年金を基準より早く受けると減額、遅く受けると増額され、その率は原則生涯続きます。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>65歳より早く受給開始する人と、70歳まで待つ人では生涯の年金月額が変わる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>一時的な前借り・後払いではなく、受給開始時期に応じて年金額自体が調整される</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>繰上げ支給と繰下げ支給＝老齢年金を基準より早く受けると減額、遅く受けると増額され、その率は原則生涯続きます。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>繰上げ支給と繰下げ支給</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "付加年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>付加年金</strong>は、一言でいうと――」</p>\n<p><strong>国民年金第1号被保険者等が付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>国民年金第1号被保険者等が付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>付加年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>国民年金基金など、同時加入に制約がある制度との関係を確認</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>毎月の付加保険料を納めた月数に応じ、所定の計算で付加年金額が決まる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>付加年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>毎月の付加保険料を納めた月数に応じ、所定の計算で付加年金額が決まる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>毎月の付加保険料を納めた月数に応じ、所定の計算で付加年金額が決まる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>国民年金基金など、同時加入に制約がある制度との関係を確認</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>付加年金</strong>を一言で説明すると？<br><span class=\"answer\">国民年金第1号被保険者等が付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">毎月の付加保険料を納めた月数に応じ、所定の計算で付加年金額が決まる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">国民年金基金など、同時加入に制約がある制度との関係を確認</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>付加年金</dd>\n<dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者等が付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>毎月の付加保険料を納めた月数に応じ、所定の計算で付加年金額が決まる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>国民年金基金など、同時加入に制約がある制度との関係を確認</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>付加年金＝国民年金第1号被保険者等が付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>付加年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "老齢厚生年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>老齢厚生年金</strong>は、一言でいうと――」</p>\n<p><strong>厚生年金の加入期間・報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>厚生年金の加入期間・報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>老齢厚生年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>老齢基礎年金は全国民共通の基礎、老齢厚生年金は会社員等の報酬比例部分を持つ</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>会社員として長く働き報酬が高いほど、報酬比例部分に反映される</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>老齢厚生年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>会社員として長く働き報酬が高いほど、報酬比例部分に反映される</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>会社員として長く働き報酬が高いほど、報酬比例部分に反映される</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>老齢基礎年金は全国民共通の基礎、老齢厚生年金は会社員等の報酬比例部分を持つ</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>老齢厚生年金</strong>を一言で説明すると？<br><span class=\"answer\">厚生年金の加入期間・報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">会社員として長く働き報酬が高いほど、報酬比例部分に反映される</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">老齢基礎年金は全国民共通の基礎、老齢厚生年金は会社員等の報酬比例部分を持つ</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>老齢厚生年金</dd>\n<dt>② 一番重要なのは？</dt><dd>厚生年金の加入期間・報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>会社員として長く働き報酬が高いほど、報酬比例部分に反映される</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>老齢基礎年金は全国民共通の基礎、老齢厚生年金は会社員等の報酬比例部分を持つ</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>老齢厚生年金＝厚生年金の加入期間・報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>老齢厚生年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "経過的加算", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>経過的加算</strong>は、一言でいうと――」</p>\n<p><strong>年金制度の仕組み上生じる老齢厚生年金と基礎年金の差を調整するための加算です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>年金制度の仕組み上生じる老齢厚生年金と基礎年金の差を調整するための加算です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>経過的加算</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>配偶者を理由に付く加給年金・振替加算とは目的が違う</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>制度移行や加入期間の関係で生じる差を、老齢厚生年金側で調整する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>経過的加算</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>制度移行や加入期間の関係で生じる差を、老齢厚生年金側で調整する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>制度移行や加入期間の関係で生じる差を、老齢厚生年金側で調整する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>配偶者を理由に付く加給年金・振替加算とは目的が違う</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>経過的加算</strong>を一言で説明すると？<br><span class=\"answer\">年金制度の仕組み上生じる老齢厚生年金と基礎年金の差を調整するための加算です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">制度移行や加入期間の関係で生じる差を、老齢厚生年金側で調整する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">配偶者を理由に付く加給年金・振替加算とは目的が違う</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>経過的加算</dd>\n<dt>② 一番重要なのは？</dt><dd>年金制度の仕組み上生じる老齢厚生年金と基礎年金の差を調整するための加算です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>制度移行や加入期間の関係で生じる差を、老齢厚生年金側で調整する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>配偶者を理由に付く加給年金・振替加算とは目的が違う</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>経過的加算＝年金制度の仕組み上生じる老齢厚生年金と基礎年金の差を調整するための加算です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>経過的加算</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "配偶者加給年金と振替加算", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>配偶者加給年金と振替加算</strong>は、一言でいうと――」</p>\n<p><strong>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>配偶者加給年金と振替加算</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『誰の年金に付いているか』を時系列で追う</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>夫の老齢厚生年金に加給年金が付き、妻が一定年齢に達した後は条件により妻側の振替加算を考える</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>配偶者加給年金と振替加算</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>夫の老齢厚生年金に加給年金が付き、妻が一定年齢に達した後は条件により妻側の振替加算を考える</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>夫の老齢厚生年金に加給年金が付き、妻が一定年齢に達した後は条件により妻側の振替加算を考える</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>『誰の年金に付いているか』を時系列で追う</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>配偶者加給年金と振替加算</strong>を一言で説明すると？<br><span class=\"answer\">加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">夫の老齢厚生年金に加給年金が付き、妻が一定年齢に達した後は条件により妻側の振替加算を考える</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">『誰の年金に付いているか』を時系列で追う</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>配偶者加給年金と振替加算</dd>\n<dt>② 一番重要なのは？</dt><dd>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>夫の老齢厚生年金に加給年金が付き、妻が一定年齢に達した後は条件により妻側の振替加算を考える</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>『誰の年金に付いているか』を時系列で追う</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>配偶者加給年金と振替加算＝加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>配偶者加給年金と振替加算</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "在職老齢年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>在職老齢年金</strong>は、一言でいうと――」</p>\n<p><strong>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて支給額を調整する仕組みです。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて支給額を調整する仕組みです。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>在職老齢年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>老齢基礎年金まで同じように停止される、と考えない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>年金を受けながら高い賃金で会社員として働く場合、老齢厚生年金の支給停止額を判定する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>在職老齢年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>年金を受けながら高い賃金で会社員として働く場合、老齢厚生年金の支給停止額を判定する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>年金を受けながら高い賃金で会社員として働く場合、老齢厚生年金の支給停止額を判定する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>老齢基礎年金まで同じように停止される、と考えない</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>在職老齢年金</strong>を一言で説明すると？<br><span class=\"answer\">働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて支給額を調整する仕組みです。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">年金を受けながら高い賃金で会社員として働く場合、老齢厚生年金の支給停止額を判定する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">老齢基礎年金まで同じように停止される、と考えない</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>在職老齢年金</dd>\n<dt>② 一番重要なのは？</dt><dd>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて支給額を調整する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>年金を受けながら高い賃金で会社員として働く場合、老齢厚生年金の支給停止額を判定する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>老齢基礎年金まで同じように停止される、と考えない</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>在職老齢年金＝働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて支給額を調整する仕組みです。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>在職老齢年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "障害基礎年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>障害基礎年金</strong>は、一言でいうと――」</p>\n<p><strong>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>障害基礎年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>障害者手帳の等級と年金の障害等級は同じ制度ではない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>病気の初診日、納付要件、障害認定日の状態を順に確認する</strong>とします。」</p  何の話？</dt><dd>障害厚生年金</dd>\n<dt>② 一番重要なのは？</dt><dd>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>会社員として厚生年金加入中に初診日がある病気で障害状態になったケース</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>障害基礎年金より対象等級・給付構造が広い部分がある</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>障害厚生年金＝厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>障害厚生年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "遺族基礎年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>遺族基礎年金</strong>は、一言でいうと――」</p>\n<p><strong>国民年金の遺族給付で、主に子のある配偶者または子が対象になります。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>国民年金の遺族給付で、主に子のある配偶者または子が対象になります。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>遺族基礎年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『配偶者なら必ず受給』ではなく、子の要件が重要</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>被保険者が死亡し、一定年齢までの子を養育する配偶者が残ったケース</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>遺族基礎年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>被保険者が死亡し、一定年齢までの子を養育する配偶者が残ったケース</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p> の一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>中高齢寡婦加算</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "公的年金等控除", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>公的年金等控除</strong>は、一言でいうと――」</p>\n<p><strong>公的年金等の収入から差し引き、公的年金等に係る雑所得を計算するための所得計算上の控除です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>公的年金等の収入から差し引き、公的年金等に係る雑所得を計算するための所得計算上の控除です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>公的年金等控除</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>社会保険料控除や税額控除とは別物</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>公的年金収入から公的年金等控除額を差し引き、雑所得を計算する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>公的年金等控除</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>公的年金収入から公的年金等控除額を差し引き、雑所得を計算する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>公的年金収入から公的年金等控除額を差し引き、雑所得を計算する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>社会保険料控除や税額控除とは別物</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>公的年金等控除</strong>を一言で説明すると？<br><span class=\"answer\">公的年金等の収入から差し引き、公的年金等に係る雑所得を計算するための所得計算上の控除です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">公的年金収入から公的年金等控除額を差し引き、雑所得を計算する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">社会保険料控除や税額控除とは別物</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>公的年金等控除</dd>\n<dt>② 一番重要なのは？</dt><dd>公的年金等の収入から差し引き、公的年金等に係る雑所得を計算するための所得計算上の控除です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>公的年金収入から公的年金等控除額を差し引き、雑所得を計算する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>社会保険料控除や税額控除とは別物</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>公的年金等控除＝公的年金等の収入から差し引き、公的年金等に係る雑所得を計算するための所得計算上の控除です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>公的年金等控除</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "確定拠出年金", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>確定拠出年金</strong>は、一言でいうと――」</p>\n<p><strong>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>確定拠出年金</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>『確定』するのは基本的に拠出額側で、将来の受取額ではない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>iDeCoで毎月2万円を拠出し、自分で選んだ商品を運用する</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>確定拠出年金</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>iDeCoで毎月2万円を拠出し、自分で選んだ商品を運用する</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>iDeCoで毎月2万円を拠出し、自分で選んだ商品を運用する</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>『確定』するのは基本的に拠出額側で、将来の受取額ではない</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>確定拠出年金</strong>を一言で説明すると？<br><span class=\"answer\">拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">iDeCoで毎月2万円を拠出し、自分で選んだ商品を運用する</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">『確定』するのは基本的に拠出額側で、将来の受取額ではない</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>確定拠出年金</dd>\n<dt>② 一番重要なのは？</dt><dd>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>iDeCoで毎月2万円を拠出し、自分で選んだ商品を運用する</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>『確定』するのは基本的に拠出額側で、将来の受取額ではない</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>確定拠出年金＝拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>確定拠出年金</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "小規模企業共済等掛金控除", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>小規模企業共済等掛金控除</strong>は、一言でいうと――」</p>\n<p> 自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>小規模企業共済等掛金控除</dd>\n<dt>② 一番重要なのは？</dt><dd>対象となる小規模企業共済や確定拠出年金等の掛金を所得から差し引ける所得控除です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>iDeCo掛金を年間24万円払った場合、対象額を所得控除として扱う</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>税額から直接引く税額控除ではなく、課税所得を減らす所得控除</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>小規模企業共済等掛金控除＝対象となる小規模企業共済や確定拠出年金等の掛金を所得から差し引ける所得控除です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>小規模企業共済等掛金控除</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "中退共（中小企業退職金共済制度）", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>中退共（中小企業退職金共済制度）</strong>は、一言でいうと――」</p>\n<p><strong>中小企業の事業主が従業員のために掛金を負担し、機構が退職金を従業員へ支払う国の退職金制度です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>中小企業の事業主が従業員のために掛金を負担し、機構が退職金を従業員へ支払う国の退職金制度です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>中退共（中小企業退職金共済制度）</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>小規模企業共済は主に経営者・個人事業主等向け。中退共は従業員の退職金</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>会社が従業員ごとに掛金を納付し、退職時には機構から従業員へ退職金が支払われる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>中退共（中小企業退職金共済制度）</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>会社が従業員ごとに掛金を納付し、退職時には機構から従業員へ退職金が支払われる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>会社が従業員ごとに掛金を納付し、退職時には機構から従業員へ退職金が支払われる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>小規模企業共済は主に経営者・個人事業主等向け。中退共は従業員の退職金</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>中退共（中小企業退職金共済制度）</strong>を一言で説明すると？<br><span class=\"answer\">中小企業の事業主が従業員のために掛金を負担し、機構が退職金を従業員へ支払う国の退職金制度です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">会社が従業員ごとに掛金を納付し、退職時には機構から従業員へ退職金が支払われる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">小規模企業共済は主に経営者・個人事業主等向け。中退共は従業員の退職金</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>中退共（中小企業退職金共済制度）</dd>\n<dt>② 一番重要なのは？</dt><dd>中小企業の事業主が従業員のために掛金を負担し、機構が退職金を従業員へ支払う国の退職金制度です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>会社が従業員ごとに掛金を納付し、退職時には機構から従業員へ退職金が支払われる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>小規模企業共済は主に経営者・個人事業主等向け。中退共は従業員の退職金</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>中退共（中小企業退職金共済制度）＝中小企業の事業主が従業員のために掛金を負担し、機構が退職金を従業員へ支払う国の退職金制度です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>中退共（中小企業退職金共済制度）</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "分割払いとリボ払い", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>分割払いとリボ払い</strong>は、一言でいうと――」</p>\n<p><strong>分割払いは支払回数を決め、リボ払いは毎月の支払額を一定程度に抑えながら残高を返す方式です。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>分割払いは支払回数を決め、リボ払いは毎月の支払額を一定程度に抑えながら残高を返す方式です。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>分割払いとリボ払い</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>リボ払いは利用を重ねると残高が見えにくく、返済期間と手数料が膨らみやすい</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>10万円を10回払いなら終わりが見えるが、リボで追加利用を続けると完済時期が延びる</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>分割払いとリボ払い</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>10万円を10回払いなら終わりが見えるが、リボで追加利用を続けると完済時期が延びる</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>10万円を10回払いなら終わりが見えるが、リボで追加利用を続けると完済時期が延びる</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>リボ払いは利用を重ねると残高が見えにくく、返済期間と手数料が膨らみやすい</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>分割払いとリボ払い</strong>を一言で説明すると？<br><span class=\"answer\">分割払いは支払回数を決め、リボ払いは毎月の支払額を一定程度に抑えながら残高を返す方式です。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">10万円を10回払いなら終わりが見えるが、リボで追加利用を続けると完済時期が延びる</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">リボ払いは利用を重ねると残高が見えにくく、返済期間と手数料が膨らみやすい</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>分割払いとリボ払い</dd>\n<dt>② 一番重要なのは？</dt><dd>分割払いは支払回数を決め、リボ払いは毎月の支払額を一定程度に抑えながら残高を返す方式です。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>10万円を10回払いなら終わりが見えるが、リボで追加利用を続けると完済時期が延びる</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>リボ払いは利用を重ねると残高が見えにくく、返済期間と手数料が膨らみやすい</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>分割払いとリボ払い＝分割払いは支払回数を決め、リボ払いは毎月の支払額を一定程度に抑えながら残高を返す方式です。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>分割払いとリボ払い</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}, {"title": "キャッシングと総量規制", "content": {"A": "\n<p>「先輩、いきなり細かい数字から覚えようとしてませんか？」</p>\n<p>「……もう。まず全体です。<strong>キャッシングと総量規制</strong>は、一言でいうと――」</p>\n<p><strong>キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。</strong></p>\n<p>「はい。まずこれです。用語名だけじゃなくて、<strong>何のためにあるのか</strong>まで一緒に持ってください。」</p>\n<p>「重要なのは三つ。一つ目は目的。二つ目は誰・どんな場面が対象か。三つ目は似た制度との違いです。」</p>\n<p>「試験で何を理解すべきか？　そうですね。<strong>キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。</strong>――これを自分の言葉で説明できれば、まず大丈夫です。」</p>", "B": "\n<p>「はい。じゃあ今度は『なぜそうなるの？』です。ここを飛ばすと、選択肢を少し変えられただけで迷いますよ。」</p>\n<p>「まず問題文の人物やお金の状況を確認します。次に、その人が<strong>キャッシングと総量規制</strong>の対象になるかを見る。対象なら条件を確認して、最後に給付・負担・計算結果を判断します。」</p>\n<div class=\"flow\"><span>状況を確認</span><b>↓</b><span>対象・目的を確認</span><b>↓</b><span>条件を当てはめる</span><b>↓</b><span>効果・金額を判断</span></div>\n<p>「ほら。制度名を単独で暗記するより、流れで持った方が崩れにくいでしょう？」</p>\n<p>「え？　似た制度が出たら？　そこです。<strong>銀行からの借入れ等は貸金業法の総量規制の対象外。『すべての借金が年収1/3』ではない</strong>。ここを比較してください。」</p>\n<p>「先輩、名前が似ているから同じ、はダメですよ。誰が対象か、誰がお金を払うか、誰が受け取るか、いつ使うか。この四つを追えばかなり整理できます。」</p>", "C": "\n<p>「先輩、今度は文字から離れます。え？　必要です。いいから一回想像してください。」</p>\n<p>「<strong>年収300万円なら、総量規制対象の貸金業者からの借入れは原則合計100万円が目安上限</strong>とします。」</p>\n<p>「このとき、最初に『制度名は何だっけ』って考えるんじゃないんです。まず、この人は何に困っているのか。次に、誰が対象なのか。そして、お金がどちら向きに動くのかを見ます。」</p>\n<p>「そうすると、<strong>キャッシングと総量規制</strong>がただの暗記語じゃなくて、『この場面で使う仕組み』になります。」</p>\n<p>「つまり、さっきの難しい話を身近な相談にすると、<strong>年収300万円なら、総量規制対象の貸金業者からの借入れは原則合計100万円が目安上限</strong>ということなんです。」</p>", "D": "\n<p>「じゃあ先輩、最後に具体例で固定します。」</p>\n<p><strong>年収300万円なら、総量規制対象の貸金業者からの借入れは原則合計100万円が目安上限</strong>。</p>\n<p>「この場合、まず何を確認します？　……そうです。対象者と目的です。そのあと条件。数字があるなら最後に計算です。」</p>\n<p>「ここで大事なのは、数字を見た瞬間に計算を始めないこと。制度を間違えたら、計算が完璧でも答えは外れますから。」</p>\n<p>「そして注意点は、<strong>銀行からの借入れ等は貸金業法の総量規制の対象外。『すべての借金が年収1/3』ではない</strong>。問題文では、ここを入れ替えてくることがあります。」</p>\n<p>「はい。だから現実でも試験でも、<strong>状況→制度→条件→数字</strong>の順で考えるんです。」</p>", "Q": "\n<p>「先輩、本当に分かりました？」</p><p>「……その『分かりました』、ちょっと怪しいです。3問だけ確認します。」</p>\n<ol>\n<li><strong>キャッシングと総量規制</strong>を一言で説明すると？<br><span class=\"answer\">キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。</span></li>\n<li>どんな場面で使う？<br><span class=\"answer\">年収300万円なら、総量規制対象の貸金業者からの借入れは原則合計100万円が目安上限</span></li>\n<li>一番間違えやすいところは？<br><span class=\"answer\">銀行からの借入れ等は貸金業法の総量規制の対象外。『すべての借金が年収1/3』ではない</span></li>\n</ol>\n<p>「はい。この3つを自分の言葉で言えたら大丈夫です。定義の丸暗記より、ずっと強いですよ。」</p>", "R": "\n<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<dl>\n<dt>① 何の話？</dt><dd>キャッシングと総量規制</dd>\n<dt>② 一番重要なのは？</dt><dd>キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。</dd>\n<dt>③ なぜ？</dt><dd>問題文の状況に合う制度・計算を選ぶため。</dd>\n<dt>④ どういう流れ？</dt><dd>状況 → 対象・目的 → 条件 → 効果・金額。</dd>\n<dt>⑤ 具体例は？</dt><dd>年収300万円なら、総量規制対象の貸金業者からの借入れは原則合計100万円が目安上限</dd>\n<dt>⑥ 間違えやすいところは？</dt><dd>銀行からの借入れ等は貸金業法の総量規制の対象外。『すべての借金が年収1/3』ではない</dd>\n</dl>", "M": "\n<p>「一文で残しますよ。」</p>\n<div class=\"memory\"><strong>キャッシングと総量規制＝キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。</strong></div>\n<p>「全部丸暗記しなくてもいいです。でも、この一文を見たら今日の話が頭の中でつながるようにはしておいてください。」</p>\n<p>「……せっかくここまで一緒にやったんですから。」</p>\n<p>「はい、お疲れさまでした。今回は<strong>キャッシングと総量規制</strong>の『目的・対象・違い』が戻ってくれば大丈夫です。明日、一回くらいは思い出してくださいね？」</p>"}}];
const tabInfo=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];
let current=0,activeTab="A";const $=id=>document.getElementById(id),select=$("select"),search=$("search"),bar=$("termbar"),tabs=$("tabs"),content=$("content");
cards.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;select.appendChild(o)});
tabInfo.forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.className="tab";b.dataset.tab=k;b.textContent=l;b.addEventListener("click",()=>{activeTab=k;render()});tabs.appendChild(b)});
function buildBar(f=""){bar.innerHTML="";const q=f.trim().toLowerCase();cards.forEach((c,i)=>{if(q&&!c.title.toLowerCase().includes(q))return;const b=document.createElement("button");b.type="button";b.className="termbtn"+(i===current?" active":"");b.textContent=c.title;b.addEventListener("click",()=>{current=i;render()});bar.appendChild(b)})}
function render(){const c=cards[current];$("num").textContent=`${current+1} / ${cards.length}`;$("title").textContent=c.title;content.innerHTML=c.content[activeTab];[...tabs.children].forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));select.value=current;$("prev").disabled=current===0;$("next").disabled=current===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;buildBar(search.value)}
select.addEventListener("change",()=>{current=Number(select.value);render()});search.addEventListener("input",()=>buildBar(search.value));$("prev").addEventListener("click",()=>{if(current>0){current--;render()}});$("next").addEventListener("click",()=>{if(current<cards.length-1){current++;render()}});render();
</script></body></html>
