<script>
const cards=[
{term:`FPが守るべきこと`,sections:[[`A｜要点`,`FPは「お客さんの利益を第一に考え、知った秘密を守り、自分の能力を超える仕事を勝手にしない」ことが大切です。

① 顧客利益の優先
② 守秘義務
③ 説明義務（アカウンタビリティ）
④ 能力・業務範囲を超えない`],[`B｜詳しい解説`,`FPは顧客から相談を受け、自分の専門知識で対応できる範囲を判断します。対応できるなら適切に助言し、資格が必要な業務や自分の能力を超える内容なら専門家につなぎます。

顧客利益の優先では、自分の報酬が高い商品ではなく顧客に適した提案を優先します。守秘義務では、年収・資産・家族構成など業務上知った情報を正当な理由なく第三者へ漏らしません。説明義務では、提案の理由やメリット・注意点を顧客が理解できるよう説明します。

そしてFPは、税理士・弁護士・司法書士などの資格者に認められた独占業務まで自由に行えるわけではありません。一般的な情報提供と個別具体的な専門業務を区別します。`],[`C｜イメージ理解`,`FPは総合病院の案内役のようなものです。相談内容を広く把握し、自分で対応できる部分は対応する。しかし専門的な処置が必要なら、その専門家につなぎます。

「何でも自分でやる人」ではなく、「ここから先は専門家」と判断できることもFPの専門性です。`],[`D｜具体例`,`相続税について「相続税にはこういう仕組みがあります」と一般的な説明をすることと、具体的な税務代理・税務書類の作成・税務相談を行うことは別です。資格が必要な業務については税理士などにつなぎます。`],[`理解確認`,`Q1 FPが最優先するのは？ → 顧客の利益。
Q2 顧客から聞いた資産状況を正当な理由なく知人に話していい？ → ダメです。
Q3 自分では対応できない専門的な問題が出てきたら？ → 適切な専門家と連携する。`],[`30秒復習`,`顧客第一／秘密を守る／きちんと説明／専門領域を越えない。`],[`一文で覚える`,`顧客第一・秘密を守る・きちんと説明・越境せず専門家へ。`]]},
{term:`キャッシュフロー表`,sections:[[`A｜要点`,`キャッシュフロー表＝家計のお金が将来どう変化していくかを、年ごとに予測する表です。

収入 → 支出 → 年間収支 → 貯蓄残高、という流れを見ます。`],[`B｜詳しい解説`,`年間収支＝収入－支出。
貯蓄残高＝前年の貯蓄残高＋その年の年間収支。

将来の金額を変動率で見積もる場合は、現在の金額×（1＋変動率）ⁿという考え方を使います。たとえば生活費300万円が毎年2％上昇するなら、2年後は300万円×1.02²≒312.1万円です。`],[`C｜イメージ理解`,`RPGの所持金画面のように、人生の各年で所持金がどう増減するかを見るイメージです。結婚、住宅購入、進学、退職などのイベントも入れながら将来の資金推移を確認します。`],[`D｜具体例`,`現在貯蓄300万円。1年目の収入500万円、支出400万円なら年間収支＋100万円、貯蓄残高400万円。2年目の収入510万円、支出420万円なら年間収支＋90万円、貯蓄残高490万円です。

キャッシュフロー表＝お金の動画。個人バランスシート＝ある時点のお金の写真、と区別します。`],[`理解確認`,`Q1 収入500万円、支出450万円なら年間収支は？ → ＋50万円。
Q2 前年貯蓄300万円、年間収支＋50万円なら？ → 350万円。
Q3 キャッシュフロー表は何を見る？ → 将来のお金の流れ。`],[`30秒復習`,`収入－支出＝年間収支。前年貯蓄＋年間収支＝現在の貯蓄残高。`],[`一文で覚える`,`キャッシュフロー表は、収入－支出＝年間収支を出し、それを貯蓄残高につなげて、将来のお金の流れを見る表。`]]},
{term:`可処分所得`,sections:[[`A｜要点`,`可処分所得＝収入から税金と社会保険料を引いた、実際に自分で使い道を決められるお金です。`],[`B｜詳しい解説`,`可処分所得＝年収－所得税－住民税－社会保険料。

食費、家賃、電気代などの生活費は可処分所得を求める段階では引きません。税金・社会保険料を引いて可処分所得を求め、その後に生活費などを支払います。`],[`C｜イメージ理解`,`給料という袋から税金と社会保険料を先に取り出し、手元に残った袋が可処分所得です。その残ったお金を家賃、食費、趣味、貯蓄などに振り分けます。`],[`D｜具体例`,`年収500万円、所得税15万円、住民税25万円、社会保険料70万円なら、500－15－25－70＝390万円。可処分所得は390万円です。`],[`理解確認`,`Q1 生活費は引く？ → 引かない。
Q2 主に何を引く？ → 所得税・住民税・社会保険料。
Q3 年収600万円、税金50万円、社会保険料90万円なら？ → 460万円。`],[`30秒復習`,`年収 → 税・社会保険料を引く → 可処分所得 → 支出 → 貯蓄。`],[`一文で覚える`,`可処分所得＝年収－所得税－住民税－社会保険料。`]]},
{term:`終価係数`,sections:[[`A｜要点`,`終価係数＝「今あるお金が、将来いくらになるか」を求める係数です。

現在のお金×終価係数＝将来のお金。`],[`B｜詳しい解説`,`100万円を年3％で運用すると1年後は103万円。2年目は103万円全体に3％がつくため106.09万円になります。これが複利です。

この複利計算をまとめた係数が終価係数です。終価係数は現在→将来の方向です。`],[`C｜イメージ理解`,`今のお金をタイムマシンに入れて未来へ送るイメージです。現在 → 終価係数 → 将来。`],[`D｜具体例`,`現在100万円、年3％で5年間、終価係数1.159なら、100万円×1.159＝115万9,000円です。

ただし「毎年100万円ずつ積み立てて5年後いくら？」なら年金終価係数です。`],[`理解確認`,`Q1 今500万円を運用して10年後いくら？ → 終価係数。
Q2 未来のお金を現在に戻す？ → 現価係数。
Q3 毎年積み立てて将来いくら？ → 年金終価係数。`],[`30秒復習`,`現在の一括資金 → 将来額。複利を考慮。逆方向は現価係数。`],[`一文で覚える`,`終価係数＝今あるお金を未来へ飛ばす係数。`]]},
{term:`現価係数`,sections:[[`A｜要点`,`現価係数＝「将来必要なお金を用意するために、今いくら一括で持っていればいい？」を求める係数です。

将来額×現価係数＝現在必要額。`],[`B｜詳しい解説`,`将来必要な金額を現在価値へ割り戻します。終価係数とは方向が反対です。

将来100万円必要でも、その間に運用できるなら今100万円すべてを持っている必要はありません。一定利率で運用する前提で、今必要な元本を求めます。`],[`C｜イメージ理解`,`未来にあるお金を現在まで引き戻すタイムマシンです。将来 → 現在。`],[`D｜具体例`,`5年後に100万円必要、年3％、現価係数0.863なら、100万円×0.863＝86.3万円を現在用意するイメージです。

「将来の目標額から今の一括資金」を求めるのが現価係数。「将来の目標額から毎年の積立額」を求めるのは減債基金係数です。`],[`理解確認`,`Q1 将来100万円欲しい。今一括でいくら？ → 現価係数。
Q2 今100万円が将来いくら？ → 終価係数。
Q3 将来100万円のため毎年いくら積立？ → 減債基金係数。`],[`30秒復習`,`未来の目標額 → 今の一括資金。`],[`一文で覚える`,`現価係数＝未来に必要なお金を、現在まで引き戻す係数。`]]},
{term:`年金終価係数`,sections:[[`A｜要点`,`年金終価係数＝「毎年同じ金額を積み立てたら、将来いくらになる？」を求める係数です。

毎年の積立額×年金終価係数＝将来の合計額。`],[`B｜詳しい解説`,`毎年100万円を5年間積み立てる場合、運用しなければ500万円です。しかし運用するなら、早く積み立てたお金ほど長く運用されます。それぞれの運用効果をまとめて将来額にするのが年金終価係数です。

ここでいう「年金」は公的年金専用という意味ではなく、毎期一定額のお金の流れという金融上の考え方です。`],[`C｜イメージ理解`,`毎年、利息のつく貯金箱へ同じ金額を入れます。先に入れたお金ほど長く運用され、最後に元本と運用益を合わせた合計額になります。`],[`D｜具体例`,`毎年100万円を年3％で5年間積み立て、年金終価係数が5.309なら、100万円×5.309＝530万9,000円です。

終価係数は「今ある一括のお金→将来」、年金終価係数は「毎年のお金→将来」です。`],[`理解確認`,`Q1 毎年50万円、10年後いくら？ → 年金終価係数。
Q2 今500万円を一括運用、10年後いくら？ → 終価係数。
Q3 10年後500万円のため毎年いくら？ → 減債基金係数。`],[`30秒復習`,`毎年一定額を積立 → 将来額。逆方向は減債基金係数。`],[`一文で覚える`,`年金終価係数＝毎年コツコツ積み立てたら、最後にいくら？`]]},
{term:`減債基金係数`,sections:[[`A｜要点`,`減債基金係数＝「将来○万円作るために、毎年いくら積み立てればいい？」を求める係数です。

将来必要額×減債基金係数＝毎年の積立額。`],[`B｜詳しい解説`,`将来500万円を5年間で作るとき、単純に500÷5＝100万円とするのではなく、積立金を運用して増える分も考えます。運用益があるため、毎年の積立額は単純割りより少なくなる場合があります。

年金終価係数とは逆方向です。`],[`C｜イメージ理解`,`未来に500万円というゴールを置き、そこから逆算して毎年いくら入れればよいかを決めます。ゴール → 毎年の積立額。`],[`D｜具体例`,`5年後に500万円、減債基金係数0.188なら、500万円×0.188＝毎年94万円を積み立てるイメージです。

現価係数は「将来額→今一括でいくら」、減債基金係数は「将来額→毎年いくら」です。`],[`理解確認`,`Q1 10年後1,000万円のため毎年いくら？ → 減債基金係数。
Q2 毎年50万円、10年後いくら？ → 年金終価係数。
Q3 10年後1,000万円のため今一括でいくら？ → 現価係数。`],[`30秒復習`,`将来の目標額 → 毎年の積立額。年金終価係数の逆。`],[`一文で覚える`,`減債基金係数＝将来の目標額から、毎年の積立額を逆算する係数。`]]},
{term:`資本回収係数`,sections:[[`A｜要点`,`資本回収係数＝「今あるお金を運用しながら取り崩すと、毎年いくら受け取れる？」を求める係数です。

現在額×資本回収係数＝毎年の受取額。`],[`B｜詳しい解説`,`1,000万円を10年間で使うなら単純割りでは毎年100万円ですが、残っている資金を運用しながら取り崩すなら運用益も利用できます。元本＋運用益を一定期間で毎年受け取る金額へ変換するのが資本回収係数です。`],[`C｜イメージ理解`,`大きな一つの資金を、運用しながら毎年受け取る小さなお金へ変換します。現在の一括資金 → 毎年の受取額。`],[`D｜具体例`,`現在1,000万円、資本回収係数0.117なら、1,000万円×0.117＝毎年117万円です。

減債基金係数は「将来の目標のために毎年積み立てる」、資本回収係数は「今ある資金を毎年取り崩して受け取る」です。`],[`理解確認`,`Q1 今1,000万円を10年間取り崩す。毎年いくら？ → 資本回収係数。
Q2 10年後1,000万円のため毎年いくら？ → 減債基金係数。
Q3 毎年100万円欲しい。今いくら必要？ → 年金現価係数。`],[`30秒復習`,`現在の一括資金 → 毎年の受取額。`],[`一文で覚える`,`資本回収係数＝今あるまとまったお金を、毎年いくら受け取れるかに変換する係数。`]]},
{term:`年金現価係数`,sections:[[`A｜要点`,`年金現価係数＝「将来、毎年一定額を受け取るためには、今いくら必要？」を求める係数です。

毎年の受取額×年金現価係数＝現在必要額。`],[`B｜詳しい解説`,`今後10年間毎年100万円を受け取る場合、単純合計は1,000万円ですが、今ある資金を運用しながら取り崩せるため、一定利率を前提にすると現在必要な元本を求められます。

未来の各年の受取額を現在価値へ割り戻して一つにまとめるのが年金現価係数です。`],[`C｜イメージ理解`,`未来に毎年並んでいる100万円、100万円、100万円……を全部現在へ引き寄せ、一つの資金にまとめるイメージです。毎年 → 現在。`],[`D｜具体例`,`今後5年間毎年100万円を受け取り、年金現価係数4.580なら、100万円×4.580＝現在458万円必要という計算です。

資本回収係数は「現在→毎年」、年金現価係数は「毎年→現在」で逆方向です。`],[`理解確認`,`Q1 今後10年間毎年100万円欲しい。今いくら？ → 年金現価係数。
Q2 今1,000万円ある。毎年いくら？ → 資本回収係数。
Q3 毎年100万円積立。将来いくら？ → 年金終価係数。`],[`30秒復習`,`毎年の受取額 → 現在の一括資金。逆は資本回収係数。`],[`一文で覚える`,`年金現価係数＝毎年○万円欲しい。そのために今いくら必要？`]]},
{term:`こども保険（学資保険）`,sections:[[`A｜要点`,`こども保険＝子どもの進学などに必要な教育資金を計画的に準備するための保険です。

保険を使って教育費をコツコツ準備する、と考えます。`],[`B｜詳しい解説`,`子どもが小さいうちから保険料を支払い、契約で定めた進学時期などに祝金・満期保険金などを受け取ります。

普通の積立との大きな違いの一つが保障機能です。商品・契約内容によりますが、契約者である親などが死亡・高度障害状態になった場合、その後の保険料払込みが免除される仕組みがあります。払込みが免除されても、契約内容に従って祝金・満期保険金などを受け取れるタイプがあります。`],[`C｜イメージ理解`,`「教育費用の貯金箱＋保険」です。教育資金を積み立てながら、親に万一のことが起きた場合にも教育資金を確保しやすくする仕組みを組み合わせています。`],[`D｜具体例`,`子どもが0歳のときに加入し、18歳の大学進学時に満期保険金などを受け取るよう準備します。途中で契約者に万一のことがあった場合、契約内容に応じて以後の保険料払込みが免除されます。

ただし、こども保険なら必ず払込保険料以上のお金が戻るとは限りません。途中解約では解約返戻金が払込保険料総額を下回る場合もあります。`],[`理解確認`,`Q1 主な目的は？ → 教育資金の準備。
Q2 契約者に万一なら？ → 契約内容により保険料払込免除など。
Q3 必ず元本以上？ → いいえ。`],[`30秒復習`,`教育資金の準備＋親の万一への保障。必ず得する貯金ではない。`],[`一文で覚える`,`こども保険＝教育資金を準備しながら、親の万一にも備える保険。`]]},
{term:`教育一般貸付`,sections:[[`A｜要点`,`教育一般貸付＝日本政策金融公庫が行う、教育費のための公的な融資制度です。

教育一般貸付＝国の教育ローン、と覚えます。`],[`B｜詳しい解説`,`大学などへの進学・在学に必要な入学金、授業料、受験費用、教科書・教材費、自宅外通学に必要な住居費など、幅広い教育費に利用できます。

重要なのは誰が借りるかです。教育一般貸付は基本的に保護者などが借ります。一方、代表的な貸与型奨学金では学生本人が借ります。`],[`C｜イメージ理解`,`大学進学でまとまった教育費が必要になり、家計だけでは足りないとき、保護者が日本政策金融公庫から教育資金を借りて子どもの進学費用を支えるイメージです。`],[`D｜具体例`,`入学金30万円、授業料80万円、教材・パソコン20万円、下宿関連費50万円で合計180万円。手元資金が100万円なら80万円不足します。要件を満たせば教育一般貸付を利用して教育費に充てる選択肢があります。`],[`理解確認`,`Q1 一般に何と呼ばれる？ → 国の教育ローン。
Q2 代表的な機関は？ → 日本政策金融公庫。
Q3 主に誰が借りる？ → 保護者など。`],[`30秒復習`,`教育一般貸付 → 国の教育ローン → 日本政策金融公庫 → 主に保護者。`],[`一文で覚える`,`教育一般貸付＝日本政策金融公庫から主に保護者が借りる、国の教育ローン。`]]},
{term:`奨学金制度`,sections:[[`A｜要点`,`奨学金制度＝学生本人の進学・修学を経済的に支援する制度です。代表的なのが日本学生支援機構（JASSO）の奨学金です。

給付型＝原則返済不要。貸与型＝返済が必要。`],[`B｜詳しい解説`,`貸与型奨学金には代表的に第一種奨学金と第二種奨学金があります。

第一種奨学金＝無利子。
第二種奨学金＝有利子。

奨学金は「全部返さなくていい」でも「全部借金」でもありません。給付型と貸与型を分けます。また、それぞれ学力や家計など所定の採用基準・要件があります。`],[`C｜イメージ理解`,`給付型は「もらう支援」。貸与型は「借りる支援」です。貸与型では学生本人が借り、卒業後などに本人が返還します。`],[`D｜具体例`,`大学進学に200万円必要で家族だけでは用意できない場合、教育一般貸付なら主に保護者が借りて返済します。貸与型奨学金なら学生本人が借りて、本人が返還します。

第一種＝無利子、第二種＝有利子、を反射できるようにします。`],[`理解確認`,`Q1 返済不要は？ → 給付型。
Q2 第一種は？ → 無利子。
Q3 第二種は？ → 有利子。`],[`30秒復習`,`給付＝返さない／貸与＝返す／第一種＝無利子／第二種＝有利子。`],[`一文で覚える`,`奨学金＝給付型は返さない、貸与型は返す。第一種は無利子、第二種は有利子。`]]},
{term:`固定金利型・変動金利型・固定金利期間選択型`,sections:[[`A｜要点`,`住宅ローンの代表的な金利タイプです。違いは「金利がいつ変わる可能性があるのか」です。

固定金利型＝一定期間または全期間、固定。
変動金利型＝市場金利などに応じて変動。
固定金利期間選択型＝最初の一定期間だけ固定。`],[`B｜詳しい解説`,`固定金利型は、固定される期間中は市場金利が変化しても適用金利が変わらず、返済計画を立てやすいタイプです。

変動金利型は、市場金利などの動きに応じて適用金利が見直されます。金利が低下すれば利息負担が軽くなる可能性がある一方、金利が上昇すれば負担が増える可能性があります。

固定金利期間選択型は、3年・5年・10年など当初の一定期間だけ金利を固定します。固定期間終了後は、その時点の商品条件などに基づいて金利タイプを選択するなどの対応になります。「最後まで固定」ではありません。`],[`C｜イメージ理解`,`固定＝🔒────────
変動＝📈📉📈📉📈
期間選択＝🔒🔒🔒｜📈📉

固定金利期間選択型は「期間限定の固定」と考えます。`],[`D｜具体例`,`3,000万円を借りる場合、全期間固定なら市場金利が上昇しても契約した固定金利は基本的に変わりません。変動金利なら市場金利上昇に伴い適用金利が上がる可能性があります。10年固定の固定金利期間選択型なら当初10年間は固定で、11年目以降は固定期間終了時点の条件に基づき見直されます。`],[`理解確認`,`Q1 返済期間を通して金利を固定するタイプは？ → 全期間固定金利型。
Q2 市場金利に応じて変わる可能性がある？ → 変動金利型。
Q3 最初の10年間だけ固定？ → 固定金利期間選択型。`],[`30秒復習`,`固定＝安定。変動＝金利に合わせて動く。期間選択＝最初の一定期間だけ固定。`],[`一文で覚える`,`固定＝ずっと安定、変動＝金利に合わせて動く、期間選択＝最初だけ固定。`]]}
];
const tabs=document.getElementById('tabs'),card=document.getElementById('card');
document.getElementById('count').textContent=cards.length;
let current=0;
function render(i){
 current=i;
 [...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));
 const c=cards[i];
 card.innerHTML=`<h1>${i+1}. ${c.term}</h1>`+
 c.sections.map(([h,t])=>`<section class="section"><h2>${h}</h2><p>${t}</p></section>`).join('')+
 `<div class="pager"><button onclick="render(Math.max(0,current-1))">← 前へ</button><button onclick="render(Math.min(cards.length-1,current+1))">次へ →</button></div>`;
 tabs.children[i]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}
cards.forEach((c,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${c.term}`;b.onclick=()=>render(i);tabs.appendChild(b)});
render(0);
</script></body></html>
