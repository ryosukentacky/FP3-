から始まります。FPはその出来事を整理し、総合福祉団体定期保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>総合福祉団体定期保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 総合福祉団体定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 総合福祉団体定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→総合福祉団体定期保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 総合福祉団体定期保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを総合福祉団体定期保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 総合福祉団体定期保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：総合福祉団体定期保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 総合福祉団体定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 総合福祉団体定期保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 総合福祉団体定期保険 を具体例に落とします。</p>", "M": "<p><strong>総合福祉団体定期保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "ヒューマン・ヴァリュー特約", "content": {"A": "\n<p>「先輩、<strong>ヒューマン・ヴァリュー特約</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>ヒューマン・ヴァリュー特約は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでヒューマン・ヴァリュー特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → ヒューマン・ヴァリュー特約 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → ヒューマン・ヴァリュー特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。ヒューマン・ヴァリュー特約は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>ヒューマン・ヴァリュー特約という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → ヒューマン・ヴァリュー特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでヒューマン・ヴァリュー特約の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだヒューマン・ヴァリュー特約の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>ヒューマン・ヴァリュー特約＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ヒューマン・ヴァリュー特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者がヒューマン・ヴァリュー特約の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じヒューマン・ヴァリュー特約の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、ヒューマン・ヴァリュー特約に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、ヒューマン・ヴァリュー特約に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>ヒューマン・ヴァリュー特約とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → ヒューマン・ヴァリュー特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→ヒューマン・ヴァリュー特約の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをヒューマン・ヴァリュー特約の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：ヒューマン・ヴァリュー特約　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ヒューマン・ヴァリュー特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では ヒューマン・ヴァリュー特約 を具体例に落とします。</p>", "M": "<p><strong>ヒューマン・ヴァリュー特約：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "変額保険", "content": {"A": "\n<p>「先輩、<strong>変額保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>変額保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで変額保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 変額保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 変額保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。変額保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>変額保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 変額保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで変額保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ変額保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>変額保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が変額保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ変額保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、変額保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、変額保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>変額保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 変額保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→変額保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを変額保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：変額保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 変額保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>", "M": "<p><strong>変額保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "個人年金保険", "content": {"A": "\n<p>「先輩、<strong>個人年金保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>個人年金保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで個人年金保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 個人年金保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。個人年金保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>個人年金保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで個人年金保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ個人年金保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>個人年金保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 個人年金保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が個人年金保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ個人年金保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、個人年金保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、個人年金保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>個人年金保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→個人年金保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを個人年金保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：個人年金保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 個人年金保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険 を具体例に落とします。</p>", "M": "<p><strong>個人年金保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "変額個人年金保険", "content": {"A": "\n<p>「先輩、<strong>変額個人年金保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 変額個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>変額個人年金保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 変額個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで変額個人年金保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 変額個人年金保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 変額個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。変額個人年金保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>変額個人年金保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 変額個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで変額個人年金保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ変額個人年金保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>変額個人年金保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 変額個人年金保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が変額個人年金保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ変額個人年金保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、変額個人年金保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、変額個人年金保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>変額個人年金保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 変額個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 変額個人年金保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→変額個人年金保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを変額個人年金保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：変額個人年金保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 変額個人年金保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 変額個人年金保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 変額個人年金保険 を具体例に落とします。</p>", "M": "<p><strong>変額個人年金保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "かんぽ保険", "content": {"A": "\n<p>「先輩、<strong>かんぽ保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>かんぽ保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では かんぽ保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → かんぽ保険 → お金・保障の変化 ある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをかんぽ保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、具体例を最初から最後まで解説 「では かんぽ保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：かんぽ保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では かんぽ保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>", "M": "<p><strong>かんぽ保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "共済", "content": {"A": "\n<p>「先輩、<strong>共済</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>共済は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 共済 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。共済は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>共済という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで共済の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ共済の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>共済＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が共済の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ共済の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、共済に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、共済に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>共済とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→共済の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを共済の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：共済　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 共済 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>", "M": "<p><strong>共済：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "災害割増特約と傷害特約", "content": {"A": "\n<p>「先輩、<strong>災害割増特約と傷害特約</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>災害割増特約と傷害特約は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 災害割増特約と傷害特約 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。災害割増特約と傷害特約は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>災害割増特約と傷害特約という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで災害割増特約と傷害特約の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ災害割増特約と傷害特約の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>災害割増特約と傷害特約＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害割増特約と傷害特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が災害割増特約と傷害特約の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ災害割増特約と傷害特約の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、災害割増特約と傷害特約に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、災害割増特約と傷害特約に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>災害割増特約と傷害特約とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→災害割増特約と傷害特約の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを災害割増特約と傷害特約の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：災害割増特約と傷害特約　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害割増特約と傷害特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害割増特約と傷害特約 を具体例に落とします。</p>", "M": "<p><strong>災害割増特約と傷害特約：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "災害入院特約・疾病入院特約・生活習慣病入院特約", "content": {"A": "\n<p>「先輩、<strong>災害入院特約・疾病入院特約・生活習慣病入院特約</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>災害入院特約・疾病入院特約・生活習慣病入院特約は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。災害入院特約・疾病入院特約・生活習慣病入院特約は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>災害入院特約・疾病入院特約・生活習慣病入院特約という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで災害入院特約・疾病入院特約・生活習慣病入院特約の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ災害入院特約・疾病入院特約・生活習慣病入院特約の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>災害入院特約・疾病入院特約・生活習慣病入院特約＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害入院特約・疾病入院特約・生活習慣病入院特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が災害入院特約・疾病入院特約・生活習慣病入院特約の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ災害入院特約・疾病入院特約・生活習慣病入院特約の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、災害入院特約・疾病入院特約・生活習慣病入院特約に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、災害入院特約・疾病入院特約・生活習慣病入院特約に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>災害入院特約・疾病入院特約・生活習慣病入院特約とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→災害入院特約・疾病入院特約・生活習慣病入院特約の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを災害入院特約・疾病入院特約・生活習慣病入院特約の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：災害入院特約・疾病入院特約・生活習慣病入院特約　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害入院特約・疾病入院特約・生活習慣病入院特約が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 災害入院特約・疾病入院特約・生活習慣病入院特約 を具体例に落とします。</p>", "M": "<p><strong>災害入院特約・疾病入院特約・生活習慣病入院特約：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "退院特約", "content": {"A": "\n<p>「先輩、<strong>退院特約</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>退院特約は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 退院特約 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。退院特約は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>退院特約という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで退院特約の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ退院特約の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>退院特約＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が退院特約の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ退院特約の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、退院特約に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、退院特約に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>退院特約とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→退院特約の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを退院特約の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：退院特約　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 退院特約 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較するです。</p>", "M": "<p><strong>退院特約：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "\n<p>「先輩、<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 を具体例に落とします。</p>", "M": "<p><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "払済保険", "content": {"A": "\n<p>「先輩、<strong>払済保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。</p>\n<p>Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。</p>\n<h3>何のための知識か</h3>\n<p>払済保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。払済保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>払済保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで払済保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ払済保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>払済保険＝「保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『延長保険と逆に覚えない』というミスをします。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が払済保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ払済保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、払済保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、払済保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>払済保険とは何か。<div class=\"answer\"><b>答え：</b>保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。<br>Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→払済保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを払済保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。 さらに、ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：払済保険　②核心：保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。　③仕組み：Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『延長保険と逆に覚えない』というミスをします。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。　⑤比較：ケース6｜誤答を作る「わざと『延長保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>払済保険：</strong>保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。</p>"}}, {"title": "延長保険", "content": {"A": "\n<p>「先輩、<strong>延長保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。</p>\n<p>Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。</p>\n<h3>何のための知識か</h3>\n<p>延長保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。延長保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>延長保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで延長保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ延長保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>延長保険＝「保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『払済保険と逆に覚えない』というミスをします。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が延長保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ延長保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、延長保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、延長保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>延長保険とは何か。<div class=\"answer\"><b>答え：</b>保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。<br>Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→延長保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを延長保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。 さらに、ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：延長保険　②核心：保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。　③仕組み：Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『払済保険と逆に覚えない』というミスをします。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。　⑤比較：ケース6｜誤答を作る「わざと『払済保険と逆に覚えない』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>延長保険：</strong>保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。</p>"}}, {"title": "契約転換制度", "content": {"A": "\n<p>「先輩、<strong>契約転換制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>契約転換制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約転換制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。契約転換制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>契約転換制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約転換制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで契約転換制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ契約転換制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>契約転換制度＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約転換制度が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が契約転換制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ契約転換制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、契約転換制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、契約転換制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>契約転換制度とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約転換制度が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→契約転換制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを契約転換制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：契約転換制度　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約転換制度が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 契約転換制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>契約転換制度：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方
