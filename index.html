<script>const cards=[{"title": "FPが守るべき3つのこと", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>FPが守るべき3つのこと</strong>です。」</p>\n<p>「一言でいうと――<strong>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>FPが守るべき3つのこと</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</p>\n<p>「先輩、ここで一回止めます。<strong>FPが守るべき3つのこと</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>FPが守るべき3つのこと</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>FPが守るべき3つのこと</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>FPは相談の入口では広く対応できますが、出口で他士業の独占業務に触れる場合は線を引きます。税制の一般論を説明することと、特定顧客の申告書を作成することは同じではありません。顧客から預かった家計・資産・家族情報は相談に必要だから知り得た情報なので、秘密保持も信頼の土台です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>FPが守るべき3つのこと</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>FPが守るべき3つのこと</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>『相続税はいくら？』と聞かれたら、仕組みや一般的な計算構造は説明しても、個別具体的な税務代理・税務書類作成は税理士領域だと切り分けます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>FPが守るべき3つのこと</strong>を一言で説明してください。<details><summary>答え</summary>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 『相続税はいくら？』と聞かれたら、仕組みや一般的な計算構造は説明しても、個別具体的な税務代理・税務書類作成は税理士領域だと切り分けます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>FPは相談の入口では広く対応できますが、出口で他士業の独占業務に触れる場合は線を引きます。税制の一般論を説明することと、特定顧客の申告書を作成することは同じではありません。顧客から預かった家計・資産・家族情報は相談に必要だから知り得た情報なので、秘密保持も信頼の土台です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>FPが守るべき3つのこと</dd><dt>② 一番重要なのは？</dt><dd>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</dd>\n<dt>③ なぜ？</dt><dd>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</dd><dt>④ イメージ</dt><dd>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</dd>\n<dt>⑤ 具体例</dt><dd>顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。</dd><dt>⑥ 注意</dt><dd>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>FPが守るべき3つのこと＝FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>キャッシュフロー表</strong>です。」</p>\n<p>「一言でいうと――<strong>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>キャッシュフロー表</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</p>\n<p>「先輩、ここで一回止めます。<strong>キャッシュフロー表</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>キャッシュフロー表</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>キャッシュフロー表</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>キャッシュフロー表は未来予測なので、現在の金額をそのまま横にコピーするのではなく、収入や支出の増減、物価変動、ライフイベントを年ごとに反映します。年間収支がプラスでも、住宅購入など大きな一時支出があれば貯蓄残高は急減します。見るべきは『今年黒字か』だけでなく『将来どこで残高が危険になるか』です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>キャッシュフロー表</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>キャッシュフロー表</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。単純化すれば年末貯蓄は550万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>教育費300万円が発生する年だけ支出が跳ねるとします。前年残高500万円、通常収支+50万円でも、その年に教育費300万円が追加なら残高は大きく減ります。これを事前に見つけるのが表の役割です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>キャッシュフロー表</strong>を一言で説明してください。<details><summary>答え</summary>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 教育費300万円が発生する年だけ支出が跳ねるとします。前年残高500万円、通常収支+50万円でも、その年に教育費300万円が追加なら残高は大きく減ります。これを事前に見つけるのが表の役割です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>キャッシュフロー表は未来予測なので、現在の金額をそのまま横にコピーするのではなく、収入や支出の増減、物価変動、ライフイベントを年ごとに反映します。年間収支がプラスでも、住宅購入など大きな一時支出があれば貯蓄残高は急減します。見るべきは『今年黒字か』だけでなく『将来どこで残高が危険になるか』です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>キャッシュフロー表</dd><dt>② 一番重要なのは？</dt><dd>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</dd>\n<dt>③ なぜ？</dt><dd>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</dd><dt>④ イメージ</dt><dd>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</dd>\n<dt>⑤ 具体例</dt><dd>前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。単純化すれば年末貯蓄は550万円。</dd><dt>⑥ 注意</dt><dd>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>キャッシュフロー表＝家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "終価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>終価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>終価係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</p>\n<p>「先輩、ここで一回止めます。<strong>終価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>終価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>終価係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>式で見ると終価係数は(1+r)^nです。rが利率、nが期間。期間が長いほど『利息にも利息が付く』回数が増えます。だから単利の100万円×(1+3%×5年)とは少し違います。6係数を迷ったら、問題文に『現在ある一括金額』と『将来額』があるかを探してください。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>今100万円を持っていて、5年後の金額を知りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>終価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>今100万円を持っていて、5年後の金額を知りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>終価係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％で5年なら 100万円×1.03^5≒115.9万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。これを5年分まとめた係数が約1.159です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>終価係数</strong>を一言で説明してください。<details><summary>答え</summary>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。これを5年分まとめた係数が約1.159です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>式で見ると終価係数は(1+r)^nです。rが利率、nが期間。期間が長いほど『利息にも利息が付く』回数が増えます。だから単利の100万円×(1+3%×5年)とは少し違います。6係数を迷ったら、問題文に『現在ある一括金額』と『将来額』があるかを探してください。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>終価係数</dd><dt>② 一番重要なのは？</dt><dd>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</dd><dt>④ イメージ</dt><dd>今100万円を持っていて、5年後の金額を知りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％で5年なら 100万円×1.03^5≒115.9万円。</dd><dt>⑥ 注意</dt><dd>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>終価係数＝今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "現価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>現価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>現価係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</p>\n<p>「先輩、ここで一回止めます。<strong>現価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>現価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>現価係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>現価係数は1/(1+r)^n。終価係数の逆数です。将来100万円が必要でも、運用できるなら今100万円全部を用意する必要はありません。時間と利率が『今必要な元本』を小さくします。問題文で『○年後に○万円必要。今いくら？』なら現価係数の方向です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>5年後に100万円必要で、今いくら準備すればよいか考える場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>現価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>5年後に100万円必要で、今いくら準備すればよいか考える場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>現価係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>5年後100万円、年3%なら約86.3万円。86.3万円を5年間3%複利で運用すると約100万円になる、という逆算です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>現価係数</strong>を一言で説明してください。<details><summary>答え</summary>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>終価係数が『今→将来』なら、現価係数は『将来→今』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 5年後100万円、年3%なら約86.3万円。86.3万円を5年間3%複利で運用すると約100万円になる、という逆算です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>現価係数は1/(1+r)^n。終価係数の逆数です。将来100万円が必要でも、運用できるなら今100万円全部を用意する必要はありません。時間と利率が『今必要な元本』を小さくします。問題文で『○年後に○万円必要。今いくら？』なら現価係数の方向です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>現価係数</dd><dt>② 一番重要なのは？</dt><dd>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</dd>\n<dt>③ なぜ？</dt><dd>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</dd><dt>④ イメージ</dt><dd>5年後に100万円必要で、今いくら準備すればよいか考える場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。</dd><dt>⑥ 注意</dt><dd>終価係数が『今→将来』なら、現価係数は『将来→今』です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>現価係数＝将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "年金終価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>年金終価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>年金終価係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</p>\n<p>「先輩、ここで一回止めます。<strong>年金終価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>年金終価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>年金終価係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>年金終価係数は毎年積み立てる複数の資金を将来時点へ集めます。最初の20万円は長く運用され、後の20万円ほど運用期間が短い。この『運用期間の違う積立金の終価の合計』を一つの係数にしたものです。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>年金終価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>年金終価係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>毎年20万円を10年間、年3%なら単純合計200万円より多くなり、係数約11.464なら約229.3万円。『一括100万円』なら終価係数なので、資金の入り方を見ます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>年金終価係数</strong>を一言で説明してください。<details><summary>答え</summary>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 毎年20万円を10年間、年3%なら単純合計200万円より多くなり、係数約11.464なら約229.3万円。『一括100万円』なら終価係数なので、資金の入り方を見ます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>年金終価係数は毎年積み立てる複数の資金を将来時点へ集めます。最初の20万円は長く運用され、後の20万円ほど運用期間が短い。この『運用期間の違う積立金の終価の合計』を一つの係数にしたものです。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>年金終価係数</dd><dt>② 一番重要なのは？</dt><dd>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</dd><dt>④ イメージ</dt><dd>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。</dd><dt>⑥ 注意</dt><dd>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>年金終価係数＝毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "減債基金係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>減債基金係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>減債基金係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</p>\n<p>「先輩、ここで一回止めます。<strong>減債基金係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>減債基金係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>減債基金係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>減債基金係数は年金終価係数の逆数です。目標額を単純に年数で割ると運用益を無視します。運用益があるため、必要な毎年積立額は単純割りより小さくなります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>減債基金係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>減債基金係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>10年後300万円なら単純割りは年30万円。しかし年3%で運用しながら積み立てるなら約26.2万円/年で目標へ近づけます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>減債基金係数</strong>を一言で説明してください。<details><summary>答え</summary>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 10年後300万円なら単純割りは年30万円。しかし年3%で運用しながら積み立てるなら約26.2万円/年で目標へ近づけます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>減債基金係数は年金終価係数の逆数です。目標額を単純に年数で割ると運用益を無視します。運用益があるため、必要な毎年積立額は単純割りより小さくなります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>減債基金係数</dd><dt>② 一番重要なのは？</dt><dd>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</dd><dt>④ イメージ</dt><dd>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。</dd><dt>⑥ 注意</dt><dd>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>減債基金係数＝将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "資本回収係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>資本回収係数</strong>です。」</p>\n<p>「一言でいうと――<strong>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>資本回収係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</p>\n<p>「先輩、ここで一回止めます。<strong>資本回収係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>資本回収係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>資本回収係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>資本回収係数は『現在のまとまった元本』を『毎年の受取額』へ変換します。取り崩していない残高は運用されるので、元本÷年数より毎年受取額を多くできる場合があります。住宅ローンの元利均等返済額を考える構造とも近い係数です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>退職時の1,000万円を10年間で均等に取り崩す場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>資本回収係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職時の1,000万円を10年間で均等に取り崩す場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>資本回収係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>1,000万円を10年、年3%で取り崩すなら単純割り100万円ではなく約117.2万円/年という考え方になります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>資本回収係数</strong>を一言で説明してください。<details><summary>答え</summary>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金現価係数の逆方向。『現在元本→毎年受取額』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 1,000万円を10年、年3%で取り崩すなら単純割り100万円ではなく約117.2万円/年という考え方になります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>資本回収係数は『現在のまとまった元本』を『毎年の受取額』へ変換します。取り崩していない残高は運用されるので、元本÷年数より毎年受取額を多くできる場合があります。住宅ローンの元利均等返済額を考える構造とも近い係数です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>資本回収係数</dd><dt>② 一番重要なのは？</dt><dd>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</dd><dt>④ イメージ</dt><dd>退職時の1,000万円を10年間で均等に取り崩す場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。</dd><dt>⑥ 注意</dt><dd>年金現価係数の逆方向。『現在元本→毎年受取額』です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>資本回収係数＝今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "年金現価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>年金現価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>年金現価係数</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</p>\n<p>「先輩、ここで一回止めます。<strong>年金現価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>年金現価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>年金現価係数</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>年金現価係数は将来の複数回の受取額を一つずつ現在価値へ戻し、その合計を求めます。1年後100万円と10年後100万円は名目額が同じでも現在価値は同じではありません。遠い将来のお金ほど割引かれます。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>今から10年間、毎年100万円を受け取りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>年金現価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>今から10年間、毎年100万円を受け取りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>年金現価係数</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>毎年100万円を10年間、年3%前提で受け取る権利の現在価値は係数約8.530なら約853万円。1,000万円ではないのは時間価値を考えるからです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>年金現価係数</strong>を一言で説明してください。<details><summary>答え</summary>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 毎年100万円を10年間、年3%前提で受け取る権利の現在価値は係数約8.530なら約853万円。1,000万円ではないのは時間価値を考えるからです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>年金現価係数は将来の複数回の受取額を一つずつ現在価値へ戻し、その合計を求めます。1年後100万円と10年後100万円は名目額が同じでも現在価値は同じではありません。遠い将来のお金ほど割引かれます。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>年金現価係数</dd><dt>② 一番重要なのは？</dt><dd>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</dd><dt>④ イメージ</dt><dd>今から10年間、毎年100万円を受け取りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。</dd><dt>⑥ 注意</dt><dd>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>年金現価係数＝将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>こども保険（学資保険）</strong>です。」</p>\n<p>「一言でいうと――<strong>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>こども保険（学資保険）</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</p>\n<p>「先輩、ここで一回止めます。<strong>こども保険（学資保険）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>こども保険（学資保険）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>こども保険（学資保険）</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>学資保険は『貯蓄』と『保障』を一つの契約で考える点がポイントです。進学時期に合わせて受取時期を設定できますが、途中解約では払込保険料総額を下回ることもあります。商品ごとに返戻率、払込免除、受取時期が違うので、預金のように元本がいつでも同じ形で戻るとは考えません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>子どもが18歳になる時に大学資金を準備する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>こども保険（学資保険）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子どもが18歳になる時に大学資金を準備する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>こども保険（学資保険）</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>18歳で200万円必要でも、17歳で必要になる入学手続費用に間に合わない設計なら目的とズレます。『いくら』だけでなく『いつ受け取れるか』も確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>こども保険（学資保険）</strong>を一言で説明してください。<details><summary>答え</summary>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 18歳で200万円必要でも、17歳で必要になる入学手続費用に間に合わない設計なら目的とズレます。『いくら』だけでなく『いつ受け取れるか』も確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>学資保険は『貯蓄』と『保障』を一つの契約で考える点がポイントです。進学時期に合わせて受取時期を設定できますが、途中解約では払込保険料総額を下回ることもあります。商品ごとに返戻率、払込免除、受取時期が違うので、預金のように元本がいつでも同じ形で戻るとは考えません。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>こども保険（学資保険）</dd><dt>② 一番重要なのは？</dt><dd>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</dd>\n<dt>③ なぜ？</dt><dd>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</dd><dt>④ イメージ</dt><dd>子どもが18歳になる時に大学資金を準備する場面。</dd>\n<dt>⑤ 具体例</dt><dd>18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。</dd><dt>⑥ 注意</dt><dd>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>こども保険（学資保険）＝教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>教育一般貸付（国の教育ローン）</strong>です。」</p>\n<p>「一言でいうと――<strong>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>教育一般貸付（国の教育ローン）</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</p>\n<p>「先輩、ここで一回止めます。<strong>教育一般貸付（国の教育ローン）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>教育一般貸付（国の教育ローン）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>教育一般貸付（国の教育ローン）</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>国の教育ローンは家庭側が教育資金を一時的に借りる発想です。奨学金と比較すると、誰が借りるのか、いつ資金が必要なのかが重要です。入学前のまとまった費用にも対応を検討できる一方、所得要件や融資条件は確認が必要です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>子の大学入学金を保護者が用意する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>教育一般貸付（国の教育ローン）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子の大学入学金を保護者が用意する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>教育一般貸付（国の教育ローン）</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>親が入学金100万円を準備できないケースなら親側の融資として考えます。学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>教育一般貸付（国の教育ローン）</strong>を一言で説明してください。<details><summary>答え</summary>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 親が入学金100万円を準備できないケースなら親側の融資として考えます。学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>国の教育ローンは家庭側が教育資金を一時的に借りる発想です。奨学金と比較すると、誰が借りるのか、いつ資金が必要なのかが重要です。入学前のまとまった費用にも対応を検討できる一方、所得要件や融資条件は確認が必要です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>教育一般貸付（国の教育ローン）</dd><dt>② 一番重要なのは？</dt><dd>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</dd>\n<dt>③ なぜ？</dt><dd>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</dd><dt>④ イメージ</dt><dd>子の大学入学金を保護者が用意する場面。</dd>\n<dt>⑤ 具体例</dt><dd>入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。</dd><dt>⑥ 注意</dt><dd>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>教育一般貸付（国の教育ローン）＝日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "奨学金制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>奨学金制度</strong>です。」</p>\n<p>「一言でいうと――<strong>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>奨学金制度</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</p>\n<p>「先輩、ここで一回止めます。<strong>奨学金制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>奨学金制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>奨学金制度</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>給付型は返還不要、貸与型は将来返還するという違いが最重要です。貸与型の中でも利息の有無など条件が異なります。『今の学費負担を軽くする』代わりに『卒業後のキャッシュフローへ返還を移す』制度でもあるので、借入総額を意識します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>大学生が毎月の学費・生活費を補う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>奨学金制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>大学生が毎月の学費・生活費を補う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>奨学金制度</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">月5万円を4年間貸与なら元本だけで240万円。卒業後の返還計画まで見る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>月5万円×48か月なら240万円。卒業時に『月5万円だった』ではなく『240万円の返還元本を持つ』と捉えると負担感が見えます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>奨学金制度</strong>を一言で説明してください。<details><summary>答え</summary>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 月5万円×48か月なら240万円。卒業時に『月5万円だった』ではなく『240万円の返還元本を持つ』と捉えると負担感が見えます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>給付型は返還不要、貸与型は将来返還するという違いが最重要です。貸与型の中でも利息の有無など条件が異なります。『今の学費負担を軽くする』代わりに『卒業後のキャッシュフローへ返還を移す』制度でもあるので、借入総額を意識します。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>奨学金制度</dd><dt>② 一番重要なのは？</dt><dd>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</dd>\n<dt>③ なぜ？</dt><dd>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</dd><dt>④ イメージ</dt><dd>大学生が毎月の学費・生活費を補う場面。</dd>\n<dt>⑤ 具体例</dt><dd>月5万円を4年間貸与なら元本だけで240万円。卒業後の返還計画まで見る。</dd><dt>⑥ 注意</dt><dd>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>奨学金制度＝学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>固定金利期間選択型</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>固定金利期間選択型</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</p>\n<p>「先輩、ここで一回止めます。<strong>固定金利期間選択型</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>固定金利期間選択型</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>固定金利期間選択型</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。『固定』という名前だけで全期間固定と思わないことが試験上のポイントです。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>当初10年間だけ返済額を確定させたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>固定金利期間選択型</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>当初10年間だけ返済額を確定させたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>固定金利期間選択型</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。35年間ずっと同じ金利を望むなら全期間固定との違いを確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>固定金利期間選択型</strong>を一言で説明してください。<details><summary>答え</summary>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。35年間ずっと同じ金利を望むなら全期間固定との違いを確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。『固定』という名前だけで全期間固定と思わないことが試験上のポイントです。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>固定金利期間選択型</dd><dt>② 一番重要なのは？</dt><dd>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</dd>\n<dt>③ なぜ？</dt><dd>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</dd><dt>④ イメージ</dt><dd>当初10年間だけ返済額を確定させたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。</dd><dt>⑥ 注意</dt><dd>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>固定金利期間選択型＝住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>元利均等返済と元金均等返済</strong>です。」</p>\n<p>「一言でいうと――<strong>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>元利均等返済と元金均等返済</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</p>\n<p>「先輩、ここで一回止めます。<strong>元利均等返済と元金均等返済</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>元利均等返済と元金均等返済</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>元利均等返済と元金均等返済</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>元利均等は毎月の総返済額を平準化するため、返済初期は利息の割合が大きく元金の減りが遅めです。元金均等は元金部分を一定額ずつ減らすので、残高が早く減り、利息も早く小さくなります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>住宅ローンの返済方式を選ぶ場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>元利均等返済と元金均等返済</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>住宅ローンの返済方式を選ぶ場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>元利均等返済と元金均等返済</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">元金3,000万円・300回なら元金均等の元金部分は毎回10万円。これに残高に応じた利息が加わり、返済額は徐々に減る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>元金3,000万円を300回なら元金均等の元金部分は毎回10万円。初回は10万円＋大きめの利息、後半は10万円＋小さくなった利息となります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>元利均等返済と元金均等返済</strong>を一言で説明してください。<details><summary>答え</summary>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『一定なのは返済総額か、元金部分か』で見分けます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 元金3,000万円を300回なら元金均等の元金部分は毎回10万円。初回は10万円＋大きめの利息、後半は10万円＋小さくなった利息となります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>元利均等は毎月の総返済額を平準化するため、返済初期は利息の割合が大きく元金の減りが遅めです。元金均等は元金部分を一定額ずつ減らすので、残高が早く減り、利息も早く小さくなります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>元利均等返済と元金均等返済</dd><dt>② 一番重要なのは？</dt><dd>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</dd>\n<dt>③ なぜ？</dt><dd>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</dd><dt>④ イメージ</dt><dd>住宅ローンの返済方式を選ぶ場面。</dd>\n<dt>⑤ 具体例</dt><dd>元金3,000万円・300回なら元金均等の元金部分は毎回10万円。これに残高に応じた利息が加わり、返済額は徐々に減る。</dd><dt>⑥ 注意</dt><dd>『一定なのは返済総額か、元金部分か』で見分けます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>元利均等返済と元金均等返済＝元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>です。」</p>\n<p>「一言でいうと――<strong>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</p>\n<p>「先輩、ここで一回止めます。<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>繰上げ返済（期間短縮型・返済額軽減型）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>繰上げ返済は元金へ直接働きかけるため、その元金に将来付くはずだった利息を減らします。期間短縮型は完済時期を前へ動かし、返済額軽減型は完済時期を大きく変えず毎月負担を下げます。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>同じ100万円を同じ日に返すなら、利息削減重視では期間短縮型が一般に有利。収入減などで月返済を下げたいなら返済額軽減型の目的が合います。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>を一言で説明してください。<details><summary>答え</summary>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 同じ100万円を同じ日に返すなら、利息削減重視では期間短縮型が一般に有利。収入減などで月返済を下げたいなら返済額軽減型の目的が合います。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>繰上げ返済は元金へ直接働きかけるため、その元金に将来付くはずだった利息を減らします。期間短縮型は完済時期を前へ動かし、返済額軽減型は完済時期を大きく変えず毎月負担を下げます。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>繰上げ返済（期間短縮型・返済額軽減型）</dd><dt>② 一番重要なのは？</dt><dd>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</dd>\n<dt>③ なぜ？</dt><dd>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</dd><dt>④ イメージ</dt><dd>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</dd>\n<dt>⑤ 具体例</dt><dd>家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</dd><dt>⑥ 注意</dt><dd>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>繰上げ返済（期間短縮型・返済額軽減型）＝予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "財形住宅融資", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>財形住宅融資</strong>です。」</p>\n<p>「一言でいうと――<strong>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>財形住宅融資</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</p>\n<p>「先輩、ここで一回止めます。<strong>財形住宅融資</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>財形住宅融資</span><b>→</b><s
