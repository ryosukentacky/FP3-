div></li>\n</ol>", "R": "<p>①テーマ：高年齢雇用継続給付と介護休業給付　②核心：今日は 高年齢雇用継続給付と介護休業給付 です。　③仕組み：60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。　⑤比較：次に、その事実を 高年齢雇用継続給付と介護休業給付 固有の条件と照らします。 この用語だけの深掘り 高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。 高年齢雇用継続給付と介護休業給付を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>高年齢雇用継続給付と介護休業給付：</strong>今日は 高年齢雇用継続給付と介護休業給付 です。</p>"}}, {"title": "公的年金", "content": {"A": "\n<p>「先輩、<strong>公的年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</p>\n<p>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。 公的年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>公的年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。 公的年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで公的年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 公的年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>会社員が65歳になり老齢年金を受ける場面。 その情報を並べると、 公的年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。公的年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>公的年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>会社員が65歳になり老齢年金を受ける場面。 その情報を並べると、 公的年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで公的年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ公的年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>公的年金＝「一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が公的年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ公的年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、公的年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、公的年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>公的年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。<br>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。 公的年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>会社員が65歳になり老齢年金を受ける場面。 その情報を並べると、 公的年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→公的年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを公的年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。 さらに、だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</div></li>\n</ol>", "R": "<p>①テーマ：公的年金　②核心：一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。　③仕組み：現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。 公的年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：だからこそ、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。 次に、その事実を 公的年金 固有の条件と照らします。 もう一つ具体例 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。</p>", "M": "<p><strong>公的年金：</strong>一言でいうと―― 国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</p>"}}, {"title": "任意加入被保険者", "content": {"A": "\n<p>「先輩、<strong>任意加入被保険者</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</p>\n<p>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。 任意加入被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意加入被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>任意加入被保険者は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。 任意加入被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意加入被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで任意加入被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 任意加入被保険者 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 任意加入被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意加入被保険者 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。任意加入被保険者は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>任意加入被保険者という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 任意加入被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意加入被保険者 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで任意加入被保険者の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ任意加入被保険者の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>任意加入被保険者＝「一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が任意加入被保険者の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ任意加入被保険者の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、任意加入被保険者に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、任意加入被保険者に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>任意加入被保険者とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。<br>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。 任意加入被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意加入被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 任意加入被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意加入被保険者 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→任意加入被保険者の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを任意加入被保険者の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。 さらに、次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</div></li>\n</ol>", "R": "<p>①テーマ：任意加入被保険者　②核心：一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。　③仕組み：60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。 任意加入被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意加入被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を 任意加入被保険者 固有の条件と照らします。 ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。 もう一つ具体例 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>", "M": "<p><strong>任意加入被保険者：</strong>一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "\n<p>「先輩、<strong>国民年金保険料の免除・猶予制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 国民年金保険料の免除・猶予制度 です。</p>\n<p>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。 国民年金保険料の免除・猶予制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民年金保険料の免除・猶予制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>国民年金保険料の免除・猶予制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。 国民年金保険料の免除・猶予制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民年金保険料の免除・猶予制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで国民年金保険料の免除・猶予制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 国民年金保険料の免除・猶予制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 国民年金保険料の免除・猶予制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民年金保険料の免除・猶予制度 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。国民年金保険料の免除・猶予制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>国民年金保険料の免除・猶予制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 国民年金保険料の免除・猶予制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民年金保険料の免除・猶予制度 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで国民年金保険料の免除・猶予制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ国民年金保険料の免除・猶予制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>国民年金保険料の免除・猶予制度＝「今日は 国民年金保険料の免除・猶予制度 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 受給資格期間への算入や年金額への反映、追納の扱いが異なります。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が国民年金保険料の免除・猶予制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ国民年金保険料の免除・猶予制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、国民年金保険料の免除・猶予制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、国民年金保険料の免除・猶予制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>国民年金保険料の免除・猶予制度とは何か。<div class=\"answer\"><b>答え：</b>今日は 国民年金保険料の免除・猶予制度 です。<br>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。 国民年金保険料の免除・猶予制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民年金保険料の免除・猶予制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 国民年金保険料の免除・猶予制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民年金保険料の免除・猶予制度 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→国民年金保険料の免除・猶予制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを国民年金保険料の免除・猶予制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 国民年金保険料の免除・猶予制度 です。 さらに、受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</div></li>\n</ol>", "R": "<p>①テーマ：国民年金保険料の免除・猶予制度　②核心：今日は 国民年金保険料の免除・猶予制度 です。　③仕組み：払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。 国民年金保険料の免除・猶予制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民年金保険料の免除・猶予制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 受給資格期間への算入や年金額への反映、追納の扱いが異なります。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：受給資格期間への算入や年金額への反映、追納の扱いが異なります。 次に、その事実を 国民年金保険料の免除・猶予制度 固有の条件と照らします。 もう一つ具体例 『全額払えない→何もしない』ではなく申請。</p>", "M": "<p><strong>国民年金保険料の免除・猶予制度：</strong>今日は 国民年金保険料の免除・猶予制度 です。</p>"}}, {"title": "老齢基礎年金", "content": {"A": "\n<p>「先輩、<strong>老齢基礎年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</p>\n<p>老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</p>\n<h3>何のための知識か</h3>\n<p>老齢基礎年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 老齢基礎年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>65歳になった人が老齢基礎年金を請求する場面。 その情報を並べると、 老齢基礎年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。老齢基礎年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>老齢基礎年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>65歳になった人が老齢基礎年金を請求する場面。 その情報を並べると、 老齢基礎年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで老齢基礎年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ老齢基礎年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>老齢基礎年金＝「一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</p>\n<p>このケースでは、まず目的と対象者が老齢基礎年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ老齢基礎年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、老齢基礎年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、老齢基礎年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>老齢基礎年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。<br>老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>65歳になった人が老齢基礎年金を請求する場面。 その情報を並べると、 老齢基礎年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→老齢基礎年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを老齢基礎年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。 さらに、次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：老齢基礎年金　②核心：一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。　③仕組み：老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。　④具体例：40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。　⑤比較：次に、その事実を 老齢基礎年金 固有の条件と照らします。 資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>老齢基礎年金：</strong>一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "\n<p>「先輩、<strong>繰上げ支給と繰下げ支給</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 繰上げ支給と繰下げ支給 です。</p>\n<p>繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<h3>何のための知識か</h3>\n<p>繰上げ支給と繰下げ支給は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで繰上げ支給と繰下げ支給の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 繰上げ支給と繰下げ支給 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 繰上げ支給と繰下げ支給 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 繰上げ支給と繰下げ支給 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。繰上げ支給と繰下げ支給は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>繰上げ支給と繰下げ支給という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 繰上げ支給と繰下げ支給 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 繰上げ支給と繰下げ支給 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで繰上げ支給と繰下げ支給の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ繰上げ支給と繰下げ支給の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>繰上げ支給と繰下げ支給＝「今日は 繰上げ支給と繰下げ支給 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>このケースでは、まず目的と対象者が繰上げ支給と繰下げ支給の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ繰上げ支給と繰下げ支給の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、繰上げ支給と繰下げ支給に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、繰上げ支給と繰下げ支給に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>繰上げ支給と繰下げ支給とは何か。<div class=\"answer\"><b>答え：</b>今日は 繰上げ支給と繰下げ支給 です。<br>繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 繰上げ支給と繰下げ支給 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 繰上げ支給と繰下げ支給 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→繰上げ支給と繰下げ支給の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを繰上げ支給と繰下げ支給の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 繰上げ支給と繰下げ支給 です。 さらに、次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：繰上げ支給と繰下げ支給　②核心：今日は 繰上げ支給と繰下げ支給 です。　③仕組み：繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。　④具体例：受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。　⑤比較：次に、その事実を 繰上げ支給と繰下げ支給 固有の条件と照らします。 増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>繰上げ支給と繰下げ支給：</strong>今日は 繰上げ支給と繰下げ支給 です。</p>"}}, {"title": "付加年金", "content": {"A": "\n<p>「先輩、<strong>付加年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</p>\n<p>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>付加年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 付加年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>自営業者が老齢基礎年金を少し増やしたい場面。 その情報を並べると、 付加年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。付加年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>付加年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>自営業者が老齢基礎年金を少し増やしたい場面。 その情報を並べると、 付加年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで付加年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ付加年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>付加年金＝「一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>付加年金額は原則『200円×付加保険料納付月数』。 10年=120月なら年2万4,000円の上乗せ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>このケースでは、まず目的と対象者が付加年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ付加年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、付加年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、付加年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>付加年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。<br>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>自営業者が老齢基礎年金を少し増やしたい場面。 その情報を並べると、 付加年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→付加年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを付加年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。 さらに、だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</div></li>\n</ol>", "R": "<p>①テーマ：付加年金　②核心：一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。　③仕組み：基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：付加年金額は原則『200円×付加保険料納付月数』。 10年=120月なら年2万4,000円の上乗せ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。　⑤比較：だからこそ、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。 次に、その事実を 付加年金 固有の条件と照らします。 だから、 国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</p>", "M": "<p><strong>付加年金：</strong>一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</p>"}}, {"title": "老齢厚生年金", "content": {"A": "\n<p>「先輩、<strong>老齢厚生年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</p>\n<p>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。 老齢厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>老齢厚生年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。 老齢厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで老齢厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 老齢厚生年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>長年会社員として働いた人が65歳になる場面。 その情報を並べると、 老齢厚生年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。老齢厚生年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>老齢厚生年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>長年会社員として働いた人が65歳になる場面。 その情報を並べると、 老齢厚生年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで老齢厚生年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ老齢厚生年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>老齢厚生年金＝「一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</p>\n<p>このケースでは、まず目的と対象者が老齢厚生年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ老齢厚生年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、老齢厚生年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、老齢厚生年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>老齢厚生年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。<br>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。 老齢厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>長年会社員として働いた人が65歳になる場面。 その情報を並べると、 老齢厚生年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→老齢厚生年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを老齢厚生年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。 さらに、だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：老齢厚生年金　②核心：一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。　③仕組み：会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。 老齢厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。　⑤比較：だからこそ、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 次に、その事実を 老齢厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>老齢厚生年金：</strong>一言でいうと―― 厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</p>"}}, {"title": "経過的加算", "content": {"A": "\n<p>「先輩、<strong>経過的加算</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</p>\n<p>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。 経過的加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 経過的加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>経過的加算は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。 経過的加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 経過的加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで経過的加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 経過的加算 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。 その情報を並べると、 経過的加算 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。経過的加算は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>経過的加算という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。 その情報を並べると、 経過的加算 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで経過的加算の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ経過的加算の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>経過的加算＝「一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が経過的加算の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ経過的加算の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、経過的加算に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、経過的加算に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>経過的加算とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。<br>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。 経過的加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 経過的加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。 その情報を並べると、 経過的加算 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→経過的加算の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを経過的加算の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。 さらに、だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</div></li>\n</ol>", "R": "<p>①テーマ：経過的加算　②核心：一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。　③仕組み：制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。 経過的加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 経過的加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：だからこそ、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。 次に、その事実を 経過的加算 固有の条件と照らします。 もう一つ具体例 問題文に配偶者が出てこなくても経過的加算は成立し得ます。</p>", "M": "<p><strong>経過的加算：</strong>一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</p>"}}, {"title": "配偶者加給年金と振替加算", "content": {"A": "\n<p>「先輩、<strong>配偶者加給年金と振替加算</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 配偶者加給年金と振替加算 です。</p>\n<p>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。 配偶者加給年金と振替加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 配偶者加給年金と振替加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>配偶者加給年金と振替加算は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。 配偶者加給年金と振替加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 配偶者加給年金と振替加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで配偶者加給年金と振替加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 配偶者加給年金と振替加算 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。 その情報を並べると、 配偶者加給年金と振替加算 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。配偶者加給年金と振替加算は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>配偶者加給年金と振替加算という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。 その情報を並べると、 配偶者加給年金と振替加算 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで配偶者加給年金と振替加算の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ配偶者加給年金と振替加算の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>配偶者加給年金と振替加算＝「今日は 配偶者加給年金と振替加算 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『誰の年金に付いているか』を追うのが最重要です。</p>\n<p>このケースでは、まず目的と対象者が配偶者加給年金と振替加算の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ配偶者加給年金と振替加算の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、配偶者加給年金と振替加算に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、配偶者加給年金と振替加算に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>配偶者加給年金と振替加算とは何か。<div class=\"answer\"><b>答え：</b>今日は 配偶者加給年金と振替加算 です。<br>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。 配偶者加給年金と振替加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 配偶者加給年金と振替加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。 その情報を並べると、 配偶者加給年金と振替加算 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→配偶者加給年金と振替加算の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを配偶者加給年金と振替加算の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 配偶者加給年金と振替加算 です。 さらに、だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：配偶者加給年金と振替加算　②核心：今日は 配偶者加給年金と振替加算 です。　③仕組み：厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。 配偶者加給年金と振替加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 配偶者加給年金と振替加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『誰の年金に付いているか』を追うのが最重要です。　⑤比較：だからこそ、 『誰の年金に付いているか』を追うのが最重要です。 次に、その事実を 配偶者加給年金と振替加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>配偶者加給年金と振替加算：</strong>今日は 配偶者加給年金と振替加算 です。</p>"}}, {"title": "在職老齢年金", "content": {"A": "\n<p>「先輩、<strong>在職老齢年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</p>\n<p>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。 在職老齢年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 在職老齢年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>在職老齢年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 老齢基礎年金はこの支給停止調整の対象ではありません。 基準額は改正されるため受験年度確認が必要です。 基準額は改正されるため受験年度確認が必要です。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>高い賃金を得ながら厚生年金も満額受給するケースについて、一
