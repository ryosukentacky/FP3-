ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを年金現価係数の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。 さらに、だからこそ、 資本回収係数は現在元本から毎年額。 年金現価係数は毎年額から現在元本です。 年金現価係数は毎年額から現在元本です。</div></li>\n</ol>", "R": "<p>①テーマ：年金現価係数　②核心：一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。　③仕組み：将来の年金の『今の値段』を求める感覚です。 年金現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 年金現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 資本回収係数は現在元本から毎年額。　⑤比較：だからこそ、 資本回収係数は現在元本から毎年額。 年金現価係数は毎年額から現在元本です。 年金現価係数は毎年額から現在元本です。</p>", "M": "<p><strong>年金現価係数：</strong>一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "\n<p>「先輩、<strong>こども保険（学資保険）</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は こども保険（学資保険） です。</p>\n<p>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？</p>\n<h3>何のための知識か</h3>\n<p>こども保険（学資保険）は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → こども保険（学資保険） → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて こども保険（学資保険） が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。こども保険（学資保険）は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>こども保険（学資保険）という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて こども保険（学資保険） が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでこども保険（学資保険）の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだこども保険（学資保険）の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>こども保険（学資保険）＝「今日は こども保険（学資保険） です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</p>\n<p>このケースでは、まず目的と対象者がこども保険（学資保険）の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じこども保険（学資保険）の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、こども保険（学資保険）に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、こども保険（学資保険）に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>こども保険（学資保険）とは何か。<div class=\"answer\"><b>答え：</b>今日は こども保険（学資保険） です。<br>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて こども保険（学資保険） が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→こども保険（学資保険）の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをこども保険（学資保険）の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は こども保険（学資保険） です。 さらに、現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：こども保険（学資保険）　②核心：今日は こども保険（学資保険） です。　③仕組み：教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？　④具体例：18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。　⑤比較：現実の問題 → こども保険（学資保険） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>こども保険（学資保険）：</strong>今日は こども保険（学資保険） です。</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "\n<p>「先輩、<strong>教育一般貸付（国の教育ローン）</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 教育一般貸付（国の教育ローン） です。</p>\n<p>教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。</p>\n<h3>何のための知識か</h3>\n<p>教育一般貸付（国の教育ローン）は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 教育一般貸付（国の教育ローン） → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 教育一般貸付（国の教育ローン） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 教育一般貸付（国の教育ローン） が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。教育一般貸付（国の教育ローン）は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>教育一般貸付（国の教育ローン）という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 教育一般貸付（国の教育ローン） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 教育一般貸付（国の教育ローン） が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで教育一般貸付（国の教育ローン）の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ教育一般貸付（国の教育ローン）の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>教育一般貸付（国の教育ローン）＝「今日は 教育一般貸付（国の教育ローン） です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が教育一般貸付（国の教育ローン）の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ教育一般貸付（国の教育ローン）の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、教育一般貸付（国の教育ローン）に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、教育一般貸付（国の教育ローン）に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>教育一般貸付（国の教育ローン）とは何か。<div class=\"answer\"><b>答え：</b>今日は 教育一般貸付（国の教育ローン） です。<br>教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 教育一般貸付（国の教育ローン） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 教育一般貸付（国の教育ローン） が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→教育一般貸付（国の教育ローン）の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを教育一般貸付（国の教育ローン）の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 教育一般貸付（国の教育ローン） です。 さらに、学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：教育一般貸付（国の教育ローン）　②核心：今日は 教育一般貸付（国の教育ローン） です。　③仕組み：教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。　④具体例：入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：学生本人が毎月5万円を在学中に借りる話なら貸与型奨学金のイメージに近づきます。 教育一般貸付（国の教育ローン）を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>教育一般貸付（国の教育ローン）：</strong>今日は 教育一般貸付（国の教育ローン） です。</p>"}}, {"title": "奨学金制度", "content": {"A": "\n<p>「先輩、<strong>奨学金制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</p>\n<p>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>奨学金制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 奨学金制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 奨学金制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 奨学金制度 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。奨学金制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>奨学金制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 奨学金制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 奨学金制度 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで奨学金制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ奨学金制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>奨学金制度＝「一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>月5万円を4年間貸与なら元本だけで240万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が奨学金制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ奨学金制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、奨学金制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、奨学金制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>奨学金制度とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。<br>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 奨学金制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 奨学金制度 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→奨学金制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを奨学金制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。 さらに、次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</div></li>\n</ol>", "R": "<p>①テーマ：奨学金制度　②核心：一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。　③仕組み：学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：月5万円を4年間貸与なら元本だけで240万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を 奨学金制度 固有の条件と照らします。 この用語だけの深掘り 給付型は返還不要、貸与型は将来返還するという違いが最重要です。 もう一つ具体例 月5万円×48か月なら240万円。</p>", "M": "<p><strong>奨学金制度：</strong>一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "\n<p>「先輩、<strong>固定金利期間選択型</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</p>\n<p>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>固定金利期間選択型は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで固定金利期間選択型の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 固定金利期間選択型 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>当初10年間だけ返済額を確定させたい場面。 その情報を並べると、 固定金利期間選択型 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。固定金利期間選択型は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>固定金利期間選択型という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>当初10年間だけ返済額を確定させたい場面。 その情報を並べると、 固定金利期間選択型 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで固定金利期間選択型の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ固定金利期間選択型の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>固定金利期間選択型＝「一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が固定金利期間選択型の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ固定金利期間選択型の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、固定金利期間選択型に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、固定金利期間選択型に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>固定金利期間選択型とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。<br>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>当初10年間だけ返済額を確定させたい場面。 その情報を並べると、 固定金利期間選択型 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→固定金利期間選択型の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを固定金利期間選択型の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。 さらに、次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</div></li>\n</ol>", "R": "<p>①テーマ：固定金利期間選択型　②核心：一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。　③仕組み：最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を 固定金利期間選択型 固有の条件と照らします。 この用語だけの深掘り 固定期間中は適用金利が変わらないため返済計画を立てやすい一方、固定期間終了後はその時点の金利環境の影響を受けます。 もう一つ具体例 10年固定で11年目に市場金利が上昇していれば、再選択後の返済額が増える可能性があります。</p>", "M": "<p><strong>固定金利期間選択型：</strong>一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "\n<p>「先輩、<strong>元利均等返済と元金均等返済</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 元利均等返済と元金均等返済 です。</p>\n<p>元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>元利均等返済と元金均等返済は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 元利均等返済と元金均等返済 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 元利均等返済と元金均等返済 が候補に上がってくる。 難しい言葉を見たら、 住宅ローンの返済方式を選ぶ場面。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。元利均等返済と元金均等返済は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>元利均等返済と元金均等返済という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 元利均等返済と元金均等返済 が候補に上がってくる。 難しい言葉を見たら、 住宅ローンの返済方式を選ぶ場面。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで元利均等返済と元金均等返済の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ元利均等返済と元金均等返済の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>元利均等返済と元金均等返済＝「今日は 元利均等返済と元金均等返済 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>元金3,000万円・300回なら元金均等の元金部分は毎回10万円。 これに残高に応じた利息が加わり、返済額は徐々に減る。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>このケースでは、まず目的と対象者が元利均等返済と元金均等返済の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ元利均等返済と元金均等返済の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、元利均等返済と元金均等返済に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、元利均等返済と元金均等返済に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>元利均等返済と元金均等返済とは何か。<div class=\"answer\"><b>答え：</b>今日は 元利均等返済と元金均等返済 です。<br>元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 元利均等返済と元金均等返済 が候補に上がってくる。 難しい言葉を見たら、 住宅ローンの返済方式を選ぶ場面。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→元利均等返済と元金均等返済の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを元利均等返済と元金均等返済の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 元利均等返済と元金均等返済 です。 さらに、だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</div></li>\n</ol>", "R": "<p>①テーマ：元利均等返済と元金均等返済　②核心：今日は 元利均等返済と元金均等返済 です。　③仕組み：元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：元金3,000万円・300回なら元金均等の元金部分は毎回10万円。 これに残高に応じた利息が加わり、返済額は徐々に減る。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。　⑤比較：だからこそ、 『一定なのは返済総額か、元金部分か』で見分けます。 次に、その事実を 元利均等返済と元金均等返済 固有の条件と照らします。 だから、 『一定なのは返済総額か、元金部分か』で見分けます。</p>", "M": "<p><strong>元利均等返済と元金均等返済：</strong>今日は 元利均等返済と元金均等返済 です。</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "\n<p>「先輩、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 繰上げ返済（期間短縮型・返済額軽減型） です。</p>\n<p>期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>繰上げ返済（期間短縮型・返済額軽減型）は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 繰上げ返済（期間短縮型・返済額軽減型） → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>ボーナス100万円を住宅ローンへ繰上げ返済する場面。 その情報を並べると、 繰上げ返済（期間短縮型・返済額軽減型） が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。繰上げ返済（期間短縮型・返済額軽減型）は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>繰上げ返済（期間短縮型・返済額軽減型）という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>ボーナス100万円を住宅ローンへ繰上げ返済する場面。 その情報を並べると、 繰上げ返済（期間短縮型・返済額軽減型） が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで繰上げ返済（期間短縮型・返済額軽減型）の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ繰上げ返済（期間短縮型・返済額軽減型）の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>繰上げ返済（期間短縮型・返済額軽減型）＝「今日は 繰上げ返済（期間短縮型・返済額軽減型） です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</p>\n<p>このケースでは、まず目的と対象者が繰上げ返済（期間短縮型・返済額軽減型）の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ繰上げ返済（期間短縮型・返済額軽減型）の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、繰上げ返済（期間短縮型・返済額軽減型）に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、繰上げ返済（期間短縮型・返済額軽減型）に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>繰上げ返済（期間短縮型・返済額軽減型）とは何か。<div class=\"answer\"><b>答え：</b>今日は 繰上げ返済（期間短縮型・返済額軽減型） です。<br>期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>ボーナス100万円を住宅ローンへ繰上げ返済する場面。 その情報を並べると、 繰上げ返済（期間短縮型・返済額軽減型） が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→繰上げ返済（期間短縮型・返済額軽減型）の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを繰上げ返済（期間短縮型・返済額軽減型）の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 繰上げ返済（期間短縮型・返済額軽減型） です。 さらに、だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：繰上げ返済（期間短縮型・返済額軽減型）　②核心：今日は 繰上げ返済（期間短縮型・返済額軽減型） です。　③仕組み：期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。　⑤比較：だからこそ、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 次に、その事実を 繰上げ返済（期間短縮型・返済額軽減型） 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>繰上げ返済（期間短縮型・返済額軽減型）：</strong>今日は 繰上げ返済（期間短縮型・返済額軽減型） です。</p>"}}, {"title": "財形住宅融資", "content": {"A": "\n<p>「先輩、<strong>財形住宅融資</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</p>\n<p>財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。</p>\n<h3>何のための知識か</h3>\n<p>財形住宅融資は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 財形住宅融資 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 財形住宅融資 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 財形住宅融資 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。財形住宅融資は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>財形住宅融資という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 財形住宅融資 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 財形住宅融資 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで財形住宅融資の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ財形住宅融資の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>財形住宅 i><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを財形住宅融資の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。 さらに、この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：財形住宅融資　②核心：一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。　③仕組み：財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。　④具体例：財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：この用語だけの深掘り 財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。 財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 財形住宅融資 を具体例に落とします。</p>", "M": "<p><strong>財形住宅融資：</strong>一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</p>"}}, {"title": "フラット35", "content": {"A": "\n<p>「先輩、<strong>フラット35</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</p>\n<p>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。 フラット35 が必要になる前に、何が起きているか分かります？ 現実の問題 → フラット35 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>フラット35は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。 フラット35 が必要になる前に、何が起きているか分かります？ 現実の問題 → フラット35 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでフラット35の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → フラット35 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>将来の金利上昇を避け、返済額を安定させたい場面。 その情報を並べると、 フラット35 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。フラット35は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>フラット35という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>将来の金利上昇を避け、返済額を安定させたい場面。 その情報を並べると、 フラット35 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでフラット35の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだフラット35の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>フラット35＝「一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者がフラット35の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じフラット35の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、フラット35に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、フラット35に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>フラット35とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。<br>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。 フラット35 が必要になる前に、何が起きているか分かります？ 現実の問題 → フラット35 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>将来の金利上昇を避け、返済額を安定させたい場面。 その情報を並べると、 フラット35 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→フラット35の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをフラット35の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。 さらに、次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：フラット35　②核心：一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。　③仕組み：借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。 フラット35 が必要になる前に、何が起きているか分かります？ 現実の問題 → フラット35 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を フラット35 固有の条件と照らします。 もう一つ具体例 金利上昇局面では固定の安心が効きます。 フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>フラット35：</strong>一言でいうと―― 住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "\n<p>「先輩、<strong>財形貯蓄制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</p>\n<p>住宅財形・年金財形には一定の税制上の扱いがあります。 財形貯蓄制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形貯蓄制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>財形貯蓄制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>住宅財形・年金財形には一定の税制上の扱いがあります。 財形貯蓄制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形貯蓄制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで財形貯蓄制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 財形貯蓄制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>給与から毎月2万円を天引きして将来の住宅資金を作る場面。 その情報を並べると、 財形貯蓄制度 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。財形貯蓄制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>財形貯蓄制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>給与から毎月2万円を天引きして将来の住宅資金を作る場面。 その情報を並べると、 財形貯蓄制度 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで財形貯蓄制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ財形貯蓄制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>財形貯蓄制度＝「一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 住宅財形・年金財形は目的が限定されます。</p>\n<p>このケースでは、まず目的と対象者が財形貯蓄制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ財形貯蓄制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、財形貯蓄制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、財形貯蓄制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>財形貯蓄制度とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。<br>住宅財形・年金財形には一定の税制上の扱いがあります。 財形貯蓄制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形貯蓄制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>給与から毎月2万円を天引きして将来の住宅資金を作る場面。 その情報を並べると、 財形貯蓄制度 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→財形貯蓄制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを財形貯蓄制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。 さらに、住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：財形貯蓄制度　②核心：一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。　③仕組み：住宅財形・年金財形には一定の税制上の扱いがあります。 財形貯蓄制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形貯蓄制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 住宅財形・年金財形は目的が限定されます。　⑤比較：住宅財形・年金財形は目的が限定されます。 次に、その事実を 財形貯蓄制度 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>財形貯蓄制度：</strong>一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</p>"}}, {"title": "団体信用生命保険", "content": {"A": "\n<p>「先輩、<strong>団体信用生命保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</p>\n<p>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？</p>\n<h3>何のための知識か</h3>\n<p>団体信用生命保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 団体信用生命保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>住宅ローン返済中の世帯主が死亡する場面。 その情報を並べると、 団体信用生命保険 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。団体信用生命保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>団体信用生命保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>住宅ローン返済中の世帯主が死亡する場面。 その情報を並べると、 団体信用生命保険 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで団体信用生命保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ団体信用生命保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>団体信用生命保険＝「一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。</p>\n<p>このケースでは、まず目的と対象者が団体信用生命保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ団体信用生命保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、団体信用生命保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、団体信用生命保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>団体信用生命保険とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。<br>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>住宅ローン返済中の世帯主が死亡する場面。 その情報を並べると、 団体信用生命保険 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→団体信用生命保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを団体信用生命保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。 さらに、現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</div></li>\n</ol>", "R": "<p>①テーマ：団体信用生命保険　②核心：一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。　③仕組み：住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？　④具体例：死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。　⑤比較：現実の問題 → 団体信用生命保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一般の死亡保険は遺族が生活費等に使う保険金。 団信は住宅ローン残高の返済が中心です。</p>", "M": "<p><strong>団体信用生命保険：</strong>一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "\n<p>「先輩、<strong>住宅ローンの借り換え</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 住宅ローンの借り換え です。</p>\n<p>住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。</p>\n<h3>何のための知識か</h3>\n<p>住宅ローンの借り換えは、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 住宅ローンの借り換え → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 住宅ローンの借り換え が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 住宅ローンの借り換え が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。住宅ローンの借り換えは、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>住宅ローンの借り換えという語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 住宅ローンの借り換え が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 住宅ローンの借り換え が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで住宅ローンの借り換えの条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ住宅ローンの借り換えの効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>住宅ローンの借り換え＝「今日は 住宅ローンの借り換え です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が住宅ローンの借り換えの条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ住宅ローンの借り換えの枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、住宅ローンの借り換えに関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、住宅ローンの借り換えに当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>住宅ローンの借り換えとは何か。<div class=\"answer\"><b>答え：</b>今日は 住宅ローンの借り換え です。<br>住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 住宅ローンの借り換え が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 住宅ローンの借り換え が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→住宅ローンの借り換えの適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを住宅ローンの借り換えの要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 住宅ローンの借り換え です。 さらに、この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</div></li>\n</ol>", "R": "<p>①テーマ：住宅ローンの借り換え　②核心：今日は 住宅ローンの借り換え です。　③仕組み：住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。　④具体例：借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：この用語だけの深掘り 借換えは新規ローンで旧ローン残高を一括返済する取引です。 もう一つ具体例 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。 残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>", "M": "<p><strong>住宅ローンの借り換え：</strong>今日は 住宅ローンの借り換え です。</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "\n<p>「先輩、<strong>埋葬に関する給付</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</p>\n<p>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？</p>\n<h3>何のための知識か</h3>\n<p>埋葬に関する給付は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 埋葬に関する給付 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 埋葬に関する給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 埋葬に関する給付 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。埋葬に関する給付は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>埋葬に関する給付という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 埋葬に関する給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 埋葬に関する給付 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで埋葬に関する給付の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ埋葬に関する給付の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>埋葬に関する給付＝「一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</p>\n<p>このケースでは、まず目的と対象者が埋葬に関する給付の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ埋葬に関する給付の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、埋葬に関する給付に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、埋葬に関する給付に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>埋葬に関する給付とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。<br>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 埋葬に関する給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 埋葬に関する給付 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→埋葬に関する給付の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを埋葬に関する給付の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。 さらに、現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：埋葬に関する給付　②核心：一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。　③仕組み：死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？　④具体例：『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。　⑤比較：現実の問題 → 埋葬に関する給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>埋葬に関する給付：</strong>一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</p>"}}, {"title": "任意継続被保険者", "content": {"A": "\n<p>「先輩、<strong>任意継続被保険者</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</p>\n<p>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>任意継続被保険者は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで任意継続被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 任意継続被保険者 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 任意継続被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意継続被保険者 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。任意継続被保険者は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>任意継続被保険者という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 任意継続被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意継続被保険者 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで任意継続被保険者の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ任意継続被保険者の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>任意継続被保険者＝「一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>退職後は任意継続と国保の保険料等を比較。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</p>\n<p>このケースでは、まず目的と対象者が任意継続被保険者の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ任意継続被保険者の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、任意継続被保険者に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、任意継続被保険者に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>任意継続被保険者とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。<br>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 任意継続被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意継続被保険者 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→任意継続被保険者の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを任意継続被保険者の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。 さらに、だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：任意継続被保険者　②核心：一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。　③仕組み：退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：退職後は任意継続と国保の保険料等を比較。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。　⑤比較：だからこそ、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 次に、その事実を 任意継続被保険者 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>任意継続被保険者：</strong>一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</p>"}}, {"title": "国民健康保険", "content": {"A": "\n<p>「先輩、<strong>国民健康保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</p>\n<p>国民健康保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民健康保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 国民健康保険 固有の条件と照らします。</p>\n<h3>何のための知識か</h3>\n<p>国民健康保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>国民健康保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民健康保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 国民健康保険 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで国民健康保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 国民健康保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 国民健康保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民健康保険 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。国民健康保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>国民健康保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 国民健康保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民健康保険 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで国民健康保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ国民健康保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>国民健康保険＝「一言でいうと―― 会社の健康保険
