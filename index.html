>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>通常予測を超えるリスクに対する保険会社の支払余力を示す指標です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>通常予測を超えるリスクに対する保険会社の支払余力を示す指標です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>ソルベンシー・マージン比率</dd><dt>芯</dt><dd>通常予測を超えるリスクに対する保険会社の支払余力を示す指標です。</dd><dt>映像</dt><dd>大地震や株価急落という巨大な波に対し、保険会社がどれだけ厚い防波堤を持つかを想像します。</dd><dt>具体例</dt><dd>試験では200%が健全性を見る一つの基準。400%と150%なら数値上の余力は前者が大きいと読みます。</dd><dt>注意</dt><dd>高ければ絶対に破綻しないという保証ではない。</dd></dl>", "M": "<div class=\"memory\"><strong>ソルベンシー・マージン比率：通常予測を超えるリスクに対する保険会社の支払余力を示す指標です。</strong></div>"}}, {"title": "保険法と保険業法", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>保険法と保険業法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、保険法と保険業法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>保険法と保険業法が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険法と保険業法では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>保険法と保険業法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。保険法と保険業法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、保険法と保険業法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険法と保険業法では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>保険法と保険業法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>保険法と保険業法</dd><dt>芯</dt><dd>保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、保険法と保険業法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険法と保険業法では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>保険法と保険業法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>保険法と保険業法：保険法と保険業法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "解約返戻金", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>解約返戻金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、解約返戻金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>解約返戻金が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、解約返戻金では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>解約返戻金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。解約返戻金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、解約返戻金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、解約返戻金では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>解約返戻金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>解約返戻金</dd><dt>芯</dt><dd>解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、解約返戻金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、解約返戻金では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>解約返戻金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>解約返戻金：解約返戻金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "生死混合保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>生死混合保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、生死混合保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>生死混合保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生死混合保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>生死混合保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。生死混合保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、生死混合保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生死混合保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>生死混合保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>生死混合保険</dd><dt>芯</dt><dd>生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、生死混合保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生死混合保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>生死混合保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>生死混合保険：生死混合保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "予定死亡率・予定利率・予定事業費率", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</p><p>「注意は<strong>3つとも上がれば保険料も上がる、ではない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>保険会社の机に『何人死亡？』『運用で何%増える？』『会社運営にいくら？』という3枚の予算表を置きます。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>予定死亡率・予定利率・予定事業費率が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">一般に予定利率が上がれば運用収益を多く見込めるため保険料は下がる方向。予定事業費率が上がれば保険料は上がる方向です。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>3つとも上がれば保険料も上がる、ではない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。3つとも上がれば保険料も上がる、ではない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>保険会社の机に『何人死亡？』『運用で何%増える？』『会社運営にいくら？』という3枚の予算表を置きます。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>一般に予定利率が上がれば運用収益を多く見込めるため保険料は下がる方向。予定事業費率が上がれば保険料は上がる方向です。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>3つとも上がれば保険料も上がる、ではない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>予定死亡率・予定利率・予定事業費率</dd><dt>芯</dt><dd>死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</dd><dt>映像</dt><dd>保険会社の机に『何人死亡？』『運用で何%増える？』『会社運営にいくら？』という3枚の予算表を置きます。</dd><dt>具体例</dt><dd>一般に予定利率が上がれば運用収益を多く見込めるため保険料は下がる方向。予定事業費率が上がれば保険料は上がる方向です。</dd><dt>注意</dt><dd>3つとも上がれば保険料も上がる、ではない。</dd></dl>", "M": "<div class=\"memory\"><strong>予定死亡率・予定利率・予定事業費率：死亡発生、運用収益、事業経費の見込みとして保険料計算に使う3つの予定率です。</strong></div>"}}, {"title": "純保険料と付加保険料", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</p><p>「注意は<strong>純保険料を単純に貯金部分と考えない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>月1万円の保険料が『保障の箱』と『会社運営の箱』へ分かれる映像です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>純保険料と付加保険料が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">営業保険料1万円=純保険料8,000円+付加保険料2,000円と仮定すると構造が見えます。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>純保険料を単純に貯金部分と考えない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。純保険料を単純に貯金部分と考えない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>月1万円の保険料が『保障の箱』と『会社運営の箱』へ分かれる映像です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>営業保険料1万円=純保険料8,000円+付加保険料2,000円と仮定すると構造が見えます。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>純保険料を単純に貯金部分と考えない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>純保険料と付加保険料</dd><dt>芯</dt><dd>純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</dd><dt>映像</dt><dd>月1万円の保険料が『保障の箱』と『会社運営の箱』へ分かれる映像です。</dd><dt>具体例</dt><dd>営業保険料1万円=純保険料8,000円+付加保険料2,000円と仮定すると構造が見えます。</dd><dt>注意</dt><dd>純保険料を単純に貯金部分と考えない。</dd></dl>", "M": "<div class=\"memory\"><strong>純保険料と付加保険料：純保険料は保険金等の原資、付加保険料は保険会社の事業経費に充てる部分です。</strong></div>"}}, {"title": "剰余金と配当金", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>剰余金と配当金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、剰余金と配当金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>剰余金と配当金が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、剰余金と配当金では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>剰余金と配当金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。剰余金と配当金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、剰余金と配当金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、剰余金と配当金では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>剰余金と配当金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>剰余金と配当金</dd><dt>芯</dt><dd>剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、剰余金と配当金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、剰余金と配当金では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>剰余金と配当金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>剰余金と配当金：剰余金と配当金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "有配当保険・無配当保険・準有配当保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>有配当保険・無配当保険・準有配当保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、有配当保険・無配当保険・準有配当保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>有配当保険・無配当保険・準有配当保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、有配当保険・無配当保険・準有配当保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>有配当保険・無配当保険・準有配当保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。有配当保険・無配当保険・準有配当保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、有配当保険・無配当保険・準有配当保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、有配当保険・無配当保険・準有配当保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>有配当保険・無配当保険・準有配当保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>有配当保険・無配当保険・準有配当保険</dd><dt>芯</dt><dd>有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、有配当保険・無配当保険・準有配当保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、有配当保険・無配当保険・準有配当保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>有配当保険・無配当保険・準有配当保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>有配当保険・無配当保険・準有配当保険：有配当保険・無配当保険・準有配当保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "告知義務", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>告知義務について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>告知義務について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>告知義務は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、告知義務が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>告知義務が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、告知義務では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>告知義務は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>告知義務について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summar →制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>責任開始日が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、責任開始日では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>責任開始日は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>責任開始日について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。責任開始日は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、責任開始日が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、責任開始日では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>責任開始日は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>責任開始日について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>責任開始日について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>責任開始日</dd><dt>芯</dt><dd>責任開始日について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、責任開始日が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、責任開始日では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>責任開始日は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>責任開始日：責任開始日について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "保険料の払込猶予", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>保険料の払込猶予は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、保険料の払込猶予が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>保険料の払込猶予が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険料の払込猶予では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>保険料の払込猶予は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。保険料の払込猶予は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、保険料の払込猶予が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険料の払込猶予では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>保険料の払込猶予は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>保険料の払込猶予</dd><dt>芯</dt><dd>保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、保険料の払込猶予が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、保険料の払込猶予では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>保険料の払込猶予は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>保険料の払込猶予：保険料の払込猶予について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "自動振替貸付制度と契約者貸付制度", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</p><p>「注意は<strong>どちらも貸付なので利息があり、単なる返戻金の引出しではない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>『保険料へ自動で流れる矢印』と『契約者の財布へ流れる矢印』を並べます。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>自動振替貸付制度と契約者貸付制度が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">解約返戻金100万円、貸付可能割合80%と仮定すれば契約者貸付上限は80万円程度のイメージです。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>どちらも貸付なので利息があり、単なる返戻金の引出しではない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。どちらも貸付なので利息があり、単なる返戻金の引出しではない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>『保険料へ自動で流れる矢印』と『契約者の財布へ流れる矢印』を並べます。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>解約返戻金100万円、貸付可能割合80%と仮定すれば契約者貸付上限は80万円程度のイメージです。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>どちらも貸付なので利息があり、単なる返戻金の引出しではない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>自動振替貸付制度と契約者貸付制度</dd><dt>芯</dt><dd>前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</dd><dt>映像</dt><dd>『保険料へ自動で流れる矢印』と『契約者の財布へ流れる矢印』を並べます。</dd><dt>具体例</dt><dd>解約返戻金100万円、貸付可能割合80%と仮定すれば契約者貸付上限は80万円程度のイメージです。</dd><dt>注意</dt><dd>どちらも貸付なので利息があり、単なる返戻金の引出しではない。</dd></dl>", "M": "<div class=\"memory\"><strong>自動振替貸付制度と契約者貸付制度：前者は保険料を自動立替えして失効を防ぎ、後者は契約者が解約返戻金の範囲内で資金を借りる制度です。</strong></div>"}}, {"title": "契約の失効と復活", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>契約の失効と復活は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、契約の失効と復活が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>契約の失効と復活が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、契約の失効と復活では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>契約の失効と復活は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。契約の失効と復活は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、契約の失効と復活が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、契約の失効と復活では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>契約の失効と復活は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>契約の失効と復活</dd><dt>芯</dt><dd>契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、契約の失効と復活が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、契約の失効と復活では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>契約の失効と復活は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>契約の失効と復活：契約の失効と復活について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "必要保障額", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</p><p>「注意は<strong>現在年収=必要保障額ではない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>家族の未来に必要な『支出の山』から、すでにある『収入・資産の山』を差し引く天秤を想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>必要保障額が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">生活費3,000万+教育費1,000万+その他200万=4,200万。遺族年金等1,500万+預金700万なら不足約2,000万円。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>現在年収=必要保障額ではない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。現在年収=必要保障額ではない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>家族の未来に必要な『支出の山』から、すでにある『収入・資産の山』を差し引く天秤を想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>生活費3,000万+教育費1,000万+その他200万=4,200万。遺族年金等1,500万+預金700万なら不足約2,000万円。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>現在年収=必要保障額ではない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>必要保障額</dd><dt>芯</dt><dd>遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</dd><dt>映像</dt><dd>家族の未来に必要な『支出の山』から、すでにある『収入・資産の山』を差し引く天秤を想像します。</dd><dt>具体例</dt><dd>生活費3,000万+教育費1,000万+その他200万=4,200万。遺族年金等1,500万+預金700万なら不足約2,000万円。</dd><dt>注意</dt><dd>現在年収=必要保障額ではない。</dd></dl>", "M": "<div class=\"memory\"><strong>必要保障額：遺族に必要な将来支出から、公的保障・収入・預貯金など準備済み資金を引いた不足額です。</strong></div>"}}, {"title": "生命保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>生命保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、生命保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>生命保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>生命保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。生命保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、生命保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>生命保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>生命保険</dd><dt>芯</dt><dd>生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、生命保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>生命保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>生命保険：生命保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "定期保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>定期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>定期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、定期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>定期保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、定期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>定期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、定期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、定期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか 額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、団体定期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>団体定期保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、団体定期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>団体定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>団体定期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。団体定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、団体定期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、団体定期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>団体定期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>団体定期保険について、誰が対象で、どんな <summary>模範の芯</summary>変額個人年金保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>変額個人年金保険</dd><dt>芯</dt><dd>変額個人年金保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、変額個人年金保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、変額個人年金保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>変額個人年金保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>変額個人年金保険：変額個人年金保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "かんぽ保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>かんぽ保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、かんぽ保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>かんぽ保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、かんぽ保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>かんぽ保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。かんぽ保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、かんぽ保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、かんぽ保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>かんぽ保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>かんぽ保険</dd><dt>芯</dt><dd>かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、かんぽ保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、かんぽ保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>かんぽ保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>かんぽ保険：かんぽ保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "共済", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>共済について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span>< <li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>退院特約について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>退院特約</dd><dt>芯</dt><dd>退院特約について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、退院特約が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、退院特約では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>退院特約は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>退院特約：退院特約について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</dd><dt>芯</dt><dd>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険：特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "払済保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</p><p>「注意は<strong>延長保険は保障額を原則維持して期間を短くする方向。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>保険料を払えなくなったAさんが『期間は残したいから保障額を小さくする』場面です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>払済保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">終身保障1,000万円を維持できず、解約返戻金を使って例えば400万円相当の払済保障へ縮小するイメージです。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>延長保険は保障額を原則維持して期間を短くする方向。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。延長保険は保障額を原則維持して期間を短くする方向。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>保険料を払えなくなったAさんが『期間は残したいから保障額を小さくする』場面です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>終身保障1,000万円を維持できず、解約返戻金を使って例えば400万円相当の払済保障へ縮小するイメージです。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>延長保険は保障額を原則維持して期間を短くする方向。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>払済保険</dd><dt>芯</dt><dd>以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</dd><dt>映像</dt><dd>保険料を払えなくなったAさんが『期間は残したいから保障額を小さくする』場面です。</dd><dt>具体例</dt><dd>終身保障1,000万円を維持できず、解約返戻金を使って例えば400万円相当の払済保障へ縮小するイメージです。</dd><dt>注意</dt><dd>延長保険は保障額を原則維持して期間を短くする方向。</dd></dl>", "M": "<div class=\"memory\"><strong>払済保険：以後の保険料払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong></div>"}}, {"title": "延長保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</p><p>「注意は<strong>払済保険との『額を下げるか、期間を短くするか』を逆にしない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんが『保障額1,000万円は今必要。でも一生分の保険料は払えない』として期間を短くする場面です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>延長保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">1,000万円終身保障を、解約返戻金を一時払保険料として一定期間の1,000万円定期保障へ変えるイメージです。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>払済保険との『額を下げるか、期間を短くするか』を逆にしない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。払済保険との『額を下げるか、期間を短くするか』を逆にしない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんが『保障額1,000万円は今必要。でも一生分の保険料は払えない』として期間を短くする場面です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>1,000万円終身保障を、解約返戻金を一時払保険料として一定期間の1,000万円定期保障へ変えるイメージです。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>払済保険との『額を下げるか、期間を短くするか』を逆にしない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>延長保険</dd><dt>芯</dt><dd>以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</dd><dt>映像</dt><dd>Aさんが『保障額1,000万円は今必要。でも一生分の保険料は払えない』として期間を短くする場面です。</dd><dt>具体例</dt><dd>1,000万円終身保障を、解約返戻金を一時払保険料として一定期間の1,000万円定期保障へ変えるイメージです。</dd><dt>注意</dt><dd>払済保険との『額を下げるか、期間を短くするか』を逆にしない。</dd></dl>", "M": "<div class=\"memory\"><strong>延長保険：以後の保険料払込みを止め、解約返戻金を使って元の死亡保険金額を原則維持しながら保障期間を短くする変更です。</strong></div>"}}, {"title": "契約転換制度", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>契約転換制度について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>契約転換制度について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>契約転換制度は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、契約転換制度が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>契約転換制度が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、契約転換制度では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>契約転換制度は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>契約転換制度について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。契約転換制度は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、契約転換制度が ・追加・減額が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、付加・追加・減額では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>付加・追加・減額は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>付加・追加・減額について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。付加・追加・減額は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、付加・追加・減額が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、付加・追加・減額では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>付加・追加・減額は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>付加・追加・減額について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>付加・追加・減額について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>付加・追加・減額</dd><dt>芯</dt><dd>付加・追加・減額について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、付加・追加・減額が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、付加・追加・減額では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>付加・追加・減額は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>付加・追加・減額：付加・追加・減額について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "生命保険料控除", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>生命保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、生命保険料控除が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>生命保険料控除が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険料控除では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>生命保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。生命保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、生命保険料控除が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険料控除では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>生命保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>生命保険料控除</dd><dt>芯</dt><dd>生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、生命保険料控除が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、生命保険料控除では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>生命保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>生命保険料控除：生命保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "個人年金保険料控除", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理する ails></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>個人年金保険料控除</dd><dt>芯</dt><dd>個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、個人年金保険料控除が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、個人年金保険料控除では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>個人年金保険料控除は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>個人年金保険料控除：個人年金保険料控除について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "死亡保険金・満期保険金の税金", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</p><p>「注意は<strong>死亡した人だけを見て税区分を決めない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>A・B・Cの三人を三角形に置き、『誰が保険料を出した？誰が死亡した？誰がお金を受け取った？』と矢印を追います。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>死亡保険金・満期保険金の税金が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">Aが保険料負担→A死亡→B受取なら相続税。A負担→B死亡→A受取なら所得税。A負担→B死亡→C受取なら贈与税が基本整理です。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>死亡した人だけを見て税区分を決めない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。死亡した人だけを見て税区分を決めない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>A・B・Cの三人を三角形に置き、『誰が保険料を出した？誰が死亡した？誰がお金を受け取った？』と矢印を追います。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>Aが保険料負担→A死亡→B受取なら相続税。A負担→B死亡→A受取なら所得税。A負担→B死亡→C受取なら贈与税が基本整理です。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>死亡した人だけを見て税区分を決めない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>死亡保険金・満期保険金の税金</dd><dt>芯</dt><dd>契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</dd><dt>映像</dt><dd>A・B・Cの三人を三角形に置き、『誰が保険料を出した？誰が死亡した？誰がお金を受け取った？』と矢印を追います。</dd><dt>具体例</dt><dd>Aが保険料負担→A死亡→B受取なら相続税。A負担→B死亡→A受取なら所得税。A負担→B死亡→C受取なら贈与税が基本整理です。</dd><dt>注意</dt><dd>死亡した人だけを見て税区分を決めない。</dd></dl>", "M": "<div class=\"memory\"><strong>死亡保険金・満期保険金の税金：契約者・被保険者・受取人の組合せによって相続税・所得税・贈与税など税区分が変わります。</strong></div>"}}, {"title": "金融類似商品の税金", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>金融類似商品の税金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span> \n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>金融類似商品の税金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>金融類似商品の税金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>金融類似商品の税金</dd><dt>芯</dt><dd>金融類似商品の税金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、金融類似商品の税金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、金融類似商品の税金では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>金融類似商品の税金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>金融類似商品の税金：金融類似商品の税金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "非課税となる保険金や給付金", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>非課税となる保険金や給付金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>非課税となる保険金や給付金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>非課税となる保険金や給付金は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、非課税となる保険金や給付金が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>非課税となる保険金や給付金が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、非課税となる保険金や給付金では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p 受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>非課税となる保険金や給付金：非課税となる保険金や給付金について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "事業保障資金の準備", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>事業保障資金の準備について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>事業保障資金の準備について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>事業保障資金の準備は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、事業保障資金の準備が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>事業保障資金の準備が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、事業保障資金の準備では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>事業保障資金の準備は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>事業保障資金の準備について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。事業保障資金の準備は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</deta を整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>定期保険・第三分野保険に関わる保険料の取扱い</dd><dt>芯</dt><dd>定期保険・第三分野保険に関わる保険料の取扱いについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、定期保険・第三分野保険に関わる保険料の取扱いが必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、定期保険・第三分野保険に関わる保険料の取扱いでは人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>定期保険・第三分野保険に関わる保険料の取扱いは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>定期保険・第三分野保険に関わる保険料の取扱い：定期保険・第三分野保険に関わる保険料の取扱いについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "長期平準定期保険の経理処理", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>長期平準定期保険の経理処理について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>長期平準定期保険の経理処理について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>長期平準定期保険の経理処理は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、長期平準定期保険の経理処理が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>長期平準定期保険の経理処理が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、長期平準定期保険の経理処理では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>長期平準定期保険の経理処理は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれ
