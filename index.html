<script>const chapterData={ch1:[{"title": "FPが守るべき3つのこと", "content": {"A": "<h3>A｜要点</h3><p>「先輩、最初はFPの知識じゃなくて“FPとしてどう振る舞うか”です。ここを雑にすると、どれだけ税金や保険に詳しくても駄目ですよ。」</p><p>「まず大きく押さえるのは、<strong>顧客の利益を大切にすること、顧客の秘密を守ること、そして自分の資格・権限を越えた仕事をしないこと</strong>です。」</p><p>「FPは年収、預金、借金、家族構成、相続、保険みたいな、普通なら他人に見せない情報まで扱いますよね。だから“知識がある人”である前に、“安心して情報を預けられる人”でないと仕事にならないんです。」</p><p>「それともう一つ。FP資格を持ったからといって、税理士や弁護士などの独占業務まで自由にできるわけではありません。一般的な制度説明や家計相談はできても、資格が必要な個別具体的な業務には境界があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「では、なぜこの3つが土台なのか、一つずつつなげます。」</p><p>「一つ目は<strong>顧客本位</strong>です。相談者が住宅ローンを組むとして、FPにとって手数料の高い商品と、相談者にとって負担の小さい商品が違ったらどうするか。ここでFP自身の利益を優先したら、相談という形をしていても顧客のための助言ではなくなります。だから判断の中心には顧客の利益を置きます。」</p><p>「二つ目が<strong>守秘</strong>です。家計相談では“預金がいくら”“父から相続予定”“住宅ローンが残りいくら”なんて情報まで出てきます。それを仕事と無関係な第三者へ漏らしたら、顧客はもう安心して相談できません。情報を集める力より、その情報を適切に扱う責任の方が先にあるんです。」</p><p>「三つ目が<strong>資格・権限の境界を守ること</strong>です。ここ、試験でも実務でも大事です。FPは税金や法律について一般的な情報提供はできます。でも、“この人の具体的な税額を税務代理として処理する”“法律事件について弁護士として代理する”といった他士業の独占業務を、資格なしで行えるわけではありません。」</p><p>「え？ 顧客のためにやるならいいんじゃないか、ですか？ ……駄目です。善意かどうかと、業務を行う資格があるかは別問題です。必要なら税理士・弁護士・社会保険労務士などの専門家につなぐ。そこまで含めてFPの役割なんですよ。」</p><p>「流れにすると、<strong>顧客から重要情報を預かる → 顧客の利益を基準に助言する → 秘密を守る → 自分の専門範囲を越える部分は専門家と連携する</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一つの相談場面で全部つなげますね。」</p><p>「先輩がFPで、夫婦から『子どもが生まれたので家を買いたい』と相談されたとします。夫婦は年収、預金500万円、住宅ローン希望額、保険、親から将来援助を受ける予定まで話してくれました。」</p><p>「まず、この情報を友人との雑談で話すのは駄目ですよね。これが守秘です。次に、夫婦には3,500万円の住宅より3,000万円程度の方が家計に余裕が残ると分析できたのに、自分に都合のよい商品へ誘導する。これも顧客本位ではありません。」</p><p>「さらに夫婦から『親から500万円もらう予定なので、うちの場合の贈与税申告を全部やってください』と言われたとします。ここでFPが税の一般的な仕組みを説明するところと、税理士資格が必要な個別の税務代理等とは分けなければいけません。」</p><p>「つまり三つは別々の暗記事項ではありません。<strong>相談者の大切な情報を預かり、その人の利益のために使い、自分の権限を越える部分では専門家へつなぐ</strong>。一件の相談の中で全部つながっているんです。」</p>", "D": "<h3>D｜具体例</h3><p>「では、試験で判断できる形まで具体化します。」</p><p>「ケースです。FPのAさんが顧客Bさんから『相続税が心配です』と相談されました。Aさんは相続税の一般的な仕組みや、どんな資料を整理するとよいかを説明しました。そして個別の税務判断・申告が必要な部分は税理士へ相談するよう案内しました。」</p><p>「これはFPとして自然な対応です。なぜなら、Aさんは相談者が理解するための一般情報を提供しつつ、自分が行えない専門業務まで抱え込んでいないからです。」</p><p>「逆に、『私があなたの税額を確定して申告まで代理します。税理士資格はないけどFPだから大丈夫です』となったら話が変わります。<strong>FP資格は他士業の独占業務を解除する資格ではない</strong>からです。」</p><p>「もう一つだけ。Bさんの預金額を、Aさんが『この前のお客さん、5,000万円持ってたんですよ』と知人へ話した。名前を軽く伏せれば何でもよい、とは考えないでください。顧客情報は必要な範囲で慎重に扱う。その姿勢そのものが信頼の前提です。」</p><p>「試験では、“顧客のためなら何でもできる”という文章に注意です。正しくは、<strong>顧客本位で行動する。しかし法令・資格の境界は越えない</strong>、です。」</p>", "Q": "<h3>理解確認</h3><p>「はい、ここだけ先輩の番です。答えは下にあります。」</p><h4>Q1｜FPが顧客の預金額を仕事と無関係な知人へ話すのが問題なのはなぜ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「顧客から預かった秘密・個人情報を適切に守る必要があるからです。FPは非常に私的な情報を扱うので、守秘は相談関係の土台になります。」</p></div></details><h4>Q2｜FPなら、税理士資格がなくても顧客のために税理士の独占業務を行える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「行えるわけではありません。FPとして一般的な情報提供をすることと、他士業の独占業務を行うことは別です。必要な場合は有資格者と連携します。」</p></div></details><h4>Q3｜『顧客本位』と『法令順守』がぶつかったら、顧客の利益を優先して法律を越えてよい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「駄目です。顧客本位は法令や職業上のルールを無視してよいという意味ではありません。顧客の利益を考えながら、適法な範囲で助言・連携します。」</p></div></details>", "R": "<p>「30秒復習です。①顧客の利益を中心にする。②顧客情報を守る。③FP資格だけで他士業の独占業務までできるわけではない。④必要なら専門家と連携する。――この一本で覚えてください。」</p>", "M": "<p>「<strong>FPは、顧客の利益と秘密を守り、自分の専門範囲を越えずに支援する。</strong>」</p><p>「はい。最初の項目ですけど、ここは後の全部の土台ですよ。」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<h3>A｜要点</h3><p>「先輩、キャッシュフロー表は“今の家計簿”ではありません。<strong>将来の家計を年ごとに予測して、収入・支出・年間収支・貯蓄残高がどう動くかを見る表</strong>です。」</p><p>「なぜ必要か。今は黒字でも、5年後に住宅購入、10年後に教育費、20年後に退職が来たら、家計の形は変わりますよね。未来の資金不足を、起きる前に見つけるためです。」</p><p>「見る順番は、家族の年齢やイベント → 収入 → 支出 → 年間収支 → 貯蓄残高。最後の貯蓄残高まで追うのが大事です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず年間収支です。これは基本的に<strong>その年の収入－その年の支出</strong>。収入500万円、支出420万円なら+80万円です。」</p><p>「でも、それだけでは家計の安全性は分かりません。前年末の貯蓄が300万円なら、単純化すれば300万円にその年の黒字80万円が加わって380万円になります。逆に教育費などで年間収支が－150万円なら、貯蓄を取り崩して150万円分減ります。」</p><p>「ここで将来の金額を考えるときは、給与上昇率や物価上昇率などの変動率を反映することがあります。たとえば現在100万円の支出が毎年2%ずつ増えるなら、翌年は102万円。その次は102万円に2%をかけるので104.04万円です。」</p><p>「先輩、ライフイベント表と混ざりそうですよね。ライフイベント表は『35歳で住宅購入』『45歳で子どもが大学』のように出来事を並べるのが中心。キャッシュフロー表は、その出来事が<strong>家計のお金をどう動かすか</strong>まで数値で追います。」</p><p>「だから流れは、<strong>将来のイベントを置く → 収入と支出を見積もる → 年間収支を出す → 貯蓄残高を更新する → 資金不足の年を見つける</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一つの家族だけ追います。夫婦30歳、貯蓄500万円。今は毎年100万円ずつ貯められているとします。」</p><p>「この数字だけ見ると順調です。でも5年後に住宅購入の頭金300万円、18年後には子どもの大学費用が大きくなる。さらに退職後は給与収入がなくなります。」</p><p>「これを頭の中だけで考えると、『今100万円黒字だから大丈夫』となりやすい。でも年ごとの表にすると、住宅購入年に貯蓄がガクッと下がり、教育費の時期にもまた下がるのが見えます。」</p><p>「つまりキャッシュフロー表は、家計を写真ではなく<strong>動画</strong>として見る道具なんです。今の残高だけではなく、時間が進んだときの変化を見る。これがイメージの中心です。」</p>", "D": "<h3>D｜具体例</h3><p>「数字を一つ、最後まで追います。」</p><p>「年初貯蓄500万円、年間収入500万円、年間支出400万円とします。年間収支は500－400＝<strong>+100万円</strong>。単純化すれば年末貯蓄は500＋100＝<strong>600万円</strong>です。」</p><p>「翌年に車購入200万円があり、通常支出400万円に車200万円が加わるなら、その年の支出は600万円。収入500万円なら年間収支は<strong>－100万円</strong>。前年末貯蓄600万円から100万円取り崩して、年末は500万円です。」</p><p>「ほら、1年目だけ見れば100万円黒字。でも2年目のイベントを入れると貯蓄は元に戻りました。これを10年、20年と続けることで、『教育費が来る前にもっと貯める必要がある』『住宅予算を少し下げよう』と早めに判断できるわけです。」</p><p>「なお、実際のFP計算では可処分所得や変動率など問題文の条件に従います。試験では<strong>何を足し、何を引き、前年の残高へどうつなぐか</strong>を丁寧に見てください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜キャッシュフロー表は何を見る表？</h4><details><summary>答えを見る</summary><div class='answer'><p>「将来の収入・支出・年間収支・貯蓄残高の推移です。“現在の家計だけ”ではありません。」</p></div></details><h4>Q2｜年初貯蓄300万円、年間収入500万円、支出450万円なら、単純化した年末貯蓄はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年間収支は+50万円なので、300＋50＝350万円です。」</p></div></details><h4>Q3｜ライフイベント表との大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「ライフイベント表は将来の出来事を整理するのが中心。キャッシュフロー表は、それを収入・支出・貯蓄残高というお金の動きまで落とし込みます。」</p></div></details>", "R": "<p>「30秒です。キャッシュフロー表＝未来の家計の動画。収入－支出＝年間収支。その収支を前年の貯蓄残高につないで、将来の資金不足を探します。」</p>", "M": "<p>「<strong>キャッシュフロー表は、将来の収支と貯蓄残高を年ごとに追って、資金不足を先に見つける表。</strong>」</p>"}}, {"title": "終価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、6係数は名前から覚えると混乱します。終価係数は方向だけ見てください。<strong>今ある一括のお金 → 将来いくらになる？</strong>です。」</p><p>「100万円を今持っていて、年3%で5年間運用したらいくらになるか。こういう問題です。」</p><p>「一言なら、<strong>現在額を将来額へ育てる係数</strong>。ここが核です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ係数が必要かというと、複利だからです。年3%なら、100万円は1年後103万円になります。」</p><p>「2年目、また元の100万円に3万円だけ付くと思ったら駄目ですよ。2年目は103万円全体に3%が付きます。103万円×1.03＝106.09万円です。」</p><p>「つまり毎年1.03倍する。5年間なら1.03を5回かけるので、<strong>1.03⁵</strong>。これが年3%・5年の終価係数に当たります。」</p><p>「式にすると、<strong>将来額＝現在額×終価係数</strong>です。」</p><p>「先輩、『5年後のお金を聞かれたら全部終価係数？』って思いました？ そこは違います。5年後100万円を作るため“今いくら必要か”なら現価係数です。大事なのは“将来”という単語ではなく、<strong>お金がどちら向きに動くか</strong>です。」</p><p>「流れは、<strong>今の一括資金 → 複利運用 → 将来の一括資金</strong>。これが終価係数です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100万円を箱に入れる場面だけ覚えましょう。箱の中のお金は毎年3%ずつ増えます。」</p><p>「1年目に3万円増えて103万円。そこで増えた3万円も箱から出しません。2年目は、その利息だった3万円まで次の利息を生みます。」</p><p>「だから箱は、100→103→106.09→……と、毎年“前の年に大きくなった箱全体”がさらに1.03倍されます。」</p><p>「終価係数という難しい名前を忘れても、<strong>今持っている一つの箱を未来まで育てる</strong>映像が出れば、現価係数や積立系の係数と区別できます。」</p>", "D": "<h3>D｜具体例</h3><p>「100万円を年3%、5年間、複利で運用します。」</p><p>「終価係数は1.03⁵≒<strong>1.1593</strong>。だから100万円×1.1593≒<strong>115万9,300円</strong>です。」</p><p>「途中も見ます。1年後103万円、2年後106.09万円。単利なら毎年3万円ずつ増えるだけですが、複利では利息にも利息が付くので、5年後は115万円ではなく約115.9万円になります。」</p><p>「では問題文が『5年後に100万円必要。年3%で運用するとして今いくら必要か』だったら？ これは100万円を未来へ増やす問題ではありません。未来100万円から現在へ戻すので<strong>現価係数</strong>です。」</p><p>「試験では数字より、この向きを見抜けるかが先です。<strong>今ある金額×係数→将来額</strong>なら終価係数。はい、ここです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜今100万円を5年間運用した将来額を求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終価係数です。現在の一括資金から将来の一括資金へ進むからです。」</p></div></details><h4>Q2｜年3%で100万円は2年後いくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「100万円×1.03²＝106.09万円です。2年目は103万円全体に3%が付きます。」</p></div></details><h4>Q3｜『5年後100万円』という言葉があれば終価係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「違います。今あるお金を5年後へ増やすなら終価係数。5年後100万円のため今いくら必要かなら現価係数です。」</p></div></details>", "R": "<p>「現在の一括資金→将来の一括資金。複利なので毎年(1＋利率)倍。将来額＝現在額×終価係数。これだけ一本につないでください。」</p>", "M": "<p>「<strong>終価係数＝今ある一括資金を複利で運用した将来額を求める。</strong>」</p>"}}, {"title": "現価係数", "content": {"A": "<h3>A｜要点</h3><p>「現価係数は終価係数を逆向きにしたものです。<strong>将来必要な一括金額 → 今いくら用意すればよい？</strong>を求めます。」</p><p>「5年後に100万円必要。でも今から運用できるなら、今100万円全部を用意する必要はありませんよね。その“今必要な額”へ割り戻すのが現価係数です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「終価係数では、今のお金に1.03を何回も掛けました。現価係数では逆です。未来の金額から現在へ戻るので、<strong>(1＋利率)の年数乗で割る</strong>方向になります。」</p><p>「年3%・5年なら、将来額＝現在額×1.03⁵でした。式を逆にすると、現在額＝将来額÷1.03⁵です。」</p><p>「ここで大事なのが“現在価値”という考え方です。5年後の100万円と今の100万円は、運用できる前提なら同じ価値として扱いません。今のお金には5年間増える時間があるからです。」</p><p>「だから、将来100万円を確保するための現在額は100万円より小さくなります。利率がプラスなら、通常、現価係数は1より小さくなります。」</p><p>「流れは、<strong>将来の目標額 → 複利分を割り戻す → 現在必要な一括資金</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「5年後の日付が書かれた箱に100万円必要だとします。先輩は今、その箱を満杯にするためのお金を準備します。」</p><p>「でも今入れたお金は5年間運用できます。今86万円台を入れて、それが毎年3%ずつ育つなら、5年後には約100万円になります。」</p><p>「つまり現価係数は、未来の箱から逆算して『今日はいくら入れればいい？』と戻ってくる考え方です。」</p><p>「終価係数が“今→未来”の早送りなら、現価係数は“未来→今”の巻き戻し。はい、この対比が一番分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「5年後に100万円必要、年3%で複利運用できるとします。」</p><p>「現在必要額＝100万円÷1.03⁵。1.03⁵≒1.1593なので、100万円÷1.1593≒<strong>86万2,600円</strong>です。」</p><p>「確認すると、約86.26万円を5年間3%で運用すると、86.26×1.03⁵≒100万円。ちゃんと未来の目標額へ戻ります。」</p><p>「では『今86.26万円ある。5年後いくら？』なら、今度は逆に終価係数です。同じ数字でも、問題が聞いている方向が反転すれば使う係数も反転します。」</p><p>「試験では、<strong>“将来必要額が先に与えられ、現在必要額を聞く”→現価係数</strong>と判断してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜5年後に300万円必要。今いくら用意すればよいか。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現価係数です。未来の目標額から現在必要額へ戻る問題だからです。」</p></div></details><h4>Q2｜なぜ現在必要額は将来必要額より小さくなり得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現在から将来まで運用して増やせるからです。その増加分をあらかじめ将来額から割り戻します。」</p></div></details><h4>Q3｜終価係数との違いを方向で答えると？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終価係数は現在→将来。現価係数は将来→現在です。」</p></div></details>", "R": "<p>「将来の一括目標額→今必要な一括資金。将来額を複利分だけ割り戻す。これが現価係数です。」</p>", "M": "<p>「<strong>現価係数＝将来必要な一括金額から、今必要な金額を逆算する。</strong>」</p>"}}, {"title": "年金終価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、ここから“一括”ではなく“毎年”になります。年金終価係数は、<strong>毎年一定額を積み立てたら、将来合計いくらになるか</strong>を求める係数です。」</p><p>「毎年10万円ずつ5年間積み立てる。そのお金を運用した結果、5年後にいくら貯まるか。これが典型です。」</p><p>「終価係数との違いは明確です。終価係数は<strong>今ある一括金</strong>、年金終価係数は<strong>毎年の積立</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ10万円×5年＝50万円で終わらないのか。積み立てたお金も運用されるからです。」</p><p>「毎年末積立を前提に考えると、最初に積み立てた10万円はその後長く運用されます。次の10万円はそれより1年短い。最後に積み立てる10万円は運用期間がほとんどありません。」</p><p>「つまり、同じ10万円でも“働く時間”が違うんです。その一つ一つの将来価値を全部足したものを、まとめて計算できるのが年金終価係数です。」</p><p>「式の意味は、<strong>毎年の積立額×年金終価係数＝一定期間後の積立総額</strong>です。」</p><p>「先輩、減債基金係数と混ざりますよね。年金終価係数は『毎年10万円積むと5年後いくら？』。減債基金係数は『5年後100万円にするには毎年いくら積む？』。入力と答えが逆なんです。」</p><p>「流れは、<strong>毎年一定額を積む → 各積立金がそれぞれ複利運用される → 将来の合計額</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「5年間、毎年末に10万円札の束を一つずつ棚へ置くイメージです。」</p><p>「1年目の束は早く棚に置かれるので長く運用されます。2年目の束は少し短い。5年目の束は最後に置かれるので、運用される時間が短い。」</p><p>「棚にある全部の束を5年目の同じ時点まで運んで、その合計を見る。これが年金終価係数です。」</p><p>「終価係数みたいに最初から50万円を一括で置いたわけではありません。お金が<strong>毎年少しずつ入ってくる</strong>。だから別の係数になるんですよ。」</p>", "D": "<h3>D｜具体例</h3><p>「毎年末10万円を5年間、年3%で積み立てるとします。」</p><p>「年金終価係数は、毎年末払いなら <strong>((1.03⁵－1)÷0.03)≒5.3091</strong>。したがって10万円×5.3091≒<strong>53万910円</strong>です。」</p><p>「元本だけなら10万円×5＝50万円。それが約53.1万円になるのは、先に積み立てたお金に運用益が付いたからです。」</p><p>「では問題を反対にして、『5年後に53万円作りたい。毎年いくら積めばいい？』と聞かれたら、年金終価係数ではなく<strong>減債基金係数</strong>を使う側になります。」</p><p>「さらに『今50万円を一括で持っていて5年後いくら？』なら終価係数。<strong>一括か毎年か、求めるのが将来額か毎年額か</strong>。この二段階で見れば6係数はかなり整理できます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎年20万円を10年間積み立てた将来額を求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数です。“毎年の積立額”が分かっていて、“将来の合計額”を求めるからです。」</p></div></details><h4>Q2｜なぜ単純な積立額×年数より将来額が大きくなり得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「先に積み立てたお金が運用され、運用益を生むからです。各年の積立金で運用期間が違います。」</p></div></details><h4>Q3｜減債基金係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。」</p></div></details>", "R": "<p>「毎年一定額→将来の積立総額。各年の積立金は運用期間が違う。毎年額×年金終価係数＝将来額。減債基金係数とは逆向きです。」</p>", "M": "<p>「<strong>年金終価係数＝毎年一定額を積み立てたときの将来の合計額を求める。</strong>」</p>"}}, {"title": "減債基金係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、減債基金係数は名前がいちばん怖そうですけど、聞いていることはかなり素直です。<strong>将来この金額を作りたい。そのために毎年いくらずつ積み立てればいい？</strong>――これを求めます。」</p><p>「たとえば10年後に300万円必要。でも今300万円を持っているわけではない。毎年少しずつ積み立てて300万円へ到達したい。こういう場面です。」</p><p>「一文なら、<strong>将来の目標額から、毎年の積立額を逆算する係数</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず、300万円÷10年＝毎年30万円でいいんじゃないか、って思いますよね。利息がゼロなら、その考え方でいいです。でも運用利率があるなら違います。」</p><p>「1年目に積み立てたお金は長く運用されます。2年目のお金はそれより1年短い。最後に積み立てるお金はほとんど運用されません。つまり、積み立てた元本だけで300万円を作る必要はなく、途中の<strong>運用益も300万円の一部</strong>になってくれるんです。」</p><p>「だから毎年必要な積立額は、単純な300万円÷年数より小さくなり得ます。その複利効果をまとめて逆算するのが減債基金係数です。」</p><p>「式の形は、<strong>毎年の積立額＝将来の目標額×減債基金係数</strong>です。」</p><p>「ここで年金終価係数との関係を見ます。年金終価係数は『毎年30万円積んだら10年後いくら？』。減債基金係数は『10年後300万円にしたいなら毎年いくら？』。同じ積立の話ですが、<strong>分かっているものと求めるものが逆</strong>なんです。」</p><p>「流れは、<strong>将来の目標額を決める → 利率と期間を確認する → 運用益を考慮する → 必要な毎年積立額へ戻す</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「10年後、車を買う日に“300万円”と書かれた大きな箱を満杯にしたいとします。」</p><p>「先輩は毎年、同じ大きさのお金の袋をその箱へ入れていきます。ただし、早く入れた袋ほど長く運用されて少し大きくなります。1年目の袋は長く働き、9年目の袋は短く働く。最後の袋はほとんど働く時間がありません。」</p><p>「だから10個の袋の元本を足しただけで300万円にする必要はありません。袋が働いて増えた分も含めて、最後に箱が300万円になればいいんです。」</p><p>「この“最後の箱の大きさは決まっている。では毎年入れる袋はいくら？”という逆算が減債基金係数です。」</p>", "D": "<h3>D｜具体例</h3><p>「5年後に100万円を作りたい。年3%で、毎年末に同額を積み立てるとします。」</p><p>「年金終価係数は約5.3091です。これは『毎年1円ずつ積むと5年後に約5.3091円になる』という意味です。では5年後100万円にしたいなら、100万円を5.3091で割ればいい。」</p><p>「100万円÷5.3091≒<strong>18万8,356円</strong>。つまり毎年約18.84万円ずつ積み立てれば、運用益を含めて5年後に約100万円へ届く計算です。」</p><p>「単純に100万円÷5＝20万円とするより少ないですよね。この差が運用益です。」</p><p>「ここで問題が『毎年18.84万円積み立てると5年後いくら？』に変わったら、今度は年金終価係数です。<strong>将来額→毎年額が減債基金、毎年額→将来額が年金終価</strong>。この矢印で覚えてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜10年後500万円を作るため、毎年いくら積み立てるかを求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「減債基金係数です。将来の目標額が先に決まり、毎年の積立額を求めているからです。」</p></div></details><h4>Q2｜なぜ『目標額÷年数』だけでは不十分？</h4><details><summary>答えを見る</summary><div class='answer'><p>「積立金が途中で運用され、運用益も最終目標額の一部になるからです。各年の積立金は運用される期間も違います。」</p></div></details><h4>Q3｜年金終価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。」</p></div></details>", "R": "<p>「30秒です。将来の目標額が先。そこから毎年積立額へ逆算。運用益があるので単純な目標額÷年数とは違う。年金終価係数とは矢印が逆。はい、これです。」</p>", "M": "<p>「<strong>減債基金係数＝将来の目標額を作るための毎年の積立額を求める。</strong>」</p>"}}, {"title": "資本回収係数", "content": {"A": "<h3>A｜要点</h3><p>「資本回収係数は、今度は“今あるまとまったお金”を毎年の金額へ変える係数です。<strong>今ある元本を運用しながら一定期間で取り崩すと、毎年いくら受け取れる？</strong>を求めます。」</p><p>「退職時に1,000万円ある。この1,000万円を運用しながら10年間で使うなら、毎年いくら受け取れるか。これが典型です。」</p><p>「住宅ローンなどで、現在借りた金額から毎年の返済額を求める考え方にもつながります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、1,000万円を10年なら毎年100万円でしょ、ってなりますよね。利率ゼロならそうです。でも残っているお金を運用できるなら、毎年100万円より多く取り出しても10年間持たせられます。」</p><p>「最初に100万円を受け取ったあとも、残り900万円前後は運用されています。その運用益も次の受取資金になります。だから元本÷年数だけではないんです。」</p><p>「資本回収係数は、その<strong>元本＋運用益を一定期間で均等に回収する</strong>ための毎年額を計算します。」</p><p>「式は、<strong>毎年受取額＝現在の元本×資本回収係数</strong>です。」</p><p>「年金現価係数との違い、ここ絶対混ざります。年金現価係数は『毎年100万円受け取りたい。今いくら必要？』。資本回収係数は『今1,000万円ある。毎年いくら受け取れる？』。これも逆向きです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「退職日に1,000万円入りのタンクがあると思ってください。毎年、タンクから同じ量のお金を生活費として取り出します。」</p><p>「ただしタンクは置いてあるだけじゃありません。残っているお金が運用され、少しずつ水が追加されるように増えます。」</p><p>「だから“1,000万円÷10回”より多く取り出しても、運用益が補充してくれる分があります。そして10年後にちょうど使い切るよう、毎年取り出せる額を決める。」</p><p>「これが資本回収です。<strong>今の大きな一つの資金を、将来の毎年の受取へ分解する</strong>イメージですね。」</p>", "D": "<h3>D｜具体例</h3><p>「今100万円あり、年3%で運用しながら5年間、毎年末に同額ずつ受け取って5年後に使い切るとします。」</p><p>「年金現価係数は約4.5797なので、資本回収係数はその逆数で約0.21835。100万円×0.21835≒<strong>21万8,350円</strong>です。」</p><p>「利率ゼロなら100万円÷5＝20万円。それより約1.84万円多く毎年受け取れるのは、残っている資金が運用益を生むからです。」</p><p>「では『5年間、毎年21万8,350円を受け取りたい。今いくら必要？』なら方向が逆になり、年金現価係数です。」</p><p>「<strong>現在元本→毎年額＝資本回収。毎年額→現在元本＝年金現価</strong>。名前より矢印です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜今2,000万円ある。20年間で毎年いくら取り崩せるか。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資本回収係数です。現在の一括元本から毎年額を求めています。」</p></div></details><h4>Q2｜なぜ元本÷年数より多く受け取れる場合がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「残っている元本を運用して得る利益も、受取原資に使えるからです。」</p></div></details><h4>Q3｜年金現価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資本回収は現在元本→毎年額。年金現価は毎年額→現在元本です。」</p></div></details>", "R": "<p>「現在の一括元本→毎年の受取額。残った元本の運用益も使う。年金現価係数とは逆向き。これが資本回収係数です。」</p>", "M": "<p>「<strong>資本回収係数＝今ある元本を運用しながら取り崩すときの毎年額を求める。</strong>」</p>"}}, {"title": "年金現価係数", "content": {"A": "<h3>A｜要点</h3><p>「年金現価係数は、<strong>将来、毎年一定額を受け取るために、今いくら元本が必要か</strong>を求めます。」</p><p>「たとえば老後5年間、毎年100万円ずつ受け取りたい。では退職時点でいくら持っていればいいのか。これを現在の一括金額へ戻す係数です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「単純なら100万円×5年＝500万円ですよね。でも元本を運用しながら受け取るなら、最初から500万円全部は必要ありません。」</p><p>「1年後に受け取る100万円と、5年後に受け取る100万円では、今必要な金額が違います。5年後の100万円は5年間運用して増やせるので、現在価値はより小さくなります。」</p><p>「その各年の受取額を一つずつ現在価値へ割り引いて、全部足したものが“今必要な元本”です。それをまとめて計算するのが年金現価係数です。」</p><p>「式は、<strong>現在必要額＝毎年の受取額×年金現価係数</strong>。」</p><p>「現価係数との違いにも注意です。現価係数は将来の一回の金額を現在へ戻す。年金現価係数は<strong>毎年続く複数回の金額</strong>をまとめて現在へ戻します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「退職後、毎年100万円入りの封筒を5回受け取りたいとします。」</p><p>「1年後の封筒、2年後の封筒、3年後……それぞれ受け取る時期が違います。だから今日準備しておく金額も同じではありません。」</p><p>「遠い将来の封筒ほど、今から長く運用できます。そこで5枚の封筒をそれぞれ現在まで巻き戻して、『今日まとめていくらあれば全部の封筒を作れる？』と足し合わせます。」</p><p>「これが年金現価係数です。未来に並んだ複数の受取を、現在の一つの元本へまとめるイメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「今後5年間、毎年末100万円ずつ受け取りたい。年3%で運用できるとします。」</p><p>「年3%・5年の年金現価係数は約<strong>4.5797</strong>。100万円×4.5797＝<strong>約457万9,700円</strong>です。」</p><p>「単純合計は500万円ですが、今約458万円あれば、残高を3%で運用しながら毎年100万円ずつ受け取る設計ができるということです。」</p><p>「『5年後に一回だけ500万円欲しい』なら年金現価係数ではありません。一回だけの将来額を今へ戻すので現価係数です。」</p><p>「『今458万円ある。毎年いくら受け取れる？』なら資本回収係数。ここも矢印で区別してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜10年間、毎年50万円受け取るため今いくら必要か。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金現価係数です。毎年の受取額から現在必要な一括元本を求めています。」</p></div></details><h4>Q2｜なぜ50万円×10年より少ない元本で済み得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「残っている元本を受取期間中も運用でき、その運用益も将来の受取に使えるからです。」</p></div></details><h4>Q3｜現価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現価係数は将来の一回の金額→現在額。年金現価係数は将来の毎年の金額→現在額です。」</p></div></details>", "R": "<p>「毎年の受取額→今必要な一括元本。複数回の将来受取を現在へ割り戻して合計する。これが年金現価係数です。」</p>", "M": "<p>「<strong>年金現価係数＝将来毎年受け取る金額から、今必要な元本を求める。</strong>」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<h3>A｜要点</h3><p>「先輩、こども保険、いわゆる学資保険は、<strong>子どもの進学時期に合わせて教育資金を準備するための生命保険</strong>です。」</p><p>「ただ貯金するだけではなく、商品によっては契約者である親などが死亡・所定の高度障害状態になった場合に、その後の保険料払込みが免除されても祝い金や満期保険金を受け取れる仕組みがあります。」</p><p>「つまり中心は、<strong>教育資金の積立＋契約者に万一があったときの保障</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「教育費って必要になる時期がある程度決まっていますよね。高校入学、大学入学などです。だから子どもが小さいうちから保険料を積み立て、決めた時期に祝い金や満期保険金を受け取れるよう設計します。」</p><p>「ここで普通の預金との違いが出ます。親が途中で亡くなった場合、預金ならその後の積立は止まってしまうかもしれません。でも学資保険には、契約内容によって<strong>保険料払込免除</strong>が付いているものがあります。」</p><p>「つまり親に万一があっても、以後の保険料負担を免除しながら、予定していた教育資金を確保する方向へ働くわけです。」</p><p>「ただし、“学資保険なら必ず払込保険料より多く戻る”とは限りません。契約条件、返戻率、特約、途中解約の時期などで結果は変わります。特に早期解約では解約返戻金が払込保険料総額を下回ることがあります。」</p><p>「ですから、教育資金を準備する目的と保障機能を理解したうえで、流動性や返戻率も見る必要があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「子どもが0歳、大学入学まで18年ある家庭を一つ追います。」</p><p>「親は18歳の春に入学金などでまとまったお金が必要になると考え、毎月学資保険の保険料を払います。18年間かけて“大学入学の日に開ける教育資金の箱”を作っているイメージです。」</p><p>「ところが子どもが10歳のとき、契約者である親に万一があったとします。ここで払込免除の条件を満たす契約なら、その後の保険料負担が免除されても、契約上の祝い金・満期保険金を受け取る保障が続きます。」</p><p>「これが、単純に銀行口座へ積み立てる場合にはない“保険”の部分です。教育資金を作るだけではなく、<strong>教育資金を作っている途中で親に何かあったリスク</strong>にも備えるわけですね。」</p>", "D": "<h3>D｜具体例</h3><p>「子どもが18歳のときに200万円を受け取る学資保険を考えます。親が契約者、子どもが被保険者という典型的な形です。」</p><p>「親が契約期間を通じて保険料を払い続ければ、契約に従って進学時期の祝い金や満期保険金を受け取ります。」</p><p>「では途中で親が死亡した場合。払込免除特約等の所定条件を満たすなら、その後の保険料払込みが免除され、それでも教育資金の保障は契約どおり継続します。」</p><p>「一方で、子どもが5歳の時点で『やっぱり全部解約しよう』となれば、解約返戻金がそれまでの払込保険料より少ない可能性があります。だから“いつでも自由に引き出せる教育用預金”とは性格が違います。」</p><p>「試験では、<strong>教育資金準備が目的／保険なので保障機能がある／途中解約では元本割れの可能性</strong>という三点をつなげてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜学資保険の中心的な目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「子どもの進学時期などに必要な教育資金を計画的に準備することです。」</p></div></details><h4>Q2｜普通の積立預金にはない代表的な保障機能は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「商品・契約条件によりますが、契約者である親などに万一があった場合の保険料払込免除などがあります。」</p></div></details><h4>Q3｜途中解約すれば、それまで払った保険料は必ず全額戻る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必ずではありません。解約時期や契約内容によって、解約返戻金が払込保険料総額を下回ることがあります。」</p></div></details>", "R": "<p>「教育資金を決まった時期へ準備する生命保険。親などの万一に対する払込免除がある商品もある。ただし途中解約や返戻率には注意。これです。」</p>", "M": "<p>「<strong>学資保険＝教育資金を積み立てながら、積立途中の親の万一にも備えられる生命保険。</strong>」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<h3>A｜要点</h3><p>「教育一般貸付、いわゆる国の教育ローンは、<strong>日本政策金融公庫が扱う、入学金・授業料などの教育費を準備するための公的な融資制度</strong>です。」</p><p>「ここで最初に奨学金と分けます。国の教育ローンは基本的に<strong>保護者などが借りる</strong>もの。奨学金は学生本人が貸与を受け、本人が返還するタイプが中心です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「大学入学時って、授業料だけじゃありません。入学金、受験費用、住居費、教科書代など、短期間にまとまった資金が必要になることがあります。」</p><p>「そこで、家庭の手元資金だけでは不足するときに、保護者等が教育費として借りる選択肢が国の教育ローンです。公的制度なので、利用には世帯年収など所定の要件があります。」</p><p>「先輩、ここで“国がくれるお金”ではありませんよ。<strong>貸付ですから返済が必要</strong>です。」</p><p>「そして奨学金との最大の整理ポイントは債務者です。国の教育ローンでは保護者側が借入・返済の主体になるのが基本。貸与型奨学金では学生本人が借り、卒業後などに本人が返還します。」</p><p>「教育費を準備するという目的は同じでも、<strong>誰がお金を借り、誰が返すのか</strong>が違う。ここを軸にすると混ざりません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「高校3年生の子どもが大学に合格した家庭を考えます。入学までに入学金と前期授業料などでまとまった資金が必要になりました。」</p><p>「親の預金だけでは少し足りない。そこで親が日本政策金融公庫へ教育資金の融資を申し込みます。融資を受けたお金を入学金などに使い、その後は親が契約に従って返済していきます。」</p><p>「一方、子ども自身が日本学生支援機構などの貸与型奨学金を利用した場合、基本的には子ども本人が借りた人となり、将来本人が返還します。」</p><p>「同じ大学費用でも、左側には“親が借りる国の教育ローン”、右側には“学生本人が借りる貸与型奨学金”。この二人の立ち位置を分けてください。」</p>", "D": "<h3>D｜具体例</h3><p>「大学入学時に150万円不足している家庭を考えます。」</p><p>「親が国の教育ローンから150万円を借りれば、その150万円は教育費に充てられます。ただし150万円は給付金ではなく借金なので、契約した金利・返済条件に従って親側が返済します。」</p><p>「別の方法として、学生本人が貸与型奨学金を利用する場合があります。この場合は学生本人が借り手となり、卒業後などに返還していく形が基本です。」</p><p>「だから試験で『国の教育ローンと奨学金はどちらも教育費だから同じ』とまとめたら駄目です。<strong>国の教育ローン＝主に保護者が借りる融資、貸与型奨学金＝学生本人が借りる仕組み</strong>という違いがあります。」</p><p>「なお、融資限度額・金利・所得要件などは改定されることがあります。数値問題では必ず受験年度の基準を使ってください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜国の教育ローンは給付金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「違います。教育費のための融資なので、借りたお金は返済する必要があります。」</p></div></details><h4>Q2｜国の教育ローンでは、誰が借りるのが基本？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保護者などです。貸与型奨学金で学生本人が借りる形との違いが重要です。」</p></div></details><h4>Q3｜国の教育ローンと貸与型奨学金を区別する一番分かりやすい軸は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「誰が借入・返済の主体になるかです。目的はどちらも教育資金ですが、債務者が異なります。」</p></div></details>", "R": "<p>「日本政策金融公庫の教育向け融資。主に保護者が借りて返す。給付ではない。貸与型奨学金は学生本人が借りるのが基本。ここまでです。」</p>", "M": "<p>「<strong>国の教育ローン＝教育費のために主に保護者が借りる公的融資。</strong>」</p>"}}, {"title": "奨学金制度", "content": {"A": "<h3>A｜要点</h3><p>「先輩、奨学金は“学生が学ぶためのお金を支える制度”です。ただし、ここで最初に<strong>給付型と貸与型</strong>を分けてください。」</p><p>「給付型は原則として返還不要。貸与型は借りるお金なので返還が必要です。日本学生支援機構の貸与型には、代表的に<strong>第一種＝無利子、第二種＝有利子</strong>があります。」</p><p>「国の教育ローンとの大きな違いは、貸与型奨学金では<strong>学生本人が借り手・返還者になる</strong>のが基本だということです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「大学へ行きたい。でも家庭だけでは学費を十分に用意できない。そこで修学機会を支えるのが奨学金です。」</p><p>「まず給付型。これは一定の家計・学業等の要件を満たす学生に支給され、原則として卒業後に返す必要がありません。」</p><p>「次に貸与型。名前のとおり“貸してもらう”ので、卒業後などに返還します。第一種は無利子、第二種は有利子という違いが基本です。」</p><p>「ここで『無利子なら返さなくていい？』……先輩、それは違います。無利子は<strong>利息が付かない</strong>のであって、借りた元本まで消えるわけではありません。第一種も貸与型ですから返還します。」</p><p>「そして前の項目、国の教育ローンとつなげます。国の教育ローンは主に保護者が借りて返済する融資。貸与型奨学金は学生本人が借りて返還する。この“誰の債務か”が重要です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「大学へ進学するAさんを一人追います。入学後、毎月の学費・生活費が不足するため奨学金を利用します。」</p><p>「もし給付型の対象なら、支給されたお金は原則返還不要です。一方、第二種奨学金で毎月貸与を受ければ、そのお金はAさん自身の借入です。」</p><p>「在学中は“毎月お金が入ってくる”ので給付と貸与が似て見えます。でも卒業後を見ると違いがはっきりします。給付型には原則返還がなく、貸与型ではAさん本人の返還が始まります。」</p><p>「だから奨学金を見るときは、<strong>今もらえるか</strong>だけではなく、<strong>将来返すお金なのか</strong>まで時間を進めて見るんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが大学4年間、貸与型奨学金を利用したとします。毎月5万円なら、単純な貸与元本は5万円×12か月×4年＝<strong>240万円</strong>です。」</p><p>「第一種なら無利子なので、基本的にはこの貸与元本を返還していく考え方です。第二種なら有利子なので、利息も関係します。」</p><p>「一方、同じ5万円でも給付型として支給されたものなら、所定要件を満たしている限り原則返還不要です。同じ“毎月5万円”でも法的・経済的な意味はまったく違います。」</p><p>「そして親が国の教育ローンで240万円を借りたなら、今度は親側の借入です。<strong>給付か貸与か → 貸与なら無利子か有利子か → 誰が借りているか</strong>。この順番で整理してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜第一種奨学金は無利子だから返還不要？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。第一種は無利子の“貸与型”なので、元本の返還は必要です。」</p></div></details><h4>Q2｜第二種奨学金の基本的な特徴は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「有利子の貸与型です。給付型とは違い、借りた本人が返還します。」</p></div></details><h4>Q3｜国の教育ローンとの大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「貸与型奨学金は学生本人が借り手になるのが基本なのに対し、国の教育ローンは主に保護者が借ります。」</p></div></details>", "R": "<p>「給付型＝原則返還不要。貸与型＝返還必要。第一種＝無利子、第二種＝有利子。貸与型は学生本人が借りるのが基本。はい、この4本です。」</p>", "M": "<p>「<strong>奨学金は、給付か貸与かを最初に分け、貸与型は第一種＝無利子・第二種＝有利子と整理する。</strong>」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<h3>A｜要点</h3><p>「固定金利期間選択型は、住宅ローンの金利を<strong>最初から最後まで固定するのではなく、当初の一定期間だけ固定する</strong>方式です。」</p><p>「たとえば“当初10年固定”。最初の10年間は適用金利が固定され、その期間が終わった後は、その時点の条件に応じて金利タイプを選び直すなどします。」</p><p>「だから特徴は、<strong>固定期間中は返済計画を立てやすい。でも固定期間終了後には金利変動リスクが戻ってくる</strong>、です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンは長いですよね。30年、35年という返済期間も珍しくありません。その全部を固定するのが全期間固定金利型です。」</p><p>「一方、固定金利期間選択型では、2年、5年、10年など一定期間だけ金利を固定します。その間は市場金利が上がっても、原則として契約した固定期間の適用金利は変わりません。」</p><p>「問題は固定期間が終わった後です。その時点の金利水準で、再び固定を選ぶ、変動金利へ移るなど、商品条件に沿って次の金利が決まります。」</p><p>「先輩、『10年固定なら10年後にローンが終わる？』……違いますよ。<strong>固定される期間とローンの返済期間は別</strong>です。35年ローンで当初10年固定なら、残り25年があります。」</p><p>「つまり、当初の安心と、その後の金利変動可能性を組み合わせたタイプなんです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「35年間の長い道路を車で走ると思ってください。最初の10kmだけ“速度が固定された専用レーン”に入ります。」</p><p>「その10kmでは周囲の交通状況、つまり市場金利が変わっても、自分の設定は固定されています。」</p><p>「でも10kmを抜けたら専用レーンは終了です。その先では、その時点の道路状況に合わせて次の走り方を決めます。」</p><p>「全期間固定なら35km全部が固定レーン。変動金利なら途中で金利が見直される可能性がある。固定金利期間選択型はその中間、とイメージすると分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「3,000万円を35年返済で借り、当初10年間を固定金利にしたとします。」</p><p>「借入から10年間は、その固定期間に定められた金利を基礎に返済します。この間に市場金利が上昇しても、“市場が上がったから翌月すぐ適用金利も上がる”というタイプではありません。」</p><p>「でも11年目以降は別です。固定期間終了時の金利水準が高くなっていれば、次に選ぶ金利条件によっては返済負担が増える可能性があります。」</p><p>「だから『固定金利だから35年間安心』は誤り。正しくは<strong>固定を選択した期間について金利が固定される</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜35年ローンで10年固定を選ぶと、10年で返済終了？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。10年は金利を固定する期間であって、返済期間そのものではありません。」</p></div></details><h4>Q2｜固定期間中に市場金利が上昇したら、適用金利はすぐ上がる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「固定期間中は原則として契約した固定金利が適用されます。」</p></div></details><h4>Q3｜全期間固定との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「全期間固定は返済期間を通じて金利を固定します。固定金利期間選択型は一定期間だけ固定し、終了後は再設定されます。」</p></div></details>", "R": "<p>「一定期間だけ固定。期間中は金利が安定。期間終了後はその時点の条件で再設定。返済期間と固定期間は別。ここです。」</p>", "M": "<p>「<strong>固定金利期間選択型＝住宅ローンのうち、選んだ一定期間だけ金利を固定する方式。</strong>」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<h3>A｜要点</h3><p>「ここは名前を分解します。<strong>元利均等＝元金＋利息を合わせた毎回の返済額をほぼ一定</strong>。<strong>元金均等＝毎回返す元金部分を一定</strong>です。」</p><p>「元利均等は返済額が安定して家計管理しやすい。元金均等は最初の返済額が大きい代わりに元金が早く減り、同条件なら総利息を抑えやすい。これが大きな違いです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず利息は何にかかるか。基本は<strong>その時点のローン残高</strong>です。だから元金を早く減らせば、その後の利息も小さくなります。」</p><p>「元利均等では、毎月の“元金＋利息”をほぼ一定にします。返済初期は残高が大きいので利息部分が多く、その分、元金返済部分は小さめです。返済が進むと利息が減り、同じ返済額の中で元金部分が増えていきます。」</p><p>「元金均等では、元金部分を毎回同じ額ずつ返します。そこへ残高に応じた利息を足します。最初は残高が大きいので利息も大きく、返済額は重い。でも元金が一定のペースでしっかり減るので、利息もどんどん小さくなります。」</p><p>「だから同じ借入額・金利・返済期間なら、一般に<strong>当初返済額は元金均等の方が大きい／総返済額は元金均等の方が小さくなりやすい</strong>という関係になります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100個の重い箱が積まれていて、その箱の数に応じて毎回“利息”という使用料がかかると思ってください。」</p><p>「元金均等は毎回同じ数の箱を確実に片づけます。だから箱の山が早く低くなり、次回以降の使用料も早く減ります。」</p><p>「元利均等は“毎回払う総額を同じにする”ことを優先します。最初は使用料が高いので、箱そのものを片づける分は少なくなります。」</p><p>「どちらも最終的には返します。でも<strong>返済額を平らにするのか、元金の減り方を平らにするのか</strong>が違うんです。」</p>", "D": "<h3>D｜具体例</h3><p>「仕組みが見えるように、120万円を年12%・12回払いという単純化した例で考えます。実際の商品条件ではなく比較用ですよ。」</p><p>「元金均等なら元金は毎回10万円。最初の月の利息を単純に月1%とすれば、120万円×1%=1万2,000円。初回返済は<strong>11万2,000円</strong>です。」</p><p>「1回返すと元金残高は110万円。次の利息は1万1,000円なので、2回目返済は<strong>11万1,000円</strong>。こうして返済額が徐々に下がります。」</p><p>「元利均等では、毎回の総返済額を一定にするよう計算します。初期は利息の割合が大きく、後半になるほど元金部分が増えます。」</p><p>「試験で『元金均等返済は毎回の返済総額が一定』と出たら×です。一定なのは<strong>元金部分</strong>。毎回の総額がほぼ一定なのが元利均等です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎回の元金＋利息の返済額をほぼ一定にするのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「元利均等返済です。」</p></div></details><h4>Q2｜同条件なら、元金が早く減り総利息を抑えやすいのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「元金均等返済です。毎回一定額の元金を返すので残高が早く減ります。」</p></div></details><h4>Q3｜元金均等返済の毎回の総返済額は一定？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。元金部分が一定で、利息は残高とともに減るので、総返済額も通常は徐々に減ります。」</p></div></details>", "R": "<p>「元利均等＝総返済額を平らに。元金均等＝元金部分を平らに。元金均等は当初重いが残高が早く減り、総利息を抑えやすい。これです。」</p>", "M": "<p>「<strong>元利均等は“支払額一定”、元金均等は“元金一定”。</strong>」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<h3>A｜要点</h3><p>「繰上げ返済は、住宅ローンなどで<strong>予定より早く元金の一部を返す</strong>ことです。」</p><p>「その効果の出し方が二つ。<strong>期間短縮型＝毎回の返済額を大きく変えず、完済を早める</strong>。<strong>返済額軽減型＝返済期間を大きく変えず、毎回の返済額を下げる</strong>です。」</p><p>「同じ金額を同じ時点で繰り上げるなら、一般に期間短縮型の方が利息軽減効果は大きくなりやすいです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ繰上げ返済で利息が減るのか。追加で払ったお金が<strong>元金の返済</strong>に充てられるからです。」</p><p>「たとえば残高2,000万円のうち100万円を先に返せば、その100万円はもう将来のローン残高として残りません。なら、その100万円に将来かかるはずだった利息も発生しなくなります。」</p><p>「期間短縮型では、毎月返済額をおおむね維持しながら、後ろの返済期間を切り落とします。利息が発生する期間そのものが短くなるので、利息軽減効果が大きくなりやすいです。」</p><p>「返済額軽減型では、完済時期を大きく変えず、残った期間の毎回返済額を再計算して下げます。総利息も減りますが、“今後の月々の負担を軽くする”効果を重視する方法です。」</p><p>「ですから、目的が<strong>総支払利息をより減らしたい</strong>なら期間短縮型、<strong>毎月の家計を楽にしたい</strong>なら返済額軽減型、という方向性で理解できます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「30段ある長い階段を、毎月1段ずつ下りて完済するイメージです。途中で繰上げ返済という“5段分のジャンプ”ができるとします。」</p><p>「期間短縮型は、その場で5段飛ばして、今までと同じペースで進む。だからゴールへ5段分早く着きます。」</p><p>「返済額軽減型は、ゴールの日はなるべくそのままにして、残った階段を一段一段もっと軽い負担で下りるイメージです。」</p><p>「どちらも元金を先に減らしているので利息は減ります。ただ、期間短縮型は“利息が付く時間”まで削るので、利息削減効果が大きくなりやすいんです。」</p>", "D": "<h3>D｜具体例</h3><p>「住宅ローン返済中に、手元資金から100万円を繰上げ返済するとします。」</p><p>「期間短縮型なら、その100万円で将来返す予定だった元金を前倒しし、月々の返済額はおおむね維持したまま完済時期を早めます。たとえば残り20年だったものが、条件によって19年数か月になる、といった方向です。」</p><p>「返済額軽減型なら、残り20年という期間を基本的に維持しながら、100万円減った元金を基に毎月返済額を計算し直します。完済時期より、月々の負担を下げる方へ効果を使います。」</p><p>「ここで注意。繰上げ返済をすればするほど常に正解、ではありません。手元の生活予備資金まで使い切れば、急な病気や失業に対応できなくなります。FPではローン残高だけでなく家計全体を見る必要があります。」</p><p>「試験上の軸は、<strong>期間短縮＝完済を早める・利息軽減大きめ、返済額軽減＝期間を維持し月返済を下げる</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎月返済額を大きく変えず、完済を早めるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「期間短縮型です。」</p></div></details><h4>Q2｜毎月の家計負担を下げたい場合に向くのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「返済額軽減型です。返済期間を基本的に維持し、毎回の返済額を下げます。」</p></div></details><h4>Q3｜同額・同時点の繰上げ返済なら、一般に利息軽減効果が大きいのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「期間短縮型です。元金を前倒しするだけでなく、利息が発生する返済期間も短縮するためです。」</p></div></details>", "R": "<p>「繰上げ返済＝元金を前倒し。期間短縮型＝完済を早める。返済額軽減型＝月々を軽くする。利息削減は一般に期間短縮型が大きめ。これです。」</p>", "M": "<p>「<strong>期間短縮型は“早く終える”、返済額軽減型は“毎月を軽くする”。</strong>」</p>"}}, {"title": "財形住宅融資", "content": {"A": "<h3>A｜要点</h3><p>「財形住宅融資は、<strong>財形貯蓄をしている勤労者などが、一定の要件を満たして住宅取得・改良資金を借りられる公的な住宅融資制度</strong>です。」</p><p>「ポイントは“財形貯蓄をしている人向け”というつながりです。財形貯蓄と住宅取得支援がセットになっているんですね。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「会社員などが給与天引きで財形貯蓄を続けているとします。その人が住宅を購入・建設・改良するとき、一定の加入期間や残高などの要件を満たせば財形住宅融資を利用できる場合があります。」</p><p>「つまり誰でも住宅を買えば使える融資ではありません。<strong>財形制度を利用してきた勤労者</strong>であることが入口になります。」</p><p>「融資可能額については、財形貯蓄残高との関係や上限など所定のルールがあります。また金利の仕組みも、フラット35のような全期間固定とは異なります。」</p><p>「先輩、財形“住宅貯蓄”をしていないと絶対駄目、と思いました？ そこは名称に引っ張られないでください。財形住宅融資の利用要件では、対象となる<strong>財形貯蓄</strong>の加入状況を確認します。細かな加入期間・残高・融資上限等は受験年度の基準で押さえます。」</p><p>「試験では、財形貯蓄制度そのものと、そこから住宅取得時に利用できる融資制度を別々にしつつ、関係づけて覚えるのが大切です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが、毎月給与から自動的に財形貯蓄を続けているとします。」</p><p>「数年後、Aさんが家を買うことになりました。銀行の一般的な住宅ローンだけでなく、“これまで財形制度を利用してきた勤労者向けの住宅融資”という選択肢が出てきます。それが財形住宅融資です。」</p><p>「つまり、会社員としてコツコツ財形で貯める道と、住宅取得時に融資を受ける道が一本につながっています。」</p><p>「“住宅ローンの一種”だけで覚えるより、<strong>財形貯蓄を続けてきた人が住宅取得時に使う制度</strong>という人物像まで置くと忘れにくいですよ。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは勤務先を通じて財形貯蓄を継続し、住宅購入を考えています。」</p><p>「このときAさんは、財形貯蓄の加入期間や残高など所定要件を満たしているか確認し、財形住宅融資の対象になるか検討します。」</p><p>「一方、Bさんは財形制度をまったく利用していません。Bさんが住宅を買うからといって、“住宅という言葉が付くから財形住宅融資を当然利用できる”わけではありません。」</p><p>「ここがフラット35との違いを考える入口です。フラット35は住宅金融支援機構と民間金融機関が連携する全期間固定金利型住宅ローン。財形住宅融資は<strong>財形貯蓄を行う勤労者向けという利用者側の条件</strong>が大きな特徴です。」</p><p>「なお、加入期間、残高要件、融資限度額、金利などの具体的数値は改定され得るため、数値は受験年度の資料で確認してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜財形住宅融資は、誰でも住宅を買えば利用できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。財形貯蓄を行っている勤労者などについて、所定の加入期間・残高等の要件があります。」</p></div></details><h4>Q2｜制度の目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「財形制度を利用する勤労者の住宅取得・建設・改良などを融資面から支援することです。」</p></div></details><h4>Q3｜フラット35との分かりやすい違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「財形住宅融資は財形貯蓄を行う勤労者向けという利用要件が特徴です。フラット35は全期間固定金利型住宅ローンという金利構造が大きな特徴です。」</p></div></details>", "R": "<p>「財形貯蓄をしている勤労者向けの住宅融資。住宅を買うだけで誰でも対象ではない。フラット35とは制度の入口と金利構造が違う。これです。」</p>", "M": "<p>「<strong>財形住宅融資＝財形貯蓄を続ける勤労者の住宅取得を支える融資制度。</strong>」</p>"}}, {"title": "フラット35", "content": {"A": "<h3>A｜要点</h3><p>「先輩、フラット35の核は名前の“35”より、<strong>全期間固定金利</strong>です。民間金融機関と住宅金融支援機構が提携して提供する住宅ローンで、借入時に返済終了までの借入金利が確定します。」</p><p>「つまり返済途中で市場金利が上がっても、全期間固定という基本構造なら、それを理由に適用金利が上がるタイプではありません。長期間の返済計画を立てやすいのが大きな特徴です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンは数十年続きます。その間に世の中の金利が上がるか下がるかは分かりません。変動金利なら金利上昇が将来の返済負担に影響する可能性があります。」</p><p>「フラット35では、資金を受け取る時点で返済終了までの借入金利が確定します。だから“5年後に市場金利が上がったら返済金利も同じように上がるのでは”という不確実性を抑えられます。」</p><p>「ただし、“フラット35なら誰でも同じ金利”という意味ではありません。借入期間、融資率、団体信用生命保険の種類、取扱金融機関などによって借入金利は異なり得ます。また一定期間の金利引下げメニューもあります。」</p><p>「固定金利期間選択型との違いも重要です。当初10年固定なら、10年後に次の金利条件を考える必要があります。フラット35は基本的に<strong>借入時から返済終了まで全期間固定</strong>。ここが違います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「35年続く長い住宅ローンの道路を想像してください。」</p><p>「変動金利なら、道路の途中で金利という坂の傾斜が変わる可能性があります。当初10年固定なら、最初の10年間だけ傾斜を固定して、その後はまた条件が変わる可能性があります。」</p><p>「フラット35は、スタート地点でゴールまでの基本的な傾斜を決めて走り出すイメージです。世の中の金利が途中で上昇しても、自分のローンは全期間固定という設計です。」</p><p>「だから“将来の金利上昇が怖いので、返済計画を固めたい”という人にとって意味があるんですね。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが3,000万円を長期返済で借りるとします。」</p><p>「変動金利型なら、将来の金利見直しによって返済負担が変化する可能性があります。一方、フラット35なら借入時に返済終了までの借入金利が確定するので、将来の市場金利上昇による金利変動リスクを避けやすくなります。」</p><p>「ただし、“全期間固定＝必ず最も安い”ではありません。将来市場金利が下がった場合、固定された金利が相対的に高く見えることもあります。固定金利は将来の金利を当てる制度ではなく、<strong>返済条件の不確実性を減らす仕組み</strong>と考えてください。」</p><p>「試験では、<strong>住宅金融支援機構＋民間金融機関／全期間固定／最長35年が基本</strong>という柱を押さえます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜フラット35の最重要な金利上の特徴は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「全期間固定金利です。借入時に返済終了までの借入金利が確定します。」</p></div></details><h4>Q2｜当初10年固定型との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「当初10年固定型は一定期間だけ固定ですが、フラット35は基本的に返済期間全体を固定します。」</p></div></details><h4>Q3｜全期間固定なら、どの利用者も同じ金利？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。借入期間、融資率、団信の種類、金融機関等によって異なり得ます。」</p></div></details>", "R": "<p>「30秒です。民間金融機関＋住宅金融支援機構。全期間固定。借入時に返済終了までの金利が確定。だから長期の返済計画を立てやすい。ここです。」</p>", "M": "<p>「<strong>フラット35＝住宅金融支援機構と民間金融機関が提携する、全期間固定金利型の住宅ローン。</strong>」</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "<h3>A｜要点</h3><p>「財形貯蓄制度は、勤労者が勤務先を通じ、<strong>給与などから天引きして計画的に貯蓄する制度</strong>です。」</p><p>「種類は3つ。<strong>一般財形貯蓄＝使い道自由、財形年金貯蓄＝老後の年金目的、財形住宅貯蓄＝住宅取得・増改築目的</strong>です。」</p><p>「そして税制優遇があるのは、基本的に年金財形と住宅財形。一般財形には利子等の非課税措置はありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず一般財形。目的を限定せず使える貯蓄です。旅行でも教育でも構いません。その自由さと引き換えに、利子等について財形年金・住宅のような非課税措置はありません。」</p><p>「財形年金は老後資金を作るもの。55歳未満の勤労者が契約し、5年以上積み立て、60歳以降の所定時期から5年以上にわたり年金として受け取ることを目的にします。」</p><p>「財形住宅も55歳未満の勤労者が契約し、5年以上積み立て、住宅取得や増改築などに使うことを目的とします。」</p><p>「現在の制度では、財形年金と財形住宅を合わせて<strong>元利合計550万円まで</strong>から生じる利子等について非課税措置があります。ただし生命保険等を利用する財形年金には別の払込限度の扱いがあります。」</p><p>「先輩、“財形なら全部550万円非課税”は×ですよ。一般財形はここに入りません。目的を制限する年金・住宅に税制上のメリットを付けている、と理解してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんの給与明細を思い浮かべてください。給与が口座へ入る前に、毎月一定額が自動的に財形へ移されます。」</p><p>「そのお金を何に使うか決めていない箱が“一般”。60歳以降に開ける老後用の箱が“年金”。家を買ったりリフォームしたりするときに開ける箱が“住宅”です。」</p><p>「年金箱と住宅箱は使い道を縛る代わりに、一定範囲で利子等の非課税という優遇があります。一般箱は自由ですが、その非課税優遇はありません。」</p><p>「三つの箱を“目的・年齢・税制”で見れば、名前だけ暗記しなくても整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが毎月2万円を給与天引きで積み立てるとします。」</p><p>「将来の用途を限定せず自由に使いたいなら一般財形。老後に年金として受け取りたいなら財形年金。数年後のマイホーム取得資金として準備したいなら財形住宅、というように目的が変わります。」</p><p>「財形年金と財形住宅については、現在、両方を合わせて元利550万円までの範囲で利子等の非課税措置があります。『年金550万円＋住宅550万円＝合計1,100万円』ではありません。<strong>原則として両者を合算して550万円</strong>です。」</p><p>「また財形制度を続けることは、前に出てきた財形住宅融資につながります。貯める制度と借りる制度を別々にせず、一本で覚えてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜一般財形貯蓄の使い道は住宅や年金に限定される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。一般財形は使途自由です。」</p></div></details><h4>Q2｜財形年金と財形住宅の利子等非課税限度は、それぞれ550万円ずつ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。原則として両者を合わせて元利合計550万円までです。」</p></div></details><h4>Q3｜一般財形にも同じ非課税措置がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「ありません。一般財形の利子等は課税されます。」</p></div></details>", "R": "<p>「一般＝自由・非課税優遇なし。年金＝老後。住宅＝住宅取得等。年金＋住宅は原則合算550万円まで利子等非課税。給与天引きで積み立てる。これです。」</p>", "M": "<p>「<strong>財形貯蓄＝給与天引きで財産形成し、一般・年金・住宅の3種類を目的と税制で分ける。</strong>」</p>"}}, {"title": "団体信用生命保険", "content": {"A": "<h3>A｜要点</h3><p>「団体信用生命保険、団信は、住宅ローンの返済中に<strong>借りた人が死亡したり所定の高度障害状態になったりした場合、保険金で住宅ローン残高を返済するための生命保険</strong>です。」</p><p>「遺族へ現金を渡すこと自体が中心ではなく、住宅ローン債務をなくす方向に働く。ここが普通の死亡保険との見え方の違いです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンを3,000万円借りた人が亡くなったとします。家族は収入を失ううえに、ローンまで残ったら大きな負担ですよね。」</p><p>「そこで団信では、所定の保険事故が起きたときに保険金が住宅ローン残高の返済へ充てられます。結果として、遺族は住宅ローン債務がなくなった住宅を引き継げる形になります。」</p><p>「ここで大切なのは、保険金額のイメージです。一般の定額死亡保険なら“死亡したら3,000万円”のように契約します。一方、団信は住宅ローン残高と連動して保障が小さくなっていくのが基本です。返済が進んで残高が減れば、必要な返済額も減るからです。」</p><p>「また、死亡・高度障害だけでなく、がんや三大疾病などを保障する特約付きの商品もありますが、保障範囲や条件は商品ごとに確認が必要です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「住宅の横に“ローン残高メーター”があると思ってください。借入直後は3,000万円。返済するたびに2,900万、2,800万……と下がります。」</p><p>「そのメーターの横を団信がずっと見ています。もし返済途中で契約上の死亡等が起きたら、団信が残っているローンを返済する方向に働き、メーターを0へ持っていきます。」</p><p>「だから団信は、“家族へ3,000万円を自由に使える現金として渡す箱”というより、<strong>残った住宅ローンを消すための安全装置</strong>と考えると分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが住宅ローン3,000万円を借り、団信に加入したとします。」</p><p>「10年後、返済が進んでローン残高が2,100万円になった時点で、Aさんが団信の保障対象となる死亡をしたとします。」</p><p>「この場合、団信の保険金によって残高2,100万円が返済される仕組みなら、家族がその2,100万円の住宅ローンをそのまま背負うことを避けられます。」</p><p>「ここで“最初3,000万円借りたから遺族へ3,000万円現金が支払われる”と考えるのは違います。中心は<strong>その時点のローン残高の返済</strong>です。」</p><p>「住宅ローンと生命保険を考えるとき、団信で住宅費リスクがどこまで消えるかを確認してから、別の死亡保障がいくら必要か考える、というつながりも大切です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜団信の中心的な役割は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「借主が死亡・所定の高度障害状態などになった際、保険金で住宅ローン残高を返済することです。」</p></div></details><h4>Q2｜借入時3,000万円なら、10年後に死亡しても遺族へ必ず3,000万円現金が渡る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「その理解は誤りです。団信は基本的に、その時点の住宅ローン残高を返済する仕組みです。」</p></div></details><h4>Q3｜返済が進むと団信で必要な保障額が減っていくのはなぜ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「住宅ローン残高自体が減っていくからです。」</p></div></details>", "R": "<p>「団信＝住宅ローンの安全装置。死亡・所定の高度障害等で残債を返済。遺族への自由な現金給付というよりローン残高を0にする方向。これです。」</p>", "M": "<p>「<strong>団信＝借主に万一があったとき、保険で住宅ローン残高を返す仕組み。</strong>」</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<h3>A｜要点</h3><p>「住宅ローンの借り換えは、<strong>今の住宅ローンを別の住宅ローンで返済して、新しい条件のローンへ乗り換えること</strong>です。」</p><p>「主な目的は金利を下げて総返済額を減らす、固定金利へ変えて金利上昇リスクを抑えるなどです。ただし手数料や登記関係費用などがかかるので、“金利が低い＝必ず得”ではありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「仕組みからいきます。今A銀行に2,000万円の住宅ローンが残っている。B銀行で新たに2,000万円前後を借り、その資金でA銀行のローンを完済します。その後はB銀行へ返済する。これが借り換えです。」</p><p>「なぜそんなことをするか。一つは金利差です。残高が大きく、残り期間が長いほど、金利が下がる効果は積み上がりやすくなります。」</p><p>「もう一つは金利タイプの変更。変動金利から全期間固定へ借り換えれば、必ず総支払額が減るとは限りませんが、将来の金利上昇リスクを抑える目的があります。」</p><p>「ただし新規のローン契約になるので、事務手数料、抵当権の抹消・設定に関する費用などが発生し得ます。だから比較するのは“金利だけ”ではなく、<strong>借り換え後の利息＋諸費用まで含めた総負担</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩が月額の高いスマホ契約を使っていて、別会社に安いプランが出たとします。」</p><p>「乗り換えれば毎月は安くなる。でも解約・契約時の費用が10万円かかる。月500円しか安くならないなら、費用を取り戻すのに長い時間がかかりますよね。」</p><p>「住宅ローンも同じです。新しい金利だけ見て“安い！”と飛びつくのではなく、乗り換え費用を払っても最終的に得かを見る。」</p><p>「しかも住宅ローンは金額が大きいので、<strong>残高・残存期間・金利差・諸費用</strong>の4つをまとめて判断する必要があります。」</p>", "D": "<h3>D｜具体例</h3><p>「残高2,000万円、残り20年の住宅ローンがあるとします。現在より低い金利のローンへ借り換えることで、将来の利息が80万円減ると仮定します。」</p><p>「でも借り換えに事務手数料や登記費用など合計50万円かかるなら、単純化した実質的な改善額は80－50＝<strong>30万円</strong>です。」</p><p>「もし利息が30万円しか減らないのに諸費用50万円なら、金利だけは低くなっても総負担は20万円増えます。」</p><p>「だから『借り換え後の金利＜現在の金利』だけでは判定できません。」</p><p>「また借り換えには審査もあります。現在の収入・健康状態・物件などの条件によって希望どおり利用できるとは限りません。試験ではまず、<strong>金利差だけでなく諸費用を考える</strong>ことを押さえてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜借り換えとは何をすること？</h4><details><summary>答えを見る</summary><div class='answer'><p>「新しい住宅ローンを借り、その資金で現在のローンを完済し、新しいローンへ乗り換えることです。」</p></div></details><h4>Q2｜新ローンの金利が低ければ必ず得？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。事務手数料や登記費用などの諸費用を含めて総負担を比較する必要があります。」</p></div></details><h4>Q3｜金利を下げる以外の借り換え目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「変動金利から固定金利へ変更して、将来の金利上昇リスクを抑えることなどがあります。」</p></div></details>", "R": "<p>「新ローンで旧ローンを完済して乗り換える。目的は利息削減や金利リスク変更。判断は金利だけでなく残高・期間・金利差・諸費用。ここです。」</p>", "M": "<p>「<strong>住宅ローンの借り換え＝新しいローンで旧ローンを完済し、諸費用込みで条件改善を狙う。</strong>」</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<h3>A｜要点</h3><p>「健康保険の被保険者が亡くなったとき、埋葬に関する給付として<strong>埋葬料</strong>または<strong>埋葬費</strong>があります。」</p><p>「被保険者に生計を維持されていた人がいるなら、その人に埋葬料として<strong>5万円</strong>。そのような人がいない場合、実際に埋葬を行った人に、実際の埋葬費用の範囲で<strong>上限5万円</strong>の埋葬費が支給されます。」</p><p>「さらに被扶養者が亡くなった場合は、被保険者に<strong>家族埋葬料5万円</strong>が支給されます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、埋葬料と埋葬費、名前が似ていますよね。でも“誰に支払うか”で分けると簡単です。」</p><p>「被保険者が亡くなり、その人に生計を維持されていた人がいる場合、その人へ埋葬料5万円が支給されます。」</p><p>「では生計を維持されていた人がいない場合はどうするか。実際に葬儀など埋葬を行い、費用を負担した人へ埋葬費を支給します。ただしこちらは一律5万円ではなく、<strong>実際に埋葬に要した費用の範囲で上限5万円</strong>です。」</p><p>「被扶養者、たとえば健康保険上の扶養に入っている家族が亡くなった場合には、被保険者へ家族埋葬料5万円です。」</p><p>「つまり、死亡した人が被保険者なのか被扶養者なのか、被保険者死亡なら生計維持関係のある人がいるか、という順番で見ます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが健康保険の被保険者で、配偶者BさんがAさんに生計を維持されているとします。」</p><p>「Aさんが亡くなった場合、Bさんには埋葬料5万円が支給されます。ここでは“実際の葬儀代が3万円だったから3万円だけ”という計算ではありません。」</p><p>「一方、Aさんに生計を維持されていた人がおらず、友人Cさんが実際に埋葬を行って4万円を負担したとします。この場合は埋葬費として実費4万円。上限は5万円です。」</p><p>「さらに逆に、被扶養者Bさんが亡くなったなら、被保険者Aさんに家族埋葬料5万円。この三場面を並べると整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「ケースを数字で分けます。」</p><p>「①被保険者Aさん死亡。Aさんに生計を維持されていた妻Bさんがいる。→ Bさんへ<strong>埋葬料5万円</strong>。」</p><p>「②被保険者Cさん死亡。生計維持関係にある人はいない。友人Dさんが実際に埋葬を行い3万8,000円を負担した。→ Dさんへ<strong>埋葬費3万8,000円</strong>。上限5万円なので実費を超えて5万円もらうわけではありません。」</p><p>「③被保険者Eさんの被扶養者である家族Fさんが死亡。→ Eさんへ<strong>家族埋葬料5万円</strong>。」</p><p>「試験の引っかけは“埋葬費も常に一律5万円”です。違います。<strong>埋葬料は5万円、埋葬費は実費で上限5万円</strong>。ここを分けてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜被保険者に生計を維持されていた人へ支給される埋葬料はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「5万円です。」</p></div></details><h4>Q2｜生計維持関係にある人がおらず、実際の埋葬費が3万円だった場合、埋葬費はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則3万円です。埋葬費は実際に要した費用の範囲で上限5万円だからです。」</p></div></details><h4>Q3｜被扶養者が亡くなった場合は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「被保険者に家族埋葬料として5万円が支給されます。」</p></div></details>", "R": "<p>「被保険者死亡＋生計維持者あり＝埋葬料5万円。なし＝実際に埋葬した人へ実費・上限5万円の埋葬費。被扶養者死亡＝家族埋葬料5万円。はい、三つです。」</p>", "M": "<p>「<strong>埋葬料は5万円、埋葬費は実費で上限5万円、被扶養者死亡は家族埋葬料5万円。</strong>」</p>"}}, {"title": "任意継続被保険者", "content": {"A": "<h3>A｜要点</h3><p>「先輩、任意継続被保険者は、会社を辞めたあとも<strong>それまで加入していた健康保険を一定期間続けられる制度</strong>です。」</p><p>「退職すると会社員としての健康保険資格は原則なくなります。でも、一定の要件を満たして手続きすれば、最長2年間、任意継続として加入できます。」</p><p>「試験では特に、<strong>退職前に継続して2か月以上の被保険者期間があること／資格喪失日から20日以内に申請すること／最長2年</strong>を軸にします。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「会社員の健康保険は“会社に勤めていること”を土台に加入しています。だから退職すると、その資格は原則として退職日の翌日に失います。」</p><p>「でも翌日から病院に行けなくなるわけにはいきませんよね。そこで退職後の選択肢として、国民健康保険へ入る、家族の健康保険の被扶養者になる、そして要件を満たせば任意継続を選ぶ、という道があります。」</p><p>「任意継続で注意したいのが保険料です。在職中は健康保険料を会社と本人で原則折半していました。退職後は会社負担がなくなるため、任意継続では原則として<strong>本人が全額負担</strong>します。」</p><p>「先輩、『同じ健康保険を続けるなら保険料も在職中と同じ？』と思いますよね。そこが違います。給与明細で本人が払っていた額だけを見ていると、退職後の負担を小さく見積もってしまいます。」</p><p>「また、任意継続は“希望すればいつまでも”ではありません。期間は最長2年です。制度を使うかは、国保の保険料や家族の扶養に入れるかなどと比較して決めます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「Aさんが3月31日に会社を退職するとします。会社員としての健康保険証を使える立場はそこで終わり、4月1日から次の健康保険を考えなければなりません。」</p><p>「Aさんの前に三つの扉があります。“国民健康保険”“家族の健康保険の扶養”“今までの健康保険を任意継続”。」</p><p>「任意継続の扉を選ぶには、退職前の被保険者期間などの条件を満たし、期限内に申請します。入った後は最長2年間、その健康保険を継続できます。」</p><p>「ただし会社はもういません。だから保険料の会社負担もなくなり、自分で負担する。<strong>保険制度は継続できても、雇用関係まで継続するわけではない</strong>。この映像で覚えてください。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは会社の健康保険に5年間加入し、3月31日に退職しました。退職前の加入期間は2か月以上なので、期間要件は満たしています。」</p><p>「Aさんが任意継続を希望するなら、原則として資格喪失日である4月1日から20日以内に手続きをします。認められれば最長2年間継続できます。」</p><p>「在職中、健康保険料の本人負担が月2万円だったとしましょう。会社も一定額を負担していました。任意継続になると会社負担がなくなるため、“今まで本人が払っていた2万円をそのまま払えばよい”とは限りません。」</p><p>「だから退職時には、任意継続だけを自動的に選ぶのではなく、国民健康保険の保険料や被扶養者になれる可能性も比較するわけです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜任意継続を利用するための退職前の被保険者期間は原則どれくらい必要？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資格喪失日の前日までに継続して2か月以上です。」</p></div></details><h4>Q2｜申請期限の基本は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資格喪失日から20日以内です。」</p></div></details><h4>Q3｜任意継続の期間は無期限？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。最長2年間です。」</p></div></details>", "R": "<p>「退職後も以前の健康保険を継続。退職前2か月以上、資格喪失から20日以内、最長2年。退職後は会社負担がなくなり原則全額自己負担。ここです。」</p>", "M": "<p>「<strong>任意継続＝退職後、要件を満たせば以前の健康保険を最長2年間続けられる制度。</strong>」</p>"}}, {"title": "国民健康保険", "content": {"A": "<h3>A｜要点</h3><p>「国民健康保険は、会社員の健康保険など他の公的医療保険に入っていない人を主な対象とする公的医療保険です。」</p><p>「自営業者、退職して勤務先の健康保険を外れた人などが典型ですね。運営主体は市町村・特別区と都道府県、そして業種ごとの国民健康保険組合があります。」</p><p>「会社の健康保険との大きな違いとして、国民健康保険には原則として<strong>“被扶養者”という考え方がありません</strong>。加入する家族一人ひとりが被保険者になります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「日本では原則として、何らかの公的医療保険に加入します。会社員なら勤務先の健康保険、公務員なら共済など。そしてそれらの対象でない人を広く受け止めるのが国民健康保険です。」</p><p>「病院で保険証等を使って医療を受けたとき、医療費の全額を窓口で払うのではなく、年齢・所得などに応じた自己負担割合を支払い、残りを保険が負担します。」</p><p>「会社の健康保険では、一定要件を満たす家族を被扶養者にでき、その家族本人について追加の健康保険料が直接かかる仕組みではありません。一方、国民健康保険にはこの被扶養者制度がありません。」</p><p>「先輩、家族4人で国保なら“世帯主だけが被保険者で家族は扶養”ではありません。家族それぞれが国保の被保険者となり、保険料（税）は世帯単位で算定・納付される形です。」</p><p>「また、会社員の健康保険にある傷病手当金や出産手当金は、市町村国保では法定の一律給付ではありません。この違いもFPではよく比較されます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが退職し、任意継続も家族の扶養も選ばないとします。」</p><p>「するとAさんは住んでいる市区町村で国民健康保険の加入手続きをします。配偶者も勤務先の健康保険などに入っておらず、子どもも同様なら、それぞれが国保の被保険者です。」</p><p>「会社員時代は“本人A＋扶養家族”という傘の形だったのが、国保では家族それぞれに被保険者の札が付く感じです。」</p><p>「この違いが保険料の考え方にもつながります。だから退職時に任意継続と国保を比較するとき、家族構成まで見る必要があるんです。」</p>", "D": "<h3>D｜具体例</h3><p>「自営業のAさん、専業の配偶者Bさん、子どもCさんがいて、3人とも他の健康保険に加入していないとします。」</p><p>「この場合、会社員の健康保険のように“Aさんが本人、BさんとCさんは保険料なしの被扶養者”という扱いにはなりません。3人とも国民健康保険の被保険者です。」</p><p>「医療機関では、それぞれが公的医療保険の給付を受けます。一方、保険料（税）は所得割・均等割など、自治体の方式に基づいて世帯単位で計算・納付されます。」</p><p>「ですから、退職した人が『任意継続は保険料が高いから国保にすれば必ず安い』とも限りません。前年所得や世帯人数、自治体などで国保負担が変わるため、実際に比較する必要があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜国民健康保険に会社員の健康保険と同じ被扶養者制度はある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則ありません。加入対象となる家族一人ひとりが被保険者になります。」</p></div></details><h4>Q2｜自営業者は国保の典型的な対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「はい。他の被用者保険などに加入していない自営業者は典型的な加入者です。」</p></div></details><h4>Q3｜国保の保険料は全国どこでも同額？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。所得や世帯構成、自治体の算定方式などによって異なります。」</p></div></details>", "R": "<p>「他の被用者保険等に入らない人を支える公的医療保険。自営業者などが典型。被扶養者制度は原則なし。家族も一人ひとり被保険者。ここです。」</p>", "M": "<p>「<strong>国民健康保険＝会社の健康保険等に入らない人を主にカバーし、扶養ではなく各人が被保険者になる医療保険。</strong>」</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "<h3>A｜要点</h3><p>「後期高齢者医療制度は、原則として<strong>75歳以上の人</strong>を対象とする独立した公的医療保険制度です。」</p><p>「また、65歳以上75歳未満でも、一定の障害があり広域連合の認定を受けた人は対象になる場合があります。」</p><p>「75歳になると、それまで国保や会社の健康保険に入っていた人も、原則として後期高齢者医療制度へ移ります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「高齢になるほど医療を利用する機会は増えやすく、医療費も大きくなります。そこで75歳以上を中心に、現役世代とは別の枠組みで医療を支える制度が後期高齢者医療制度です。」</p><p>「運営主体は都道府県ごとに設置された後期高齢者医療広域連合で、市区町村が保険料徴収や窓口業務などを行います。」</p><p>「ここで大事なのが、“75歳になっても子どもの健康保険の扶養のまま”とはならないことです。75歳になると原則として後期高齢者医療制度の被保険者になります。」</p><p>「窓口負担割合は一律ではありません。所得状況等によって1割・2割・3割の区分があります。だから“75歳以上なら全員1割”という覚え方は危険です。」</p><p>「また65〜74歳でも一定の障害認定を受ければ加入対象になり得る。年齢だけで完全に切るのではなく、この例外も押さえてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「74歳のAさんが子どもの会社の健康保険で被扶養者になっているとします。」</p><p>「Aさんが75歳の誕生日を迎えると、原則としてその健康保険の扶養から外れ、後期高齢者医療制度という別の医療保険へ移ります。」</p><p>「つまり75歳の誕生日が“医療保険のレーンを切り替えるゲート”です。」</p><p>「ただし65〜74歳でも一定の障害があり認定を受けた人には、先にそのゲートへ入る道があります。原則75歳、例外として一定の障害がある65〜74歳。この二段で覚えましょう。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは74歳まで国民健康保険に加入していました。75歳になると、原則として国保から後期高齢者医療制度へ移ります。」</p><p>「Bさんは70歳ですが、一定の障害状態にあり、広域連合から認定を受けました。この場合、本人の選択・手続きにより後期高齢者医療制度の対象となり得ます。」</p><p>「そしてAさんの窓口負担を“75歳だから必ず1割”と決めつけてはいけません。一定以上の所得がある人には2割、現役並み所得者には3割の区分があります。」</p><p>「試験では、<strong>原則75歳以上／一定の障害がある65〜74歳も対象になり得る／所得に応じ窓口負担割合が異なる</strong>という三本を押さえます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜後期高齢者医療制度の原則的な対象年齢は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「75歳以上です。」</p></div></details><h4>Q2｜70歳なら絶対に加入できない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。65歳以上75歳未満でも、一定の障害があり広域連合の認定を受けた人は対象になり得ます。」</p></div></details><h4>Q3｜75歳以上の窓口負担は全員1割？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。所得状況等に応じて1割・2割・3割の区分があります。」</p></div></details>", "R": "<p>「原則75歳以上。一定の障害がある65〜74歳も認定で対象になり得る。75歳で国保等から移る。窓口負担は所得等で1・2・3割。これです。」</p>", "M": "<p>「<strong>後期高齢者医療制度＝原則75歳以上を独立した仕組みで支える公的医療保険。</strong>」</p>"}}, {"title": "公的介護保険", "content": {"A": "<h3>A｜要点</h3><p>「公的介護保険は、介護が必要になったときに、訪問介護や施設サービスなどの費用を社会全体で支える制度です。」</p><p>「被保険者は二つ。<strong>第1号被保険者＝65歳以上、第2号被保険者＝40歳以上65歳未満の医療保険加入者</strong>です。」</p><p>「最大の違いは給付を受けられる原因。第1号は要介護・要支援になった原因を原則問いませんが、第2号は<strong>加齢に伴う特定疾病</strong>が原因の場合に限られます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「介護は長期間続くことがあり、家族だけで全部を担うと身体的・経済的負担が非常に大きくなります。そこで保険料と公費を財源に、必要な介護サービスを支えるのが公的介護保険です。」</p><p>「65歳以上の第1号被保険者は、原因を問わず要介護・要支援認定を受ければ、原則として介護サービスの対象になります。」</p><p>「一方、40〜64歳の第2号被保険者は違います。若い人が交通事故で介護状態になったからといって、介護保険から必ず給付されるわけではありません。介護状態の原因が、がん末期、初老期の認知症、脳血管疾患など所定の特定疾病である必要があります。」</p><p>「先輩、ここは“介護状態の重さ”だけで判断しないでください。<strong>年齢区分と原因</strong>をセットで見るんです。」</p><p>「サービス利用時の自己負担は原則1割ですが、一定以上の所得がある第1号被保険者は2割または3割となる場合があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「70歳のAさんと50歳のBさんが、どちらも介護を必要としているとします。」</p><p>「Aさんは第1号被保険者です。転倒が原因でも病気が原因でも、要介護・要支援認定を受ければ原因を原則問わず介護保険サービスへ進めます。」</p><p>「Bさんは第2号被保険者です。同じように介護が必要でも、入口に“その原因は特定疾病ですか？”というチェックがあります。」</p><p>「だから同じ介護状態でも、65歳という境目で制度への入り方が変わる。<strong>65歳以上＝原因を原則問わない、40〜64歳＝特定疾病が条件</strong>という二つの入口を想像してください。」</p>", "D": "<h3>D｜具体例</h3><p>「70歳のAさんが自宅で転倒し、要介護認定を受けました。Aさんは第1号被保険者なので、原因が特定疾病かどうかにかかわらず、認定に応じた介護サービスを利用できます。」</p><p>「50歳のBさんが脳血管疾患によって介護が必要になり、認定を受けた場合。脳血管疾患は特定疾病に含まれるため、第2号被保険者でも介護保険給付の対象になり得ます。」</p><p>「一方、50歳のCさんが交通事故だけを原因として介護状態になった場合、第2号被保険者としての介護保険給付は原則対象外です。介護が必要かどうかだけではなく、原因が特定疾病かを見るからです。」</p><p>「この三人を比較すれば、“第2号だけ原因要件がある”という意味がはっきりします。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜第1号被保険者は何歳以上？</h4><details><summary>答えを見る</summary><div class='answer'><p>「65歳以上です。」</p></div></details><h4>Q2｜第2号被保険者は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「40歳以上65歳未満の医療保険加入者です。」</p></div></details><h4>Q3｜50歳の人が交通事故で介護状態になれば、介護保険から必ず給付される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。第2号被保険者は、要介護・要支援状態が所定の特定疾病による場合に給付対象となります。」</p></div></details>", "R": "<p>「第1号＝65歳以上、原因原則不問。第2号＝40〜64歳の医療保険加入者、特定疾病が原因の場合。利用者負担は原則1割、所得で2・3割も。ここです。」</p>", "M": "<p>「<strong>介護保険は、65歳以上と40〜64歳で“給付を受ける原因条件”が違う。</strong>」</p>"}}, {"title": "労災保険", "content": {"A": "<h3>A｜要点</h3><p>「労災保険は、労働者が<strong>仕事中や通勤途中</strong>に負傷・病気・障害・死亡などに遭ったときに給付する公的保険です。」</p><p>「正式には労働者災害補償保険。業務上の災害を<strong>業務災害</strong>、通勤による災害を<strong>通勤災害</strong>と呼びます。」</p><p>「保険料は原則として<strong>事業主が全額負担</strong>します。労働者本人が給与から半分払う制度ではありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「仕事をしている以上、工場でけがをする、営業中に事故に遭う、仕事が原因で病気になる、といったリスクがあります。それを労働者個人だけに負わせず補償するのが労災保険です。」</p><p>「原則として、労働者を1人でも使用する事業は労災保険の適用事業となり、正社員だけでなくパート・アルバイトなども労働者であれば対象になり得ます。」</p><p>「業務災害なら、仕事との因果関係がポイントです。会社の建物の中でけがをしただけで自動的に全部労災、というわけではありません。“業務に起因する災害か”を見ます。」</p><p>「通勤災害も、何でも通勤と言えばよいわけではありません。住居と就業場所の間などを合理的な経路・方法で移動することが基本で、私的な目的で大きく経路を外れれば扱いが変わる場合があります。」</p><p>「そして保険料は事業主が全額負担。雇用保険は労使双方が負担する部分があるので、ここは比較問題で狙われます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「Aさんが工場で機械を操作中に手を負傷した場面を考えます。これは仕事をしている最中の事故なので、業務災害として労災保険の入口に立ちます。」</p><p>「翌日、Bさんが自宅から会社へ通常の経路で電車通勤中、駅の階段で転倒した。こちらは仕事そのものではありませんが、通勤という仕事に付随する移動なので通勤災害の対象になり得ます。」</p><p>「つまり労災保険は会社の門の中だけに張られたネットではなく、<strong>業務と一定の通勤</strong>までカバーする安全網です。」</p><p>「その安全網の保険料を、労働者ではなく事業主が原則全額負担している、とセットで置いてください。」</p>", "D": "<h3>D｜具体例</h3><p>「①アルバイトAさんが勤務中、店の商品を運んでいて転倒し負傷した。アルバイトだから労災なし、ではありません。労働者であり業務上の災害と認められれば対象になり得ます。」</p><p>「②正社員Bさんが通常の通勤経路で会社へ向かう途中、交通事故に遭った。合理的な通勤の途中なら通勤災害として対象になり得ます。」</p><p>「③Bさんが帰宅途中に通勤とは無関係な私用のため大きく経路を外れ、その最中に事故に遭った。この場合は“通勤災害だから必ず労災”とは言えず、逸脱・中断の扱いを確認します。」</p><p>「そしてAさんやBさんの給与から“労災保険料の本人分50%”を徴収する、という理解も×。労災保険料は原則事業主が全額負担します。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜労災保険は正社員だけが対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。パート・アルバイト等でも、労働者として業務災害・通勤災害に遭えば対象になり得ます。」</p></div></details><h4>Q2｜労災保険料は労使折半？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。原則として事業主が全額負担します。」</p></div></details><h4>Q3｜通常の通勤途中の事故は労災と無関係？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。所定の通勤に該当する途中の災害は、通勤災害として労災保険の対象になり得ます。」</p></div></details>", "R": "<p>「仕事中＝業務災害、通勤途中＝通勤災害。正社員だけでなく労働者を広く対象。保険料は原則事業主全額負担。はい、ここです。」</p>", "M": "<p>「<strong>労災保険＝労働者の業務災害・通勤災害を補償し、保険料は原則事業主が全額負担する。</strong>」</p>"}}, {"title": "雇用保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、雇用保険を“失業したときのお金”だけで覚えると狭すぎます。雇用保険は、<strong>失業したときの生活と再就職を支え、働き続けるための育児・介護・高齢期の雇用なども支える制度</strong>です。」</p><p>「代表は失業等給付ですが、その中には求職者給付、就職促進給付、教育訓練給付、雇用継続給付などがあります。さらに育児休業等給付もあります。」</p><p>「つまり、“仕事を失った後”だけでなく、<strong>仕事を探す・能力を高める・働き続ける・休業後に戻る</strong>ところまで支える保険なんです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず中心となるのが、失業した人の生活を支えながら再就職を促す求職者給付です。一般の離職者が受ける基本手当が代表ですね。」</p><p>「でも制度の目的は“失業中ずっとお金を渡すこと”ではありません。再就職したら就職促進給付、職業能力を高めるため講座を受けたら教育訓練給付、介護で休業するなら介護休業給付、と状況に応じて支援の形が変わります。」</p><p>「保険料は労災保険と違い、雇用保険部分については労働者と事業主の双方が負担します。先ほどの労災は原則事業主全額でしたよね。ここ、比較問題で大事です。」</p><p>「そして“退職した＝自動的に基本手当が出る”でもありません。被保険者期間などの受給要件を満たし、働く意思・能力があり、求職活動をしていることなどが必要です。」</p><p>「ですから、雇用保険は単なる退職金ではなく、<strong>労働者が雇用から外れたり、雇用を続けにくくなったりした場面を支える社会保険</strong>と理解してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一人の会社員Aさんの仕事人生に沿って見ます。」</p><p>「Aさんが離職した。まず基本手当などで生活を支えながら仕事を探す。早く再就職できたら再就職手当などの就職促進給付が出る場合がある。」</p><p>「別の時期に、仕事に必要な資格を取るため指定講座を受ければ教育訓練給付。家族の介護で休業すれば介護休業給付。子どもが生まれて育児休業を取れば育児休業等給付が関係します。」</p><p>「一本の道の途中に、“失業”“再就職”“学び直し”“育児”“介護”という谷があります。雇用保険はその谷ごとに違う橋を架けている。そう見ると、給付名がばらばらに見えなくなります。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが会社を退職し、受給要件を満たしてハローワークで求職活動を始めたとします。ここでは基本手当が中心になります。」</p><p>「その後、所定給付日数を多く残して安定した職業に再就職し、要件を満たせば再就職手当の対象になる場合があります。これは“失業を長引かせた方が得”にならないよう、早期再就職を後押しする仕組みです。」</p><p>「また在職中に厚生労働大臣指定の教育訓練を受ければ、要件に応じて教育訓練給付の対象となり得ます。」</p><p>「つまり同じ雇用保険でも、Aさんの状態が<strong>失業中→再就職→能力開発</strong>と変われば、使う給付も変わるんです。次の27〜29は、この全体地図の各エリアを詳しく見る項目です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜雇用保険は失業者だけを対象にした制度？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。失業時の給付だけでなく、再就職、教育訓練、介護休業、育児休業等、雇用の継続や職業生活も支えます。」</p></div></details><h4>Q2｜雇用保険料は労災保険と同じく原則すべて事業主負担？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。雇用保険部分は労働者と事業主の双方が負担します。労災保険料は原則事業主が全額負担です。」</p></div></details><h4>Q3｜会社を辞めれば基本手当は自動的にもらえる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。被保険者期間、失業状態、求職活動など所定の受給要件があります。」</p></div></details>", "R": "<p>「雇用保険＝失業だけではない。求職、再就職、教育訓練、雇用継続、育児・介護まで支える。労災と違い保険料は労使双方が負担。全体地図を持ってください。」</p>", "M": "<p>「<strong>雇用保険＝仕事を失ったときから、再就職・学び直し・雇用継続まで支える保険。</strong>」</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "<h3>A｜要点</h3><p>「この二つは目的が違います。<strong>就職促進給付＝早く安定した再就職をすることを後押しする給付</strong>。<strong>教育訓練給付＝働くための能力・資格を身につける費用を支援する給付</strong>です。」</p><p>「就職促進給付の代表が再就職手当。教育訓練給付には、対象講座の種類などに応じた複数の区分があります。」</p><p>「“仕事が決まった後を支援するのか”“仕事に必要な力を付ける学習を支援するのか”でまず分けてください。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「失業中に基本手当を受けている人が、“基本手当を全部もらい切ってから働いた方が得だ”と考えたら、早期再就職を妨げますよね。そこで一定の支給残日数を残して安定した職業に就き、要件を満たした人に再就職手当を支給します。」</p><p>「再就職手当は、基本手当の残りをそのまま全部渡す制度ではありません。基本手当の支給残日数などを基礎に支給額が決まります。つまり“早く働き始めるインセンティブ”です。」</p><p>「一方、教育訓練給付は再就職そのものではなく、資格取得や専門能力の向上を支援します。厚生労働大臣の指定を受けた教育訓練を受講・修了するなど、区分ごとの要件を満たす必要があります。」</p><p>「先輩、“英会話スクールに行ったから何でも給付対象”ではありませんよ。対象となる教育訓練として指定されているか、被保険者期間などの要件を満たすかを確認します。」</p><p>「ですから因果で覚えるなら、<strong>早期再就職を促したい→就職促進給付、職業能力を高めたい→教育訓練給付</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「失業したAさんの前に二つの扉があります。」</p><p>「左の扉には“就職先が決まった”。Aさんが基本手当をかなり残した状態で早く安定就職できたなら、要件を満たすと再就職手当などが後押しします。」</p><p>「右の扉には“まず専門スキルを身につける”。指定された教育訓練を受け、資格や能力を身につけるための費用について、要件を満たせば教育訓練給付が支援します。」</p><p>「左は<strong>就職という結果を早める</strong>支援。右は<strong>就職・キャリアにつながる能力形成</strong>の支援。この二つを同じ“失業者へのお金”として混ぜないでください。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは基本手当を受給中でしたが、給付日数を十分残した状態で正社員として再就職しました。一定の要件を満たせば再就職手当の対象になり得ます。」</p><p>「この制度があることで、“基本手当を最後まで受け取るために就職を遅らせる”より、早く就職することにも経済的メリットを持たせられます。」</p><p>「一方Bさんは、仕事に必要な専門資格を取るため、教育訓練給付の対象として指定された講座を受講しました。所定の被保険者期間等を満たせば、受講費用の一定割合について給付を受けられる場合があります。」</p><p>「Aさんは“再就職したこと”が中心。Bさんは“対象となる教育訓練を受けたこと”が中心。試験ではこの目的の違いから答えを選びます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜基本手当の給付日数を残して早期に再就職した人を支援する代表的な給付は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「再就職手当です。就職促進給付の代表です。」</p></div></details><h4>Q2｜指定講座で職業能力を高める費用を支援するのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「教育訓練給付です。」</p></div></details><h4>Q3｜好きな講座ならすべて教育訓練給付の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。厚生労働大臣の指定を受けた教育訓練であることなど、所定の要件があります。」</p></div></details>", "R": "<p>「就職促進＝早期再就職を後押し、代表は再就職手当。教育訓練＝指定講座等で能力形成を支援。結果を支えるか、能力形成を支えるかで分けます。」</p>", "M": "<p>「<strong>就職促進給付は“早く働く”を、教育訓練給付は“働く力を高める”を支える。</strong>」</p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "<h3>A｜要点</h3><p>「先輩、ここは“仕事を辞めずに生活上の変化を乗り越えるための給付”としてつなげます。」</p><p>「<strong>育児休業給付</strong>は、雇用保険の被保険者が子を養育するため育児休業を取り、賃金が減る期間の所得を支えるものです。」</p><p>「一方、<strong>雇用継続給付</strong>という大きな考え方では、働き続けることが難しくなる場面を支えます。次項で扱う高年齢雇用継続給付や介護休業給付が代表的な関連制度です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「子どもが生まれて育児休業を取れば、仕事は辞めていなくても通常どおりの賃金を受けられない場合があります。そこで雇用保険から育児休業給付を支給し、休業中の所得低下を補います。」</p><p>「大切なのは“出産祝い金”ではないことです。目的は、育児のため一時的に仕事を休んでも、雇用関係を維持して職場復帰しやすくすることです。」</p><p>「育児休業給付金の基本的な給付率は、休業開始から180日までは休業開始時賃金日額を基礎とする賃金月額の67%、181日目以降は50%という仕組みです。ただし休業中に賃金が支払われる場合などは調整があります。」</p><p>「さらに現在は、一定要件を満たす場合の出生後休業支援給付金など、育児期を支える給付も拡充されています。試験年度によって制度改正が反映されるので、数値問題ではその年度の基準を確認してください。」</p><p>「“雇用継続”という言葉の本質は、失業してから助けるだけでなく、<strong>失業しなくて済むよう、働き続ける途中を支える</strong>ことなんです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんに子どもが生まれました。Aさんは退職するのではなく、半年間育児休業を取ります。」</p><p>「会社との雇用関係は続いています。でも働いていない期間は給与が減る。その収入の谷に雇用保険が橋を架けるのが育児休業給付です。」</p><p>「失業給付なら“会社を離れた後の谷”。育児休業給付は“会社に籍を残したまま休む谷”。この違いを映像で分けてください。」</p><p>「雇用保険は、仕事がなくなった人だけではなく、仕事を続けたい人が育児などで一時的に働けない場面も支えているんです。」</p>", "D": "<h3>D｜具体例</h3><p>「単純化して、休業開始時賃金日額を基礎にした賃金月額が30万円で、休業中に会社から賃金が支払われず、その他の調整もないケースを考えます。」</p><p>「育児休業開始から180日までの給付率を67%とすると、1か月分の目安は30万円×67%＝<strong>20万1,000円</strong>です。」</p><p>「181日目以降を50%とすると、同じ前提なら30万円×50%＝<strong>15万円</strong>が目安になります。」</p><p>「ただし実際には支給単位期間、賃金支払いの有無、上限額などで調整されます。ここで覚えるべきなのは、“休業前の賃金を100%そのまま保証する制度”ではなく、<strong>育児休業中の所得低下を一定割合で補い、雇用継続を助ける制度</strong>だということです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜育児休業給付は、会社を辞めた人の再就職を支援する給付？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。雇用関係を維持したまま育児休業を取る人の所得低下を支える給付です。」</p></div></details><h4>Q2｜育児休業給付金の基本的な給付率は、休業開始から180日まで何%？</h4><details><summary>答えを見る</summary><div class='answer'><p>「基本は67%です。181日目以降は50%です。実際の支給額は賃金支払い等により調整されます。」</p></div></details><h4>Q3｜制度の目的を一言でいうと？</h4><details><summary>答えを見る</summary><div class='answer'><p>「育児のため一時的に休業しても、生活を支えながら雇用を継続しやすくすることです。」</p></div></details>", "R": "<p>「育児休業＝退職ではない。雇用を残して休む間の所得低下を支える。基本は180日まで67%、以後50%。雇用保険は“働き続ける途中”も支えます。」</p>", "M": "<p>「<strong>育児休業給付＝育児で仕事を休んでも雇用を続けられるよう、休業中の所得を支える給付。</strong>」</p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "<h3>A｜要点</h3><p>「この二つも“失業させないための支援”として見ると整理できます。」</p><p>「<strong>高年齢雇用継続給付</strong>は、60歳以降も働き続け、60歳時点に比べ賃金が一定以上低下した一定の被保険者を支える制度です。」</p><p>「<strong>介護休業給付</strong>は、家族を介護するため休業し、賃金が減る人を支える給付です。介護休業給付金の基本的な支給率は休業開始時賃金日額を基礎とする賃金月額の67%です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず高年齢雇用継続給付。定年後の継続雇用などで、60歳前より賃金が大きく下がることがあります。そこで一定の要件を満たす人について、賃金低下の一部を補い、働き続けることを支えます。」</p><p>「ただしここは制度改正に注意です。2025年4月1日以降に60歳に達する人について、高年齢雇用継続給付の最大給付率は従来の15%から<strong>10%</strong>へ引き下げられています。受験年度と60歳到達時期を確認してください。」</p><p>「次に介護休業給付。家族の介護で一定期間仕事を休むと賃金が減ります。でも介護を理由に退職してしまえば、本人のキャリアにも企業にも影響が大きい。そこで休業中の所得を一定程度支えます。」</p><p>「対象家族1人につき、通算93日まで、3回を上限として分割して介護休業を取得でき、給付もその休業に対応します。」</p><p>「つまり、高年齢雇用継続は<strong>賃金低下があっても働き続ける</strong>支援、介護休業給付は<strong>介護のため一時的に休んでも辞めずに戻る</strong>支援です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「60歳のAさんと、家族を介護する45歳のBさんを並べます。」</p><p>「Aさんは会社に残ったけれど、再雇用で賃金が大きく下がった。仕事は続けているので、“低くなった賃金”の谷を高年齢雇用継続給付が支えます。」</p><p>「Bさんは給与が下がったからではなく、親の介護で仕事を一時的に休む必要がある。こちらは“休業で収入が減る谷”を介護休業給付が支えます。」</p><p>「二人とも会社を辞めていません。だから共通テーマは<strong>雇用を切らずに生活上の変化を乗り越える</strong>ことなんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが2026年に60歳となり、60歳時点の賃金月額30万円から、継続雇用後18万円へ低下したとします。18万円は30万円の60%です。」</p><p>「一定の被保険者期間など他の要件も満たす場合、高年齢雇用継続給付の対象を検討します。2025年4月1日以降に60歳到達する人では、最大給付率は10%となる制度です。実際の支給率は賃金低下率等で決まります。」</p><p>「一方Bさんは対象家族の介護のため介護休業を取り、休業開始時賃金月額が30万円、休業中の賃金支払いがなく他の調整もないと単純化します。67%なら1か月相当の目安は30万円×67%＝<strong>20万1,000円</strong>です。」</p><p>「Aさんは“働きながら賃金低下”、Bさんは“介護のため休業”。同じ雇用保険でも、支援している収入減少の原因が違います。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜2025年4月1日以降に60歳となる人の高年齢雇用継続給付の最大給付率は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「10%です。旧制度の15%と混同しないよう、60歳到達時期に注意します。」</p></div></details><h4>Q2｜介護休業給付金の基本的な支給率は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「休業開始時賃金日額を基礎とする賃金月額の67%です。賃金支払い等による調整があります。」</p></div></details><h4>Q3｜介護休業は対象家族1人につきどのくらい取得できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「通算93日まで、3回を上限として分割取得できます。」</p></div></details>", "R": "<p>「高年齢＝60歳以降の賃金低下を支え、2025年4月以降60歳到達者は最大10%。介護＝家族介護による休業を支え、基本67%、対象家族1人につき通算93日・3回まで。目的は雇用継続です。」</p>", "M": "<p>「<strong>高年齢は“働きながら賃金低下”、介護休業は“介護で一時休業”を支えて離職を防ぐ。</strong>」</p>"}}, {"title": "公的年金", "content": {"A": "<h3>A｜要点</h3><p>「先輩、公的年金は“老後にもらうお金”だけではありません。<strong>老齢・障害・死亡という、長期的に生活を揺らす三つのリスクを社会全体で支える制度</strong>です。」</p><p>「日本の公的年金はよく<strong>2階建て</strong>で説明します。1階が国民年金（基礎年金）、2階が厚生年金保険です。」</p><p>「20歳以上60歳未満の国内居住者は原則として国民年金の被保険者となり、会社員・公務員など厚生年金の適用を受ける人は、その上に厚生年金が乗るイメージです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず1階の国民年金。ここから老齢基礎年金、障害基礎年金、遺族基礎年金などの“基礎年金”が支給されます。」</p><p>「次に2階の厚生年金。会社員など厚生年金の被保険者には、基礎年金に加えて、報酬や加入期間等に応じた老齢厚生年金などが支給されます。」</p><p>「そして国民年金の被保険者は立場で3種類です。<strong>第1号＝自営業者・学生など、第2号＝厚生年金の被保険者、第3号＝第2号被保険者に扶養される一定の配偶者</strong>です。」</p><p>「先輩、“会社員は厚生年金だけで国民年金には入っていない”は×です。会社員は第2号被保険者として国民年金の仕組みにも入ったうえで、厚生年金にも加入している、と考えます。」</p><p>「公的年金を老後資金だけだと思うと、次に出てくる障害年金・遺族年金が別物に見えます。最初から<strong>長生き・障害・家計を支える人の死亡</strong>という三つの生活リスクへの保険だと理解してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「日本の公的年金を2階建ての建物にします。」</p><p>「1階は“国民年金”。自営業者も学生も会社員も、立場は違っても原則としてこの基礎部分につながっています。」</p><p>「会社員Aさんはさらに2階の“厚生年金”へ上がります。老後になると、要件を満たせば1階から老齢基礎年金、2階から老齢厚生年金を受け取るイメージです。」</p><p>「でも建物には老後用の出口だけではありません。病気やけがで一定の障害状態になれば障害年金の出口、加入者が死亡して一定の遺族を残せば遺族年金の出口があります。」</p><p>「つまり年金という建物は、“長生きした人だけが最後に入る貯金箱”ではなく、人生の大きなリスクに備える社会保険なんです。」</p>", "D": "<h3>D｜具体例</h3><p>「自営業のAさん、会社員Bさん、Bさんに扶養される配偶者Cさんを並べます。」</p><p>「Aさんは原則として国民年金の第1号被保険者。自分で国民年金保険料を納付します。」</p><p>「Bさんは厚生年金に加入する第2号被保険者。厚生年金保険料は給与・賞与を基礎に計算され、事業主と被保険者が折半して負担します。国民年金分を別に定額で払うわけではありません。」</p><p>「Cさんが20歳以上60歳未満で、Bさんに生計を維持される配偶者として第3号被保険者の要件を満たせば、Cさん自身が国民年金保険料を個別に納付する必要はありません。」</p><p>「この3人が高齢になれば基礎年金が土台になりますが、Bさんには厚生年金加入に基づく上乗せがあります。この人物3人を置くと、第1・第2・第3号と2階建てが同時に整理できます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜会社員は厚生年金だけに加入し、国民年金とは無関係？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。厚生年金の被保険者は国民年金の第2号被保険者でもあり、基礎年金の土台があります。」</p></div></details><h4>Q2｜公的年金が備える代表的な三つのリスクは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「老齢・障害・死亡です。それぞれ老齢年金、障害年金、遺族年金につながります。」</p></div></details><h4>Q3｜自営業者・会社員・会社員に扶養される一定の配偶者は、それぞれ何号？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として、自営業者等は第1号、厚生年金加入の会社員等は第2号、その第2号に扶養される一定の配偶者は第3号です。」</p></div></details>", "R": "<p>「公的年金＝老齢だけでなく障害・死亡も保障。1階国民年金、2階厚生年金。第1号＝自営業等、第2号＝会社員等、第3号＝第2号に扶養される一定の配偶者。まずこの地図です。」</p>", "M": "<p>「<strong>公的年金＝国民年金を土台に厚生年金を上乗せし、老齢・障害・死亡を支える社会保険。</strong>」</p>"}}, {"title": "任意加入被保険者", "content": {"A": "<h3>A｜要点</h3><p>「先輩、任意加入被保険者は、国民年金の<strong>強制加入期間から外れている人が、一定の要件を満たして自分の希望で加入する仕組み</strong>です。」</p><p>「代表例は、日本国内に住む60歳以上65歳未満で、老齢基礎年金を満額に近づけたい人などです。日本国籍を持ち海外に住む20歳以上65歳未満の人にも任意加入の仕組みがあります。」</p><p>「さらに65歳時点でも老齢基礎年金の受給資格期間を満たせない一定の人には、特例として70歳まで任意加入できる場合があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「国民年金の強制加入は原則20歳以上60歳未満です。では、20歳から60歳までに未納や未加入期間があり、60歳時点で満額に届かない人はどうするのか。そこで任意加入が意味を持ちます。」</p><p>「たとえば60歳時点で納付済期間が38年しかない人なら、条件を満たして60歳以降も保険料を納めることで、老齢基礎年金額を満額へ近づけられます。」</p><p>「ただし60歳を超えれば誰でも自由に入れるわけではありません。厚生年金保険に加入していないことなど、対象区分ごとの要件があります。」</p><p>「通常の60〜64歳の任意加入は主に<strong>年金額を増やす・満額へ近づける</strong>ため。65歳以降70歳未満の特例任意加入は、一定要件のもと主に<strong>受給資格期間そのものを満たす</strong>ためです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「老齢基礎年金を40年分のスタンプカードだと思ってください。Aさんは60歳時点で38年分しか埋まっていない。条件を満たして任意加入すれば、60歳以降に残りを埋めて満額へ近づけられます。」</p><p>「一方、受給資格期間そのものが足りない人は、満額以前に“年金を受け取る入口”へ届いていません。一定の人には65歳以降の特例任意加入という延長路があります。」</p><p>「つまり任意加入は別の年金に入る制度ではなく、<strong>国民年金の足りない期間を条件付きで補う制度</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは60歳で、国民年金の納付済期間が38年です。日本国内に住み、厚生年金に加入していないなどの要件を満たせば、任意加入して保険料を納め、40年の満額へ近づけられます。」</p><p>「Bさんは65歳になっても受給資格期間そのものが不足しています。一定の要件を満たす場合、70歳になるまで特例任意加入して受給資格期間を確保できる可能性があります。」</p><p>「<strong>60〜64歳は年金額を増やす代表例、65〜69歳は受給資格不足者への特例</strong>という目的の違いまで押さえましょう。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜60歳になったら国民年金には絶対加入できない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。一定要件を満たせば任意加入できます。」</p></div></details><h4>Q2｜60〜64歳の任意加入の代表的な目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「納付期間を増やし、老齢基礎年金額を満額へ近づけることです。」</p></div></details><h4>Q3｜65歳以降なら誰でも70歳まで年金額を増やせる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。65歳以降の特例任意加入は、受給資格期間を満たせない一定の人などが対象です。」</p></div></details>", "R": "<p>「強制加入は原則20〜59歳。不足期間があれば60〜64歳で任意加入できる場合があり、65〜69歳には受給資格不足者への特例もあります。」</p>", "M": "<p>「<strong>任意加入＝国民年金の強制加入期間外でも、一定要件のもと不足期間を補える仕組み。</strong>」</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "<h3>A｜要点</h3><p>「先輩、保険料を払えないときに一番避けたいのは、何も手続きせず<strong>未納</strong>にすることです。」</p><p>「国民年金には全額免除・一部免除、納付猶予、学生納付特例があります。免除期間は一定割合が年金額に反映されますが、納付猶予・学生納付特例は追納しなければ老齢基礎年金額には反映されません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「全額免除の承認期間は受給資格期間に入り、2009年4月以降の期間なら、全額納付した場合の<strong>2分の1</strong>が老齢基礎年金額に反映されるのが基本です。」</p><p>「一部免除には4分の3免除・半額免除・4分の1免除があります。ただし残った保険料を払わないと、その期間は未納扱いになる点に注意してください。」</p><p>「納付猶予と学生納付特例は、受給資格期間には算入されますが、追納しない限り老齢基礎年金額には反映されません。」</p><p>「免除・猶予等の期間は原則<strong>10年以内なら追納</strong>できます。ただし一定期間を過ぎた追納には加算額が付く場合があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「年金記録を“納付済”“免除・猶予”“未納”の三箱に分けます。納付済は満額反映。免除は一定割合が残る。猶予・学生特例は資格期間には残るけれど、追納しなければ年金額は増えません。」</p><p>「未納は受給資格期間にも原則入らず、障害・遺族年金の保険料納付要件でも不利になり得ます。だから<strong>払えないからこそ申請する</strong>んです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが1年間全額免除を受けたなら、その1年は受給資格期間に入り、2009年4月以降なら年金額には全額納付の2分の1相当が反映されます。」</p><p>「Bさんが1年間納付猶予を受けた場合、その1年は受給資格期間に入りますが、追納しなければ老齢基礎年金額には反映されません。」</p><p>「Cさんが申請せず1年間未納にすると、その期間は原則として受給資格期間に入りません。同じ“その年に全額払っていない”でも結果は大きく違います。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜全額免除期間は年金額にまったく反映されない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。2009年4月以降の全額免除期間は、全額納付した場合の2分の1が反映されます。」</p></div></details><h4>Q2｜納付猶予は追納しなくても年金額に反映？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。資格期間には入りますが、追納しない限り老齢基礎年金額には反映されません。」</p></div></details><h4>Q3｜免除・猶予と未納は同じ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「違います。承認された免除・猶予は受給資格期間に算入されますが、単なる未納は原則算入されません。」</p></div></details>", "R": "<p>「免除＝資格期間＋一定割合が年金額へ。猶予・学生特例＝資格期間には入るが追納なしでは年金額に反映なし。未納とは違います。」</p>", "M": "<p>「<strong>免除・猶予は“未納”ではない。払えないときほど制度を申請して年金資格を守る。</strong>」</p>"}}, {"title": "老齢基礎年金", "content": {"A": "<h3>A｜要点</h3><p>「老齢基礎年金は、公的年金の1階部分である国民年金から老後に受け取る基本の年金です。」</p><p>「原則<strong>受給資格期間10年以上</strong>で、<strong>65歳から</strong>受給します。20歳から60歳までの40年間＝480月すべて納付済なら満額が基本です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「“10年”と“40年”を混ぜないでください。10年は<strong>受給資格を得る最低ライン</strong>。40年は<strong>満額の基準</strong>です。」</p><p>「10年だけでも資格は得られますが満額ではありません。40年間すべて納付済なら原則その年度の満額です。」</p><p>「免除期間はゼロとは限りません。免除の種類や時期に応じた割合が年金額へ反映されます。そして通常65歳開始ですが、繰上げ・繰下げで開始時期を動かせます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「480マスのボードを想像してください。20歳から60歳まで1か月1マス。全部納付済なら480マス＝満額です。」</p><p>「一方、受給資格には別の入口があり、その鍵が原則10年以上です。だから<strong>10年＝入口、40年＝満額</strong>。役割が違います。」</p>", "D": "<h3>D｜具体例</h3><p>「理解用に満額を仮に年83万円とします。Aさんが480月すべて納付済なら83万円×480/480＝83万円です。」</p><p>「Bさんが360月納付済、残り120月が未納なら、単純化すると83万円×360/480＝62万2,500円です。」</p><p>「でも残り120月が2009年4月以降の全額免除なら、その120月は2分の1相当が反映されます。“払っていない月は全部ゼロ”ではありません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜原則的な支給開始年齢は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「65歳です。」</p></div></details><h4>Q2｜受給資格10年で満額？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。10年は受給資格の最低期間。満額の基本は40年＝480月です。」</p></div></details><h4>Q3｜免除期間は必ず年金額ゼロ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。免除の種類・時期に応じて一定割合が反映されます。」</p></div></details>", "R": "<p>「老齢基礎年金＝1階部分。原則65歳。受給資格は10年以上。満額の基準は40年＝480月。“10年は入口、40年は満額”です。」</p>", "M": "<p>「<strong>老齢基礎年金は、原則10年以上で受給資格、65歳から受給、40年納付で満額。</strong>」</p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "<h3>A｜要点</h3><p>「老齢年金は原則65歳開始ですが、受給開始を動かせます。<strong>繰上げ＝早く受け取る代わりに生涯減額、繰下げ＝遅く受け取る代わりに生涯増額</strong>です。」</p><p>「一定の生年月日以降の人では、繰上げは1か月<strong>0.4%減</strong>、繰下げは1か月<strong>0.7%増</strong>が基本です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「早く受け取れば平均的には受給月数が増えるので毎月額を減らし、遅く受け取れば受給月数が減るので毎月額を増やす仕組みです。」</p><p>「繰上げは原則60〜64歳で請求し、いったん請求すると取り消せず減額は生涯続きます。」</p><p>「繰下げは66歳以後75歳まで。1か月0.7%増なので75歳まで120か月繰り下げると<strong>84%増</strong>です。」</p><p>「繰上げ0.4%は1962年4月2日以後生まれの人。一定のそれ以前生まれは0.5%なので、生年月日条件も確認してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「65歳を中央にしたスライダーです。左へ動かして60歳に近づくほど“早くもらう代わりに小さく”。右へ動かして75歳へ近づくほど“待つ代わりに大きく”。」</p><p>「そして開始後に65歳基準へ戻すスイッチはありません。増減率は基本的に生涯続きます。」</p>", "D": "<h3>D｜具体例</h3><p>「65歳時点の年金額を仮に年100万円とします。1962年4月2日以後生まれの人が60歳ちょうどで繰上げると、60か月×0.4%=24%減。年額は76万円のイメージです。」</p><p>「70歳まで60か月繰下げると60×0.7%=42%増で142万円。75歳まで120か月なら84%増で184万円です。」</p><p>「ただし増額率だけで得・損は決まりません。待っている期間は原則その年金を受け取らないため、寿命や生活資金などで総受給額は変わります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜60か月を0.4%で繰上げた場合の減額率は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「24%減です。」</p></div></details><h4>Q2｜70歳まで60か月繰下げた場合は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「42%増です。」</p></div></details><h4>Q3｜75歳までの最大増額率は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「120か月×0.7%=84%増です。」</p></div></details>", "R": "<p>「標準65歳。繰上げ＝早く受けて生涯減額。繰下げ＝待って生涯増額。0.4%と0.7%、最大84%をつなげます。」</p>", "M": "<p>「<strong>繰上げは“早くもらって生涯減額”、繰下げは“待って生涯増額”。</strong>」</p>"}}, {"title": "付加年金", "content": {"A": "<h3>A｜要点</h3><p>「付加年金は、国民年金の<strong>第1号被保険者や一定の任意加入被保険者</strong>が、通常の保険料に月額400円を上乗せし、将来の老齢基礎年金へ付加年金を上乗せする制度です。」</p><p>「付加年金の年額は<strong>200円×付加保険料納付月数</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「10年間＝120か月納めると、付加保険料は400円×120＝4万8,000円。将来の付加年金は200円×120＝年2万4,000円です。」</p><p>「2年間受け取れば2万4,000円×2＝4万8,000円。単純な名目額なら2年で納付額と同額になります。」</p><p>「ただし誰でも利用できるわけではありません。厚生年金に加入する第2号被保険者や第3号被保険者が通常利用する制度ではなく、国民年金基金の加入者は付加保険料を納められません。」</p><p>「“400円払って毎月200円もらう”ではありません。<strong>400円は月額保険料、200円×月数は年金の年額</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「毎月の国民年金保険料の横に400円の追加ポケットがあります。400円を入れた月ごとに、老後へ“年間200円追加”という札が1枚貼られるイメージです。」</p><p>「120枚なら年2万4,000円。1年で2万4,000円、2年で4万8,000円。払った4万8,000円と一致するので、“2年”が自然に出てきます。」</p>", "D": "<h3>D｜具体例</h3><p>「第1号被保険者Aさんが20年間＝240か月納めると、400円×240＝<strong>9万6,000円</strong>を追加で払います。」</p><p>「将来の付加年金は200円×240＝<strong>年4万8,000円</strong>。2年間で9万6,000円、3年間なら14万4,000円です。」</p><p>「一方、会社員で厚生年金に加入する第2号被保険者Bさんは、通常この付加年金を利用する対象ではありません。誰が利用できるかまでセットです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜付加保険料はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「月額400円です。」</p></div></details><h4>Q2｜120か月納めた場合の付加年金年額は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「200円×120＝年2万4,000円です。」</p></div></details><h4>Q3｜国民年金基金と付加年金は併用できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則できません。国民年金基金加入者は付加保険料を納められません。」</p></div></details>", "R": "<p>「第1号等が月400円追加。年金は年200円×月数。名目額なら2年受給で納付額相当。国民年金基金とは原則併用不可です。」</p>", "M": "<p>「<strong>付加年金＝月400円を上乗せし、老後に年200円×納付月数を受け取る上乗せ年金。</strong>」</p>"}}, {"title": "老齢厚生年金", "content": {"A": "<h3>A｜要点</h3><p>「先輩、老齢厚生年金は、公的年金の<strong>2階部分</strong>です。会社員など厚生年金に加入して働いた人が、老齢基礎年金に上乗せして受け取る年金です。」</p><p>「原則65歳から。老齢基礎年金の受給資格期間を満たし、厚生年金の被保険者期間があることが基本です。」</p><p>「金額は一律ではありません。<strong>加入していた期間と、その間の報酬</strong>を基礎に計算する報酬比例部分が中心です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「前項の老齢基礎年金は、40年間納付すれば満額という“共通の土台”でした。一方、老齢厚生年金は会社員時代の給与・賞与と加入期間によって人ごとに差が出ます。」</p><p>「長く加入し、標準報酬が高かった人ほど、基本的には報酬比例部分が大きくなる方向です。だから同じ40年間働いても、報酬の履歴が違えば厚生年金額も同じとは限りません。」</p><p>「また、一定世代には65歳前に受け取る<strong>特別支給の老齢厚生年金</strong>があります。これは厚生年金の支給開始年齢を60歳から65歳へ段階的に引き上げた経過措置です。誰でも60歳からもらえる制度ではありません。」</p><p>「65歳以降の老齢厚生年金には、条件により加給年金額や経過的加算などが加わることがあります。次の項目は、この“本体の周辺に付く調整部分”を見ていきます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「2階建ての年金住宅を思い出してください。1階の老齢基礎年金は全国共通の土台。会社員Aさんは働いている間、さらに2階の厚生年金を積み上げています。」</p><p>「2階には“何年加入したか”だけでなく、“その期間にどれくらいの報酬だったか”も記録されます。だからAさんとBさんが同じ年数会社員でも、報酬履歴が違えば2階部分の高さが変わります。」</p><p>「65歳になると、要件を満たせば1階の老齢基礎年金＋2階の老齢厚生年金。この二本が老後の公的年金の中心になります。」</p>", "D": "<h3>D｜具体例</h3><p>「AさんとBさんがどちらも30年間厚生年金に加入したとします。ただしAさんの標準報酬の平均的な水準はBさんより高かったとします。」</p><p>「老齢基礎年金だけなら、納付・免除等の月数を中心に計算します。しかし老齢厚生年金の報酬比例部分では、加入期間に加えて報酬水準が反映されるため、他の条件が同じならAさんの方が厚生年金部分は大きくなる方向です。」</p><p>「ここで“厚生年金に30年入ったから全員同額”は×。<strong>期間×報酬</strong>という発想を持ってください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜老齢厚生年金は公的年金の何階部分？</h4><details><summary>答えを見る</summary><div class='answer'><p>「2階部分です。1階は国民年金からの老齢基礎年金です。」</p></div></details><h4>Q2｜加入期間が同じなら老齢厚生年金額も必ず同じ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。報酬比例部分には加入期間だけでなく報酬水準も反映されます。」</p></div></details><h4>Q3｜特別支給の老齢厚生年金は現在すべての人が60歳から受給できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。支給開始年齢引上げに伴う経過措置で、一定の生年月日等の要件があります。」</p></div></details>", "R": "<p>「老齢厚生年金＝2階。原則65歳。基礎年金に上乗せ。中心は報酬比例で、加入期間と報酬履歴が効く。ここです。」</p>", "M": "<p>「<strong>老齢厚生年金＝会社員等が積み上げる、加入期間と報酬に応じた2階部分の老齢年金。</strong>」</p>"}}, {"title": "経過的加算", "content": {"A": "<h3>A｜要点</h3><p>「経過的加算は、老齢厚生年金に付く<strong>調整額</strong>です。特別支給の老齢厚生年金にあった定額部分と、65歳からの老齢基礎年金との間に生じる差を埋める役割があります。」</p><p>「先輩、“年金が少ない人全員への救済加算”ではありません。厚生年金の支給開始年齢引上げや制度移行に伴う差を調整する仕組みです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「昔の厚生年金には、報酬比例部分に加えて定額部分がありました。制度改正後、65歳からは国民年金の老齢基礎年金が土台になります。」</p><p>「ところが、厚生年金の定額部分を計算するときに評価される加入期間と、老齢基礎年金の計算に反映される期間は完全には一致しません。特に20歳前や60歳以後の厚生年金加入期間などは、老齢基礎年金額の計算にそのまま入らない場合があります。」</p><p>「そこで、65歳以降に“厚生年金の定額部分相当額－老齢基礎年金相当額”という考え方で差を調整するのが経過的加算です。」</p><p>「名前の“経過的”がヒントです。新しい制度へ切り替える途中で、旧制度との接続部分に段差ができないよう調整するものなんです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一本の道路を想像してください。旧制度側の道路は“厚生年金の定額部分”という高さで走っています。65歳地点から新制度側の“老齢基礎年金”という道路へ接続します。」</p><p>「でも両方の計算対象期間が完全に同じではないため、接続地点に小さな段差ができる人がいます。」</p><p>「その段差に板を渡して滑らかにつなぐのが経過的加算です。だから独立した3階建て年金というより、<strong>制度の切替えで生じる差の調整</strong>なんですね。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが20歳になる前から厚生年金に加入して働いていたとします。その厚生年金加入期間は厚生年金側の計算には意味を持ちますが、老齢基礎年金は原則20歳から60歳までの国民年金加入期間を中心に計算します。」</p><p>「すると65歳で定額部分から基礎年金へ切り替える際、計算対象期間の違いによる差が生じることがあります。その差を厚生年金側で調整するのが経過的加算です。」</p><p>「したがって、“65歳になった人全員に同じ金額が追加される”わけではありません。<strong>その人の加入記録に基づく差額調整</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜経過的加算は、所得が低い人全員への生活支援金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。制度移行に伴う定額部分と老齢基礎年金との差などを調整する厚生年金の加算です。」</p></div></details><h4>Q2｜なぜ差が生じる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「厚生年金の定額部分相当額と老齢基礎年金では、計算の基礎となる加入期間等が完全には一致しないためです。」</p></div></details><h4>Q3｜名前の“経過的”は何を表す？</h4><details><summary>答えを見る</summary><div class='answer'><p>「旧制度から新制度への移行・経過措置として差を調整する性格を表します。」</p></div></details>", "R": "<p>「経過的加算＝制度の継ぎ目の段差調整。定額部分相当と基礎年金相当の差を厚生年金側で埋める、と理解します。」</p>", "M": "<p>「<strong>経過的加算＝厚生年金の定額部分と老齢基礎年金との制度上の差を埋める調整額。</strong>」</p>"}}, {"title": "配偶者加給年金と振替加算", "content": {"A": "<h3>A｜要点</h3><p>「先輩、この二つは<strong>夫婦の年齢差による年金の谷をつなぐ仕組み</strong>として覚えると分かりやすいです。」</p><p>「加給年金額は、厚生年金の被保険者期間が原則20年以上ある人などが65歳になったとき、生計を維持している<strong>原則65歳未満の配偶者</strong>などがいる場合に老齢厚生年金へ加算されるものです。」</p><p>「その配偶者が65歳になると、配偶者分の加給年金額は原則終了し、一定の生年月日等の要件を満たす配偶者自身の老齢基礎年金に<strong>振替加算</strong>が付く場合があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば夫Aさん65歳、妻Bさん60歳。Aさんには老齢厚生年金が始まりますが、Bさんの老齢基礎年金は原則65歳からなので、夫婦全体では5年間の“年金の谷”ができます。」</p><p>「一定要件を満たすと、その間Aさんの老齢厚生年金へ配偶者分の加給年金額を加えます。イメージとしては公的年金版の家族手当です。」</p><p>「Bさんが65歳になると自分の老齢基礎年金を受けられるので、AさんについていたBさん分の加給年金は原則終了します。そしてBさんが一定の生年月日等の要件を満たせば、Bさん自身の老齢基礎年金へ振替加算が付くことがあります。」</p><p>「ただし“加給年金がそのまま同額で妻へ移動する”わけではありません。振替加算は別の計算による制度で、生年月日が若くなるほど額が小さくなり、一定以後生まれにはありません。」</p><p>「また配偶者自身に一定の老齢厚生年金等の受給権がある場合など、加給年金が支給停止となるケースもあります。単に“年下の配偶者がいれば必ず加算”ではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「夫婦で二本の年金レールを走っています。Aさんが先に65歳駅へ到着。でもBさんはまだ60歳で、65歳駅まで5年あります。」</p><p>「その5年間、条件を満たせばAさん側の車両に“配偶者加給”という補助車両が付きます。」</p><p>「Bさんも65歳駅へ着くと、その補助車両はAさん側から外れます。そして対象世代なら、Bさん自身の基礎年金側に“振替加算”という小さな車両が付く。」</p><p>「<strong>65歳前は年上側の厚生年金へ加給、65歳後は対象なら年下側の基礎年金へ振替</strong>。この移動図です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさん65歳、配偶者Bさん60歳。Aさんの厚生年金加入期間などが加給年金の要件を満たし、BさんがAさんに生計維持されるなど他の要件も満たすとします。」</p><p>「Bさんが65歳になるまで、Aさんの老齢厚生年金に配偶者加給年金額が加算される可能性があります。」</p><p>「5年後、Bさんが65歳になるとBさん分の加給年金は原則終了。Bさんが振替加算の対象世代・要件を満たすなら、今度はBさん自身の老齢基礎年金へ振替加算が付きます。」</p><p>「ここで人物を追えば、“誰の年金に付くか”を間違えません。<strong>加給＝Aさんの老齢厚生年金、振替＝Bさんの老齢基礎年金</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜配偶者分の加給年金は、原則誰の年金に付く？</h4><details><summary>答えを見る</summary><div class='answer'><p>「厚生年金の加入期間等の要件を満たす年上側などの老齢厚生年金に加算されます。」</p></div></details><h4>Q2｜配偶者が65歳になると配偶者分の加給年金はどうなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則終了します。一定要件を満たせば、その配偶者自身の老齢基礎年金に振替加算が付く場合があります。」</p></div></details><h4>Q3｜加給年金と振替加算は同額がそのまま移る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。振替加算は別の仕組みで、生年月日等により額・対象が異なります。」</p></div></details>", "R": "<p>「加給＝65歳未満の配偶者等がいる一定の厚生年金受給者側。配偶者65歳で原則終了。その後、対象なら配偶者自身の基礎年金へ振替加算です。」</p>", "M": "<p>「<strong>加給年金は年上側の厚生年金、振替加算は65歳になった対象配偶者自身の基礎年金。</strong>」</p>"}}, {"title": "在職老齢年金", "content": {"A": "<h3>A｜要点</h3><p>「在職老齢年金は、<strong>厚生年金に加入しながら働いて老齢厚生年金を受ける人</strong>について、賃金と老齢厚生年金の合計が一定基準を超えると、老齢厚生年金の一部または全部を支給停止する仕組みです。」</p><p>「重要なのは、<strong>老齢基礎年金は在職老齢年金による支給停止の対象ではない</strong>ことです。」</p><p>「また基準額は改定されるため、FPでは受験年度の数字を確認しつつ、まず“賃金＋厚生年金が高い場合に厚生年金を調整する”という構造を理解してください。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、“働いたら年金が全部止まる”ではありません。働きながら年金を受け取ること自体はできます。」</p><p>「調整では、給与・賞与を月額換算した<strong>総報酬月額相当額</strong>と、老齢厚生年金の基本月額を合計して基準額と比較します。」</p><p>「合計が基準以下なら老齢厚生年金は基本的にその調整では減りません。基準を超えると、超えた部分に応じて老齢厚生年金が支給停止されます。」</p><p>「そして調整対象は老齢厚生年金です。国民年金から出る老齢基礎年金まで同じ計算で削られるわけではありません。」</p><p>「なお、在職老齢年金の支給停止基準額は賃金・物価等を踏まえて年度ごとに改定されます。数字を固定暗記するより、年度を確認する癖を付けましょう。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「65歳以降も働くAさんの机に、二つの封筒があると思ってください。一つは“毎月の賃金”、もう一つは“老齢厚生年金の基本月額”。」</p><p>「この二つを一定のルールで足し、基準ラインと比較します。ラインを超えなければ厚生年金はそのまま。超えれば、超過に応じて厚生年金側にブレーキがかかります。」</p><p>「でも机の横にある“老齢基礎年金”の封筒には、この在職老齢年金のブレーキはかかりません。<strong>基礎年金と厚生年金を分ける</strong>のがポイントです。」</p>", "D": "<h3>D｜具体例</h3><p>「計算構造を理解するため、仮にその年度の支給停止調整額を50万円とします。実際の基準額は受験年度の値を確認してください。」</p><p>「Aさんの総報酬月額相当額が35万円、老齢厚生年金の基本月額が10万円なら合計45万円。仮の基準50万円以下なので、この例では在職老齢年金による支給停止はありません。」</p><p>「Bさんが総報酬45万円、基本月額15万円なら合計60万円。基準を10万円超えています。制度の基本式では超過額の2分の1に相当する額が厚生年金から支給停止される方向なので、この仮定では月5万円が停止されるイメージです。」</p><p>「ただしBさんの老齢基礎年金まで5万円減るわけではありません。調整するのは老齢厚生年金です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜65歳以降も会社員として働くと老齢年金は必ず全部停止？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。賃金と老齢厚生年金の合計等が基準を超えた場合に、老齢厚生年金の一部または全部が停止されます。」</p></div></details><h4>Q2｜老齢基礎年金も在職老齢年金の支給停止対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。老齢基礎年金はこの制度による支給停止の対象ではありません。」</p></div></details><h4>Q3｜支給停止基準額は永久に同じ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。年度ごとに改定され得るため、受験年度の基準を確認します。」</p></div></details>", "R": "<p>「働きながら受給は可能。賃金＋老齢厚生年金が基準超過なら厚生年金を調整。老齢基礎年金は対象外。数字は年度確認です。」</p>", "M": "<p>「<strong>在職老齢年金＝働く高齢者の賃金と老齢厚生年金が一定基準を超えると、厚生年金側を調整する仕組み。</strong>」</p>"}}, {"title": "障害基礎年金", "content": {"A": "<h3>A｜要点</h3><p>「ここから“老後”ではなく<strong>障害という生活リスク</strong>への年金です。障害基礎年金は、病気やけがによって法令上の障害等級<strong>1級または2級</strong>に該当するなど、所定の要件を満たした場合に国民年金から支給されます。」</p><p>「ポイントは、単に障害者手帳を持っているかではなく、<strong>初診日・障害状態・保険料納付要件</strong>などで判定することです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず初診日。障害の原因となった病気やけがについて、初めて医師等の診療を受けた日です。原則として、その初診日に国民年金の被保険者であることなどが要件になります。」</p><p>「次に障害認定日。原則、初診日から1年6か月を経過した日、またはそれより前に症状が固定した一定の日です。その時点などで障害等級1級・2級に該当するかを見ます。」</p><p>「さらに保険料納付要件があります。原則、初診日の前日において、初診日のある月の前々月までの被保険者期間のうち、保険料納付済期間＋免除期間が3分の2以上必要です。」</p><p>「ただし一定期間は特例として、65歳未満で、初診日のある月の前々月までの直近1年間に保険料の未納がなければ要件を満たせる仕組みがあります。」</p><p>「そして20歳前に初診日がある障害については、本人が国民年金保険料を納める前の出来事なので、通常の保険料納付要件は問われません。ただし所得による支給制限があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「障害基礎年金の審査には三つの門があると思ってください。」</p><p>「第1の門が<strong>初診日</strong>。“いつ、その病気・けがで初めて医療機関にかかったか”。第2が<strong>障害状態</strong>。“認定日に1級・2級に当たるか”。第3が<strong>保険料</strong>。“それまできちんと納付・免除等の記録があるか”。」</p><p>「病名だけで自動的にもらえるのではありません。この三つの門を順番に確認します。」</p><p>「20歳前障害なら第3の門の扱いが特別です。まだ本人に保険料納付義務がなかったため、通常の納付要件を求めないわけです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさん30歳が病気で初めて病院を受診しました。この日が初診日です。その後、原則1年6か月後の障害認定日に法令上の2級に該当したとします。」</p><p>「次に初診日前の保険料記録を確認します。納付済期間と免除期間を合わせて所定の3分の2以上という要件を満たしていれば、他の要件と合わせて障害基礎年金の対象を検討できます。」</p><p>「一方Bさんは18歳で初診日があり、その障害が20歳以後も所定の1級・2級に該当するとします。この場合は20歳前障害として通常の保険料納付要件は問われません。ただし本人所得による支給制限があります。」</p><p>「つまり“現在どれだけ重いか”だけではなく、<strong>最初に診てもらった日まで遡る</strong>のが障害年金の特徴です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜障害基礎年金の障害等級は何級まで？</h4><details><summary>答えを見る</summary><div class='answer'><p>「1級と2級です。障害厚生年金には3級もありますが、障害基礎年金には3級はありません。」</p></div></details><h4>Q2｜障害認定日は原則いつ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として初診日から1年6か月を経過した日です。ただしそれ以前に症状が固定した一定の場合など例外があります。」</p></div></details><h4>Q3｜20歳前初診の障害でも通常の保険料納付要件が必要？</h4><details><summary>答えを見る</summary><div class='answer'><p>「通常の保険料納付要件は問われません。ただし本人所得による支給制限があります。」</p></div></details>", "R": "<p>「障害基礎年金＝1・2級。見る順番は初診日→障害状
