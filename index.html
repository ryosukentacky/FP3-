になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、告知義務に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、告知義務に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>告知義務とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 告知義務が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→告知義務の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを告知義務の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：告知義務　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。　⑤比較：ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>告知義務：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "責任開始日", "content": {"A": "\n<p>「先輩、<strong>責任開始日</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>責任開始日は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 責任開始日が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。責任開始日は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>責任開始日という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 責任開始日が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで責任開始日の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ責任開始日の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>責任開始日＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が責任開始日の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ責任開始日の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、責任開始日に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、責任開始日に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>責任開始日とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 責任開始日が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→責任開始日の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを責任開始日の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：責任開始日　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。　⑤比較：ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>責任開始日：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "保険料の払込猶予", "content": {"A": "\n<p>「先輩、<strong>保険料の払込猶予</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>保険料の払込猶予は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 保険料の払込猶予が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。保険料の払込猶予は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>保険料の払込猶予という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 保険料の払込猶予が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで保険料の払込猶予の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ保険料の払込猶予の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>保険料の払込猶予＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険料の払込猶予が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が保険料の払込猶予の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ保険料の払込猶予の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、保険料の払込猶予に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、保険料の払込猶予に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>保険料の払込猶予とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 保険料の払込猶予が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→保険料の払込猶予の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを保険料の払込猶予の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：保険料の払込猶予　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険料の払込猶予が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 保険料の払込猶予 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>保険料の払込猶予：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "自動振替貸付制度と契約者貸付制度", "content": {"A": "\n<p>「先輩、<strong>自動振替貸付制度と契約者貸付制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>自動振替貸付制度と契約者貸付制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 自動振替貸付制度と契約者貸付制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。自動振替貸付制度と契約者貸付制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>自動振替貸付制度と契約者貸付制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 自動振替貸付制度と契約者貸付制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで自動振替貸付制度と契約者貸付制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ自動振替貸付制度と契約者貸付制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>自動振替貸付制度と契約者貸付制度＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 自動振替貸付制度と契約者貸付制度が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が自動振替貸付制度と契約者貸付制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ自動振替貸付制度と契約者貸付制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、自動振替貸付制度と契約者貸付制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、自動振替貸付制度と契約者貸付制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>自動振替貸付制度と契約者貸付制度とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 自動振替貸付制度と契約者貸付制度が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→自動振替貸付制度と契約者貸付制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを自動振替貸付制度と契約者貸付制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：自動振替貸付制度と契約者貸付制度　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 自動振替貸付制度と契約者貸付制度が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 自動振替貸付制度と契約者貸付制度 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>自動振替貸付制度と契約者貸付制度：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "契約の失効と復活", "content": {"A": "\n<p>「先輩、<strong>契約の失効と復活</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>契約の失効と復活は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約の失効と復活が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。契約の失効と復活は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>契約の失効と復活という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約の失効と復活が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで契約の失効と復活の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ契約の失効と復活の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>契約の失効と復活＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約の失効と復活が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が契約の失効と復活の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ契約の失効と復活の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、契約の失効と復活に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、契約の失効と復活に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>契約の失効と復活とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約の失効と復活が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→契約の失効と復活の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを契約の失効と復活の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：契約の失効と復活　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約の失効と復活が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 契約の失効と復活 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>契約の失効と復活：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "必要保障額", "content": {"A": "\n<p>「先輩、<strong>必要保障額</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。</p>\n<p>Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。</p>\n<h3>何のための知識か</h3>\n<p>必要保障額は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 必要保障額 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 必要保障額が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。必要保障額は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>必要保障額という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 必要保障額が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで必要保障額の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ必要保障額の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>必要保障額＝「遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 必要保障額は必要資金－準備済資金 です。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が必要保障額の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ必要保障額の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、必要保障額に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、必要保障額に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>必要保障額とは何か。<div class=\"answer\"><b>答え：</b>遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。<br>Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 必要保障額が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→必要保障額の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを必要保障額の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。 さらに、具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</div></li>\n</ol>", "R": "<p>①テーマ：必要保障額　②核心：遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。　③仕組み：Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 必要保障額は必要資金－準備済資金 です。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 必要保障額 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は必要保障額は必要資金－準備済資金です。</p>", "M": "<p><strong>必要保障額：</strong>遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。</p>"}}, {"title": "生命保険", "content": {"A": "\n<p>「先輩、<strong>生命保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>生命保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 生命保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。生命保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>生命保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 生命保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで生命保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ生命保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>生命保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が生命保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ生命保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、生命保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、生命保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>生命保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 生命保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→生命保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを生命保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：生命保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 生命保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>", "M": "<p><strong>生命保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "定期保険", "content": {"A": "\n<p>「先輩、<strong>定期保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>定期保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 定期保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。定期保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 定期保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>定期保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで定期保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金 す。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>平準定期保険・逓減定期保険・逓増定期保険・収入保障保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、平準定期保険・逓減定期保険・逓増定期保険・収入保障保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、平準定期保険・逓減定期保険・逓増定期保険・収入保障保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>平準定期保険・逓減定期保険・逓増定期保険・収入保障保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：平準定期保険・逓減定期保険・逓増定期保険・収入保障保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 を具体例に落とします。</p>", "M": "<p><strong>平準定期保険・逓減定期保険・逓増定期保険・収入保障保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "終身保険", "content": {"A": "\n<p>「先輩、<strong>終身保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>終身保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで終身保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 終身保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。終身保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>終身保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで終身保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ終身保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>終身保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が終身保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ終身保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、終身保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、終身保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>終身保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→終身保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを終身保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</div></li>\n</ol>", "R": "<p>①テーマ：終身保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 終身保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>", "M": "<p><strong>終身保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "積立利率変動型終身保険", "content": {"A": "\n<p>「先輩、<strong>積立利率変動型終身保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 積立利率変動型終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>積立利率変動型終身保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 積立利率変動型終身保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 積立利率変動型終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで積立利率変動型終身保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 積立利率変動型終身保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 積立利率変動型終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。積立利率変動型終身保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 積立利率変動型終身保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>積立利率変動型終身保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 積立利率変動型終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで積立利率変動型終身保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ積立利率変動型終身保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 積立利率変動型終身保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>積立利率変動型終身保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 積立利率変動型終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が積立利率変動型終身保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わって div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを積立利率変動型終身保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 積立利率変動型終身保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：積立利率変動型終身保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 積立利率変動型終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 積立利率変動型終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 積立利率変動型終身保険 を具体例に落とします。</p>", "M": "<p><strong>積立利率変動型終身保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "利率変動型積立終身保険", "content": {"A": "\n<p>「先輩、<strong>利率変動型積立終身保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 利率変動型積立終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>利率変動型積立終身保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 利率変動型積立終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで利率変動型積立終身保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 利率変動型積立終身保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 利率変動型積立終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。利率変動型積立終身保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>利率変動型積立終身保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 利率変動型積立終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで利率変動型積立終身保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ利率変動型積立終身保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>利率変動型積立終身保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 利率変動型積立終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が利率変動型積立終身保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ利率変動型積立終身保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、利率変動型積立終身保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、利率変動型積立終身保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>利率変動型積立終身保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 利率変動型積立終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 利率変動型積立終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→利率変動型積立終身保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを利率変動型積立終身保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：利率変動型積立終身保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 利率変動型積立終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 利率変動型積立終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 利率変動型積立終身保険 を具体例に落とします。</p>", "M": "<p><strong>利率変動型積立終身保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "低解約返戻金終身保険", "content": {"A": "\n<p>「先輩、<strong>低解約返戻金終身保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 低解約返戻金終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>低解約返戻金終身保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 低解約返戻金終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで低解約返戻金終身保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 低解約返戻金終身保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 低解約返戻金終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。低解約返戻金終身保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>低解約返戻金終身保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 低解約返戻金終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで低解約返戻金終身保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ低解約返戻金終身保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「 ・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→低解約返戻金終身保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを低解約返戻金終身保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：低解約返戻金終身保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 低解約返戻金終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 低解約返戻金終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 低解約返戻金終身保険 を具体例に落とします。</p>", "M": "<p><strong>低解約返戻金終身保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "養老保険", "content": {"A": "\n<p>「先輩、<strong>養老保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 養老保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>養老保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 養老保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 養老保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで養老保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 養老保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 養老保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。養老保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 養老保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>養老保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 養老保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで養老保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ養老保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 養老保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>養老保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が養老保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ養老保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 養老保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は定期・終身・養老などは保障期間と生存給付の有無で比較するです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、養老保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、養老保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>養老保険とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 養老保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 養老保険が必 の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 定期保険特約終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>定期保険特約終身保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険特約終身保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 定期保険特約終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで定期保険特約終身保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 定期保険特約終身保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 定期保険特約終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。定期保険特約終身保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険特約終身保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>定期保険特約終身保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 定期保険特約終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで定期保険特約終身保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ定期保険特約 保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 定期保険特約終身保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→定期保険特約終身保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険特約終身保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを定期保険特約終身保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険特約終身保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：定期保険特約終身保険　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 定期保険特約終身保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 定期保険特約終身保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険特約終身保険 を具体例に落とします。</p>", "M": "<p><strong>定期保険特約終身保険：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "団体定期保険", "content": {"A": "\n<p>「先輩、<strong>団体定期保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 団体定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>団体定期保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 団体定期保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 団体定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで団体定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 団体定期保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 団体定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。団体定期保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 団体定期保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>団体定期保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 団体定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで団体定期保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ団体定期保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 団体定期保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>団体定期保険＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 団体定期保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が団体定期保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ団体定期保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 団体定期保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、団体定期保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、団体定期保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>団体定
