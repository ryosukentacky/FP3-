<script>const cards=[{"title": "FPが守るべき3つのこと", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>FPが守るべき3つのこと</strong>です。」</p>\n<p>「一言でいうと――<strong>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</p>\n<p>「先輩、ここで一回止めます。<strong>FPが守るべき3つのこと</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>FPが守るべき3つのこと</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>FPが守るべき3つのこと</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>FPが守るべき3つのこと</strong>を一言で説明してください。<details><summary>答え</summary>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>FPが守るべき3つのこと</dd><dt>② 一番重要なのは？</dt><dd>FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</dd>\n<dt>③ なぜ？</dt><dd>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。だから『一般的な制度説明』と『専門資格が必要な個別判断』の境界を守ります。</dd><dt>④ イメージ</dt><dd>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。</dd>\n<dt>⑤ 具体例</dt><dd>顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。</dd><dt>⑥ 注意</dt><dd>一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>FPが守るべき3つのこと＝FPは顧客の利益を優先し、秘密を守り、税理士・弁護士などの独占業務へ無資格で踏み込まないことが基本です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>キャッシュフロー表</strong>です。」</p>\n<p>「一言でいうと――<strong>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</p>\n<p>「先輩、ここで一回止めます。<strong>キャッシュフロー表</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>キャッシュフロー表</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>キャッシュフロー表</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。単純化すれば年末貯蓄は550万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>キャッシュフロー表</strong>を一言で説明してください。<details><summary>答え</summary>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>キャッシュフロー表</dd><dt>② 一番重要なのは？</dt><dd>家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</dd>\n<dt>③ なぜ？</dt><dd>ライフイベントは一度に起きません。進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。</dd><dt>④ イメージ</dt><dd>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。</dd>\n<dt>⑤ 具体例</dt><dd>前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。単純化すれば年末貯蓄は550万円。</dd><dt>⑥ 注意</dt><dd>年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>キャッシュフロー表＝家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "終価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>終価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</p>\n<p>「先輩、ここで一回止めます。<strong>終価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>終価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>今100万円を持っていて、5年後の金額を知りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>終価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>今100万円を持っていて、5年後の金額を知りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％で5年なら 100万円×1.03^5≒115.9万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>終価係数</strong>を一言で説明してください。<details><summary>答え</summary>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>終価係数</dd><dt>② 一番重要なのは？</dt><dd>今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>元本だけでなく前年までの利息にも次の利息が付くのが複利です。毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。</dd><dt>④ イメージ</dt><dd>今100万円を持っていて、5年後の金額を知りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％で5年なら 100万円×1.03^5≒115.9万円。</dd><dt>⑥ 注意</dt><dd>年金終価係数は毎年積立。終価係数は最初にある一括資金です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>終価係数＝今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "現価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>現価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</p>\n<p>「先輩、ここで一回止めます。<strong>現価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>現価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>5年後に100万円必要で、今いくら準備すればよいか考える場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>現価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>5年後に100万円必要で、今いくら準備すればよいか考える場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>終価係数が『今→将来』なら、現価係数は『将来→今』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>現価係数</strong>を一言で説明してください。<details><summary>答え</summary>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>終価係数が『今→将来』なら、現価係数は『将来→今』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>現価係数</dd><dt>② 一番重要なのは？</dt><dd>将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</dd>\n<dt>③ なぜ？</dt><dd>将来額は運用で増えるので、今日から運用できるなら将来必要額と同額を今持つ必要はありません。終価計算を逆向きにたどります。</dd><dt>④ イメージ</dt><dd>5年後に100万円必要で、今いくら準備すればよいか考える場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。</dd><dt>⑥ 注意</dt><dd>終価係数が『今→将来』なら、現価係数は『将来→今』です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>現価係数＝将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "年金終価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>年金終価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</p>\n<p>「先輩、ここで一回止めます。<strong>年金終価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>年金終価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>年金終価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>年金終価係数</strong>を一言で説明してください。<details><summary>答え</summary>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>年金終価係数</dd><dt>② 一番重要なのは？</dt><dd>毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>1年目の積立金は長く運用され、最後の積立金は短く運用されます。その複数の終価をまとめて計算するのが年金終価係数です。</dd><dt>④ イメージ</dt><dd>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。</dd><dt>⑥ 注意</dt><dd>終価係数は一括資金。減債基金係数は目標将来額から毎年の積立額を逆算します。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>年金終価係数＝毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "減債基金係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>減債基金係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</p>\n<p>「先輩、ここで一回止めます。<strong>減債基金係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>減債基金係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>減債基金係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>減債基金係数</strong>を一言で説明してください。<details><summary>答え</summary>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>減債基金係数</dd><dt>② 一番重要なのは？</dt><dd>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>ゴールの金額が先に決まっています。積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。</dd><dt>④ イメージ</dt><dd>10年後に300万円作るため、毎年いくら積み立てるか決める場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。</dd><dt>⑥ 注意</dt><dd>年金終価係数の逆方向です。『毎年額→将来額』ではなく『将来額→毎年額』。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>減債基金係数＝将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "資本回収係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>資本回収係数</strong>です。」</p>\n<p>「一言でいうと――<strong>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</p>\n<p>「先輩、ここで一回止めます。<strong>資本回収係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>資本回収係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>退職時の1,000万円を10年間で均等に取り崩す場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>資本回収係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職時の1,000万円を10年間で均等に取り崩す場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>年金現価係数の逆方向。『現在元本→毎年受取額』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>資本回収係数</strong>を一言で説明してください。<details><summary>答え</summary>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>年金現価係数の逆方向。『現在元本→毎年受取額』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>資本回収係数</dd><dt>② 一番重要なのは？</dt><dd>今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。</dd><dt>④ イメージ</dt><dd>退職時の1,000万円を10年間で均等に取り崩す場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。</dd><dt>⑥ 注意</dt><dd>年金現価係数の逆方向。『現在元本→毎年受取額』です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>資本回収係数＝今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "年金現価係数", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>年金現価係数</strong>です。」</p>\n<p>「一言でいうと――<strong>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</p>\n<p>「先輩、ここで一回止めます。<strong>年金現価係数</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>年金現価係数</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>今から10年間、毎年100万円を受け取りたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>年金現価係数</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>今から10年間、毎年100万円を受け取りたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>年金現価係数</strong>を一言で説明してください。<details><summary>答え</summary>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>年金現価係数</dd><dt>② 一番重要なのは？</dt><dd>将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</dd>\n<dt>③ なぜ？</dt><dd>将来の各受取額を、それぞれ現在価値に割り戻して合計したものです。将来の年金の『今の値段』を求める感覚です。</dd><dt>④ イメージ</dt><dd>今から10年間、毎年100万円を受け取りたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。</dd><dt>⑥ 注意</dt><dd>資本回収係数は現在元本から毎年額。年金現価係数は毎年額から現在元本です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>年金現価係数＝将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>こども保険（学資保険）</strong>です。」</p>\n<p>「一言でいうと――<strong>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</p>\n<p>「先輩、ここで一回止めます。<strong>こども保険（学資保険）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>こども保険（学資保険）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>子どもが18歳になる時に大学資金を準備する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>こども保険（学資保険）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子どもが18歳になる時に大学資金を準備する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>こども保険（学資保険）</strong>を一言で説明してください。<details><summary>答え</summary>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>こども保険（学資保険）</dd><dt>② 一番重要なのは？</dt><dd>教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</dd>\n<dt>③ なぜ？</dt><dd>教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。商品によって契約者死亡時の保険料払込免除など保障もあります。</dd><dt>④ イメージ</dt><dd>子どもが18歳になる時に大学資金を準備する場面。</dd>\n<dt>⑤ 具体例</dt><dd>18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。</dd><dt>⑥ 注意</dt><dd>預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>こども保険（学資保険）＝教育資金を計画的に準備し、契約に応じて進学時などに祝金・満期保険金を受け取る保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>教育一般貸付（国の教育ローン）</strong>です。」</p>\n<p>「一言でいうと――<strong>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</p>\n<p>「先輩、ここで一回止めます。<strong>教育一般貸付（国の教育ローン）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>教育一般貸付（国の教育ローン）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>子の大学入学金を保護者が用意する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>教育一般貸付（国の教育ローン）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子の大学入学金を保護者が用意する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>教育一般貸付（国の教育ローン）</strong>を一言で説明してください。<details><summary>答え</summary>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>教育一般貸付（国の教育ローン）</dd><dt>② 一番重要なのは？</dt><dd>日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</dd>\n<dt>③ なぜ？</dt><dd>入学金や授業料などを家庭側で用意できないとき、保護者等が借りて教育資金を確保します。</dd><dt>④ イメージ</dt><dd>子の大学入学金を保護者が用意する場面。</dd>\n<dt>⑤ 具体例</dt><dd>入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。</dd><dt>⑥ 注意</dt><dd>奨学金は学生本人が借りる貸与型が中心。国の教育ローンは主に保護者側の借入です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>教育一般貸付（国の教育ローン）＝日本政策金融公庫が扱う、主に保護者が教育費を借りる公的融資です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "奨学金制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>奨学金制度</strong>です。」</p>\n<p>「一言でいうと――<strong>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</p>\n<p>「先輩、ここで一回止めます。<strong>奨学金制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>奨学金制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>大学生が毎月の学費・生活費を補う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>奨学金制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>大学生が毎月の学費・生活費を補う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">月5万円を4年間貸与なら元本だけで240万円。卒業後の返還計画まで見る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>奨学金制度</strong>を一言で説明してください。<details><summary>答え</summary>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>奨学金制度</dd><dt>② 一番重要なのは？</dt><dd>学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</dd>\n<dt>③ なぜ？</dt><dd>学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。貸与型は将来の本人負担になるため返還まで含めて考えます。</dd><dt>④ イメージ</dt><dd>大学生が毎月の学費・生活費を補う場面。</dd>\n<dt>⑤ 具体例</dt><dd>月5万円を4年間貸与なら元本だけで240万円。卒業後の返還計画まで見る。</dd><dt>⑥ 注意</dt><dd>教育ローンは主に保護者が債務者。奨学金の貸与型は学生本人が返還するのが基本です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>奨学金制度＝学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>固定金利期間選択型</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</p>\n<p>「先輩、ここで一回止めます。<strong>固定金利期間選択型</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>固定金利期間選択型</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>当初10年間だけ返済額を確定させたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>固定金利期間選択型</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>当初10年間だけ返済額を確定させたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>固定金利期間選択型</strong>を一言で説明してください。<details><summary>答え</summary>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>固定金利期間選択型</dd><dt>② 一番重要なのは？</dt><dd>住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</dd>\n<dt>③ なぜ？</dt><dd>最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。</dd><dt>④ イメージ</dt><dd>当初10年間だけ返済額を確定させたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>3,000万円を当初10年固定で借りても、11年目以降の適用金利が上がれば返済負担が増える可能性。</dd><dt>⑥ 注意</dt><dd>全期間固定は完済まで金利が固定。固定期間選択型は固定終了後の金利上昇リスクが残ります。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>固定金利期間選択型＝住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>元利均等返済と元金均等返済</strong>です。」</p>\n<p>「一言でいうと――<strong>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</p>\n<p>「先輩、ここで一回止めます。<strong>元利均等返済と元金均等返済</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>元利均等返済と元金均等返済</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>住宅ローンの返済方式を選ぶ場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>元利均等返済と元金均等返済</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>住宅ローンの返済方式を選ぶ場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">元金3,000万円・300回なら元金均等の元金部分は毎回10万円。これに残高に応じた利息が加わり、返済額は徐々に減る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『一定なのは返済総額か、元金部分か』で見分けます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>元利均等返済と元金均等返済</strong>を一言で説明してください。<details><summary>答え</summary>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『一定なのは返済総額か、元金部分か』で見分けます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>元利均等返済と元金均等返済</dd><dt>② 一番重要なのは？</dt><dd>元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</dd>\n<dt>③ なぜ？</dt><dd>利息は残高にかかります。元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。</dd><dt>④ イメージ</dt><dd>住宅ローンの返済方式を選ぶ場面。</dd>\n<dt>⑤ 具体例</dt><dd>元金3,000万円・300回なら元金均等の元金部分は毎回10万円。これに残高に応じた利息が加わり、返済額は徐々に減る。</dd><dt>⑥ 注意</dt><dd>『一定なのは返済総額か、元金部分か』で見分けます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>元利均等返済と元金均等返済＝元利均等は元金＋利息の毎回返済額が一定、元金均等は毎回返す元金額が一定です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>です。」</p>\n<p>「一言でいうと――<strong>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</p>\n<p>「先輩、ここで一回止めます。<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>繰上げ返済（期間短縮型・返済額軽減型）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>を一言で説明してください。<details><summary>答え</summary>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>繰上げ返済（期間短縮型・返済額軽減型）</dd><dt>② 一番重要なのは？</dt><dd>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</dd>\n<dt>③ なぜ？</dt><dd>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</dd><dt>④ イメージ</dt><dd>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</dd>\n<dt>⑤ 具体例</dt><dd>家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</dd><dt>⑥ 注意</dt><dd>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>繰上げ返済（期間短縮型・返済額軽減型）＝予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "財形住宅融資", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>財形住宅融資</strong>です。」</p>\n<p>「一言でいうと――<strong>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</p>\n<p>「先輩、ここで一回止めます。<strong>財形住宅融資</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>財形住宅融資</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社で財形貯蓄を続けてきた人が住宅購入する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>財形住宅融資</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社で財形貯蓄を続けてきた人が住宅購入する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>財形住宅融資</strong>を一言で説明してください。<details><summary>答え</summary>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>フラット35は財形貯蓄を前提としない別の住宅ローンです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>財形住宅融資</dd><dt>② 一番重要なのは？</dt><dd>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</dd>\n<dt>③ なぜ？</dt><dd>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</dd><dt>④ イメージ</dt><dd>会社で財形貯蓄を続けてきた人が住宅購入する場面。</dd>\n<dt>⑤ 具体例</dt><dd>財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。</dd><dt>⑥ 注意</dt><dd>フラット35は財形貯蓄を前提としない別の住宅ローンです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>財形住宅融資＝財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "フラット35", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>フラット35</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</p>\n<p>「先輩、ここで一回止めます。<strong>フラット35</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>フラット35</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>将来の金利上昇を避け、返済額を安定させたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>フラット35</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>将来の金利上昇を避け、返済額を安定させたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>フラット35</strong>を一言で説明してください。<details><summary>答え</summary>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>フラット35</dd><dt>② 一番重要なのは？</dt><dd>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</dd>\n<dt>③ なぜ？</dt><dd>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</dd><dt>④ イメージ</dt><dd>将来の金利上昇を避け、返済額を安定させたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。</dd><dt>⑥ 注意</dt><dd>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>フラット35＝住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>財形貯蓄制度</strong>です。」</p>\n<p>「一言でいうと――<strong>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</p>\n<p>「先輩、ここで一回止めます。<strong>財形貯蓄制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>財形貯蓄制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>財形貯蓄制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>財形貯蓄制度</strong>を一言で説明してください。<details><summary>答え</summary>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>財形貯蓄制度</dd><dt>② 一番重要なのは？</dt><dd>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</dd>\n<dt>③ なぜ？</dt><dd>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</dd><dt>④ イメージ</dt><dd>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</dd>\n<dt>⑤ 具体例</dt><dd>住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。</dd><dt>⑥ 注意</dt><dd>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>財形貯蓄制度＝勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "団体信用生命保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>団体信用生命保険</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</p>\n<p>「先輩、ここで一回止めます。<strong>団体信用生命保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>団体信用生命保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>住宅ローン返済中の世帯主が死亡する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>団体信用生命保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>住宅ローン返済中の世帯主が死亡する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>団体信用生命保険</strong>を一言で説明してください。<details><summary>答え</summary>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>団体信用生命保険</dd><dt>② 一番重要なのは？</dt><dd>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</dd><dt>④ イメージ</dt><dd>住宅ローン返済中の世帯主が死亡する場面。</dd>\n<dt>⑤ 具体例</dt><dd>死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。</dd><dt>⑥ 注意</dt><dd>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>団体信用生命保険＝住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>住宅ローンの借り換え</strong>です。」</p>\n<p>「一言でいうと――<strong>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</p>\n<p>「先輩、ここで一回止めます。<strong>住宅ローンの借り換え</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>住宅ローンの借り換え</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>昔の高金利ローンを現在の低金利ローンへ変更する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>住宅ローンの借り換え</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>昔の高金利ローンを現在の低金利ローンへ変更する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>住宅ローンの借り換え</strong>を一言で説明してください。<details><summary>答え</summary>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>住宅ローンの借り換え</dd><dt>② 一番重要なのは？</dt><dd>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</dd>\n<dt>③ なぜ？</dt><dd>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</dd><dt>④ イメージ</dt><dd>昔の高金利ローンを現在の低金利ローンへ変更する場面。</dd>\n<dt>⑤ 具体例</dt><dd>借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。</dd><dt>⑥ 注意</dt><dd>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>住宅ローンの借り換え＝現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>埋葬に関する給付</strong>です。」</p>\n<p>「一言でいうと――<strong>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</p>\n<p>「先輩、ここで一回止めます。<strong>埋葬に関する給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>埋葬に関する給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社員が死亡し、家族が埋葬を行う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>埋葬に関する給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員が死亡し、家族が埋葬を行う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>埋葬に関する給付</strong>を一言で説明してください。<details><summary>答え</summary>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>埋葬に関する給付</dd><dt>② 一番重要なのは？</dt><dd>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</dd>\n<dt>③ なぜ？</dt><dd>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</dd><dt>④ イメージ</dt><dd>会社員が死亡し、家族が埋葬を行う場面。</dd>\n<dt>⑤ 具体例</dt><dd>『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。</dd><dt>⑥ 注意</dt><dd>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>埋葬に関する給付＝健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "任意継続被保険者", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>任意継続被保険者</strong>です。」</p>\n<p>「一言でいうと――<strong>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</p>\n<p>「先輩、ここで一回止めます。<strong>任意継続被保険者</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>任意継続被保険者</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>退職して次の会社がまだ決まっていない場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>任意継続被保険者</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職して次の会社がまだ決まっていない場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">退職後は任意継続と国保の保険料等を比較。任意継続を選ぶなら申請期限を守る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>任意継続被保険者</strong>を一言で説明してください。<details><summary>答え</summary>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>任意継続被保険者</dd><dt>② 一番重要なのは？</dt><dd>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</dd>\n<dt>③ なぜ？</dt><dd>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</dd><dt>④ イメージ</dt><dd>退職して次の会社がまだ決まっていない場面。</dd>\n<dt>⑤ 具体例</dt><dd>退職後は任意継続と国保の保険料等を比較。任意継続を選ぶなら申請期限を守る。</dd><dt>⑥ 注意</dt><dd>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>任意継続被保険者＝退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "国民健康保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>国民健康保険</strong>です。」</p>\n<p>「一言でいうと――<strong>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</p>\n<p>「先輩、ここで一回止めます。<strong>国民健康保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>国民健康保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>退職後、任意継続を選ばず国保へ入る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>国民健康保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職後、任意継続を選ばず国保へ入る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">夫婦で国保へ移る場合、会社員時代の『扶養だから保険料ゼロ』と同じ感覚で考えない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>国民健康保険</strong>を一言で説明してください。<details><summary>答え</summary>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>国民健康保険</dd><dt>② 一番重要なのは？</dt><dd>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</dd>\n<dt>③ なぜ？</dt><dd>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</dd><dt>④ イメージ</dt><dd>退職後、任意継続を選ばず国保へ入る場面。</dd>\n<dt>⑤ 具体例</dt><dd>夫婦で国保へ移る場合、会社員時代の『扶養だから保険料ゼロ』と同じ感覚で考えない。</dd><dt>⑥ 注意</dt><dd>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>国民健康保険＝会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>後期高齢者医療制度</strong>です。」</p>\n<p>「一言でいうと――<strong>原則75歳以上などを対象とする独立した公的医療保険制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</p>\n<p>「先輩、ここで一回止めます。<strong>後期高齢者医療制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>後期高齢者医療制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>74歳まで国保だった人が75歳になる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>後期高齢者医療制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>74歳まで国保だった人が75歳になる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">75歳到達後は後期高齢者医療制度の被保険者として保険料・窓口負担を考える。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>後期高齢者医療制度</strong>を一言で説明してください。<details><summary>答え</summary>原則75歳以上などを対象とする独立した公的医療保険制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>後期高齢者医療制度</dd><dt>② 一番重要なのは？</dt><dd>原則75歳以上などを対象とする独立した公的医療保険制度です。</dd>\n<dt>③ なぜ？</dt><dd>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</dd><dt>④ イメージ</dt><dd>74歳まで国保だった人が75歳になる場面。</dd>\n<dt>⑤ 具体例</dt><dd>75歳到達後は後期高齢者医療制度の被保険者として保険料・窓口負担を考える。</dd><dt>⑥ 注意</dt><dd>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>後期高齢者医療制度＝原則75歳以上などを対象とする独立した公的医療保険制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的介護保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的介護保険</strong>です。」</p>\n<p>「一言でいうと――<strong>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</p>\n<p>「先輩、ここで一回止めます。<strong>公的介護保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的介護保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>65歳の人が日常生活に介助を必要とする場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的介護保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳の人が日常生活に介助を必要とする場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">申請→認定→ケアプラン等→サービス利用という流れをイメージし、自己負担割合は所得等で確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的介護保険</strong>を一言で説明してください。<details><summary>答え</summary>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的介護保険</dd><dt>② 一番重要なのは？</dt><dd>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</dd>\n<dt>③ なぜ？</dt><dd>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</dd><dt>④ イメージ</dt><dd>65歳の人が日常生活に介助を必要とする場面。</dd>\n<dt>⑤ 具体例</dt><dd>申請→認定→ケアプラン等→サービス利用という流れをイメージし、自己負担割合は所得等で確認。</dd><dt>⑥ 注意</dt><dd>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的介護保険＝介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "労災保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>労災保険</strong>です。」</p>\n<p>「一言でいうと――<strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</p>\n<p>「先輩、ここで一回止めます。<strong>労災保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>労災保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>通勤途中の合理的な経路で事故に遭う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>労災保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>通勤途中の合理的な経路で事故に遭う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『いつ・どこで・何のための移動か』を確認し、通勤災害に当たるか判断する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>労災保険</strong>を一言で説明してください。<details><summary>答え</summary>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>労災保険</dd><dt>② 一番重要なのは？</dt><dd>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</dd>\n<dt>③ なぜ？</dt><dd>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</dd><dt>④ イメージ</dt><dd>通勤途中の合理的な経路で事故に遭う場面。</dd>\n<dt>⑤ 具体例</dt><dd>『いつ・どこで・何のための移動か』を確認し、通勤災害に当たるか判断する。</dd><dt>⑥ 注意</dt><dd>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>労災保険＝業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "雇用保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>雇用保険</strong>です。」</p>\n<p>「一言でいうと――<strong>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</p>\n<p>「先輩、ここで一回止めます。<strong>雇用保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>雇用保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社を退職し、次の仕事を探す場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>雇用保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社を退職し、次の仕事を探す場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>雇用保険</strong>を一言で説明してください。<details><summary>答え</summary>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『雇用保険＝失業手当だけ』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>雇用保険</dd><dt>② 一番重要なのは？</dt><dd>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</dd>\n<dt>③ なぜ？</dt><dd>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</dd><dt>④ イメージ</dt><dd>会社を退職し、次の仕事を探す場面。</dd>\n<dt>⑤ 具体例</dt><dd>離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。</dd><dt>⑥ 注意</dt><dd>『雇用保険＝失業手当だけ』ではありません。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>雇用保険＝失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>就職促進給付と教育訓練給付</strong>です。」</p>\n<p>「一言でいうと――<strong>就職促進給付は早期再就職などを後押しし、教育訓練給付は指定された学び直しの費用を支援します。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>失業状態を長引かせないための『就職するインセンティブ』と、職業能力を高めるための『学ぶ支援』という別の役割があります。</p>\n<p>「先輩、ここで一回止めます。<strong>就職促進給付と教育訓練給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>就職促進給付と教育訓練給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>基本手当を受け切る前に再就職する人／資格講座を受ける人。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>就職促進給付と教育訓練給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>基本手当を受け切る前に再就職する人／資格講座を受ける人。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>就職促進給付と教育訓練給付</strong>を一言で説明してください。<details><summary>答え</summary>就職促進給付は早期再就職などを後押しし、教育訓練給付は指定された学び直しの費用を支援します。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>失業状態を長引かせないための『就職するインセンティブ』と、職業能力を高めるための『学ぶ支援』という別の役割があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>就職促進給付と教育訓練給付</dd><dt>② 一番重要なのは？</dt><dd>就職促進給付は早期再就職などを後押しし、教育訓練給付は指定された学び直しの費用を支援します。</dd>\n<dt>③ なぜ？</dt><dd>失業状態を長引かせないための『就職するインセンティブ』と、職業能力を高めるための『学ぶ支援』という別の役割があります。</dd><dt>④ イメージ</dt><dd>基本手当を受け切る前に再就職する人／資格講座を受ける人。</dd>\n<dt>⑤ 具体例</dt><dd>問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。</dd><dt>⑥ 注意</dt><dd>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>就職促進給付と教育訓練給付＝就職促進給付は早期再就職などを後押しし、教育訓練給付は指定された学び直しの費用を支援します。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>育児休業給付と雇用継続給付</strong>です。」</p>\n<p>「一言でいうと――<strong>雇用保険には、育児休業中の所得を支える給付や、働き続けることを支える給付があります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>育児で仕事を休むと賃金が減るため、雇用関係を切らずに休業・復帰できるよう所得を補います。雇用継続系の給付も『働き続ける』ことを支える考え方です。</p>\n<p>「先輩、ここで一回止めます。<strong>育児休業給付と雇用継続給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>育児休業給付と雇用継続給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>子どもの出生後、会社員が育児休業を取る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>育児休業給付と雇用継続給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>子どもの出生後、会社員が育児休業を取る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>育児休業給付と雇用継続給付</strong>を一言で説明してください。<details><summary>答え</summary>雇用保険には、育児休業中の所得を支える給付や、働き続けることを支える給付があります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>育児で仕事を休むと賃金が減るため、雇用関係を切らずに休業・復帰できるよう所得を補います。雇用継続系の給付も『働き続ける』ことを支える考え方です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>育児休業給付と雇用継続給付</dd><dt>② 一番重要なのは？</dt><dd>雇用保険には、育児休業中の所得を支える給付や、働き続けることを支える給付があります。</dd>\n<dt>③ なぜ？</dt><dd>育児で仕事を休むと賃金が減るため、雇用関係を切らずに休業・復帰できるよう所得を補います。雇用継続系の給付も『働き続ける』ことを支える考え方です。</dd><dt>④ イメージ</dt><dd>子どもの出生後、会社員が育児休業を取る場面。</dd>\n<dt>⑤ 具体例</dt><dd>休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。</dd><dt>⑥ 注意</dt><dd>給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>育児休業給付と雇用継続給付＝雇用保険には、育児休業中の所得を支える給付や、働き続けることを支える給付があります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>高年齢雇用継続給付と介護休業給付</strong>です。」</p>\n<p>「一言でいうと――<strong>前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。</p>\n<p>「先輩、ここで一回止めます。<strong>高年齢雇用継続給付と介護休業給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>高年齢雇用継続給付と介護休業給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>60歳以降も勤務する人／親の介護で休業する人。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>高年齢雇用継続給付と介護休業給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>60歳以降も勤務する人／親の介護で休業する人。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">問題文の原因語を拾う。『60歳以降の賃金低下』と『介護休業』を同じ計算にしない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>高年齢雇用継続給付と介護休業給付</strong>を一言で説明してください。<details><summary>答え</summary>前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。</details></li>\n<li>何と区別しますか？<details>
