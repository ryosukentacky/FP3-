<script>const chapterData={ch1:[{"title": "FPが守るべき3つのこと", "content": {"A": "\n<p>「先輩、<strong>FPが守るべき3つのこと</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は FPが守るべき3つのこと です。</p>\n<p>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>FPが守るべき3つのことは、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → FPが守るべき3つのこと → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 その情報を並べると、 FPが守るべき3つのこと が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。FPが守るべき3つのことは、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>FPが守るべき3つのことという語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 その情報を並べると、 FPが守るべき3つのこと が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでFPが守るべき3つのことの条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだFPが守るべき3つのことの効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>FPが守るべき3つのこと＝「今日は FPが守るべき3つのこと です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</p>\n<p>このケースでは、まず目的と対象者がFPが守るべき3つのことの条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じFPが守るべき3つのことの枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、FPが守るべき3つのことに関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、FPが守るべき3つのことに当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>FPが守るべき3つのこととは何か。<div class=\"answer\"><b>答え：</b>今日は FPが守るべき3つのこと です。<br>FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 その情報を並べると、 FPが守るべき3つのこと が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→FPが守るべき3つのことの適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをFPが守るべき3つのことの要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は FPが守るべき3つのこと です。 さらに、だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：FPが守るべき3つのこと　②核心：今日は FPが守るべき3つのこと です。　③仕組み：FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。　⑤比較：だからこそ、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 次に、その事実を FPが守るべき3つのこと 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>FPが守るべき3つのこと：</strong>今日は FPが守るべき3つのこと です。</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "\n<p>「先輩、<strong>キャッシュフロー表</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</p>\n<p>進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>キャッシュフロー表は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → キャッシュフロー表 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。 その情報を並べると、 キャッシュフロー表 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。キャッシュフロー表は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>キャッシュフロー表という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。 その情報を並べると、 キャッシュフロー表 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでキャッシュフロー表の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだキャッシュフロー表の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>キャッシュフロー表＝「一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</p>\n<p>このケースでは、まず目的と対象者がキャッシュフロー表の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じキャッシュフロー表の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、キャッシュフロー表に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、キャッシュフロー表に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>キャッシュフロー表とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。<br>進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。 その情報を並べると、 キャッシュフロー表 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→キャッシュフロー表の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをキャッシュフロー表の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。 さらに、だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：キャッシュフロー表　②核心：一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。　③仕組み：進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。　⑤比較：だからこそ、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 次に、その事実を キャッシュフロー表 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>キャッシュフロー表：</strong>一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</p>"}}, {"title": "終価係数", "content": {"A": "\n<p>「先輩、<strong>終価係数</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</p>\n<p>元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？</p>\n<h3>何のための知識か</h3>\n<p>終価係数は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 終価係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>今100万円を持っていて、5年後の金額を知りたい場面。 その情報を並べると、 終価係数 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。終価係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>終価係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>今100万円を持っていて、5年後の金額を知りたい場面。 その情報を並べると、 終価係数 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで終価係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ終価係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>終価係数＝「一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％で5年なら 100万円×1.03^5≒115.9万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が終価係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ終価係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、終価係数に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、終価係数に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>終価係数とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。<br>元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>今100万円を持っていて、5年後の金額を知りたい場面。 その情報を並べると、 終価係数 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→終価係数の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを終価係数の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。 さらに、現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</div></li>\n</ol>", "R": "<p>①テーマ：終価係数　②核心：一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。　③仕組み：元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？　④具体例：年3％で5年なら 100万円×1.03^5≒115.9万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：現実の問題 → 終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 年金終価係数は毎年積立。 もう一つ具体例 100万円・年3%なら1年後103万円、2年後106.09万円、3年後109.27万円…と前年の利息込み残高に3%が付きます。</p>", "M": "<p><strong>終価係数：</strong>一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</p>"}}, {"title": "現価係数", "content": {"A": "\n<p>「先輩、<strong>現価係数</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</p>\n<p>現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<h3>何のための知識か</h3>\n<p>現価係数は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 現価係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 現価係数 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 現価係数 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。現価係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>現価係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 現価係数 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 現価係数 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで現価係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ現価係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>現価係数＝「一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>このケースでは、まず目的と対象者が現価係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ現価係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、現価係数に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、現価係数に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>現価係数とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。<br>現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 現価係数 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 現価係数 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→現価係数の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを現価係数の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。 さらに、次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：現価係数　②核心：一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。　③仕組み：現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。　④具体例：年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。　⑤比較：次に、その事実を 現価係数 固有の条件と照らします。 この用語だけの深掘り 現価係数は1/(1+r)^n。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>現価係数：</strong>一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</p>"}}, {"title": "年金終価係数", "content": {"A": "\n<p>「先輩、<strong>年金終価係数</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</p>\n<p>1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？</p>\n<h3>何のための知識か</h3>\n<p>年金終価係数は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 年金終価係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 その情報を並べると、 年金終価係数 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。年金終価係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>年金終価係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 その情報を並べると、 年金終価係数 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで年金終価係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ年金終価係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>年金終価係数＝「一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 減債基金係数は目標将来額から毎年の積立額を逆算します。</p>\n<p>このケースでは、まず目的と対象者が年金終価係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ年金終価係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、年金終価係数に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、年金終価係数に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>年金終価係数とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。<br>1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 その情報を並べると、 年金終価係数 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→年金終価係数の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを年金終価係数の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 さらに、現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：年金終価係数　②核心：一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。　③仕組み：1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？　④具体例：年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 減債基金係数は目標将来額から毎年の積立額を逆算します。　⑤比較：現実の問題 → 年金終価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 減債基金係数は目標将来額から毎年の積立額を逆算します。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>年金終価係数：</strong>一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</p>"}}, {"title": "減債基金係数", "content": {"A": "\n<p>「先輩、<strong>減債基金係数</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</p>\n<p>積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>減債基金係数は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで減債基金係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 減債基金係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>10年後に300万円作るため、毎年いくら積み立てるか決める場面。 その情報を並べると、 減債基金係数 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。減債基金係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>減債基金係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>10年後に300万円作るため、毎年いくら積み立てるか決める場面。 その情報を並べると、 減債基金係数 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで減債基金係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ減債基金係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>減債基金係数＝「一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 年金終価係数の逆方向です。</p>\n<p>このケースでは、まず目的と対象者が減債基金係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ減債基金係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、減債基金係数に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、減債基金係数に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>減債基金係数とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。<br>積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>10年後に300万円作るため、毎年いくら積み立てるか決める場面。 その情報を並べると、 減債基金係数 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→減債基金係数の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを減債基金係数の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。 さらに、だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</div></li>\n</ol>", "R": "<p>①テーマ：減債基金係数　②核心：一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。　③仕組み：積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：年3％・10年で年金終価係数が約11.464なら、300万円÷11.464≒26.2万円/年。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 年金終価係数の逆方向です。　⑤比較：だからこそ、 年金終価係数の逆方向です。 『毎年額→将来額』ではなく『将来額→毎年額』。 『毎年額→将来額』ではなく『将来額→毎年額』。</p>", "M": "<p><strong>減債基金係数：</strong>一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</p>"}}, {"title": "資本回収係数", "content": {"A": "\n<p>「先輩、<strong>資本回収係数</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。</p>\n<p>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>資本回収係数は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 年金現価係数の逆方向。 次に、その事実を 資本回収係数 固有の条件と照らします。 資本回収係数を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 資本回収係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>退職時の1,000万円を10年間で均等に取り崩す場面。 その情報を並べると、 資本回収係数 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。資本回収係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 年金現価係数の逆方向。 次に、その事実を 資本回収係数 固有の条件と照らします。 資本回収係数を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>資本回収係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>退職時の1,000万円を10年間で均等に取り崩す場面。 その情報を並べると、 資本回収係数 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで資本回収係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ資本回収係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 年金現価係数の逆方向。 次に、その事実を 資本回収係数 固有の条件と照らします。 資本回収係数を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>資本回収係数＝「一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が資本回収係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ資本回収係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 年金現価係数の逆方向。 次に、その事実を 資本回収係数 固有の条件と照らします。 資本回収係数を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、資本回収係数に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、資本回収係数に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>資本回収係数とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。<br>元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>退職時の1,000万円を10年間で均等に取り崩す場面。 その情報を並べると、 資本回収係数 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→資本回収係数の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 年金現価係数の逆方向。 次に、その事実を 資本回収係数 固有の条件と照らします。 資本回収係数を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answ め、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 年金現価係数 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>今から10年間、毎年100万円を受け取りたい場面。 その情報を並べると、 年金現価係数 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。年金現価係数は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 資本回収係数は現在元本から毎年額。 年金現価係数は毎年額から現在元本です。 年金現価係数は毎年額から現在元本です。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>年金現価係数という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>今から10年間、毎年100万円を受け取りたい場面。 その情報を並べると、 年金現価係数 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで年金現価係数の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ年金現価係数の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 資本回収係数は現在元本から毎年額。 年金現価係数は毎年額から現在元本です。 年金現価係数は毎年額から現在元本です。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>年金現価係数＝「一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 資本回収係数は現在元本から毎年額。</p>\n<p>このケースでは、まず目的と対象者が年金現価係数の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ年金現価係数の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保
