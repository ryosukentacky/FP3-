<script>const chapterData={ch1:[{"title": "FPが守るべき3つのこと", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>FPが守るべき3つのこと</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 今日は FPが守るべき3つのこと です。 仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。FPが守るべき3つのことは単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 今日は FPが守るべき3つのこと です。 仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → FPが守るべき3つのことの条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとFPが守るべき3つのことがバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。」</p>\n<p>「最初の時点では、まだFPが守るべき3つのことの結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をFPが守るべき3つのことのルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にFPが守るべき3つのことのルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にFPが守るべき3つのことの条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>FPが守るべき3つのことは、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 今日は FPが守るべき3つのこと です。 仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にFPが守るべき3つのことと関係する言葉が出ていれば、他の条件を見ずにFPが守るべき3つのことを選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → FPが守るべき3つのことの適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>FPが守るべき3つのこと＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>キャッシュフロー表</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。 仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。キャッシュフロー表は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。 仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → キャッシュフロー表の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとキャッシュフロー表がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。」</p>\n<p>「最初の時点では、まだキャッシュフロー表の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をキャッシュフロー表のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にキャッシュフロー表のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にキャッシュフロー表の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 子どもの大学進学と住宅購入が重なる年に、貯蓄が足りるか確認する場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>キャッシュフロー表は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。 仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にキャッシュフロー表と関係する言葉が出ていれば、他の条件を見ずにキャッシュフロー表を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → キャッシュフロー表の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>キャッシュフロー表＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "終価係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>終価係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。 仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。終価係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。 仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 終価係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると終価係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「最初の時点では、まだ終価係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を終価係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に終価係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に終価係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 今100万円を持っていて、5年後の金額を知りたい場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>終価係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。 仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に終価係数と関係する言葉が出ていれば、他の条件を見ずに終価係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 終価係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>終価係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "現価係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>現価係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。 仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。現価係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。 仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 現価係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると現価係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。」</p>\n<p>「最初の時点では、まだ現価係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を現価係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に現価係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に現価係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 その情報を並べると、 現価係数 が候補に上がってくる。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>現価係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。 仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に現価係数と関係する言葉が出ていれば、他の条件を見ずに現価係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 現価係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>現価係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "年金終価係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>年金終価係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。年金終価係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 年金終価係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると年金終価係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。」</p>\n<p>「最初の時点では、まだ年金終価係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を年金終価係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に年金終価係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に年金終価係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>年金終価係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に年金終価係数と関係する言葉が出ていれば、他の条件を見ずに年金終価係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 年金終価係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>年金終価係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "減債基金係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>減債基金係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。 仕組みを最初から説明 積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。減債基金係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。 仕組みを最初から説明 積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで減債基金係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年金終価係数の逆方向です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 減債基金係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると減債基金係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで減債基金係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年金終価係数の逆方向です。」</p>\n<p>「最初の時点では、まだ減債基金係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を減債基金係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで減債基金係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年金終価係数の逆方向です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に減債基金係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に減債基金係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 10年後に300万円作るため、毎年いくら積み立てるか決める場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>減債基金係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。 仕組みを最初から説明 積立金も運用益を生むので、目標額を年数で単純に割るのではなく、運用を考慮して毎年額を逆算します。 減債基金係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 減債基金係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に減債基金係数と関係する言葉が出ていれば、他の条件を見ずに減債基金係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 減債基金係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで減債基金係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年金終価係数の逆方向です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>減債基金係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "資本回収係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>資本回収係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。 仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。資本回収係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。 仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 資本回収係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると資本回収係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「最初の時点では、まだ資本回収係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を資本回収係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に資本回収係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に資本回収係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 退職時の1,000万円を10年間で均等に取り崩す場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>資本回収係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。 仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に資本回収係数と関係する言葉が出ていれば、他の条件を見ずに資本回収係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 資本回収係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>資本回収係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "年金現価係数", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>年金現価係数</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。 仕組みを最初から説明 将来の年金の『今の値段』を求める感覚です。 年金現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 年金現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。年金現価係数は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。 仕組みを最初から説明 将来の年金の『今の値段』を求める感覚です。 年金現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 年金現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 資本回収係数は現在元本から毎年額。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 年金現価係数の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると年金現価係数がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 資本回収係数は現在元本から毎年額。」</p>\n<p>「最初の時点では、まだ年金現価係数の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を年金現価係数のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 資本回収係数は現在元本から毎年額。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に年金現価係数のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に年金現価係数の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 将来の年金の『今の値段』を求める感覚です。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 今から10年間、毎年100万円を受け取りたい場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>年金現価係数は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。 仕組みを最初から説明 将来の年金の『今の値段』を求める感覚です。 年金現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 年金現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に年金現価係数と関係する言葉が出ていれば、他の条件を見ずに年金現価係数を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 年金現価係数の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 資本回収係数は現在元本から毎年額。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>年金現価係数＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>こども保険（学資保険）</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 今日は こども保険（学資保険） です。 仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。こども保険（学資保険）は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 今日は こども保険（学資保険） です。 仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → こども保険（学資保険）の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとこども保険（学資保険）がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。」</p>\n<p>「最初の時点では、まだこども保険（学資保険）の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をこども保険（学資保険）のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にこども保険（学資保険）のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にこども保険（学資保険）の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>こども保険（学資保険）は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 今日は こども保険（学資保険） です。 仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にこども保険（学資保険）と関係する言葉が出ていれば、他の条件を見ずにこども保険（学資保険）を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → こども保険（学資保険）の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>こども保険（学資保険）＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>教育一般貸付（国の教育ローン）</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 今日は 教育一般貸付（国の教育ローン） です。 仕組みを最初から説明 教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。教育一般貸付（国の教育ローン）は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 今日は 教育一般貸付（国の教育ローン） です。 仕組みを最初から説明 教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 教育一般貸付（国の教育ローン）の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると教育一般貸付（国の教育ローン）がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「最初の時点では、まだ教育一般貸付（国の教育ローン）の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を教育一般貸付（国の教育ローン）のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に教育一般貸付（国の教育ローン）のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に教育一般貸付（国の教育ローン）の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 その情報を並べると、 教育一般貸付（国の教育ローン） が候補に上がってくる。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>教育一般貸付（国の教育ローン）は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 今日は 教育一般貸付（国の教育ローン） です。 仕組みを最初から説明 教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に教育一般貸付（国の教育ローン）と関係する言葉が出ていれば、他の条件を見ずに教育一般貸付（国の教育ローン）を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 教育一般貸付（国の教育ローン）の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>教育一般貸付（国の教育ローン）＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "奨学金制度", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>奨学金制度</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。 仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。奨学金制度は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。 仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 奨学金制度の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると奨学金制度がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「最初の時点では、まだ奨学金制度の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を奨学金制度のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に奨学金制度のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に奨学金制度の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 その情報を並べると、 奨学金制度 が候補に上がってくる。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>奨学金制度は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。 仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に奨学金制度と関係する言葉が出ていれば、他の条件を見ずに奨学金制度を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 奨学金制度の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>奨学金制度＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>固定金利期間選択型</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。 仕組みを最初から説明 最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。固定金利期間選択型は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。 仕組みを最初から説明 最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで固定金利期間選択型の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 固定金利期間選択型の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると固定金利期間選択型がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで固定金利期間選択型の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「最初の時点では、まだ固定金利期間選択型の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を固定金利期間選択型のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで固定金利期間選択型の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に固定金利期間選択型のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に固定金利期間選択型の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 当初10年間だけ返済額を確定させたい場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>固定金利期間選択型は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 一言でいうと―― 住宅ローンの金利を当初の一定期間だけ固定し、期間終了後にその時点の条件で金利タイプを選び直す方式です。 仕組みを最初から説明 最初の数年間は返済額を安定させつつ、固定期間終了後は市場金利に応じた条件へ移ります。 固定金利期間選択型 が必要になる前に、何が起きているか分かります？ 現実の問題 → 固定金利期間選択型 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に固定金利期間選択型と関係する言葉が出ていれば、他の条件を見ずに固定金利期間選択型を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 固定金利期間選択型の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで固定金利期間選択型の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>固定金利期間選択型＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>元利均等返済と元金均等返済</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 今日は 元利均等返済と元金均等返済 です。 仕組みを最初から説明 元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。元利均等返済と元金均等返済は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 今日は 元利均等返済と元金均等返済 です。 仕組みを最初から説明 元金均等は序盤から元金が速く減るため、同条件なら総利息が少なくなりやすい一方、当初返済額が大きくなります。 元利均等返済と元金均等返済 が必要になる前に、何が起きているか分かります？ 現実の問題 → 元利均等返済と元金均等返済 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 元利均等返済と元金均等返済の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると元利均等返済と元金均等返済がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「最初の時点では、まだ元利均等返済と元金均等返済の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を元利均等返済と元金均等返済のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に元利均等返済と元金均等返済のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に元利均等返済と元金均等返済の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明
