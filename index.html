いう時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → かんぽ保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとかんぽ保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「最初の時点では、まだかんぽ保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をかんぽ保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にかんぽ保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にかんぽ保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → かんぽ保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>かんぽ保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にかんぽ保険と関係する言葉が出ていれば、他の条件を見ずにかんぽ保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → かんぽ保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>かんぽ保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "共済", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>共済</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。共済は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 共済の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると共済がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「最初の時点では、まだ共済の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を共済のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に共済のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に共済の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>共済は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に共済と関係する言葉が出ていれば、他の条件を見ずに共済を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 共済の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>共済＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "災害割増特約と傷害特約", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>災害割増特約と傷害特約</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。災害割増特約と傷害特約は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害割増特約と傷害特約の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると災害割増特約と傷害特約がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ災害割増特約と傷害特約の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を災害割増特約と傷害特約のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に災害割増特約と傷害特約のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に災害割増特約と傷害特約の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>災害割増特約と傷害特約は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に災害割増特約と傷害特約と関係する言葉が出ていれば、他の条件を見ずに災害割増特約と傷害特約を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 災害割増特約と傷害特約の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>災害割増特約と傷害特約＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "災害入院特約・疾病入院特約・生活習慣病入院特約", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>災害入院特約・疾病入院特約・生活習慣病入院特約</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると災害入院特約・疾病入院特約・生活習慣病入院特約がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ災害入院特約・疾病入院特約・生活習慣病入院特約の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を災害入院特約・疾病入院特約・生活習慣病入院特約のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に災害入院特約・疾病入院特約・生活習慣病入院特約のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に災害入院特約・疾病入院特約・生活習慣病入院特約の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>災害入院特約・疾病入院特約・生活習慣病入院特約は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に災害入院特約・疾病入院特約・生活習慣病入院特約と関係する言葉が出ていれば、他の条件を見ずに災害入院特約・疾病入院特約・生活習慣病入院特約を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 災害入院特約・疾病入院特約・生活習慣病入院特約の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>災害入院特約・疾病入院特約・生活習慣病入院特約＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "退院特約", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>退院特約</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。退院特約は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 退院特約の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると退院特約がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。」</p>\n<p>「最初の時点では、まだ退院特約の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を退院特約のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に退院特約のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に退院特約の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>退院特約は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に退院特約と関係する言葉が出ていれば、他の条件を見ずに退院特約を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 退院特約の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>退院特約＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険と関係する言葉が出ていれば、他の条件を見ずに特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "払済保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>払済保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。 仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。払済保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。 仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 払済保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると払済保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。」</p>\n<p>「最初の時点では、まだ払済保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を払済保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に払済保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に払済保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>払済保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。 仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に払済保険と関係する言葉が出ていれば、他の条件を見ずに払済保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 払済保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>払済保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "延長保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>延長保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。 仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。延長保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。 仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 延長保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると延長保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。」</p>\n<p>「最初の時点では、まだ延長保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を延長保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に延長保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に延長保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>延長保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。 仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に延長保険と関係する言葉が出ていれば、他の条件を見ずに延長保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 延長保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>延長保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "契約転換制度", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>契約転換制度</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。契約転換制度は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 契約転換制度の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると契約転換制度がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「最初の時点では、まだ契約転換制度の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を契約転換制度のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に契約転換制度のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に契約転換制度の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>契約転換制度は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に契約転換制度と関係する言葉が出ていれば、他の条件を見ずに契約転換制度を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 契約転換制度の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>契約転換制度＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "付加・追加・減額", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>付加・追加・減額</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。付加・追加・減額は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 付加・追加・減額の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると付加・追加・減額がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「最初の時点では、まだ付加・追加・減額の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を付加・追加・減額のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に付加・追加・減額のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に付加・追加・減額の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>付加・追加・減額は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に付加・追加・減額と関係する言葉が出ていれば、他の条件を見ずに付加・追加・減額を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 付加・追加・減額の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>付加・追加・減額＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "生命保険料控除", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>生命保険料控除</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。生命保険料控除は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 生命保険料控除の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると生命保険料控除がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「最初の時点では、まだ生命保険料控除の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を生命保険料控除のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に生命保険料控除のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に生命保険料控除の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>生命保険料控除は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に生命保険料控除と関係する言葉が出ていれば、他の条件を見ずに生命保険料控除を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 生命保険料控除の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>生命保険料控除＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "個人年金保険料控除", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>個人年金保険料控除</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。個人年金保険料控除は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 個人年金保険料控除の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると個人年金保険料控除がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「最初の時点では、まだ個人年金保険料控除の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を個人年金保険料控除のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に個人年金保険料控除のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に個人年金保険料控除の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>個人年金保険料控除は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に個人年金保険料控除と関係する言葉が出ていれば、他の条件を見ずに個人年金保険料控除を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 個人年金保険料控除の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>個人年金保険料控除＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "死亡保険金・満期保険金の税金", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>死亡保険金・満期保険金の税金</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。 仕組みを最初から説明 条件確認 → 死亡保険金・満期保険金の税金 → お金・保障の変化 保険料負担者・被保険者・受取人の組合せから税目を判定する。 なぜ別制度ではないのかは、 満期保険金でも保険料負担者と受取人の一致・不一致を見る で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。死亡保険金・満期保険金の税金は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える
