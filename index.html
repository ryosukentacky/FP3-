するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>給付・反対給付均等の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>給付・反対給付均等の原則</dd><dt>芯</dt><dd>給付・反対給付均等の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、給付・反対給付均等の原則が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、給付・反対給付均等の原則では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>給付・反対給付均等の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>給付・反対給付均等の原則：給付・反対給付均等の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "利得禁止の原則", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>利得禁止の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、利得禁止の原則が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>利得禁止の原則が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、利得禁止の原則では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>利得禁止の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。利得禁止の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、利得禁止の原則が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、利得禁止の原則では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>利得禁止の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>利得禁止の原則</dd><dt>芯</dt><dd>利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、利得禁止の原則が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、利得禁止の原則では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>利得禁止の原則は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>利得禁止の原則：利得禁止の原則について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "損害保険料の構成", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>損害保険料の構成について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「 mmary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、火災保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、火災保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>火災保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>火災保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>火災保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>火災保険</dd><dt>芯</dt><dd>火災保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、火災保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、火災保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>火災保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>火災保険：火災保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "失火責任法", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>失火責任法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、失火責任法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>失火責任法が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、失火責任法では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>失火責任法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。失火責任法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、失火責任法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、失火責任法では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>失火責任法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>失火責任法</dd><dt>芯</dt><dd>失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、失火責任法が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、失火責任法では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>失火責任法は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>失火責任法：失火責任法について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "地震保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</p><p>「注意は<strong>地震による火災を通常の火災保険だけで補償すると考えない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>地震で家が燃えた場面を想像します。原因が通常火災ではなく地震なら、火災保険だけでは原則カバーできないため地震保険の札が必要です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>地震保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">火災保険金額2,000万円でも地震保険はその一定割合の範囲で設定し、上限もあります。具体割合・上限は受験年度基準で確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>地震による火災を通常の火災保険だけで補償すると考えない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。地震による火災を通常の火災保険だけで補償すると考えない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>地震で家が燃えた場面を想像します。原因が通常火災ではなく地震なら、火災保険だけでは原則カバーできないため地震保険の札が必要です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>火災保険金額2,000万円でも地震保険はその一定割合の範囲で設定し、上限もあります。具体割合・上限は受験年度基準で確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>地震による火災を通常の火災保険だけで補償すると考えない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>地震保険</dd><dt>芯</dt><dd>地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</dd><dt>映像</dt><dd>地震で家が燃えた場面を想像します。原因が通常火災ではなく地震なら、火災保険だけでは原則カバーできないため地震保険の札が必要です。</dd><dt>具体例</dt><dd>火災保険金額2,000万円でも地震保険はその一定割合の範囲で設定し、上限もあります。具体割合・上限は受験年度基準で確認します。</dd><dt>注意</dt><dd>地震による火災を通常の火災保険だけで補償すると考えない。</dd></dl>", "M": "<div class=\"memory\"><strong>地震保険：地震・噴火・津波による住宅・家財の損害を補償し、火災保険に付帯して契約する保険です。</strong></div>"}}, {"title": "自動車保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>自動車保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>自動車保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>自動車保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、自動車保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起 ></ol>", "R": "<dl><dt>何の話？</dt><dd>自動車保険</dd><dt>芯</dt><dd>自動車保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、自動車保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、自動車保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>自動車保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>自動車保険：自動車保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "自賠責保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</p><p>「注意は<strong>自分の車の修理や相手の物損を補償する保険ではない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>車を所有・運行する最低限の『人への補償の土台』として自賠責、その上に任意の対人・対物等を積む映像です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>自賠責保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">死亡・後遺障害・傷害にはそれぞれ支払限度額があります。具体額は受験年度基準で確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>自分の車の修理や相手の物損を補償する保険ではない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。自分の車の修理や相手の物損を補償する保険ではない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>車を所有・運行する最低限の『人への補償の土台』として自賠責、その上に任意の対人・対物等を積む映像です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>死亡・後遺障害・傷害にはそれぞれ支払限度額があります。具体額は受験年度基準で確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>自分の車の修理や相手の物損を補償する保険ではない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>自賠責保険</dd><dt>芯</dt><dd>自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</dd><dt>映像</dt><dd>車を所有・運行する最低限の『人への補償の土台』として自賠責、その上に任意の対人・対物等を積む映像です。</dd><dt>具体例</dt><dd>死亡・後遺障害・傷害にはそれぞれ支払限度額があります。具体額は受験年度基準で確認します。</dd><dt>注意</dt><dd>自分の車の修理や相手の物損を補償する保険ではない。</dd></dl>", "M": "<div class=\"memory\"><strong>自賠責保険：自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償します。</strong></div>"}}, {"title": "対人賠償保険と対物賠償保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>対人賠償保険と対物賠償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、対人賠償保険と対物賠償保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>対人賠償保険と対物賠償保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、対人賠償保険と対物賠償保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>対人賠償保険と対物賠償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。対人賠償保険と対物賠償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、対人賠償保険と対物賠償保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、対人賠償保険と対物賠償保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>対人賠償保険と対物賠償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>対人賠償保険と対物賠償保険</dd><dt>芯</dt><dd>対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、対人賠償保険と対物賠償保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、対人賠償保険と対物賠償保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>対人賠償保険と対物賠償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>対人賠償保険と対物賠償保険：対人賠償保険と対物賠償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "搭乗者傷害保険と人身傷害補償保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>搭乗者傷害保険と人身傷害補償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>搭乗者傷害保険と人身傷害補償保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>搭乗者傷害保険と人身傷害補償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、搭乗者傷害保険と人身傷害補償保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>搭乗者傷害保険と人身傷害補償保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、搭乗者傷害保険と人身傷害補償保険では人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>搭乗者傷害保険と人身傷害補償保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試 function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
