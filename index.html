で分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>自賠責保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 自賠責保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ自賠責保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして自賠責保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで自賠責保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 具体例を最初から最後まで解説 「では 自賠責保険 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が自賠責保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する 「比較軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで自賠責保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 具体例を最初から最後まで解説 「では 自賠責保険 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を自賠責保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで自賠責保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 具体例を最初から最後まで解説 「では 自賠責保険 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「自賠責保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>自賠責保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する 「比較軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 。<br><br><b>解説：</b>仕組みを最初から説明 車に最低限装着する『対人の土台』が自賠責、その上へ任意保険を積む。 条件確認 → 自賠責保険 → お金・保障の変化 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する。 なぜ別制度ではないのかは、 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 自賠責保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで自賠責保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 具体例を最初から最後まで解説 「では 自賠責保険 を具体例に落とします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に自賠責保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、自賠責保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>自賠責保険は「」 結論 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する 「比較軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 。」。仕組みは「仕組みを最初から説明 車に最低限装着する『対人の土台』が自賠責、その上へ任意保険を積む。 条件確認 → 自賠責保険 → お金・保障の変化 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する。 なぜ別制度ではないのかは、 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで自賠責保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 具体例を最初から最後まで解説 「では 自賠責保険 を具体例に落とします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 です。」を思い出します。</p>", "M": "<p><strong>自賠責保険＝」 結論 自動車事故の被害者救済を目的とする強制保険で、人身損害を一定限度まで補償する 「比較軸は 自賠責=対人の強制保険／任意保険=不足分や対物・車両等を補完 。</strong></p>"}}, {"title": "対人賠償保険と対物賠償保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>対人賠償保険と対物賠償保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p><p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 対人賠償保険と対物賠償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 対人賠償保険と対物賠償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 対人賠償保険と対物賠償保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。対人賠償保険と対物賠償保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④対人賠償保険と対物賠償保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>対人賠償保険と対物賠償保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 対人賠償保険と対物賠償保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ対人賠償保険と対物賠償保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして対人賠償保険と対物賠償保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 対人賠償保険と対物賠償保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が対人賠償保険と対物賠償保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 という核心と、そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を対人賠償保険と対物賠償保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「対人賠償保険と対物賠償保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>対人賠償保険と対物賠償保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 対人賠償保険と対物賠償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 対人賠償保険と対物賠償保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 対人賠償保険と対物賠償保険が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に対人賠償保険と対物賠償保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、対人賠償保険と対物賠償保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>対人賠償保険と対物賠償保険は「」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。」。仕組みは「仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 対人賠償保険と対物賠償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで対人賠償保険と対物賠償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 対人賠償保険と対物賠償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 対人賠償保険と対物賠償保険が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>対人賠償保険と対物賠償保険＝」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</strong></p>"}}, {"title": "搭乗者傷害保険と人身傷害補償保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>搭乗者傷害保険と人身傷害補償保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p><p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 搭乗者傷害保険と人身傷害補償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 搭乗者傷害保険と人身傷害補償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 搭乗者傷害保険と人身傷害補償保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。搭乗者傷害保険と人身傷害補償保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④搭乗者傷害保険と人身傷害補償保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>搭乗者傷害保険と人身傷害補償保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 搭乗者傷害保険と人身傷害補償保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ搭乗者傷害保険と人身傷害補償保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして搭乗者傷害保険と人身傷害補償保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 搭乗者傷害保険と人身傷害補償保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が搭乗者傷害保険と人身傷害補償保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 という核心と、そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を搭乗者傷害保険と人身傷害補償保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「搭乗者傷害保険と人身傷害補償保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>搭乗者傷害保険と人身傷害補償保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 搭乗者傷害保険と人身傷害補償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 搭乗者傷害保険と人身傷害補償保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 搭乗者傷害保険と人身傷害補償保険が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に搭乗者傷害保険と人身傷害補償保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、搭乗者傷害保険と人身傷害補償保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>搭乗者傷害保険と人身傷害補償保険は「」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。」。仕組みは「仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 搭乗者傷害保険と人身傷害補償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで搭乗者傷害保険と人身傷害補償保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 搭乗者傷害保険と人身傷害補償保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 搭乗者傷害保険と人身傷害補償保険が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>搭乗者傷害保険と人身傷害補償保険＝」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</strong></p>"}}, {"title": "無保険車傷害保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>無保険車傷害保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p><p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 無保険車傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。無保険車傷害保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④無保険車傷害保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>無保険車傷害保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 無保険車傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ無保険車傷害保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして無保険車傷害保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 無保険車傷害保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が無保険車傷害保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 という核心と、そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を無保険車傷害保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「無保険車傷害保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>無保険車傷害保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 無保険車傷害保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 無保険車傷害保険が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に無保険車傷害保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、無保険車傷害保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>無保険車傷害保険は「」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。」。仕組みは「仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 無保険車傷害保険が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>無保険車傷害保険＝」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</strong></p>"}}, {"title": "車両保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>車両保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。</p><p>仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 ② 3コマで動かす 出来事の前 → 車両保険が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。車両保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④車両保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>車両保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 ② 3コマで動かす 出来事の前 → 車両保険が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ車両保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして車両保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 対物賠償=相手の物／車両保険=自分の車 です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が車両保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を車両保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「車両保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>車両保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 車両保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 対物賠償=相手の物／車両保険=自分の車 です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に車両保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、車両保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>車両保険は「」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。」。仕組みは「仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 対物賠償=相手の物／車両保険=自分の車 です。」を思い出します。</p>", "M": "<p><strong>車両保険＝」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。</strong></p>"}}, {"title": "傷害保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>傷害保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 傷害保険はFP試験で押さえるべき重要テーマです。</p><p>仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。傷害保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④傷害保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>傷害保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ傷害保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして傷害保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が傷害保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 傷害保険はFP試験で押さえるべき重要テーマです。 という核心と、つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を傷害保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「傷害保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>傷害保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 傷害保険はFP試験で押さえるべき重要テーマです。<br><br><b>解説：</b>仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 傷害保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に傷害保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、傷害保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>傷害保険は「」 結論 傷害保険はFP試験で押さえるべき重要テーマです。」。仕組みは「仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。」。比較では「つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 です。」を思い出します。</p>", "M": "<p><strong>傷害保険＝」 結論 傷害保険はFP試験で押さえるべき重要テーマです。</strong></p>"}}]};let cards=chapterData.ch1,ti=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];let cur=0,tab="A";const $=x=>document.getElementById(x),sel=$("sel"),q=$("quick"),search=$("search"),tabs=$("tabs");
function fill(){sel.innerHTML="";cards.forEach((c,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;sel.appendChild(o)})}fill();ti.forEach(([k,l])=>{let b=document.createElement("button");b.className="tab";b.textContent=l;b.onclick=()=>{tab=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
