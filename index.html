<script>
const cards = [{"title": "FPが守るべき3つのこと", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>FPが顧客相談で守る基本姿勢を押さえるテーマ。顧客利益を優先し、守秘義務を守り、専門外は適切な専門家につなぐ意識が重要です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>FPが顧客相談で守る基本姿勢を押さえるテーマ。顧客利益を優先し、守秘義務を守り、専門外は適切な専門家につなぐ意識が重要です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ FPが守るべき3つのことの対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：『知っていること』と『業務として行えること』を混同しない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>相談者から税務・法律まで何でも聞かれた</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>FPが守るべき3つのこと</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：相談者から税務・法律まで何でも聞かれた。</strong></p><p>この場面で「なぜFPが守るべき3つのことが関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. FPが守るべき3つのことは一言でいうと？</strong>\\</p><p>→</p><p>FPが顧客相談で守る基本姿勢を押さえるテーマ。顧客利益を優先し、守秘義務を守り、専門外は適切な専門家につなぐ意識が重要です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 相談者から税務・法律まで何でも聞かれた場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 『知っていること』と『業務として行えること』を混同しない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>FPが守るべき3つのこと</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>FPが顧客相談で守る基本姿勢を押さえるテーマ。顧客利益を優先し、守秘義務を守り、専門外は適切な専門家につなぐ意識が重要です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>相談者から税務・法律まで何でも聞かれた場面。</strong>\\</p><p>⑥ 注意点は？ →</p><p><strong>『知っていること』と『業務として行えること』を混同しない。</strong></p>", "M": "<p><strong>「FPが守るべき3つのこと＝FPが顧客相談で守る基本姿勢を押さえるテーマ。顧客利益を優先し、守秘義務を守り、専門外は適切な専門家につなぐ意識が重要です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>将来の収入・支出・年間収支・貯蓄残高を年ごとに予測し、家計の将来像を見える化する表です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>将来の収入・支出・年間収支・貯蓄残高を年ごとに予測し、家計の将来像を見える化する表です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ キャッシュフロー表の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：年間収支と貯蓄残高を混同しない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>進学や住宅購入を含む将来の家計を考える</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>キャッシュフロー表</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：進学や住宅購入を含む将来の家計を考える。</strong></p><p>この場面で「なぜキャッシュフロー表が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. キャッシュフロー表は一言でいうと？</strong>\\</p><p>→</p><p>将来の収入・支出・年間収支・貯蓄残高を年ごとに予測し、家計の将来像を見える化する表です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 進学や住宅購入を含む将来の家計を考える場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 年間収支と貯蓄残高を混同しない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>キャッシュフロー表</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>将来の収入・支出・年間収支・貯蓄残高を年ごとに予測し、家計の将来像を見える化する表です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>進学や住宅購入を含む将来の家計を考える場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>年間収支と貯蓄残高を混同しない。</strong></p>", "M": "<p><strong>「キャッシュフロー表＝将来の収入・支出・年間収支・貯蓄残高を年ごとに予測し、家計の将来像を見える化する表です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "終価係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>現在の元本を一定利率で複利運用したとき、将来いくらになるかを求める係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>現在の元本を一定利率で複利運用したとき、将来いくらになるかを求める係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：『今→将来』。毎年積立ではない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>100万円を年2％で運用する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>終価係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：100万円を年2％で運用する。</strong></p><p>この場面で「なぜ終価係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 終価係数は一言でいうと？</strong>\\</p><p>→</p><p>現在の元本を一定利率で複利運用したとき、将来いくらになるかを求める係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 100万円を年2％で運用する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 『今→将来』。毎年積立ではない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>終価係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>現在の元本を一定利率で複利運用したとき、将来いくらになるかを求める係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>100万円を年2％で運用する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>『今→将来』。毎年積立ではない。</strong></p>", "M": "<p><strong>「終価係数＝現在の元本を一定利率で複利運用したとき、将来いくらになるかを求める係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "現価係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>将来必要な金額から、現在いくら用意すべきかを逆算する係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>将来必要な金額から、現在いくら用意すべきかを逆算する係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：『将来→今』。終価係数の逆方向</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>5年後の100万円に必要な現在額を求める</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>現価係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：5年後の100万円に必要な現在額を求める。</strong></p><p>この場面で「なぜ現価係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 現価係数は一言でいうと？</strong>\\</p><p>→ 将来必要な金額から、現在いくら用意すべきかを逆算する係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 5年後の100万円に必要な現在額を求める場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 『将来→今』。終価係数の逆方向。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>現価係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>将来必要な金額から、現在いくら用意すべきかを逆算する係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>5年後の100万円に必要な現在額を求める場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>『将来→今』。終価係数の逆方向。</strong></p>", "M": "<p><strong>「現価係数＝将来必要な金額から、現在いくら用意すべきかを逆算する係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "年金終価係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>毎年一定額を積み立てた場合、将来いくら貯まるかを求める係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>毎年一定額を積み立てた場合、将来いくら貯まるかを求める係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：積立額→将来額</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>毎年20万円を積み立てる</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>年金終価係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：毎年20万円を積み立てる。</strong></p><p>この場面で「なぜ年金終価係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 年金終価係数は一言でいうと？</strong>\\</p><p>→ 毎年一定額を積み立てた場合、将来いくら貯まるかを求める係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 毎年20万円を積み立てる場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 積立額→将来額。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>年金終価係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>毎年一定額を積み立てた場合、将来いくら貯まるかを求める係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>毎年20万円を積み立てる場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>積立額→将来額。</strong></p>", "M": "<p><strong>「年金終価係数＝毎年一定額を積み立てた場合、将来いくら貯まるかを求める係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "減債基金係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>将来の目標額を作るため、毎年いくら積み立てればよいかを求める係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>将来の目標額を作るため、毎年いくら積み立てればよいかを求める係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：目標将来額→毎年積立額</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>10年後の300万円を目標に積み立てる</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>減債基金係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：10年後の300万円を目標に積み立てる。</strong></p><p>この場面で「なぜ減債基金係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 減債基金係数は一言でいうと？</strong>\\</p><p>→ 将来の目標額を作るため、毎年いくら積み立てればよいかを求める係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 10年後の300万円を目標に積み立てる場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 目標将来額→毎年積立額。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>減債基金係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>将来の目標額を作るため、毎年いくら積み立てればよいかを求める係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>10年後の300万円を目標に積み立てる場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>目標将来額→毎年積立額。</strong></p>", "M": "<p><strong>「減債基金係数＝将来の目標額を作るため、毎年いくら積み立てればよいかを求める係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "資本回収係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>現在の元本を一定期間で取り崩す場合、毎年いくら受け取れるかを求める係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>現在の元本を一定期間で取り崩す場合、毎年いくら受け取れるかを求める係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：現在額→毎年受取額</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>1,000万円を10年間で取り崩す</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>資本回収係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：1,000万円を10年間で取り崩す。</strong></p><p>この場面で「なぜ資本回収係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 資本回収係数は一言でいうと？</strong>\\</p><p>→</p><p>現在の元本を一定期間で取り崩す場合、毎年いくら受け取れるかを求める係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 1,000万円を10年間で取り崩す場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 現在額→毎年受取額。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>資本回収係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>現在の元本を一定期間で取り崩す場合、毎年いくら受け取れるかを求める係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>1,000万円を10年間で取り崩す場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>現在額→毎年受取額。</strong></p>", "M": "<p><strong>「資本回収係数＝現在の元本を一定期間で取り崩す場合、毎年いくら受け取れるかを求める係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "年金現価係数", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める係数です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める係数です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>何が分かっているか確認 ↓ 「今・将来・毎年」のどれを求めるか確認 ↓</p><p>一括資金か積立・取崩しか確認 ↓ 対応する係数を選んで計算</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：毎年受取額→現在必要額</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>毎年100万円を10年間受け取る</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>年金現価係数</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：毎年100万円を10年間受け取る。</strong></p><p>この場面で「なぜ年金現価係数が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 年金現価係数は一言でいうと？</strong>\\</p><p>→</p><p>将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める係数です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 毎年100万円を10年間受け取る場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 毎年受取額→現在必要額。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>年金現価係数</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める係数です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>毎年100万円を10年間受け取る場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>毎年受取額→現在必要額。</strong></p>", "M": "<p><strong>「年金現価係数＝将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める係数です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>教育資金を計画的に準備する保険で、契約に応じ進学時などに祝金・満期保険金を受け取ります。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>教育資金を計画的に準備する保険で、契約に応じ進学時などに祝金・満期保険金を受け取ります。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ こども保険（学資保険）の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：貯蓄性だけでなく保障・払込免除も見る</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>子どもの大学進学資金を準備する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>こども保険（学資保険）</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：子どもの大学進学資金を準備する。</strong></p><p>この場面で「なぜこども保険（学資保険）が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. こども保険（学資保険）は一言でいうと？</strong>\\</p><p>→</p><p>教育資金を計画的に準備する保険で、契約に応じ進学時などに祝金・満期保険金を受け取ります。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 子どもの大学進学資金を準備する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 貯蓄性だけでなく保障・払込免除も見る。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>こども保険（学資保険）</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>教育資金を計画的に準備する保険で、契約に応じ進学時などに祝金・満期保険金を受け取ります。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>子どもの大学進学資金を準備する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>貯蓄性だけでなく保障・払込免除も見る。</strong></p>", "M": "<p><strong>「こども保険（学資保険）＝教育資金を計画的に準備する保険で、契約に応じ進学時などに祝金・満期保険金を受け取ります。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>日本政策金融公庫が扱う、保護者等が教育費を借りるための公的融資です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>日本政策金融公庫が扱う、保護者等が教育費を借りるための公的融資です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓</p><p>教育一般貸付（国の教育ローン）の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：学生本人が借りる奨学金と区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>保護者が大学入学金を準備する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして</p><p><strong>教育一般貸付（国の教育ローン）</strong> の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：保護者が大学入学金を準備する。</strong></p><p>この場面で「なぜ教育一般貸付（国の教育ローン）が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 教育一般貸付（国の教育ローン）は一言でいうと？</strong>\\</p><p>→ 日本政策金融公庫が扱う、保護者等が教育費を借りるための公的融資です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 保護者が大学入学金を準備する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 学生本人が借りる奨学金と区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>教育一般貸付（国の教育ローン）</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>日本政策金融公庫が扱う、保護者等が教育費を借りるための公的融資です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>保護者が大学入学金を準備する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>学生本人が借りる奨学金と区別。</strong></p>", "M": "<p><strong>「教育一般貸付（国の教育ローン）＝日本政策金融公庫が扱う、保護者等が教育費を借りるための公的融資です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "奨学金制度", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>学生本人の修学を支える給付・貸与制度で、貸与型は原則返還が必要です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>学生本人の修学を支える給付・貸与制度で、貸与型は原則返還が必要です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 奨学金制度の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：給付型・貸与型、無利子・有利子を区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>学生が授業料等の支援を受ける</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>奨学金制度</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：学生が授業料等の支援を受ける。</strong></p><p>この場面で「なぜ奨学金制度が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 奨学金制度は一言でいうと？</strong>\\</p><p>→ 学生本人の修学を支える給付・貸与制度で、貸与型は原則返還が必要です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 学生が授業料等の支援を受ける場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 給付型・貸与型、無利子・有利子を区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>奨学金制度</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>学生本人の修学を支える給付・貸与制度で、貸与型は原則返還が必要です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>学生が授業料等の支援を受ける場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>給付型・貸与型、無利子・有利子を区別。</strong></p>", "M": "<p><strong>「奨学金制度＝学生本人の修学を支える給付・貸与制度で、貸与型は原則返還が必要です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>一定期間だけ住宅ローン金利を固定し、その終了後に金利タイプを選び直す方式です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>一定期間だけ住宅ローン金利を固定し、その終了後に金利タイプを選び直す方式です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 固定金利期間選択型の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：全期間固定金利型と混同しない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>当初10年間の返済額を安定させる</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>固定金利期間選択型</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：当初10年間の返済額を安定させる。</strong></p><p>この場面で「なぜ固定金利期間選択型が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 固定金利期間選択型は一言でいうと？</strong>\\</p><p>→</p><p>一定期間だけ住宅ローン金利を固定し、その終了後に金利タイプを選び直す方式です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 当初10年間の返済額を安定させる場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 全期間固定金利型と混同しない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>固定金利期間選択型</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>一定期間だけ住宅ローン金利を固定し、その終了後に金利タイプを選び直す方式です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>当初10年間の返済額を安定させる場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>全期間固定金利型と混同しない。</strong></p>", "M": "<p><strong>「固定金利期間選択型＝一定期間だけ住宅ローン金利を固定し、その終了後に金利タイプを選び直す方式です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>元利均等は元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>元利均等は元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 元利均等返済と元金均等返済の対象・目的を確認</p><p>↓ 要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：『毎回一定なのは何か』を見る</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>住宅ローンを長期間返済する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>元利均等返済と元金均等返済</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：住宅ローンを長期間返済する。</strong></p><p>この場面で「なぜ元利均等返済と元金均等返済が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 元利均等返済と元金均等返済は一言でいうと？</strong>\\</p><p>→ 元利均等は元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 住宅ローンを長期間返済する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 『毎回一定なのは何か』を見る。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>元利均等返済と元金均等返済</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>元利均等は元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>住宅ローンを長期間返済する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>『毎回一定なのは何か』を見る。</strong></p>", "M": "<p><strong>「元利均等返済と元金均等返済＝元利均等は元金＋利息の返済額が一定、元金均等は毎回返す元金が一定です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>予定より元金を早く返し、期間を縮めるか毎回返済額を軽くする方法です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>予定より元金を早く返し、期間を縮めるか毎回返済額を軽くする方法です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓</p><p>繰上げ返済（期間短縮型・返済額軽減型）の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：同条件なら期間短縮型の利息軽減効果が一般に大きい</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>余裕資金100万円を繰上げ返済する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして</p><p><strong>繰上げ返済（期間短縮型・返済額軽減型）</strong> の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：余裕資金100万円を繰上げ返済する。</strong></p><p>この場面で「なぜ繰上げ返済（期間短縮型・返済額軽減型）が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 繰上げ返済（期間短縮型・返済額軽減型）は一言でいうと？</strong>\\</p><p>→ 予定より元金を早く返し、期間を縮めるか毎回返済額を軽くする方法です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 余裕資金100万円を繰上げ返済する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 同条件なら期間短縮型の利息軽減効果が一般に大きい。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>予定より元金を早く返し、期間を縮めるか毎回返済額を軽くする方法です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>余裕資金100万円を繰上げ返済する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>同条件なら期間短縮型の利息軽減効果が一般に大きい。</strong></p>", "M": "<p><strong>「繰上げ返済（期間短縮型・返済額軽減型）＝予定より元金を早く返し、期間を縮めるか毎回返済額を軽くする方法です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "財形住宅融資", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>財形貯蓄を行う勤労者が一定条件で利用できる住宅取得・改良向け融資です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>財形貯蓄を行う勤労者が一定条件で利用できる住宅取得・改良向け融資です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 財形住宅融資の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：財形貯蓄などの利用条件を確認</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>財形貯蓄を続けて住宅を買う</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>財形住宅融資</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：財形貯蓄を続けて住宅を買う。</strong></p><p>この場面で「なぜ財形住宅融資が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 財形住宅融資は一言でいうと？</strong>\\</p><p>→ 財形貯蓄を行う勤労者が一定条件で利用できる住宅取得・改良向け融資です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 財形貯蓄を続けて住宅を買う場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 財形貯蓄などの利用条件を確認。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>財形住宅融資</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>財形貯蓄を行う勤労者が一定条件で利用できる住宅取得・改良向け融資です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>財形貯蓄を続けて住宅を買う場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>財形貯蓄などの利用条件を確認。</strong></p>", "M": "<p><strong>「財形住宅融資＝財形貯蓄を行う勤労者が一定条件で利用できる住宅取得・改良向け融資です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "フラット35", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>住宅金融支援機構と民間金融機関が提携する長期・全期間固定金利型の住宅ローンです。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>住宅金融支援機構と民間金融機関が提携する長期・全期間固定金利型の住宅ローンです。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ フラット35の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：変動型・固定期間選択型と区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>金利上昇リスクを避けたい</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>フラット35</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：金利上昇リスクを避けたい。</strong></p><p>この場面で「なぜフラット35が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. フラット35は一言でいうと？</strong>\\</p><p>→</p><p>住宅金融支援機構と民間金融機関が提携する長期・全期間固定金利型の住宅ローンです。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 金利上昇リスクを避けたい場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 変動型・固定期間選択型と区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>フラット35</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>住宅金融支援機構と民間金融機関が提携する長期・全期間固定金利型の住宅ローンです。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>金利上昇リスクを避けたい場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>変動型・固定期間選択型と区別。</strong></p>", "M": "<p><strong>「フラット35＝住宅金融支援機構と民間金融機関が提携する長期・全期間固定金利型の住宅ローンです。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金があります。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金があります。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 財形貯蓄制度の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：3種類の目的・税制を区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>給与から毎月積み立てる</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>財形貯蓄制度</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：給与から毎月積み立てる。</strong></p><p>この場面で「なぜ財形貯蓄制度が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 財形貯蓄制度は一言でいうと？</strong>\\</p><p>→</p><p>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金があります。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 給与から毎月積み立てる場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 3種類の目的・税制を区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>財形貯蓄制度</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金があります。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>給与から毎月積み立てる場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>3種類の目的・税制を区別。</strong></p>", "M": "<p><strong>「財形貯蓄制度＝勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金があります。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "団体信用生命保険", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金でローン残高を返済する仕組みです。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金でローン残高を返済する仕組みです。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 団体信用生命保険の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：通常の死亡保険とは保険金の目的が違う</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>住宅ローン返済中に債務者が死亡する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>団体信用生命保険</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：住宅ローン返済中に債務者が死亡する。</strong></p><p>この場面で「なぜ団体信用生命保険が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 団体信用生命保険は一言でいうと？</strong>\\</p><p>→</p><p>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金でローン残高を返済する仕組みです。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 住宅ローン返済中に債務者が死亡する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 通常の死亡保険とは保険金の目的が違う。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>団体信用生命保険</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金でローン残高を返済する仕組みです。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>住宅ローン返済中に債務者が死亡する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>通常の死亡保険とは保険金の目的が違う。</strong></p>", "M": "<p><strong>「団体信用生命保険＝住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金でローン残高を返済する仕組みです。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>現在の住宅ローンを新しいローンで完済し、金利や返済条件の改善を狙う方法です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>現在の住宅ローンを新しいローンで完済し、金利や返済条件の改善を狙う方法です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 住宅ローンの借り換えの対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：金利差だけでなく諸費用も考える</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>高金利ローンを低金利ローンへ変える</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>住宅ローンの借り換え</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：高金利ローンを低金利ローンへ変える。</strong></p><p>この場面で「なぜ住宅ローンの借り換えが関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 住宅ローンの借り換えは一言でいうと？</strong>\\</p><p>→</p><p>現在の住宅ローンを新しいローンで完済し、金利や返済条件の改善を狙う方法です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 高金利ローンを低金利ローンへ変える場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 金利差だけでなく諸費用も考える。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>住宅ローンの借り換え</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>現在の住宅ローンを新しいローンで完済し、金利や返済条件の改善を狙う方法です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>高金利ローンを低金利ローンへ変える場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>金利差だけでなく諸費用も考える。</strong></p>", "M": "<p><strong>「住宅ローンの借り換え＝現在の住宅ローンを新しいローンで完済し、金利や返済条件の改善を狙う方法です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>健康保険の被保険者等が死亡した際の埋葬料・埋葬費などを整理するテーマです。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>健康保険の被保険者等が死亡した際の埋葬料・埋葬費などを整理するテーマです。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 埋葬に関する給付の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：誰が埋葬したか等で給付を区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>会社員が亡くなり家族が埋葬する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>埋葬に関する給付</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：会社員が亡くなり家族が埋葬する。</strong></p><p>この場面で「なぜ埋葬に関する給付が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 埋葬に関する給付は一言でいうと？</strong>\\</p><p>→</p><p>健康保険の被保険者等が死亡した際の埋葬料・埋葬費などを整理するテーマです。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 会社員が亡くなり家族が埋葬する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 誰が埋葬したか等で給付を区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>埋葬に関する給付</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>健康保険の被保険者等が死亡した際の埋葬料・埋葬費などを整理するテーマです。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>会社員が亡くなり家族が埋葬する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>誰が埋葬したか等で給付を区別。</strong></p>", "M": "<p><strong>「埋葬に関する給付＝健康保険の被保険者等が死亡した際の埋葬料・埋葬費などを整理するテーマです。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "任意継続被保険者", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>退職等で健康保険資格を失った人が、一定要件で退職前の健康保険を原則最長2年間継続できる制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>退職等で健康保険資格を失った人が、一定要件で退職前の健康保険を原則最長2年間継続できる制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 任意継続被保険者の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：保険料は原則全額自己負担</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>退職後すぐ再就職しない</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>任意継続被保険者</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：退職後すぐ再就職しない。</strong></p><p>この場面で「なぜ任意継続被保険者が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 任意継続被保険者は一言でいうと？</strong>\\</p><p>→</p><p>退職等で健康保険資格を失った人が、一定要件で退職前の健康保険を原則最長2年間継続できる制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 退職後すぐ再就職しない場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 保険料は原則全額自己負担。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>任意継続被保険者</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>退職等で健康保険資格を失った人が、一定要件で退職前の健康保険を原則最長2年間継続できる制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>退職後すぐ再就職しない場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>保険料は原則全額自己負担。</strong></p>", "M": "<p><strong>「任意継続被保険者＝退職等で健康保険資格を失った人が、一定要件で退職前の健康保険を原則最長2年間継続できる制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "国民健康保険", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 国民健康保険の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：会社員の健康保険との違い</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>退職後に国保へ加入する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>国民健康保険</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：退職後に国保へ加入する。</strong></p><p>この場面で「なぜ国民健康保険が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 国民健康保険は一言でいうと？</strong>\\</p><p>→ 他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 退職後に国保へ加入する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 会社員の健康保険との違い。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>国民健康保険</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>他の公的医療保険に加入していない住民などを対象とする公的医療保険です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>退職後に国保へ加入する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>会社員の健康保険との違い。</strong></p>", "M": "<p><strong>「国民健康保険＝他の公的医療保険に加入していない住民などを対象とする公的医療保険です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>原則75歳以上の人などを対象とする独立した公的医療保険制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>原則75歳以上の人などを対象とする独立した公的医療保険制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 後期高齢者医療制度の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：国保にそのまま残るわけではない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>75歳になった</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>後期高齢者医療制度</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：75歳になった。</strong></p><p>この場面で「なぜ後期高齢者医療制度が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 後期高齢者医療制度は一言でいうと？</strong>\\</p><p>→ 原則75歳以上の人などを対象とする独立した公的医療保険制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 75歳になった場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 国保にそのまま残るわけではない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>後期高齢者医療制度</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>原則75歳以上の人などを対象とする独立した公的医療保険制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>75歳になった場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>国保にそのまま残るわけではない。</strong></p>", "M": "<p><strong>「後期高齢者医療制度＝原則75歳以上の人などを対象とする独立した公的医療保険制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "公的介護保険", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>介護・支援が必要と認定された人が介護サービスを利用するための社会保険制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>介護・支援が必要と認定された人が介護サービスを利用するための社会保険制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 公的介護保険の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：第1号・第2号で給付条件が違う</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>要介護認定後に介護サービスを使う</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>公的介護保険</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：要介護認定後に介護サービスを使う。</strong></p><p>この場面で「なぜ公的介護保険が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 公的介護保険は一言でいうと？</strong>\\</p><p>→</p><p>介護・支援が必要と認定された人が介護サービスを利用するための社会保険制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 要介護認定後に介護サービスを使う場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 第1号・第2号で給付条件が違う。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>公的介護保険</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>介護・支援が必要と認定された人が介護サービスを利用するための社会保険制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>要介護認定後に介護サービスを使う場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>第1号・第2号で給付条件が違う。</strong></p>", "M": "<p><strong>「公的介護保険＝介護・支援が必要と認定された人が介護サービスを利用するための社会保険制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "労災保険", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 労災保険の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：健康保険との使い分け</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>仕事中や通勤途中にけがをする</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>労災保険</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：仕事中や通勤途中にけがをする。</strong></p><p>この場面で「なぜ労災保険が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 労災保険は一言でいうと？</strong>\\</p><p>→</p><p>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 仕事中や通勤途中にけがをする場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 健康保険との使い分け。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>労災保険</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>仕事中や通勤途中にけがをする場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>健康保険との使い分け。</strong></p>", "M": "<p><strong>「労災保険＝業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "雇用保険", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>失業・休業等の生活と雇用の安定、再就職を支える保険制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>失業・休業等の生活と雇用の安定、再就職を支える保険制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 雇用保険の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：失業給付だけの制度ではない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>離職後に求職する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>雇用保険</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：離職後に求職する。</strong></p><p>この場面で「なぜ雇用保険が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 雇用保険は一言でいうと？</strong>\\</p><p>→ 失業・休業等の生活と雇用の安定、再就職を支える保険制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 離職後に求職する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 失業給付だけの制度ではない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>雇用保険</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>失業・休業等の生活と雇用の安定、再就職を支える保険制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>離職後に求職する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>失業給付だけの制度ではない。</strong></p>", "M": "<p><strong>「雇用保険＝失業・休業等の生活と雇用の安定、再就職を支える保険制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>前者は早期再就職等を、後者は指定教育訓練の受講を支援する雇用保険の給付です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>前者は早期再就職等を、後者は指定教育訓練の受講を支援する雇用保険の給付です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 就職促進給付と教育訓練給付の対象・目的を確認</p><p>↓ 要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：再就職支援と学び直し支援を区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>再就職する／資格講座を受講する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>就職促進給付と教育訓練給付</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：再就職する／資格講座を受講する。</strong></p><p>この場面で「なぜ就職促進給付と教育訓練給付が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 就職促進給付と教育訓練給付は一言でいうと？</strong>\\</p><p>→</p><p>前者は早期再就職等を、後者は指定教育訓練の受講を支援する雇用保険の給付です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 再就職する／資格講座を受講する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 再就職支援と学び直し支援を区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>就職促進給付と教育訓練給付</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>前者は早期再就職等を、後者は指定教育訓練の受講を支援する雇用保険の給付です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>再就職する／資格講座を受講する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>再就職支援と学び直し支援を区別。</strong></p>", "M": "<p><strong>「就職促進給付と教育訓練給付＝前者は早期再就職等を、後者は指定教育訓練の受講を支援する雇用保険の給付です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>雇用保険から、育児休業中の所得や一定の雇用継続を支える給付が行われます。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>雇用保険から、育児休業中の所得や一定の雇用継続を支える給付が行われます。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 育児休業給付と雇用継続給付の対象・目的を確認</p><p>↓ 要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：給付ごとの対象・期間を区別</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>育児休業で賃金が減る</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>育児休業給付と雇用継続給付</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：育児休業で賃金が減る。</strong></p><p>この場面で「なぜ育児休業給付と雇用継続給付が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 育児休業給付と雇用継続給付は一言でいうと？</strong>\\</p><p>→</p><p>雇用保険から、育児休業中の所得や一定の雇用継続を支える給付が行われます。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 育児休業で賃金が減る場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 給付ごとの対象・期間を区別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>育児休業給付と雇用継続給付</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>雇用保険から、育児休業中の所得や一定の雇用継続を支える給付が行われます。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>育児休業で賃金が減る場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>給付ごとの対象・期間を区別。</strong></p>", "M": "<p><strong>「育児休業給付と雇用継続給付＝雇用保険から、育児休業中の所得や一定の雇用継続を支える給付が行われます。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>高年齢期の雇用継続と、家族介護による休業中の所得をそれぞれ支える給付です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>高年齢期の雇用継続と、家族介護による休業中の所得をそれぞれ支える給付です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓</p><p>高年齢雇用継続給付と介護休業給付の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：本人の高齢雇用か家族介護か</strong></p>< 的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：老齢だけでなく障害・遺族もある</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>会社員が老後の年金を受ける</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>公的年金</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：会社員が老後の年金を受ける。</strong></p><p>この場面で「なぜ公的年金が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 公的年金は一言でいうと？</strong>\\</p><p>→</p><p>国民年金を基礎に厚生年金が上乗せされ、老齢・障害・遺族の生活リスクに備える制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 会社員が老後の年金を受ける場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 老齢だけでなく障害・遺族もある。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>公的年金</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>国民年金を基礎に厚生年金が上乗せされ、老齢・障害・遺族の生活リスクに備える制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>会社員が老後の年金を受ける場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>老齢だけでなく障害・遺族もある。</strong></p>", "M": "<p><strong>「公的年金＝国民年金を基礎に厚生年金が上乗せされ、老齢・障害・遺族の生活リスクに備える制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "任意加入被保険者", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>国民年金の強制加入対象外でも、一定条件で本人の申出により加入できる仕組みです。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>国民年金の強制加入対象外でも、一定条件で本人の申出により加入できる仕組みです。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 任意加入被保険者の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：強制加入ではなく申出</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>年金額等を補いたい</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>任意加入被保険者</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：年金額等を補いたい。</strong></p><p>この場面で「なぜ任意加入被保険者が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 任意加入被保険者は一言でいうと？</strong>\\</p><p>→</p><p>国民年金の強制加入対象外でも、一定条件で本人の申出により加入できる仕組みです。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 年金額等を補いたい場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 強制加入ではなく申出。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>任意加入被保険者</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>国民年金の強制加入対象外でも、一定条件で本人の申出により加入できる仕組みです。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>年金額等を補いたい場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>強制加入ではなく申出。</strong></p>", "M": "<p><strong>「任意加入被保険者＝国民年金の強制加入対象外でも、一定条件で本人の申出により加入できる仕組みです。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>所得低下等で納付が難しい場合に、一定要件で保険料の免除・納付猶予を受ける制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>所得低下等で納付が難しい場合に、一定要件で保険料の免除・納付猶予を受ける制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓</p><p>国民年金保険料の免除・猶予制度の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：未納と免除・猶予は違う</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>収入減で保険料納付が難しい</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして</p><p><strong>国民年金保険料の免除・猶予制度</strong> の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：収入減で保険料納付が難しい。</strong></p><p>この場面で「なぜ国民年金保険料の免除・猶予制度が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 国民年金保険料の免除・猶予制度は一言でいうと？</strong>\\</p><p>→</p><p>所得低下等で納付が難しい場合に、一定要件で保険料の免除・納付猶予を受ける制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 収入減で保険料納付が難しい場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 未納と免除・猶予は違う。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>国民年金保険料の免除・猶予制度</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>所得低下等で納付が難しい場合に、一定要件で保険料の免除・納付猶予を受ける制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>収入減で保険料納付が難しい場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>未納と免除・猶予は違う。</strong></p>", "M": "<p><strong>「国民年金保険料の免除・猶予制度＝所得低下等で納付が難しい場合に、一定要件で保険料の免除・納付猶予を受ける制度です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "老齢基礎年金", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p> 繰下げ支給", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>老齢年金を基準より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>老齢年金を基準より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 繰上げ支給と繰下げ支給の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：一時的な増減ではない</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>65歳より前後に受給開始する</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>繰上げ支給と繰下げ支給</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：65歳より前後に受給開始する。</strong></p><p>この場面で「なぜ繰上げ支給と繰下げ支給が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 繰上げ支給と繰下げ支給は一言でいうと？</strong>\\</p><p>→</p><p>老齢年金を基準より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 65歳より前後に受給開始する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 一時的な増減ではない。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>繰上げ支給と繰下げ支給</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>老齢年金を基準より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>65歳より前後に受給開始する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>一時的な増減ではない。</strong></p>", "M": "<p><strong>「繰上げ支給と繰下げ支給＝老齢年金を基準より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "付加年金", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>国民年金第1号被保険者等が付加保険料を納め、老齢基礎年金に上乗せする制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>国民年金第1号被保険者等が付加保険料を納め、老齢基礎年金に上乗せする制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 付加年金の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：加入できる人・他制度との関係</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>自営業者が年金を上乗せする</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>付加年金</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：自営業者が年金を上乗せする。</strong></p><p>この場面で「なぜ付加年金が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 付加年金は一言でいうと？</strong>\\</p><p>→</p><p>国民年金第1号被保険者等が付加保険料を納め、老齢基礎年金に上乗せする制度です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 自営業者が年金を上乗せする場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 加入できる人・他制度との関係。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>付加年金</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>国民年金第1号被保険者等が付加保険料を納め、老齢基礎年金に上乗せする制度です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>自営業者が年金を上乗せする場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>加入できる人・他制度との関係。</strong></p>", "M": "<p><strong>「付加年金＝国民年金第1号被保険者等が付加保険 の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：自営業者だった夫が年金受給前に死亡する。</strong></p><p>この場面で「なぜ寡婦年金と死亡一時金が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 寡婦年金と死亡一時金は一言でいうと？</strong>\\</p><p>→</p><p>国民年金第1号被保険者に関係する独自の遺族給付で、それぞれ支給要件が異なります。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 自営業者だった夫が年金受給前に死亡する場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 要件・受給者・併給関係。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>寡婦年金と死亡一時金</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>国民年金第1号被保険者に関係する独自の遺族給付で、それぞれ支給要件が異なります。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>自営業者だった夫が年金受給前に死亡する場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>要件・受給者・併給関係。</strong></p>", "M": "<p><strong>「寡婦年金と死亡一時金＝国民年金第1号被保険者に関係する独自の遺族給付で、それぞれ支給要件が異なります。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "遺族厚生年金", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>厚生年金の被保険者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>厚生年金の被保険者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 遺族厚生年金の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：遺族基礎年金との対象の違い</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>会社員が死亡し遺族が残る</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>遺族厚生年金</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：会社員が死亡し遺族が残る。</strong></p><p>この場面で「なぜ遺族厚生年金が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 遺族厚生年金は一言でいうと？</strong>\\</p><p>→</p><p>厚生年金の被保険者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 会社員が死亡し遺族が残る場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 遺族基礎年金との対象の違い。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>遺族厚生年金</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>厚生年金の被保険者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>会社員が死亡し遺族が残る場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>遺族基礎年金との対象の違い。</strong></p>", "M": "<p><strong>「遺族厚生年金＝厚生年金の被保険者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "中高齢寡婦加算", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>一定要件を満たす中高齢の妻の遺族厚生年金に加算される仕組みです。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>一定要件を満たす中高齢の妻の遺族厚生年金に加算される仕組みです。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 中高齢寡婦加算の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：誰に・いつ加算されるか</strong></p><p>「先輩、たぶん『似た制度でも同じじゃないの？』って思いましたよね。違います。対象者、目的、期間、お金の流れのどこが違うかを見てください。」</p>", "C": "<p>「文字から離れますよ。<strong>遺族基礎年金が終わる中高齢の妻</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p> 給者の所得計算</strong>場面を想像してください。」</p><p>「最初に何を確認します？」</p><p>......そうです。誰が、何のために使うのか。\\</p><p>次に条件。最後に、受け取る・払う・借りる・計算する金額です。</p><p>「つまり難しい制度名でも、<strong>現実の相談場面に置き換えると『この人にこの仕組みが使える？』という話</strong>なんです。」</p>", "D": "<p>「では先輩、問題文に年齢・収入・加入期間・金額が出てきたとします。」</p><p>まず対象者を確認。次に目的を確認。そして <strong>公的年金等控除</strong></p><p>の条件に当てはめます。</p><p>「数字があるからって、いきなり電卓を触らないでくださいね？」</p><p><strong>具体例の場面：老齢年金受給者の所得計算。</strong></p><p>この場面で「なぜ公的年金等控除が関係するのか」を説明できれば、数字や人物設定が変わっても対応できます。</p>", "Q": "<p>「3問だけです。その『分かりました』が本物か確認します。」</p><p><strong>Q1. 公的年金等控除は一言でいうと？</strong>\\</p><p>→</p><p>公的年金等の収入から所得計算上差し引き、公的年金等に係る雑所得を計算するための控除です。</p><p><strong>Q2. どんな場面で使う？</strong>\\</p><p>→ 老齢年金受給者の所得計算場面。</p><p><strong>Q3. 何と間違えやすい？</strong>\\</p><p>→ 社会保険料控除とは別。</p><p>「はい。この3つが言えれば、かなりいいです。」</p>", "R": "<p>① 何の話？ → <strong>公的年金等控除</strong>\\</p><p>② 一番重要なのは？ →</p><p><strong>公的年金等の収入から所得計算上差し引き、公的年金等に係る雑所得を計算するための控除です。</strong>\\</p><p>③ なぜ？ → <strong>問題文の状況に合う制度・計算を選ぶため。</strong>\\</p><p>④ 流れは？ → <strong>状況 → 対象・目的 → 条件 → 判断。</strong>\\</p><p>⑤ イメージは？ → <strong>老齢年金受給者の所得計算場面。</strong>\\</p><p>⑥ 注意点は？ → <strong>社会保険料控除とは別。</strong></p>", "M": "<p><strong>「公的年金等控除＝公的年金等の収入から所得計算上差し引き、公的年金等に係る雑所得を計算するための控除です。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}, {"title": "確定拠出年金", "content": {"A": "<p>「先輩、いきなり数字や細かい条件から覚えようとしてませんか？」</p><p>「......もう。まず全体です。」</p><p>一言でいうと――</p><p><strong>拠出した掛金を加入者等が運用し、その成果によって将来の給付額が変わる年金制度です。</strong></p><p>「はい。最初にこれです。名前じゃなくて、まず『何をするものか』を残してください。」</p><p>重要なのは、<strong>目的・対象・似た制度との違い</strong>の3つです。</p><p>「試験で何を理解すべきか、ですか？　<strong>拠出した掛金を加入者等が運用し、その成果によって将来の給付額が変わる年金制度です。</strong>――これを自分の言葉で言えれば第一段階は合格です。」</p>", "B": "<p>「次は流れです。ここを飛ばすと選択肢を少し変えられただけで迷いますよ。」</p><p>問題文の人物・状況を確認 ↓ 確定拠出年金の対象・目的を確認 ↓</p><p>要件やお金の流れを当てはめる ↓ 似た制度と比較して判断</p><p>「ほら。こうして見ると、単語がちゃんと状況につながるでしょう？」</p><p>「で、ここは止まってください。」</p><p><strong>間違えやすいポイント：給付額が最初から確定ではない</strong></p キャッシングと総量規制＝キャッシングは現金を借りること。貸金業者から個人への借入残高は総量規制により原則年収の3分の1までです。」</strong></p><p>「全部丸暗記しなくていいです。でも、この一文を見たら今の流れが戻るようにしてください。」</p><p>「はい、お疲れさまでした。......明日、一回くらいは思い出してくださいね？」</p><p>------------------------------------------------------------------------</p>"}}];
const tabInfo=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];
let current=0, activeTab="A";
const $=id=>document.getElementById(id);
const select=$("select"), search=$("search"), bar=$("termbar"), tabs=$("tabs"), content=$("content");

cards.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;select.appendChild(o)});
tabInfo.forEach(([k,label])=>{const b=document.createElement("button");b.type="button";b.className="tab";b.dataset.tab=k;b.textContent=label;b.addEventListener("click",()=>{activeTab=k;render()});tabs.appendChild(b)});

function buildBar(filter=""){
  bar.innerHTML="";
  const q=filter.trim().toLowerCase();
  cards.forEach((c,i)=>{
    if(q && !c.title.toLowerCase().includes(q)) return;
    const b=document.createElement("button"); b.type="button"; b.className="termbtn"+(i===current?" active":"");
    b.textContent=c.title; b.addEventListener("click",()=>{current=i;select.value=i;render();});
    bar.appendChild(b);
  });
}
function render(){
  const c=cards[current];
  $("num").textContent=`${current+1} / ${cards.length}`;
  $("title").textContent=c.title;
  content.innerHTML=c.content[activeTab];
  [...tabs.children].forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));
  select.value=current;
  $("prev").disabled=current===0; $("next").disabled=current===cards.length-1;
  $("status").textContent=`登録範囲：キャッシングと総量規制まで｜全${cards.length}項目`;
  buildBar(search.value);
  const active=bar.querySelector(".active"); if(active) active.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
select.addEventListener("change",()=>{current=Number(select.value);render()});
search.addEventListener("input",()=>buildBar(search.value));
$("prev").addEventListener("click",()=>{if(current>0){current--;render()}});
$("next").addEventListener("click",()=>{if(current<cards.length-1){current++;render()}});
render();
</script>
