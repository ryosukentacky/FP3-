態→保険料納付要件。20歳前障害は納付要件なし。病名だけで判定しません。」</p>", "M": "<p>「<strong>障害基礎年金＝初診日・1級または2級の障害状態・納付要件を軸に判定する国民年金の障害保障。</strong>」</p>"}}, {"title": "障害厚生年金", "content": {"A": "<h3>A｜要点</h3><p>「先輩、障害厚生年金は、<strong>障害の原因となった病気・けがの初診日に厚生年金の被保険者だった人</strong>が、所定の障害状態などの要件を満たした場合に受ける年金です。」</p><p>「障害基礎年金が1級・2級なのに対し、障害厚生年金には<strong>1級・2級・3級</strong>があります。さらに3級より軽い一定の障害が残った場合には、障害手当金という一時金の仕組みもあります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「前の障害基礎年金と一番大きく違うのは、“初診日にどの年金制度にいたか”です。会社員として厚生年金加入中に初診日があれば、障害厚生年金を検討します。」</p><p>「1級または2級に該当すれば、原則として障害基礎年金という1階部分に、障害厚生年金という2階部分が上乗せされます。3級なら障害基礎年金には3級がないため、障害厚生年金だけです。」</p><p>「障害厚生年金の額は、老齢厚生年金と同じく報酬比例が基本です。ただし被保険者期間が短い人についても保障が薄くなりすぎないよう、計算上<strong>300月未満なら300月として扱う</strong>仕組みがあります。」</p><p>「また1級の障害厚生年金は、報酬比例部分を基礎とした2級相当額の<strong>1.25倍</strong>が基本です。1・2級では一定要件の配偶者がいる場合、配偶者加給年金額が加算されることもあります。」</p><p>「そして前項と同様、初診日、障害認定日、保険料納付要件が重要です。“今会社員だから厚生年金”ではなく、<strong>初診日に厚生年金だったか</strong>を見るんですよ。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが厚生年金加入中に病気で初めて受診したとします。この初診日の時点で、Aさんは年金住宅の1階と2階の両方にいます。」</p><p>「障害認定日に2級なら、1階から障害基礎年金、2階から障害厚生年金。3級なら1階には3級の部屋がないので、2階の障害厚生年金だけです。」</p><p>「だから“障害厚生年金＝障害基礎年金より重い人の年金”ではありません。違いの出発点は<strong>初診日の加入制度</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは会社員として厚生年金加入中の40歳で初診日を迎え、障害認定日に2級となりました。納付要件等も満たすとします。この場合、原則として障害基礎年金2級＋障害厚生年金2級を受ける構造です。」</p><p>「Bさんも厚生年金加入中に初診日がありましたが、障害状態は3級でした。障害基礎年金には3級がないため、Bさんは障害厚生年金3級が中心になります。」</p><p>「Cさんは厚生年金加入期間が10年＝120月しかなかったとしても、障害厚生年金の報酬比例額では一定の場合に300月として計算します。短期加入だから保障が極端に小さくならないための仕組みです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜障害厚生年金には3級がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「あります。障害基礎年金は1級・2級だけなので、ここが重要な違いです。」</p></div></details><h4>Q2｜現在会社員なら、初診日が退職前でも退職後でも必ず障害厚生年金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。原則として障害の原因となった傷病の初診日に厚生年金の被保険者だったかを確認します。」</p></div></details><h4>Q3｜厚生年金加入期間が300月未満なら報酬比例額の計算はその短い月数だけ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「障害厚生年金では、一定の計算で被保険者期間が300月未満の場合は300月として計算します。」</p></div></details>", "R": "<p>「初診日に厚生年金。1・2級なら基礎＋厚生、3級は厚生のみ。障害厚生には3級と障害手当金がある。300月みなしも重要です。」</p>", "M": "<p>「<strong>障害厚生年金＝厚生年金加入中に初診日がある人を、1〜3級の障害状態に応じて保障する2階部分。</strong>」</p>"}}, {"title": "遺族基礎年金", "content": {"A": "<h3>A｜要点</h3><p>「遺族基礎年金は、国民年金の被保険者などが死亡したとき、残された<strong>“子のある配偶者”または“子”</strong>の生活を支える基礎年金です。」</p><p>「ここでいう子には年齢要件があります。原則として<strong>18歳到達年度の末日まで</strong>、または20歳未満で障害等級1級・2級の状態にある未婚の子です。」</p><p>「つまり“夫が亡くなれば妻なら誰でも遺族基礎年金”ではありません。<strong>子の存在が中心条件</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「遺族基礎年金の目的は、子育て中の世帯で家計を支える人が亡くなったとき、配偶者と子の生活を守ることです。」</p><p>「受給できる遺族は、死亡した人に生計を維持されていた“子のある配偶者”または“子”。配偶者だけで子がいない場合は、原則として遺族基礎年金の対象になりません。」</p><p>「死亡した人側にも要件があります。国民年金の被保険者や一定の元被保険者などであることに加え、原則として死亡日の前日において、死亡月の前々月までの被保険者期間のうち、納付済期間＋免除期間が3分の2以上などの保険料納付要件を確認します。」</p><p>「一定期間は、65歳未満の死亡について直近1年間に未納がない場合の特例もあります。」</p><p>「年金額は基本額に子の加算が付く構造です。子の人数が増えると加算も変わりますが、金額は年度改定されるので受験年度の額を確認してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「Aさんが亡くなり、配偶者Bさんと10歳の子Cさんが残されたとします。」</p><p>「Bさん一人だけを見るのではなく、“Bさん＋まだ養育が必要なCさん”という世帯を国民年金の1階から支えるのが遺族基礎年金です。」</p><p>「やがてCさんが原則18歳到達年度末を越え、他に対象となる子がいなくなると、“子のある配偶者”という条件から外れます。」</p><p>「だから遺族基礎年金を見たら、最初に<strong>対象となる子はいる？</strong>と確認してください。」</p>", "D": "<h3>D｜具体例</h3><p>「会社員Aさんが死亡し、妻Bさんと15歳の子Cさんが残されたとします。Aさんが所定の納付要件等を満たし、BさんとCさんがAさんに生計維持されていたとします。」</p><p>「会社員だから遺族厚生年金だけ、ではありません。条件を満たせば、子のある配偶者Bさんには1階の遺族基礎年金が支給され、さらに厚生年金側の要件を満たせば遺族厚生年金も関係します。」</p><p>「一方、AさんとBさんの間に対象となる子がいなければ、Bさんは原則として遺族基礎年金を受けられません。ここが遺族厚生年金との大きな違いです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜子のいない配偶者は原則、遺族基礎年金を受けられる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則受けられません。受給対象は“子のある配偶者”または“子”です。」</p></div></details><h4>Q2｜子の年齢要件の基本は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則18歳到達年度の末日までです。20歳未満で障害等級1級・2級の未婚の子も対象となり得ます。」</p></div></details><h4>Q3｜会社員が死亡した場合、遺族基礎年金は絶対に関係しない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。子のある配偶者等の要件を満たせば遺族基礎年金も対象となり、遺族厚生年金と併給される場合があります。」</p></div></details>", "R": "<p>「遺族基礎年金を見たら“子はいる？”です。対象は子のある配偶者または子。原則18歳年度末までの子等が中心です。」</p>", "M": "<p>「<strong>遺族基礎年金＝死亡した人に生計維持されていた“子のある配偶者”または“子”を支える1階の遺族年金。</strong>」</p>"}}, {"title": "寡婦年金と死亡一時金", "content": {"A": "<h3>A｜要点</h3><p>「この二つは、主に<strong>国民年金第1号被保険者として保険料を納めた人が、老齢基礎年金を十分受ける前に死亡した場合</strong>に、納めた保険料がまったく遺族保障につながらない事態を補う独自給付です。」</p><p>「寡婦年金は一定の妻へ<strong>60歳から65歳まで年金</strong>として支給。死亡一時金は一定の遺族へ<strong>一時金</strong>として支給されます。」</p><p>「両方の要件を満たしても、原則として<strong>寡婦年金と死亡一時金はどちらか一方を選択</strong>します。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「寡婦年金は、第1号被保険者としての保険料納付済期間と免除期間が原則10年以上ある夫が、老齢基礎年金や障害基礎年金を受けずに死亡した場合などに、一定の妻へ支給されます。」</p><p>「妻側には、夫によって生計を維持され、婚姻関係が原則10年以上継続していることなどの要件があります。支給期間は妻が60歳から65歳になるまでです。」</p><p>「額は、死亡した夫の第1号被保険者期間だけを基礎として計算した老齢基礎年金額の<strong>4分の3</strong>が基本です。」</p><p>「死亡一時金は、第1号被保険者として保険料を納付した月数等が原則36月以上ある人が、老齢基礎年金・障害基礎年金を受けないまま死亡し、その死亡によって遺族基礎年金を受けられる遺族がいない場合などに、生計を同じくしていた一定の遺族へ支給されます。」</p><p>「つまり寡婦年金は“長く支えた妻への60〜64歳の年金”、死亡一時金は“一定期間保険料を納めたのに基礎年金給付につながらず死亡した場合の一時金”という違いです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「自営業の夫Aさんが長年国民年金保険料を納め、年金を受け取る前に死亡した場面です。」</p><p>「妻Bさんとの婚姻が長く、Bさんが一定要件を満たすなら、Bさんが60〜64歳の間に受け取る“橋”が寡婦年金です。65歳になると自分の老齢基礎年金の世界へ入るので、その橋は終わります。」</p><p>「一方、条件に該当する遺族へ一度だけまとまって支払うのが死亡一時金。こちらは毎年続く橋ではなく、一回限りの給付です。」</p><p>「<strong>寡婦＝妻・60〜65歳・年金、死亡一時金＝一定の遺族・一回</strong>で絵を分けましょう。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは自営業で、第1号被保険者として保険料納付済・免除期間が合計30年あり、老齢基礎年金も障害基礎年金も受けないまま死亡しました。妻Bさんとは20年以上婚姻し、生計維持関係もあったとします。」</p><p>「Bさんが寡婦年金の他の要件も満たせば、60歳から65歳まで、Aさんの第1号被保険者期間を基礎に計算した老齢基礎年金相当額の4分の3を受ける仕組みです。」</p><p>「別のCさんが第1号として一定期間以上保険料を納め、基礎年金を受けずに死亡し、遺族基礎年金を受ける遺族もいない場合には、一定の遺族に死亡一時金が支給される可能性があります。」</p><p>「両制度に該当するときは“両方もらえる”と覚えず、原則選択です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜寡婦年金は妻が何歳の間に支給される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則60歳から65歳になるまでです。」</p></div></details><h4>Q2｜寡婦年金額の基本は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「死亡した夫の第1号被保険者期間を基礎に計算した老齢基礎年金額の4分の3です。」</p></div></details><h4>Q3｜寡婦年金と死亡一時金の両方の要件を満たせば両方受給できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則としてどちらか一方を選択します。」</p></div></details>", "R": "<p>「寡婦年金＝一定の妻へ60〜64歳、夫の基礎年金相当の4分の3。死亡一時金＝一定の遺族への一時金。両方なら原則選択です。」</p>", "M": "<p>「<strong>寡婦年金は妻への期間限定年金、死亡一時金は一定遺族への一回限りの給付。</strong>」</p>"}}, {"title": "遺族厚生年金", "content": {"A": "<h3>A｜要点</h3><p>「遺族厚生年金は、厚生年金の被保険者などが死亡したとき、一定の遺族へ支給される<strong>2階部分の遺族年金</strong>です。」</p><p>「遺族基礎年金と違って、“子がいること”が絶対条件ではありません。配偶者・子のほか、一定の場合に父母・孫・祖父母も受給対象になり得ます。」</p><p>「年金額の基本は、死亡した人の老齢厚生年金の<strong>報酬比例部分の4分の3</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「厚生年金加入中の会社員が死亡した場合、その人が家計へ持ち込んでいた給与が失われます。その所得喪失を厚生年金側から補うのが遺族厚生年金です。」</p><p>「受給順位があります。一般に配偶者・子が先で、その後に父母、孫、祖父母という順序を確認します。また夫・父母・祖父母には年齢要件があり、妻についても年齢や子の有無によって支給のされ方が変わる場合があります。」</p><p>「特に、夫の死亡時に30歳未満で子のない妻が受ける遺族厚生年金は、原則<strong>5年間の有期給付</strong>です。」</p><p>「一方、一定の中高齢の妻には次項の中高齢寡婦加算が付くことがあります。」</p><p>「遺族基礎年金との違いを整理すると、基礎年金は“子のある配偶者または子”が中心。厚生年金は“死亡した厚生年金加入者等に生計維持されていた一定の遺族”へ、より広い範囲で保障する仕組みです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが死亡したとします。年金住宅の1階には遺族基礎年金、2階には遺族厚生年金があります。」</p><p>「妻Bさんと15歳の子Cさんがいれば、要件を満たす間は1階の遺族基礎年金＋2階の遺族厚生年金という二層の保障になり得ます。」</p><p>「でも子が成人して対象外なら、1階の遺族基礎年金は原則なくなります。それでもBさんが遺族厚生年金の要件を満たせば、2階部分は残る場合があります。」</p><p>「だから“子がいない＝遺族年金ゼロ”ではありません。<strong>基礎と厚生で受給遺族の範囲が違う</strong>んです。」</p>", "D": "<h3>D｜具体例</h3><p>「会社員Aさんが死亡し、妻Bさん45歳と子Cさん10歳が残されたとします。Aさんの死亡について所定の要件を満たすとします。」</p><p>「Bさんは子のある配偶者として遺族基礎年金の対象になり得ます。同時に、Aさんが厚生年金の要件を満たしていれば遺族厚生年金も対象となり得ます。」</p><p>「やがてCさんが18歳到達年度末を過ぎ、他に対象の子がいなくなると、Bさんの遺族基礎年金は原則終了します。しかし遺族厚生年金は別の要件で続くことがあります。」</p><p>「そしてBさんのような一定の中高齢の妻では、遺族基礎年金がなくなる時期などに次項の中高齢寡婦加算が橋渡しになる場合があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜遺族厚生年金は、対象となる子がいなければ絶対に受給できない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。遺族基礎年金と異なり、子がいない配偶者なども所定要件を満たせば対象になり得ます。」</p></div></details><h4>Q2｜年金額の基本は死亡した人の報酬比例部分の何割？</h4><details><summary>答えを見る</summary><div class='answer'><p>「4分の3です。」</p></div></details><h4>Q3｜夫死亡時30歳未満で子のない妻の遺族厚生年金は原則どうなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則5年間の有期給付です。」</p></div></details>", "R": "<p>「遺族厚生＝2階。子は絶対条件ではない。基本額は死亡者の報酬比例部分の4分の3。基礎年金との対象者の違いを押さえます。」</p>", "M": "<p>「<strong>遺族厚生年金＝厚生年金加入者等の死亡で、一定の遺族へ報酬比例部分を基礎に支給する2階の遺族保障。</strong>」</p>"}}, {"title": "中高齢寡婦加算", "content": {"A": "<h3>A｜要点</h3><p>「中高齢寡婦加算は、一定の妻が受ける遺族厚生年金に、<strong>40歳から65歳になるまで</strong>加算される仕組みです。」</p><p>「典型は、夫死亡時に40歳以上65歳未満で、遺族基礎年金を受けられる子がいない妻。または、夫死亡時は子がいたものの、妻が40歳に達した後に子が年齢要件を外れて遺族基礎年金が終了した場合です。」</p><p>「目的は、<strong>子がいないため遺族基礎年金を受けられない中高齢の妻が、自分の老齢基礎年金を受ける65歳までの谷を埋める</strong>ことです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先ほどの遺族基礎年金は“子のある配偶者”が中心でした。では45歳の妻が夫を亡くし、対象となる子がいなかったらどうなるでしょう。遺族厚生年金は受けられても、遺族基礎年金は原則ありません。」</p><p>「しかも妻自身の老齢基礎年金は原則65歳から。この40代・50代から65歳までに保障の谷が生まれます。その谷を遺族厚生年金へ上乗せして埋めるのが中高齢寡婦加算です。」</p><p>「加算額は原則として遺族基礎年金の基本額の<strong>4分の3相当</strong>です。具体額は年度改定されるので受験年度の金額を確認します。」</p><p>「ただし死亡した夫側にも、原則として厚生年金の被保険者期間が20年以上あることなどの要件があります。」</p><p>「65歳になると中高齢寡婦加算は終了します。そこで一定の世代には、妻自身の老齢基礎年金へ経過的寡婦加算が付く場合があります。ここも“65歳を境に制度が切り替わる”と理解すると整理できます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「45歳の妻Bさんが夫を亡くし、対象となる子はいないとします。」</p><p>「Bさんは2階の遺族厚生年金を受けられても、1階の遺族基礎年金は“子がいない”ため原則ありません。一方、自分の老齢基礎年金が始まるのは65歳。」</p><p>「そこで45歳から65歳までの谷へ“中高齢寡婦加算”という橋を架けます。」</p><p>「65歳駅へ着くと橋は終了し、自分の老齢基礎年金へ移る。だから<strong>40〜65歳の橋渡し</strong>という映像が一番覚えやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが死亡し、妻Bさんは45歳、対象となる子はいないとします。Aさんには原則20年以上の厚生年金被保険者期間があり、Bさんは遺族厚生年金の要件を満たすとします。」</p><p>「Bさんは子がいないため遺族基礎年金は原則受けられません。しかし40歳以上65歳未満なので、要件を満たせば遺族厚生年金に中高齢寡婦加算が上乗せされます。」</p><p>「Bさんが65歳になると中高齢寡婦加算は終了し、自分の老齢基礎年金を受ける年齢になります。」</p><p>「別の妻Cさんが夫死亡時35歳で10歳の子を育てていた場合、最初は遺族基礎年金があります。その後Cさんが40歳を超え、子が18歳到達年度末を過ぎて遺族基礎年金が終了したとき、他の要件を満たせば中高齢寡婦加算へつながる場合があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜中高齢寡婦加算は原則何歳から何歳まで？</h4><details><summary>答えを見る</summary><div class='answer'><p>「40歳から65歳になるまでです。」</p></div></details><h4>Q2｜何の年金に上乗せされる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「一定の妻が受ける遺族厚生年金に加算されます。」</p></div></details><h4>Q3｜なぜ65歳で原則終了する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「65歳から妻自身の老齢基礎年金を受ける年齢となり、40〜64歳の保障の谷を埋める役割が終わるためです。」</p></div></details>", "R": "<p>「中高齢寡婦加算＝40〜64歳の一定の妻へ、遺族厚生年金に上乗せ。子がいない等で遺族基礎年金がない期間と65歳の老齢基礎年金をつなぐ橋です。」</p>", "M": "<p>「<strong>中高齢寡婦加算＝一定の妻の40歳から65歳までを、遺族厚生年金への加算で橋渡しする制度。</strong>」</p>"}}, {"title": "公的年金等控除", "content": {"A": "<h3>A｜要点</h3><p>「先輩、公的年金を受け取ったら、その全額にそのまま所得税がかかるわけではありません。老齢基礎年金や老齢厚生年金などは原則<strong>雑所得</strong>として扱い、収入から<strong>公的年金等控除額</strong>を差し引いて公的年金等に係る雑所得を計算します。」</p><p>「式の芯は、<strong>公的年金等の収入金額－公的年金等控除額＝公的年金等に係る雑所得</strong>です。」</p><p>「そしてこれは“税額控除”ではありません。税金そのものから直接引くのではなく、課税対象となる<strong>所得を計算する段階で引く控除</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜこんな控除があるのか。年金は高齢期の生活を支える継続的な収入です。その収入全部をそのまま所得とせず、一定額を控除して税負担を調整します。」</p><p>「控除額は一律ではありません。基本的に<strong>65歳未満か65歳以上か、公的年金等の収入額はいくらか、公的年金等以外の合計所得金額はいくらか</strong>によって計算が変わります。」</p><p>「ここで混同しやすいのが基礎控除です。公的年金等控除はまず“年金収入から雑所得を求める”ための控除。その後、他の所得と合計して所得控除を適用し、課税所得を求めます。つまり計算する場所が違います。」</p><p>「また、障害年金や遺族年金は原則として非課税です。ですから“公的年金なら全部、公的年金等控除を使って課税所得を計算する”わけではありません。老齢年金と障害・遺族年金を分けてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「老齢年金として年間200万円が入った箱を想像してください。税務では200万円の箱をそのまま“所得200万円”として机に置きません。」</p><p>「まず箱の入口で公的年金等控除というフィルターを通します。そこで一定額を除き、残った部分が“公的年金等に係る雑所得”です。」</p><p>「その雑所得を給与所得など他の所得と合流させ、その後に基礎控除などの所得控除を差し引いて課税所得へ進みます。」</p><p>「だから<strong>年金収入→公的年金等控除→雑所得→他の所得と合算→所得控除→課税所得</strong>。この順番で見れば、“控除”という同じ名前に惑わされません。」</p>", "D": "<h3>D｜具体例</h3><p>「計算の構造を見るため、公的年金等の収入が200万円、公的年金等控除額が仮に110万円となるケースを考えます。」</p><p>「公的年金等に係る雑所得は、200万円－110万円＝<strong>90万円</strong>です。ここで90万円がそのまま所得税額になるわけではありません。」</p><p>「この90万円を他の所得と合わせ、そこから基礎控除や社会保険料控除など該当する所得控除を差し引き、課税所得を求め、その後に税率を使って税額を計算します。」</p><p>「先輩、“110万円控除だから税金が110万円安くなる”ではないですよ。<strong>所得から110万円を除く</strong>という意味です。なお実際の控除額は年齢・収入等で異なるため、受験年度の速算表を使います。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜老齢基礎年金・老齢厚生年金は原則何所得？</h4><details><summary>答えを見る</summary><div class='answer'><p>「公的年金等に係る雑所得です。」</p></div></details><h4>Q2｜公的年金等控除は税額そのものから直接差し引く税額控除？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。年金収入から雑所得を計算する段階で差し引く控除です。」</p></div></details><h4>Q3｜障害年金・遺族年金も通常の老齢年金と同じように課税される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として障害年金・遺族年金は非課税です。」</p></div></details>", "R": "<p>「老齢年金収入から公的年金等控除を引いて雑所得を出す。税額控除ではない。障害・遺族年金は原則非課税。計算順序を覚えます。」</p>", "M": "<p>「<strong>公的年金等控除＝課税される老齢年金等の収入から差し引き、雑所得を求めるための控除。</strong>」</p>"}}, {"title": "確定拠出年金", "content": {"A": "<h3>A｜要点</h3><p>「確定拠出年金は、<strong>先に“拠出する掛金”が決まり、その掛金を加入者が運用し、将来の受取額は運用結果によって変わる年金制度</strong>です。」</p><p>「“確定”しているのは将来の給付額ではなく<strong>拠出額</strong>。ここが確定給付企業年金との最大の違いです。」</p><p>「大きく<strong>企業型DC</strong>と<strong>個人型DC（iDeCo）</strong>があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「企業型DCでは原則として事業主が掛金を拠出し、加入者自身が用意された運用商品の中から選びます。規約等により加入者が上乗せ拠出する仕組みがある場合もあります。」</p><p>「iDeCoは個人が自分で掛金を拠出し、自分で商品を選んで運用します。掛金額には加入区分などに応じた上限があります。」</p><p>「重要なのは運用リスクです。定期預金のような元本確保型商品を選ぶことも、投資信託など価格変動のある商品を選ぶこともできます。運用成果が良ければ資産は増えますが、商品によっては元本割れもあり得ます。」</p><p>「税制上は、拠出・運用・受取の各段階に優遇があります。iDeCoなど本人が負担した一定の掛金は小規模企業共済等掛金控除の対象、運用益は制度内で非課税、受取時も年金なら公的年金等控除、一時金なら退職所得控除の対象となり得ます。」</p><p>「ただし老後資金の制度なので、原則として60歳まで自由に引き出すことはできません。普通の投資口座との大きな違いです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社や自分が毎月“老後専用の箱”へ掛金を入れます。ただし箱の中身を現金のまま置くか、投資信託などで育てるかは加入者自身が選びます。」</p><p>「20年後、入れた掛金が同じでも、選んだ商品と運用結果によって箱の大きさは人ごとに変わります。」</p><p>「つまり確定拠出年金は、“将来1000万円渡します”という約束ではなく、<strong>“毎月これだけ箱に入れます。どう育てるかで将来額が変わります”</strong>という制度です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが毎月2万円を20年間拠出したとします。単純な掛金総額は2万円×12か月×20年＝<strong>480万円</strong>です。」</p><p>「でも将来受け取る資産が480万円と決まっているわけではありません。運用益が出れば480万円を上回り、選んだ商品によって損失が出れば掛金総額を下回る可能性もあります。」</p><p>「一方、確定給付型なら“一定の算定式に基づく給付”を制度側が約束する考え方です。<strong>DC＝Contribution（拠出）がDefined、DB＝Benefit（給付）がDefined</strong>と英語までつなぐと混同しません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜確定拠出年金で“確定”しているのは将来の受取額？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。基本的に確定しているのは拠出する掛金です。受取額は運用結果等で変動します。」</p></div></details><h4>Q2｜運用商品を選ぶのは誰？</h4><details><summary>答えを見る</summary><div class='answer'><p>「加入者自身です。そのため運用結果の影響も加入者が負います。」</p></div></details><h4>Q3｜iDeCoの資産は必要になれば原則いつでも引き出せる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。老後資産形成制度なので、原則60歳まで引き出せません。」</p></div></details>", "R": "<p>「DCは拠出額が先に決まる。企業型とiDeCo。自分で運用し、受取額は変動。税制優遇がある代わりに原則60歳まで引出不可です。」</p>", "M": "<p>「<strong>確定拠出年金＝掛金を確定し、自分で運用して、その結果で将来の受取額が決まる老後資産形成制度。</strong>」</p>"}}, {"title": "小規模企業共済等掛金控除", "content": {"A": "<h3>A｜要点</h3><p>「小規模企業共済等掛金控除は、対象となる掛金を支払った場合、その<strong>支払った掛金の全額を所得から控除</strong>できる所得控除です。」</p><p>「代表は<strong>小規模企業共済の掛金、iDeCoなど個人型確定拠出年金の加入者掛金</strong>などです。」</p><p>「“税金が掛金と同額戻る”制度ではありません。掛金分だけ<strong>課税対象となる所得を小さくする</strong>制度です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「自営業者や小規模企業の役員には、会社員のような企業退職金が十分でない場合があります。小規模企業共済は、そうした人が自分の退職金を準備する性格を持つ制度です。」</p><p>「またiDeCoは自分で老後資金を積み立てます。国はこうした自助努力を後押しするため、一定の掛金を所得控除にしています。」</p><p>「控除額は対象掛金について<strong>その年に支払った全額</strong>が基本です。生命保険料控除のように“払った額の一部だけを一定上限まで控除”する構造とは違います。」</p><p>「所得控除なので、節税額は本人の所得税率・住民税率等によって変わります。同じ24万円を拠出しても、誰でも24万円税金が減るわけではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「Aさんの所得が500万円あるとします。そこから対象となる掛金24万円を“老後準備のために自分で確保したお金”として税計算の土台から外すイメージです。」</p><p>「すると課税計算へ進む所得は、その分だけ小さくなります。」</p><p>「ここで税務署から24万円が現金で返ってくるわけではありません。<strong>24万円×適用される税率分だけ税負担が軽くなる方向</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「AさんがiDeCoへ年間24万円拠出し、その全額が小規模企業共済等掛金控除の対象だとします。」</p><p>「所得税の限界税率を仮に10%として、他の条件を無視すると、所得税への効果は24万円×10%＝<strong>2万4,000円</strong>軽くなる方向です。さらに住民税にも所得控除として影響します。」</p><p>「だから“24万円拠出したから24万円税金が返る”は間違いです。控除されるのは<strong>税額ではなく所得</strong>です。」</p><p>「先ほどの確定拠出年金とつなげると、iDeCoは“制度”、小規模企業共済等掛金控除は“その掛金に対する税制上の扱い”です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜対象掛金は原則いくら所得控除できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「その年に支払った対象掛金の全額です。」</p></div></details><h4>Q2｜24万円の控除なら税金が24万円減る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。所得が24万円減り、その結果として適用税率に応じて税額が軽減されます。」</p></div></details><h4>Q3｜iDeCoと小規模企業共済等掛金控除は同じもの？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。iDeCoは年金制度、こちらは対象掛金について所得を控除する税制です。」</p></div></details>", "R": "<p>「対象掛金は全額所得控除。税額控除ではない。iDeCo等の老後資金形成を税制で後押しする仕組みです。」</p>", "M": "<p>「<strong>小規模企業共済等掛金控除＝iDeCo等の対象掛金を全額、課税所得を求める前の所得から差し引ける制度。</strong>」</p>"}}, {"title": "中退共（中小企業退職金共済制度）", "content": {"A": "<h3>A｜要点</h3><p>「中退共は<strong>中小企業退職金共済制度</strong>。単独では退職金制度を整えにくい中小企業が、従業員の退職金を社外で準備するための国の制度です。」</p><p>「事業主が中退共と退職金共済契約を結び、<strong>掛金は原則事業主が全額負担</strong>します。従業員が退職すると、退職金は原則として中退共から従業員本人へ直接支払われます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「小さな会社が自社だけで退職金用の巨額な資金を管理すると、資金繰りや制度運営の負担が大きくなります。そこで多数の中小企業が共済の仕組みに参加し、社外に積み立てます。」</p><p>「事業主は従業員ごとに掛金月額を選び、毎月掛金を納付します。掛金は従業員の給与から天引きするのではなく、原則として事業主負担です。」</p><p>「国による新規加入時等の掛金助成もあります。また事業主が支払った掛金は、税務上、法人なら原則損金、個人事業主なら必要経費となります。」</p><p>「先ほどの小規模企業共済と混ぜないでください。<strong>小規模企業共済は主に経営者・個人事業主自身の退職金準備、中退共は中小企業で働く従業員の退職金準備</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「小さな会社A社に従業員10人がいるとします。A社だけで10人分の将来の退職金を金庫に積み立て、運用・管理するのは大変です。」</p><p>「そこで会社は毎月、従業員ごとの掛金を“中退共という大きな共同金庫”へ送ります。」</p><p>「10年後に従業員Bさんが退職すると、会社の金庫からその場で大金を出すのではなく、中退共の共同金庫からBさん本人へ退職金が支払われます。」</p><p>「<strong>会社が掛金を出す→社外で積み立てる→退職時に従業員へ直接支給</strong>。この流れです。」</p>", "D": "<h3>D｜具体例</h3><p>「A社が従業員Bさんについて中退共へ毎月1万円を掛けるとします。単純な掛金ベースなら1年間で12万円をA社が負担します。」</p><p>「Bさんの給与から1万円を引くのではありません。掛金は原則A社が全額負担します。」</p><p>「Bさんが退職して所定の請求をすると、退職金は原則中退共からBさん本人へ直接支給されます。」</p><p>「一方、A社社長自身の老後・退職資金を準備したいという話なら、中退共ではなく小規模企業共済が候補になる、という区別が重要です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜中退共の掛金は原則誰が負担する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「事業主が全額負担します。」</p></div></details><h4>Q2｜退職金は原則、誰から従業員へ支払われる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「中退共から退職した従業員本人へ直接支払われます。」</p></div></details><h4>Q3｜小規模企業共済との基本的な対象の違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「小規模企業共済は主に経営者・個人事業主自身、中退共は中小企業の従業員の退職金準備です。」</p></div></details>", "R": "<p>「中退共＝中小企業の従業員退職金。掛金は原則事業主全額負担。社外積立で、退職時は中退共から本人へ直接支給です。」</p>", "M": "<p>「<strong>中退共＝中小企業が事業主負担で社外に積み立て、従業員の退職金を準備する共済制度。</strong>」</p>"}}, {"title": "分割払いとリボ払い", "content": {"A": "<h3>A｜要点</h3><p>「先輩、分割払いとリボ払いは似ていますが、<strong>何を先に固定するか</strong>が違います。」</p><p>「<strong>分割払い＝買い物ごとに支払回数を決める</strong>。10万円を5回払い、という形です。」</p><p>「<strong>リボ払い＝毎月の支払額などを一定のルールにし、残高を繰り越す</strong>。新しい買い物をすると残高が増え、完済時期が後ろへ延びやすい仕組みです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「分割払いでは、購入時に“3回”“5回”“10回”など回数を選びます。購入金額と手数料をその回数に分けるので、その買い物について完済時期を比較的把握しやすいです。」</p><p>「リボ払いでは、利用残高に応じて毎月一定額または一定の算定方法で支払います。月々の負担を平準化しやすい反面、追加利用しても毎月支払額が大きく変わらない方式では、残高が見えにくくなります。」</p><p>「すると“毎月1万円しか払っていないから大丈夫”と思っていても、裏側では20万円、30万円と利用残高が積み上がり、手数料が長期間発生することがあります。」</p><p>「つまりリボの注意点は、毎月額の小ささではなく、<strong>元本残高・手数料率・完済までの期間・総支払額</strong>を見ることです。」</p><p>「なおクレジットの方式や手数料はカード会社・契約により異なります。ここではFPで押さえる構造を理解してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「10万円のテレビを買ったとします。分割払いなら、レジで“5回に切ります”と10万円のケーキを5つに切るイメージです。その買い物の終わりが見えます。」</p><p>「リボ払いはベルトコンベアです。毎月出口から1万円ずつ荷物を出していても、入口から新しい買い物を3万円、5万円と載せれば、コンベア上の荷物は減りません。」</p><p>「しかも残っている荷物には手数料がかかる。だからリボは“毎月一定だから管理しやすい”面と、“残高と完済時期が見えにくい”面が同時にあります。」</p>", "D": "<h3>D｜具体例</h3><p>「手数料を無視して構造だけ見ます。10万円の商品を5回の分割払いにすれば、単純なら1回2万円を5回払って終了です。実際には契約に応じた分割手数料が加わる場合があります。」</p><p>「一方、10万円をリボ払いにして毎月元本1万円相当を返すイメージでも、翌月さらに5万円を利用すれば残高は増えます。毎月の支払額が同程度のままなら、“使った感覚”より借入残高が大きくなりやすいです。」</p><p>「さらに残高に対して手数料が発生するため、追加利用を続けるほど完済が遠のき、総支払額も増えやすくなります。」</p><p>「だから試験だけでなく実生活でも、リボは<strong>月々いくら払うかより、今いくら残っていて総額いくら払うのか</strong>を確認するのが大切です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜分割払いで先に決める代表的なものは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「その買い物についての支払回数です。」</p></div></details><h4>Q2｜リボ払いで追加購入をしても毎月支払額が同程度なら、借金も増えていない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。利用残高は増えることがあり、完済期間や手数料総額が増える可能性があります。」</p></div></details><h4>Q3｜リボ払いで特に確認すべきものは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「毎月額だけでなく、利用残高、手数料率、完済までの期間、総支払額です。」</p></div></details>", "R": "<p>「分割＝買い物ごとに回数固定。リボ＝月々の支払方法を固定し残高を繰越しやすい。リボは月額より残高と総支払額を見る、です。」</p>", "M": "<p>「<strong>分割払いは“回数を決めて終わりを見せる”、リボ払いは“月々をならす代わりに残高と終わりが見えにくくなる”。</strong>」</p>"}}, {"title": "キャッシングと総量規制", "content": {"A": "<h3>A｜要点</h3><p>「先輩、まずキャッシングは<strong>クレジットカード会社や消費者金融などから現金を借りること</strong>です。カードで商品を買うショッピングとは、同じカードを使っていても法律上の性質が違います。」</p><p>「そして総量規制は、個人の借り過ぎを防ぐため、貸金業者からの借入残高が<strong>原則として年収の3分の1を超える新たな貸付けを禁止する</strong>貸金業法上の仕組みです。」</p><p>「大事なのは“1社につき3分の1”ではありません。<strong>貸金業者からの借入れを合計して3分の1</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ総量規制があるのか。返せる額を超えて何社からも借りると、別の会社から借りて返す多重債務に陥りやすくなります。そこで年収という返済能力の目安に対して、貸金業者が貸せる総額へ原則的な上限を設けています。」</p><p>「たとえばクレジットカード会社のキャッシングは“お金の貸付け”なので総量規制の対象です。一方、カードで10万円の家電を買うショッピングは貸金業法上の貸付けではないため、総量規制の対象外です。分割払いやリボ払いのショッピングには別に割賦販売法が関係します。」</p><p>「もう一つ重要なのが銀行です。銀行、信用金庫、信用組合などは貸金業法上の“貸金業者”ではありません。そのため銀行カードローンは<strong>貸金業法の総量規制そのものの対象外</strong>です。ただし“対象外＝年収に関係なく必ず借りられる”ではありません。銀行側の審査・返済能力の確認があります。」</p><p>「また年収3分の1以内なら必ず借りられる、という意味でもありません。3分の1は“ここまでなら貸さなければならない”線ではなく、原則として“これを超える貸付けはできない”上限規制です。」</p><p>「さらに住宅ローンなど総量規制になじまない貸付けには<strong>除外</strong>があり、顧客に一方的に有利な借換えや一定の緊急医療費などには<strong>例外</strong>があります。ですから“どんな借入れも絶対3分の1”ではないんです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「年収300万円のAさんの頭上に、“貸金業者から借りられる原則上限100万円”という一つの大きな箱があると思ってください。」</p><p>「A社から80万円借りたら、箱の80万円分が埋まります。次にB社へ行っても、新しい100万円の箱は出てきません。残っているのは原則20万円分です。」</p><p>「そしてクレジットカードで5万円をキャッシングすれば、その5万円は箱へ入ります。でもカードで5万円の商品をショッピングしただけなら、その金額は総量規制の箱には入りません。」</p><p>「銀行カードローンも、この“貸金業法の3分の1箱”の外側です。つまり<strong>何円借りたかだけでなく、“誰から・どんな契約で借りたか”を見る</strong>制度なんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの年収が300万円なら、総量規制の原則上限は300万円×1/3＝<strong>100万円</strong>です。」</p><p>「すでに消費者金融X社から60万円、クレジットカード会社Y社のキャッシングで20万円借りているなら、対象借入れは合計80万円。原則として新たに貸金業者から借りられる余地は100万円－80万円＝<strong>20万円</strong>です。」</p><p>「ここでY社のカードを使って20万円の商品を買っていても、そのショッピング利用額は総量規制の借入残高には含めません。」</p><p>「またAさんに銀行カードローンがある場合、それは貸金業法上の総量規制の対象外です。ただし、だから安全とか無制限という意味ではありません。総返済負担は当然増えます。」</p><p>「さらに住宅ローンのように総量規制の除外貸付けとされるものもあります。つまり試験では、<strong>年収×1/3を計算する前に、その借入れがそもそも総量規制の対象か</strong>を確認するのが先です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜年収300万円でA社から80万円借りている人は、別の貸金業者B社からさらに100万円まで借りられる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。総量規制は1社ごとではなく貸金業者からの借入れの合計で考えます。原則上限100万円なので、この例で残る枠は20万円です。」</p></div></details><h4>Q2｜クレジットカードのキャッシングとショッピングは、両方とも総量規制の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。現金を借りるキャッシングは対象ですが、商品・サービスを購入するショッピングは貸金業法上の総量規制の対象外です。」</p></div></details><h4>Q3｜銀行カードローンは貸金業法の総量規制の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「対象外です。銀行は貸金業法上の貸金業者ではありません。ただし銀行独自の審査があり、無制限に借りられるという意味ではありません。」</p></div></details>", "R": "<p>「30秒で戻しますよ。①何の話？→現金借入れと借り過ぎ防止。②一番重要？→貸金業者から原則年収3分の1まで。③なぜ？→多重債務・過剰貸付けを防ぐため。④流れ？→年収確認→他社を含む対象借入残高確認→新規貸付けを判断。⑤具体例？→年収300万円なら原則100万円、既に80万円なら残り20万円。⑥間違えやすい？→1社ごとではない、ショッピングは対象外、銀行ローンも貸金業法の総量規制対象外。はい、ここまで一本につながれば大丈夫です。」</p>", "M": "<p>「<strong>キャッシングは現金を借りること、総量規制は貸金業者からの対象借入れを合計して原則年収の3分の1までに抑える仕組み。</strong>」</p>"}}],ch2:[{"title": "公的保険と私的保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、公的保険は社会全体で病気・老齢・失業などを支える基礎保障、私的保険は民間との契約で不足部分を補う保障です。FPでは<strong>公的保障→不足額→私的保険</strong>の順で考えます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「健康保険、国民健康保険、公的年金、介護保険、雇用保険、労災保険などが公的保険です。一定の人を広く制度へ入れ、本人・事業主・公費などで社会的リスクを支えます。」</p><p>「私的保険は生命保険、医療保険、火災保険、自動車保険など。保障額や期間を契約で選べます。」</p><p>「大事なのは二者択一ではないことです。たとえば入院なら、まず健康保険や高額療養費などを確認し、それでも残る費用や収入減を民間保険で補います。“入院費が怖いから、とりあえず大きな医療保険”ではなく、<strong>すでに公的制度で守られている部分を先に引く</strong>んです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「公的保険は社会全体に掛かる大きな屋根、私的保険は自宅に追加する小さな屋根です。まず大屋根がどこまで雨を防ぐか確認し、濡れる部分だけ追加します。」</p>", "D": "<h3>D｜具体例</h3><p>「会社員Aさんが高額治療を受けたとします。まず健康保険で自己負担が抑えられ、高額療養費の対象なら月単位の自己負担にも上限があります。それでも差額ベッド代など公的保障外の負担や収入減が残るなら、民間医療保険等で補う、という順番です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜保険設計で最初に見るものは？</h4><details><summary>答えを見る</summary><div class='answer'><p>公的保障です。その後に不足額を確認します。</p></div></details><h4>Q2｜私的保険は原則何で成立？</h4><details><summary>答えを見る</summary><div class='answer'><p>保険会社等との契約です。</p></div></details><h4>Q3｜公的保険と私的保険は二者択一？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。公的保障を土台に私的保障を上乗せできます。</p></div></details>", "R": "<p>「公的＝基礎保障、私的＝不足補完。公的保障を確認→不足額を確認→必要な私的保険、です。」</p>", "M": "<p>「<strong>公的保険を土台にし、それでも残る個人のリスクを私的保険で補う。</strong>」</p>"}}, {"title": "大数の法則", "content": {"A": "<h3>A｜要点</h3><p>「大数の法則は、観察する人数・件数を十分増やすと偶然のばらつきがならされ、<strong>死亡や事故などの発生率が一定の値に近づいていく</strong>という考え方です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「一人が来年死亡するかは予測できません。でも同じような条件の人を大量に集めると、“全体で何人くらい死亡するか”は個人より予測しやすくなります。」</p><p>「保険会社はこの性質を利用して将来の保険金支払総額を見積もります。先輩、人数を増やせば事故そのものが減るのではありません。<strong>発生率の予測のブレが小さくなる</strong>んです。」</p><p>「だから個人にとっては偶然の大損失を、大集団では統計的に扱える損失へ変えられます。これが保険成立の数学的な土台です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「コインを2回投げれば表が2回でも不思議ではありません。でも1万回投げると表の割合は50%付近へ近づきます。保険も同じで、<strong>個人では偶然、集団では確率</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「死亡率を仮に0.1%とします。10人なら実際に0人か1人かで割合が大きく揺れます。しかし100万人なら期待される規模は約1,000人。特定の誰かは分からなくても、集団全体の支払規模は見積もりやすくなります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜特定の人の死亡時期を当てる法則？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。多数を観察したときの集団の発生率を安定して予測しやすくする考え方です。</p></div></details><h4>Q2｜人数が増えると事故自体が減る？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。減るのは発生率の予測のばらつきです。</p></div></details><h4>Q3｜保険との関係は？</h4><details><summary>答えを見る</summary><div class='answer'><p>集団全体で将来必要になる保険金支払額を推計しやすくなります。</p></div></details>", "R": "<p>「多数→発生率が安定→支払額を予測しやすい。事故を減らす法則ではありません。」</p>", "M": "<p>「<strong>大数の法則＝個人では読めない偶然も、大集団なら発生率を予測しやすくなる。</strong>」</p>"}}, {"title": "収支相等の原則", "content": {"A": "<h3>A｜要点</h3><p>「収支相等の原則は、<strong>保険集団全体で集める保険料と、支払う保険金・給付金や必要経費等が釣り合うようにする</strong>考え方です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「前の大数の法則で事故件数を予測できても、必要な支払額が10億円なのに保険料を5億円しか集めなければ制度は続きません。」</p><p>「そこで死亡・事故の見込み、運用収益、事業費などを考慮して保険料を設計します。」</p><p>「ただし“一人が払った保険料＝その人が受け取る保険金”ではありません。事故なしで受取0円の人もいれば、少ない保険料で大きな保険金を受け取る人もいます。見るのは<strong>個人ではなく集団全体</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「1000人で共同財布を作ります。来年、保険金と運営費で全体1億円必要なら、その支出を賄えるよう共同財布へお金を集めます。個人ごとの収支は凸凹でも、財布全体を釣り合わせるんです。」</p>", "D": "<h3>D｜具体例</h3><p>「1万人中100人に100万円ずつ支払うと予測すれば、保険金総額は1億円。経費や運用を無視した単純例なら、平均1万円ずつ集めれば1億円になります。<strong>大数の法則で支出を予測→収支相等で必要な収入を設計</strong>、このつながりです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜個人の払込額と受取額を同じにする原則？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。保険集団全体の収支を均衡させる原則です。</p></div></details><h4>Q2｜大数の法則との関係は？</h4><details><summary>答えを見る</summary><div class='answer'><p>大数の法則で支出を予測し、その支出に見合う保険料収入を設計します。</p></div></details><h4>Q3｜事故に遭わず保険金0なら原則に反する？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。個人ではなく集団全体で判断します。</p></div></details>", "R": "<p>「集団全体の保険料収入と保険金・経費等の支出を均衡。個人単位ではありません。」</p>", "M": "<p>「<strong>収支相等の原則＝保険集団全体の収入と支出を釣り合わせる原則。</strong>」</p>"}}, {"title": "クーリングオフ", "content": {"A": "<h3>A｜要点</h3><p>「保険のクーリングオフは、申込み後でも一定期間内なら<strong>申込みの撤回または契約の解除</strong>ができる制度です。生命保険では原則、申込日とクーリングオフについて記載した書面を受け取った日の<strong>遅い方から、その日を含めて8日以内</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「保険は長期間・高額になり得る契約なので、その場の勢いだけで決めず、後から冷静に考える機会を確保します。」</p><p>「“申込日の翌日から8日”ではありません。二つの日付を比べて遅い方が基準です。また保険会社が8日より長い期間を設ける場合もあります。」</p><p>「ただし保険期間1年以下の契約など、法令上クーリングオフできない場合があります。クーリングオフ対象外でも、通常の解約まで絶対できないという意味ではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「契約入口のすぐ近くに、短期間だけ開いている“戻る扉”です。ただし扉には期限があり、契約の種類によってはその扉自体が使えません。」</p>", "D": "<h3>D｜具体例</h3><p>「10月1日に申込み、所定書面を10月3日に受け取ったなら、遅い10月3日が1日目です。逆に書面を9月30日に受け取り、10月1日に申し込んだなら10月1日が基準です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜必ず申込日から数える？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。申込日と所定書面受領日の遅い方が基準です。</p></div></details><h4>Q2｜生命保険の原則期間は？</h4><details><summary>答えを見る</summary><div class='answer'><p>原則8日以内です。</p></div></details><h4>Q3｜クーリングオフ対象外なら通常解約も不可？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。クーリングオフと通常の解約は別制度です。</p></div></details>", "R": "<p>「遅い日を選ぶ→その日を含め原則8日。適用除外あり。通常解約とは別です。」</p>", "M": "<p>「<strong>クーリングオフ＝契約直後に一定期間だけ使える撤回の仕組み。</strong>」</p>"}}, {"title": "保険契約者保護機構", "content": {"A": "<h3>A｜要点</h3><p>「保険会社が破綻しても契約が即ゼロになるわけではありません。保険契約者保護機構は、<strong>契約移転や資金援助などによって契約者を保護する安全網</strong>です。生命保険と損害保険にはそれぞれ別の保護機構があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「長期契約の途中で会社が破綻したとき、救援保険会社への契約移転などを支援します。ただし“契約内容を100%そのまま国が保証する制度”ではありません。」</p><p>「生命保険では原則として、破綻時点の<strong>責任準備金等の90%</strong>が補償の基礎です。ここを“死亡保険金額の90%”と読んではいけません。」</p><p>「責任準備金は将来の保険金等の支払いに備えて積み立てるお金です。破綻処理で予定利率などの契約条件が変更されると、保険金額や解約返戻金が減る場合があります。」</p><p>「損害保険は一律90%ではなく、保険種類などで扱いが異なります。自賠責保険や地震保険など100%補償されるものもあります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険会社という橋が壊れたとき、契約者が谷へ落ちないよう別の橋へつなぐ安全網です。ただし壊れる前と完全に同じ状態へ戻す魔法ではありません。」</p>", "D": "<h3>D｜具体例</h3><p>「死亡保険金1,000万円の生命保険だから“900万円は必ず保証”と計算するのは誤りです。90%の基準は原則、責任準備金等です。問題では<strong>生命保険か損害保険か、どの保険種類か</strong>を先に確認します。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜死亡保険金額の90%を必ず保証？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。生命保険の原則90%は責任準備金等についての基準です。</p></div></details><h4>Q2｜生命保険と損害保険で同じ一つの機構？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。それぞれ別の契約者保護機構があります。</p></div></details><h4>Q3｜破綻すると契約は必ず消滅？</h4><details><summary>答えを見る</summary><div class='answer'><p>いいえ。契約移転や資金援助などで契約者保護が図られます。</p></div></details>", "R": "<p>「破綻時の安全網。生保・損保で別。生保の90%は保険金額ではなく原則責任準備金等。100%保証制度ではありません。」</p>", "M": "<p>「<strong>保険契約者保護機構＝保険会社破綻時に契約継続を支える安全網。</strong>」</p>"}}, {"title": "少額短期保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、少額短期保険は、その名の通り<strong>保険金額が少額で、保険期間も短期に限定された保険</strong>です。“ミニ保険”と呼ばれることもあります。」</p><p>「一般の生命保険会社・損害保険会社とは別に、財務局へ登録した<strong>少額短期保険業者</strong>が扱います。」</p><p>「生命保険・傷害疾病保険は原則1年、損害保険は原則2年までなど期間に上限があり、1人の被保険者について引き受けられる保険金額にも法令上の上限があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ“少額・短期”に制限するのか。少額短期保険業者は、大手保険会社と同じ免許制度ではなく登録制で参入できる代わりに、扱えるリスクを小さく限定しているからです。」</p><p>「たとえばペット保険、賃貸住宅の家財保険、葬儀費用向け保険など、特定のニーズに絞った商品があります。」</p><p>「そして試験で重要なのが契約者保護です。少額短期保険業者は、前項で学んだ<strong>保険契約者保護機構の対象ではありません</strong>。その代わり供託金など別の仕組みがあります。」</p><p>「また、少額短期保険料は生命保険料控除や地震保険料控除の対象にならないのが原則です。商品名に“生命保険”のような言葉があっても、一般の生命保険会社の商品と税制まで同じとは限りません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「普通の保険会社が“大型バス”なら、少額短期保険業者は“小型の送迎車”です。大型バスほど大きな保障や長期間の契約は扱えませんが、狭いニーズへ機動的に対応できます。」</p><p>「その代わり、乗せられる人数・距離・荷物に制限がある。これが<strong>少額＋短期</strong>という規制です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが賃貸住宅へ入居し、2年間の家財・賠償リスクを補う少額短期保険へ加入したとします。こうした限定的な期間・目的は少額短期保険と相性があります。」</p><p>「一方、“30年間、数千万円規模の死亡保障を持ちたい”というニーズを、少額短期保険業者が通常の生命保険会社と同じように自由に引き受けることはできません。」</p><p>「つまり安い保険という意味ではなく、<strong>事業者が引き受けられる保障額と期間そのものが制度上限定されている保険</strong>なんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜少額短期保険業者は保険契約者保護機構の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。少額短期保険業者は保険契約者保護機構の対象外です。」</p></div></details><h4>Q2｜“少額短期”とは単に保険料が安いという意味？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保険金額や保険期間など、引き受けられる保障そのものに法令上の制限があります。」</p></div></details><h4>Q3｜少額短期保険料は一般の生命保険料控除の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として対象になりません。」</p></div></details>", "R": "<p>「少額・短期に限定、登録制の少額短期保険業者、保護機構対象外。普通の保険会社の“小型版”とだけ覚えず、制度上の制限まで押さえます。」</p>", "M": "<p>「<strong>少額短期保険＝保障額と期間を小さく限定する代わりに、特定ニーズへ対応する登録制の保険事業。</strong>」</p>"}}, {"title": "ソルベンシー・マージン比率", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>ソルベンシー・マージン比率</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。ソルベンシー・マージン比率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。ソルベンシー・マージン比率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、ソルベンシー・マージン比率の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>ソルベンシー・マージン比率を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。ソルベンシー・マージン比率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ソルベンシー・マージン比率 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "保険法と保険業法", "content": {"A": "<h3>A｜要点</h3><p>「先輩、名前が似ていますが役割が違います。<strong>保険法は“保険契約そのもの”のルール</strong>、<strong>保険業法は“保険会社や募集・監督”のルール</strong>です。」</p><p>「一言なら、<strong>契約者と保険会社の契約関係＝保険法、保険会社を事業者として規制＝保険業法</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「保険法は、保険契約の成立、告知義務、保険給付、解除など、契約当事者間の基本ルールを定めます。生命保険・損害保険・傷害疾病定額保険などの契約に関わります。」</p><p>「一方の保険業法は、保険会社の免許、業務範囲、健全性、保険募集、情報提供、監督などを規律します。つまり金融庁が保険会社を監督する枠組みはこちらです。」</p><p>「なぜ二つ必要かというと、“Aさんと保険会社の契約を公平にするルール”と、“そもそも保険会社が健全・適切に事業を行うためのルール”では対象が違うからです。」</p><p>「この後出てくる告知義務は保険法上の重要論点。保険会社の募集人が適切に説明・募集する規制は保険業法側、と整理すると見えやすいです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「サッカーで考えましょう。保険法は“試合中に選手同士が守るルール”。保険業法は“クラブがリーグへ参加する資格、経営、審判・運営側からの監督ルール”です。」</p><p>「どちらも保険を規律しますが、<strong>見ている対象が契約なのか、事業者・募集なのか</strong>が違います。」</p>", "D": "<h3>D｜具体例</h3><p>「契約者Aさんが申込み時に重要事項を告知しなかったため、保険会社が契約を解除できるか。これは契約関係なので保険法が中心です。」</p><p>「一方、保険会社Xが免許を受けずに保険業を営めるか、募集人がどのような規制を受けるか、保険会社を金融庁がどう監督するか。こちらは保険業法です。」</p><p>「問題文を読んだら、“これは<strong>契約の中の話か、会社・販売・監督の話か</strong>”と分類してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜告知義務など契約当事者間の基本ルールは主にどちら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険法です。」</p></div></details><h4>Q2｜保険会社の免許や監督、募集規制は主にどちら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険業法です。」</p></div></details><h4>Q3｜二つの違いを一言で？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険法＝契約、保険業法＝事業・募集・監督です。」</p></div></details>", "R": "<p>「保険法＝契約の中。保険業法＝会社・募集・監督。名前ではなく“誰を規律しているか”で分けます。」</p>", "M": "<p>「<strong>保険法は保険契約のルール、保険業法は保険会社・募集・監督のルール。</strong>」</p>"}}, {"title": "解約返戻金", "content": {"A": "<h3>A｜要点</h3><p>「解約返戻金は、保険契約を途中で解約したときに、契約内容や経過期間などに応じて保険会社から契約者へ戻ることがあるお金です。」</p><p>「重要なのは、<strong>払った保険料がそのまま貯金として戻るわけではない</strong>こと。契約初期は払込保険料総額を大きく下回ったり、商品によっては解約返戻金がほとんど・まったくない場合もあります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「保険料は全部が積立金になるわけではありません。死亡・疾病などの保障に使う部分、契約管理や募集などの費用に使う部分、将来に備えて積み立てる部分などがあります。」</p><p>「そのため“10万円払ったから解約すれば10万円戻る”とは限りません。特に契約初期は費用の影響などもあり、解約返戻金が払込総額より少ないのが一般的です。」</p><p>「終身保険や養老保険など貯蓄性を持つ商品では解約返戻金があることが多い一方、定期保険など保障を重視した商品では少ない、またはない場合があります。」</p><p>「また“低解約返戻金型”は、保険料払込期間中などの解約返戻金を意図的に低く抑える代わりに保険料を割安にする設計です。後で専用項目として出てきます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「毎月1万円を“保険の箱”へ入れている場面です。でも箱の中で1万円全部が貯金棚へ置かれるわけではありません。」</p><p>「一部は保障の共同財布へ、一部は制度運営へ、一部が将来のための積立へ回ります。途中で箱を閉じたとき、その契約の積立状況などから戻るのが解約返戻金です。」</p><p>「だから<strong>保険＝銀行預金</strong>として考えると間違えます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが終身保険へ5年間で合計100万円の保険料を払ったとします。5年後の解約返戻金が契約上70万円なら、解約時に戻るのは70万円で、100万円ではありません。」</p><p>「一方、長く継続することで返戻率が上がる設計もあります。ただし“いつか必ず払込総額を超える”と全商品について言うことはできません。」</p><p>「見るべき数字は<strong>払込保険料総額、現在の解約返戻金、将来の返戻率</strong>。この三つを混同しないでください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜解約返戻金は払込保険料の全額が必ず戻る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。契約内容・経過期間等により、払込総額を下回ることがあります。」</p></div></details><h4>Q2｜すべての保険に必ず解約返戻金がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。商品によって少額またはない場合があります。」</p></div></details><h4>Q3｜なぜ払った保険料全部が積み立てられない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険料には保障のための部分や事業運営費等に充てられる部分も含まれるためです。」</p></div></details>", "R": "<p>「途中解約で戻る可能性のあるお金。ただし保険料＝預金ではない。商品・期間で返戻額が違います。」</p>", "M": "<p>「<strong>解約返戻金＝途中解約時に契約の積立状況等に応じて戻るお金で、払込保険料の返金そのものではない。</strong>」</p>"}}, {"title": "生死混合保険", "content": {"A": "<h3>A｜要点</h3><p>「生死混合保険は、<strong>死亡した場合の保障と、一定期間生存した場合の保障を組み合わせた保険</strong>です。」</p><p>「代表例が<strong>養老保険</strong>。保険期間中に死亡すれば死亡保険金、満期まで生存すれば満期保険金が支払われます。」</p><p>「“死亡しても、生きて満期を迎えても給付がある”ため、死亡保険と生存保険を組み合わせた形です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「生命保険は大きく、死亡を保険事故とする死亡保険、生存を条件とする生存保険、その二つを組み合わせる生死混合保険に整理できます。」</p><p>「定期保険は一定期間内の死亡保障が中心で、満期まで生存しても通常は満期保険金がありません。一方、養老保険では満期まで生存すると満期保険金があります。」</p><p>「つまり生死混合保険は、死亡保障だけでなく貯蓄性も持たせやすい。その分、同程度の死亡保障だけを比べれば、掛け捨て型の定期保険より保険料が高くなるのが一般的です。」</p><p>「先輩、“生死混合”は死亡と生存が同時に起こるという意味ではありませんよ。<strong>保険期間中に死亡した場合と、満期まで生存した場合という二つの出口を一つの契約で保障する</strong>という意味です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一本道の最後に二つの出口があると思ってください。」</p><p>「途中で死亡した場合は左の出口から死亡保険金。満期まで生存した場合は右の出口から満期保険金。」</p><p>「定期保険なら右の“生存出口”には通常まとまった満期保険金がありません。でも養老保険では両方の出口に給付があります。これが<strong>死亡＋生存の混合</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが保険期間20年、死亡保険金500万円、満期保険金500万円の養老保険へ加入したとします。」</p><p>「10年後にAさんが死亡すれば、契約条件に従って死亡保険金500万円が受取人へ支払われます。」</p><p>「Aさんが20年間生存して満期を迎えれば、今度は満期保険金500万円が支払われます。」</p><p>「同じ500万円でも、<strong>死亡という保険事故で受け取るのか、満期生存という条件で受け取るのか</strong>が違います。税金を考えるときには契約者・被保険者・受取人の関係まで確認することになります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜生死混合保険の代表例は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「養老保険です。」</p></div></details><h4>Q2｜養老保険で満期まで生存したら何も受け取れない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。契約に基づき満期保険金が支払われます。」</p></div></details><h4>Q3｜定期保険との大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「定期保険は一定期間の死亡保障が中心ですが、生死混合保険は死亡保障と満期生存時の保障を組み合わせます。」</p></div></details>", "R": "<p>「死亡したら死亡保険金、生存して満期なら満期保険金。代表は養老保険。二つの出口を一契約に持つ保険です。」</p>", "M": "<p>「<strong>生死混合保険＝死亡保障と満期まで生存した場合の保障を組み合わせた保険。</strong>」</p>"}}, {"title": "予定死亡率・予定利率・予定事業費率", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>予定死亡率・予定利率・予定事業費率</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。予定死亡率・予定利率・予定事業費率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。予定死亡率・予定利率・予定事業費率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、予定死亡率・予定利率・予定事業費率の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>予定死亡率・予定利率・予定事業費率を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。予定死亡率・予定利率・予定事業費率は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 予定死亡率・予定利率・予定事業費率 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "純保険料と付加保険料", "content": {"A": "<h3>A｜要点</h3><p>「契約者が払う保険料は、大きく<strong>純保険料＋付加保険料</strong>に分けて考えます。」</p><p>「純保険料は将来の保険金・給付金などの支払いに充てる部分。付加保険料は保険会社の事業運営に必要な経費に充てる部分です。」</p><p>「さらに純保険料は、死亡保険金などに備える<strong>危険保険料</strong>と、生存保険金などに備える<strong>貯蓄保険料</strong>に分けて説明されます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先ほどの三つの予定基礎とつなげます。予定死亡率や予定利率をもとに、将来の保険金等を賄うための純保険料を計算します。そして予定事業費率をもとに、会社運営に必要な付加保険料を考えます。」</p><p>「だから“毎月1万円払っているから、1万円全部が自分のために積み立てられている”わけではありません。保障を共同で支える部分と、制度を運営する費用があります。」</p><p>「この構造は、前に出てきた解約返戻金が払込保険料総額より少なくなる理由の一つにもつながります。払込保険料の全部が積立部分ではないからです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「毎月1万円を保険会社へ渡すと、入口で二つの箱に分かれるイメージです。」</p><p>「一つは“保険金を払うための共同財布”＝純保険料。もう一つは“契約管理・募集・事務を動かす財布”＝付加保険料です。」</p><p>「先輩、自分名義の貯金箱へ1万円丸ごと入っているわけではありませんよ。」</p>", "D": "<h3>D｜具体例</h3><p>「説明用に、月1万円の保険料のうち8,500円が純保険料、1,500円が付加保険料だと仮定します。」</p><p>「8,500円側は保険金・給付金等の財源へ、1,500円側は保険会社の運営費へ回ります。実際の内訳は商品ごとに異なります。」</p><p>「だから早期解約時に“10万円払ったのだから10万円返して”とはならないんです。<strong>保険料＝純保険料＋付加保険料</strong>という構造を先に理解してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜保険金・給付金等の支払いに充てる部分は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「純保険料です。」</p></div></details><h4>Q2｜保険会社の事業運営費に充てる部分は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「付加保険料です。」</p></div></details><h4>Q3｜払った保険料は全部自分の積立金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保障の財源や事業運営費などに分かれます。」</p></div></details>", "R": "<p>「営業保険料を大きく純＋付加へ分解。純＝保障の財源、付加＝運営経費。解約返戻金の理解にもつながります。」</p>", "M": "<p>「<strong>保険料＝保険金等を支える純保険料＋会社運営を支える付加保険料。</strong>」</p>"}}, {"title": "剰余金と配当金", "content": {"A": "<h3>A｜要点</h3><p>「保険料は“予定”を使って計算します。でも実際の死亡者数・運用収益・事業費は予定どおりとは限りません。その<strong>予定と実績の差から生じる余りが剰余金</strong>です。」</p><p>「有配当保険では、その剰余金の一部を契約者へ還元するものが<strong>契約者配当金</strong>です。」</p><p>「配当金は預金利息のように最初から確定したお金ではなく、原則として保証されません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「予定死亡率より実際の死亡率が低ければ、保険金支払いが予定より少なくなり差益が生じます。これが<strong>死差益</strong>です。」</p><p>「予定利率より実際の運用利回りが高ければ<strong>利差益</strong>、予定事業費より実際の事業費が少なければ<strong>費差益</strong>が生じます。」</p><p>「逆方向なら“益”ではなく差損になることもあります。つまり剰余金は、保険会社が最初から余分に取って配るおまけではなく、予定と実績がずれた結果として生じます。」</p><p>「その剰余金を契約者へどう還元するかは、契約している保険が有配当か無配当かなどで違います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「旅行の幹事を想像してください。参加者から“交通費10万円、会場費5万円、雑費2万円くらい”と予定して17万円集めます。」</p><p>「実際には交通費9万円、会場費4万5,000円、雑費1万5,000円で済みました。予定より余ったお金がありますよね。」</p><p>「保険では死亡・運用・経費について予定を置き、実績との差から剰余が生じます。その一部を有配当契約へ戻すのが配当金です。」</p>", "D": "<h3>D｜具体例</h3><p>「予定では保険金支払い100億円を見込んでいたのに、実際は95億円だったとします。他の条件を無視すれば、死亡関係では5億円分、予定より支出が少ない方向です。」</p><p>「また予定より運用が好調、事業費も少なかったなら、それぞれ利差・費差の面でもプラスが生じ得ます。」</p><p>「ただし会社全体の剰余金がそのまま全額、各契約者へ均等配分されるわけではありません。契約種類などに応じて配当が決まり、<strong>配当がゼロになることもあります</strong>。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜予定死亡率より実際の死亡率が低く、支払いが予定より少ないことで生じる利益は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「死差益です。」</p></div></details><h4>Q2｜予定より実際の運用利回りが高い場合の利益は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「利差益です。」</p></div></details><h4>Q3｜契約者配当金は必ず受け取れる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。配当は原則保証されず、実績等によってゼロになる場合もあります。」</p></div></details>", "R": "<p>「予定と実績の差→剰余。死亡＝死差、運用＝利差、経費＝費差。有配当保険では剰余の一部を配当として還元します。」</p>", "M": "<p>「<strong>剰余金は予定と実績の差から生まれ、配当金はその一部を契約者へ還元するもの。</strong>」</p>"}}, {"title": "有配当保険・無配当保険・準有配当保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>有配当保険・無配当保険・準有配当保険</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 有配当保険・無配当保険・準有配当保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。有配当保険・無配当保険・準有配当保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 有配当保険・無配当保険・準有配当保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。有配当保険・無配当保険・準有配当保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、有配当保険・無配当保険・準有配当保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 有配当保険・無配当保険・準有配当保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>有配当保険・無配当保険・準有配当保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 有配当保険・無配当保険・準有配当保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。有配当保険・無配当保険・準有配当保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 有配当保険・無配当保険・準有配当保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 有配当保険・無配当保険・準有配当保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "告知義務", "content": {"A": "<h3>A｜要点</h3><p>「告知義務は、保険契約を申し込むとき、保険会社が質問した<strong>重要な事項について事実を正しく告げる義務</strong>です。」</p><p>「現在の保険法では、契約者側が自分で“重要そうなことを全部探して申告する”というより、<strong>保険会社が告知を求めた事項に答える質問応答義務</strong>として整理されています。」</p><p>「故意または重大な過失で重要事項を告知しなかったり、事実と違う告知をすると、一定の場合に契約を解除されることがあります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ告知が必要か。健康状態や職業などで死亡・入院のリスクが違うのに、全員を同条件で引き受ければ、正しく告知した人との公平が崩れるからです。」</p><p>「たとえば保険会社が“過去5年以内に所定の病気で診察・治療を受けましたか”と質問したなら、その質問に事実どおり答えます。自分で勝手に“これは軽い病気だから言わなくていい”と判断してはいけません。」</p><p>「一方、聞かれていないことを無制限に自発申告する義務ではありません。ここが昔のイメージと違うところです。」</p><p>「告知義務違反があっても、何でも即座に保険金不払いになるわけではありません。解除要件、解除できる期間、保険事故と告知しなかった事実との因果関係などを個別に判断します。」</p><p>「また募集人に口頭で話しただけでは正式な告知にならないことがあります。告知書や保険会社指定の方法で正確に回答するのが基本です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険会社が入口で健康状態などの“チェックリスト”を渡す場面です。」</p><p>「先輩の仕事は、チェックリストに書かれた質問へ正直に答えること。“この情報は不利だから隠そう”も、“聞かれてないけど人生の病歴を全部作文しよう”も違います。」</p><p>「保険会社はその回答を材料に、通常条件で引き受けるか、条件を付けるか、引受けないかを判断します。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが生命保険へ申し込む際、“過去○年以内に所定の入院・手術をしましたか”と質問され、実際には該当する入院歴があるのに、保険に入りたいから故意に“いいえ”と答えたとします。」</p><p>「これは告知義務違反となり得て、要件を満たせば保険会社は契約を解除できる可能性があります。」</p><p>「逆に、Aさんが保険会社から尋ねられていない事項を自分から言わなかった、というだけで直ちに告知義務違反になるわけではありません。」</p><p>「だから判断手順は、<strong>何を質問されたか→事実は何か→故意・重大な過失があるか→解除等の要件を満たすか</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜告知義務とは、自分が重要と思う情報を無制限に全部申告する義務？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。現在は原則、保険会社が告知を求めた重要事項へ正しく答える質問応答義務です。」</p></div></details><h4>Q2｜病歴を故意に偽れば必ず何の問題になる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「告知義務違反となり得ます。要件を満たせば契約解除などにつながる可能性があります。」</p></div></details><h4>Q3｜募集人へ口頭で話せば常に正式な告知になる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必ずしもなりません。保険会社が指定する告知書・方法等で正確に告知することが重要です。」</p></div></details>", "R": "<p>「保険会社の質問に正確に答える義務。目的は危険度を正しく判断し契約者間の公平を守ること。故意・重大な過失の不告知等は解除につながり得ます。」</p>", "M": "<p>「<strong>告知義務＝保険会社が尋ねた重要事項に、事実を正しく答える義務。</strong>」</p>"}}, {"title": "責任開始日", "content": {"A": "<h3>A｜要点</h3><p>「先輩、生命保険は申込書を書いた瞬間から必ず保障されるわけではありません。<strong>保険会社が保険金・給付金を支払う責任を開始する時点</strong>を責任開始期といい、その日を責任開始日と考えます。」</p><p>「一般的な生命保険では、<strong>申込み・告知（または診査）・第1回保険料の払込み</strong>という必要な手続きがそろった時点が基準になります。ただし現在は第1回保険料の払込方法など商品ごとに取扱いが異なるので、約款上の責任開始条件を確認します。」</p><p>「そして<strong>責任開始と承諾は同じ時点とは限りません</strong>。ここが大事です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば申込みと告知を済ませた後、保険会社が数日かけて審査し、後日承諾することがあります。それでは承諾までの間に保険事故が起きたらどうするのか、という問題が出ます。」</p><p>「所定の責任開始条件を満たしたうえで保険会社が契約を承諾すれば、一般に責任開始時点までさかのぼって保障が始まる形になります。」</p><p>「逆に、申込書を書いただけで告知等が終わっていないなら、“申し込んだからもう保障中”とは限りません。」</p><p>「なお商品によっては、がん保障のように責任開始からさらに一定の待ち期間を設けるものがあります。通常の死亡保障の責任開始と、特定保障の開始日を混同しないでください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険の入口に三つのチェックポイントがあると思ってください。『申込み』『告知・診査』『必要な保険料手続き』です。」</p><p>「必要条件がそろった地点に“保障スタート線”があります。その後ろで保険会社が契約を審査して承諾する場合がある。」</p><p>「つまり<strong>契約成立の判断と、保障がどこまでさかのぼって始まるか</strong>は分けて考えるんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが4月1日に申込み、4月2日に告知、所定の第1回保険料手続きを4月3日に完了し、保険会社が4月8日に承諾したと仮定します。」</p><p>「その商品の約款上、三つの手続きがそろった時点を責任開始とするなら、保障の基準は4月3日になります。4月8日の承諾日だけを見て“そこから保障開始”と判断するのは違います。」</p><p>「ただし実際の責任開始条件は商品・払込方法で違います。試験問題では、問題文で示された条件を優先してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜申込書を書けば必ずその瞬間から保障開始？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。申込みだけでなく、告知・診査や所定の保険料手続きなど、約款上の責任開始条件を満たす必要があります。」</p></div></details><h4>Q2｜責任開始日と保険会社の承諾日は必ず同じ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必ずしも同じではありません。承諾後、所定の責任開始時点へさかのぼって保障される形があります。」</p></div></details><h4>Q3｜すべての保障が責任開始と同時に必ず始まる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。がん保障など、商品によって別途待ち期間を設ける場合があります。」</p></div></details>", "R": "<p>「①保障義務が始まる時点。②申込み・告知等・所定の保険料手続き。③承諾日とは必ずしも同じでない。④商品ごとの約款確認。⑤特定保障には待ち期間も。⑥“申込日＝保障開始”と決めつけません。」</p>", "M": "<p>「<strong>責任開始＝保険会社の保障責任が始まる時点で、申込日や承諾日と単純に同一とは限らない。</strong>」</p>"}}, {"title": "保険料の払込猶予", "content": {"A": "<h3>A｜要点</h3><p>「保険料の払込期月に支払えなかったからといって、通常は翌日に即失効するわけではありません。<strong>一定期間、払込みを待ってもらえる期間</strong>が払込猶予期間です。」</p><p>「猶予期間内に保険料を払えば契約を継続できます。猶予期間を過ぎても払わず、自動振替貸付なども利用できなければ、契約は失効することがあります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「保険は長期契約ですから、口座残高不足など一度の支払ミスだけで即座に保障を失わせるのは厳しすぎます。そこで払込期月の後に猶予期間を置きます。」</p><p>「月払契約では、一般に払込期月の翌月末までなどの猶予期間を設ける商品が多いですが、具体的な期限は契約・約款で確認します。半年払・年払などでは扱いが異なる場合があります。」</p><p>「ここで重要なのは、<strong>払込期月と猶予期間は別</strong>ということ。期月を過ぎた瞬間に失効ではありません。しかし猶予期間まで放置してよい、という意味でもありません。」</p><p>「猶予期間を過ぎた後、解約返戻金のある契約では次に出てくる自動振替貸付が働く場合があります。それもできなければ失効へ進みます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「電車のドアが閉まる前に少し待ってくれる時間だと思ってください。払込期月が本来の乗車時間、猶予期間が“まだ乗れますよ”という最後の待機時間です。」</p><p>「でも猶予期間も過ぎればドアは閉まる。そこから先は自動振替貸付や失効という別の処理へ進みます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの月払保険料の払込期月が6月で、口座残高不足により引き落とせなかったとします。」</p><p>「約款上、翌月末までが猶予期間なら、7月末までに所定の方法で払えば契約を維持できます。」</p><p>「7月末も過ぎ、保険料が未払いのままなら、自動振替貸付が適用される契約ではそれが働く可能性があります。適用できなければ失効につながります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜払込期月に払えなければ翌日即失効？</h4><details><summary>答えを見る</summary><div class='answer'><p>「通常は違います。所定の払込猶予期間があります。」</p></div></details><h4>Q2｜猶予期間内に支払えば？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約を継続できます。」</p></div></details><h4>Q3｜猶予期間後も未払いなら必ず即失効？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約によっては自動振替貸付が適用される場合があります。適用できない場合などには失効につながります。」</p></div></details>", "R": "<p>「期月に未払い→猶予期間→なお未払い→自動振替貸付の可否→失効。この順番です。」</p>", "M": "<p>「<strong>払込猶予＝保険料の支払期日を過ぎても、直ちに失効させず払込みを待つ期間。</strong>」</p>"}}, {"title": "自動振替貸付制度と契約者貸付制度", "content": {"A": "<h3>A｜要点</h3><p>「名前が似ていますが、目的が違います。<strong>自動振替貸付</strong>は未払い保険料を保険会社が自動的に立て替えて契約失効を防ぐ仕組み。<strong>契約者貸付</strong>は契約者が申し込み、解約返戻金の一定範囲内でお金を借りる仕組みです。」</p><p>「どちらも一般に解約返戻金を基礎とする貸付けなので、利息が付きます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「自動振替貸付では、払込猶予期間が過ぎても保険料が払われていないとき、利用できる解約返戻金があれば、その範囲内で保険会社が保険料を立て替えます。契約をすぐ失効させないための仕組みです。」</p><p>「契約者貸付は違います。契約者自身が“現金が必要なので、この契約を担保のようにして借りたい”と申し込みます。借りられる額は解約返戻金の一定範囲内で、商品・会社によって異なります。」</p><p>「どちらも“自分の積立金を引き出しただけ”ではなく<strong>貸付け</strong>です。だから利息が発生します。貸付元利金が膨らむと、解約時や保険金支払時に差し引かれたり、契約維持に影響することがあります。」</p><p>「なお、解約返戻金がない・少ない保険では利用できないことがあります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険契約の中に“解約返戻金という担保になる貯水槽”があるとします。」</p><p>「保険料が払えないとき、保険会社がそこを基準に自動で水を借りて保険料へ回すのが自動振替貸付。」</p><p>「契約者が“生活費として水を貸してください”と自分から頼むのが契約者貸付です。」</p><p>「同じ貯水槽を背景にしていますが、<strong>目的と開始方法</strong>が違います。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの保険料が月1万円。猶予期間を過ぎても未払いで、自動振替貸付が使える契約なら、保険会社が貸付けとして保険料を立て替え、契約を継続させる場合があります。」</p><p>「一方Aさんが急に30万円必要になり、解約返戻金が十分ある契約について自ら貸付けを申し込む。こちらが契約者貸付です。」</p><p>「前者は<strong>保険料を守るため自動</strong>、後者は<strong>現金需要のため本人が申込み</strong>。ここを対比してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜未払い保険料を自動的に立て替えるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「自動振替貸付です。」</p></div></details><h4>Q2｜契約者が自分から申し込み現金を借りるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約者貸付です。」</p></div></details><h4>Q3｜貸付けなので利息は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として利息が付きます。単なる積立金の引出しではありません。」</p></div></details>", "R": "<p>「自動振替＝未払保険料を立替え、失効防止。契約者貸付＝本人が現金を借りる。共通点は解約返戻金を基礎とする貸付けで利息あり。」</p>", "M": "<p>「<strong>自動振替は保険料のため自動、契約者貸付は現金のため本人が申し込む。</strong>」</p>"}}, {"title": "契約の失効と復活", "content": {"A": "<h3>A｜要点</h3><p>「<strong>失効</strong>は、保険料未払いなどによって契約の効力が失われ、保障がなくなっている状態です。<strong>復活</strong>は、失効した契約を所定の条件を満たして元の契約へ戻す手続きです。」</p><p>「復活は自動ではありません。一般に<strong>一定期間内の申込み、健康状態等の告知・診査、未払保険料等の払込み</strong>が必要で、保険会社の承諾を受けます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「払込猶予期間を過ぎ、自動振替貸付も使えないなどの場合、契約は失効することがあります。失効中は原則として保障がありません。」</p><p>「でも失効した瞬間に必ず新規契約しか選べないわけではありません。約款所定の復活可能期間内なら、復活を申し込める場合があります。」</p><p>「なぜもう一度告知が必要なのか。失効中に健康状態が悪化しているかもしれないからです。保険会社から見れば、以前と同じ危険度とは限りません。」</p><p>「そのため復活を申し込んでも必ず承諾されるわけではありません。また復活可能期間や必要な払込額などは契約によって異なります。」</p><p>「“復活”と“新しい保険へ入り直す”の違いも重要です。復活は原則として<strong>元の契約を再び有効にする</strong>手続きです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「電気が止まった家を想像してください。失効は契約という家自体が消えたのではなく、電気が止まり保障の明かりが消えている状態です。」</p><p>「復活はブレーカーを勝手に上げるのではありません。未払いを整理し、現在の状態を確認してもらい、保険会社の承諾を得て明かりを戻します。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが保険料を払わず、猶予期間も過ぎて契約が失効したとします。2か月後、“やっぱり保障が必要だ”と思って保険会社へ連絡しました。」</p><p>「復活可能期間内なら申込みをし、必要な告知を行い、未払保険料等を納め、保険会社が承諾すれば復活できます。」</p><p>「しかし失効中に重大な病気が判明していれば、審査の結果、復活できない可能性があります。<strong>お金を払えば必ず元通り</strong>ではありません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜失効中も死亡保障はそのまま続く？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。失効中は原則として保障がありません。」</p></div></details><h4>Q2｜未払保険料を払えば無条件で復活する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。告知・診査など所定の手続きと保険会社の承諾が必要です。」</p></div></details><h4>Q3｜復活とは新しい契約を結ぶこと？</h4><details><summary>答えを見る</summary><div class='answer'><p>「基本的には、失効した元の契約を所定条件のもと再び有効にする手続きです。」</p></div></details>", "R": "<p>「未払い→猶予→失効。失効後は保障なし。一定期間なら復活申込み→告知等→未払分等の支払い→承諾、という流れです。」</p>", "M": "<p>「<strong>失効は保障が止まった状態、復活は審査等を経て元の契約を再び有効にする手続き。</strong>」</p>"}}, {"title": "必要保障額", "content": {"A": "<h3>A｜要点</h3><p>「必要保障額は、“死亡保険金はいくら欲しいか”を感覚で決める数字ではありません。一般には<strong>遺族に将来必要となる支出総額 − 死亡後に見込める収入・資産等＝生命保険などで準備すべき不足額</strong>と考えます。」</p><p>「つまり必要保障額は人によって違い、結婚、出産、住宅購入、子どもの独立、退職などで変化します。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず死亡後の支出を見ます。遺族の生活費、子どもの教育費、住居費、葬儀・整理資金などです。」</p><p>「次に死亡後の収入・資産を見ます。遺族年金、配偶者の収入、勤務先からの死亡退職金、預貯金などです。」</p><p>「その差額が不足するなら、生命保険などで補います。だから“年収の10倍”のような一律ルールだけで決めるのは粗すぎます。」</p><p>「さらに住宅ローンに団信が付いていて死亡時に残債が消えるなら、住宅費の必要額は大きく変わります。公的遺族年金もあります。ここでも第2章1でやった<strong>公的保障・既存資産を先に確認して不足を私的保険で埋める</strong>考え方が戻ってきます。」</p><p>「子どもが独立すれば教育費や生活費負担が減るので、必要保障額は一般に低下していきます。必要保障額は固定値ではなく、ライフステージとともに動く数字です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「家族の将来に一本の長い橋を架けると思ってください。」</p><p>「左側に“これから必要なお金”を積み上げます。生活費3,000万円、教育費1,000万円、その他500万円なら4,500万円。」</p><p>「右側には“すでに用意できるお金”を積み上げます。遺族年金、配偶者収入、預貯金、死亡退職金などです。」</p><p>「右側だけでは橋が500万円足りないなら、その<strong>穴の部分</strong>が必要保障額です。保険は橋全部を買うのではなく、原則その不足を埋めます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが死亡した場合、今後必要な遺族生活費2,500万円、教育費1,200万円、その他300万円で、支出見込みが合計4,000万円だとします。」</p><p>「一方、遺族年金などの見込額1,500万円、配偶者収入の見込額1,000万円、預貯金500万円が使えるなら、準備済み・見込収入は3,000万円です。」</p><p>「不足は4,000万円−3,000万円＝<strong>1,000万円</strong>。単純化したこの例では1,000万円が必要保障額の目安です。」</p><p>「もし子どもが独立して教育費1,200万円が不要になれば、同じ条件なら必要保障額は大きく下がります。だから定期的な見直しが必要なんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜必要保障額の基本式は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「将来必要となる支出 − 遺族年金・配偶者収入・資産などの見込める収入等＝不足額、という考え方です。」</p></div></details><h4>Q2｜住宅ローンに団信があっても残債をそのまま必要支出へ入れる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「死亡時に団信で残債が弁済される契約なら、その効果を考慮します。」</p></div></details><h4>Q3｜必要保障額は加入時から一生同じ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。出産、住宅購入、子どもの独立などライフステージで変化します。」</p></div></details>", "R": "<p>「①死亡後の支出を集計。②遺族年金・収入・資産等を集計。③支出−収入等＝不足。④不足を保険で補う。⑤団信など既存保障も考慮。⑥ライフステージで見直します。」</p>", "M": "<p>「<strong>必要保障額＝家族に必要な将来資金から、公的保障・収入・資産等を差し引いた不足額。</strong>」</p>"}}, {"title": "生命保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、生命保険は、人の<strong>死亡や生存など</strong>を保険事故として、契約で定めた保険金・給付金を支払う仕組みです。」</p><p>「基本分類は<strong>死亡保険・生存保険・生死混合保険</strong>。このあと出てくる定期保険や終身保険は死亡保険、養老保険は代表的な生死混合保険です。」</p><p>「そして生命保険を読むときは、必ず<strong>契約者・被保険者・保険金受取人</strong>を分けてください。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「契約者は保険会社と契約し、保険料を負担する人。被保険者は、その人の死亡・生存などが保障の対象になる人。受取人は保険金を受け取る人です。」</p><p>「たとえば夫が契約者兼被保険者、妻が死亡保険金受取人なら、夫が保険料を払い、夫の死亡が保険事故となり、妻が死亡保険金を受け取ります。」</p><p>「なぜこの三者を分けるのか。誰が保険料を負担し、誰の生命を保障し、誰がお金を受け取るかによって、契約の意味だけでなく死亡保険金にかかる税金の種類まで変わるからです。」</p><p>「生命保険は“貯金の商品”ではありません。中心は<strong>小さな保険料負担を多数で出し合い、死亡などが起きた人へ大きな保障を届けるリスク移転</strong>です。貯蓄性を持つ商品もありますが、保障と貯蓄は分けて考えます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一本の契約書に三つの名札を置いてください。『お金を出す人＝契約者』『命の対象＝被保険者』『保険金を受け取る人＝受取人』です。」</p><p>「そして契約の先には二つの時間軸があります。“いつまで保障するか”と“何が起きたら払うか”。この二つを見ると、定期・終身・養老などの違いが整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「夫Aさんが契約者・被保険者、妻Bさんが死亡保険金受取人で、死亡保険金2,000万円の契約に入ったとします。」</p><p>「Aさんが契約条件に該当する形で死亡すれば、Bさんへ2,000万円が支払われます。ここでは“誰が死亡したか”だけでなく、契約者と受取人が誰かも重要です。」</p><p>「もし契約者・被保険者・受取人の組合せを変えれば税務関係も変わります。後の『死亡保険・相続税・所得税・贈与税』で、この三者関係がそのまま使われます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜契約者・被保険者・受取人の違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約者＝契約し保険料を負担する人、被保険者＝生命・身体が保障対象となる人、受取人＝保険金を受け取る人です。」</p></div></details><h4>Q2｜定期保険・終身保険は大分類では何保険？</h4><details><summary>答えを見る</summary><div class='answer'><p>「死亡保険です。」</p></div></details><h4>Q3｜生命保険は単なる預金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。死亡などの経済的リスクを多数で分担・移転する保障の仕組みが中心です。」</p></div></details>", "R": "<p>「①人の死亡・生存等を保障。②死亡・生存・生死混合。③契約者＝払う人。④被保険者＝保障対象。⑤受取人＝受け取る人。⑥三者関係は税金にも影響します。」</p>", "M": "<p>「<strong>生命保険は、人の死亡・生存等のリスクを保障し、契約者・被保険者・受取人の三者で読む。</strong>」</p>"}}, {"title": "定期保険", "content": {"A": "<h3>A｜要点</h3><p>「定期保険は、<strong>10年、20年、60歳まで</strong>など一定期間だけ死亡・高度障害などを保障する死亡保険です。」</p><p>「満期まで生存しても通常は満期保険金がなく、解約返戻金も一般に少ないため、同じ死亡保険金額なら終身保険より保険料を抑えやすいのが特徴です。」</p><p>「つまり<strong>貯蓄より、必要な期間に大きな死亡保障を持つ</strong>ための商品です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「子どもが独立するまでの20年間だけ、死亡保障3,000万円が必要だとします。一生3,000万円が必要なわけではありません。それなら期間を限定することで、大きな保障を比較的少ない保険料で準備できます。」</p><p>「保険期間の決め方には“10年間”のような年満了と、“60歳まで”のような歳満了があります。」</p><p>「更新型では、満期時に健康状態にかかわらず一定条件のもと更新できる商品がありますが、更新時の年齢で保険料を再計算するため、一般に更新後の保険料は上がります。」</p><p>「先輩、“掛け捨て＝損”と決めないでください。定期保険は貯蓄を目的にせず、<strong>低い保険料で大きな保障を買う</strong>設計です。火災保険を使わなかったから損、とは単純に言わないのと同じです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「工事現場で20年間だけ大きな防護壁が必要だと思ってください。工事が終われば巨大な壁は不要です。」</p><p>「定期保険はその“期間限定の防護壁”。終身保険のように一生残す壁ではない代わりに、必要期間だけ大きくできます。」</p>", "D": "<h3>D｜具体例</h3><p>「35歳のAさんに、子どもが独立する55歳まで3,000万円の死亡保障が必要だとします。」</p><p>「20年定期保険なら、その20年間にAさんが死亡すれば3,000万円の死亡保険金。55歳まで生存して満期を迎えれば、通常は3,000万円の満期保険金が返ってくるわけではありません。」</p><p>「もし10年更新型なら45歳で更新し、その時点の年齢を基礎に保険料が上がるのが一般的です。“保障額は同じだから保険料も同じ”ではありません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜満期まで生存すると死亡保険金と同額の満期保険金が出る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「通常は出ません。定期保険は一定期間の死亡保障を中心とする商品です。」</p></div></details><h4>Q2｜更新型の保険料は一般にどうなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「更新時の年齢で再計算されるため、一般に高くなります。」</p></div></details><h4>Q3｜定期保険が向くのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「子育て期間など、一定期間だけ大きな死亡保障が必要な場合です。」</p></div></details>", "R": "<p>「一定期間だけ保障。満期保険金は通常なし。大きな保障を比較的低い保険料で持ちやすい。更新型は一般に更新後保険料↑です。」</p>", "M": "<p>「<strong>定期保険＝必要な期間だけ、大きな死亡保障を効率よく持つ保険。</strong>」</p>"}}, {"title": "平準定期保険・逓減定期保険・逓増定期保険・収入保障保険", "content": {"A": "<h3>A｜要点</h3><p>「四つは“時間がたつと保障額がどう動くか”で整理します。」</p><p>「<strong>平準定期</strong>＝死亡保険金が基本一定。<strong>逓減定期</strong>＝時間とともに死亡保険金が減少。<strong>逓増定期</strong>＝時間とともに死亡保険金が増加。<strong>収入保障保険</strong>＝死亡後、満期まで年金・月額などで定期的に給付する設計が中心で、死亡時期が遅いほど受取総額が小さくなる構造です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「平準定期は最も素直です。契約当初3,000万円なら、保険期間中の死亡保険金を基本3,000万円で保ちます。」</p><p>「逓減定期は、子どもの成長などで必要保障額が年々減る家庭と相性があります。若い時期は3,000万円必要でも、10年後には教育費の残りが減り、2,000万円で足りるかもしれません。保障を必要額の低下へ合わせます。」</p><p>「逓増定期は逆に保障額が増えていきます。法人の事業保障などで利用されることがありますが、税務上の取扱いは契約内容・時期等を別途確認します。」</p><p>「収入保障保険は逓減定期と経済的効果が似ています。たとえば死亡後、毎月10万円を保険期間満了まで受け取るなら、早く死亡するほど受取期間が長く総額が大きい。満期直前の死亡なら受取期間が短く総額が小さいからです。」</p><p>「ただし逓減定期は“死亡保険金額そのものを段階的に減らす”設計、収入保障は“残された期間に応じ定期給付する”設計が中心。似ていますが見せ方・受け取り方が違います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「横軸を時間、縦軸を保障額にしたグラフを頭に置いてください。」</p><p>「平準は――横一直線。逓減は＼右下がり。逓増は／右上がり。収入保障は、“死亡した地点から満期まで毎月お金が流れる”ので、早い地点ほど残りの川が長く、遅い地点ほど短いイメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「35歳から55歳までを考えます。平準定期3,000万円なら40歳死亡でも50歳死亡でも基本3,000万円。」</p><p>「逓減定期なら例として35歳時3,000万円から年々減り、50歳時には1,000万円程度という設計があり得ます。」</p><p>「収入保障保険で“死亡後、55歳まで毎月10万円”なら、40歳死亡では残り15年なので単純計算10万円×12×15＝1,800万円。50歳死亡なら残り5年で600万円です。実際には最低保証期間など契約条件があります。」</p><p>「だから家族の必要生活費が時間とともに減るなら、逓減型・収入保障型は合理的に合わせやすいんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜保障額が時間とともに増えるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「逓増定期保険です。」</p></div></details><h4>Q2｜死亡時期が遅いほど、満期までの受取総額が一般に小さくなるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「収入保障保険です。」</p></div></details><h4>Q3｜逓減定期と収入保障が似ている理由は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「どちらも時間の経過とともに、死亡時に家族へ残せる経済的保障の総額が小さくなる構造だからです。」</p></div></details>", "R": "<p>「平準＝横ばい、逓減＝右下がり、逓増＝右上がり、収入保障＝死亡後から満期まで定期給付。グラフで覚えます。」</p>", "M": "<p>「<strong>定期保険の違いは、時間経過に対して死亡保障が横ばい・減る・増える・残期間分になるか。</strong>」</p>"}}, {"title": "終身保険", "content": {"A": "<h3>A｜要点</h3><p>「終身保険は、<strong>死亡保障が一生涯続く死亡保険</strong>です。定期保険のように“60歳で保障終了”という満期が基本的にありません。」</p><p>「解約返戻金が積み上がるタイプが一般的で、死亡保障に加えて貯蓄性もあります。その分、同じ死亡保険金額なら定期保険より保険料は高くなるのが一般的です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「人はいつか死亡するので、終身保険は契約を有効に続ければ、死亡保険金を受け取る場面が原則いつか来ます。そのため期間限定の定期保険より保険料負担が大きくなりやすいわけです。」</p><p>「保険料の払い方は、一生払い続ける終身払と、60歳まで・10年間など一定期間で払い終える有期払があります。有期払は1回あたりの保険料が高くなりやすい一方、払込終了後も死亡保障は一生続きます。」</p><p>「また解約返戻金があるため、老後資金などに活用される場合もあります。ただし途中解約では払込保険料を下回ることがありますし、保障を解約すれば死亡保障も失います。」</p><p>「定期保険との本質的な違いは“貯蓄性があるか”だけではなく、<strong>保障期間が一定期間か一生涯か</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「定期保険が“20年間だけ借りる防護壁”なら、終身保険は“家と一緒に一生残す防護壁”です。」</p><p>「壁を一生維持するので費用は高くなりやすい。でも葬儀費用や相続対策など、“何歳で亡くなっても必要になる資金”とは相性があります。」</p>", "D": "<h3>D｜具体例</h3><p>「40歳のAさんが死亡保険金500万円の終身保険へ加入し、保険料を60歳で払い終える契約にしたとします。」</p><p>「Aさんが60歳を超えた後、80歳で死亡しても、契約が有効なら500万円の死亡保障は続いています。60歳で保険料払込みが終わることと、60歳で保障が終わることは別です。」</p><p>「一方、途中の50歳で解約すれば解約返戻金を受け取れる場合がありますが、その後の死亡保障はなくなります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜60歳払済の終身保険は60歳で保障終了？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。60歳で終わるのは保険料の払込みで、死亡保障は契約が有効なら一生涯続きます。」</p></div></details><h4>Q2｜定期保険との最重要な違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保障期間です。定期は一定期間、終身は一生涯です。」</p></div></details><h4>Q3｜解約返戻金は必ず払込総額以上？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。特に途中解約では払込保険料総額を下回ることがあります。」</p></div></details>", "R": "<p>「一生涯の死亡保障。終身払と有期払。解約返戻金を持つタイプが一般的。ただし途中解約元本保証ではありません。」</p>", "M": "<p>「<strong>終身保険＝保険料の払込期間とは別に、死亡保障を一生涯持つ保険。</strong>」</p>"}}, {"title": "積立利率変動型終身保険", "content": {"A": "<h3>A｜要点</h3><p>「積立利率変動型終身保険は、<strong>積立部分に適用する利率を市場金利などに応じて一定期間ごとに見直す終身保険</strong>です。」</p><p>「一般に最低保証となる積立利率を設けつつ、市場金利が上昇すれば積立金や解約返戻金、商品によっては死亡保険金の増加につながる可能性があります。」</p><p>「“保険料が毎回変動する保険”という意味ではなく、中心は<strong>積立部分へ適用する利率が変動する</strong>ことです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「通常の終身保険では、契約時の予定利率などを基礎に長期の保険料・責任準備金を設計します。ところが市場金利が上がっても、契約時の条件が固定的なら、その恩恵を受けにくいことがあります。」</p><p>「そこで積立利率変動型では、積立金に適用する利率を定期的に見直し、市場金利の変化を一定程度反映します。」</p><p>「金利が高くなれば積立部分が増えやすくなる一方、金利が下がれば適用利率も下がる可能性があります。ただし最低保証利率を設ける商品では、その水準を下回らない仕組みです。」</p><p>「先輩、次に出てくる<strong>利率変動型積立終身保険</strong>と名前が非常に似ています。積立利率変動型終身保険はあくまで“終身保険の積立利率が変動する”商品。一方、利率変動型積立終身保険は、積立部分と保障部分を組み合わせ、ライフステージに応じて保障を見直しやすくした別タイプです。語順を雑に読まないでください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「終身保険の中に“積立タンク”があり、そのタンクへ付く利息の蛇口が市場金利に合わせて調整されるイメージです。」</p><p>「普通の固定的な設計なら蛇口の開き方を契約時に長く決める。積立利率変動型なら一定期間ごとに調整する。ただし最低保証がある商品なら、蛇口が一定水準より完全に閉じないようストッパーがあります。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが積立利率変動型終身保険へ加入し、最低保証積立利率が設定されているとします。」</p><p>「契約後に市場金利が上昇し、見直し時の積立利率が上がれば、その後の積立金がより増えやすくなり、契約条件に応じて解約返戻金や増加保険金などへ反映される可能性があります。」</p><p>「逆に市場金利が低下すれば積立利率も低下し得ますが、最低保証がある範囲ではその水準が下支えになります。」</p><p>「ただし具体的な見直し頻度、最低保証利率、死亡保険金への反映方法は商品ごとに異なります。試験では<strong>市場金利を反映して積立利率が変動する終身保険</strong>という構造をまず押さえます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜何が“変動”する保険？</h4><details><summary>答えを見る</summary><div class='answer'><p>「主に積立部分へ適用する積立利率です。」</p></div></details><h4>Q2｜市場金利が上昇すると？</h4><details><summary>答えを見る</summary><div class='answer'><p>「見直しによって積立利率が上がれば、積立金等が増えやすくなる可能性があります。」</p></div></details><h4>Q3｜利率変動型積立終身保険と同じ商品？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。名前は似ていますが別タイプです。こちらは終身保険の積立利率が変動する点が中心です。」</p></div></details>", "R": "<p>「終身保障＋積立利率を市場金利に応じ見直し。最低保証を持つ商品が一般的。次項の“利率変動型積立終身”とは区別します。」</p>", "M": "<p>「<strong>積立利率変動型終身保険＝一生涯の死亡保障を持ちつつ、積立部分の利率を市場金利に応じて見直す保険。</strong>」</p>"}}, {"title": "利率変動型積立終身保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、前回の<strong>積立利率変動型終身保険</strong>と名前がほぼ逆なので、ここは丁寧に分けます。」</p><p>「<strong>利率変動型積立終身保険</strong>は、保険料の一部を積立部分へ回し、その積立金を使って死亡保障などを組み立てるタイプの保険です。アカウント型保険などと呼ばれる商品群があります。」</p><p>「特徴は、積立部分と保障部分を分け、ライフステージに応じて保障内容を見直しやすいことです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「保険料を払うと、その全部が一つの終身保険になるわけではありません。一定部分を積立勘定に積み立て、そこから必要に応じて定期保険や医療保障などの保険料へ振り替える構造を持つ商品があります。」</p><p>「若いうちは子どもが小さいので死亡保障を厚くする。子どもが独立したら死亡保障を減らして積立を増やす。こうした変更を一つの仕組みの中で行いやすいのが狙いです。」</p><p>「そして積立部分に適用される利率は一定期間ごとに見直されます。だから“利率変動型”です。」</p><p>「前回の<strong>積立利率変動型終身保険</strong>は、“終身保険そのものの積立利率が市場金利等に応じて変動する”のが中心でした。今回の<strong>利率変動型積立終身保険</strong>は、“積立勘定を土台に保障を組み替える”構造がポイントです。」</p><p>「なお具体的な積立・保障の振替方法、最低保証、終身保障への移行方法などは商品によって異なります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「二つの箱を想像してください。左が<strong>積立BOX</strong>、右が<strong>保障BOX</strong>です。」</p><p>「毎月の保険料を積立BOXへ入れつつ、必要な分を保障BOXへ回します。子育て中は保障BOXを大きく、子どもの独立後は積立BOXを厚くする、といった調整ができます。」</p><p>「前回の商品は“終身保険の中の利率が動く”。今回は“積立BOXを中心に保障を組み立てる”。ここで分けてください。」</p>", "D": "<h3>D｜具体例</h3><p>「35歳のAさんが、子どもが小さい間は死亡保障3,000万円を重視するとします。積立部分から保障部分へ多めに回して、定期保障を厚くします。」</p><p>「50歳になり子どもが独立したら、死亡保障を1,000万円へ減らし、その分を積立へ回す設計が可能な商品があります。」</p><p>「さらに所定年齢で積立金をもとに終身保障へ移行するタイプもあります。つまり一生同じ保障を固定するというより、<strong>積立勘定を土台に人生の段階に合わせて保障を調整する</strong>発想です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜前回の積立利率変動型終身保険との最大の違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「前回は終身保険の積立利率が変動する点が中心。今回は積立部分と保障部分を分け、積立勘定を土台に保障を見直しやすい構造が中心です。」</p></div></details><h4>Q2｜若い時期に保障を厚くし、後で減らすような調整は可能？</h4><details><summary>答えを見る</summary><div class='answer'><p>「商品設計の範囲内で可能なタイプがあります。ライフステージに応じた保障見直しが特徴です。」</p></div></details><h4>Q3｜“利率変動型”とは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「積立部分に適用される利率が一定期間ごとに見直されることを指します。」</p></div></details>", "R": "<p>「積立BOX＋保障BOX。積立勘定を土台に保障を調整。前項は“終身保険の積立利率”、今回は“積立部分を中心に保障を組み立てる商品”です。」</p>", "M": "<p>「<strong>利率変動型積立終身保険＝積立勘定を土台に、ライフステージに応じて保障を組み替えやすくした保険。</strong>」</p>"}}, {"title": "低解約返戻金終身保険", "content": {"A": "<h3>A｜要点</h3><p>「低解約返戻金終身保険は、<strong>保険料払込期間中などの解約返戻金を通常の終身保険より低く抑える代わりに、保険料を割安にした終身保険</strong>です。」</p><p>「払込期間が終わると、解約返戻金の水準が上がる設計が一般的です。」</p><p>「つまり“途中でやめないこと”を前提に、保険料負担を抑える仕組みです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「普通の終身保険にも解約返戻金があります。でも保険会社からすると、契約途中で高い解約返戻金をいつでも支払えるよう準備する必要があります。」</p><p>「そこで払込期間中の解約返戻金を低く設定すれば、その分、保険料を低く設計できます。」</p><p>「代表的な商品では、低解約返戻金期間中の返戻金を通常型の一定割合、たとえば70%程度に抑える設計があります。ただし割合や期間は商品ごとに異なります。」</p><p>「そして保険料払込満了後に解約返戻金が増えるため、老後資金や教育資金の準備に利用される場合があります。」</p><p>「ただし予定より早く解約すると不利になりやすい。先輩、“保険料が安い＝無条件に得”ではなく、<strong>途中解約の自由度を犠牲にしている</strong>と考えてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「貯金箱に“60歳まで開けないなら割引します”という鍵が付いているイメージです。」</p><p>「途中で開けること自体はできます。でも鍵を早く開けると、戻ってくるお金が通常型より少ない。」</p><p>「最後まで約束どおり続ける代わりに、毎月の負担を抑える。これが低解約返戻金型の交換条件です。」</p>", "D": "<h3>D｜具体例</h3><p>「40歳のAさんが60歳払済の低解約返戻金終身保険へ加入したとします。」</p><p>「50歳で急に資金が必要になって解約すると、まだ低解約返戻金期間中なので、通常型終身保険より返戻金が低く抑えられている可能性があります。」</p><p>「一方、60歳まで保険料を払い終えた後は、契約条件に従い返戻金水準が上昇します。」</p><p>「したがって、近い将来使う可能性の高いお金を全部この保険へ入れるのは相性がよくありません。<strong>長期継続できる資金か</strong>が重要です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜何を低くすることで保険料を抑える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険料払込期間中などの解約返戻金です。」</p></div></details><h4>Q2｜途中解約に強い商品？</h4><details><summary>答えを見る</summary><div class='answer'><p>「むしろ逆です。低解約返戻金期間中に解約すると、通常型より返戻金が低くなりやすいです。」</p></div></details><h4>Q3｜死亡保障も払込期間終了で消える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。終身保険なので、契約が有効なら死亡保障は一生涯続くのが基本です。」</p></div></details>", "R": "<p>「払込中の返戻金↓→保険料↓。払込終了後に返戻金水準↑。途中解約には弱いが長期継続と相性がよい終身保険です。」</p>", "M": "<p>「<strong>低解約返戻金終身保険＝途中の返戻金を低くする代わりに保険料を抑えた終身保険。</strong>」</p>"}}, {"title": "養老保険", "content": {"A": "<h3>A｜要点</h3><p>「養老保険は、一定の保険期間を決め、<strong>期間中に死亡すれば死亡保険金、満期まで生存すれば満期保険金</strong>を受け取る生死混合保険です。」</p><p>「一般的には死亡保険金と満期保険金を同額に設定するタイプが基本です。」</p><p>「死亡保障と貯蓄機能の両方を持つため、同じ死亡保障額なら定期保険より保険料は高くなります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「定期保険は“期間中に死亡したとき”が中心で、満期生存時には通常まとまった満期保険金がありません。」</p><p>「終身保険は“いつ死亡しても”死亡保障が続き、基本的に死亡保障の満期がありません。」</p><p>「養老保険はそのどちらとも違い、“10年、20年など期間を決め、死亡でも満期生存でも一定の保険金を受け取れる”構造です。」</p><p>「だから満期資金を準備しながら、その途中の死亡リスクも保障したい場合に使えます。ただし貯蓄性がある分、保険料負担は大きくなります。」</p><p>「先輩、“満期なら払った保険料が全部そのまま返金される”という意味ではありません。満期保険金額と払込保険料総額は別物です。予定利率や契約条件によって返戻率は変わります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「20年の一本道の両端にお金が置いてあるイメージです。」</p><p>「途中で死亡したら、その地点から死亡保険金の出口へ。何事もなく20年走り切ったら、満期保険金の出口へ。」</p><p>「“死亡しても出口、生きても出口”なので、生死混合保険なんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが20年満期、死亡保険金500万円・満期保険金500万円の養老保険へ加入したとします。」</p><p>「10年後にAさんが死亡すれば、受取人へ死亡保険金500万円。20年間生存すれば、Aさん等の満期保険金受取人へ500万円が支払われます。」</p><p>「一方、15年目に途中解約した場合は“満期500万円だから500万円”ではなく、その時点の解約返戻金です。」</p><p>「死亡・満期・途中解約の<strong>三つの出口で受取額の意味が違う</strong>と整理してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜養老保険は何保険に分類？</h4><details><summary>答えを見る</summary><div class='answer'><p>「死亡保障と生存保障を組み合わせる生死混合保険です。」</p></div></details><h4>Q2｜満期まで生存すると？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約で定めた満期保険金を受け取ります。」</p></div></details><h4>Q3｜途中解約でも満期保険金額を受け取れる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。途中解約ではその時点の解約返戻金となります。」</p></div></details>", "R": "<p>「期間中死亡→死亡保険金。満期生存→満期保険金。途中解約→解約返戻金。三つの出口を区別します。」</p>", "M": "<p>「<strong>養老保険＝一定期間の死亡保障と、満期生存時の満期保険金を組み合わせた生死混合保険。</strong>」</p>"}}, {"title": "定期保険特約終身保険", "content": {"A": "<h3>A｜要点</h3><p>「定期保険特約付終身保険は、<strong>一生涯の終身保険を主契約にして、その上へ一定期間の定期保険特約を載せる</strong>保険です。」</p><p>「小さな終身保障を一生残しつつ、子育て期など必要な期間だけ死亡保障を大きくできます。」</p><p>「昔から“定期付終身”と呼ばれる代表的な組合せです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば一生涯必要な葬儀・整理資金として500万円は残したい。でも子どもが独立するまでは家族の生活費・教育費のため合計3,000万円必要だとします。」</p><p>「そこで主契約の終身保険500万円に、20年間の定期保険特約2,500万円を上乗せします。子育て期は合計3,000万円、特約終了後は終身部分500万円だけが残る形です。」</p><p>「合理的ですよね。一生3,000万円を終身保険で持つより、期間限定で必要な2,500万円を定期保障にすることで保険料を抑えやすくなります。」</p><p>「ただし更新型の定期特約では、更新時に保険料が上がることがあります。また主契約と特約は保障期間が違うので、“保険全体が一生3,000万円”と誤解しないでください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一生残る小さな家が<strong>終身保険</strong>です。その家の上に、子育て期間だけ大きな仮設2階を載せます。それが<strong>定期保険特約</strong>です。」</p><p>「子どもが独立したら仮設2階を外す。でも1階の家は残る。これが定期付終身の形です。」</p>", "D": "<h3>D｜具体例</h3><p>「40歳のAさんが、主契約の終身保険500万円＋60歳までの定期保険特約2,500万円へ加入したとします。」</p><p>「50歳で死亡すれば、契約条件を満たす限り終身500万円＋定期特約2,500万円＝合計3,000万円の死亡保障。」</p><p>「60歳で定期特約が終了した後、70歳で死亡した場合は、定期特約分は終了しているため、基本は終身部分500万円です。」</p><p>「先輩、<strong>若い時3,000万円だったから一生3,000万円</strong>ではありません。主契約と特約を分解して読んでください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜主契約は一般に何？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終身保険です。」</p></div></details><h4>Q2｜定期特約が終了すると終身保障も消える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。主契約の終身保険が有効なら、その死亡保障は残ります。」</p></div></details><h4>Q3｜なぜ定期特約を上乗せする？</h4><details><summary>答えを見る</summary><div class='answer'><p>「子育て期など、一定期間だけ大きくなる必要保障額を比較的効率よく補うためです。」</p></div></details>", "R": "<p>「終身＝一生残す土台、定期特約＝一定期間だけ増築。特約終了後は終身部分が残ります。」</p>", "M": "<p>「<strong>定期保険特約付終身保険＝一生涯の終身保障に、必要期間だけ定期保障を上乗せする保険。</strong>」</p>"}}, {"title": "団体定期保険", "content": {"A": "<h3>A｜要点</h3><p>「団体定期保険は、会社などの<strong>団体を単位として加入する定期保険</strong>です。」</p><p>「個人が一人ずつ契約するのではなく、企業・団体と保険会社の契約のもとで、その所属員を被保険者として保障します。」</p><p>「代表的な形として、従業員が任意加入し保険料を負担する<strong>団体定期保険（Bグループ保険）</strong>などがあります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ団体にするのか。多数の加入者をまとめて募集・管理できるので、個人保険に比べ事務コストを抑えやすく、保険料が割安になる場合があります。」</p><p>「Bグループ保険では、企業などを契約者、従業員等を被保険者として、従業員が任意で加入するのが一般的です。給与天引きで保険料を払う形もあります。」</p><p>「ただし団体を離れた後も、まったく同じ条件で一生続くとは限りません。退職時の取扱いは契約によります。団体所属を前提とする保障だからです。」</p><p>「次に出てくる<strong>総合福祉団体定期保険</strong>とは目的が違います。団体定期保険（Bグループ）は従業員が任意加入する福利厚生的な死亡保障が中心。総合福祉団体定期保険は企業が従業員の死亡・高度障害時の弔慰金・死亡退職金等の財源を準備する目的が中心です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社のみんなで“大口の保険バス”に乗るイメージです。」</p><p>「一人ずつタクシー＝個人保険を契約するより、団体でまとめて乗ることで事務を効率化できます。」</p><p>「でも会社を退職すれば、そのバスから降りることになります。その後も乗れるか、別の契約へ移れるかは制度ごとに確認します。」</p>", "D": "<h3>D｜具体例</h3><p>「会社Xが保険会社と団体定期保険契約を結び、従業員Aさんが任意で死亡保障1,000万円へ加入したとします。」</p><p>「Aさんは給与天引きなどで保険料を負担し、保険期間中に死亡すれば契約に従って遺族等へ保険金が支払われます。」</p><p>「その後Aさんが退職した場合、“個人で入った終身保険だからそのまま一生継続”とは考えません。団体契約から離れるため、継続・移行の可否を制度で確認します。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜団体定期保険は終身保障？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。名称どおり定期保険で、団体契約のもと一定期間の死亡保障を提供します。」</p></div></details><h4>Q2｜Bグループ保険では加入は一般に強制？</h4><details><summary>答えを見る</su
