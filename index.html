、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。予定死亡率・予定利率・予定事業費率もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④予定死亡率・予定利率・予定事業費率のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>予定死亡率・予定利率・予定事業費率</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ予定死亡率・予定利率・予定事業費率による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして予定死亡率・予定利率・予定事業費率の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 予定死亡率・予定利率・予定事業費率が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が予定死亡率・予定利率・予定事業費率の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を予定死亡率・予定利率・予定事業費率の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「予定死亡率・予定利率・予定事業費率について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>予定死亡率・予定利率・予定事業費率で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 予定死亡率・予定利率・予定事業費率のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 予定死亡率・予定利率・予定事業費率が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に予定死亡率・予定利率・予定事業費率と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、予定死亡率・予定利率・予定事業費率の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>予定死亡率・予定利率・予定事業費率は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 予定死亡率・予定利率・予定事業費率が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>予定死亡率・予定利率・予定事業費率＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "純保険料と付加保険料", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>純保険料と付加保険料</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 純保険料と付加保険料が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。純保険料と付加保険料もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④純保険料と付加保険料のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>純保険料と付加保険料</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 純保険料と付加保険料が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ純保険料と付加保険料による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして純保険料と付加保険料の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 純保険料と付加保険料が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が純保険料と付加保険料の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を純保険料と付加保険料の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「純保険料と付加保険料について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>純保険料と付加保険料で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 純保険料と付加保険料のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 純保険料と付加保険料が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に純保険料と付加保険料と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、純保険料と付加保険料の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>純保険料と付加保険料は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 純保険料と付加保険料が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>純保険料と付加保険料＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "剰余金と配当金", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>剰余金と配当金</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 剰余金と配当金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。剰余金と配当金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④剰余金と配当金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>剰余金と配当金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 剰余金と配当金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ剰余金と配当金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして剰余金と配当金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 剰余金と配当金が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が剰余金と配当金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を剰余金と配当金の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「剰余金と配当金について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>剰余金と配当金で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 剰余金と配当金のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 剰余金と配当金が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に剰余金と配当金と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、剰余金と配当金の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>剰余金と配当金は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 剰余金と配当金が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>剰余金と配当金＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "有配当保険・無配当保険・準有配当保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>有配当保険・無配当保険・準有配当保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 有配当保険・無配当保険・準有配当保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。有配当保険・無配当保険・準有配当保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④有配当保険・無配当保険・準有配当保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>有配当保険・無配当保険・準有配当保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 有配当保険・無配当保険・準有配当保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ有配当保険・無配当保険・準有配当保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして有配当保険・無配当保険・準有配当保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 有配当保険・無配当保険・準有配当保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が有配当保険・無配当保険・準有配当保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を有配当保険・無配当保険・準有配当保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「有配当保険・無配当保険・準有配当保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>有配当保険・無配当保険・準有配当保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 有配当保険・無配当保険・準有配当保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 有配当保険・無配当保険・準有配当保険が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に有配当保険・無配当保険・準有配当保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、有配当保険・無配当保険・準有配当保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>有配当保険・無配当保険・準有配当保険は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 有配当保険・無配当保険・準有配当保険が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>有配当保険・無配当保険・準有配当保険＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "告知義務", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>告知義務</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 告知義務が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。告知義務もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④告知義務のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>告知義務</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 告知義務が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ告知義務による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして告知義務の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が告知義務の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を告知義務の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「告知義務について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>告知義務で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 告知義務のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に告知義務と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、告知義務の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>告知義務は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」を思い出します。</p>", "M": "<p><strong>告知義務＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "責任開始日", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>責任開始日</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 責任開始日 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 責任開始日が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。責任開始日もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④責任開始日のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>責任開始日</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 責任開始日が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ責任開始日による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして責任開始日の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が責任開始日の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を責任開始日の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで責任開始日の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 責任開始日 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 責任開始日 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「責任開始日について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」 お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>保険料の払込猶予</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 保険料の払込猶予が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ保険料の払込猶予による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして保険料の払込猶予の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険料の払込猶予が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が保険料の払込猶予の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を保険料の払込猶予の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「保険料の払込猶予について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>保険料の払込猶予で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 保険料の払込猶予のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険料の払込猶予が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に保険料の払込猶予と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、保険料の払込猶予の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>保険料の払込猶予は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 保険料の払込猶予 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで保険料の払込猶予の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 保険料の払込猶予 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険料の払込猶予が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>保険料の払込猶予＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "自動振替貸付制度と契約者貸付制度", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>自動振替貸付制度と契約者貸付制度</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 自動振替貸付制度と契約者貸付制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。自動振替貸付制度と契約者貸付制度もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④自動振替貸付制度と契約者貸付制度のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>自動振替貸付制度と契約者貸付制度</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 自動振替貸付制度と契約者貸付制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ自動振替貸付制度と契約者貸付制度による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして自動振替貸付制度と契約者貸付制度の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 自動振替貸付制度と契約者貸付制度が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が自動振替貸付制度と契約者貸付制度の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を自動振替貸付制度と契約者貸付制度の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「自動振替貸付制度と契約者貸付制度について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>自動振替貸付制度と契約者貸付制度で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 自動振替貸付制度と契約者貸付制度のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 自動振替貸付制度と契約者貸付制度が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に自動振替貸付制度と契約者貸付制度と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、自動振替貸付制度と契約者貸付制度の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>自動振替貸付制度と契約者貸付制度は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 自動振替貸付制度と契約者貸付制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで自動振替貸付制度と契約者貸付制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 自動振替貸付制度と契約者貸付制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 自動振替貸付制度と契約者貸付制度が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>自動振替貸付制度と契約者貸付制度＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "契約の失効と復活", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>契約の失効と復活</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約の失効と復活が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。契約の失効と復活もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④契約の失効と復活のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>契約の失効と復活</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約の失効と復活が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ契約の失効と復活による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして契約の失効と復活の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約の失効と復活が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が契約の失効と復活の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を契約の失効と復活の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「契約の失効と復活について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>契約の失効と復活で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 契約の失効と復活のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約の失効と復活が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に契約の失効と復活と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、契約の失効と復活の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>契約の失効と復活は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約の失効と復活 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで契約の失効と復活の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約の失効と復活 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約の失効と復活が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>契約の失効と復活＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "必要保障額", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>必要保障額</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。</p><p>仕組みを最初から説明 Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 必要保障額が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。必要保障額もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④必要保障額のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>必要保障額</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 必要保障額が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ必要保障額による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして必要保障額の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 必要保障額は必要資金－準備済資金 です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が必要保障額の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を必要保障額の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「必要保障額について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>必要保障額で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。<br><br><b>解説：</b>仕組みを最初から説明 Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 必要保障額のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 必要保障額は必要資金－準備済資金 です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に必要保障額と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、必要保障額の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>必要保障額は「」 結論 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。」。仕組みは「仕組みを最初から説明 Aさん死亡後、配偶者と子どもの生活費・教育費を未来の家計表にし、既存資産と遺族年金を反対側へ置く。 条件確認 → 必要保障額 → お金・保障の変化 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める。 なぜ別制度ではないのかは、 必要保障額は必要資金－準備済資金 で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで必要保障額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『現在年収の何倍、と機械的に決めない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 必要保障額は必要資金－準備済資金 です。」を思い出します。</p>", "M": "<p><strong>必要保障額＝」 結論 遺族の将来必要支出から、公的保障・収入・預貯金等を引いた不足額を求める 「比較軸は 必要保障額は必要資金－準備済資金 。</strong></p>"}}, {"title": "生命保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>生命保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生命保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。生命保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④生命保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>生命保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生命保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ生命保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして生命保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が生命保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を生命保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「生命保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>生命保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br><br><b>解説：</b>仕組みを最初から説明 条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 生命保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に生命保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、生命保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>生命保険は「」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」。仕組みは「仕組みを最初から説明 条件確認 → 生命保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」を思い出します。</p>", "M": "<p><strong>生命保険＝」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</strong></p>"}}, {"title": "定期保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>定期保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。定期保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④定期保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>定期保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 定期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ定期保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして定期保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が定期保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を定期保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「定期保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>定期保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br><br><b>解説：</b>仕組みを最初から説明 条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 定期保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に定期保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、定期保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>定期保険は「」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」。仕組みは「仕組みを最初から説明 条件確認 → 定期保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで定期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 定期保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」を思い出します。</p>", "M": "<p><strong>定期保険＝」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</strong></p>"}}, {"title": "平準定期保険・逓減定期保険・逓増定期保険・収入保障保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>平準定期保険・逓減定期保険・逓増定期保険・収入保障保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。平準定期保険・逓減定期保険・逓増定期保険・収入保障保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④平準定期保険・逓減定期保険・逓増定期保険・収入保障保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>平準定期保険・逓減定期保険・逓増定期保険・収入保障保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ平準定期保険・逓減定期保険・逓増定期保険・収入保障保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで平準定期保険・逓減定期保険・逓増定期保険・収入保障保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 平準定期保険・逓減定期保険・逓増定期保険・収入保障保険 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「平準定期保険・逓減定期保険・逓増定期保険・収入保障保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "
