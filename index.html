法、契約を終了する方法を区別する 。</p>"}}, {"title": "付加・追加・減額", "content": {"A": "\n<p>「先輩、<strong>付加・追加・減額</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>付加・追加・減額は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 付加・追加・減額が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。付加・追加・減額は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>付加・追加・減額という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 付加・追加・減額が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで付加・追加・減額の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ付加・追加・減額の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>付加・追加・減額＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 付加・追加・減額が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が付加・追加・減額の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ付加・追加・減額の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、付加・追加・減額に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、付加・追加・減額に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>付加・追加・減額とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 付加・追加・減額が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→付加・追加・減額の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを付加・追加・減額の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：付加・追加・減額　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 付加・追加・減額が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 付加・追加・減額 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>付加・追加・減額：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "生命保険料控除", "content": {"A": "\n<p>「先輩、<strong>生命保険料控除</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>生命保険料控除は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。生命保険料控除は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>生命保険料控除という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで生命保険料控除の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ生命保険料控除の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>生命保険料控除＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料控除が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が生命保険料控除の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ生命保険料控除の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、生命保険料控除に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、生命保険料控除に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>生命保険料控除とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→生命保険料控除の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを生命保険料控除の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：生命保険料控除　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料控除が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料控除 を具体例に落とします。</p>", "M": "<p><strong>生命保険料控除：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "個人年金保険料控除", "content": {"A": "\n<p>「先輩、<strong>個人年金保険料控除</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>個人年金保険料控除は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。個人年金保険料控除は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>個人年金保険料控除という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで個人年金保険料控除の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ個人年金保険料控除の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>個人年金保険料控除＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 個人年金保険料控除が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が個人年金保険料控除の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ個人年金保険料控除の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、個人年金保険料控除に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、個人年金保険料控除に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>個人年金保険料控除とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→個人年金保険料控除の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを個人年金保険料控除の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：個人年金保険料控除　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 個人年金保険料控除が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 個人年金保険料控除 を具体例に落とします。</p>", "M": "<p><strong>個人年金保険料控除：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "死亡保険金・満期保険金の税金", "content": {"A": "\n<p>「先輩、<strong>死亡保険金・満期保険金の税金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。</p>\n<p>条件確認 → 死亡保険金・満期保険金の税金 → お金・保障の変化 保険料負担者・被保険者・受取人の組合せから税目を判定する。 なぜ別制度ではないのかは、 満期保険金でも保険料負担者と受取人の一致・不一致を見る で説明します。</p>\n<h3>何のための知識か</h3>\n<p>死亡保険金・満期保険金の税金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 死亡保険金・満期保険金の税金 → お金・保障の変化 保険料負担者・被保険者・受取人の組合せから税目を判定する。 なぜ別制度ではないのかは、 満期保険金でも保険料負担者と受取人の一致・不一致を見る で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで死亡保険金・満期保険金の税金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 死亡保険金・満期保険金の税金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 死亡保険金・満期保険金の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。死亡保険金・満期保険金の税金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>死亡保険金・満期保険金の税金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 死亡保険金・満期保険金の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで死亡保険金・満期保険金の税金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ死亡保険金・満期保険金の税金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>死亡保険金・満期保険金の税金＝「保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 死亡保険金・満期保険金の税金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る です。</p>\n<p>このケースでは、まず目的と対象者が死亡保険金・満期保険金の税金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ死亡保険金・満期保険金の税金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、死亡保険金・満期保険金の税金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、死亡保険金・満期保険金の税金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>死亡保険金・満期保険金の税金とは何か。<div class=\"answer\"><b>答え：</b>保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。<br>条件確認 → 死亡保険金・満期保険金の税金 → お金・保障の変化 保険料負担者・被保険者・受取人の組合せから税目を判定する。 なぜ別制度ではないのかは、 満期保険金でも保険料負担者と受取人の一致・不一致を見る で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 死亡保険金・満期保険金の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→死亡保険金・満期保険金の税金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを死亡保険金・満期保険金の税金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。 さらに、ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：死亡保険金・満期保険金の税金　②核心：保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。　③仕組み：条件確認 → 死亡保険金・満期保険金の税金 → お金・保障の変化 保険料負担者・被保険者・受取人の組合せから税目を判定する。 なぜ別制度ではないのかは、 満期保険金でも保険料負担者と受取人の一致・不一致を見る で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 死亡保険金・満期保険金の税金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る です。　⑤比較：ケース6｜誤答を作る 「わざと『被保険者だけを見て税目を決めない』というミスをします。 具体例を最初から最後まで解説 「では 死亡保険金・満期保険金の税金 を具体例に落とします。</p>", "M": "<p><strong>死亡保険金・満期保険金の税金：</strong>保険料負担者・被保険者・受取人の組合せから税目を判定する 「比較軸は 満期保険金でも保険料負担者と受取人の一致・不一致を見る 。</p>"}}, {"title": "金融類似商品の税金", "content": {"A": "\n<p>「先輩、<strong>金融類似商品の税金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 金融類似商品の税金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>金融類似商品の税金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 金融類似商品の税金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで金融類似商品の税金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 金融類似商品の税金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 金融類似商品の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。金融類似商品の税金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>金融類似商品の税金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 金融類似商品の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで金融類似商品の税金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ金融類似商品の税金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>金融類似商品の税金＝「保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 金融類似商品の税金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。</p>\n<p>このケースでは、まず目的と対象者が金融類似商品の税金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ金融類似商品の税金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、金融類似商品の税金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、金融類似商品の税金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>金融類似商品の税金とは何か。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。<br>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 金融類似商品の税金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 金融類似商品の税金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→金融類似商品の税金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを金融類似商品の税金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 さらに、ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：金融類似商品の税金　②核心：保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。　③仕組み：Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 金融類似商品の税金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 金融類似商品の税金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。　⑤比較：ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 金融類似商品の税金 を具体例に落とします。</p>", "M": "<p><strong>金融類似商品の税金：</strong>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>"}}, {"title": "非課税となる保険金や給付金", "content": {"A": "\n<p>「先輩、<strong>非課税となる保険金や給付金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 非課税となる保険金や給付金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>非課税となる保険金や給付金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 非課税となる保険金や給付金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで非課税となる保険金や給付金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 非課税となる保険金や給付金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 非課税となる保険金や給付金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。非課税となる保険金や給付金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>非課税となる保険金や給付金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 非課税となる保険金や給付金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで非課税となる保険金や給付金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ非課税となる保険金や給付金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>非課税となる保険金や給付金＝「保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 非課税となる保険金や給付金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。</p>\n<p>このケースでは、まず目的と対象者が非課税となる保険金や給付金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ非課税となる保険金や給付金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、非課税となる保険金や給付金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、非課税となる保険金や給付金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>非課税となる保険金や給付金とは何か。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。<br>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 非課税となる保険金や給付金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 非課税となる保険金や給付金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→非課税となる保険金や給付金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを非課税となる保険金や給付金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 さらに、ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：非課税となる保険金や給付金　②核心：保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。　③仕組み：Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 非課税となる保険金や給付金 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 非課税となる保険金や給付金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。　⑤比較：ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 非課税となる保険金や給付金 を具体例に落とします。</p>", "M": "<p><strong>非課税となる保険金や給付金：</strong>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>"}}, {"title": "事業保障資金の準備", "content": {"A": "\n<p>「先輩、<strong>事業保障資金の準備</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>事業保障資金の準備は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで事業保障資金の準備の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 事業保障資金の準備 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 事業保障資金の準備が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。事業保障資金の準備は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>事業保障資金の準備という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 事業保障資金の準備が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで事業保障資金の準備の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ事業保障資金の準備の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>事業保障資金の準備＝「保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 事業保障資金の準備が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。</p>\n<p>このケースでは、まず目的と対象者が事業保障資金の準備の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ事業保障資金の準備の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、事業保障資金の準備に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、事業保障資金の準備に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>事業保障資金の準備とは何か。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。<br>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 事業保障資金の準備が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→事業保障資金の準備の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを事業保障資金の準備の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 さらに、ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：事業保障資金の準備　②核心：保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。　③仕組み：Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 事業保障資金の準備が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。　⑤比較：ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 事業保障資金の準備 を具体例に落とします。</p>", "M": "<p><strong>事業保障資金の準備：</strong>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>"}}, {"title": "生命保険料の経理処理", "content": {"A": "\n<p>「先輩、<strong>生命保険料の経理処理</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>生命保険料の経理処理は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで生命保険料の経理処理の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 生命保険料の経理処理 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 生命保険料の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。生命保険料の経理処理は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>生命保険料の経理処理という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 生命保険料の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで生命保険料の経理処理の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ生命保険料の経理処理の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>生命保険料の経理処理＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が生命保険料の経理処理の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ生命保険料の経理処理の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、生命保険料の経理処理に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、生命保険料の経理処理に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>生命保険料の経理処理とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 生命保険料の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→生命保険料の経理処理の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを生命保険料の経理処理の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：生命保険料の経理処理　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 生命保険料の経理処理 を具体例に落とします。</p>", "M": "<p><strong>生命保険料の経理処理：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "養老保険の経理処理", "content": {"A": "\n<p>「先輩、<strong>養老保険の経理処理</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 養老保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>養老保険の経理処理は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 養老保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで養老保険の経理処理の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 養老保険の経理処理 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 養老保険の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。養老保険の経理処理は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>養老保険の経理処理という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 養老保険の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで養老保険の経理処理の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ養老保険の経理処理の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>養老保険の経理処理＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 養老保険の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が養老保険の経理処理の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ養老保険の経理処理の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、養老保険の経理処理に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、養老保険の経理処理に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>養老保険の経理処理とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 養老保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 養老保険の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→養老保険の経理処理の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを養老保険の経理処理の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：養老保険の経理処理　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 養老保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 養老保険の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 養老保険の経理処理 を具体例に落とします。</p>", "M": "<p><strong>養老保険の経理処理：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "ハーフタックスプランの経理処理", "content": {"A": "\n<p>「先輩、<strong>ハーフタックスプランの経理処理</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>ハーフタックスプランの経理処理は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでハーフタックスプランの経理処理の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → ハーフタックスプランの経理処理 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → ハーフタックスプランの経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。ハーフタックスプランの経理処理は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>ハーフタックスプランの経理処理という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → ハーフタックスプランの経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでハーフタックスプランの経理処理の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだハーフタックスプランの経理処理の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>ハーフタックスプランの経理処理＝「保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ハーフタックスプランの経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。</p>\n<p>このケースでは、まず目的と対象者がハーフタックスプランの経理処理の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じハーフタックスプランの経理処理の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、ハーフタックスプランの経理処理に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、ハーフタックスプランの経理処理に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>ハーフタックスプランの経理処理とは何か。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。<br>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → ハーフタックスプランの経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→ハーフタックスプランの経理処理の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをハーフタックスプランの経理処理の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 さらに、ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：ハーフタックスプランの経理処理　②核心：保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。　③仕組み：Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ハーフタックスプランの経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。　⑤比較：ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では ハーフタックスプランの経理処理 を具体例に落とします。</p>", "M": "<p><strong>ハーフタックスプランの経理処理：</strong>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>"}}, {"title": "定期保険・第三分野保険に関わる保険料の取扱い", "content": {"A": "\n<p>「先輩、<strong>定期保険・第三分野保険に関わる保険料の取扱い</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>\n<p>条件確認 → 定期保険・第三分野保険に関わる保険料の取扱い → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>定期保険・第三分野保険に関わる保険料の取扱いは、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険・第三分野保険に関わる保険料の取扱い を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>条件確認 → 定期保険・第三分野保険に関わる保険料の取扱い → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで定期保険・第三分野保険に関わる保険料の取扱いの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 定期保険・第三分野保険に関わる保険料の取扱い → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 定期保険・第三分野保険に関わる保険料の取扱いが必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。定期保険・第三分野保険に関わる保険料の取扱いは、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険・第三分野保険に関わる保険料の取扱い を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>定期保険・第三分野保険に関わる保険料の取扱いという語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 定期保険・第三分野保険に関わる保険料の取扱いが必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで定期保険・第三分野保険に関わる保険料の取扱いの条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ定期保険・第三分野保険に関わる保険料の取扱いの効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険・第三分野保険に関わる保険料の取扱い を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>定期保険・第三分野保険に関わる保険料の取扱い＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 定期保険・第三分野保険に関わる保険料の取扱いが働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が定期保険・第三分野保険に関わる保険料の取扱いの条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ定期保険・第三分野保険に関わる保険料の取扱いの枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 定期保険・第三分野保険に関わる保険料の取扱い を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、定期保険・第三分野保険に関わる保険料の取扱いに関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、定期保険・第三分野保険に関わる保険料の取扱いに当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>定期保険・第三分野保険に関わる保険料の取扱いとは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 定期保険・第三分野保険に関わる保険料の取扱い → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要 処理の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ長期平準定期保険の経理処理の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 長期平準定期保険の経理処理 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>長期平準定期保険の経理処理＝「家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 長期平準定期保険の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>このケースでは、まず目的と対象者が長期平準定期保険の経理処理の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ長期平準定期保険の経理処理の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 長期平準定期保険の経理処理 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、長期平準定期保険の経理処理に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、長期平準定期保険の経理処理に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>長期平準定期保険の経理処理とは何か。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br>条件確認 → 長期平準定期保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 長期平準定期保険の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→長期平準定期保険の経理処理の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 長期平準定期保険の経理処理 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを長期平準定期保険の経理処理の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 さらに、ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 長期平準定期保険の経理処理 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：長期平準定期保険の経理処理　②核心：家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。　③仕組み：条件確認 → 長期平準定期保険の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 長期平準定期保険の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 具体例を最初から最後まで解説 「では 長期平準定期保険の経理処理 を具体例に落とします。</p>", "M": "<p><strong>長期平準定期保険の経理処理：</strong>家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p>"}}, {"title": "保険金等の経理処理", "content": {"A": "\n<p>「先輩、<strong>保険金等の経理処理</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>保険金等の経理処理は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで保険金等の経理処理の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 保険金等の経理処理 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 保険金等の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。保険金等の経理処理は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>保険金等の経理処理という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 保険金等の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで保険金等の経理処理の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ保険金等の経理処理の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>保険金等の経理処理＝「保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険金等の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。</p>\n<p>このケースでは、まず目的と対象者が保険金等の経理処理の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ保険金等の経理処理の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、保険金等の経理処理に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、保険金等の経理処理に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>保険金等の経理処理とは何か。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。<br>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 保険金等の経理処理が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→保険金等の経理処理の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを保険金等の経理処理の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 さらに、ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：保険金等の経理処理　②核心：保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。　③仕組み：Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険金等の経理処理が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける です。　⑤比較：ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 保険金等の経理処理 を具体例に落とします。</p>", "M": "<p><strong>保険金等の経理処理：</strong>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>"}}, {"title": "役員退職時の名義変更", "content": {"A": "\n<p>「先輩、<strong>役員退職時の名義変更</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。</p>\n<p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 役員退職時の名義変更 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<h3>何のための知識か</h3>\n<p>役員退職時の名義変更は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『税務は契約形態・受取人・保険期間等で変わるため、名称だけで経理処理を決めない』というミスをします。 具体例を最初から最後まで解説 「では 役員退職時の名義変更 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 役員退職時の名義変更 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで役員退職時の名義変更の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 役員退職時の名義変更 → 金額や権利の
