げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。　④具体例：ケース1｜基本形 100人で事故2件なら2%。 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。　⑤比較：ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</p>", "M": "<p><strong>大数の法則：</strong>大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。</p>"}}, {"title": "収支相等の原則", "content": {"A": "\n<p>「先輩、<strong>収支相等の原則</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。</p>\n<p>100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>収支相等の原則は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで収支相等の原則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 収支相等の原則 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 収支相等の原則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。収支相等の原則は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>収支相等の原則という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 収支相等の原則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで収支相等の原則の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ収支相等の原則の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>収支相等の原則＝「保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>ケース1｜基本形 100人×1万円=100万円、5人×20万円=100万円。 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 収支相等の原則が働く時点を特定します。</p>\n<p>このケースでは、まず目的と対象者が収支相等の原則の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ収支相等の原則の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、収支相等の原則に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、収支相等の原則に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>収支相等の原則とは何か。<div class=\"answer\"><b>答え：</b>保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。<br>100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 収支相等の原則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→収支相等の原則の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを収支相等の原則の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。 さらに、ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：収支相等の原則　②核心：保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。　③仕組み：100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。　④具体例：ケース1｜基本形 100人×1万円=100万円、5人×20万円=100万円。 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 収支相等の原則が働く時点を特定します。　⑤比較：ケース5｜似た制度と対決 「比較の軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する です。 ケース6｜誤答を作る 「わざと『会社経費は付加保険料なので、全収支が同額という意味ではない』というミスをします。</p>", "M": "<p><strong>収支相等の原則：</strong>保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。</p>"}}, {"title": "クーリングオフ", "content": {"A": "\n<p>「先輩、<strong>クーリングオフ</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>クーリングオフは、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでクーリングオフの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → クーリングオフ → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → クーリングオフが必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。クーリングオフは、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>クーリングオフという語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → クーリングオフが必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでクーリングオフの条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだクーリングオフの効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>クーリングオフ＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 クーリングオフが働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者がクーリングオフの条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じクーリングオフの枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、クーリングオフに関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、クーリングオフに当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>クーリングオフとは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → クーリングオフが必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→クーリングオフの適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをクーリングオフの要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：クーリングオフ　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 クーリングオフが働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では クーリングオフ を具体例に落とします。</p>", "M": "<p><strong>クーリングオフ：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "保険契約者保護機構", "content": {"A": "\n<p>「先輩、<strong>保険契約者保護機構</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>保険契約者保護機構は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで保険契約者保護機構の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 保険契約者保護機構 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 保険契約者保護機構が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。保険契約者保護機構は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>保険契約者保護機構という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 保険契約者保護機構が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで保険契約者保護機構の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ保険契約者保護機構の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>保険契約者保護機構＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険契約者保護機構が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が保険契約者保護機構の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ保険契約者保護機構の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、保険契約者保護機構に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、保険契約者保護機構に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>保険契約者保護機構とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 保険契約者保護機構が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→保険契約者保護機構の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを保険契約者保護機構の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：保険契約者保護機構　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険契約者保護機構が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険契約者保護機構 を具体例に落とします。</p>", "M": "<p><strong>保険契約者保護機構：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "少額短期保険", "content": {"A": "\n<p>「先輩、<strong>少額短期保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>少額短期保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで少額短期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 少額短期保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 少額短期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。少額短期保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>少額短期保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 少額短期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで少額短期保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ少額短期保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>少額短期保険＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 少額短期保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が少額短期保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ少額短期保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、少額短期保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、少額短期保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>少額短期保険とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 少額短期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→少額短期保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを少額短期保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：少額短期保険　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 少額短期保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 少額短期保険 を具体例に落とします。</p>", "M": "<p><strong>少額短期保険：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "ソルベンシー・マージン比率", "content": {"A": "\n<p>「先輩、<strong>ソルベンシー・マージン比率</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。</p>\n<p>巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。</p>\n<h3>何のための知識か</h3>\n<p>ソルベンシー・マージン比率は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでソルベンシー・マージン比率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → ソルベンシー・マージン比率 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → ソルベンシー・マージン比率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。ソルベンシー・マージン比率は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>ソルベンシー・マージン比率という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → ソルベンシー・マージン比率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでソルベンシー・マージン比率の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだソルベンシー・マージン比率の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>ソルベンシー・マージン比率＝「通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ソルベンシー・マージン比率が働く時点を特定します。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者がソルベンシー・マージン比率の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じソルベンシー・マージン比率の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、ソルベンシー・マージン比率に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、ソルベンシー・マージン比率に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>ソルベンシー・マージン比率とは何か。<div class=\"answer\"><b>答え：</b>通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。<br>巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → ソルベンシー・マージン比率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→ソルベンシー・マージン比率の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをソルベンシー・マージン比率の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 さらに、金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</div></li>\n</ol>", "R": "<p>①テーマ：ソルベンシー・マージン比率　②核心：通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。　③仕組み：巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ソルベンシー・マージン比率が働く時点を特定します。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。　⑤比較：金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。 Aさんは何をしたいのか」「誰に何が起きたのか」を確定し、その目的にソルベンシー・マージン比率が対応するかを判断します。</p>", "M": "<p><strong>ソルベンシー・マージン比率：</strong>通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。</p>"}}, {"title": "保険法と保険業法", "content": {"A": "\n<p>「先輩、<strong>保険法と保険業法</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>保険法と保険業法は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで保険法と保険業法の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 保険法と保険業法 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 保険法と保険業法が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。保険法と保険業法は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>保険法と保険業法という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 保険法と保険業法が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで保険法と保険業法の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ保険法と保険業法の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>保険法と保険業法＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険法と保険業法が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が保険法と保険業法の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ保険法と保険業法の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、保険法と保険業法に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、保険法と保険業法に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>保険法と保険業法とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 保険法と保険業法が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→保険法と保険業法の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを保険法と保険業法の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：保険法と保険業法　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 保険法と保険業法が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 保険法と保険業法 を具体例に落とします。</p>", "M": "<p><strong>保険法と保険業法：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "解約返戻金", "content": {"A": "\n<p>「先輩、<strong>解約返戻金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>解約返戻金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで解約返戻金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 解約返戻金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 解約返戻金が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。解約返戻金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>解約返戻金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 解約返戻金が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで解約返戻金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ解約返戻金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>解約返戻金＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が解約返戻金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ解約返戻金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、解約返戻金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、解約返戻金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>解約返戻金とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 解約返戻金が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→解約返戻金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを解約返戻金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：解約返戻金　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。　⑤比較：ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>解約返戻金：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "生死混合保険", "content": {"A": "\n<p>「先輩、<strong>生死混合保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>生死混合保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで生死混合保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 生死混合保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 生死混合保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。生死混合保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>生死混合保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 生死混合保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで生死混合保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ生死混合保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>生死混合保険＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生死混合保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が生死混合保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ生死混合保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、生死混合保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、生死混合保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>生死混合保険とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 生死混合保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→生死混合保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを生死混合保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：生死混合保険　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生死混合保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 生死混合保険 を具体例に落とします。</p>", "M": "<p><strong>生死混合保険：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "予定死亡率・予定利率・予定事業費率", "content": {"A": "\n<p>「先輩、<strong>予定死亡率・予定利率・予定事業費率</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>予定死亡率・予定利率・予定事業費率は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 予定死亡率・予定利率・予定事業費率 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。予定死亡率・予定利率・予定事業費率は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>予定死亡率・予定利率・予定事業費率という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで予定死亡率・予定利率・予定事業費率の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ予定死亡率・予定利率・予定事業費率の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>予定死亡率・予定利率・予定事業費率＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 予定死亡率・予定利率・予定事業費率が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が予定死亡率・予定利率・予定事業費率の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ予定死亡率・予定利率・予定事業費率の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、予定死亡率・予定利率・予定事業費率に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、予定死亡率・予定利率・予定事業費率に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>予定死亡率・予定利率・予定事業費率とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→予定死亡率・予定利率・予定事業費率の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを予定死亡率・予定利率・予定事業費率の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：予定死亡率・予定利率・予定事業費率　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 予定死亡率・予定利率・予定事業費率が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 予定死亡率・予定利率・予定事業費率 を具体例に落とします。</p>", "M": "<p><strong>予定死亡率・予定利率・予定事業費率：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "純保険料と付加保険料", "content": {"A": "\n<p>「先輩、<strong>純保険料と付加保険料</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>純保険料と付加保険料は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 純保険料と付加保険料が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。純保険料と付加保険料は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>純保険料と付加保険料という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 純保険料と付加保険料が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで純保険料と付加保険料の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ純保険料と付加保険料の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>純保険料と付加保険料＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 純保険料と付加保険料が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が純保険料と付加保険料の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ純保険料と付加保険料の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、純保険料と付加保険料に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、純保険料と付加保険料に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>純保険料と付加保険料とは何か。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 純保険料と付加保険料が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→純保険料と付加保険料の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを純保険料と付加保険料の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 さらに、具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：純保険料と付加保険料　②核心：契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。　③仕組み：Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 純保険料と付加保険料が働く時点を特定します。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 純保険料と付加保険料 を具体例に落とします。 ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>", "M": "<p><strong>純保険料と付加保険料：</strong>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>"}}, {"title": "剰余金と配当金", "content": {"A": "\n<p>「先輩、<strong>剰余金と配当金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>剰余金と配当金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで剰余金と配当金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 剰余金と配当金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 剰余金と配当金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。剰余金と配当金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>剰余金と配当金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 剰余金と配当金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで剰余金と配当金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ剰余金と配当金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>剰余金と配当金＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 剰余金と配当金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が剰余金と配当金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ剰余金と配当金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、剰余金と配当金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、剰余金と配当金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>剰余金と配当金とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 剰余金と配当金が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→剰余金と配当金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを剰余金と配当金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：剰余金と配当金　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 剰余金と配当金 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 剰余金と配当金が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 剰余金と配当金 を具体例に落とします。</p>", "M": "<p><strong>剰余金と配当金：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "有配当保険・無配当保険・準有配当保険", "content": {"A": "\n<p>「先輩、<strong>有配当保険・無配当保険・準有配当保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>有配当保険・無配当保険・準有配当保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで有配当保険・無配当保険・準有配当保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 有配当保険・無配当保険・準有配当保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 有配当保険・無配当保険・準有配当保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。有配当保険・無配当保険・準有配当保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>有配当保険・無配当保険・準有配当保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 有配当保険・無配当保険・準有配当保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで有配当保険・無配当保険・準有配当保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ有配当保険・無配当保険・準有配当保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>有配当保険・無配当保険・準有配当保険＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 有配当保険・無配当保険・準有配当保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が有配当保険・無配当保険・準有配当保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ有配当保険・無配当保険・準有配当保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、有配当保険・無配当保険・準有配当保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、有配当保険・無配当保険・準有配当保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>有配当保険・無配当保険・準有配当保険とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 有配当保険・無配当保険・準有配当保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→有配当保険・無配当保険・準有配当保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを有配当保険・無配当保険・準有配当保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：有配当保険・無配当保険・準有配当保険　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 有配当保険・無配当保険・準有配当保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 有配当保険・無配当保険・準有配当保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 有配当保険・無配当保険・準有配当保険 を具体例に落とします。</p>", "M": "<p><strong>有配当保険・無配当保険・準有配当保険：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "告知義務", "content": {"A": "\n<p>「先輩、<strong>告知義務</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<h3>何のための知識か</h3>\n<p>告知義務は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで告知義務の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 告知義務 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 告知義務が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。告知義務は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>告知義務という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 告知義務が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで告知義務の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ告知義務の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>告知義務＝「契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 具体例を最初から最後まで解説 「では 告知義務 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が告知義務の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ告知義務の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果
