<script>const chapterData={ch1:[{"title": "FPが守るべき3つのこと", "content": {"A": "<h3>A｜要点</h3><p>「先輩、最初はFPの知識じゃなくて“FPとしてどう振る舞うか”です。ここを雑にすると、どれだけ税金や保険に詳しくても駄目ですよ。」</p><p>「まず大きく押さえるのは、<strong>顧客の利益を大切にすること、顧客の秘密を守ること、そして自分の資格・権限を越えた仕事をしないこと</strong>です。」</p><p>「FPは年収、預金、借金、家族構成、相続、保険みたいな、普通なら他人に見せない情報まで扱いますよね。だから“知識がある人”である前に、“安心して情報を預けられる人”でないと仕事にならないんです。」</p><p>「それともう一つ。FP資格を持ったからといって、税理士や弁護士などの独占業務まで自由にできるわけではありません。一般的な制度説明や家計相談はできても、資格が必要な個別具体的な業務には境界があります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「では、なぜこの3つが土台なのか、一つずつつなげます。」</p><p>「一つ目は<strong>顧客本位</strong>です。相談者が住宅ローンを組むとして、FPにとって手数料の高い商品と、相談者にとって負担の小さい商品が違ったらどうするか。ここでFP自身の利益を優先したら、相談という形をしていても顧客のための助言ではなくなります。だから判断の中心には顧客の利益を置きます。」</p><p>「二つ目が<strong>守秘</strong>です。家計相談では“預金がいくら”“父から相続予定”“住宅ローンが残りいくら”なんて情報まで出てきます。それを仕事と無関係な第三者へ漏らしたら、顧客はもう安心して相談できません。情報を集める力より、その情報を適切に扱う責任の方が先にあるんです。」</p><p>「三つ目が<strong>資格・権限の境界を守ること</strong>です。ここ、試験でも実務でも大事です。FPは税金や法律について一般的な情報提供はできます。でも、“この人の具体的な税額を税務代理として処理する”“法律事件について弁護士として代理する”といった他士業の独占業務を、資格なしで行えるわけではありません。」</p><p>「え？ 顧客のためにやるならいいんじゃないか、ですか？ ……駄目です。善意かどうかと、業務を行う資格があるかは別問題です。必要なら税理士・弁護士・社会保険労務士などの専門家につなぐ。そこまで含めてFPの役割なんですよ。」</p><p>「流れにすると、<strong>顧客から重要情報を預かる → 顧客の利益を基準に助言する → 秘密を守る → 自分の専門範囲を越える部分は専門家と連携する</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一つの相談場面で全部つなげますね。」</p><p>「先輩がFPで、夫婦から『子どもが生まれたので家を買いたい』と相談されたとします。夫婦は年収、預金500万円、住宅ローン希望額、保険、親から将来援助を受ける予定まで話してくれました。」</p><p>「まず、この情報を友人との雑談で話すのは駄目ですよね。これが守秘です。次に、夫婦には3,500万円の住宅より3,000万円程度の方が家計に余裕が残ると分析できたのに、自分に都合のよい商品へ誘導する。これも顧客本位ではありません。」</p><p>「さらに夫婦から『親から500万円もらう予定なので、うちの場合の贈与税申告を全部やってください』と言われたとします。ここでFPが税の一般的な仕組みを説明するところと、税理士資格が必要な個別の税務代理等とは分けなければいけません。」</p><p>「つまり三つは別々の暗記事項ではありません。<strong>相談者の大切な情報を預かり、その人の利益のために使い、自分の権限を越える部分では専門家へつなぐ</strong>。一件の相談の中で全部つながっているんです。」</p>", "D": "<h3>D｜具体例</h3><p>「では、試験で判断できる形まで具体化します。」</p><p>「ケースです。FPのAさんが顧客Bさんから『相続税が心配です』と相談されました。Aさんは相続税の一般的な仕組みや、どんな資料を整理するとよいかを説明しました。そして個別の税務判断・申告が必要な部分は税理士へ相談するよう案内しました。」</p><p>「これはFPとして自然な対応です。なぜなら、Aさんは相談者が理解するための一般情報を提供しつつ、自分が行えない専門業務まで抱え込んでいないからです。」</p><p>「逆に、『私があなたの税額を確定して申告まで代理します。税理士資格はないけどFPだから大丈夫です』となったら話が変わります。<strong>FP資格は他士業の独占業務を解除する資格ではない</strong>からです。」</p><p>「もう一つだけ。Bさんの預金額を、Aさんが『この前のお客さん、5,000万円持ってたんですよ』と知人へ話した。名前を軽く伏せれば何でもよい、とは考えないでください。顧客情報は必要な範囲で慎重に扱う。その姿勢そのものが信頼の前提です。」</p><p>「試験では、“顧客のためなら何でもできる”という文章に注意です。正しくは、<strong>顧客本位で行動する。しかし法令・資格の境界は越えない</strong>、です。」</p>", "Q": "<h3>理解確認</h3><p>「はい、ここだけ先輩の番です。答えは下にあります。」</p><h4>Q1｜FPが顧客の預金額を仕事と無関係な知人へ話すのが問題なのはなぜ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「顧客から預かった秘密・個人情報を適切に守る必要があるからです。FPは非常に私的な情報を扱うので、守秘は相談関係の土台になります。」</p></div></details><h4>Q2｜FPなら、税理士資格がなくても顧客のために税理士の独占業務を行える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「行えるわけではありません。FPとして一般的な情報提供をすることと、他士業の独占業務を行うことは別です。必要な場合は有資格者と連携します。」</p></div></details><h4>Q3｜『顧客本位』と『法令順守』がぶつかったら、顧客の利益を優先して法律を越えてよい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「駄目です。顧客本位は法令や職業上のルールを無視してよいという意味ではありません。顧客の利益を考えながら、適法な範囲で助言・連携します。」</p></div></details>", "R": "<p>「30秒復習です。①顧客の利益を中心にする。②顧客情報を守る。③FP資格だけで他士業の独占業務までできるわけではない。④必要なら専門家と連携する。――この一本で覚えてください。」</p>", "M": "<p>「<strong>FPは、顧客の利益と秘密を守り、自分の専門範囲を越えずに支援する。</strong>」</p><p>「はい。最初の項目ですけど、ここは後の全部の土台ですよ。」</p>"}}, {"title": "キャッシュフロー表", "content": {"A": "<h3>A｜要点</h3><p>「先輩、キャッシュフロー表は“今の家計簿”ではありません。<strong>将来の家計を年ごとに予測して、収入・支出・年間収支・貯蓄残高がどう動くかを見る表</strong>です。」</p><p>「なぜ必要か。今は黒字でも、5年後に住宅購入、10年後に教育費、20年後に退職が来たら、家計の形は変わりますよね。未来の資金不足を、起きる前に見つけるためです。」</p><p>「見る順番は、家族の年齢やイベント → 収入 → 支出 → 年間収支 → 貯蓄残高。最後の貯蓄残高まで追うのが大事です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず年間収支です。これは基本的に<strong>その年の収入－その年の支出</strong>。収入500万円、支出420万円なら+80万円です。」</p><p>「でも、それだけでは家計の安全性は分かりません。前年末の貯蓄が300万円なら、単純化すれば300万円にその年の黒字80万円が加わって380万円になります。逆に教育費などで年間収支が－150万円なら、貯蓄を取り崩して150万円分減ります。」</p><p>「ここで将来の金額を考えるときは、給与上昇率や物価上昇率などの変動率を反映することがあります。たとえば現在100万円の支出が毎年2%ずつ増えるなら、翌年は102万円。その次は102万円に2%をかけるので104.04万円です。」</p><p>「先輩、ライフイベント表と混ざりそうですよね。ライフイベント表は『35歳で住宅購入』『45歳で子どもが大学』のように出来事を並べるのが中心。キャッシュフロー表は、その出来事が<strong>家計のお金をどう動かすか</strong>まで数値で追います。」</p><p>「だから流れは、<strong>将来のイベントを置く → 収入と支出を見積もる → 年間収支を出す → 貯蓄残高を更新する → 資金不足の年を見つける</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一つの家族だけ追います。夫婦30歳、貯蓄500万円。今は毎年100万円ずつ貯められているとします。」</p><p>「この数字だけ見ると順調です。でも5年後に住宅購入の頭金300万円、18年後には子どもの大学費用が大きくなる。さらに退職後は給与収入がなくなります。」</p><p>「これを頭の中だけで考えると、『今100万円黒字だから大丈夫』となりやすい。でも年ごとの表にすると、住宅購入年に貯蓄がガクッと下がり、教育費の時期にもまた下がるのが見えます。」</p><p>「つまりキャッシュフロー表は、家計を写真ではなく<strong>動画</strong>として見る道具なんです。今の残高だけではなく、時間が進んだときの変化を見る。これがイメージの中心です。」</p>", "D": "<h3>D｜具体例</h3><p>「数字を一つ、最後まで追います。」</p><p>「年初貯蓄500万円、年間収入500万円、年間支出400万円とします。年間収支は500－400＝<strong>+100万円</strong>。単純化すれば年末貯蓄は500＋100＝<strong>600万円</strong>です。」</p><p>「翌年に車購入200万円があり、通常支出400万円に車200万円が加わるなら、その年の支出は600万円。収入500万円なら年間収支は<strong>－100万円</strong>。前年末貯蓄600万円から100万円取り崩して、年末は500万円です。」</p><p>「ほら、1年目だけ見れば100万円黒字。でも2年目のイベントを入れると貯蓄は元に戻りました。これを10年、20年と続けることで、『教育費が来る前にもっと貯める必要がある』『住宅予算を少し下げよう』と早めに判断できるわけです。」</p><p>「なお、実際のFP計算では可処分所得や変動率など問題文の条件に従います。試験では<strong>何を足し、何を引き、前年の残高へどうつなぐか</strong>を丁寧に見てください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜キャッシュフロー表は何を見る表？</h4><details><summary>答えを見る</summary><div class='answer'><p>「将来の収入・支出・年間収支・貯蓄残高の推移です。“現在の家計だけ”ではありません。」</p></div></details><h4>Q2｜年初貯蓄300万円、年間収入500万円、支出450万円なら、単純化した年末貯蓄はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年間収支は+50万円なので、300＋50＝350万円です。」</p></div></details><h4>Q3｜ライフイベント表との大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「ライフイベント表は将来の出来事を整理するのが中心。キャッシュフロー表は、それを収入・支出・貯蓄残高というお金の動きまで落とし込みます。」</p></div></details>", "R": "<p>「30秒です。キャッシュフロー表＝未来の家計の動画。収入－支出＝年間収支。その収支を前年の貯蓄残高につないで、将来の資金不足を探します。」</p>", "M": "<p>「<strong>キャッシュフロー表は、将来の収支と貯蓄残高を年ごとに追って、資金不足を先に見つける表。</strong>」</p>"}}, {"title": "終価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、6係数は名前から覚えると混乱します。終価係数は方向だけ見てください。<strong>今ある一括のお金 → 将来いくらになる？</strong>です。」</p><p>「100万円を今持っていて、年3%で5年間運用したらいくらになるか。こういう問題です。」</p><p>「一言なら、<strong>現在額を将来額へ育てる係数</strong>。ここが核です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ係数が必要かというと、複利だからです。年3%なら、100万円は1年後103万円になります。」</p><p>「2年目、また元の100万円に3万円だけ付くと思ったら駄目ですよ。2年目は103万円全体に3%が付きます。103万円×1.03＝106.09万円です。」</p><p>「つまり毎年1.03倍する。5年間なら1.03を5回かけるので、<strong>1.03⁵</strong>。これが年3%・5年の終価係数に当たります。」</p><p>「式にすると、<strong>将来額＝現在額×終価係数</strong>です。」</p><p>「先輩、『5年後のお金を聞かれたら全部終価係数？』って思いました？ そこは違います。5年後100万円を作るため“今いくら必要か”なら現価係数です。大事なのは“将来”という単語ではなく、<strong>お金がどちら向きに動くか</strong>です。」</p><p>「流れは、<strong>今の一括資金 → 複利運用 → 将来の一括資金</strong>。これが終価係数です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100万円を箱に入れる場面だけ覚えましょう。箱の中のお金は毎年3%ずつ増えます。」</p><p>「1年目に3万円増えて103万円。そこで増えた3万円も箱から出しません。2年目は、その利息だった3万円まで次の利息を生みます。」</p><p>「だから箱は、100→103→106.09→……と、毎年“前の年に大きくなった箱全体”がさらに1.03倍されます。」</p><p>「終価係数という難しい名前を忘れても、<strong>今持っている一つの箱を未来まで育てる</strong>映像が出れば、現価係数や積立系の係数と区別できます。」</p>", "D": "<h3>D｜具体例</h3><p>「100万円を年3%、5年間、複利で運用します。」</p><p>「終価係数は1.03⁵≒<strong>1.1593</strong>。だから100万円×1.1593≒<strong>115万9,300円</strong>です。」</p><p>「途中も見ます。1年後103万円、2年後106.09万円。単利なら毎年3万円ずつ増えるだけですが、複利では利息にも利息が付くので、5年後は115万円ではなく約115.9万円になります。」</p><p>「では問題文が『5年後に100万円必要。年3%で運用するとして今いくら必要か』だったら？ これは100万円を未来へ増やす問題ではありません。未来100万円から現在へ戻すので<strong>現価係数</strong>です。」</p><p>「試験では数字より、この向きを見抜けるかが先です。<strong>今ある金額×係数→将来額</strong>なら終価係数。はい、ここです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜今100万円を5年間運用した将来額を求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終価係数です。現在の一括資金から将来の一括資金へ進むからです。」</p></div></details><h4>Q2｜年3%で100万円は2年後いくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「100万円×1.03²＝106.09万円です。2年目は103万円全体に3%が付きます。」</p></div></details><h4>Q3｜『5年後100万円』という言葉があれば終価係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「違います。今あるお金を5年後へ増やすなら終価係数。5年後100万円のため今いくら必要かなら現価係数です。」</p></div></details>", "R": "<p>「現在の一括資金→将来の一括資金。複利なので毎年(1＋利率)倍。将来額＝現在額×終価係数。これだけ一本につないでください。」</p>", "M": "<p>「<strong>終価係数＝今ある一括資金を複利で運用した将来額を求める。</strong>」</p>"}}, {"title": "現価係数", "content": {"A": "<h3>A｜要点</h3><p>「現価係数は終価係数を逆向きにしたものです。<strong>将来必要な一括金額 → 今いくら用意すればよい？</strong>を求めます。」</p><p>「5年後に100万円必要。でも今から運用できるなら、今100万円全部を用意する必要はありませんよね。その“今必要な額”へ割り戻すのが現価係数です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「終価係数では、今のお金に1.03を何回も掛けました。現価係数では逆です。未来の金額から現在へ戻るので、<strong>(1＋利率)の年数乗で割る</strong>方向になります。」</p><p>「年3%・5年なら、将来額＝現在額×1.03⁵でした。式を逆にすると、現在額＝将来額÷1.03⁵です。」</p><p>「ここで大事なのが“現在価値”という考え方です。5年後の100万円と今の100万円は、運用できる前提なら同じ価値として扱いません。今のお金には5年間増える時間があるからです。」</p><p>「だから、将来100万円を確保するための現在額は100万円より小さくなります。利率がプラスなら、通常、現価係数は1より小さくなります。」</p><p>「流れは、<strong>将来の目標額 → 複利分を割り戻す → 現在必要な一括資金</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「5年後の日付が書かれた箱に100万円必要だとします。先輩は今、その箱を満杯にするためのお金を準備します。」</p><p>「でも今入れたお金は5年間運用できます。今86万円台を入れて、それが毎年3%ずつ育つなら、5年後には約100万円になります。」</p><p>「つまり現価係数は、未来の箱から逆算して『今日はいくら入れればいい？』と戻ってくる考え方です。」</p><p>「終価係数が“今→未来”の早送りなら、現価係数は“未来→今”の巻き戻し。はい、この対比が一番分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「5年後に100万円必要、年3%で複利運用できるとします。」</p><p>「現在必要額＝100万円÷1.03⁵。1.03⁵≒1.1593なので、100万円÷1.1593≒<strong>86万2,600円</strong>です。」</p><p>「確認すると、約86.26万円を5年間3%で運用すると、86.26×1.03⁵≒100万円。ちゃんと未来の目標額へ戻ります。」</p><p>「では『今86.26万円ある。5年後いくら？』なら、今度は逆に終価係数です。同じ数字でも、問題が聞いている方向が反転すれば使う係数も反転します。」</p><p>「試験では、<strong>“将来必要額が先に与えられ、現在必要額を聞く”→現価係数</strong>と判断してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜5年後に300万円必要。今いくら用意すればよいか。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現価係数です。未来の目標額から現在必要額へ戻る問題だからです。」</p></div></details><h4>Q2｜なぜ現在必要額は将来必要額より小さくなり得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現在から将来まで運用して増やせるからです。その増加分をあらかじめ将来額から割り戻します。」</p></div></details><h4>Q3｜終価係数との違いを方向で答えると？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終価係数は現在→将来。現価係数は将来→現在です。」</p></div></details>", "R": "<p>「将来の一括目標額→今必要な一括資金。将来額を複利分だけ割り戻す。これが現価係数です。」</p>", "M": "<p>「<strong>現価係数＝将来必要な一括金額から、今必要な金額を逆算する。</strong>」</p>"}}, {"title": "年金終価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、ここから“一括”ではなく“毎年”になります。年金終価係数は、<strong>毎年一定額を積み立てたら、将来合計いくらになるか</strong>を求める係数です。」</p><p>「毎年10万円ずつ5年間積み立てる。そのお金を運用した結果、5年後にいくら貯まるか。これが典型です。」</p><p>「終価係数との違いは明確です。終価係数は<strong>今ある一括金</strong>、年金終価係数は<strong>毎年の積立</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ10万円×5年＝50万円で終わらないのか。積み立てたお金も運用されるからです。」</p><p>「毎年末積立を前提に考えると、最初に積み立てた10万円はその後長く運用されます。次の10万円はそれより1年短い。最後に積み立てる10万円は運用期間がほとんどありません。」</p><p>「つまり、同じ10万円でも“働く時間”が違うんです。その一つ一つの将来価値を全部足したものを、まとめて計算できるのが年金終価係数です。」</p><p>「式の意味は、<strong>毎年の積立額×年金終価係数＝一定期間後の積立総額</strong>です。」</p><p>「先輩、減債基金係数と混ざりますよね。年金終価係数は『毎年10万円積むと5年後いくら？』。減債基金係数は『5年後100万円にするには毎年いくら積む？』。入力と答えが逆なんです。」</p><p>「流れは、<strong>毎年一定額を積む → 各積立金がそれぞれ複利運用される → 将来の合計額</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「5年間、毎年末に10万円札の束を一つずつ棚へ置くイメージです。」</p><p>「1年目の束は早く棚に置かれるので長く運用されます。2年目の束は少し短い。5年目の束は最後に置かれるので、運用される時間が短い。」</p><p>「棚にある全部の束を5年目の同じ時点まで運んで、その合計を見る。これが年金終価係数です。」</p><p>「終価係数みたいに最初から50万円を一括で置いたわけではありません。お金が<strong>毎年少しずつ入ってくる</strong>。だから別の係数になるんですよ。」</p>", "D": "<h3>D｜具体例</h3><p>「毎年末10万円を5年間、年3%で積み立てるとします。」</p><p>「年金終価係数は、毎年末払いなら <strong>((1.03⁵－1)÷0.03)≒5.3091</strong>。したがって10万円×5.3091≒<strong>53万910円</strong>です。」</p><p>「元本だけなら10万円×5＝50万円。それが約53.1万円になるのは、先に積み立てたお金に運用益が付いたからです。」</p><p>「では問題を反対にして、『5年後に53万円作りたい。毎年いくら積めばいい？』と聞かれたら、年金終価係数ではなく<strong>減債基金係数</strong>を使う側になります。」</p><p>「さらに『今50万円を一括で持っていて5年後いくら？』なら終価係数。<strong>一括か毎年か、求めるのが将来額か毎年額か</strong>。この二段階で見れば6係数はかなり整理できます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎年20万円を10年間積み立てた将来額を求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数です。“毎年の積立額”が分かっていて、“将来の合計額”を求めるからです。」</p></div></details><h4>Q2｜なぜ単純な積立額×年数より将来額が大きくなり得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「先に積み立てたお金が運用され、運用益を生むからです。各年の積立金で運用期間が違います。」</p></div></details><h4>Q3｜減債基金係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。」</p></div></details>", "R": "<p>「毎年一定額→将来の積立総額。各年の積立金は運用期間が違う。毎年額×年金終価係数＝将来額。減債基金係数とは逆向きです。」</p>", "M": "<p>「<strong>年金終価係数＝毎年一定額を積み立てたときの将来の合計額を求める。</strong>」</p>"}}, {"title": "減債基金係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、減債基金係数は名前がいちばん怖そうですけど、聞いていることはかなり素直です。<strong>将来この金額を作りたい。そのために毎年いくらずつ積み立てればいい？</strong>――これを求めます。」</p><p>「たとえば10年後に300万円必要。でも今300万円を持っているわけではない。毎年少しずつ積み立てて300万円へ到達したい。こういう場面です。」</p><p>「一文なら、<strong>将来の目標額から、毎年の積立額を逆算する係数</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず、300万円÷10年＝毎年30万円でいいんじゃないか、って思いますよね。利息がゼロなら、その考え方でいいです。でも運用利率があるなら違います。」</p><p>「1年目に積み立てたお金は長く運用されます。2年目のお金はそれより1年短い。最後に積み立てるお金はほとんど運用されません。つまり、積み立てた元本だけで300万円を作る必要はなく、途中の<strong>運用益も300万円の一部</strong>になってくれるんです。」</p><p>「だから毎年必要な積立額は、単純な300万円÷年数より小さくなり得ます。その複利効果をまとめて逆算するのが減債基金係数です。」</p><p>「式の形は、<strong>毎年の積立額＝将来の目標額×減債基金係数</strong>です。」</p><p>「ここで年金終価係数との関係を見ます。年金終価係数は『毎年30万円積んだら10年後いくら？』。減債基金係数は『10年後300万円にしたいなら毎年いくら？』。同じ積立の話ですが、<strong>分かっているものと求めるものが逆</strong>なんです。」</p><p>「流れは、<strong>将来の目標額を決める → 利率と期間を確認する → 運用益を考慮する → 必要な毎年積立額へ戻す</strong>、です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「10年後、車を買う日に“300万円”と書かれた大きな箱を満杯にしたいとします。」</p><p>「先輩は毎年、同じ大きさのお金の袋をその箱へ入れていきます。ただし、早く入れた袋ほど長く運用されて少し大きくなります。1年目の袋は長く働き、9年目の袋は短く働く。最後の袋はほとんど働く時間がありません。」</p><p>「だから10個の袋の元本を足しただけで300万円にする必要はありません。袋が働いて増えた分も含めて、最後に箱が300万円になればいいんです。」</p><p>「この“最後の箱の大きさは決まっている。では毎年入れる袋はいくら？”という逆算が減債基金係数です。」</p>", "D": "<h3>D｜具体例</h3><p>「5年後に100万円を作りたい。年3%で、毎年末に同額を積み立てるとします。」</p><p>「年金終価係数は約5.3091です。これは『毎年1円ずつ積むと5年後に約5.3091円になる』という意味です。では5年後100万円にしたいなら、100万円を5.3091で割ればいい。」</p><p>「100万円÷5.3091≒<strong>18万8,356円</strong>。つまり毎年約18.84万円ずつ積み立てれば、運用益を含めて5年後に約100万円へ届く計算です。」</p><p>「単純に100万円÷5＝20万円とするより少ないですよね。この差が運用益です。」</p><p>「ここで問題が『毎年18.84万円積み立てると5年後いくら？』に変わったら、今度は年金終価係数です。<strong>将来額→毎年額が減債基金、毎年額→将来額が年金終価</strong>。この矢印で覚えてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜10年後500万円を作るため、毎年いくら積み立てるかを求める。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「減債基金係数です。将来の目標額が先に決まり、毎年の積立額を求めているからです。」</p></div></details><h4>Q2｜なぜ『目標額÷年数』だけでは不十分？</h4><details><summary>答えを見る</summary><div class='answer'><p>「積立金が途中で運用され、運用益も最終目標額の一部になるからです。各年の積立金は運用される期間も違います。」</p></div></details><h4>Q3｜年金終価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。」</p></div></details>", "R": "<p>「30秒です。将来の目標額が先。そこから毎年積立額へ逆算。運用益があるので単純な目標額÷年数とは違う。年金終価係数とは矢印が逆。はい、これです。」</p>", "M": "<p>「<strong>減債基金係数＝将来の目標額を作るための毎年の積立額を求める。</strong>」</p>"}}, {"title": "資本回収係数", "content": {"A": "<h3>A｜要点</h3><p>「資本回収係数は、今度は“今あるまとまったお金”を毎年の金額へ変える係数です。<strong>今ある元本を運用しながら一定期間で取り崩すと、毎年いくら受け取れる？</strong>を求めます。」</p><p>「退職時に1,000万円ある。この1,000万円を運用しながら10年間で使うなら、毎年いくら受け取れるか。これが典型です。」</p><p>「住宅ローンなどで、現在借りた金額から毎年の返済額を求める考え方にもつながります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、1,000万円を10年なら毎年100万円でしょ、ってなりますよね。利率ゼロならそうです。でも残っているお金を運用できるなら、毎年100万円より多く取り出しても10年間持たせられます。」</p><p>「最初に100万円を受け取ったあとも、残り900万円前後は運用されています。その運用益も次の受取資金になります。だから元本÷年数だけではないんです。」</p><p>「資本回収係数は、その<strong>元本＋運用益を一定期間で均等に回収する</strong>ための毎年額を計算します。」</p><p>「式は、<strong>毎年受取額＝現在の元本×資本回収係数</strong>です。」</p><p>「年金現価係数との違い、ここ絶対混ざります。年金現価係数は『毎年100万円受け取りたい。今いくら必要？』。資本回収係数は『今1,000万円ある。毎年いくら受け取れる？』。これも逆向きです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「退職日に1,000万円入りのタンクがあると思ってください。毎年、タンクから同じ量のお金を生活費として取り出します。」</p><p>「ただしタンクは置いてあるだけじゃありません。残っているお金が運用され、少しずつ水が追加されるように増えます。」</p><p>「だから“1,000万円÷10回”より多く取り出しても、運用益が補充してくれる分があります。そして10年後にちょうど使い切るよう、毎年取り出せる額を決める。」</p><p>「これが資本回収です。<strong>今の大きな一つの資金を、将来の毎年の受取へ分解する</strong>イメージですね。」</p>", "D": "<h3>D｜具体例</h3><p>「今100万円あり、年3%で運用しながら5年間、毎年末に同額ずつ受け取って5年後に使い切るとします。」</p><p>「年金現価係数は約4.5797なので、資本回収係数はその逆数で約0.21835。100万円×0.21835≒<strong>21万8,350円</strong>です。」</p><p>「利率ゼロなら100万円÷5＝20万円。それより約1.84万円多く毎年受け取れるのは、残っている資金が運用益を生むからです。」</p><p>「では『5年間、毎年21万8,350円を受け取りたい。今いくら必要？』なら方向が逆になり、年金現価係数です。」</p><p>「<strong>現在元本→毎年額＝資本回収。毎年額→現在元本＝年金現価</strong>。名前より矢印です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜今2,000万円ある。20年間で毎年いくら取り崩せるか。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資本回収係数です。現在の一括元本から毎年額を求めています。」</p></div></details><h4>Q2｜なぜ元本÷年数より多く受け取れる場合がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「残っている元本を運用して得る利益も、受取原資に使えるからです。」</p></div></details><h4>Q3｜年金現価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「資本回収は現在元本→毎年額。年金現価は毎年額→現在元本です。」</p></div></details>", "R": "<p>「現在の一括元本→毎年の受取額。残った元本の運用益も使う。年金現価係数とは逆向き。これが資本回収係数です。」</p>", "M": "<p>「<strong>資本回収係数＝今ある元本を運用しながら取り崩すときの毎年額を求める。</strong>」</p>"}}, {"title": "年金現価係数", "content": {"A": "<h3>A｜要点</h3><p>「年金現価係数は、<strong>将来、毎年一定額を受け取るために、今いくら元本が必要か</strong>を求めます。」</p><p>「たとえば老後5年間、毎年100万円ずつ受け取りたい。では退職時点でいくら持っていればいいのか。これを現在の一括金額へ戻す係数です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「単純なら100万円×5年＝500万円ですよね。でも元本を運用しながら受け取るなら、最初から500万円全部は必要ありません。」</p><p>「1年後に受け取る100万円と、5年後に受け取る100万円では、今必要な金額が違います。5年後の100万円は5年間運用して増やせるので、現在価値はより小さくなります。」</p><p>「その各年の受取額を一つずつ現在価値へ割り引いて、全部足したものが“今必要な元本”です。それをまとめて計算するのが年金現価係数です。」</p><p>「式は、<strong>現在必要額＝毎年の受取額×年金現価係数</strong>。」</p><p>「現価係数との違いにも注意です。現価係数は将来の一回の金額を現在へ戻す。年金現価係数は<strong>毎年続く複数回の金額</strong>をまとめて現在へ戻します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「退職後、毎年100万円入りの封筒を5回受け取りたいとします。」</p><p>「1年後の封筒、2年後の封筒、3年後……それぞれ受け取る時期が違います。だから今日準備しておく金額も同じではありません。」</p><p>「遠い将来の封筒ほど、今から長く運用できます。そこで5枚の封筒をそれぞれ現在まで巻き戻して、『今日まとめていくらあれば全部の封筒を作れる？』と足し合わせます。」</p><p>「これが年金現価係数です。未来に並んだ複数の受取を、現在の一つの元本へまとめるイメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「今後5年間、毎年末100万円ずつ受け取りたい。年3%で運用できるとします。」</p><p>「年3%・5年の年金現価係数は約<strong>4.5797</strong>。100万円×4.5797＝<strong>約457万9,700円</strong>です。」</p><p>「単純合計は500万円ですが、今約458万円あれば、残高を3%で運用しながら毎年100万円ずつ受け取る設計ができるということです。」</p><p>「『5年後に一回だけ500万円欲しい』なら年金現価係数ではありません。一回だけの将来額を今へ戻すので現価係数です。」</p><p>「『今458万円ある。毎年いくら受け取れる？』なら資本回収係数。ここも矢印で区別してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜10年間、毎年50万円受け取るため今いくら必要か。何係数？</h4><details><summary>答えを見る</summary><div class='answer'><p>「年金現価係数です。毎年の受取額から現在必要な一括元本を求めています。」</p></div></details><h4>Q2｜なぜ50万円×10年より少ない元本で済み得る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「残っている元本を受取期間中も運用でき、その運用益も将来の受取に使えるからです。」</p></div></details><h4>Q3｜現価係数との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現価係数は将来の一回の金額→現在額。年金現価係数は将来の毎年の金額→現在額です。」</p></div></details>", "R": "<p>「毎年の受取額→今必要な一括元本。複数回の将来受取を現在へ割り戻して合計する。これが年金現価係数です。」</p>", "M": "<p>「<strong>年金現価係数＝将来毎年受け取る金額から、今必要な元本を求める。</strong>」</p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<h3>A｜要点</h3><p>「先輩、こども保険、いわゆる学資保険は、<strong>子どもの進学時期に合わせて教育資金を準備するための生命保険</strong>です。」</p><p>「ただ貯金するだけではなく、商品によっては契約者である親などが死亡・所定の高度障害状態になった場合に、その後の保険料払込みが免除されても祝い金や満期保険金を受け取れる仕組みがあります。」</p><p>「つまり中心は、<strong>教育資金の積立＋契約者に万一があったときの保障</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「教育費って必要になる時期がある程度決まっていますよね。高校入学、大学入学などです。だから子どもが小さいうちから保険料を積み立て、決めた時期に祝い金や満期保険金を受け取れるよう設計します。」</p><p>「ここで普通の預金との違いが出ます。親が途中で亡くなった場合、預金ならその後の積立は止まってしまうかもしれません。でも学資保険には、契約内容によって<strong>保険料払込免除</strong>が付いているものがあります。」</p><p>「つまり親に万一があっても、以後の保険料負担を免除しながら、予定していた教育資金を確保する方向へ働くわけです。」</p><p>「ただし、“学資保険なら必ず払込保険料より多く戻る”とは限りません。契約条件、返戻率、特約、途中解約の時期などで結果は変わります。特に早期解約では解約返戻金が払込保険料総額を下回ることがあります。」</p><p>「ですから、教育資金を準備する目的と保障機能を理解したうえで、流動性や返戻率も見る必要があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「子どもが0歳、大学入学まで18年ある家庭を一つ追います。」</p><p>「親は18歳の春に入学金などでまとまったお金が必要になると考え、毎月学資保険の保険料を払います。18年間かけて“大学入学の日に開ける教育資金の箱”を作っているイメージです。」</p><p>「ところが子どもが10歳のとき、契約者である親に万一があったとします。ここで払込免除の条件を満たす契約なら、その後の保険料負担が免除されても、契約上の祝い金・満期保険金を受け取る保障が続きます。」</p><p>「これが、単純に銀行口座へ積み立てる場合にはない“保険”の部分です。教育資金を作るだけではなく、<strong>教育資金を作っている途中で親に何かあったリスク</strong>にも備えるわけですね。」</p>", "D": "<h3>D｜具体例</h3><p>「子どもが18歳のときに200万円を受け取る学資保険を考えます。親が契約者、子どもが被保険者という典型的な形です。」</p><p>「親が契約期間を通じて保険料を払い続ければ、契約に従って進学時期の祝い金や満期保険金を受け取ります。」</p><p>「では途中で親が死亡した場合。払込免除特約等の所定条件を満たすなら、その後の保険料払込みが免除され、それでも教育資金の保障は契約どおり継続します。」</p><p>「一方で、子どもが5歳の時点で『やっぱり全部解約しよう』となれば、解約返戻金がそれまでの払込保険料より少ない可能性があります。だから“いつでも自由に引き出せる教育用預金”とは性格が違います。」</p><p>「試験では、<strong>教育資金準備が目的／保険なので保障機能がある／途中解約では元本割れの可能性</strong>という三点をつなげてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜学資保険の中心的な目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「子どもの進学時期などに必要な教育資金を計画的に準備することです。」</p></div></details><h4>Q2｜普通の積立預金にはない代表的な保障機能は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「商品・契約条件によりますが、契約者である親などに万一があった場合の保険料払込免除などがあります。」</p></div></details><h4>Q3｜途中解約すれば、それまで払った保険料は必ず全額戻る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必ずではありません。解約時期や契約内容によって、解約返戻金が払込保険料総額を下回ることがあります。」</p></div></details>", "R": "<p>「教育資金を決まった時期へ準備する生命保険。親などの万一に対する払込免除がある商品もある。ただし途中解約や返戻率には注意。これです。」</p>", "M": "<p>「<strong>学資保険＝教育資金を積み立てながら、積立途中の親の万一にも備えられる生命保険。</strong>」</p>"}}, {"title": "教育一般貸付（国の教育ローン）", "content": {"A": "<h3>A｜要点</h3><p>「教育一般貸付、いわゆる国の教育ローンは、<strong>日本政策金融公庫が扱う、入学金・授業料などの教育費を準備するための公的な融資制度</strong>です。」</p><p>「ここで最初に奨学金と分けます。国の教育ローンは基本的に<strong>保護者などが借りる</strong>もの。奨学金は学生本人が貸与を受け、本人が返還するタイプが中心です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「大学入学時って、授業料だけじゃありません。入学金、受験費用、住居費、教科書代など、短期間にまとまった資金が必要になることがあります。」</p><p>「そこで、家庭の手元資金だけでは不足するときに、保護者等が教育費として借りる選択肢が国の教育ローンです。公的制度なので、利用には世帯年収など所定の要件があります。」</p><p>「先輩、ここで“国がくれるお金”ではありませんよ。<strong>貸付ですから返済が必要</strong>です。」</p><p>「そして奨学金との最大の整理ポイントは債務者です。国の教育ローンでは保護者側が借入・返済の主体になるのが基本。貸与型奨学金では学生本人が借り、卒業後などに本人が返還します。」</p><p>「教育費を準備するという目的は同じでも、<strong>誰がお金を借り、誰が返すのか</strong>が違う。ここを軸にすると混ざりません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「高校3年生の子どもが大学に合格した家庭を考えます。入学までに入学金と前期授業料などでまとまった資金が必要になりました。」</p><p>「親の預金だけでは少し足りない。そこで親が日本政策金融公庫へ教育資金の融資を申し込みます。融資を受けたお金を入学金などに使い、その後は親が契約に従って返済していきます。」</p><p>「一方、子ども自身が日本学生支援機構などの貸与型奨学金を利用した場合、基本的には子ども本人が借りた人となり、将来本人が返還します。」</p><p>「同じ大学費用でも、左側には“親が借りる国の教育ローン”、右側には“学生本人が借りる貸与型奨学金”。この二人の立ち位置を分けてください。」</p>", "D": "<h3>D｜具体例</h3><p>「大学入学時に150万円不足している家庭を考えます。」</p><p>「親が国の教育ローンから150万円を借りれば、その150万円は教育費に充てられます。ただし150万円は給付金ではなく借金なので、契約した金利・返済条件に従って親側が返済します。」</p><p>「別の方法として、学生本人が貸与型奨学金を利用する場合があります。この場合は学生本人が借り手となり、卒業後などに返還していく形が基本です。」</p><p>「だから試験で『国の教育ローンと奨学金はどちらも教育費だから同じ』とまとめたら駄目です。<strong>国の教育ローン＝主に保護者が借りる融資、貸与型奨学金＝学生本人が借りる仕組み</strong>という違いがあります。」</p><p>「なお、融資限度額・金利・所得要件などは改定されることがあります。数値問題では必ず受験年度の基準を使ってください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜国の教育ローンは給付金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「違います。教育費のための融資なので、借りたお金は返済する必要があります。」</p></div></details><h4>Q2｜国の教育ローンでは、誰が借りるのが基本？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保護者などです。貸与型奨学金で学生本人が借りる形との違いが重要です。」</p></div></details><h4>Q3｜国の教育ローンと貸与型奨学金を区別する一番分かりやすい軸は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「誰が借入・返済の主体になるかです。目的はどちらも教育資金ですが、債務者が異なります。」</p></div></details>", "R": "<p>「日本政策金融公庫の教育向け融資。主に保護者が借りて返す。給付ではない。貸与型奨学金は学生本人が借りるのが基本。ここまでです。」</p>", "M": "<p>「<strong>国の教育ローン＝教育費のために主に保護者が借りる公的融資。</strong>」</p>"}}, {"title": "奨学金制度", "content": {"A": "<h3>A｜要点</h3><p>「先輩、奨学金は“学生が学ぶためのお金を支える制度”です。ただし、ここで最初に<strong>給付型と貸与型</strong>を分けてください。」</p><p>「給付型は原則として返還不要。貸与型は借りるお金なので返還が必要です。日本学生支援機構の貸与型には、代表的に<strong>第一種＝無利子、第二種＝有利子</strong>があります。」</p><p>「国の教育ローンとの大きな違いは、貸与型奨学金では<strong>学生本人が借り手・返還者になる</strong>のが基本だということです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「大学へ行きたい。でも家庭だけでは学費を十分に用意できない。そこで修学機会を支えるのが奨学金です。」</p><p>「まず給付型。これは一定の家計・学業等の要件を満たす学生に支給され、原則として卒業後に返す必要がありません。」</p><p>「次に貸与型。名前のとおり“貸してもらう”ので、卒業後などに返還します。第一種は無利子、第二種は有利子という違いが基本です。」</p><p>「ここで『無利子なら返さなくていい？』……先輩、それは違います。無利子は<strong>利息が付かない</strong>のであって、借りた元本まで消えるわけではありません。第一種も貸与型ですから返還します。」</p><p>「そして前の項目、国の教育ローンとつなげます。国の教育ローンは主に保護者が借りて返済する融資。貸与型奨学金は学生本人が借りて返還する。この“誰の債務か”が重要です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「大学へ進学するAさんを一人追います。入学後、毎月の学費・生活費が不足するため奨学金を利用します。」</p><p>「もし給付型の対象なら、支給されたお金は原則返還不要です。一方、第二種奨学金で毎月貸与を受ければ、そのお金はAさん自身の借入です。」</p><p>「在学中は“毎月お金が入ってくる”ので給付と貸与が似て見えます。でも卒業後を見ると違いがはっきりします。給付型には原則返還がなく、貸与型ではAさん本人の返還が始まります。」</p><p>「だから奨学金を見るときは、<strong>今もらえるか</strong>だけではなく、<strong>将来返すお金なのか</strong>まで時間を進めて見るんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが大学4年間、貸与型奨学金を利用したとします。毎月5万円なら、単純な貸与元本は5万円×12か月×4年＝<strong>240万円</strong>です。」</p><p>「第一種なら無利子なので、基本的にはこの貸与元本を返還していく考え方です。第二種なら有利子なので、利息も関係します。」</p><p>「一方、同じ5万円でも給付型として支給されたものなら、所定要件を満たしている限り原則返還不要です。同じ“毎月5万円”でも法的・経済的な意味はまったく違います。」</p><p>「そして親が国の教育ローンで240万円を借りたなら、今度は親側の借入です。<strong>給付か貸与か → 貸与なら無利子か有利子か → 誰が借りているか</strong>。この順番で整理してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜第一種奨学金は無利子だから返還不要？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。第一種は無利子の“貸与型”なので、元本の返還は必要です。」</p></div></details><h4>Q2｜第二種奨学金の基本的な特徴は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「有利子の貸与型です。給付型とは違い、借りた本人が返還します。」</p></div></details><h4>Q3｜国の教育ローンとの大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「貸与型奨学金は学生本人が借り手になるのが基本なのに対し、国の教育ローンは主に保護者が借ります。」</p></div></details>", "R": "<p>「給付型＝原則返還不要。貸与型＝返還必要。第一種＝無利子、第二種＝有利子。貸与型は学生本人が借りるのが基本。はい、この4本です。」</p>", "M": "<p>「<strong>奨学金は、給付か貸与かを最初に分け、貸与型は第一種＝無利子・第二種＝有利子と整理する。</strong>」</p>"}}, {"title": "固定金利期間選択型", "content": {"A": "<h3>A｜要点</h3><p>「固定金利期間選択型は、住宅ローンの金利を<strong>最初から最後まで固定するのではなく、当初の一定期間だけ固定する</strong>方式です。」</p><p>「たとえば“当初10年固定”。最初の10年間は適用金利が固定され、その期間が終わった後は、その時点の条件に応じて金利タイプを選び直すなどします。」</p><p>「だから特徴は、<strong>固定期間中は返済計画を立てやすい。でも固定期間終了後には金利変動リスクが戻ってくる</strong>、です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンは長いですよね。30年、35年という返済期間も珍しくありません。その全部を固定するのが全期間固定金利型です。」</p><p>「一方、固定金利期間選択型では、2年、5年、10年など一定期間だけ金利を固定します。その間は市場金利が上がっても、原則として契約した固定期間の適用金利は変わりません。」</p><p>「問題は固定期間が終わった後です。その時点の金利水準で、再び固定を選ぶ、変動金利へ移るなど、商品条件に沿って次の金利が決まります。」</p><p>「先輩、『10年固定なら10年後にローンが終わる？』……違いますよ。<strong>固定される期間とローンの返済期間は別</strong>です。35年ローンで当初10年固定なら、残り25年があります。」</p><p>「つまり、当初の安心と、その後の金利変動可能性を組み合わせたタイプなんです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「35年間の長い道路を車で走ると思ってください。最初の10kmだけ“速度が固定された専用レーン”に入ります。」</p><p>「その10kmでは周囲の交通状況、つまり市場金利が変わっても、自分の設定は固定されています。」</p><p>「でも10kmを抜けたら専用レーンは終了です。その先では、その時点の道路状況に合わせて次の走り方を決めます。」</p><p>「全期間固定なら35km全部が固定レーン。変動金利なら途中で金利が見直される可能性がある。固定金利期間選択型はその中間、とイメージすると分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「3,000万円を35年返済で借り、当初10年間を固定金利にしたとします。」</p><p>「借入から10年間は、その固定期間に定められた金利を基礎に返済します。この間に市場金利が上昇しても、“市場が上がったから翌月すぐ適用金利も上がる”というタイプではありません。」</p><p>「でも11年目以降は別です。固定期間終了時の金利水準が高くなっていれば、次に選ぶ金利条件によっては返済負担が増える可能性があります。」</p><p>「だから『固定金利だから35年間安心』は誤り。正しくは<strong>固定を選択した期間について金利が固定される</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜35年ローンで10年固定を選ぶと、10年で返済終了？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。10年は金利を固定する期間であって、返済期間そのものではありません。」</p></div></details><h4>Q2｜固定期間中に市場金利が上昇したら、適用金利はすぐ上がる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「固定期間中は原則として契約した固定金利が適用されます。」</p></div></details><h4>Q3｜全期間固定との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「全期間固定は返済期間を通じて金利を固定します。固定金利期間選択型は一定期間だけ固定し、終了後は再設定されます。」</p></div></details>", "R": "<p>「一定期間だけ固定。期間中は金利が安定。期間終了後はその時点の条件で再設定。返済期間と固定期間は別。ここです。」</p>", "M": "<p>「<strong>固定金利期間選択型＝住宅ローンのうち、選んだ一定期間だけ金利を固定する方式。</strong>」</p>"}}, {"title": "元利均等返済と元金均等返済", "content": {"A": "<h3>A｜要点</h3><p>「ここは名前を分解します。<strong>元利均等＝元金＋利息を合わせた毎回の返済額をほぼ一定</strong>。<strong>元金均等＝毎回返す元金部分を一定</strong>です。」</p><p>「元利均等は返済額が安定して家計管理しやすい。元金均等は最初の返済額が大きい代わりに元金が早く減り、同条件なら総利息を抑えやすい。これが大きな違いです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず利息は何にかかるか。基本は<strong>その時点のローン残高</strong>です。だから元金を早く減らせば、その後の利息も小さくなります。」</p><p>「元利均等では、毎月の“元金＋利息”をほぼ一定にします。返済初期は残高が大きいので利息部分が多く、その分、元金返済部分は小さめです。返済が進むと利息が減り、同じ返済額の中で元金部分が増えていきます。」</p><p>「元金均等では、元金部分を毎回同じ額ずつ返します。そこへ残高に応じた利息を足します。最初は残高が大きいので利息も大きく、返済額は重い。でも元金が一定のペースでしっかり減るので、利息もどんどん小さくなります。」</p><p>「だから同じ借入額・金利・返済期間なら、一般に<strong>当初返済額は元金均等の方が大きい／総返済額は元金均等の方が小さくなりやすい</strong>という関係になります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100個の重い箱が積まれていて、その箱の数に応じて毎回“利息”という使用料がかかると思ってください。」</p><p>「元金均等は毎回同じ数の箱を確実に片づけます。だから箱の山が早く低くなり、次回以降の使用料も早く減ります。」</p><p>「元利均等は“毎回払う総額を同じにする”ことを優先します。最初は使用料が高いので、箱そのものを片づける分は少なくなります。」</p><p>「どちらも最終的には返します。でも<strong>返済額を平らにするのか、元金の減り方を平らにするのか</strong>が違うんです。」</p>", "D": "<h3>D｜具体例</h3><p>「仕組みが見えるように、120万円を年12%・12回払いという単純化した例で考えます。実際の商品条件ではなく比較用ですよ。」</p><p>「元金均等なら元金は毎回10万円。最初の月の利息を単純に月1%とすれば、120万円×1%=1万2,000円。初回返済は<strong>11万2,000円</strong>です。」</p><p>「1回返すと元金残高は110万円。次の利息は1万1,000円なので、2回目返済は<strong>11万1,000円</strong>。こうして返済額が徐々に下がります。」</p><p>「元利均等では、毎回の総返済額を一定にするよう計算します。初期は利息の割合が大きく、後半になるほど元金部分が増えます。」</p><p>「試験で『元金均等返済は毎回の返済総額が一定』と出たら×です。一定なのは<strong>元金部分</strong>。毎回の総額がほぼ一定なのが元利均等です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎回の元金＋利息の返済額をほぼ一定にするのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「元利均等返済です。」</p></div></details><h4>Q2｜同条件なら、元金が早く減り総利息を抑えやすいのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「元金均等返済です。毎回一定額の元金を返すので残高が早く減ります。」</p></div></details><h4>Q3｜元金均等返済の毎回の総返済額は一定？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。元金部分が一定で、利息は残高とともに減るので、総返済額も通常は徐々に減ります。」</p></div></details>", "R": "<p>「元利均等＝総返済額を平らに。元金均等＝元金部分を平らに。元金均等は当初重いが残高が早く減り、総利息を抑えやすい。これです。」</p>", "M": "<p>「<strong>元利均等は“支払額一定”、元金均等は“元金一定”。</strong>」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<h3>A｜要点</h3><p>「繰上げ返済は、住宅ローンなどで<strong>予定より早く元金の一部を返す</strong>ことです。」</p><p>「その効果の出し方が二つ。<strong>期間短縮型＝毎回の返済額を大きく変えず、完済を早める</strong>。<strong>返済額軽減型＝返済期間を大きく変えず、毎回の返済額を下げる</strong>です。」</p><p>「同じ金額を同じ時点で繰り上げるなら、一般に期間短縮型の方が利息軽減効果は大きくなりやすいです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ繰上げ返済で利息が減るのか。追加で払ったお金が<strong>元金の返済</strong>に充てられるからです。」</p><p>「たとえば残高2,000万円のうち100万円を先に返せば、その100万円はもう将来のローン残高として残りません。なら、その100万円に将来かかるはずだった利息も発生しなくなります。」</p><p>「期間短縮型では、毎月返済額をおおむね維持しながら、後ろの返済期間を切り落とします。利息が発生する期間そのものが短くなるので、利息軽減効果が大きくなりやすいです。」</p><p>「返済額軽減型では、完済時期を大きく変えず、残った期間の毎回返済額を再計算して下げます。総利息も減りますが、“今後の月々の負担を軽くする”効果を重視する方法です。」</p><p>「ですから、目的が<strong>総支払利息をより減らしたい</strong>なら期間短縮型、<strong>毎月の家計を楽にしたい</strong>なら返済額軽減型、という方向性で理解できます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「30段ある長い階段を、毎月1段ずつ下りて完済するイメージです。途中で繰上げ返済という“5段分のジャンプ”ができるとします。」</p><p>「期間短縮型は、その場で5段飛ばして、今までと同じペースで進む。だからゴールへ5段分早く着きます。」</p><p>「返済額軽減型は、ゴールの日はなるべくそのままにして、残った階段を一段一段もっと軽い負担で下りるイメージです。」</p><p>「どちらも元金を先に減らしているので利息は減ります。ただ、期間短縮型は“利息が付く時間”まで削るので、利息削減効果が大きくなりやすいんです。」</p>", "D": "<h3>D｜具体例</h3><p>「住宅ローン返済中に、手元資金から100万円を繰上げ返済するとします。」</p><p>「期間短縮型なら、その100万円で将来返す予定だった元金を前倒しし、月々の返済額はおおむね維持したまま完済時期を早めます。たとえば残り20年だったものが、条件によって19年数か月になる、といった方向です。」</p><p>「返済額軽減型なら、残り20年という期間を基本的に維持しながら、100万円減った元金を基に毎月返済額を計算し直します。完済時期より、月々の負担を下げる方へ効果を使います。」</p><p>「ここで注意。繰上げ返済をすればするほど常に正解、ではありません。手元の生活予備資金まで使い切れば、急な病気や失業に対応できなくなります。FPではローン残高だけでなく家計全体を見る必要があります。」</p><p>「試験上の軸は、<strong>期間短縮＝完済を早める・利息軽減大きめ、返済額軽減＝期間を維持し月返済を下げる</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜毎月返済額を大きく変えず、完済を早めるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「期間短縮型です。」</p></div></details><h4>Q2｜毎月の家計負担を下げたい場合に向くのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「返済額軽減型です。返済期間を基本的に維持し、毎回の返済額を下げます。」</p></div></details><h4>Q3｜同額・同時点の繰上げ返済なら、一般に利息軽減効果が大きいのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「期間短縮型です。元金を前倒しするだけでなく、利息が発生する返済期間も短縮するためです。」</p></div></details>", "R": "<p>「繰上げ返済＝元金を前倒し。期間短縮型＝完済を早める。返済額軽減型＝月々を軽くする。利息削減は一般に期間短縮型が大きめ。これです。」</p>", "M": "<p>「<strong>期間短縮型は“早く終える”、返済額軽減型は“毎月を軽くする”。</strong>」</p>"}}, {"title": "財形住宅融資", "content": {"A": "<h3>A｜要点</h3><p>「財形住宅融資は、<strong>財形貯蓄をしている勤労者などが、一定の要件を満たして住宅取得・改良資金を借りられる公的な住宅融資制度</strong>です。」</p><p>「ポイントは“財形貯蓄をしている人向け”というつながりです。財形貯蓄と住宅取得支援がセットになっているんですね。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「会社員などが給与天引きで財形貯蓄を続けているとします。その人が住宅を購入・建設・改良するとき、一定の加入期間や残高などの要件を満たせば財形住宅融資を利用できる場合があります。」</p><p>「つまり誰でも住宅を買えば使える融資ではありません。<strong>財形制度を利用してきた勤労者</strong>であることが入口になります。」</p><p>「融資可能額については、財形貯蓄残高との関係や上限など所定のルールがあります。また金利の仕組みも、フラット35のような全期間固定とは異なります。」</p><p>「先輩、財形“住宅貯蓄”をしていないと絶対駄目、と思いました？ そこは名称に引っ張られないでください。財形住宅融資の利用要件では、対象となる<strong>財形貯蓄</strong>の加入状況を確認します。細かな加入期間・残高・融資上限等は受験年度の基準で押さえます。」</p><p>「試験では、財形貯蓄制度そのものと、そこから住宅取得時に利用できる融資制度を別々にしつつ、関係づけて覚えるのが大切です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが、毎月給与から自動的に財形貯蓄を続けているとします。」</p><p>「数年後、Aさんが家を買うことになりました。銀行の一般的な住宅ローンだけでなく、“これまで財形制度を利用してきた勤労者向けの住宅融資”という選択肢が出てきます。それが財形住宅融資です。」</p><p>「つまり、会社員としてコツコツ財形で貯める道と、住宅取得時に融資を受ける道が一本につながっています。」</p><p>「“住宅ローンの一種”だけで覚えるより、<strong>財形貯蓄を続けてきた人が住宅取得時に使う制度</strong>という人物像まで置くと忘れにくいですよ。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんは勤務先を通じて財形貯蓄を継続し、住宅購入を考えています。」</p><p>「このときAさんは、財形貯蓄の加入期間や残高など所定要件を満たしているか確認し、財形住宅融資の対象になるか検討します。」</p><p>「一方、Bさんは財形制度をまったく利用していません。Bさんが住宅を買うからといって、“住宅という言葉が付くから財形住宅融資を当然利用できる”わけではありません。」</p><p>「ここがフラット35との違いを考える入口です。フラット35は住宅金融支援機構と民間金融機関が連携する全期間固定金利型住宅ローン。財形住宅融資は<strong>財形貯蓄を行う勤労者向けという利用者側の条件</strong>が大きな特徴です。」</p><p>「なお、加入期間、残高要件、融資限度額、金利などの具体的数値は改定され得るため、数値は受験年度の資料で確認してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜財形住宅融資は、誰でも住宅を買えば利用できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。財形貯蓄を行っている勤労者などについて、所定の加入期間・残高等の要件があります。」</p></div></details><h4>Q2｜制度の目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「財形制度を利用する勤労者の住宅取得・建設・改良などを融資面から支援することです。」</p></div></details><h4>Q3｜フラット35との分かりやすい違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「財形住宅融資は財形貯蓄を行う勤労者向けという利用要件が特徴です。フラット35は全期間固定金利型住宅ローンという金利構造が大きな特徴です。」</p></div></details>", "R": "<p>「財形貯蓄をしている勤労者向けの住宅融資。住宅を買うだけで誰でも対象ではない。フラット35とは制度の入口と金利構造が違う。これです。」</p>", "M": "<p>「<strong>財形住宅融資＝財形貯蓄を続ける勤労者の住宅取得を支える融資制度。</strong>」</p>"}}, {"title": "フラット35", "content": {"A": "<h3>A｜要点</h3><p>「先輩、フラット35の核は名前の“35”より、<strong>全期間固定金利</strong>です。民間金融機関と住宅金融支援機構が提携して提供する住宅ローンで、借入時に返済終了までの借入金利が確定します。」</p><p>「つまり返済途中で市場金利が上がっても、全期間固定という基本構造なら、それを理由に適用金利が上がるタイプではありません。長期間の返済計画を立てやすいのが大きな特徴です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンは数十年続きます。その間に世の中の金利が上がるか下がるかは分かりません。変動金利なら金利上昇が将来の返済負担に影響する可能性があります。」</p><p>「フラット35では、資金を受け取る時点で返済終了までの借入金利が確定します。だから“5年後に市場金利が上がったら返済金利も同じように上がるのでは”という不確実性を抑えられます。」</p><p>「ただし、“フラット35なら誰でも同じ金利”という意味ではありません。借入期間、融資率、団体信用生命保険の種類、取扱金融機関などによって借入金利は異なり得ます。また一定期間の金利引下げメニューもあります。」</p><p>「固定金利期間選択型との違いも重要です。当初10年固定なら、10年後に次の金利条件を考える必要があります。フラット35は基本的に<strong>借入時から返済終了まで全期間固定</strong>。ここが違います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「35年続く長い住宅ローンの道路を想像してください。」</p><p>「変動金利なら、道路の途中で金利という坂の傾斜が変わる可能性があります。当初10年固定なら、最初の10年間だけ傾斜を固定して、その後はまた条件が変わる可能性があります。」</p><p>「フラット35は、スタート地点でゴールまでの基本的な傾斜を決めて走り出すイメージです。世の中の金利が途中で上昇しても、自分のローンは全期間固定という設計です。」</p><p>「だから“将来の金利上昇が怖いので、返済計画を固めたい”という人にとって意味があるんですね。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが3,000万円を長期返済で借りるとします。」</p><p>「変動金利型なら、将来の金利見直しによって返済負担が変化する可能性があります。一方、フラット35なら借入時に返済終了までの借入金利が確定するので、将来の市場金利上昇による金利変動リスクを避けやすくなります。」</p><p>「ただし、“全期間固定＝必ず最も安い”ではありません。将来市場金利が下がった場合、固定された金利が相対的に高く見えることもあります。固定金利は将来の金利を当てる制度ではなく、<strong>返済条件の不確実性を減らす仕組み</strong>と考えてください。」</p><p>「試験では、<strong>住宅金融支援機構＋民間金融機関／全期間固定／最長35年が基本</strong>という柱を押さえます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜フラット35の最重要な金利上の特徴は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「全期間固定金利です。借入時に返済終了までの借入金利が確定します。」</p></div></details><h4>Q2｜当初10年固定型との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「当初10年固定型は一定期間だけ固定ですが、フラット35は基本的に返済期間全体を固定します。」</p></div></details><h4>Q3｜全期間固定なら、どの利用者も同じ金利？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。借入期間、融資率、団信の種類、金融機関等によって異なり得ます。」</p></div></details>", "R": "<p>「30秒です。民間金融機関＋住宅金融支援機構。全期間固定。借入時に返済終了までの金利が確定。だから長期の返済計画を立てやすい。ここです。」</p>", "M": "<p>「<strong>フラット35＝住宅金融支援機構と民間金融機関が提携する、全期間固定金利型の住宅ローン。</strong>」</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "<h3>A｜要点</h3><p>「財形貯蓄制度は、勤労者が勤務先を通じ、<strong>給与などから天引きして計画的に貯蓄する制度</strong>です。」</p><p>「種類は3つ。<strong>一般財形貯蓄＝使い道自由、財形年金貯蓄＝老後の年金目的、財形住宅貯蓄＝住宅取得・増改築目的</strong>です。」</p><p>「そして税制優遇があるのは、基本的に年金財形と住宅財形。一般財形には利子等の非課税措置はありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず一般財形。目的を限定せず使える貯蓄です。旅行でも教育でも構いません。その自由さと引き換えに、利子等について財形年金・住宅のような非課税措置はありません。」</p><p>「財形年金は老後資金を作るもの。55歳未満の勤労者が契約し、5年以上積み立て、60歳以降の所定時期から5年以上にわたり年金として受け取ることを目的にします。」</p><p>「財形住宅も55歳未満の勤労者が契約し、5年以上積み立て、住宅取得や増改築などに使うことを目的とします。」</p><p>「現在の制度では、財形年金と財形住宅を合わせて<strong>元利合計550万円まで</strong>から生じる利子等について非課税措置があります。ただし生命保険等を利用する財形年金には別の払込限度の扱いがあります。」</p><p>「先輩、“財形なら全部550万円非課税”は×ですよ。一般財形はここに入りません。目的を制限する年金・住宅に税制上のメリットを付けている、と理解してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんの給与明細を思い浮かべてください。給与が口座へ入る前に、毎月一定額が自動的に財形へ移されます。」</p><p>「そのお金を何に使うか決めていない箱が“一般”。60歳以降に開ける老後用の箱が“年金”。家を買ったりリフォームしたりするときに開ける箱が“住宅”です。」</p><p>「年金箱と住宅箱は使い道を縛る代わりに、一定範囲で利子等の非課税という優遇があります。一般箱は自由ですが、その非課税優遇はありません。」</p><p>「三つの箱を“目的・年齢・税制”で見れば、名前だけ暗記しなくても整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが毎月2万円を給与天引きで積み立てるとします。」</p><p>「将来の用途を限定せず自由に使いたいなら一般財形。老後に年金として受け取りたいなら財形年金。数年後のマイホーム取得資金として準備したいなら財形住宅、というように目的が変わります。」</p><p>「財形年金と財形住宅については、現在、両方を合わせて元利550万円までの範囲で利子等の非課税措置があります。『年金550万円＋住宅550万円＝合計1,100万円』ではありません。<strong>原則として両者を合算して550万円</strong>です。」</p><p>「また財形制度を続けることは、前に出てきた財形住宅融資につながります。貯める制度と借りる制度を別々にせず、一本で覚えてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜一般財形貯蓄の使い道は住宅や年金に限定される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。一般財形は使途自由です。」</p></div></details><h4>Q2｜財形年金と財形住宅の利子等非課税限度は、それぞれ550万円ずつ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「×です。原則として両者を合わせて元利合計550万円までです。」</p></div></details><h4>Q3｜一般財形にも同じ非課税措置がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「ありません。一般財形の利子等は課税されます。」</p></div></details>", "R": "<p>「一般＝自由・非課税優遇なし。年金＝老後。住宅＝住宅取得等。年金＋住宅は原則合算550万円まで利子等非課税。給与天引きで積み立てる。これです。」</p>", "M": "<p>「<strong>財形貯蓄＝給与天引きで財産形成し、一般・年金・住宅の3種類を目的と税制で分ける。</strong>」</p>"}}, {"title": "団体信用生命保険", "content": {"A": "<h3>A｜要点</h3><p>「団体信用生命保険、団信は、住宅ローンの返済中に<strong>借りた人が死亡したり所定の高度障害状態になったりした場合、保険金で住宅ローン残高を返済するための生命保険</strong>です。」</p><p>「遺族へ現金を渡すこと自体が中心ではなく、住宅ローン債務をなくす方向に働く。ここが普通の死亡保険との見え方の違いです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「住宅ローンを3,000万円借りた人が亡くなったとします。家族は収入を失ううえに、ローンまで残ったら大きな負担ですよね。」</p><p>「そこで団信では、所定の保険事故が起きたときに保険金が住宅ローン残高の返済へ充てられます。結果として、遺族は住宅ローン債務がなくなった住宅を引き継げる形になります。」</p><p>「ここで大切なのは、保険金額のイメージです。一般の定額死亡保険なら“死亡したら3,000万円”のように契約します。一方、団信は住宅ローン残高と連動して保障が小さくなっていくのが基本です。返済が進んで残高が減れば、必要な返済額も減るからです。」</p><p>「また、死亡・高度障害だけでなく、がんや三大疾病などを保障する特約付きの商品もありますが、保障範囲や条件は商品ごとに確認が必要です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「住宅の横に“ローン残高メーター”があると思ってください。借入直後は3,000万円。返済するたびに2,900万、2,800万……と下がります。」</p><p>「そのメーターの横を団信がずっと見ています。もし返済途中で契約上の死亡等が起きたら、団信が残っているローンを返済する方向に働き、メーターを0へ持っていきます。」</p><p>「だから団信は、“家族へ3,000万円を自由に使える現金として渡す箱”というより、<strong>残った住宅ローンを消すための安全装置</strong>と考えると分かりやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが住宅ローン3,000万円を借り、団信に加入したとします。」</p><p>「10年後、返済が進んでローン残高が2,100万円になった時点で、Aさんが団信の保障対象となる死亡をしたとします。」</p><p>「この場合、団信の保険金によって残高2,100万円が返済される仕組みなら、家族がその2,100万円の住宅ローンをそのまま背負うことを避けられます。」</p><p>「ここで“最初3,000万円借りたから遺族へ3,000万円現金が支払われる”と考えるのは違います。中心は<strong>その時点のローン残高の返済</strong>です。」</p><p>「住宅ローンと生命保険を考えるとき、団信で住宅費リスクがどこまで消えるかを確認してから、別の死亡保障がいくら必要か考える、というつながりも大切です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜団信の中心的な役割は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「借主が死亡・所定の高度障害状態などになった際、保険金で住宅ローン残高を返済することです。」</p></div></details><h4>Q2｜借入時3,000万円なら、10年後に死亡しても遺族へ必ず3,000万円現金が渡る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「その理解は誤りです。団信は基本的に、その時点の住宅ローン残高を返済する仕組みです。」</p></div></details><h4>Q3｜返済が進むと団信で必要な保障額が減っていくのはなぜ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「住宅ローン残高自体が減っていくからです。」</p></div></details>", "R": "<p>「団信＝住宅ローンの安全装置。死亡・所定の高度障害等で残債を返済。遺族への自由な現金給付というよりローン残高を0にする方向。これです。」</p>", "M": "<p>「<strong>団信＝借主に万一があったとき、保険で住宅ローン残高を返す仕組み。</strong>」</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<h3>A｜要点</h3><p>「住宅ローンの借り換えは、<strong>今の住宅ローンを別の住宅ローンで返済して、新しい条件のローンへ乗り換えること</strong>です。」</p><p>「主な目的は金利を下げて総返済額を減らす、固定金利へ変えて金利上昇リスクを抑えるなどです。ただし手数料や登記関係費用などがかかるので、“金利が低い＝必ず得”ではありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「仕組みからいきます。今A銀行に2,000万円の住宅ローンが残っている。B銀行で新たに2,000万円前後を借り、その資金でA銀行のローンを完済します。その後はB銀行へ返済する。これが借り換えです。」</p><p>「なぜそんなことをするか。一つは金利差です。残高が大きく、残り期間が長いほど、金利が下がる効果は積み上がりやすくなります。」</p><p>「もう一つは金利タイプの変更。変動金利から全期間固定へ借り換えれば、必ず総支払額が減るとは限りませんが、将来の金利上昇リスクを抑える目的があります。」</p><p>「ただし新規のローン契約になるので、事務手数料、抵当権の抹消・設定に関する費用などが発生し得ます。だから比較するのは“金利だけ”ではなく、<strong>借り換え後の利息＋諸費用まで含めた総負担</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩が月額の高いスマホ契約を使っていて、別会社に安いプランが出たとします。」</p><p>「乗り換えれば毎月は安くなる。でも解約・契約時の費用が10万円かかる。月500円しか安くならないなら、費用を取り戻すのに長い時間がかかりますよね。」</p><p>「住宅ローンも同じです。新しい金利だけ見て“安い！”と飛びつくのではなく、乗り換え費用を払っても最終的に得かを見る。」</p><p>「しかも住宅ローンは金額が大きいので、<strong>残高・残存期間・金利差・諸費用</strong>の4つをまとめて判断する必要があります。」</p>", "D": "<h3>D｜具体例</h3><p>「残高2,000万円、残り20年の住宅ローンがあるとします。現在より低い金利のローンへ借り換えることで、将来の利息が80万円減ると仮定します。」</p><p>「でも借り換えに事務手数料や登記費用など合計50万円かかるなら、単純化した実質的な改善額は80－50＝<strong>30万円</strong>です。」</p><p>「もし利息が30万円しか減らないのに諸費用50万円なら、金利だけは低くなっても総負担は20万円増えます。」</p><p>「だから『借り換え後の金利＜現在の金利』だけでは判定できません。」</p><p>「また借り換えには審査もあります。現在の収入・健康状態・物件などの条件によって希望どおり利用できるとは限りません。試験ではまず、<strong>金利差だけでなく諸費用を考える</strong>ことを押さえてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜借り換えとは何をすること？</h4><details><summary>答えを見る</summary><div class='answer'><p>「新しい住宅ローンを借り、その資金で現在のローンを完済し、新しいローンへ乗り換えることです。」</p></div></details><h4>Q2｜新ローンの金利が低ければ必ず得？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。事務手数料や登記費用などの諸費用を含めて総負担を比較する必要があります。」</p></div></details><h4>Q3｜金利を下げる以外の借り換え目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「変動金利から固定金利へ変更して、将来の金利上昇リスクを抑えることなどがあります。」</p></div></details>", "R": "<p>「新ローンで旧ローンを完済して乗り換える。目的は利息削減や金利リスク変更。判断は金利だけでなく残高・期間・金利差・諸費用。ここです。」</p>", "M": "<p>「<strong>住宅ローンの借り換え＝新しいローンで旧ローンを完済し、諸費用込みで条件改善を狙う。</strong>」</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<h3>A｜要点</h3><p>「健康保険の被保険者が亡くなったとき、埋葬に関する給付として<strong>埋葬料</strong>または<strong>埋葬費</strong>があります。」</p><p>「被保険者に生計を維持されていた人がいるなら、その人に埋葬料として<strong>5万円</strong>。そのような人がいない場合、実際に埋葬を行った人に、実際の埋葬費用の範囲で<strong>上限5万円</strong>の埋葬費が支給されます。」</p><p>「さらに被扶養者が亡くなった場合は、被保険者に<strong>家族埋葬料5万円</strong>が支給されます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、埋葬料と埋葬費、名前が似ていますよね。でも“誰に支払うか”で分けると簡単です。」</p><p>「被保険者が亡くなり、その人に生計を維持されていた人がいる場合、その人へ埋葬料5万円が支給されます。」</p><p>「では生計を維持されていた人がいない場合はどうするか。実際に葬儀など埋葬を行い、費用を負担した人へ埋葬費を支給します。ただしこちらは一律5万円ではなく、<strong>実際に埋葬に要した費用の範囲で上限5万円</strong>です。」</p><p>「被扶養者、たとえば健康保険上の扶養に入っている家族が亡くなった場合には、被保険者へ家族埋葬料5万円です。」</p><p>「つまり、死亡した人が被保険者なのか被扶養者なのか、被保険者死亡なら生計維持関係のある人がいるか、という順番で見ます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社員Aさんが健康保険の被保険者で、配偶者BさんがAさんに生計を維持されているとします。」</p><p>「Aさんが亡くなった場合、Bさんには埋葬料5万円が支給されます。ここでは“実際の葬儀代が3万円だったから3万円だけ”という計算ではありません。」</p><p>「一方、Aさんに生計を維持されていた人がおらず、友人Cさんが実際に埋葬を行って4万円を負担したとします。この場合は埋葬費として実費4万円。上限は5万円です。」</p><p>「さらに逆に、被扶養者Bさんが亡くなったなら、被保険者Aさんに家族埋葬料5万円。この三場面を並べると整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「ケースを数字で分けます。」</p><p>「①被保険者Aさん死亡。Aさんに生計を維持されていた妻Bさんがいる。→ Bさんへ<strong>埋葬料5万円</strong>。」</p><p>「②被保険者Cさん死亡。生計維持関係にある人はいない。友人Dさんが実際に埋葬を行い3万8,000円を負担した。→ Dさんへ<strong>埋葬費3万8,000円</strong>。上限5万円なので実費を超えて5万円もらうわけではありません。」</p><p>「③被保険者Eさんの被扶養者である家族Fさんが死亡。→ Eさんへ<strong>家族埋葬料5万円</strong>。」</p><p>「試験の引っかけは“埋葬費も常に一律5万円”です。違います。<strong>埋葬料は5万円、埋葬費は実費で上限5万円</strong>。ここを分けてください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜被保険者に生計を維持されていた人へ支給される埋葬料はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「5万円です。」</p></div></details><h4>Q2｜生計維持関係にある人がおらず、実際の埋葬費が3万円だった場合、埋葬費はいくら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則3万円です。埋葬費は実際に要した費用の範囲で上限5万円だからです。」</p></div></details><h4>Q3｜被扶養者が亡くなった場合は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「被保険者に家族埋葬料として5万円が支給されます。」</p></div></details>", "R": "<p>「被保険者死亡＋生計維持者あり＝埋葬料5万円。なし＝実際に埋葬した人へ実費・上限5万円の埋葬費。被扶養者死亡＝家族埋葬料5万円。はい、三つです。」</p>", "M": "<p>「<strong>埋葬料は5万円、埋葬費は実費で上限5万円、被扶養者死亡は家族埋葬料5万円。</strong>」</p>"}}, {"title": "任意継続被保険者", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>任意継続被保険者</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 任意継続被保険者 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。 仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 任意継続被保険者の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。 仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。任意継続被保険者は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 任意継続被保険者 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 任意継続被保険者の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。任意継続被保険者は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。 仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 任意継続被保険者 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、任意継続被保険者の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。 仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要にな 率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。公的保険と私的保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 公的保険と私的保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。公的保険と私的保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 公的保険と私的保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、公的保険と私的保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>公的保険と私的保険を一言でいうと？</b></p><details><summary>答えを見 /strong>」</p><p>「はい。用語だけで終わらせません。保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。」</p><p>「ここで『具体的には？』って思いますよね。事故率が2%でも100人なら0件=0%や5件=5%と大きく振れます。でも1万人なら198件=1.98%、205件=2.05%で、2%付近に安定しやすくなります。」</p><p>「つまり、<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。事故率が2%でも100人なら0件=0%や5件=5%と大きく振れます。でも1万人なら198件=1.98%、205件=2.05%で、2%付近に安定しやすくなります。」</p><p>「この場面を最初から追うと、保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 その結果、<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、大数の法則の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。1万人×事故率2%=約200件。1件100万円なら期待保険金は約2億円です。個人の事故時期を予言する法則ではありません。」</p><p>「なぜこの結果になるかというと、保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>大数の法則を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</p><p>②なぜ？ → 保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。</p><p>③イメージ → 事故率が2%でも100人なら0件=0%や の期待損失を契約者全体の純保険料で負担します。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「大数の法則=確率を安定させる考え方、収支相等=集団全体の収入と支出を釣り合わせる考え方です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 保険集団全体で、純保険料の総額と支払う保険金・給付金の総額が等しくなるよう設計する原則です。</p><p>②なぜ？ → 大数の法則で事故発生率を見積もり、その期待損失を契約者全体の純保険料で負担します。</p><p>③イメージ → 100人から純保険料1万円ずつ集めれば100万円。事故5件に20万円ずつ支払えば合計100万円で釣り合います。</p><p>④具体例 → 事故が予想より大きく振れる小集団では収支も不安定です。だから大数の法則による安定した事故率の見積りが先に必要になります。</p><p>⑤違い → 大数の法則=確率を安定させる考え方、収支相等=集団全体の収入と支出を釣り合わせる考え方です。</p>", "M": "<p>「一文で覚えるなら――<strong>保険集団全体で、純保険料の総額と支払う保険金・給付金の総額が等しくなるよう設計する原則です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "クーリングオフ", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>クーリングオフ</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず クーリングオフ が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → クーリングオフの条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。クーリングオフは単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず クーリングオフ が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係 e": "ヒューマン・ヴァリュー特約", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>ヒューマン・ヴァリュー特約</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。ヒューマン・ヴァリュー特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。ヒューマン・ヴァリュー特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p> けを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 退院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 退院特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支 h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。」</p><p>「ここで『具体的には？』って思いますよね。終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。」</p><p>「つまり、<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。」</p><p>「この場面を最初から追うと、保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。 その結果、<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、払済保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。新たな保険料を払うのではなく、今まで積み上がった解約返戻金を元手に小さい保険へ作り替えるイメージです。」</p><p>「なぜこの結果になるかというと、保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>払済保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</p><p>②なぜ？ → 保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。</p><p>③イメージ → 終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。</p><p>④具体例 → 新たな保険料を払うのではなく、今まで積み上がった解約返戻金を元手に小さい保険へ作り替えるイメージです。</p><p>⑤違い → 払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。</p>", "M": "<p>「一文で覚えるなら――<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "延長保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>延長保険</strong>はまずこれです。<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>」</p><p>「はい。用語だけで終わらせません。保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。」</p><p>「ここで『具体的には？』って思いますよね。死亡保障1,000万円の契約を維持できなくなった人が、1,000万円という金額を原則残す代わりに保障期間を短くします。」</p><p>「つまり、<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。死亡保障1,000万円の契約を維持できなくなった人が、1,000万円という金額を原則残す代わりに保障期間を短くします。」</p><p>「この場面を最初から追うと、保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 その結果、<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、延長保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。解約返戻金という限られた元手で同じ保障額を買うため、一生涯ではなく一定期間の定期保障になります。」</p><p>「なぜこの結果になるかというと、保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>延長保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</p><p>②なぜ？ → 保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。</p><p>③イメージ → 死亡保障1,000万 から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 長期平準定期保険の経理処理 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "保険金等の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>保険金等の経理処理</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 保険金等の経理処理 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 保険金等の経理処理の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。保険金等の経理処理は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 保険金等の経理処理 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 保険金等の経理処理の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。保険金等の経理処理は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 保険金等の経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらな の箱へ入れる。 条件確認 → 損害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 損害保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "給付・反対給付均等の原則", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>給付・反対給付均等の原則</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 給付・反対給付均等の原則 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 給付・反対給付均等の原則 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 給付・反対給付均等の原則の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 給付・反対給付均等の原則 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。給付・反対給付均等の原則は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 給付・反対給付均等の原則 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 給付・反対給付均等の原則の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。給付・反対給付均等の原則は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 ong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "損害保険料の構成", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>損害保険料の構成</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険料の構成 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険料の構成 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 損害保険料の構成の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険料の構成 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。損害保険料の構成は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険料の構成 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 損害保険料の構成の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。損害保険料の構成は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険料の構成 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険料の構成 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、損害保険料の構成の話だ』と戻 要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 火災保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 火災保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。火災保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 火災保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 火災保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。火災保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 火災保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 火災保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、火災保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 火災保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 火災保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因 </p>"}}, {"title": "失火責任法", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>失火責任法</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 失火責任法 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 失火責任法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 失火責任法の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 失火責任法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。失火責任法は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 失火責任法 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 失火責任法の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。失火責任法は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 失火責任法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 失火責任法 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、失火責任法の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p
