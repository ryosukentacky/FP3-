など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 国民健康保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>このケースでは、まず目的と対象者が国民健康保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ国民健康保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、国民健康保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、国民健康保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>国民健康保険とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。<br>国民健康保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民健康保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 国民健康保険 固有の条件と照らします。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 国民健康保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民健康保険 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→国民健康保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを国民健康保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。 さらに、この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：国民健康保険　②核心：一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。　③仕組み：国民健康保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 国民健康保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 国民健康保険 固有の条件と照らします。　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 国民健康保険を使い続ける条件と、別制度へ変わる条件を見つけてください。　⑤比較：この用語だけの深掘り 国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。 また保険料の計算方法は自治体等によって異なります。 具体例を最初から最後まで解説 「では 国民健康保険 を具体例に落とします。</p>", "M": "<p><strong>国民健康保険：</strong>一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "\n<p>「先輩、<strong>後期高齢者医療制度</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。</p>\n<p>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。 後期高齢者医療制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 後期高齢者医療制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>後期高齢者医療制度は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。 後期高齢者医療制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 後期高齢者医療制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで後期高齢者医療制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 後期高齢者医療制度 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 後期高齢者医療制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 後期高齢者医療制度 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。後期高齢者医療制度は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>後期高齢者医療制度という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 後期高齢者医療制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 後期高齢者医療制度 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで後期高齢者医療制度の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ後期高齢者医療制度の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>後期高齢者医療制度＝「一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が後期高齢者医療制度の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ後期高齢者医療制度の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、後期高齢者医療制度に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、後期高齢者医療制度に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>後期高齢者医療制度とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。<br>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。 後期高齢者医療制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 後期高齢者医療制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 後期高齢者医療制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 後期高齢者医療制度 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→後期高齢者医療制度の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを後期高齢者医療制度の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。 さらに、だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</div></li>\n</ol>", "R": "<p>①テーマ：後期高齢者医療制度　②核心：一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。　③仕組み：高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。 後期高齢者医療制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 後期高齢者医療制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：だからこそ、 75歳になっても国民健康保険にそのまま残る、という理解は誤りです。 次に、その事実を 後期高齢者医療制度 固有の条件と照らします。 もう一つ具体例 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>", "M": "<p><strong>後期高齢者医療制度：</strong>一言でいうと―― 原則75歳以上などを対象とする独立した公的医療保険制度です。</p>"}}, {"title": "公的介護保険", "content": {"A": "\n<p>「先輩、<strong>公的介護保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</p>\n<p>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。 公的介護保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的介護保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>公的介護保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。 公的介護保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的介護保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで公的介護保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 公的介護保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 公的介護保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 公的介護保険 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。公的介護保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>公的介護保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 公的介護保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 公的介護保険 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで公的介護保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ公的介護保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>公的介護保険＝「一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が公的介護保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ公的介護保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、公的介護保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、公的介護保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>公的介護保険とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。<br>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。 公的介護保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的介護保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 公的介護保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 公的介護保険 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→公的介護保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを公的介護保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。 さらに、だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：公的介護保険　②核心：一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。　③仕組み：介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。 公的介護保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的介護保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：だからこそ、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。 次に、その事実を 公的介護保険 固有の条件と照らします。 公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>公的介護保険：</strong>一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</p>"}}, {"title": "労災保険", "content": {"A": "\n<p>「先輩、<strong>労災保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</p>\n<p>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>労災保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 労災保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>通勤途中の合理的な経路で事故に遭う場面。 その情報を並べると、 労災保険 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。労災保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>労災保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>通勤途中の合理的な経路で事故に遭う場面。 その情報を並べると、 労災保険 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで労災保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ労災保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>労災保険＝「一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。</p>\n<p>このケースでは、まず目的と対象者が労災保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ労災保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、労災保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、労災保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>労災保険とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。<br>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>通勤途中の合理的な経路で事故に遭う場面。 その情報を並べると、 労災保険 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→労災保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを労災保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。 さらに、次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：労災保険　②核心：一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。　③仕組み：仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。　⑤比較：次に、その事実を 労災保険 固有の条件と照らします。 この用語だけの深掘り 労災保険料は原則として事業主が全額負担します。 労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>労災保険：</strong>一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</p>"}}, {"title": "雇用保険", "content": {"A": "\n<p>「先輩、<strong>雇用保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</p>\n<p>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>雇用保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 雇用保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 雇用保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 雇用保険 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。雇用保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>雇用保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 雇用保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 雇用保険 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで雇用保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ雇用保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>雇用保険＝「一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『雇用保険＝失業手当だけ』ではありません。</p>\n<p>このケースでは、まず目的と対象者が雇用保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ雇用保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、雇用保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、雇用保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>雇用保険とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。<br>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 雇用保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 雇用保険 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→雇用保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを雇用保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。 さらに、だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：雇用保険　②核心：一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。　③仕組み：仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『雇用保険＝失業手当だけ』ではありません。　⑤比較：だからこそ、 『雇用保険＝失業手当だけ』ではありません。 次に、その事実を 雇用保険 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>雇用保険：</strong>一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "\n<p>「先輩、<strong>就職促進給付と教育訓練給付</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 就職促進給付と教育訓練給付 です。</p>\n<p>就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<h3>何のための知識か</h3>\n<p>就職促進給付と教育訓練給付は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 就職促進給付と教育訓練給付 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 就職促進給付と教育訓練給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 就職促進給付と教育訓練給付 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。就職促進給付と教育訓練給付は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>就職促進給付と教育訓練給付という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 就職促進給付と教育訓練給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 就職促進給付と教育訓練給付 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで就職促進給付と教育訓練給付の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ就職促進給付と教育訓練給付の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>就職促進給付と教育訓練給付＝「今日は 就職促進給付と教育訓練給付 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>このケースでは、まず目的と対象者が就職促進給付と教育訓練給付の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ就職促進給付と教育訓練給付の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、就職促進給付と教育訓練給付に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、就職促進給付と教育訓練給付に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>就職促進給付と教育訓練給付とは何か。<div class=\"answer\"><b>答え：</b>今日は 就職促進給付と教育訓練給付 です。<br>就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 就職促進給付と教育訓練給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 就職促進給付と教育訓練給付 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→就職促進給付と教育訓練給付の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを就職促進給付と教育訓練給付の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 就職促進給付と教育訓練給付 です。 さらに、次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：就職促進給付と教育訓練給付　②核心：今日は 就職促進給付と教育訓練給付 です。　③仕組み：就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。　④具体例：問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。　⑤比較：次に、その事実を 就職促進給付と教育訓練給付 固有の条件と照らします。 この用語だけの深掘り 就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>就職促進給付と教育訓練給付：</strong>今日は 就職促進給付と教育訓練給付 です。</p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "\n<p>「先輩、<strong>育児休業給付と雇用継続給付</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 育児休業給付と雇用継続給付 です。</p>\n<p>育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<h3>何のための知識か</h3>\n<p>育児休業給付と雇用継続給付は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 育児休業給付と雇用継続給付 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 育児休業給付と雇用継続給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 育児休業給付と雇用継続給付 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。育児休業給付と雇用継続給付は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>育児休業給付と雇用継続給付という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 育児休業給付と雇用継続給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 育児休業給付と雇用継続給付 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで育児休業給付と雇用継続給付の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ育児休業給付と雇用継続給付の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>育児休業給付と雇用継続給付＝「今日は 育児休業給付と雇用継続給付 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>このケースでは、まず目的と対象者が育児休業給付と雇用継続給付の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ育児休業給付と雇用継続給付の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、育児休業給付と雇用継続給付に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、育児休業給付と雇用継続給付に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>育児休業給付と雇用継続給付とは何か。<div class=\"answer\"><b>答え：</b>今日は 育児休業給付と雇用継続給付 です。<br>育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 育児休業給付と雇用継続給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 育児休業給付と雇用継続給付 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→育児休業給付と雇用継続給付の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを育児休業給付と雇用継続給付の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 育児休業給付と雇用継続給付 です。 さらに、次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：育児休業給付と雇用継続給付　②核心：今日は 育児休業給付と雇用継続給付 です。　③仕組み：育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。　④具体例：休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。　⑤比較：次に、その事実を 育児休業給付と雇用継続給付 固有の条件と照らします。 この用語だけの深掘り 育児休業給付は雇用関係を維持したまま育児のため休業する人の所得を支えます。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>育児休業給付と雇用継続給付：</strong>今日は 育児休業給付と雇用継続給付 です。</p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "\n<p>「先輩、<strong>高年齢雇用継続給付と介護休業給付</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 高年齢雇用継続給付と介護休業給付 です。</p>\n<p>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>高年齢雇用継続給付と介護休業給付は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 高年齢雇用継続給付と介護休業給付 固有の条件と照らします。 この用語だけの深掘り 高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。 高年齢雇用継続給付と介護休業給付を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 高年齢雇用継続給付と介護休業給付 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 高年齢雇用継続給付と介護休業給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 高年齢雇用継続給付と介護休業給付 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。高年齢雇用継続給付と介護休業給付は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 高年齢雇用継続給付と介護休業給付 固有の条件と照らします。 この用語だけの深掘り 高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。 高年齢雇用継続給付と介護休業給付を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>高年齢雇用継続給付と介護休業給付という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 高年齢雇用継続給付と介護休業給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 高年齢雇用継続給付と介護休業給付 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで高年齢雇用継続給付と介護休業給付の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ高年齢雇用継続給付と介護休業給付の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 高年齢雇用継続給付と介護休業給付 固有の条件と照らします。 この用語だけの深掘り 高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。 高年齢雇用継続給付と介護休業給付を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>高年齢雇用継続給付と介護休業給付＝「今日は 高年齢雇用継続給付と介護休業給付 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。</p>\n<p>このケースでは、まず目的と対象者が高年齢雇用継続給付と介護休業給付の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ高年齢雇用継続給付と介護休業給付の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 高年齢雇用継続給付と介護休業給付 固有の条件と照らします。 この用語だけの深掘り 高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。 高年齢雇用継続給付と介護休業給付を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、高年齢雇用継続給付と介護休業給付に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p
