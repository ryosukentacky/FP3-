いるか分かります？ 現実の問題 → 障害基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 障害基礎年金 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで障害基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 障害基礎年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。 その情報を並べると、 障害基礎年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。障害基礎年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>障害基礎年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。 その情報を並べると、 障害基礎年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで障害基礎年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ障害基礎年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>障害基礎年金＝「一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>初診日→保険料納付要件→障害認定日の等級、の順にチェック。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が障害基礎年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ障害基礎年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、障害基礎年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、障害基礎年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>障害基礎年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。<br>障害基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 障害基礎年金 固有の条件と照らします。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。 その情報を並べると、 障害基礎年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→障害基礎年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを障害基礎年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。 さらに、もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：障害基礎年金　②核心：一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。　③仕組み：障害基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 障害基礎年金 固有の条件と照らします。　④具体例：初診日→保険料納付要件→障害認定日の等級、の順にチェック。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：もう一つ具体例 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 障害基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>障害基礎年金：</strong>一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</p>"}}, {"title": "障害厚生年金", "content": {"A": "\n<p>「先輩、<strong>障害厚生年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</p>\n<p>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>障害厚生年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで障害厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 障害厚生年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 障害厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 障害厚生年金 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。障害厚生年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>障害厚生年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 障害厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 障害厚生年金 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで障害厚生年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ障害厚生年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>障害厚生年金＝「一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</p>\n<p>このケースでは、まず目的と対象者が障害厚生年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ障害厚生年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、障害厚生年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、障害厚生年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>障害厚生年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。<br>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 障害厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 障害厚生年金 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→障害厚生年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを障害厚生年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。 さらに、だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：障害厚生年金　②核心：一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。　③仕組み：会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。　⑤比較：だからこそ、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 次に、その事実を 障害厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>障害厚生年金：</strong>一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</p>"}}, {"title": "遺族基礎年金", "content": {"A": "\n<p>「先輩、<strong>遺族基礎年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</p>\n<p>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。 遺族基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>遺族基礎年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。 遺族基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで遺族基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 遺族基礎年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 遺族基礎年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族基礎年金 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。遺族基礎年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>遺族基礎年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 遺族基礎年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族基礎年金 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで遺族基礎年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ遺族基礎年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>遺族基礎年金＝「一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が遺族基礎年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ遺族基礎年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、遺族基礎年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、遺族基礎年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>遺族基礎年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。<br>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。 遺族基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 遺族基礎年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族基礎年金 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→遺族基礎年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを遺族基礎年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。 さらに、だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</div></li>\n</ol>", "R": "<p>①テーマ：遺族基礎年金　②核心：一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。　③仕組み：被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。 遺族基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：だからこそ、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。 次に、その事実を 遺族基礎年金 固有の条件と照らします。 もう一つ具体例 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。</p>", "M": "<p><strong>遺族基礎年金：</strong>一言でいうと―― 国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</p>"}}, {"title": "寡婦年金と死亡一時金", "content": {"A": "\n<p>「先輩、<strong>寡婦年金と死亡一時金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 寡婦年金と死亡一時金 です。</p>\n<p>寡婦年金と死亡一時金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 寡婦年金と死亡一時金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。</p>\n<h3>何のための知識か</h3>\n<p>寡婦年金と死亡一時金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>寡婦年金と死亡一時金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 寡婦年金と死亡一時金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで寡婦年金と死亡一時金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 寡婦年金と死亡一時金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>自営業だった夫が老齢基礎年金受給前に死亡した場面。 その情報を並べると、 寡婦年金と死亡一時金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。寡婦年金と死亡一時金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>寡婦年金と死亡一時金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>自営業だった夫が老齢基礎年金受給前に死亡した場面。 その情報を並べると、 寡婦年金と死亡一時金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで寡婦年金と死亡一時金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ寡婦年金と死亡一時金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>寡婦年金と死亡一時金＝「今日は 寡婦年金と死亡一時金 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。</p>\n<p>このケースでは、まず目的と対象者が寡婦年金と死亡一時金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ寡婦年金と死亡一時金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、寡婦年金と死亡一時金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、寡婦年金と死亡一時金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>寡婦年金と死亡一時金とは何か。<div class=\"answer\"><b>答え：</b>今日は 寡婦年金と死亡一時金 です。<br>寡婦年金と死亡一時金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 寡婦年金と死亡一時金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>自営業だった夫が老齢基礎年金受給前に死亡した場面。 その情報を並べると、 寡婦年金と死亡一時金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→寡婦年金と死亡一時金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを寡婦年金と死亡一時金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 寡婦年金と死亡一時金 です。 さらに、次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：寡婦年金と死亡一時金　②核心：今日は 寡婦年金と死亡一時金 です。　③仕組み：寡婦年金と死亡一時金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 寡婦年金と死亡一時金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。　④具体例：婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。　⑤比較：次に、その事実を 寡婦年金と死亡一時金 固有の条件と照らします。 この用語だけの深掘り 寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>寡婦年金と死亡一時金：</strong>今日は 寡婦年金と死亡一時金 です。</p>"}}, {"title": "遺族厚生年金", "content": {"A": "\n<p>「先輩、<strong>遺族厚生年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</p>\n<p>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。 遺族厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>遺族厚生年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。 遺族厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで遺族厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 遺族厚生年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 遺族厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族厚生年金 が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。遺族厚生年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>遺族厚生年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 遺族厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族厚生年金 が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで遺族厚生年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ遺族厚生年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>遺族厚生年金＝「一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</p>\n<p>このケースでは、まず目的と対象者が遺族厚生年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ遺族厚生年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、遺族厚生年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、遺族厚生年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>遺族厚生年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。<br>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。 遺族厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>その情報を並べると、 遺族厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族厚生年金 が必要になります。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→遺族厚生年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを遺族厚生年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。 さらに、だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：遺族厚生年金　②核心：一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。　③仕組み：会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。 遺族厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 遺族厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。　⑤比較：だからこそ、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 次に、その事実を 遺族厚生年金 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>遺族厚生年金：</strong>一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</p>"}}, {"title": "中高齢寡婦加算", "content": {"A": "\n<p>「先輩、<strong>中高齢寡婦加算</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</p>\n<p>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。 中高齢寡婦加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 中高齢寡婦加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>中高齢寡婦加算は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 遺族基礎年金そのものでも、振替加算でもありません。 次に、その事実を 中高齢寡婦加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。 中高齢寡婦加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 中高齢寡婦加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで中高齢寡婦加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 中高齢寡婦加算 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。 その情報を並べると、 中高齢寡婦加算 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。中高齢寡婦加算は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 遺族基礎年金そのものでも、振替加算でもありません。 次に、その事実を 中高齢寡婦加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>中高齢寡婦加算という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。 その情報を並べると、 中高齢寡婦加算 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで中高齢寡婦加算の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ中高齢寡婦加算の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 遺族基礎年金そのものでも、振替加算でもありません。 次に、その事実を 中高齢寡婦加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>中高齢寡婦加算＝「一言でいうと―― 一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。 この例で大事なのは、答えそ nswer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを中高齢寡婦加算の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。 さらに、だからこそ、 遺族基礎年金そのものでも、振替加算でもありません。 次に、その事実を 中高齢寡婦加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：中高齢寡婦加算　②核心：一言でいうと―― 一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。　③仕組み：子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。 中高齢寡婦加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 中高齢寡婦加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 遺族基礎年金そのものでも、振替加算でもありません。　⑤比較：だからこそ、 遺族基礎年金そのものでも、振替加算でもありません。 次に、その事実を 中高齢寡婦加算 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>中高齢寡婦加算：</strong>一言でいうと―― 一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</p>"}}, {"title": "公的年金等控除", "content": {"A": "\n<p>「先輩、<strong>公的年金等控除</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</p>\n<p>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>公的年金等控除は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで公的年金等控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 公的年金等控除 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>老齢年金を受け取る人の所得税計算をする場面。 その情報を並べると、 公的年金等控除 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。公的年金等控除は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>公的年金等控除という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>老齢年金を受け取る人の所得税計算をする場面。 その情報を並べると、 公的年金等控除 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで公的年金等控除の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ公的年金等控除の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>公的年金等控除＝「一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 社会保険料控除は支払った保険料の所得控除。</p>\n<p>このケースでは、まず目的と対象者が公的年金等控除の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ公的年金等控除の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、公的年金等控除に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、公的年金等控除に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>公的年金等控除とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。<br>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>老齢年金を受け取る人の所得税計算をする場面。 その情報を並べると、 公的年金等控除 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→公的年金等控除の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを公的年金等控除の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。 さらに、だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</div></li>\n</ol>", "R": "<p>①テーマ：公的年金等控除　②核心：一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。　③仕組み：年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 社会保険料控除は支払った保険料の所得控除。　⑤比較：だからこそ、 社会保険料控除は支払った保険料の所得控除。 公的年金等控除は年金収入から雑所得を計算する仕組みです。 公的年金等控除は年金収入から雑所得を計算する仕組みです。</p>", "M": "<p><strong>公的年金等控除：</strong>一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</p>"}}, {"title": "確定拠出年金", "content": {"A": "\n<p>「先輩、<strong>確定拠出年金</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</p>\n<p>確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</p>\n<h3>何のための知識か</h3>\n<p>確定拠出年金は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 確定拠出年金 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>iDeCoで毎月2万円を投資信託等へ積み立てる場面。 その情報を並べると、 確定拠出年金 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。確定拠出年金は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>確定拠出年金という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>iDeCoで毎月2万円を投資信託等へ積み立てる場面。 その情報を並べると、 確定拠出年金 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで確定拠出年金の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ確定拠出年金の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>確定拠出年金＝「一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が確定拠出年金の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ確定拠出年金の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、確定拠出年金に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、確定拠出年金に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>確定拠出年金とは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。<br>確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>iDeCoで毎月2万円を投資信託等へ積み立てる場面。 その情報を並べると、 確定拠出年金 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→確定拠出年金の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを確定拠出年金の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。 さらに、次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</div></li>\n</ol>", "R": "<p>①テーマ：確定拠出年金　②核心：一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。　③仕組み：確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を 確定拠出年金 固有の条件と照らします。 この用語だけの深掘り 確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。 もう一つ具体例 月2万円を30年なら拠出元本720万円。</p>", "M": "<p><strong>確定拠出年金：</strong>一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</p>"}}, {"title": "小規模企業共済等掛金控除", "content": {"A": "\n<p>「先輩、<strong>小規模企業共済等掛金控除</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 小規模企業共済等掛金控除 です。</p>\n<p>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。 小規模企業共済等掛金控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 小規模企業共済等掛金控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>小規模企業共済等掛金控除は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。 小規模企業共済等掛金控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 小規模企業共済等掛金控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで小規模企業共済等掛金控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 小規模企業共済等掛金控除 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>iDeCoへ毎月2万円拠出する人の所得税計算の場面。 その情報を並べると、 小規模企業共済等掛金控除 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。小規模企業共済等掛金控除は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>小規模企業共済等掛金控除という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>iDeCoへ毎月2万円拠出する人の所得税計算の場面。 その情報を並べると、 小規模企業共済等掛金控除 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで小規模企業共済等掛金控除の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ小規模企業共済等掛金控除の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>小規模企業共済等掛金控除＝「今日は 小規模企業共済等掛金控除 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</p>\n<p>このケースでは、まず目的と対象者が小規模企業共済等掛金控除の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ小規模企業共済等掛金控除の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、小規模企業共済等掛金控除に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、小規模企業共済等掛金控除に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>小規模企業共済等掛金控除とは何か。<div class=\"answer\"><b>答え：</b>今日は 小規模企業共済等掛金控除 です。<br>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。 小規模企業共済等掛金控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 小規模企業共済等掛金控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>iDeCoへ毎月2万円拠出する人の所得税計算の場面。 その情報を並べると、 小規模企業共済等掛金控除 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→小規模企業共済等掛金控除の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを小規模企業共済等掛金控除の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 小規模企業共済等掛金控除 です。 さらに、だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</div></li>\n</ol>", "R": "<p>①テーマ：小規模企業共済等掛金控除　②核心：今日は 小規模企業共済等掛金控除 です。　③仕組み：老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。 小規模企業共済等掛金控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 小規模企業共済等掛金控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。　⑤比較：だからこそ、 税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。 次に、その事実を 小規模企業共済等掛金控除 固有の条件と照らします。 そこで初めて金額・期間・割合・年齢を使います。</p>", "M": "<p><strong>小規模企業共済等掛金控除：</strong>今日は 小規模企業共済等掛金控除 です。</p>"}}, {"title": "中退共（中小企業退職金共済制度）", "content": {"A": "\n<p>「先輩、<strong>中退共（中小企業退職金共済制度）</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は 中退共（中小企業退職金共済制度） です。</p>\n<p>中退共（中小企業退職金共済制度） が必要になる前に、何が起きているか分かります？ 現実の問題 → 中退共（中小企業退職金共済制度） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 中退共（中小企業退職金共済制度） 固有の条件と照らします。</p>\n<h3>何のための知識か</h3>\n<p>中退共（中小企業退職金共済制度）は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>中退共（中小企業退職金共済制度） が必要になる前に、何が起きているか分かります？ 現実の問題 → 中退共（中小企業退職金共済制度） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 中退共（中小企業退職金共済制度） 固有の条件と照らします。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで中退共（中小企業退職金共済制度）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 中退共（中小企業退職金共済制度） → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>その情報を並べると、 中退共（中小企業退職金共済制度） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 中退共（中小企業退職金共済制度） が必要になります。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。中退共（中小企業退職金共済制度）は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>中退共（中小企業退職金共済制度）という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>その情報を並べると、 中退共（中小企業退職金共済制度） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 中退共（中小企業退職金共済制度） が必要になります。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで中退共（中小企業退職金共済制度）の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ中退共（中小企業退職金共済制度）の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>中退共（中小企業退職金共済制度）＝「今日は 中退共（中小企業退職金共済制度） です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": " ：</b>中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを中退共（中小企業退職金共済制度）の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は 中退共（中小企業退職金共済制度） です。 さらに、中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：中退共（中小企業退職金共済制度）　②核心：今日は 中退共（中小企業退職金共済制度） です。　③仕組み：中退共（中小企業退職金共済制度） が必要になる前に、何が起きているか分かります？ 現実の問題 → 中退共（中小企業退職金共済制度） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 中退共（中小企業退職金共済制度） 固有の条件と照らします。　④具体例：この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。 もう一つ具体例 会社→毎月掛金→中退共→従業員退職→機構から本人へ退職金、という矢印を描くと誰のお金か迷いません。　⑤比較：中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。 具体例を最初から最後まで解説 「では 中退共（中小企業退職金共済制度） を具体例に落とします。</p>", "M": "<p><strong>中退共（中小企業退職金共済制度）：</strong>今日は 中退共（中小企業退職金共済制度） です。</p>"}}, {"title": "分割払いとリボ払い", "content": {"A": "\n<p>「先輩、<strong>分割払いとリボ払い</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</p>\n<p>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。 分割払いとリボ払い が必要になる前に、何が起きているか分かります？ 現実の問題 → 分割払いとリボ払い → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>分割払いとリボ払いは、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。 分割払いとリボ払い が必要になる前に、何が起きているか分かります？ 現実の問題 → 分割払いとリボ払い → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで分割払いとリボ払いの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 分割払いとリボ払い → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。 その情報を並べると、 分割払いとリボ払い が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。分割払いとリボ払いは、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>分割払いとリボ払いという語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。 その情報を並べると、 分割払いとリボ払い が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで分割払いとリボ払いの条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ分割払いとリボ払いの効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>分割払いとリボ払い＝「一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>このケースでは、まず目的と対象者が分割払いとリボ払いの条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ分割払いとリボ払いの枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、分割払いとリボ払いに関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、分割払いとリボ払いに当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>分割払いとリボ払いとは何か。<div class=\"answer\"><b>答え：</b>一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。<br>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。 分割払いとリボ払い が必要になる前に、何が起きているか分かります？ 現実の問題 → 分割払いとリボ払い → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。 その情報を並べると、 分割払いとリボ払い が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→分割払いとリボ払いの適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを分割払いとリボ払いの要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。 さらに、次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</div></li>\n</ol>", "R": "<p>①テーマ：分割払いとリボ払い　②核心：一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。　③仕組み：分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。 分割払いとリボ払い が必要になる前に、何が起きているか分かります？ 現実の問題 → 分割払いとリボ払い → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。　⑤比較：次に、その事実を 分割払いとリボ払い 固有の条件と照らします。 もう一つ具体例 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。</p>", "M": "<p><strong>分割払いとリボ払い：</strong>一言でいうと―― 分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</p>"}}, {"title": "キャッシングと総量規制", "content": {"A": "\n<p>「先輩、<strong>キャッシングと総量規制</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>今日は キャッシングと総量規制 です。</p>\n<p>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 キャッシングと総量規制 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシングと総量規制 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<h3>何のための知識か</h3>\n<p>キャッシングと総量規制は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 キャッシングと総量規制 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシングと総量規制 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとでキャッシングと総量規制の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → キャッシングと総量規制 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。 その情報を並べると、 キャッシングと総量規制 が候補に上がってくる。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。キャッシングと総量規制は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>キャッシングと総量規制という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。 その情報を並べると、 キャッシングと総量規制 が候補に上がってくる。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこでキャッシングと総量規制の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだキャッシングと総量規制の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>キャッシングと総量規制＝「今日は キャッシングと総量規制 です。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。 すでに80万円借りていれば、新規20万円で合計100万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>このケースでは、まず目的と対象者がキャッシングと総量規制の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じキャッシングと総量規制の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、キャッシングと総量規制に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、キャッシングと総量規制に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>キャッシングと総量規制とは何か。<div class=\"answer\"><b>答え：</b>今日は キャッシングと総量規制 です。<br>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 キャッシングと総量規制 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシングと総量規制 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。 その情報を並べると、 キャッシングと総量規制 が候補に上がってくる。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→キャッシングと総量規制の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それをキャッシングと総量規制の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>今日は キャッシングと総量規制 です。 さらに、『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</div></li>\n</ol>", "R": "<p>①テーマ：キャッシングと総量規制　②核心：今日は キャッシングと総量規制 です。　③仕組み：返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 キャッシングと総量規制 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシングと総量規制 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？　④具体例：総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。 すでに80万円借りていれば、新規20万円で合計100万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。　⑤比較：『すべての借金が年収の3分の1』ではありません。 次に、その事実を キャッシングと総量規制 固有の条件と照らします。 『すべての借金が年収の3分の1』ではありません。</p>", "M": "<p><strong>キャッシングと総量規制：</strong>今日は キャッシングと総量規制 です。</p>"}}],ch2:[{"title": "公的保険と私的保険", "content": {"A": "\n<p>「先輩、<strong>公的保険と私的保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>\n<p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<h3>何のための知識か</h3>\n<p>公的保険と私的保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで公的保険と私的保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 公的保険と私的保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 公的保険と私的保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。公的保険と私的保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>公的保険と私的保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 公的保険と私的保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで公的保険と私的保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ公的保険と私的保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>公的保険と私的保険＝「保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 公的保険と私的保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>このケースでは、まず目的と対象者が公的保険と私的保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ公的保険と私的保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、公的保険と私的保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、公的保険と私的保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>公的保険と私的保険とは何か。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br>保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 公的保険と私的保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→公的保険と私的保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを公的保険と私的保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 さらに、ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：公的保険と私的保険　②核心：保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。　③仕組み：保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 公的保険と私的保険が働く時点を特定します。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。　⑤比較：ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 具体例を最初から最後まで解説 「では 公的保険と私的保険 を具体例に落とします。</p>", "M": "<p><strong>公的保険と私的保険：</strong>保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p>"}}, {"title": "大数の法則", "content": {"A": "\n<p>「先輩、<strong>大数の法則</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。</p>\n<p>コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。</p>\n<h3>何のための知識か</h3>\n<p>大数の法則は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで大数の法則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 大数の法則 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 大数の法則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。大数の法則は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>大数の法則という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 大数の法則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで大数の法則の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ大数の法則の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>大数の法則＝「大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>ケース1｜基本形 100人で事故2件なら2%。 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。</p>\n<p>このケースでは、まず目的と対象者が大数の法則の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ大数の法則の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、大数の法則に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、大数の法則に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>大数の法則とは何か。<div class=\"answer\"><b>答え：</b>大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。<br>コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 大数の法則が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→大数の法則の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを大数の法則の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。 さらに、ケース6｜誤答を作る 「わざと『一人の事故発生日を予言する法則ではない』というミスをします。 具体例を最初から最後まで解説 「では 大数の法則 を具体例に落とします。</div></li>\n</ol>", "R": "<p>①テーマ：大数の法則　②核心：大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。　③仕組み：コインを4回投げる場合と1万回投
