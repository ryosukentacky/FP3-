自分の車・自分の身体を分けて補償対象を比較する 。　③仕組み：Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 搭乗者傷害保険と人身傷害補償保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 搭乗者傷害保険と人身傷害補償保険が働く時点を特定します。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 搭乗者傷害保険と人身傷害補償保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>", "M": "<p><strong>搭乗者傷害保険と人身傷害補償保険：</strong>事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p>"}}, {"title": "無保険車傷害保険", "content": {"A": "\n<p>「先輩、<strong>無保険車傷害保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p>\n<p>Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。</p>\n<h3>何のための知識か</h3>\n<p>無保険車傷害保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで無保険車傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 無保険車傷害保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 無保険車傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。無保険車傷害保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>無保険車傷害保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 無保険車傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで無保険車傷害保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ無保険車傷害保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>無保険車傷害保険＝「事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 無保険車傷害保険が働く時点を特定します。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が無保険車傷害保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ無保険車傷害保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、無保険車傷害保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、無保険車傷害保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>無保険車傷害保険とは何か。<div class=\"answer\"><b>答え：</b>事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。<br>Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 無保険車傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→無保険車傷害保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを無保険車傷害保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 さらに、具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</div></li>\n</ol>", "R": "<p>①テーマ：無保険車傷害保険　②核心：事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。　③仕組み：Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 無保険車傷害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 無保険車傷害保険が働く時点を特定します。 ケース6｜誤答を作る 「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 無保険車傷害保険 を具体例に落とします。 ケース6｜誤答を作る「わざと『事故が起きたというだけで、すべて同じ保険から支払われるわけではない』というミスをします。</p>", "M": "<p><strong>無保険車傷害保険：</strong>事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。</p>"}}, {"title": "車両保険", "content": {"A": "\n<p>「先輩、<strong>車両保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。</p>\n<p>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。</p>\n<h3>何のための知識か</h3>\n<p>車両保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 車両保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 ② 3コマで動かす 出来事の前 → 車両保険が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。車両保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>車両保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 ② 3コマで動かす 出来事の前 → 車両保険が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで車両保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ車両保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>車両保険＝「自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 対物賠償=相手の物／車両保険=自分の車 です。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。</p>\n<p>このケースでは、まず目的と対象者が車両保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ車両保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、車両保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、車両保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>車両保険とは何か。<div class=\"answer\"><b>答え：</b>自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。<br>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 ② 3コマで動かす 出来事の前 → 車両保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→車両保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを車両保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。 さらに、具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</div></li>\n</ol>", "R": "<p>①テーマ：車両保険　②核心：自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。　③仕組み：Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 対物賠償=相手の物／車両保険=自分の車 です。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。　⑤比較：具体例を最初から最後まで解説 「では 車両保険 を具体例に落とします。 ケース5｜似た制度と対決「比較の軸は対物賠償=相手の物／車両保険=自分の車です。</p>", "M": "<p><strong>車両保険：</strong>自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。</p>"}}, {"title": "傷害保険", "content": {"A": "\n<p>「先輩、<strong>傷害保険</strong>はここから全部こちらで説明します。」</p>\n<h3>結論</h3><p>傷害保険はFP試験で押さえるべき重要テーマです。</p>\n<p>なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。</p>\n<h3>何のための知識か</h3>\n<p>傷害保険は、名称を覚えるだけでは足りません。FPでは、制度・計算・保険・年金などが「どんな問題を解決するために存在するか」を理解すると、事例問題でも判断できます。このテーマでは、まず上の結論を土台にして、対象者、利用時点、お金や権利の動きまでつなげます。</p>\n<h3>試験で見るポイント</h3>\n<p>ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>したがって、この項目の中心は「用語の暗記」ではなく、<strong>目的 → 条件 → 仕組み → 結果 → 類似制度との違い</strong>の一連の流れです。</p>", "B": "\n<h3>仕組みを最初から説明</h3><p>なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。つまり順序は、<strong>現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果</strong>です。</p>\n<h3>なぜこの仕組みが必要なのか</h3>\n<p>② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>制度がなければ、必要資金を準備できない、リスクを個人だけで負担する、将来額を判断できない、あるいは契約関係を整理できないといった問題が残ります。傷害保険は、その問題を一定のルールで処理するための考え方・制度・計算方法として位置づけられます。</p>\n<h3>似たものとの境界</h3><p>ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>FP試験では、似た用語を完全に別物として出すより、一つの条件だけを入れ替えて出題することが多いため、対象・目的・期間・金銭の方向を分けて理解するのが重要です。</p>\n<h3>間違いやすい考え方</h3>\n<p>傷害保険という語が問題文に登場しただけで答えを決めるのは危険です。制度名よりも、誰が対象か、何が起きたか、いつの話か、誰が負担し誰が受け取るかという事実関係が先です。その事実が上の仕組みに一致したときに、この用語を使います。</p>", "C": "\n<h3>イメージ1｜現実の場面</h3><p>② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>この場面を時間順に並べると、最初は通常の生活・契約状態です。そこへ資金需要、病気、死亡、事故、退職、住宅取得、教育、保険料負担など、そのテーマ固有の出来事が発生します。そこで傷害保険の条件を満たすかが判定され、満たせば制度上の効果が生じます。</p>\n<h3>イメージ2｜お金・権利の流れ</h3>\n<p>このテーマで重要なのは、お金が「誰から誰へ」動くのか、または現在のお金が将来のお金へどう変化するのかという方向です。保険なら保険料負担者・被保険者・受取人、年金なら加入者・受給者、公的給付なら被保険者と給付主体、ローンなら借入人と金融機関という関係を置くと整理できます。</p>\n<h3>イメージ3｜利用前と利用後</h3>\n<p><strong>利用前：</strong>まだ傷害保険の効果は生じていません。<br><strong>条件発生：</strong>このテーマ固有の要件を満たす出来事が起こります。<br><strong>利用後：</strong>給付、保障、返済、積立、税負担、将来価値などの結果が確定します。</p>\n<h3>イメージ4｜似た制度を横に置く</h3><p>ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>両者を横に並べると、共通点ではなく「どの条件だけが違うか」が見えます。その一条件が、本試験で正誤を分けるポイントになります。</p>\n<h3>イメージ5｜一文で映像化</h3>\n<p><strong>傷害保険＝「傷害保険はFP試験で押さえるべき重要テーマです。」という状況を、具体的な人物・時間・お金の流れにしたもの</strong>として記憶すると、名称から意味を復元できます。</p>", "D": "\n<h3>具体例1｜基本ケース</h3><p>制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 です。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。</p>\n<p>このケースでは、まず目的と対象者が傷害保険の条件に合っているため、この制度・計算方法を使います。数字がある場合は、制度を選んだ後で数値を当てはめます。</p>\n<h3>具体例2｜数字が変わった場合</h3>\n<p>基本ケースの金額だけが変わっても、対象者・目的・期間などの根本条件が同じなら、通常は同じ傷害保険の枠組みで処理します。ただし、法定上限、給付割合、所得制限、保険金額の限度などがあるテーマでは、その境界を超えると結果が変わります。</p>\n<h3>具体例3｜期間が変わった場合</h3>\n<p>期間は独立した条件です。複利計算では期間が長いほど利息が重なり、ローンでは返済期間が総返済額に影響し、保険では保障期間、公的年金では加入・受給時期が結果を左右します。したがって金額が同じでも、期間が違えば同じ結果になるとは限りません。</p>\n<h3>具体例4｜人物・立場が変わった場合</h3>\n<p>会社員と自営業者、本人と配偶者、契約者と受取人、加害者と被害者など、人物の立場が要件に含まれる制度では答えが変わります。一方、純粋な係数計算のように人物属性が関係しないテーマでは、人物を変えても計算原理は変わりません。ここを用語ごとに区別します。</p>\n<h3>具体例5｜似た制度との比較</h3><p>ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>\n<p>この違いを具体例に戻すと、片方は目的・対象・期間の条件を満たす一方、もう片方はそのうち一つが異なります。その差によって使う制度名や計算方法が切り替わります。</p>\n<h3>具体例6｜典型的な誤答</h3>\n<p>典型的な誤答は、傷害保険に関連する単語だけを見て選択することです。正しくは、問題文にある対象者・時点・目的・金額・契約関係を全部読み、その中でこの用語の要件に一致する部分を確認します。</p>\n<h3>具体例7｜実務での意味</h3>\n<p>実際のFP相談では、相談者が制度名を正確に言うとは限りません。「将来いくら必要か」「保険料を払えない」「事故で損害が出た」「家族が亡くなった」といった生活上の出来事から始まります。FPはその出来事を整理し、傷害保険に当てはめて、結果と注意点を説明します。これが試験知識を実務へつなぐ考え方です。</p>", "Q": "\n<p>確認問題はすべて<strong>問題→正解→理由</strong>まで表示します。読むだけでも復習できる構成です。</p>\n<ol>\n<li><strong>基本：</strong>傷害保険とは何か。<div class=\"answer\"><b>答え：</b>傷害保険はFP試験で押さえるべき重要テーマです。<br>なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。</div></li>\n<li><strong>目的：</strong>なぜ必要か。<div class=\"answer\"><b>答え：</b>② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。 このような現実の問題を制度・計算上のルールで処理するためです。</div></li>\n<li><strong>流れ：</strong>どの順で判断するか。<div class=\"answer\"><b>答え：</b>現実の出来事→対象・目的・期間などの条件確認→傷害保険の適用→金額・権利・保障などの結果、の順です。</div></li>\n<li><strong>比較：</strong>似た制度との違い。<div class=\"answer\"><b>答え：</b>ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n<li><strong>数字：</strong>金額だけ変わった場合。<div class=\"answer\"><b>答え：</b>根本条件が同じなら同じ制度で処理し、上限・割合・所得制限などがある場合はその境界で結果が変わります。</div></li>\n<li><strong>期間：</strong>期間が変わった場合。<div class=\"answer\"><b>答え：</b>複利、保障期間、返済期間、加入期間など、時間が制度要件に入るテーマでは結果が変化します。人物属性だけの変更とは別に判定します。</div></li>\n<li><strong>人物：</strong>立場が変わった場合。<div class=\"answer\"><b>答え：</b>人物属性が要件なら結果が変わります。係数計算など人物属性と無関係なテーマでは原理は変わりません。</div></li>\n<li><strong>誤答：</strong>用語名だけで判断してよいか。<div class=\"answer\"><b>答え：×。</b>対象者・目的・期間・金額・契約関係などの要件全体で判定します。</div></li>\n<li><strong>実務：</strong>相談ではどう現れるか。<div class=\"answer\"><b>答え：</b>相談者の生活上の困りごとを整理し、それを傷害保険の要件へ翻訳して結果を説明する形で現れます。</div></li>\n<li><strong>総まとめ：</strong>最重要ポイント。<div class=\"answer\"><b>答え：</b>傷害保険はFP試験で押さえるべき重要テーマです。 さらに、ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</div></li>\n</ol>", "R": "<p>①テーマ：傷害保険　②核心：傷害保険はFP試験で押さえるべき重要テーマです。　③仕組み：なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。　④具体例：制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 です。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。　⑤比較：ケース5｜似た制度と対決「比較の軸は傷害保険=事故による身体傷害／医療保険=疾病入院等も対象です。 金額が関係するテーマでは100万円・1,000万円など計算しやすい数字を置きます。</p>", "M": "<p><strong>傷害保険：</strong>傷害保険はFP試験で押さえるべき重要テーマです。</p>"}}]};let cards=chapterData.ch1,ti=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];let cur=0,tab="A";const $=x=>document.getElementById(x),sel=$("sel"),q=$("quick"),search=$("search"),tabs=$("tabs");
function fill(){sel.innerHTML="";cards.forEach((c,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;sel.appendChild(o)})}fill();ti.forEach(([k,l])=>{let b=document.createElement("button");b.className="tab";b.textContent=l;b.onclick=()=>{tab=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
