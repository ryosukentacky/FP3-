mmary><div class='answer'><p>「一般に従業員等が任意で加入するタイプです。」</p></div></details><h4>Q3｜総合福祉団体定期保険との大きな違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「Bグループ保険は従業員の任意加入型の保障が中心。総合福祉団体定期保険は企業の弔慰金・死亡退職金等の財源準備を主目的とします。」</p></div></details>", "R": "<p>「団体単位の定期保険。まとめて管理するため割安になりやすい。Bグループは従業員の任意加入が一般的。退職後の扱いは要確認です。」</p>", "M": "<p>「<strong>団体定期保険＝企業などの団体契約を通じ、所属員へ一定期間の死亡保障を提供する保険。</strong>」</p>"}}, {"title": "総合福祉団体定期保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、総合福祉団体定期保険は、企業などが従業員を被保険者として加入し、<strong>従業員が死亡・所定の高度障害状態になったときの弔慰金・死亡退職金などの財源</strong>を準備するための団体保険です。」</p><p>「前回のBグループ型の団体定期保険が“従業員が任意加入して自分や家族の保障を持つ”色合いが強いのに対し、こちらは<strong>企業の福利厚生制度を支える財源</strong>という視点が中心です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「会社には、従業員が在職中に死亡した場合、就業規則・福利厚生規程などに基づき弔慰金や死亡退職金を支払う制度を設けているところがあります。でも死亡時期は予測できません。入社直後に大きな支払いが必要になることもあります。」</p><p>「そこで企業が契約者となり、従業員を被保険者として定期保険をまとめて契約します。従業員に万一のことがあれば保険金を受け取り、それを遺族への弔慰金・死亡退職金などの財源として活用します。」</p><p>「保険期間は一般に1年で更新するタイプで、団体の在職者をまとめて保障します。」</p><p>「そして重要なのが受取人です。企業が保険金受取人になる場合には、被保険者本人の同意など適切な手続きが必要です。“会社が勝手に従業員へ保険を掛けて利益を得る”制度ではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社の福利厚生規程に『従業員が死亡したら遺族へ弔慰金を支払います』と書いてあるとします。これは会社から見れば将来いつ発生するか分からない大きな支出です。」</p><p>「総合福祉団体定期保険は、その支出に備えて会社の後ろに置く<strong>非常用の資金タンク</strong>です。従業員の万一→保険金→会社の福利厚生制度に基づく給付、という流れで見てください。」</p>", "D": "<h3>D｜具体例</h3><p>「会社Xが、従業員Aさんについて死亡時1,000万円の総合福祉団体定期保険を契約しているとします。」</p><p>「Aさんが在職中に死亡し支払条件を満たせば、契約に従って保険金が支払われ、会社は死亡退職金・弔慰金等の財源として利用できます。」</p><p>「ここで前回のBグループ保険と比較です。Bグループなら“従業員本人が任意加入し、保険料を負担する”のが典型。総合福祉団体定期は“企業が福利厚生給付の財源を準備する”のが中心です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜主な目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「従業員の死亡・高度障害時に企業が支給する弔慰金や死亡退職金などの財源準備です。」</p></div></details><h4>Q2｜Bグループ型団体定期との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「Bグループは従業員の任意加入型保障が中心、総合福祉団体定期は企業の福利厚生制度の財源準備が中心です。」</p></div></details><h4>Q3｜企業が受取人なら従業員に無断でよい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。契約形態に応じ、被保険者本人の同意など所定の手続きが必要です。」</p></div></details>", "R": "<p>「企業が契約→従業員を保障→死亡・高度障害→弔慰金・死亡退職金等の財源。Bグループとの目的の違いを押さえます。」</p>", "M": "<p>「<strong>総合福祉団体定期保険＝企業が従業員の万一に備え、福利厚生給付の財源を準備する団体定期保険。</strong>」</p>"}}, {"title": "ヒューマン・ヴァリュー特約", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>ヒューマン・ヴァリュー特約</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。ヒューマン・ヴァリュー特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。ヒューマン・ヴァリュー特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、ヒューマン・ヴァリュー特約の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>ヒューマン・ヴァリュー特約を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。ヒューマン・ヴァリュー特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → ヒューマン・ヴァリュー特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ヒューマン・ヴァリュー特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ヒューマン・ヴァリュー特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "変額保険", "content": {"A": "<h3>A｜要点</h3><p>「変額保険は、保険料の一部を<strong>特別勘定</strong>で株式・債券などに運用し、その運用実績によって保険金額や解約返戻金などが変動する生命保険です。」</p><p>「運用が良ければ増える可能性があり、悪ければ減る可能性があります。運用リスクは基本的に契約者側が負います。」</p><p>「ただし典型的な変額保険では、<strong>死亡・高度障害保険金には基本保険金額という最低保証</strong>があります。一方、解約返戻金には通常その最低保証がありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「通常の定額保険では、契約時に定めた保険金額を基本に保障します。変額保険では、運用成果を契約価値へ反映させるため、資産を一般勘定とは区別した<strong>特別勘定</strong>で管理・運用します。」</p><p>「株価が上がれば積立部分が増え、変動保険金などが増える可能性があります。反対に相場が下落すれば、解約返戻金などが払込保険料総額を大きく下回ることもあります。」</p><p>「ここで試験の罠です。“変額＝全部変動してゼロにもなる”ではありません。一般的な変額保険では死亡保険金について基本保険金額が最低保証されます。」</p><p>「でも解約返戻金まで最低保証されるわけではありません。死亡したときと途中解約したときでは、守られ方が違うんです。」</p><p>「保険期間によって、有期型と終身型があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「契約の中に投資用のエレベーターがあると思ってください。株式・債券市場に合わせて積立価値は上がったり下がったりします。」</p><p>「でも死亡保障の床には“基本保険金額”というストッパーがある。一方、途中解約する出口には同じ床がない。」</p><p>「だから<strong>死亡時の最低保証と、解約時の運用リスク</strong>を別々に見ます。」</p>", "D": "<h3>D｜具体例</h3><p>「基本保険金額1,000万円の変額保険へ加入したとします。」</p><p>「運用が好調で死亡時の変動部分が200万円増えていれば、契約条件に応じて1,200万円などになる可能性があります。」</p><p>「反対に運用が悪化して積立価値が下がっていても、典型的な商品では死亡保険金は基本保険金額1,000万円が最低保証されます。」</p><p>「しかし途中解約時の解約返戻金については、“1,000万円は必ず戻る”とはなりません。市場下落によって払込保険料総額を下回る可能性があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜運用する勘定は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「特別勘定です。」</p></div></details><h4>Q2｜死亡保険金は運用悪化で基本保険金額を下回る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「典型的な変額保険では、死亡・高度障害保険金について基本保険金額が最低保証されます。」</p></div></details><h4>Q3｜解約返戻金にも同じ最低保証がある？</h4><details><summary>答えを見る</summary><div class='answer'><p>「通常ありません。解約返戻金は運用実績によって変動し、元本割れする可能性があります。」</p></div></details>", "R": "<p>「特別勘定で運用。契約者が運用リスクを負う。死亡保険金には基本保険金額の最低保証、解約返戻金には通常なし。」</p>", "M": "<p>「<strong>変額保険＝特別勘定の運用成果を契約価値へ反映しつつ、死亡保障には基本保険金額の最低保証を持つ保険。</strong>」</p>"}}, {"title": "個人年金保険", "content": {"A": "<h3>A｜要点</h3><p>「個人年金保険は、老後などのために保険料を積み立て、<strong>契約で定めた年齢から年金を受け取る私的保険</strong>です。」</p><p>「受取期間によって代表的に<strong>終身年金・有期年金・確定年金</strong>などがあります。」</p><p>「公的年金の代わりではなく、公的年金に上乗せして老後資金を準備する商品です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「終身年金は、被保険者が生存している限り年金を受け取るタイプです。長生きするほど受取期間が長くなるので、長生きリスクへの備えになります。」</p><p>「有期年金は、“10年間”など一定期間、生存していることを条件に年金を受け取るタイプです。期間中に死亡すると、その後の年金は基本的に終了します。ただし保証期間付なら保証期間中は死亡後も遺族等が受け取れる仕組みがあります。」</p><p>「確定年金は、“10年間なら10年間”という受取期間が確定しています。受取開始後に本人が死亡しても、残りの期間分は遺族等が年金・一時金として受け取ります。」</p><p>「先輩、有期と確定の違いは<strong>本人の生存が支払い条件か</strong>です。ここ、名前だけでは分かりにくいので必ず構造で覚えてください。」</p><p>「一定の要件を満たす契約では、支払保険料が個人年金保険料控除の対象になります。これは後の項目で詳しく扱います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「60歳から年金を受け取る三本の蛇口を想像してください。」</p><p>「終身年金の蛇口は“生きている限り流れる”。有期年金は“10年間のうち、生きている間だけ流れる”。確定年金は“10年間は本人が亡くなっても残りを遺族へ流し切る”。」</p><p>「この“いつ蛇口が止まるか”で区別します。」</p>", "D": "<h3>D｜具体例</h3><p>「60歳から10年間、毎年60万円を受け取るとします。」</p><p>「10年確定年金なら、63歳で本人が死亡しても、残り期間相当の年金等は遺族等へ支払われます。」</p><p>「10年有期年金で保証期間がなければ、63歳で死亡するとその後の年金支払いは基本的に終了します。」</p><p>「終身年金なら本人が90歳まで生存すれば90歳まで続きます。だから長寿リスクへの対応力は終身年金が高い一方、同じ原資なら年金額などの条件は商品ごとに変わります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜本人が生きている限り受け取るのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「終身年金です。」</p></div></details><h4>Q2｜本人が途中で死亡しても決めた期間分を支払うのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「確定年金です。」</p></div></details><h4>Q3｜有期年金と確定年金の核心的な違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「有期年金は一定期間内でも原則本人の生存が支払条件。確定年金は本人の生死にかかわらず一定期間の支払いが確定している点です。」</p></div></details>", "R": "<p>「終身＝生存中ずっと。有期＝一定期間＋生存条件。確定＝一定期間の支払いを確定。公的年金への上乗せとして考えます。」</p>", "M": "<p>「<strong>個人年金保険＝保険料を積み立て、所定年齢から契約方式に応じた年金を受け取る私的な老後資金準備。</strong>」</p>"}}, {"title": "変額個人年金保険", "content": {"A": "<h3>A｜要点</h3><p>「変額個人年金保険は、払い込んだ保険料の一部を<strong>特別勘定</strong>で運用し、その運用実績によって将来の年金原資や年金額などが変動する個人年金保険です。」</p><p>「運用が好調なら年金原資が増える可能性がありますが、悪化すれば減ります。<strong>運用リスクは契約者が負担</strong>するのが基本です。」</p><p>「そして変額保険と同じ感覚で“死亡給付も年金原資も全部同じ保証”と考えないでください。保証内容は項目ごとに違います。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「定額個人年金なら、契約時に定めた予定利率などを基礎に将来の年金額を設計します。変額個人年金では株式・債券等で特別勘定を運用し、その成果を年金原資へ反映します。」</p><p>「そのためインフレや市場上昇に対応できる可能性がある一方、株価下落などで積立金が減少するリスクがあります。」</p><p>「一般的な商品では、年金受取開始前に被保険者が死亡した場合の死亡給付金について、払込保険料相当額など一定の最低保証を設けることがあります。一方、<strong>年金原資や解約返戻金には最低保証がない商品が基本</strong>で、元本割れする可能性があります。」</p><p>「ただし現在は最低保証付きの商品など設計が多様です。試験では“特別勘定・運用実績で年金額等が変動・契約者が運用リスク”という基本構造を優先してください。」</p><p>「また投資信託と似た値動きをしますが、生命保険契約なので死亡給付や年金受取という保険機能を持ち、保険関係費用などもかかります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「老後用の水槽を、固定速度で水を入れるのではなく、市場につながったポンプで満たすイメージです。」</p><p>「相場が良ければポンプが勢いよく回って水が増える。悪ければ水位が下がることもある。そして年金開始日に水槽にどれだけ水があるかが、将来の年金原資へ影響します。」</p><p>「死亡時には別の安全装置が付いている商品もありますが、<strong>水槽そのものの残高が必ず元本保証されるわけではない</strong>、というのがポイントです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが500万円を原資として変額個人年金保険へ加入したと仮定します。」</p><p>「特別勘定の運用が好調で年金開始時に650万円相当まで増えれば、その増えた原資をもとに年金を受け取れる可能性があります。」</p><p>「反対に市場が下落し400万円相当になれば、最低保証のない契約では年金原資も減った状態になります。“500万円払ったから年金開始時も最低500万円”とは限りません。」</p><p>「ただし死亡給付金には別途最低保証を設ける商品があります。だから<strong>死亡時・解約時・年金開始時</strong>を分けて保証の有無を確認する必要があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜資産を運用する勘定は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「特別勘定です。」</p></div></details><h4>Q2｜運用が悪くても年金原資は必ず払込保険料以上？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。最低保証のない契約では、年金原資が払込保険料を下回る可能性があります。」</p></div></details><h4>Q3｜変額個人年金で誰が運用リスクを負う？</h4><details><summary>答えを見る</summary><div class='answer'><p>「基本的に契約者です。」</p></div></details>", "R": "<p>「特別勘定で運用→成果が年金原資へ反映→契約者がリスク負担。死亡給付・解約返戻金・年金原資は保証を別々に確認します。」</p>", "M": "<p>「<strong>変額個人年金保険＝特別勘定の運用成果によって将来の年金原資等が変動する個人年金保険。</strong>」</p>"}}, {"title": "かんぽ保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、現在のかんぽ保険は、郵便局という場所の印象が強いですが、保険を引き受ける主体は<strong>株式会社かんぽ生命保険</strong>です。」</p><p>「終身保険・養老保険などを扱う生命保険会社で、郵便局ネットワークなどを通じて商品が提供されています。」</p><p>「昔の<strong>簡易生命保険</strong>と、民営化後のかんぽ生命の商品を同じものとして扱わないことが大切です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「2007年10月の郵政民営化より前は、国が運営する簡易生命保険がありました。民営化後、新規の生命保険契約を扱う会社としてかんぽ生命保険が発足しました。」</p><p>「したがって、“かんぽ＝今も国が直接運営する保険”という理解は違います。現在の新規契約は民間の生命保険会社であるかんぽ生命との契約です。」</p><p>「一方、民営化前に契約された旧簡易生命保険契約は、承継された既契約として別の法的な枠組みがあります。FPでは<strong>旧簡易保険と現在のかんぽ生命を区別</strong>しておくと整理しやすいです。」</p><p>「また、郵便局で申し込めるからといって“郵便局そのものが保険会社”というわけでもありません。販売窓口と保険の引受主体を分けてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「郵便局を“保険の受付カウンター”、かんぽ生命を“保険契約を引き受ける本体”と考えてください。」</p><p>「そして2007年のところに一本の境界線を引きます。左側が旧簡易生命保険、右側が民営化後のかんぽ生命。見た目は連続していても制度上は同一ではありません。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが現在、郵便局でかんぽ生命の終身保険へ申し込んだとします。」</p><p>「郵便局で手続きをしたとしても、“国と終身保険契約を結んだ”わけではありません。保険の引受主体はかんぽ生命です。」</p><p>「一方、祖父が2000年に加入した旧簡易生命保険が残っているなら、それは民営化前の契約です。<strong>加入時期を見る</strong>と、旧制度か現在の商品かを切り分けられます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜現在のかんぽ保険を引き受ける主体は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「株式会社かんぽ生命保険です。」</p></div></details><h4>Q2｜現在も国が新規の簡易生命保険を直接引き受けている？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。郵政民営化後の新規契約は、かんぽ生命が扱う生命保険です。」</p></div></details><h4>Q3｜郵便局で申し込むなら郵便局が保険会社？</h4><details><summary>答えを見る</summary><div class='answer'><p>「そうとは限りません。販売・手続きの窓口と、契約を引き受ける保険会社は分けて考えます。」</p></div></details>", "R": "<p>「2007年を境に、旧簡易生命保険と現在のかんぽ生命を区別。郵便局＝窓口、かんぽ生命＝現在の保険引受主体、と整理します。」</p>", "M": "<p>「<strong>かんぽ保険＝現在はかんぽ生命が引き受ける生命保険で、民営化前の旧簡易生命保険とは区別する。</strong>」</p>"}}, {"title": "共済", "content": {"A": "<h3>A｜要点</h3><p>「共済は、一定の地域・職域などで結び付いた組合員・会員が掛金を出し合い、死亡・病気・事故・火災などが起きた人へ共済金を支払う<strong>相互扶助の保障制度</strong>です。」</p><p>「生命保険と似た保障を提供しますが、一般の保険会社が保険業法に基づいて行う保険とは、運営主体や根拠法が異なります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば都道府県民共済、JA共済、こくみん共済 coop などがあります。全部を一つの法律でまとめて“共済法”が規制しているわけではありません。」</p><p>「JA共済なら農業協同組合法、生活協同組合系なら消費生活協同組合法など、運営主体に応じて根拠法・監督体系が異なります。」</p><p>「先輩、“共済だから保険より絶対安い・絶対得”と覚えるのは危険です。保障範囲、年齢による保障の変化、掛金、割戻金、加入資格などを商品ごとに比較する必要があります。」</p><p>「共済では事業年度の決算で剰余が生じた場合、契約・制度に応じて<strong>割戻金</strong>が支払われることがあります。ただし必ず一定額が戻るわけではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「同じ地域や組織の人たちが大きな共同財布へ少しずつ掛金を入れる場面を想像してください。」</p><p>「誰かに事故や病気などが起きれば共同財布から共済金を出す。年度末に予定より財布に余裕があれば、制度に応じて一部を割戻すこともある。これが“相互扶助”の感覚です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが月2,000円の共済へ加入し、契約で入院1日5,000円の保障があると仮定します。」</p><p>「対象となる病気で10日入院し、支払条件を満たせば、単純化すると5,000円×10日＝5万円の共済金です。」</p><p>「ただし同じ月2,000円でも、民間医療保険と保障内容が同じとは限りません。年齢が上がったときの保障、保障期間、特約などまで比較する必要があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜共済の基本思想は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「組合員等が掛金を出し合ってリスクを支え合う相互扶助です。」</p></div></details><h4>Q2｜すべての共済が保険業法だけで運営される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。運営主体に応じて農業協同組合法や消費生活協同組合法など異なる根拠法があります。」</p></div></details><h4>Q3｜割戻金は必ず一定額もらえる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。決算の剰余などに応じるため、必ず一定額が支払われるとは限りません。」</p></div></details>", "R": "<p>「相互扶助の保障制度。保険会社とは運営主体・根拠法が異なる。共済ごとに保障・加入資格・割戻し等を確認します。」</p>", "M": "<p>「<strong>共済＝一定の集団で掛金を出し合い、構成員のリスクを相互扶助で保障する仕組み。</strong>」</p>"}}, {"title": "災害割増特約と傷害特約", "content": {"A": "<h3>A｜要点</h3><p>「この二つは似ていますが、支払条件が違います。<strong>災害割増特約</strong>は、不慮の事故や所定の感染症などによる死亡・所定の高度障害に対し、主契約の死亡保険金等へ上乗せして給付する特約です。」</p><p>「<strong>傷害特約</strong>は、不慮の事故による死亡だけでなく、事故によって所定の身体障害状態になった場合にも、その障害の程度に応じて給付する点がポイントです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「まず“災害”という言葉を、地震・台風だけだと思わないでください。生命保険でいう不慮の事故には、交通事故や転倒など、急激・偶発・外来の事故が含まれる考え方です。」</p><p>「災害割増特約では、事故等が原因で所定期間内に死亡・高度障害となった場合などに、主契約の保障へ災害死亡保険金等を上乗せします。」</p><p>「一方の傷害特約は、事故で死亡した場合の保障に加え、事故で腕・脚・視力などに所定の障害が残った場合、障害の程度に応じた給付を行うタイプです。」</p><p>「つまり<strong>災害割増＝死亡・高度障害への上乗せ</strong>、<strong>傷害特約＝事故によるより広い身体障害にも対応</strong>、という方向で区別すると分かりやすいです。」</p><p>「なお具体的な対象事故、感染症、支払対象となる障害状態、事故からの期間などは約款によります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「主契約の死亡保障を一階だとします。その上に“事故で死亡・高度障害なら追加でもう一段”と積むのが災害割増特約です。」</p><p>「傷害特約はそこから横にも広がり、“死亡までは至らなくても事故で所定の身体障害が残った”というケースまで拾う網を張るイメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの主契約死亡保険金1,000万円に、災害割増特約500万円が付いているとします。」</p><p>「対象となる交通事故で死亡し支払条件を満たせば、主契約1,000万円＋災害割増500万円＝合計1,500万円となるイメージです。」</p><p>「一方、死亡せず事故によって所定の身体障害が残った場合、傷害特約なら契約で定める障害給付金の対象になることがあります。」</p><p>「病気による通常の死亡まで“災害割増500万円が必ず上乗せ”されるわけではありません。原因を先に見てください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜病気による通常死亡でも災害割増保険金は必ず出る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。災害割増特約は不慮の事故や所定の感染症など、契約で定めた原因が対象です。」</p></div></details><h4>Q2｜事故で死亡せず所定の身体障害が残った場合まで見る特約は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「傷害特約です。障害の程度に応じた給付を行うタイプがあります。」</p></div></details><h4>Q3｜二つを区別する軸は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原因が災害・事故であることに加え、結果が死亡・高度障害中心なのか、より広い身体障害まで対象にするのかを見ます。」</p></div></details>", "R": "<p>「災害割増＝事故等による死亡・高度障害を上乗せ。傷害特約＝事故による死亡に加え所定の身体障害も対象。原因→結果の順で判断します。」</p>", "M": "<p>「<strong>災害割増は事故等の死亡・高度障害を厚くし、傷害特約は事故による身体障害まで保障を広げる。</strong>」</p>"}}, {"title": "災害入院特約・疾病入院特約・生活習慣病入院特約", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>災害入院特約・疾病入院特約・生活習慣病入院特約</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、災害入院特約・疾病入院特約・生活習慣病入院特約の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>災害入院特約・疾病入院特約・生活習慣病入院特約を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "退院特約", "content": {"A": "<h3>A｜要点</h3><p>「退院特約は、病気やけがで一定期間以上入院した後、<strong>生存して退院した場合</strong>などに退院給付金を支払う特約です。」</p><p>「入院中の日数に応じて支払う入院給付金とは違い、<strong>退院という出来事</strong>を支払条件にするのがポイントです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「入院中には治療費や食事代などがかかりますが、退院した瞬間に支出が終わるわけではありません。通院、リハビリ、自宅療養の準備、交通費など、退院後にも費用が発生します。」</p><p>「そこで一定の入院をした後に退院したとき、一時金などを支払って退院後の生活を支えるのが退院特約です。」</p><p>「ただし“1日でも入院して退院すれば必ず出る”とは限りません。たとえば継続○日以上の入院後の退院など、契約ごとに条件があります。」</p><p>「また現在の商品では、独立した“退院特約”ではなく退院後通院保障や一時金など別名称・別設計になっている場合もあります。FPの基本概念としては<strong>入院給付＝入院中、退院給付＝所定の入院後の退院時</strong>と分けます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「病院を一本のトンネルだと思ってください。」</p><p>「トンネルの中を進んでいる日数に対してお金が出るのが入院給付。出口を出た瞬間に“これから自宅療養や通院がありますね”と渡される追加資金が退院給付です。」</p><p>「同じ入院関連でも、<strong>中にいる期間</strong>と<strong>出口を出るイベント</strong>で支払条件が違います。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの契約が、“継続20日以上入院し、生存して退院した場合に退院給付金10万円”という条件だと仮定します。」</p><p>「Aさんが30日入院して退院すれば、条件を満たすため10万円が支払われます。」</p><p>「一方、10日で退院したなら、この仮定では入院給付金の対象になっても退院特約の20日条件を満たさず、退院給付金は出ません。」</p><p>「先輩、“退院した＝必ず出る”ではなく、<strong>その前の入院条件までセット</strong>で見るんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜入院給付金と退院給付金の違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「入院給付金は入院日数などを基準に支払われ、退院給付金は所定の入院を経て退院したことを条件に支払われるものです。」</p></div></details><h4>Q2｜1日入院して退院すれば必ず退院給付金が出る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。必要な入院日数など、契約所定の条件を満たす必要があります。」</p></div></details><h4>Q3｜何のための保障と考えると分かりやすい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「退院後の通院・療養・生活再建などに伴う費用を補う保障です。」</p></div></details>", "R": "<p>「入院中の給付とは別。所定の入院→生存退院→退院給付。必要入院日数などは契約条件を確認します。」</p>", "M": "<p>「<strong>退院特約＝所定の入院をした後の退院という出来事に対して給付する特約。</strong>」</p>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、この四つは全部“病気のときのお金”に見えますが、支払う理由が違います。」</p><p>「<strong>特定疾病保障</strong>は、がん・急性心筋梗塞・脳卒中など契約所定の疾病で所定状態になったとき。<strong>リビング・ニーズ特約</strong>は、原因を問わず余命が一定期間以内と判断されたとき。<strong>先進医療特約</strong>は、所定の先進医療を受けたとき。<strong>就業不能保険</strong>は、病気やけがで所定の就業不能状態が続いたときの収入減少に備えます。」</p><p>「病名だけでなく、<strong>何が起きたことに対する保障か</strong>を見れば混ざりません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「特定疾病保障では、“三大疾病と診断されたら全部すぐ同じ条件で支給”とは限りません。がんは診断確定、心疾患・脳血管疾患は手術や一定の状態など、支払条件が商品によって違います。昔の商品と現在の商品でも条件差があります。」</p><p>「リビング・ニーズ特約は死亡保険金を生前に前払いする考え方です。一般に医師の診断等により余命6か月以内と判断された場合、死亡保険金の全部または一部を所定範囲で生前に受け取ります。受け取った分だけ、その後の死亡保険金は減ります。」</p><p>「先進医療特約でいう“先進医療”は、“最新の治療なら何でも”ではありません。療養を受けた時点で厚生労働大臣が定める先進医療に該当し、所定の医療機関で受けるなどの条件があります。先進医療の技術料は公的医療保険の対象外で全額自己負担となるため、そこを補うのが中心です。」</p><p>「就業不能保険は治療費ではなく、働けないことで失う収入を補う発想です。就業不能状態の定義、免責期間、精神疾患の扱いなどは商品差が大きいので、“会社を休んだ＝即給付”ではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「四つの非常ベルを並べます。」</p><p>「①<strong>特定疾病ベル</strong>＝所定の重大疾病・状態になった。②<strong>余命ベル</strong>＝余命が限られ、死亡保険金を生前に使いたい。③<strong>先進医療ベル</strong>＝公的保険外の所定技術料が発生した。④<strong>収入停止ベル</strong>＝病気・けがで働けず給料が減る。」</p><p>「同じ病気でも、一つの出来事から複数の経済的問題が起こります。それぞれ別の穴を埋める保障なんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんががんになり、治療のため長期間働けなくなったとします。」</p><p>「契約所定のがんの支払条件を満たせば特定疾病保険金。さらに所定の先進医療を受ければ先進医療特約から技術料相当等の給付。長期間の就業不能状態が契約条件を満たせば就業不能給付を受けられる可能性があります。」</p><p>「さらに病状が進み、余命6か月以内と判断され、リビング・ニーズ特約の条件を満たせば死亡保険金の一部等を生前に受け取ることも考えられます。」</p><p>「同じ“がん”でも、<strong>疾病そのもの・治療費・収入減・余命</strong>という別々のリスクを保障しているわけです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜最新治療なら何でも先進医療特約の対象？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。療養時点で所定の先進医療に該当することなど、契約上の条件を満たす必要があります。」</p></div></details><h4>Q2｜リビング・ニーズ特約で生前に死亡保険金の一部を受け取ると、死亡時の保険金は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「一般に、生前に受け取った部分に対応して死亡時に残る保険金は減少します。」</p></div></details><h4>Q3｜就業不能保険の目的は治療費だけ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。中心は病気・けがで働けなくなったことによる収入減少への備えです。」</p></div></details>", "R": "<p>「特定疾病＝重大疾病、リビング・ニーズ＝余命、先進医療＝所定の技術料、就業不能＝収入減。四つの“お金が必要な理由”を分けます。」</p>", "M": "<p>「<strong>病気の保障は病名だけでなく、疾病・余命・治療費・収入減のどのリスクを埋めるかで区別する。</strong>」</p>"}}, {"title": "払済保険", "content": {"A": "<h3>A｜要点</h3><p>「払済保険は、保険料の支払いをやめ、その時点の<strong>解約返戻金などを一時払保険料として使い、元の保険期間を変えずに保障額を小さくした保険</strong>へ変更する方法です。」</p><p>「つまり、<strong>もう保険料は払わない・保障期間は基本そのまま・保険金額は小さくなる</strong>、この三点です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、“保険料が苦しいなら解約するしかない”わけではありません。長く続けて解約返戻金がたまっている契約なら、そのお金を使って小さな保険へ作り替えられる場合があります。」</p><p>「払済変更後は、将来の保険料を払わなくてよくなります。その代わり、これから払うはずだった保険料がなくなるので、元と同じ保障額を維持することはできず、保険金額が減ります。」</p><p>「大事なのは、次の延長保険との違いです。<strong>払済は期間を残して金額を下げる</strong>。延長は<strong>金額をなるべく残して期間を短くする</strong>。同じ解約返戻金を何に優先して使うかが違います。」</p><p>「特約は変更時に消滅するものがあるなど、具体的な取扱いは契約によります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100㎡の家を30年間維持する予定だったのに、今後の維持費が払えなくなったとします。」</p><p>「払済は“30年間住む期間は変えず、家を60㎡へ小さくして、今ある資金だけで維持する”イメージです。」</p><p>「<strong>長さを守って、高さを下げる</strong>。グラフなら保障期間はそのまま、保障額が低くなります。」</p>", "D": "<h3>D｜具体例</h3><p>「終身保険1,000万円を契約しているAさんが、今後の保険料負担を続けられなくなったとします。」</p><p>「その時点の解約返戻金を利用して払済保険へ変更した結果、仮に死亡保障が600万円になったとします。」</p><p>「以後の保険料負担はなくなりますが、死亡保障は1,000万円から600万円へ低下します。終身型なら、変更後の600万円の保障を終身で残すイメージです。」</p><p>「数字は契約条件で変わりますが、<strong>保険料ゼロ・期間維持・保障額減少</strong>という関係が本体です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜払済変更後も保険料を払い続ける？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。以後の保険料払込みを中止します。」</p></div></details><h4>Q2｜何を維持し、何が小さくなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として保険期間を維持し、保険金額が小さくなります。」</p></div></details><h4>Q3｜変更の原資は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「その時点の解約返戻金などを一時払保険料として利用します。」</p></div></details>", "R": "<p>「今ある返戻金を使う→以後の保険料なし→期間は基本維持→保障額を縮小。これが払済です。」</p>", "M": "<p>「<strong>払済保険＝保険料を止め、保障期間を残す代わりに保障額を小さくする。</strong>」</p>"}}, {"title": "延長保険", "content": {"A": "<h3>A｜要点</h3><p>「延長保険も、以後の保険料を払わず、その時点の解約返戻金などを使って保険を続ける方法です。」</p><p>「ただし払済と逆で、<strong>元の死亡保険金額を原則維持し、その代わり保険期間を短くする定期保険</strong>へ変更します。」</p><p>「覚え方は、<strong>払済＝期間優先、延長＝金額優先</strong>です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「解約返戻金が300万円あるとして、それだけで“死亡保障1,000万円を一生”維持するのは難しい。でも“一定期間だけ1,000万円”なら買えるかもしれません。」</p><p>「そこで解約返戻金を一時払保険料として使い、元の死亡保険金額と同額を基本に、買える期間だけ定期保険へ変更するのが延長保険です。」</p><p>「払済保険は保障額を減らして元の保険期間を残しました。延長保険は死亡保障額を優先する代わりに、保障期間を切ります。」</p><p>「解約返戻金が十分大きい場合などには取扱いが異なることがあり、延長可能期間や生存保険金部分などの扱いも契約によります。試験では基本関係を押さえてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「同じ量の燃料しか残っていない車を考えます。」</p><p>「払済は“速度を落として目的地まで走り切る”。つまり保障額を下げて期間を守る。」</p><p>「延長は“速度＝保障額を維持して走る”。だから燃料が尽きた地点で保障が終わる。」</p><p>「同じ解約返戻金でも、<strong>金額と期間のどちらを守るか</strong>が反対なんです。」</p>", "D": "<h3>D｜具体例</h3><p>「死亡保険金1,000万円の終身保険を持つAさんが、保険料を払えなくなったとします。」</p><p>「払済へ変更すれば、たとえば死亡保障600万円を終身で残す。一方、延長保険なら死亡保障1,000万円を維持し、たとえば今後15年間だけの定期保険へ変える、という違いです。」</p><p>「実際の金額・期間は解約返戻金や年齢などで計算されます。試験では<strong>600万円終身 vs 1,000万円15年</strong>のように対比すると一気に分かります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜延長保険で原則維持するのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「元の死亡保険金額です。」</p></div></details><h4>Q2｜その代わり何が短くなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険期間です。」</p></div></details><h4>Q3｜払済との一言の違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「払済＝期間を守って金額を下げる。延長＝金額を守って期間を短くする、です。」</p></div></details>", "R": "<p>「以後の保険料なし。解約返戻金を使用。死亡保障額を基本維持。その代わり保障期間短縮。払済との対比が最重要です。」</p>", "M": "<p>「<strong>延長保険＝保険料を止め、保障額を残す代わりに保障期間を短くする。</strong>」</p>"}}, {"title": "契約転換制度", "content": {"A": "<h3>A｜要点</h3><p>「契約転換制度は、現在の生命保険契約の<strong>転換価格（積立部分など）を新しい契約の保険料の一部に充当し、保障内容を新しい契約へ組み替える制度</strong>です。」</p><p>「単なる特約追加ではありません。基本的には<strong>現在の契約を活用して新契約へ乗り換える</strong>仕組みなので、旧契約の条件がそのまま残るとは限りません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば20年前に加入した終身保険を持っている人が、医療保障や介護保障を含む現在の商品へ変えたいとします。そのとき旧契約の積立価値を捨てず、新契約の原資として利用するのが転換です。」</p><p>「ただし新契約の保険料は、原則として<strong>転換時の年齢・保険料率</strong>などを基礎に計算されます。昔の予定利率が高い契約を転換すると、その有利な条件を失うことがあります。」</p><p>「また新しい保障へ変えるので、告知・診査が必要になることがあります。転換すれば必ず得、という制度ではありません。」</p><p>「比較すべきなのは、旧契約をそのまま継続する場合、新規契約を追加する場合、旧契約を転換する場合です。特に<strong>旧契約の予定利率・解約返戻金・保障内容、新契約の保険料</strong>を確認します。」</p><p>「先輩、“転換価格がある＝現金を手渡しでもらう”とも限りません。基本は新契約の保険料原資として内部的に充当する仕組みです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「古い家を下取りに出して新しい家へ建て替えるイメージです。」</p><p>「古い家の価値＝転換価格を新しい家の代金の一部へ充てる。でも建て替えたら、古い家の優れた断熱材まで自動的に残るわけではありません。」</p><p>「保険でも同じで、<strong>旧契約の価値は利用するが、契約条件は新しいものになる</strong>。だから比較が必要です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが30歳で加入した終身保険を50歳で転換するとします。旧契約に転換価格200万円があると仮定します。」</p><p>「その200万円相当を新契約の保険料原資へ充当することで、新しい死亡・医療保障を組み立てます。」</p><p>「しかし新契約の保険料計算は50歳時点の条件が基礎になります。旧契約が高い予定利率で有利だったなら、転換によってその条件を失う可能性があります。」</p><p>「だから“新しい保障になった＝得”ではなく、<strong>何を得て、旧契約の何を失うか</strong>まで比較します。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜転換時に旧契約の積立価値はどうする？</h4><details><summary>答えを見る</summary><div class='answer'><p>「転換価格として新しい契約の保険料原資の一部などに充当します。」</p></div></details><h4>Q2｜新契約の保険料は30歳で旧契約に入ったなら30歳基準？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として転換時の年齢・保険料率など、新契約時点の条件を基礎にします。」</p></div></details><h4>Q3｜高予定利率の旧契約でも転換すれば必ず得？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。有利な旧契約条件を失う可能性があるため、継続・追加加入・転換を比較する必要があります。」</p></div></details>", "R": "<p>「旧契約の価値を新契約へ投入→新しい保障へ組替え。ただし年齢・料率等は転換時基準。旧契約の有利な条件を失わないか確認します。」</p>", "M": "<p>「<strong>契約転換＝旧契約の積立価値を利用して新契約へ組み替える制度で、旧条件がそのまま引き継がれるとは限らない。</strong>」</p>"}}, {"title": "付加・追加・減額", "content": {"A": "<h3>A｜要点</h3><p>「先輩、ここは既存契約を全部作り直さずに保障を調整する方法です。」</p><p>「<strong>付加</strong>は主契約へ新しい特約を付けること。<strong>追加</strong>は既存契約を残したまま別の保険契約へ新たに加入すること。<strong>減額</strong>は既存契約の保険金額などを小さくすることです。」</p><p>「転換との違いは、<strong>元の契約をどう扱うか</strong>を見ると分かります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「付加なら、今ある主契約を基本的に残し、医療特約など新しい保障を上乗せします。ただし途中付加できる特約か、告知が必要かなどは商品によります。」</p><p>「追加加入は、今の契約Aをそのまま維持しながら、新しく契約Bを結びます。古い契約に有利な予定利率などがある場合、それを残しつつ不足保障だけ補えるのが利点です。一方で契約が複数になり管理は増えます。」</p><p>「減額は、たとえば死亡保障3,000万円を1,000万円へ下げることです。減額した部分は一般に解約したものとして扱われ、対応する解約返戻金があれば支払われることがあります。以後の保険料も通常は下がります。」</p><p>「転換は旧契約を利用して新契約へ組み替えるので、旧契約がそのまま残るとは限りません。<strong>付加＝同じ契約に足す、追加＝別契約を足す、減額＝今の契約を小さくする、転換＝新契約へ組み替える</strong>です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一軒の家で考えます。」</p><p>「付加は<strong>今の家に部屋を増築</strong>。追加は<strong>今の家を残して別棟を建てる</strong>。減額は<strong>今の家の一部を取り壊して小さくする</strong>。転換は<strong>古い家の価値を使って建て替える</strong>。」</p><p>「この四枚の絵を持てば、契約の残り方が見えます。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが死亡保障2,000万円の終身・定期等の既存契約を持っていると仮定します。」</p><p>「医療保障だけ不足なら、可能であれば医療特約を<strong>付加</strong>。既存契約を触らず死亡保障1,000万円を増やしたいなら、新しい定期保険へ<strong>追加加入</strong>。」</p><p>「子どもが独立して死亡保障が過大になったなら、2,000万円から1,000万円へ<strong>減額</strong>する選択肢があります。」</p><p>「一方、既存契約の積立価値を使って商品全体を新しい契約へ組み替えるなら<strong>転換</strong>です。目的が似ていても、元契約の扱いが違います。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜既存の主契約へ特約を付けるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「付加です。」</p></div></details><h4>Q2｜今の契約を残して、新たに別契約へ加入するのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「追加です。」</p></div></details><h4>Q3｜死亡保障3,000万円を1,000万円へ下げるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「減額です。減額部分は一般に解約扱いとなり、解約返戻金がある場合は対応額が支払われることがあります。」</p></div></details>", "R": "<p>「付加＝同じ契約に足す。追加＝別契約を足す。減額＝既存契約を小さくする。転換＝旧契約の価値を使って新契約へ組み替える。」</p>", "M": "<p>「<strong>保障見直しは“何を増減するか”だけでなく、“元の契約が残るか”で区別する。</strong>」</p>"}}, {"title": "生命保険料控除", "content": {"A": "<h3>A｜要点</h3><p>「生命保険料控除は、対象となる生命保険料を支払ったとき、一定額を<strong>所得から差し引ける所得控除</strong>です。税金そのものから引く税額控除ではありません。」</p><p>「2012年1月1日以後の新契約は、基本的に<strong>一般生命保険料・介護医療保険料・個人年金保険料</strong>の3区分です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「通常の新契約では、所得税の控除限度は各区分4万円、3区分合計12万円です。ただし2026年分以後は、<strong>23歳未満の扶養親族がいる人の新生命保険料控除</strong>について一般生命保険料の計算が拡充され、一定の場合はその区分の控除額が最高6万円になります。」</p><p>「ただし先輩、ここが罠です。一般生命の枠が6万円になり得ても、生命保険料控除全体の所得税上限は<strong>12万円のまま</strong>です。」</p><p>「旧契約、つまり2011年12月31日以前の対象契約は別計算で、一般生命・個人年金の各区分に最高5万円の仕組みがあります。新旧両方がある場合には組合せ計算が必要です。」</p><p>「控除は“払った保険料がそのまま税金から戻る”制度ではありません。課税所得を減らす制度なので、実際の節税額は控除額×その人に適用される税率などで決まります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「税金を計算する前の所得という山を削る制度だと思ってください。保険料10万円を払ったから税金が10万円減るのではなく、ルールで計算した“控除額”だけ山を低くします。」</p><p>「新制度には一般・介護医療・個人年金という三つの箱があります。そして2026年分から一定の子育て世帯では一般生命の箱だけ少し広がりました。ただし三箱を合わせた天井12万円は残っています。」</p>", "D": "<h3>D｜具体例</h3><p>「通常の新契約で一般生命保険料を年間10万円払ったとします。通常ルールでは年間8万円超なので所得税の一般生命保険料控除は4万円です。」</p><p>「仮に課税所得へ10%の所得税率が適用される人なら、単純化した所得税への効果は4万円×10%=4,000円程度です。10万円の保険料が10万円戻るわけではありません。」</p><p>「なお2026年分以後、23歳未満の扶養親族を有する場合の新生命保険料には特例計算があります。試験年度が指定されたら、その年度の表を確認してください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜生命保険料控除は税額控除？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。課税所得を計算する前に所得から差し引く所得控除です。」</p></div></details><h4>Q2｜通常の新契約3区分は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「一般生命保険料、介護医療保険料、個人年金保険料です。」</p></div></details><h4>Q3｜2026年分の子育て世帯向け拡充で全体上限も12万円から増える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。一定の場合に一般生命保険料控除の区分上限が拡充されますが、3区分合計の所得税上限は12万円です。」</p></div></details>", "R": "<p>「所得控除。新制度は一般・介護医療・個人年金。通常各4万円、合計12万円。2026年分以後は一定の23歳未満扶養親族ありの場合に一般生命の特例があります。」</p>", "M": "<p>「<strong>生命保険料控除＝保険料そのものを返す制度ではなく、一定額を所得から差し引いて課税所得を減らす制度。</strong>」</p>"}}, {"title": "個人年金保険料控除", "content": {"A": "<h3>A｜要点</h3><p>「個人年金保険料控除は、個人年金保険なら何でも使えるわけではありません。<strong>税制適格特約</strong>を付け、一定の要件を満たす個人年金保険料を、一般生命保険料とは別枠で所得控除する制度です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「代表的な要件は、年金受取人が保険料・掛金の払込者本人またはその配偶者であること、年金受取人が被保険者と同一人であること、保険料払込期間が原則10年以上であることです。」</p><p>「さらに確定年金・有期年金では、原則として年金受取開始時に60歳以上で、受取期間が10年以上であることなどが求められます。」</p><p>「だから“老後用だから個人年金控除”ではありません。契約の形そのものが税制要件を満たしている必要があります。」</p><p>「2012年以後の新契約では、通常の所得税上の控除額は年間保険料8万円超で最高4万円です。旧契約には最高5万円の別ルールがあります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「一般生命保険料控除とは別に、“老後年金専用レーン”があると思ってください。」</p><p>「ただし入口には係員がいて、誰が受け取る？何歳から？何年以上払う？何年以上受け取る？という条件を確認します。単に商品名が個人年金保険というだけでは、このレーンには入れません。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさん本人が保険料を払い、Aさん本人を被保険者・年金受取人として、65歳から10年以上年金を受け取る税制適格の個人年金契約を結び、保険料を10年以上払うとします。」</p><p>「要件を満たす新契約なら個人年金保険料控除の対象となり、年間保険料が8万円を超える場合、所得税の控除額は通常最高4万円です。」</p><p>「反対に、受取期間などが税制適格要件を満たさなければ、“個人年金”という名称でもこの別枠を使えない場合があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜個人年金保険なら全部が個人年金保険料控除？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。税制適格特約を付加するなど、所定の要件を満たす契約が対象です。」</p></div></details><h4>Q2｜新契約の通常の所得税控除上限は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「個人年金保険料区分では最高4万円です。」</p></div></details><h4>Q3｜確定・有期年金の代表的な受取要件は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則60歳以後に受取開始し、10年以上の期間にわたって受け取ることなどです。」</p></div></details>", "R": "<p>「個人年金＝自動的に控除ではない。税制適格要件を満たす→一般生命とは別の個人年金保険料控除へ。」</p>", "M": "<p>「<strong>個人年金保険料控除＝税制適格要件を満たした個人年金の保険料を別枠で所得から差し引く制度。</strong>」</p>"}}, {"title": "死亡保険金・満期保険金の税金", "content": {"A": "<h3>A｜要点</h3><p>「ここは丸暗記ではなく、<strong>保険料を実際に負担した人・被保険者・保険金受取人</strong>の三人を並べて判定します。」</p><p>「死亡保険金は、<strong>負担者＝被保険者</strong>なら相続税、<strong>負担者＝受取人</strong>なら所得税、三者が別なら原則贈与税、という基本形です。」</p><p>「満期保険金は死亡がないので、主に<strong>保険料負担者と受取人</strong>を見る。両者同じなら原則所得税、別なら贈与税です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「死亡保険金からいきます。夫が自分の保険料を払い、夫が死亡し、妻が受け取る。夫の死亡をきっかけに夫が負担した財産的価値が妻へ移るので相続税です。」</p><p>「妻が保険料を負担し、夫を被保険者にして、夫死亡時に妻自身が受け取るなら、妻が自分で負担して得た利益なので所得税。一時金なら原則一時所得です。」</p><p>「夫が被保険者、妻が保険料負担者、子が受取人なら、妻の負担によって子が利益を得るため原則贈与税です。」</p><p>「相続人が受け取る死亡保険金には、相続税で<strong>500万円×法定相続人の数</strong>という非課税限度額があります。これは死亡保険金が“完全非課税”という意味ではありません。」</p><p>「満期保険金を保険料負担者本人が一時金で受け取る場合は原則一時所得です。一時所得は、受取額−払込保険料等−特別控除最高50万円で所得を計算し、原則その2分の1が総所得金額へ算入されます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「お金の矢印だけ見てください。“誰のお金で保険を作ったか”から“誰の手に保険金が入ったか”です。」</p><p>「亡くなった本人のお金→遺族なら相続。自分のお金→自分なら所得。生きている別人のお金→自分なら贈与。この三本の矢印でほぼ整理できます。」</p>", "D": "<h3>D｜具体例</h3><p>「①夫が保険料負担者・被保険者、妻が受取人。夫死亡→相続税。」</p><p>「②妻が保険料負担者、夫が被保険者、妻が受取人。夫死亡→妻の所得税（一時所得が基本）。」</p><p>「③妻が保険料負担者、夫が被保険者、子が受取人。夫死亡→子への贈与税が基本です。」</p><p>「満期保険金600万円を、保険料負担者本人が受け取り、払込保険料総額が500万円、他の一時所得がないと単純化すると、600−500−50＝50万円が一時所得。その2分の1の25万円が原則として総所得金額へ算入されます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜夫が保険料を負担し、夫死亡、妻が死亡保険金を受け取る税金は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「相続税です。保険料負担者と被保険者が同じだからです。」</p></div></details><h4>Q2｜妻が保険料を負担し、夫死亡、妻自身が受け取る場合は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「所得税です。一時金なら原則一時所得です。」</p></div></details><h4>Q3｜満期保険金で負担者A・受取人Bなら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則としてAからBへの贈与と考え、贈与税の対象です。」</p></div></details>", "R": "<p>「死亡保険金：負担者＝死亡者→相続、負担者＝受取人→所得、三者別→贈与。満期：負担者＝受取人→所得、別人→贈与。」</p>", "M": "<p>「<strong>保険金の税金は商品名ではなく、“誰のお金で作り、誰が受け取ったか”で判定する。</strong>」</p>"}}, {"title": "金融類似商品の税金", "content": {"A": "<h3>A｜要点</h3><p>「金融類似商品とは、保険の形をしていても実質的に<strong>短期の貯蓄・運用商品に近い一定の保険</strong>です。」</p><p>「代表的には、保険期間5年以下など一定要件を満たす一時払養老保険等の差益が、通常の一時所得ではなく<strong>源泉分離課税</strong>になります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「通常、保険料負担者本人が満期保険金を一時金で受け取れば一時所得でしたね。でも短期間で一時払し、満期に元本＋運用益を受け取る商品は、経済的には預貯金に近くなります。」</p><p>「そこで一定の金融類似商品については、差益に対して原則20.315%（所得税・復興特別所得税15.315%＋地方税5%）を源泉徴収して課税関係を完結させます。」</p><p>「つまり一時所得の“50万円特別控除→さらに1/2”という計算は使いません。」</p><p>「ただし何でも“5年以下なら金融類似商品”と単純化しないでください。保険期間、払込方法、保障倍率など法令上の一定要件を満たす契約が対象です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険という箱に入っているけれど、中身を見ると定期預金にかなり近い商品を想像してください。」</p><p>「税法が箱のラベルではなく実質を見て、“これは通常の生命保険の一時所得ルートではなく、利息に近いルートで課税しよう”と別ゲートへ送るイメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「一定の金融類似商品に500万円を一時払し、満期に550万円を受け取ったと仮定します。差益は50万円です。」</p><p>「対象契約なら、この50万円の差益に対して20.315%の源泉分離課税が行われるのが基本です。単純計算なら約10万1,575円です。」</p><p>「通常の一時所得なら50万円特別控除などがありますが、金融類似商品の源泉分離課税ではそのルートを使わない。この違いが試験ポイントです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜金融類似商品の一定の差益は通常の一時所得？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。一定要件を満たすものは源泉分離課税です。」</p></div></details><h4>Q2｜基本税率は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「現行では差益に対して20.315%が基本です。」</p></div></details><h4>Q3｜保険期間5年以下なら無条件で全部該当？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保険期間だけでなく、払込方法など法令上の一定要件を満たす必要があります。」</p></div></details>", "R": "<p>「保険でも実質が短期金融商品に近い一定契約→差益へ源泉分離課税20.315%。通常の一時所得計算とは別です。」</p>", "M": "<p>「<strong>金融類似商品＝一定の短期貯蓄型保険の差益を、通常の一時所得ではなく源泉分離課税する仕組み。</strong>」</p>"}}, {"title": "非課税となる保険金や給付金", "content": {"A": "<h3>A｜要点</h3><p>「病気・けがなど<strong>身体の傷害に基因して受け取る保険金・給付金</strong>は、所得税上、原則として非課税となるものがあります。」</p><p>「代表例は入院給付金、手術給付金、通院給付金、一定の疾病・傷害に基づく給付金などです。」</p><p>「ただし“生命保険会社から受け取るお金は全部非課税”ではありません。死亡保険金や満期保険金は別の課税関係です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ非課税なのか。病気やけがで受け取る給付は、儲けというより身体的損害・治療負担を補う性格が強いからです。」</p><p>「たとえば本人が病気で入院し、医療保険から入院給付金を受け取っても、通常それ自体に所得税はかかりません。所得補償保険でも、病気・けがにより働けない期間の収入を補う保険金は、身体の傷害に基因するものとして非課税とされています。」</p><p>「一方、養老保険の満期保険金は“身体の傷害を補う給付”ではないので、負担者と受取人の関係に応じ所得税・贈与税の対象になります。」</p><p>「また医療費控除を計算するときは別の注意があります。入院給付金など、医療費を補てんする目的で受け取った金額は、その給付の対象となった医療費から差し引きます。ただし差し引いた結果、給付金が医療費を上回っても、その超過部分を他の医療費から引く必要はなく、その超過部分が課税所得になるわけでもありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「税法の前に二つの箱を置きます。」</p><p>「一つは“利益の箱”。満期で増えたお金などはここに入り、課税を検討します。もう一つは“損害回復の箱”。病気・けがで失ったものを補う給付はここに入り、原則非課税です。」</p><p>「保険会社から来たお金かどうかではなく、<strong>何のために支払われたお金か</strong>を見るんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが入院し、医療費を30万円支払い、生命保険から入院給付金20万円を受け取ったとします。」</p><p>「20万円の入院給付金そのものは原則非課税です。ただし医療費控除では、その入院に対応する医療費30万円から補てん額20万円を差し引き、残り10万円を基礎に他の医療費と合わせて計算します。」</p><p>「もし対応する医療費が15万円、給付金が20万円でも、余った5万円を別の通院費から差し引く必要はありません。またその5万円が直ちに課税されるわけでもありません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜入院給付金には通常所得税がかかる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「身体の傷害に基因して受け取る給付金として、原則非課税です。」</p></div></details><h4>Q2｜満期保険金も“保険金”だから非課税？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。満期保険金は負担者と受取人の関係などにより所得税または贈与税の対象になります。」</p></div></details><h4>Q3｜入院給付金が対象医療費を上回ったら、余りを他の医療費から引く？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。補てん金はその給付の目的となった医療費を限度に差し引きます。」</p></div></details>", "R": "<p>「身体の傷害に基因する給付→原則非課税。満期・死亡保険金とは別。医療費控除では対応する医療費から補てん額を差し引きます。」</p>", "M": "<p>「<strong>保険金の非課税判定は“保険会社から出たか”ではなく、“身体の損害を補うための給付か”を見る。</strong>」</p>"}}, {"title": "事業保障資金の準備", "content": {"A": "<h3>A｜要点</h3><p>「事業保障資金は、経営者や重要な役員に万一のことが起きても、会社を止めないための資金です。」</p><p>「必要額は“社長の年収の何倍”と機械的に決めるのではなく、<strong>借入金返済・固定費・後継者が立ち上がるまでの運転資金・取引への影響</strong>など、死亡によって会社に生じる資金不足から考えます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「個人の生命保険では、遺族の生活費や教育費の不足を必要保障額として計算しましたね。法人も同じです。ただし守る対象が“家族の家計”から“会社のキャッシュフロー”へ変わります。」</p><p>「たとえば社長個人の信用で銀行借入れが成り立っている会社なら、社長死亡後に返済を求められたり、新規融資が難しくなったりする可能性があります。また売上が落ちても家賃・給与・リース料など固定費は続きます。」</p><p>「そこで法人を契約者・保険金受取人、経営者等を被保険者とする生命保険などで、死亡時に会社へ現金が入る仕組みを作ります。」</p><p>「ただし“保険に入れば事業承継問題が全部解決”ではありません。後継者選定、株式承継、借入保証、取引先対応などと合わせて設計します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「社長が会社の大きなエンジンだと思ってください。突然エンジンが止まっても、従業員の給与や家賃という燃料代は毎月出ていきます。」</p><p>「事業保障資金は、新しいエンジンへ交換して会社が再び安定するまでの<strong>非常用燃料タンク</strong>です。」</p>", "D": "<h3>D｜具体例</h3><p>「社長死亡後に、借入返済2,000万円、6か月分の固定費1,200万円、後継者育成・取引維持費800万円が必要と見積もられ、手元の余剰資金が1,000万円あるとします。」</p><p>「単純化すれば必要な事業保障資金は、2,000＋1,200＋800−1,000＝3,000万円です。」</p><p>「この不足3,000万円を死亡保険などで準備する、という順序です。“とりあえず1億円の保険”ではなく、<strong>会社が失うキャッシュを先に計算する</strong>んです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜事業保障資金は誰の生活費を中心に計算する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「会社の事業継続に必要な資金を中心に考えます。遺族個人の生活保障とは分けます。」</p></div></details><h4>Q2｜代表的な必要資金は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「借入返済、固定費、後継者への移行期間の運転資金などです。」</p></div></details><h4>Q3｜保険だけで事業承継は完了する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。後継者・株式・借入保証など他の承継対策と組み合わせます。」</p></div></details>", "R": "<p>「経営者死亡→会社の資金流出・売上減→手元資金を差し引く→不足額を保険等で準備。この順番です。」</p>", "M": "<p>「<strong>事業保障資金＝経営者等の万一でも会社を継続するために必要な資金不足を埋めるお金。</strong>」</p>"}}, {"title": "生命保険料の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「法人が払う生命保険料は、全部を“保険料／現金”で費用処理すればよいわけではありません。」</p><p>「経理処理は、<strong>保険の種類・保険金受取人・解約返戻率など</strong>によって、損金・資産計上・給与などに分かれます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ資産計上する場合があるのか。保険料の中に、将来の解約返戻金や満期保険金として会社へ戻る性格の強い部分が含まれるからです。その部分まで今期の費用にすると、会社の利益を必要以上に小さくしてしまいます。」</p><p>「反対に、その期間の死亡・疾病保障を買うために消費された保険料なら、その期間の費用＝損金という考え方になじみます。」</p><p>「さらに、会社が保険料を負担しているのに保険金等が特定の役員・従業員個人へ帰属する契約では、会社がその人へ経済的利益を与えたとして給与扱いになることがあります。」</p><p>「ですから法人保険は“支払った瞬間”ではなく、<strong>会社に将来戻るのか、保障として消費されるのか、個人へ利益が移るのか</strong>を見て仕訳します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社から100万円の保険料が出ていくところで、三本の道に分けます。」</p><p>「①今期の保障を買って消える→損金。②将来会社へ戻る価値をためる→資産。③役員・従業員個人のために会社が負担→給与。この三方向です。」</p>", "D": "<h3>D｜具体例</h3><p>「会社が年間保険料100万円を払ったとします。」</p><p>「契約の税務上、60万円を資産計上し40万円を損金算入する扱いなら、現金100万円が減っても当期費用は40万円だけです。60万円は保険料積立金等として貸借対照表に残ります。」</p><p>「後でその資産計上額を取り崩す時期になれば、その時点で所定額を損金へ振り替えることがあります。つまり<strong>現金支出の時期と税務上の費用化の時期が一致しない</strong>ことがあるんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜法人が保険料100万円を払えば必ず100万円全額損金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保険種類、受取人、解約返戻率等により資産計上や給与扱いになる部分があります。」</p></div></details><h4>Q2｜資産計上する理由は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「将来会社へ戻る価値、つまり前払・積立的性格を持つ部分を当期費用にしないためです。」</p></div></details><h4>Q3｜誰が保険金を受け取るかは経理に関係する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「はい。受取人は保険料の経済的な帰属を判断する重要な要素です。」</p></div></details>", "R": "<p>「法人保険料→損金・資産・給与のどこへ行くかを判断。現金を払った＝全部費用、ではありません。」</p>", "M": "<p>「<strong>法人の生命保険料は、“将来誰に価値が帰属するか”を見て損金・資産・給与に分ける。</strong>」</p>"}}, {"title": "養老保険の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「養老保険は死亡保険金と満期保険金の両方があるので、<strong>誰がそれぞれを受け取るか</strong>で法人の経理処理が変わります。」</p><p>「基本三パターンは、①死亡・満期とも法人→全額資産、②死亡・満期とも被保険者・遺族→給与、③死亡は遺族・満期は法人→原則1/2資産＋1/2損金です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「①死亡保険金も満期保険金も法人が受け取るなら、会社はどちらの出口でも経済的価値を回収します。そのため支払保険料は原則、保険事故・解約等で契約が終了するまで資産計上します。」</p><p>「②両方とも役員・従業員本人または遺族が受け取るなら、会社が個人のために保険料を負担した経済的利益と考え、給与となります。」</p><p>「③死亡保険金は遺族、満期保険金は法人なら、死亡保障部分は福利厚生的、満期部分は会社へ戻る積立的価値です。そのため原則として保険料の1/2を資産計上し、残り1/2を期間経過に応じ損金算入します。」</p><p>「ただし③でも特定の役員・使用人だけを被保険者にしている場合、損金部分が給与扱いとなることがあります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「養老保険には“死亡出口”と“満期出口”の二つがあります。」</p><p>「両方の出口が会社へ向く→会社の資産。両方が個人側へ向く→給与。死亡出口だけ遺族、満期出口は会社→半分ずつ性格が違う、と整理します。」</p>", "D": "<h3>D｜具体例</h3><p>「法人が年間保険料100万円の養老保険に加入し、死亡保険金受取人を従業員の遺族、満期保険金受取人を法人とします。」</p><p>「福利厚生として普遍的に加入する等の前提なら、原則50万円を資産計上し、50万円を期間の経過に応じて損金算入します。」</p><p>「これがいわゆるハーフタックスの基本形です。ただし“養老保険なら何でも半分損金”ではありません。<strong>受取人の組合せ</strong>が条件です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜死亡・満期とも法人受取なら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「支払保険料は原則全額資産計上です。」</p></div></details><h4>Q2｜死亡は遺族、満期は法人なら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則、保険料の1/2を資産計上し、残り1/2を期間経過に応じ損金算入します。」</p></div></details><h4>Q3｜養老保険なら無条件でハーフタックス？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保険金受取人の組合せなどの要件を満たす必要があります。」</p></div></details>", "R": "<p>「死亡出口と満期出口を見る。法人・法人→資産、個人側・個人側→給与、遺族・法人→原則1/2資産＋1/2損金。」</p>", "M": "<p>「<strong>養老保険の法人経理は、死亡保険金と満期保険金の受取人を見れば基本形が決まる。</strong>」</p>"}}, {"title": "ハーフタックスプランの経理処理", "content": {"A": "<h3>A｜要点</h3><p>「ハーフタックスプランは、法人契約の養老保険で、<strong>死亡保険金受取人を役員・従業員の遺族、満期保険金受取人を法人</strong>とする代表的な福利厚生設計です。」</p><p>「保険料の<strong>1/2を資産計上、1/2を損金算入</strong>することから“ハーフタックス”と呼ばれます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜ半分なのかを意味で覚えましょう。養老保険には死亡保障と満期時の貯蓄性があります。」</p><p>「死亡した場合のお金は遺族へ行くので、従業員の福利厚生として会社が負担する費用的性格があります。一方、満期まで生存した場合の満期保険金は法人へ戻るため、会社の資産形成という性格があります。」</p><p>「この二つを税務上便宜的に1/2ずつに分け、満期側を資産、死亡保障側を損金とするのが基本です。」</p><p>「ただし役員や特定の従業員だけを対象にすると、福利厚生費としての普遍性がなく、損金部分が給与扱いになる場合があります。」</p><p>「“半分損金だから節税商品”だけで覚えると危険です。資産計上した半分は将来保険金等を受け取る際の帳簿価額になり、出口の課税まで含めて考える必要があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「100円の保険料を二つの封筒へ50円ずつ入れます。」</p><p>「遺族保障の封筒→福利厚生費として損金。会社へ戻る満期資金の封筒→保険料積立金として資産。」</p><p>「“半分消える・半分貯まる”ではなく、<strong>税務上の処理を二つの性格へ分ける</strong>イメージです。」</p>", "D": "<h3>D｜具体例</h3><p>「全従業員を合理的な基準で対象とし、年間保険料200万円の養老保険に加入。死亡保険金は遺族、満期保険金は法人とします。」</p><p>「基本処理は100万円を保険料積立金等として資産計上、100万円を福利厚生費等として損金算入です。」</p><p>「もし社長一人だけを被保険者にするなど特定者のみを対象とする場合、同じ“死亡は遺族・満期は法人”でも損金側が給与扱いとなる可能性があります。<strong>受取人だけでなく対象者の範囲</strong>まで見ます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜死亡保険金の受取人は誰？</h4><details><summary>答えを見る</summary><div class='answer'><p>「被保険者である役員・従業員の遺族です。」</p></div></details><h4>Q2｜満期保険金の受取人は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「法人です。」</p></div></details><h4>Q3｜なぜ1/2資産・1/2損金？</h4><details><summary>答えを見る</summary><div class='answer'><p>「満期時に法人へ戻る積立的部分と、遺族保障という福利厚生的部分の二つの性格を税務上1/2ずつに分ける基本取扱いだからです。」</p></div></details>", "R": "<p>「死亡→遺族、満期→法人。保険料1/2資産＋1/2損金。ただし特定者だけなら給与扱いに注意。」</p>", "M": "<p>「<strong>ハーフタックス＝死亡は遺族・満期は法人という養老保険を、原則半分資産・半分損金で処理する設計。</strong>」</p>"}}, {"title": "定期保険・第三分野保険に関わる保険料の取扱い", "content": {"A": "<h3>A｜要点</h3><p>「正式には<strong>定期保険及び第三分野保険に係る保険料の取扱い</strong>です。」</p><p>「2019年7月8日以後の法人契約では、保険期間3年以上で<strong>最高解約返戻率が50%を超える</strong>定期保険・第三分野保険など、保険料に多額の前払部分が含まれるものは、一定額を一定期間<strong>資産計上</strong>し、後で取り崩して損金算入します。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「昔の法人保険は“長期定期なら何割損金”のように商品名で覚える説明が多かったのですが、現在の基本ルールは<strong>最高解約返戻率</strong>を見ることが重要です。」</p><p>「理由は簡単です。解約すると高い割合で戻る時期がある保険は、その時期までの保険料に“今期の保障費”だけでなく“将来戻る前払・積立的価値”が多く含まれています。そこを全額その年の損金にするのは適切でないため、資産へ繰り延べます。」</p><p>「最高解約返戻率が50%以下など、多額の前払部分がない定期保険・第三分野保険は、受取人等の条件に応じ、原則として期間の経過に応じ損金算入する基本取扱いがあります。」</p><p>「一方、50%超なら返戻率の区分に応じて資産計上割合・期間が変わります。特に85%超ではより大きな前払部分を資産計上する仕組みです。」</p><p>「第三分野保険とは、医療・がん・介護など、病気やけが等の一定事由で給付する保険です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「年間保険料100万円の箱を開けたら、“今年の保障に使う部分”と“将来解約すると戻ってくる前払い部分”が混ざっているとします。」</p><p>「返戻率が高い商品ほど、後者が大きい。税務はその前払い部分をいったん倉庫＝資産へ置き、将来の所定期間に少しずつ費用へ出します。」</p><p>「だから<strong>支払保険料＝その年の損金</strong>ではありません。」</p>", "D": "<h3>D｜具体例</h3><p>「法人が最高解約返戻率90%の対象となる定期保険へ加入したとします。」</p><p>「国税庁の現行取扱いでは85%超の区分に入り、資産計上期間の前半では当期分保険料に最高解約返戻率の90%を乗じた割合、つまり90%×90%=81%を資産計上するケースがあります。その後の所定期間では割合が変わり、最終的に資産計上額を取り崩して損金化します。」</p><p>「ここで覚えるべき本質は81%という数字だけではありません。<strong>解約返戻率が高い＝前払性が強い→いったん資産→後で損金</strong>という因果です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜現在の長期定期等の法人税務で重要な指標は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「最高解約返戻率です。」</p></div></details><h4>Q2｜なぜ高返戻率の保険料を全額すぐ損金にしない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「将来戻る可能性の高い前払・積立的部分が多く含まれるためです。」</p></div></details><h4>Q3｜資産計上した金額は永久に損金にならない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。所定の取崩期間に資産を取り崩し、損金算入していく仕組みです。」</p></div></details>", "R": "<p>「2019年改正後は最高解約返戻率を見る。高返戻率→前払性大→一定額を資産計上→後で取り崩して損金。」</p>", "M": "<p>「<strong>定期・第三分野保険の法人税務は、高い解約返戻率に含まれる前払部分を資産へ繰り延べる仕組み。</strong>」</p>"}}, {"title": "長期平準定期保険の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「先輩、長期平準定期保険は、長期間にわたり死亡保険金額が一定の定期保険です。法人税務では、昔の契約と現在の契約で処理を分けて考える必要があります。」</p><p>「<strong>2019年7月8日以後</strong>の対象契約は、前項で学んだとおり商品名だけで決めず、原則として<strong>最高解約返戻率</strong>を基準に資産計上額・期間を判断します。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「昔のFP教材では、“長期平準定期保険は保険期間の前半6割で保険料の1/2を資産、1/2を損金、後半4割で全額損金にしながら前払分を取り崩す”という説明がよく出ます。これは2019年改正前の一定の契約に関する旧取扱いです。」</p><p>「現在の新規契約へ、その公式をそのまま当てはめてはいけません。2019年改正後は、定期保険・第三分野保険のうち多額の前払部分を含むものについて、最高解約返戻率の区分に応じて資産計上します。」</p><p>「なぜ改正後は返戻率を見るのか。名称が違っても、解約返戻金が高く積み上がる商品なら経済的には“将来戻る前払部分”を多く含むからです。税務は名前より実質を見ている、と考えてください。」</p><p>「したがって試験問題で契約日が示されたら重要です。旧契約の経過措置を問うのか、現行ルールを問うのかを最初に切り分けます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「2019年7月8日に一本の境界線を引いてください。」</p><p>「左側には旧ルールの看板。“長期平準定期”という商品類型ごとの処理。右側には現行ルールの看板。“最高解約返戻率を見て前払部分を測る”。」</p><p>「同じ名前の保険でも、<strong>いつ契約したか</strong>で通る税務ゲートが違うんです。」</p>", "D": "<h3>D｜具体例</h3><p>「A社が2026年に長期の定期保険へ加入したとします。ここで“長期平準だから自動的に半分資産”とはしません。」</p><p>「まず契約が2019年改正後であることを確認し、最高解約返戻率を確認します。たとえば最高返戻率が高く、現行の資産計上対象区分に入るなら、その区分のルールで一定額を資産計上し、後の所定期間に取り崩します。」</p><p>「反対に試験で2018年契約など旧契約が明示され、旧取扱いを問われているなら、旧ルールを使います。<strong>契約日→適用ルール→返戻率等</strong>の順です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜2026年の新規契約を“長期平準だから1/2資産”と即断してよい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。2019年7月8日以後の対象契約は、原則として最高解約返戻率など現行ルールで判断します。」</p></div></details><h4>Q2｜なぜ最高解約返戻率を見る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険料のうち将来戻る前払・積立的価値がどれほど大きいかを見るためです。」</p></div></details><h4>Q3｜旧ルールが試験に出る可能性は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「あります。契約日や問題文が旧契約を前提にしている場合は、経過措置・旧取扱いを区別して答えます。」</p></div></details>", "R": "<p>「契約日を確認。2019年7月8日以後の対象契約→最高解約返戻率中心。改正前契約→旧取扱いを確認。名前だけで処理を決めません。」</p>", "M": "<p>「<strong>長期平準定期保険の経理は、現在は“長期平準”という名称より契約時期と最高解約返戻率を先に見る。</strong>」</p>"}}, {"title": "保険金等の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「法人が保険金や解約返戻金を受け取ったときは、受取額をそのまま全部“利益”と考えるのではありません。」</p><p>「会社がそれまで<strong>資産計上していた保険料積立金等を取り崩し</strong>、受取額との差額を益金または損金として処理するのが基本です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「前項まで、保険料の一部を資産に置く理由を学びましたね。将来会社へ戻る価値があるからでした。」</p><p>「では保険金1,000万円を受け取った瞬間、その資産はどうなるでしょう。契約が終了するなら、帳簿に残していた保険料積立金はもう別個の資産として存在しません。そこで資産を取り崩します。」</p><p>「基本式は<strong>受取保険金等 − その契約に対応する資産計上額 ＝ 雑収入等の利益部分</strong>です。逆に資産計上額の方が大きければ差額が損失になる場合があります。」</p><p>「ただし受け取った保険金を遺族への死亡退職金・弔慰金等に使う場合、その支給側にも別途損金算入の可否や限度などの税務があります。“保険金収入”と“遺族への支出”は別々の取引として考えます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「帳簿に“保険の貯金箱500万円”が置いてあると思ってください。死亡・解約で保険会社から800万円が振り込まれたら、800万円が丸々新しい儲けではありません。」</p><p>「まず帳簿の貯金箱500万円を消す。残った300万円が新たに生じた利益部分です。<strong>現金の増加と利益は同じではない</strong>んです。」</p>", "D": "<h3>D｜具体例</h3><p>「法人が死亡保険金3,000万円を受け取り、その契約について保険料積立金1,200万円を資産計上していたとします。」</p><p>「単純化すると、現預金3,000万円が増え、保険料積立金1,200万円を取り崩し、差額1,800万円を雑収入等として益金計上します。」</p><p>「その後、遺族へ死亡退職金1,500万円を支払うなら、それは別の支出として適正額かどうか等を判定します。“3,000万円入って1,500万円払ったから課税利益1,500万円”と単純に差し引く前に、<strong>資産計上額の取崩し</strong>を忘れないでください。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜保険金3,000万円を受け取れば3,000万円全額が利益？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。対応する資産計上額があれば、それを取り崩して差額を益金・損金として処理します。」</p></div></details><h4>Q2｜資産計上額を取り崩す理由は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約終了等により、その保険契約に対応する帳簿上の資産価値が消滅するためです。」</p></div></details><h4>Q3｜保険金受取と死亡退職金支給は一つの仕訳だけで考える？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。保険金の受取処理と、遺族等への退職金・弔慰金の支給処理は別々に判定します。」</p></div></details>", "R": "<p>「受取額を見る→帳簿の保険資産を取り崩す→差額が利益または損失。現金収入＝全額利益ではありません。」</p>", "M": "<p>「<strong>保険金等の経理＝受取額から対応する資産計上額を外し、その差額を損益として認識する。</strong>」</p>"}}, {"title": "役員退職時の名義変更", "content": {"A": "<h3>A｜要点</h3><p>「先輩、元の項目名は誤記で、ここは<strong>役員退職時の名義変更</strong>として説明します。」</p><p>「法人契約の生命保険を、役員の退職時に法人からその役員個人へ名義変更して退職金の一部として渡す場合、<strong>契約の時価</strong>を基準に法人側・役員側の税務を考えます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「会社が持っている保険契約は財産です。だから名義を変えるだけでも、経済的には会社から役員へ財産を渡しています。」</p><p>「法人側では、契約を移転した時点の適正な評価額と帳簿価額との差額を損益として処理します。役員側では、その評価額が退職給与の一部になります。」</p><p>「評価額は契約内容によりますが、一般には解約返戻金相当額など、税務上の評価ルールに基づいて判断します。近年は、解約返戻金が著しく低い一方で将来価値が高い契約などについて、単純な解約返戻金だけでは評価しない取扱いもあるため注意が必要です。」</p><p>「また退職給与として損金算入できるのは、役員の勤続年数・職責・同業他社の水準などから見て不相当に高額でない範囲です。保険契約を渡せば無制限に損金になるわけではありません。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「会社の金庫に“生命保険契約”という資産が入っています。退職日にその資産の名札を『会社』から『元役員』へ貼り替える場面です。」</p><p>「名札だけの変更に見えても、金庫の財産が個人へ移動しています。だから<strong>その日の価値を測って退職金として渡した</strong>と考えるんです。」</p>", "D": "<h3>D｜具体例</h3><p>「会社の帳簿上、ある生命保険契約の資産計上額が400万円、退職時の税務上の評価額が600万円だったと仮定します。」</p><p>「会社がその契約を役員へ退職金として現物支給すると、会社側では600万円相当の退職給与を支給した取引と、帳簿資産400万円を手放した取引を認識し、差額200万円が損益へ影響します。」</p><p>「役員側では600万円相当が退職給与の一部となり、他の退職金と合わせて退職所得の計算対象になります。実際の評価額・適正額判定は契約条件と税務ルールの確認が必要です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜名義変更は単なる事務手続きで税務上の財産移転ではない？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。法人が保有する保険契約という財産を役員へ移転するため、評価と税務処理が必要です。」</p></div></details><h4>Q2｜役員側では何として受け取る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「退職に伴う適正な支給であれば、契約の評価額が退職給与の一部になります。」</p></div></details><h4>Q3｜必ず解約返戻金だけで評価する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「契約内容によります。税務上、解約返戻金相当額を基礎とする場合がありますが、契約によって別の評価取扱いが必要なことがあります。」</p></div></details>", "R": "<p>「法人の保険契約＝財産。退職時に個人へ移す→時価評価→法人は帳簿価額との差を処理→役員は退職給与として受ける。」</p>", "M": "<p>「<strong>役員退職時の名義変更＝法人所有の保険契約を時価で評価し、退職金として役員へ現物移転する取引。</strong>」</p>"}}, {"title": "損害保険", "content": {"A": "<h3>A｜要点</h3><p>「ここから損害保険です。損害保険は、偶然の事故によって生じた<strong>経済的な損害を補てんする</strong>ことを基本とする保険です。」</p><p>「生命保険が人の死亡・生存などを保障するのに対し、損害保険では火災、自動車事故、賠償責任などによる損失を元の経済状態へ近づける発想が中心です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「たとえば1,000万円の建物が火災で300万円損傷したなら、基本思想は300万円の損害を補うことです。事故が起きたことで被保険者が事故前より儲かるようにするものではありません。」</p><p>「これを<strong>実損てん補</strong>の考え方といいます。後で学ぶ利得禁止の原則につながります。」</p><p>「ただし損害保険のすべてが“実際に払った金額だけ”を支払うわけではありません。傷害保険の死亡・後遺障害保険金のように、契約時に定めた額を支払う定額給付型の保障もあります。」</p><p>「損保を理解するときは、①何の事故を対象にするか、②誰・何に生じた損害か、③損害額をどう評価するか、④保険金額の上限はいくらか、の順に見ると整理できます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「事故前に100の高さだった財産が、火災で60まで落ちたとします。」</p><p>「損害保険は40を補って100へ戻すクレーンです。140まで持ち上げて“事故で40儲かった”状態を作るのが目的ではありません。」</p><p>「この“元へ戻す”感覚が、これから出る保険価額・利得禁止・実損てん補を一本につなぎます。」</p>", "D": "<h3>D｜具体例</h3><p>「時価1,000万円の建物に十分な火災保険を付けていて、対象事故による実際の損害が200万円だったと単純化します。」</p><p>「保険金額が1,000万円だから1,000万円もらえるのではなく、基本は200万円の損害を契約条件に従って補てんします。」</p><p>「逆に建物が全焼して損害1,000万円なら、契約上の保険金額・保険価額などを踏まえて支払額を決めます。<strong>保険金額と実際の損害額は別</strong>です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜損害保険の基本目的は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「偶然の事故で生じた経済的損害を補てんし、事故前の経済状態へ近づけることです。」</p></div></details><h4>Q2｜保険金額1,000万円なら損害200万円でも1,000万円受け取る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「実損てん補型では原則そうなりません。実際の損害額等を基礎に支払額を決めます。」</p></div></details><h4>Q3｜損保は全部実損払い？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。傷害保険の死亡保険金など定額給付型の保障もあります。」</p></div></details>", "R": "<p>「事故→経済的損害→損害額を評価→契約範囲内で補てん。事故で利益を得るための制度ではありません。」</p>", "M": "<p>「<strong>損害保険＝偶然の事故による経済的損失を、契約に従って補てんする保険。</strong>」</p>"}}, {"title": "給付・反対給付均等の原則", "content": {"A": "<h3>A｜要点</h3><p>「正式には<strong>給付・反対給付均等の原則</strong>です。先輩、これは“事故が起きたら払った保険料と同額を返す”という意味ではありません。」</p><p>「保険契約で、保険会社が引き受ける<strong>危険の大きさに応じて保険料を公平に設定する</strong>という考え方です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「“給付”は保険事故が起きたときに保険会社が支払う保険金等、“反対給付”は契約者側が支払う保険料だと考えてください。」</p><p>「事故発生確率が高い人・対象、事故が起きた場合の損害額が大きい契約ほど、保険会社が引き受ける期待損失は大きくなります。ならば同じ保険料では公平ではありません。」</p><p>「そこで、ざっくり言えば<strong>保険料 ∝ 事故発生確率 × 事故時の給付規模</strong>となるよう、危険度に応じて負担を対応させます。」</p><p>「第2章の最初に出た“収支相等の原則”との違いも重要です。収支相等は<strong>保険集団全体</strong>で保険料収入と保険金等の支出を釣り合わせる考え方。給付・反対給付均等は<strong>個々の危険度</strong>に応じて保険料負担を公平にする考え方です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「二人が同じ荷物配送を頼む場面を想像してください。一人は近距離で壊れにくい荷物、もう一人は長距離で壊れやすい高価な荷物です。」</p><p>「事故リスクが違うのに送料＝保険料を完全に同じにしたら不公平ですよね。<strong>重いリスクには重い負担、軽いリスクには軽い負担</strong>。それが均等という意味です。」</p>", "D": "<h3>D｜具体例</h3><p>「単純化して、事故時に100万円支払う契約AとBがあるとします。Aの事故確率が1%、Bが5%なら、期待保険金はAが1万円、Bが5万円です。」</p><p>「経費等を無視すれば、Bの方が保険会社の引受危険が大きいため、保険料も高くするのが合理的です。」</p><p>「ここで“二人とも保険金100万円だから同じ保険料”とはしません。<strong>給付額だけでなく発生確率まで含めた危険度</strong>を見ます。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜“均等”とは全員同じ保険料という意味？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。危険度に応じて保険料負担を対応させるという公平性です。」</p></div></details><h4>Q2｜収支相等の原則との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「収支相等は保険集団全体の収支バランス、給付・反対給付均等は個々の危険度と保険料負担の対応に注目します。」</p></div></details><h4>Q3｜事故確率が高ければ、他条件が同じなら保険料はどうなる方向？</h4><details><summary>答えを見る</summary><div class='answer'><p>「高くなる方向です。期待される給付負担が大きくなるからです。」</p></div></details>", "R": "<p>「給付＝保険金等、反対給付＝保険料。危険度が高いほど負担も大きくする。集団全体の収支相等とは視点が違います。」</p>", "M": "<p>「<strong>給付・反対給付均等の原則＝保険会社が引き受ける危険の大きさに応じ、保険料負担を公平に対応させる原則。</strong>」</p>"}}, {"title": "利得禁止の原則", "content": {"A": "<h3>A｜要点</h3><p>「利得禁止の原則は、損害保険によって<strong>実際に生じた損害を超える利益を得てはいけない</strong>という基本原則です。」</p><p>「事故前100だった財産が事故で60になったなら、保険で40を補って100へ戻すのが基本。140にして事故前より儲けさせるのが目的ではありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜこんな原則が必要なのか。もし100万円の物が壊れたら300万円もらえる契約を自由に作れたら、“事故が起きた方が得”になります。すると故意に事故を起こす誘因まで生まれます。」</p><p>「そこで損害保険では、実際の経済的損害をてん補する範囲を基本とし、事故による利得を防ぎます。」</p><p>「ここから、後で出る<strong>保険価額</strong>や超過保険、重複保険の考え方につながります。同じ建物に複数の火災保険を掛けても、実損型なら各社から損害額を超えて二重三重に儲けられるわけではありません。」</p><p>「ただし先輩、傷害保険の死亡保険金など定額給付型まで“実損額しか出ない”と考えないでください。利得禁止は特に実損てん補を基本とする損害保険を理解する軸です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「割れた100万円の壺を想像してください。事故後の価値が20万円なら損害は80万円です。」</p><p>「保険は80万円分の穴を埋める補修材です。穴が80万円なのに150万円分を注いで70万円儲ける、という使い方はさせない。これが利得禁止です。」</p>", "D": "<h3>D｜具体例</h3><p>「時価1,000万円の建物に、A社1,000万円、B社1,000万円の火災保険を重複して契約し、火災による実損が300万円だったと単純化します。」</p><p>「“A社から300万円＋B社から300万円＝600万円もらえる”とは考えません。実損てん補の範囲では、各契約の支払責任を調整し、合計で損害300万円を超えて利得しないようにします。」</p><p>「二つ契約したから損害そのものが二倍になるわけではない、ということです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜損害300万円なら複数契約から合計600万円受け取ってよい？</h4><details><summary>答えを見る</summary><div class='answer'><p>「実損てん補型では原則そうなりません。実際の損害を超える利得を防ぐため、支払額が調整されます。」</p></div></details><h4>Q2｜なぜ利得を禁止する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「事故前より利益を得ることを防ぎ、故意の事故を誘発するような仕組みにしないためです。」</p></div></details><h4>Q3｜傷害保険の死亡保険金も必ず実損額まで？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。定額給付型の保障もあるので、すべての損保給付を実損額だけで考えてはいけません。」</p></div></details>", "R": "<p>「損害を埋める→事故前へ戻す→事故で儲けさせない。複数契約でも実損以上の利得を防ぎます。」</p>", "M": "<p>「<strong>利得禁止の原則＝損害保険を使って実際の損害を超える利益を得させない原則。</strong>」</p>"}}, {"title": "損害保険料の構成", "content": {"A": "<h3>A｜要点</h3><p>「損害保険の保険料も、大きく<strong>純保険料＋付加保険料</strong>でできています。」</p><p>「純保険料は将来の保険金支払いの原資、付加保険料は保険会社の事業運営に必要な経費や利潤などをまかなう部分です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「純保険料を決める中心は、事故がどれくらいの頻度で起きるかという<strong>事故発生頻度</strong>と、事故1件あたりどれくらいの損害になるかという<strong>損害額</strong>です。」</p><p>「たとえば事故確率が高くなったり、修理費が上昇して1事故あたりの支払額が増えたりすれば、必要な純保険料は上がる方向です。」</p><p>「付加保険料には、契約募集、契約管理、損害調査、人件費、システム費など、保険事業を運営するための費用が反映されます。」</p><p>「前に生命保険で“純保険料と付加保険料”を学びましたね。考え方は共通しています。ただ損保では、車種・用途・地域・建物構造などによって事故頻度や損害規模が違うため、リスク区分が保険料へ反映されます。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険料1万円を二つの封筒へ分けるイメージです。」</p><p>「一つは<strong>事故用共同財布</strong>＝純保険料。もう一つは<strong>保険会社を動かす運営費</strong>＝付加保険料です。」</p><p>「事故が増えたり修理単価が上がったりすると、まず事故用共同財布に必要なお金が増えます。」</p>", "D": "<h3>D｜具体例</h3><p>「1万人の同種契約があり、1年間に100件の事故、1件平均50万円の保険金支払いを見込むとします。」</p><p>「予想保険金は100件×50万円＝5,000万円。経費等を無視すれば、1契約あたり平均5,000円が純保険料として必要になります。」</p><p>「ここへ契約管理などの付加保険料が仮に2,000円加われば、営業保険料は7,000円というイメージです。実際の料率計算はもっと複雑ですが、<strong>事故原資＋運営費</strong>という骨格は同じです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜将来の保険金支払いの原資になるのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「純保険料です。」</p></div></details><h4>Q2｜契約管理や募集などの事業経費をまかなうのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「付加保険料です。」</p></div></details><h4>Q3｜事故件数や修理費が増えると純保険料はどうなる方向？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必要な保険金原資が増えるため、一般に上がる方向です。」</p></div></details>", "R": "<p>「営業保険料＝純保険料＋付加保険料。純＝事故への支払い、付加＝会社を運営する費用。」</p>", "M": "<p>「<strong>損害保険料＝将来の損害を支払う純保険料＋保険事業を運営する付加保険料。</strong>」</p>"}}, {"title": "保険金額と保険価額", "content": {"A": "<h3>A｜要点</h3><p>「<strong>保険金額</strong>は契約で設定する“保険会社が支払う限度額”。<strong>保険価額</strong>は事故が起きたときに被保険者が失う可能性のある“保険の対象の経済的価値”です。」</p><p>「先輩、契約書に1,000万円と書いたから建物の価値まで1,000万円になるわけではありません。<strong>契約上の数字と物の価値</strong>を分けます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「建物の保険価額が2,000万円なのに保険金額を1,000万円しか設定していない状態は<strong>一部保険</strong>です。損害全体を十分にカバーできない可能性があります。」</p><p>「逆に保険価額1,000万円なのに保険金額2,000万円なら<strong>超過保険</strong>です。でも利得禁止の原則があるため、全焼しても“2,000万円契約したから2,000万円もらって1,000万円儲ける”というのが基本ではありません。」</p><p>「両者がおおむね一致する状態を全部保険と考えると分かりやすいです。」</p><p>「なお火災保険の支払方式や評価基準には再調達価額・時価など契約上の違いがあり、現在の商品では一部保険時の支払方法も約款によります。試験ではまず用語の関係を確実にしてください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「保険価額を“家そのものの値札”、保険金額を“保険契約に設定した支払上限の札”だと思ってください。」</p><p>「家の値札2,000万円に保険の札1,000万円→足りない。一方、家の値札1,000万円に保険の札2,000万円→札だけ大きくても家の損害は1,000万円まで。ここに利得禁止が効きます。」</p>", "D": "<h3>D｜具体例</h3><p>「建物の保険価額が2,000万円だとします。」</p><p>「保険金額2,000万円なら全部保険のイメージ。1,000万円なら一部保険。3,000万円なら超過保険です。」</p><p>「そして火災で500万円の損害が出たとき、“保険金額3,000万円だから3,000万円受け取る”とはなりません。実際の支払額は損害額と契約条件を基礎に決まります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜契約上の支払限度額を何という？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険金額です。」</p></div></details><h4>Q2｜保険対象の経済的価値は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「保険価額です。」</p></div></details><h4>Q3｜保険価額1,000万円・保険金額2,000万円は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「超過保険です。ただし実損型では利得禁止の原則があるため、保険金額いっぱいまで無条件にもらえるわけではありません。」</p></div></details>", "R": "<p>「保険金額＝契約上の上限。保険価額＝対象物の経済価値。金額＜価額＝一部、金額＞価額＝超過。」</p>", "M": "<p>「<strong>保険金額は契約の上限、保険価額は失う可能性のある経済的価値。</strong>」</p>"}}, {"title": "火災保険", "content": {"A": "<h3>A｜要点</h3><p>「火災保険は名前に“火災”とありますが、商品・補償プランによっては<strong>落雷、破裂・爆発、風災、水災、盗難、水ぬれなど</strong>も補償対象にできます。」</p><p>「そして最重要なのが、<strong>建物と家財は別の保険の対象</strong>だということです。建物だけ契約しても、家財が自動的に全部補償されるとは限りません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「建物には住宅本体や、契約上建物に含まれる設備などがあります。家財は家具・家電・衣類など生活用の動産です。何を保険の対象として契約したかを最初に確認します。」</p><p>「また“火災保険だから自然災害全部OK”でもありません。風災を補償する契約でも、<strong>地震・噴火またはこれらによる津波を原因とする火災・損壊等</strong>は、原則として火災保険だけでは補償されず、地震保険が必要です。」</p><p>「水災と水ぬれも別です。台風・豪雨による洪水や土砂崩れ等は水災、給排水設備の事故や上階からの漏水などは水ぬれとして扱われるのが一般的で、補償条件は契約によります。」</p><p>「火災保険を読むときは、①対象＝建物か家財か、②原因＝火災・風・水など何か、③免責＝地震等ではないか、の順で確認します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「家の周りに複数の盾を置きます。“火”“雷”“風”“水”“盗難”という盾です。」</p><p>「でも盾は契約したものしか置かれません。そして家本体の盾と、家の中の家具の盾も別です。さらに地震という巨大な矢には、通常の火災保険の盾ではなく地震保険という専用盾が必要です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが建物2,000万円だけを保険の対象として火災保険へ加入し、家財は契約していないとします。」</p><p>「対象となる火災で建物に500万円、家具・家電に200万円の損害が出た場合、建物損害は契約条件に従い補償対象になり得ますが、家財200万円は“同じ家の中だから”という理由だけでは補償されません。」</p><p>「また地震で火災が発生した場合、通常の火災保険だけでは原則補償されません。<strong>何が壊れたか＋何が原因か</strong>の両方を見るんです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜建物の火災保険に入れば家財も必ず補償？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。建物と家財は別の保険対象なので、家財も対象にした契約が必要です。」</p></div></details><h4>Q2｜地震が原因の火災は通常の火災保険で原則補償？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として補償されません。地震保険の領域です。」</p></div></details><h4>Q3｜火災保険は火災だけ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。契約内容により落雷・風災・水災・盗難なども補償対象になり得ます。」</p></div></details>", "R": "<p>「対象＝建物/家財を確認→原因を確認→地震等の免責を確認。名前が火災でも補償範囲は火災だけではありません。」</p>", "M": "<p>「<strong>火災保険＝建物・家財について、契約した火災その他の偶然な事故による損害を補償する保険。</strong>」</p>"}}, {"title": "失火責任法", "content": {"A": "<h3>A｜要点</h3><p>「失火責任法は、<strong>失火によって他人へ損害を与えても、失火者に重大な過失がなければ、民法709条の不法行為による損害賠償責任を原則負わせない</strong>という特則です。」</p><p>「つまり“火を出した人は一切責任なし”ではありません。<strong>重大な過失なら責任を負う</strong>のが第一の例外です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「なぜこんな特則があるのか。木造住宅が密集していた時代など、ひとたび失火すると延焼範囲が非常に大きくなり、軽い過失の失火者一人に周囲すべての損害を負わせるのは酷だという考えが背景にあります。」</p><p>「ただし“重大な過失”があれば失火責任法による免責はありません。重大な過失とは、わずかな注意をすれば結果を予見・回避できたのに、それを著しく怠ったような場合をいいます。具体的判断は個別事情によります。」</p><p>「もう一つ大事なのが<strong>賃貸住宅</strong>です。失火責任法が直接制限するのは民法709条の不法行為責任です。借主には大家に対し、賃貸借契約に基づいて借りた建物を返還する義務があります。」</p><p>「そのため借主の過失による火災で借りた部屋を損傷すると、重大な過失がなくても、大家に対する<strong>債務不履行責任</strong>が問題になり得ます。ここを補うのが火災保険に付帯する借家人賠償責任補償などです。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「A宅から失火し、隣のB宅へ燃え移った場面を想像してください。」</p><p>「A→Bの矢印には“失火責任法”という壁があり、軽過失なら原則として不法行為責任を遮ります。でも重過失なら壁が開きます。」</p><p>「一方、Aが賃貸住宅の借主なら、A→大家の間には“賃貸借契約”という別の道があります。こちらは失火責任法の壁だけでは止まりません。」</p>", "D": "<h3>D｜具体例</h3><p>「賃貸アパートのAさんが軽い過失で火災を起こし、自室と隣室に損害を与えたとします。」</p><p>「隣人に対する民法709条上の不法行為責任は、重大な過失がなければ失火責任法により原則制限されます。」</p><p>「しかし大家に対しては、借りた部屋を損傷したことについて賃貸借契約上の債務不履行責任が生じる可能性があります。」</p><p>「だから賃貸住宅では“失火責任法があるから賠償保険はいらない”とはなりません。借家人賠償責任補償が重要になるわけです。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜軽過失の失火で隣家へ延焼した場合、不法行為責任は原則どうなる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「失火責任法により、重大な過失がなければ民法709条の不法行為責任は原則として負いません。」</p></div></details><h4>Q2｜重大な過失でも免責される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。重大な過失がある場合は失火責任法による免責の対象外です。」</p></div></details><h4>Q3｜賃貸住宅の借主は軽過失なら大家への責任も必ずゼロ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。大家との賃貸借契約に基づく債務不履行責任が別途問題になります。」</p></div></details>", "R": "<p>「隣人への不法行為→軽過失なら原則免責、重過失なら責任。賃貸の大家→契約責任は別問題。」</p>", "M": "<p>「<strong>失火責任法＝軽過失の失火による不法行為責任を原則制限するが、重過失と賃貸借上の契約責任は別に考える。</strong>」</p>"}}, {"title": "地震保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、地震保険は単独では契約できません。<strong>居住用建物または生活用動産（家財）の火災保険に付帯して契約する</strong>保険です。」</p><p>「対象は地震・噴火、またはこれらによる津波を原因とする火災・損壊・埋没・流失。普通の火災保険だけでは原則カバーされない地震リスクを受け持ちます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「地震は一度起きると広範囲に巨大な損害が出ます。民間保険会社だけで引き受けるにはリスクが大きすぎるため、地震保険は<strong>政府と民間損保が共同で支える制度</strong>になっています。」</p><p>「保険金額にも特徴があります。地震保険金額は、付帯する火災保険の保険金額の<strong>30〜50％</strong>の範囲で設定し、上限は<strong>建物5,000万円、家財1,000万円</strong>です。」</p><p>「ですから地震で家が全壊したら、火災保険と同じ金額を丸ごと再建費として受け取る制度ではありません。被災後の生活安定を目的とする性格が強いんです。」</p><p>「損害程度は現在、全損・大半損・小半損・一部損の区分で認定され、それぞれ地震保険金額に対する所定割合が支払われます。個々の修理費を1円単位でそのまま精算する仕組みとは違います。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「火災保険を大きな家、その横に地震保険という専用の避難小屋を付けるイメージです。」</p><p>「避難小屋だけを空き地に建てることはできない＝地震保険単独契約は不可。そして家本体と同じ大きさではなく、火災保険金額の30〜50％という範囲です。」</p>", "D": "<h3>D｜具体例</h3><p>「建物の火災保険金額が2,000万円なら、地震保険金額は600万円〜1,000万円の範囲で設定します。」</p><p>「仮に地震保険金額1,000万円で、地震による損害が所定の“全損”と認定されれば、地震保険金額の100％である1,000万円が支払われる基本形です。」</p><p>「“建物価値2,000万円だから地震保険も2,000万円”ではないところが重要です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜地震保険だけ単独で契約できる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「できません。火災保険に付帯して契約します。」</p></div></details><h4>Q2｜火災保険2,000万円なら地震保険はいくらの範囲？</h4><details><summary>答えを見る</summary><div class='answer'><p>「600万円〜1,000万円です。火災保険金額の30〜50％だからです。」</p></div></details><h4>Q3｜地震による火災は普通の火災保険だけで原則補償される？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則されません。地震・噴火・津波を原因とする損害は地震保険の領域です。」</p></div></details>", "R": "<p>「火災保険に付帯／30〜50％／建物5,000万円・家財1,000万円上限／政府と民間で支える。ここをセットで。」</p>", "M": "<p>「<strong>地震保険＝火災保険に付帯し、地震・噴火・津波による損害から被災後の生活を支える保険。</strong>」</p>"}}, {"title": "自動車保険", "content": {"A": "<h3>A｜要点</h3><p>「自動車事故への備えは、まず強制加入の<strong>自賠責保険</strong>が土台、その上に任意の自動車保険を重ねる二階建てです。」</p><p>「任意保険では、<strong>相手の人・相手の物・自分や同乗者の身体・自分の車</strong>という四方向の損害を、それぞれ別の補償で守ります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「相手を死傷させた損害は対人賠償、相手の車・建物などを壊した損害は対物賠償。自分や同乗者のけがには人身傷害や搭乗者傷害、自分の車の損害には車両保険、という地図です。」</p><p>「自賠責は“相手の身体”しか基本的に守りません。相手の高級車を壊した、自分の車が大破した、自分自身が大けがをした、といった部分は自賠責だけでは足りません。」</p><p>「任意保険には一般にノンフリート等級制度があり、事故歴等に応じて保険料へ影響します。具体的な補償範囲・免責金額・運転者条件は契約ごとに確認します。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「車の周囲を四つの盾で囲みます。前方の人に“対人”、前方の物に“対物”、車内の人に“人身傷害・搭乗者傷害”、車そのものに“車両保険”。」</p><p>「そして地面には最低限の土台として自賠責があります。ただしその土台は相手の人身損害用なので、四つ全部を支えているわけではありません。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが交差点で事故を起こし、相手運転者が負傷、相手車が300万円損傷、自分も負傷、自分の車も200万円損傷したとします。」</p><p>「相手の負傷→まず自賠責、その不足部分等を対人賠償。相手車300万円→対物賠償。自分のけが→人身傷害等。自車200万円→車両保険、というように“損害の向き”ごとに担当が違います。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜自賠責で相手の車の修理代も補償？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。自賠責は基本的に他人の生命・身体への損害が対象で、物損は対象外です。」</p></div></details><h4>Q2｜自分の車の損害を守る代表的補償は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「車両保険です。」</p></div></details><h4>Q3｜任意自動車保険を整理する四方向は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「相手の人、相手の物、自分・同乗者の身体、自分の車です。」</p></div></details>", "R": "<p>「自賠責を土台に、対人・対物・人身・車両を必要に応じて任意保険で上乗せします。」</p>", "M": "<p>「<strong>自動車保険＝事故による“相手の人・物、自分側の人・車”の損害を分けて備える保険。</strong>」</p>"}}, {"title": "自賠責保険", "content": {"A": "<h3>A｜要点</h3><p>「自賠責保険は、自動車事故の<strong>被害者の人身損害を最低限救済するための強制保険</strong>です。」</p><p>「対象は他人の死亡・傷害など。<strong>物損、自分自身のけが、自分の車</strong>は基本的に対象外です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「自動車損害賠償保障法に基づき、原則として自動車・バイクを運行するために加入が必要です。未加入のまま運行することはできません。」</p><p>「支払限度額は被害者1人につき、<strong>傷害120万円、死亡3,000万円、後遺障害は程度に応じ最高4,000万円</strong>が基本です。」</p><p>「ここで先輩、“死亡3,000万円あるなら任意の対人賠償はいらない？”となりません。重い後遺障害や死亡事故では損害賠償額が自賠責限度を大きく超えることがあります。その超過分をカバーするのが任意の対人賠償保険です。」</p><p>「また被害者保護のため、被害者が保険会社へ直接請求できる仕組みもあります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「道路を走るすべての車に、法律が“最低限の救命マット”を敷かせていると思ってください。」</p><p>「人が事故に巻き込まれたときゼロ補償にならないためのマットです。ただし相手の車や塀まで守る巨大マットではありません。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんの過失事故で相手がけがをし、治療費・休業損害・慰謝料など対象となる傷害損害が合計150万円だったと単純化します。」</p><p>「自賠責の傷害限度は被害者1人120万円なので、自賠責だけでは最大30万円分不足します。任意の対人賠償保険があれば、契約条件に従って自賠責を超える部分を補うことになります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜自賠責は任意加入？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。法律に基づく強制保険です。」</p></div></details><h4>Q2｜相手車の修理代は自賠責から出る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「出ません。物損は対象外です。」</p></div></details><h4>Q3｜傷害・死亡・後遺障害の基本限度は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「被害者1人につき傷害120万円、死亡3,000万円、後遺障害は程度に応じ最高4,000万円です。」</p></div></details>", "R": "<p>「強制保険／被害者の人身救済／物損なし／傷害120万・死亡3,000万・後遺障害最高4,000万。」</p>", "M": "<p>「<strong>自賠責＝交通事故被害者の人身損害を最低限保障するため、法律で加入を義務付けた保険。</strong>」</p>"}}, {"title": "対人賠償保険と対物賠償保険", "content": {"A": "<h3>A｜要点</h3><p>「対人賠償保険は、事故で<strong>他人を死傷させ法律上の損害賠償責任</strong>を負ったときの補償。対物賠償保険は、<strong>他人の車・建物・物などを壊して賠償責任</strong>を負ったときの補償です。」</p><p>「対人は、自賠責等で支払われる額を超える部分を任意保険で補うのが基本です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「対人で対象になるのは“他人”です。相手車の運転者や歩行者などへの賠償です。自分自身のけがを対人賠償で補うわけではありません。」</p><p>「対物は単なる修理費だけとは限りません。たとえば店舗へ車が突っ込めば、建物・商品などの直接損害に加え、事故との因果関係が認められる休業損害などが賠償問題になることがあります。」</p><p>「高額事故では賠償額が非常に大きくなり得るため、現在の任意保険では対人・対物を無制限で設定することが一般的です。ただし実際の契約内容を確認してください。」</p><p>「“保険金額無制限”は事故を起こせば好きなだけ受け取れるという意味ではありません。法律上負担する損害賠償額等を契約条件に従って補償するという意味です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「事故現場に二本の矢印を書きます。A車→相手の身体なら対人。A車→相手の財産なら対物。」</p><p>「“人か物か”を最初に判定するだけで、担当する保険がほぼ決まります。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが事故を起こし、相手の人身損害が5,000万円、相手車と店舗の物的損害が1,500万円だったとします。」</p><p>「人身5,000万円については、まず自賠責の対象部分があり、その限度を超える法律上の賠償責任を対人賠償保険で補うのが基本です。」</p><p>「物的損害1,500万円は自賠責では出ないので、対物賠償保険の領域です。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜相手の車の修理代は対人？対物？</h4><details><summary>答えを見る</summary><div class='answer'><p>「対物賠償保険です。」</p></div></details><h4>Q2｜相手のけがについて任意の対人賠償は自賠責とどう関係する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「自賠責等で支払われる額を超える部分を補償するのが基本です。」</p></div></details><h4>Q3｜対物無制限なら事故で無条件に無限のお金を受け取れる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。法律上の損害賠償責任を負う額等を契約条件に従って補償します。」</p></div></details>", "R": "<p>「他人の身体＝対人、他人の財産＝対物。対人には自賠責という土台があり、対物には自賠責がありません。」</p>", "M": "<p>「<strong>対人は他人の生命・身体への賠償、対物は他人の財物への賠償を補う。</strong>」</p>"}}, {"title": "搭乗者傷害保険と人身傷害補償保険", "content": {"A": "<h3>A｜要点</h3><p>「どちらも自分側の人のけがに備える補償ですが、支払方法が違います。」</p><p>「<strong>搭乗者傷害</strong>は、契約で定めた基準・金額に従う定額型。<strong>人身傷害</strong>は、治療費・休業損害・精神的損害などを契約基準で算定した<strong>実際の損害額</strong>を、保険金額の範囲で補償するのが基本です。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「搭乗者傷害は、契約車に搭乗中の人が事故で死傷した場合などに、入通院日数や部位・症状、死亡・後遺障害など契約所定の基準で保険金を支払います。相手からいくら賠償されたかと完全に連動して金額を精算するタイプではありません。」</p><p>「人身傷害は、被保険者に生じた人身損害を約款上の基準で算定し、契約保険金額の範囲で補償します。自分にも過失がある事故で特に意味が分かりやすいです。」</p><p>「たとえば自分の過失30％なら、相手への請求だけでは自分の損害全額を回収できないことがあります。人身傷害なら、自分の過失部分も含めて契約基準で算定した損害を補償できるのが大きな特徴です。」</p><p>「商品によっては、契約車搭乗中だけでなく歩行中や他車搭乗中の自動車事故まで補償するタイプがあります。範囲は契約確認が必要です。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「搭乗者傷害には“けがのメニュー表”が置かれていて、条件を満たしたら所定額を出すイメージです。」</p><p>「人身傷害には“損害計算機”があり、治療費・休業損害などを積み上げて、契約上の基準で実損を埋めます。」</p><p>「だから<strong>定額の搭乗者傷害、実損型の人身傷害</strong>と対比すると覚えやすいです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが相手車との事故でけがをし、契約基準上の人身損害が1,000万円、自分の過失が30％だったと単純化します。」</p><p>「相手側からの賠償だけなら過失相殺が問題になりますが、人身傷害保険が十分な保険金額で付いていれば、契約条件に従いAさん自身の過失部分を含めた損害を補償できます。」</p><p>「一方、搭乗者傷害は“実損1,000万円だから1,000万円”ではなく、契約所定の死亡・後遺障害・入通院等の基準に応じた額を支払います。両方付帯していれば、それぞれの支払条件を満たす場合があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜定額型として整理するのはどちら？</h4><details><summary>答えを見る</summary><div class='answer'><p>「搭乗者傷害保険です。」</p></div></details><h4>Q2｜実際の人身損害を契約基準で算定して補償するのは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「人身傷害補償保険です。」</p></div></details><h4>Q3｜自分に過失がある事故でも人身傷害は役立つ？</h4><details><summary>答えを見る</summary><div class='answer'><p>「はい。契約条件に従い、自分の過失部分を含めた人身損害を補償できる点が重要です。」</p></div></details>", "R": "<p>「搭乗者傷害＝所定額。人身傷害＝損害額を算定して補償。どちらも自分側の人身保障ですが、支払い方が違います。」</p>", "M": "<p>「<strong>搭乗者傷害は定額、人身傷害は実損型――この違いを軸に覚える。</strong>」</p>"}}, {"title": "無保険車傷害保険", "content": {"A": "<h3>A｜要点</h3><p>「無保険車傷害保険は、相手の車に十分な対人賠償保険がないなどのため、こちらが死亡・後遺障害を負ったのに<strong>相手から十分な賠償を受けられない</strong>場合に備える補償です。」</p><p>「名前の“無保険車”だけに引っ張られないでください。相手が完全な無保険だけでなく、対人賠償の保険金額が不足する場合や、ひき逃げなど相手が分からない場合も契約上の対象になり得ます。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「事故でこちらに1億円の損害が生じても、加害者に資力がなく、任意の対人賠償保険も十分でなければ、法律上請求できても実際に回収できないことがあります。」</p><p>「そこで自分側の自動車保険から、相手が本来負うべき賠償額を基礎として、契約条件に従い不足を補うのが無保険車傷害です。」</p><p>「ここで人身傷害との違いが大切です。人身傷害は自分側の人身損害を契約基準で算定し、自分の過失部分も含めて補う仕組み。一方、無保険車傷害は<strong>賠償義務を負う相手がいるのに、その相手から十分回収できない</strong>場面を中心に考えます。」</p><p>「また補償対象は一般に死亡・後遺障害など重大な人身損害が中心で、単なる車両損害を補う保険ではありません。細かな対象事故・限度額は契約によります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「事故後、加害者から被害者へ“賠償金の橋”が架かるはずだったのに、相手が無保険で橋が途中で切れている場面を想像してください。」</p><p>「無保険車傷害は、その<strong>切れた橋の不足部分を自分側からつなぐ</strong>補償です。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが相手の一方的な事故で重い後遺障害を負い、法律上の損害額が8,000万円と認定されたと単純化します。」</p><p>「ところが相手には自賠責しかなく、任意の対人賠償保険も十分な資力もないとします。自賠責等から支払われる額だけでは大きな不足が残ります。」</p><p>「Aさん自身の契約に無保険車傷害があり支払条件を満たせば、その不足について契約限度額の範囲で補償を受けられる可能性があります。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜相手が完全な無保険でなければ絶対に対象外？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。対人賠償の補償が不足する場合や、ひき逃げ等も契約上対象となり得ます。」</p></div></details><h4>Q2｜自分の車の修理費を補う保険？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。中心は死亡・後遺障害などの人身損害です。自車損害は車両保険の領域です。」</p></div></details><h4>Q3｜人身傷害との違いは？</h4><details><summary>答えを見る</summary><div class='answer'><p>「人身傷害は自分側の人身損害を契約基準で補償するのに対し、無保険車傷害は賠償相手から十分な賠償を回収できない重大な人身事故への備えが中心です。」</p></div></details>", "R": "<p>「相手に賠償責任がある→でも無保険・補償不足・ひき逃げ等で回収できない→自分側の無保険車傷害が不足を補う。」</p>", "M": "<p>「<strong>無保険車傷害＝相手から十分な賠償を受けられない重大な人身事故に備える、自分側の補償。</strong>」</p>"}}, {"title": "車両保険", "content": {"A": "<h3>A｜要点</h3><p>「車両保険は、対人・対物のように“相手へ賠償する保険”ではなく、<strong>自分の契約車そのものに生じた損害</strong>を補償する保険です。」</p><p>「衝突、接触、盗難、火災、台風など、どの事故まで対象になるかは契約タイプによって異なります。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「先輩、自分の過失100％で壁へぶつかった場合を考えてください。相手がいないので、相手の対物賠償から自車の修理費を受け取ることはできません。そこで自車を守る車両保険が意味を持ちます。」</p><p>「車両保険には補償範囲の広い一般型と、対象事故を限定して保険料を抑えるタイプがあります。単独事故や当て逃げ等の扱いは商品・契約タイプによって異なるため、“車両保険に入れば全部の車の損害が出る”とは覚えません。」</p><p>「また免責金額を設定する契約があります。免責10万円なら、対象となる20万円の損害に対し、単純化すれば自己負担10万円を除いた部分が保険金の対象になります。」</p><p>「地震・噴火・津波による車両損害は通常の車両保険では一般に補償対象外で、特約等の有無を確認する必要があります。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「車を中心に置いてください。対人・対物の盾は車から<strong>外向き</strong>に伸び、他人への賠償を守ります。」</p><p>「車両保険の盾だけは<strong>内向き</strong>で、自分の車体を包みます。“誰に払うか”ではなく“何が壊れたか＝自車”を見るんです。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが操作を誤って自宅の塀へ衝突し、自分の車に80万円、塀に30万円の損害が出たとします。」</p><p>「塀が他人所有で法律上の賠償責任を負うなら30万円は対物賠償の領域。一方、自車80万円は車両保険の領域です。」</p><p>「ただし単独事故を補償しない限定型なら、自車80万円が対象外となる可能性があります。だから<strong>車両保険の有無だけでなく補償タイプ</strong>まで確認します。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜相手の車を壊した損害を車両保険で賠償する？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。相手の財物への賠償は対物賠償保険、自分の契約車の損害が車両保険です。」</p></div></details><h4>Q2｜単独事故は車両保険なら必ず補償？</h4><details><summary>答えを見る</summary><div class='answer'><p>「必ずではありません。補償範囲を限定したタイプでは対象外になることがあります。」</p></div></details><h4>Q3｜地震による自車損害は通常の車両保険で当然に補償？</h4><details><summary>答えを見る</summary><div class='answer'><p>「一般には通常の車両保険では対象外です。特約等の契約内容を確認します。」</p></div></details>", "R": "<p>「自分の車＝車両保険。事故原因ごとの対象範囲と免責金額を確認。対物賠償とは向きが逆です。」</p>", "M": "<p>「<strong>車両保険＝衝突・盗難など契約所定の事故で生じた“自分の車”の損害を補償する保険。</strong>」</p>"}}, {"title": "傷害保険", "content": {"A": "<h3>A｜要点</h3><p>「傷害保険は、被保険者が<strong>急激・偶然・外来</strong>の事故によって身体に傷害を負った場合に保険金を支払う保険です。」</p><p>「この三要件が核です。病気そのものは原則として傷害保険の“けが”ではありません。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「“急激”は事故から傷害までの経過が突発的であること、“偶然”は事故の発生や結果が予知できないこと、“外来”は身体の外部から作用したことを表します。」</p><p>「たとえば階段で偶然転倒して骨折したなら、急に起こり、意図せず、外からの転倒衝撃でけがをしたので典型的な傷害事故です。」</p><p>「一方、病気で自然に症状が悪化した場合は外来の事故による傷害ではありません。また故意の事故は“偶然”ではありません。」</p><p>「普通傷害保険は一般に日常生活中の傷害を広く対象とし、国内外を問わない設計が基本です。家族傷害保険なら本人だけでなく所定の家族まで対象を広げます。旅行傷害保険は旅行中という期間・行程に範囲を絞ります。」</p><p>「死亡・後遺障害、入院、手術、通院など、何をどの方式で給付するかは契約によります。損害保険分野の商品でも、人の傷害に対して所定額を支払う定額給付型がある点も思い出してください。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「傷害保険の入口に三人の門番を置きます。」</p><p>「一人目が“急に起きた？”、二人目が“わざとではなく偶然？”、三人目が“身体の外から作用した？”と質問します。」</p><p>「三つの門を通った事故によるけがが、傷害保険の基本的な対象です。だから<strong>急・偶・外</strong>と短く覚えると強いですよ。」</p>", "D": "<h3>D｜具体例</h3><p>「Aさんが雨の日に駅の階段で足を滑らせ、転倒して腕を骨折したとします。」</p><p>「突発的な転倒＝急激、意図しない転倒＝偶然、床との衝突という外部作用＝外来。三要件を満たす典型例なので、契約上の免責等がなければ傷害保険の対象になり得ます。」</p><p>「反対に、Aさんが肺炎で入院しただけなら、病気そのものは急激・偶然・外来の事故によるけがではないため、通常の傷害保険の基本対象ではありません。」</p>", "Q": "<h3>理解確認</h3><h4>Q1｜傷害保険の三要件は？</h4><details><summary>答えを見る</summary><div class='answer'><p>「急激・偶然・外来です。」</p></div></details><h4>Q2｜病気で入院したら普通傷害保険から必ず入院保険金が出る？</h4><details><summary>答えを見る</summary><div class='answer'><p>「いいえ。傷害保険は原則として急激・偶然・外来の事故による傷害が対象です。」</p></div></details><h4>Q3｜故意に自分で起こした事故は“偶然”に当たる？</h4><details><summary>答えを見る</summary><div class='answer'><p>「原則として当たりません。偶然性がないためです。」</p></div></details>", "R": "<p>「傷害保険の入口は急激・偶然・外来。事故による身体のけがを保障し、病気そのものとは分けます。」</p>", "M": "<p>「<strong>傷害保険＝“急激・偶然・外来”の事故によって生じた身体の傷害を保障する保険。</strong>」</p>"}}]};let cards=chapterData.ch1,ti=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];let cur=0,tab="A";const $=x=>document.getElementById(x),sel=$("sel"),q=$("quick"),search=$("search"),tabs=$("tabs");
function fill(){sel.innerHTML="";cards.forEach((c,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;sel.appendChild(o)})}fill();ti.forEach(([k,l])=>{let b=document.createElement("button");b.className="tab";b.textContent=l;b.onclick=()=>{tab=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
