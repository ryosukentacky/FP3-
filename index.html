": "<p>「<strong>無保険車傷害保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "車両保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>車両保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。 仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。車両保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。 仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 車両保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると車両保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。」</p>\n<p>「最初の時点では、まだ車両保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を車両保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に車両保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に車両保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>車両保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 自分の自動車そのものの損害を補償する 「比較軸は 対物賠償=相手の物／車両保険=自分の車 。 仕組みを最初から説明 Aさんが電柱へ衝突し、自分の車の修理に80万円必要。 条件確認 → 車両保険 → お金・保障の変化 自分の自動車そのものの損害を補償する。 なぜ別制度ではないのかは、 対物賠償=相手の物／車両保険=自分の車 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に車両保険と関係する言葉が出ていれば、他の条件を見ずに車両保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 車両保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで車両保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『自分のけがは車両保険ではない』というミスをします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>車両保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "傷害保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>傷害保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 傷害保険はFP試験で押さえるべき重要テーマです。 仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。傷害保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 傷害保険はFP試験で押さえるべき重要テーマです。 仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 傷害保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると傷害保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。」</p>\n<p>「最初の時点では、まだ傷害保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を傷害保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に傷害保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に傷害保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>傷害保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 傷害保険はFP試験で押さえるべき重要テーマです。 仕組みを最初から説明 なぜ別制度ではないのかは、 傷害保険=事故による身体傷害／医療保険=疾病入院等も対象 で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで傷害保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に傷害保険と関係する言葉が出ていれば、他の条件を見ずに傷害保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 傷害保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 つまり順序は、 現実の出来事 → 条件判定 → 傷害保険 → 金額や権利の結果 です。 なぜこの仕組みが必要なのか ② 3コマで動かす 出来事の前 → 傷害保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 具体例を最初から最後まで解説 「では 傷害保険 を具体例に落とします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>傷害保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}]};let cards=chapterData.ch1,ti=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];let cur=0,tab="A";const $=x=>document.getElementById(x),sel=$("sel"),q=$("quick"),search=$("search"),tabs=$("tabs");
function fill(){sel.innerHTML="";cards.forEach((c,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;sel.appendChild(o)})}fill();ti.forEach(([k,l])=>{let b=document.createElement("button");b.className="tab";b.textContent=l;b.onclick=()=>{tab=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
