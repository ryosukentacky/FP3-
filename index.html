変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>繰上げ返済は元金へ直接働きかけるため、その元金に将来付くはずだった利息を減らします。期間短縮型は完済時期を前へ動かし、返済額軽減型は完済時期を大きく変えず毎月負担を下げます。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「繰上げ返済（期間短縮型・返済額軽減型）を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>同じ100万円を同じ日に返すなら、利息削減重視では期間短縮型が一般に有利。収入減などで月返済を下げたいなら返済額軽減型の目的が合います。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。繰上げ返済（期間短縮型・返済額軽減型）を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>を一言で説明してください。<details><summary>答え</summary>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 同じ100万円を同じ日に返すなら、利息削減重視では期間短縮型が一般に有利。収入減などで月返済を下げたいなら返済額軽減型の目的が合います。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>繰上げ返済は元金へ直接働きかけるため、その元金に将来付くはずだった利息を減らします。期間短縮型は完済時期を前へ動かし、返済額軽減型は完済時期を大きく変えず毎月負担を下げます。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>繰上げ返済（期間短縮型・返済額軽減型）と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>繰上げ返済（期間短縮型・返済額軽減型）</dd><dt>② 一番重要なのは？</dt><dd>予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</dd>\n<dt>③ なぜ？</dt><dd>利息は将来の残高と期間に対して発生するので、元金を早く減らすほど将来利息を減らせます。期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。</dd><dt>④ イメージ</dt><dd>ボーナス100万円を住宅ローンへ繰上げ返済する場面。</dd>\n<dt>⑤ 具体例</dt><dd>家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。</dd><dt>⑥ 注意</dt><dd>期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>繰上げ返済（期間短縮型・返済額軽減型）＝予定より早く元金を返し、返済期間を縮めるか、以後の毎回返済額を軽くする方法です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "財形住宅融資", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>財形住宅融資</strong>です。」</p>\n<p>「一言でいうと――<strong>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>財形住宅融資</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</p>\n<p>「先輩、ここで一回止めます。<strong>財形住宅融資</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>財形住宅融資</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>財形住宅融資</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。財形貯蓄をしているだけで無条件に借りられるわけではなく、加入期間や残高など所定要件を確認します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社で財形貯蓄を続けてきた人が住宅購入する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>財形住宅融資</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社で財形貯蓄を続けてきた人が住宅購入する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>財形住宅融資</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「財形住宅融資を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>フラット35は財形貯蓄を前提としない別の住宅ローンです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>問題文に『財形貯蓄を1年以上』などの情報があれば、なぜその情報が書かれているのかを考えると財形住宅融資へ結びつきます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。財形住宅融資を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>財形住宅融資</strong>を一言で説明してください。<details><summary>答え</summary>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>フラット35は財形貯蓄を前提としない別の住宅ローンです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 問題文に『財形貯蓄を1年以上』などの情報があれば、なぜその情報が書かれているのかを考えると財形住宅融資へ結びつきます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>財形住宅融資は『財形をしている勤労者への住宅支援』という制度のつながりで覚えます。財形貯蓄をしているだけで無条件に借りられるわけではなく、加入期間や残高など所定要件を確認します。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>財形住宅融資と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>財形住宅融資</dd><dt>② 一番重要なのは？</dt><dd>財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</dd>\n<dt>③ なぜ？</dt><dd>勤労者の財産形成を支援する制度なので、財形貯蓄の実績などを入口に住宅資金の融資へつなげます。</dd><dt>④ イメージ</dt><dd>会社で財形貯蓄を続けてきた人が住宅購入する場面。</dd>\n<dt>⑤ 具体例</dt><dd>財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。</dd><dt>⑥ 注意</dt><dd>フラット35は財形貯蓄を前提としない別の住宅ローンです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>財形住宅融資＝財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "フラット35", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>フラット35</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>フラット35</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</p>\n<p>「先輩、ここで一回止めます。<strong>フラット35</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>フラット35</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>フラット35</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>全期間固定なので、借入後の市場金利上昇リスクを借り手が直接負いにくい一方、変動金利が低下しても自動で低金利へ下がるわけではありません。住宅自体にも所定の技術基準があります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>将来の金利上昇を避け、返済額を安定させたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>フラット35</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>将来の金利上昇を避け、返済額を安定させたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>フラット35</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「フラット35を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>金利上昇局面では固定の安心が効きます。逆に市場金利が大きく低下した場合は、その恩恵を受けるには借換えなど別の判断が必要です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。フラット35を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>フラット35</strong>を一言で説明してください。<details><summary>答え</summary>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 金利上昇局面では固定の安心が効きます。逆に市場金利が大きく低下した場合は、その恩恵を受けるには借換えなど別の判断が必要です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>全期間固定なので、借入後の市場金利上昇リスクを借り手が直接負いにくい一方、変動金利が低下しても自動で低金利へ下がるわけではありません。住宅自体にも所定の技術基準があります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>フラット35と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>フラット35</dd><dt>② 一番重要なのは？</dt><dd>住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</dd>\n<dt>③ なぜ？</dt><dd>借入時に返済終了までの金利が決まるため、市場金利が上昇しても返済計画を立てやすいのが特徴です。</dd><dt>④ イメージ</dt><dd>将来の金利上昇を避け、返済額を安定させたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。</dd><dt>⑥ 注意</dt><dd>固定期間選択型は途中で固定期間が終わります。フラット35は全期間固定が軸です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>フラット35＝住宅金融支援機構と民間金融機関が提携する、最長35年の全期間固定金利型住宅ローンです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "財形貯蓄制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>財形貯蓄制度</strong>です。」</p>\n<p>「一言でいうと――<strong>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>財形貯蓄制度</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</p>\n<p>「先輩、ここで一回止めます。<strong>財形貯蓄制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>財形貯蓄制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>財形貯蓄制度</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>一般財形は使途自由、住宅財形は住宅、年金財形は老後という目的の違いで整理します。住宅・年金は一定要件のもと税制上の優遇がありますが、目的外の払出しでは扱いが変わるため『目的』が重要です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>財形貯蓄制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>財形貯蓄制度</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「財形貯蓄制度を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>住宅購入予定なのに一般財形しか覚えていない、というより『何のために積み立てるか』から種類を選びます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。財形貯蓄制度を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>財形貯蓄制度</strong>を一言で説明してください。<details><summary>答え</summary>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 住宅購入予定なのに一般財形しか覚えていない、というより『何のために積み立てるか』から種類を選びます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>一般財形は使途自由、住宅財形は住宅、年金財形は老後という目的の違いで整理します。住宅・年金は一定要件のもと税制上の優遇がありますが、目的外の払出しでは扱いが変わるため『目的』が重要です。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>財形貯蓄制度と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>財形貯蓄制度</dd><dt>② 一番重要なのは？</dt><dd>勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</dd>\n<dt>③ なぜ？</dt><dd>目的別に積み立てることで、住宅取得や老後資金づくりを支援します。住宅財形・年金財形には一定の税制上の扱いがあります。</dd><dt>④ イメージ</dt><dd>給与から毎月2万円を天引きして将来の住宅資金を作る場面。</dd>\n<dt>⑤ 具体例</dt><dd>住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。</dd><dt>⑥ 注意</dt><dd>一般財形は使途が自由。住宅財形・年金財形は目的が限定されます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>財形貯蓄制度＝勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "団体信用生命保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>団体信用生命保険</strong>です。」</p>\n<p>「一言でいうと――<strong>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>団体信用生命保険</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</p>\n<p>「先輩、ここで一回止めます。<strong>団体信用生命保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>団体信用生命保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>団体信用生命保険</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>団信では保険事故が起きると保険金が住宅ローン債務の返済に充てられます。したがって遺族の手元へ同額の現金が自由資金として入る通常の死亡保険とは役割が違います。特約付き団信では保障範囲も変わります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>住宅ローン返済中の世帯主が死亡する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>団体信用生命保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>住宅ローン返済中の世帯主が死亡する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>団体信用生命保険</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「団体信用生命保険を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>残債2,000万円が消えても、遺族の生活費2,000万円が現金で増えるわけではありません。『家が残り、住宅ローン負担が消える』とイメージします。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。団体信用生命保険を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>団体信用生命保険</strong>を一言で説明してください。<details><summary>答え</summary>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 残債2,000万円が消えても、遺族の生活費2,000万円が現金で増えるわけではありません。『家が残り、住宅ローン負担が消える』とイメージします。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>団信では保険事故が起きると保険金が住宅ローン債務の返済に充てられます。したがって遺族の手元へ同額の現金が自由資金として入る通常の死亡保険とは役割が違います。特約付き団信では保障範囲も変わります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>団体信用生命保険と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>団体信用生命保険</dd><dt>② 一番重要なのは？</dt><dd>住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。団信はその残債リスクを保険で消す役割を持ちます。</dd><dt>④ イメージ</dt><dd>住宅ローン返済中の世帯主が死亡する場面。</dd>\n<dt>⑤ 具体例</dt><dd>死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。</dd><dt>⑥ 注意</dt><dd>一般の死亡保険は遺族が生活費等に使う保険金。団信は住宅ローン残高の返済が中心です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>団体信用生命保険＝住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>住宅ローンの借り換え</strong>です。」</p>\n<p>「一言でいうと――<strong>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>住宅ローンの借り換え</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</p>\n<p>「先輩、ここで一回止めます。<strong>住宅ローンの借り換え</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>住宅ローンの借り換え</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>住宅ローンの借り換え</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>借換えは新規ローンで旧ローン残高を一括返済する取引です。だから新ローンの審査や諸費用も発生します。金利差が大きくても残高が少ない・残期間が短い場合は効果が限定的です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>昔の高金利ローンを現在の低金利ローンへ変更する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>住宅ローンの借り換え</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>昔の高金利ローンを現在の低金利ローンへ変更する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>住宅ローンの借り換え</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「住宅ローンの借り換えを、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。住宅ローンの借り換えを使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>住宅ローンの借り換え</strong>を一言で説明してください。<details><summary>答え</summary>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 残高500万円・残り3年なら金利差があっても削減できる利息自体が小さい可能性があります。残高2,000万円・残り20年なら金利差の影響は大きくなりやすいです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>借換えは新規ローンで旧ローン残高を一括返済する取引です。だから新ローンの審査や諸費用も発生します。金利差が大きくても残高が少ない・残期間が短い場合は効果が限定的です。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>住宅ローンの借り換えと似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>住宅ローンの借り換え</dd><dt>② 一番重要なのは？</dt><dd>現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</dd>\n<dt>③ なぜ？</dt><dd>低い金利へ移れば将来利息を減らせますが、新しいローンを組むための事務手数料・登記費用などが発生します。</dd><dt>④ イメージ</dt><dd>昔の高金利ローンを現在の低金利ローンへ変更する場面。</dd>\n<dt>⑤ 具体例</dt><dd>借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。</dd><dt>⑥ 注意</dt><dd>『金利が下がった＝必ず得』ではなく、残高・残期間・金利差・諸費用をまとめて比較します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>住宅ローンの借り換え＝現在の住宅ローンを新しい住宅ローンで完済し、金利や返済条件の改善を狙う方法です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>埋葬に関する給付</strong>です。」</p>\n<p>「一言でいうと――<strong>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>埋葬に関する給付</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</p>\n<p>「先輩、ここで一回止めます。<strong>埋葬に関する給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>埋葬に関する給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>埋葬に関する給付</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>健康保険の死亡関連給付は『誰が死亡したか』『誰が埋葬したか』を先に整理します。名称が似ているため、金額だけで覚えるより人物関係を図にすると安定します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社員が死亡し、家族が埋葬を行う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>埋葬に関する給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員が死亡し、家族が埋葬を行う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>埋葬に関する給付</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「埋葬に関する給付を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>被保険者本人が死亡→生計維持関係のある者が埋葬、というケースと、被扶養者が死亡したケースを分けて覚えます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。埋葬に関する給付を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>埋葬に関する給付</strong>を一言で説明してください。<details><summary>答え</summary>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 被保険者本人が死亡→生計維持関係のある者が埋葬、というケースと、被扶養者が死亡したケースを分けて覚えます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>健康保険の死亡関連給付は『誰が死亡したか』『誰が埋葬したか』を先に整理します。名称が似ているため、金額だけで覚えるより人物関係を図にすると安定します。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>埋葬に関する給付と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>埋葬に関する給付</dd><dt>② 一番重要なのは？</dt><dd>健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</dd>\n<dt>③ なぜ？</dt><dd>死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。</dd><dt>④ イメージ</dt><dd>会社員が死亡し、家族が埋葬を行う場面。</dd>\n<dt>⑤ 具体例</dt><dd>『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。</dd><dt>⑥ 注意</dt><dd>被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>埋葬に関する給付＝健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "任意継続被保険者", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>任意継続被保険者</strong>です。」</p>\n<p>「一言でいうと――<strong>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>任意継続被保険者</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</p>\n<p>「先輩、ここで一回止めます。<strong>任意継続被保険者</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>任意継続被保険者</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>任意継続被保険者</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>退職後は会社が保険料を折半してくれないため、在職時の給与明細の本人負担額だけを見て『同じくらい』と思わないことが大切です。国保と任意継続では扶養の扱いも違うため、世帯全体で比較します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>退職して次の会社がまだ決まっていない場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>任意継続被保険者</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職して次の会社がまだ決まっていない場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>任意継続被保険者</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「任意継続被保険者を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">退職後は任意継続と国保の保険料等を比較。任意継続を選ぶなら申請期限を守る。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>在職中に健康保険料を本人1万円・会社1万円で負担していたなら、退職後の任意継続では本人負担の考え方が変わります。実額は標準報酬等のルールで確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。任意継続被保険者を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>任意継続被保険者</strong>を一言で説明してください。<details><summary>答え</summary>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 在職中に健康保険料を本人1万円・会社1万円で負担していたなら、退職後の任意継続では本人負担の考え方が変わります。実額は標準報酬等のルールで確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>退職後は会社が保険料を折半してくれないため、在職時の給与明細の本人負担額だけを見て『同じくらい』と思わないことが大切です。国保と任意継続では扶養の扱いも違うため、世帯全体で比較します。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>任意継続被保険者と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>任意継続被保険者</dd><dt>② 一番重要なのは？</dt><dd>退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</dd>\n<dt>③ なぜ？</dt><dd>退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。</dd><dt>④ イメージ</dt><dd>退職して次の会社がまだ決まっていない場面。</dd>\n<dt>⑤ 具体例</dt><dd>退職後は任意継続と国保の保険料等を比較。任意継続を選ぶなら申請期限を守る。</dd><dt>⑥ 注意</dt><dd>在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>任意継続被保険者＝退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "国民健康保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>国民健康保険</strong>です。」</p>\n<p>「一言でいうと――<strong>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>国民健康保険</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</p>\n<p>「先輩、ここで一回止めます。<strong>国民健康保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>国民健康保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>国民健康保険</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。また保険料の計算方法は自治体等によって異なります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>退職後、任意継続を選ばず国保へ入る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>国民健康保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>退職後、任意継続を選ばず国保へ入る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>国民健康保険</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「国民健康保険を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">夫婦で国保へ移る場合、会社員時代の『扶養だから保険料ゼロ』と同じ感覚で考えない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>退職した夫と扶養されていた妻が二人とも国保へ入るとき、『妻は扶養だから保険料なし』とは考えません。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。国民健康保険を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>国民健康保険</strong>を一言で説明してください。<details><summary>答え</summary>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 退職した夫と扶養されていた妻が二人とも国保へ入るとき、『妻は扶養だから保険料なし』とは考えません。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>国保には会社の健康保険のような被扶養者制度がないため、家族が加入すればその加入者も保険料計算へ関係します。また保険料の計算方法は自治体等によって異なります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>国民健康保険と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>国民健康保険</dd><dt>② 一番重要なのは？</dt><dd>会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</dd>\n<dt>③ なぜ？</dt><dd>会社を辞めた人や自営業者などにも医療保障が必要なので、市区町村等を単位とする国保でカバーします。</dd><dt>④ イメージ</dt><dd>退職後、任意継続を選ばず国保へ入る場面。</dd>\n<dt>⑤ 具体例</dt><dd>夫婦で国保へ移る場合、会社員時代の『扶養だから保険料ゼロ』と同じ感覚で考えない。</dd><dt>⑥ 注意</dt><dd>会社の健康保険の『被扶養者』と同じ仕組みではなく、世帯内の加入者について保険料を考えます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>国民健康保険＝会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "後期高齢者医療制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>後期高齢者医療制度</strong>です。」</p>\n<p>「一言でいうと――<strong>原則75歳以上などを対象とする独立した公的医療保険制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>後期高齢者医療制度</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</p>\n<p>「先輩、ここで一回止めます。<strong>後期高齢者医療制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>後期高齢者医療制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>後期高齢者医療制度</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>原則75歳到達で、それまでの国保や被用者保険から後期高齢者医療制度へ移ります。一定の障害がある65～74歳で認定を受けた人なども対象になり得ます。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>74歳まで国保だった人が75歳になる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>後期高齢者医療制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>74歳まで国保だった人が75歳になる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>後期高齢者医療制度</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「後期高齢者医療制度を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">75歳到達後は後期高齢者医療制度の被保険者として保険料・窓口負担を考える。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。後期高齢者医療制度を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>後期高齢者医療制度</strong>を一言で説明してください。<details><summary>答え</summary>原則75歳以上などを対象とする独立した公的医療保険制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 74歳の国保加入者が75歳になると、翌年も同じ国保の高齢者枠に残るのではなく制度自体が変わる、と整理します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>原則75歳到達で、それまでの国保や被用者保険から後期高齢者医療制度へ移ります。一定の障害がある65～74歳で認定を受けた人なども対象になり得ます。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>後期高齢者医療制度と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>後期高齢者医療制度</dd><dt>② 一番重要なのは？</dt><dd>原則75歳以上などを対象とする独立した公的医療保険制度です。</dd>\n<dt>③ なぜ？</dt><dd>高齢者の医療を国保や被用者保険とは別の制度で支える仕組みで、対象年齢になると原則こちらへ移ります。</dd><dt>④ イメージ</dt><dd>74歳まで国保だった人が75歳になる場面。</dd>\n<dt>⑤ 具体例</dt><dd>75歳到達後は後期高齢者医療制度の被保険者として保険料・窓口負担を考える。</dd><dt>⑥ 注意</dt><dd>75歳になっても国民健康保険にそのまま残る、という理解は誤りです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>後期高齢者医療制度＝原則75歳以上などを対象とする独立した公的医療保険制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的介護保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的介護保険</strong>です。」</p>\n<p>「一言でいうと――<strong>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>公的介護保険</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</p>\n<p>「先輩、ここで一回止めます。<strong>公的介護保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的介護保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>公的介護保険</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>第1号被保険者は65歳以上、第2号被保険者は40～64歳の医療保険加入者です。第2号は要介護状態なら原因を問わず使えるわけではなく、特定疾病に起因することがポイントです。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>65歳の人が日常生活に介助を必要とする場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的介護保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳の人が日常生活に介助を必要とする場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>公的介護保険</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「公的介護保険を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">申請→認定→ケアプラン等→サービス利用という流れをイメージし、自己負担割合は所得等で確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>70歳で要介護なら原因を問わず認定要件を見ますが、50歳ならまず特定疾病との関係を確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。公的介護保険を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的介護保険</strong>を一言で説明してください。<details><summary>答え</summary>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 70歳で要介護なら原因を問わず認定要件を見ますが、50歳ならまず特定疾病との関係を確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>第1号被保険者は65歳以上、第2号被保険者は40～64歳の医療保険加入者です。第2号は要介護状態なら原因を問わず使えるわけではなく、特定疾病に起因することがポイントです。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>公的介護保険と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的介護保険</dd><dt>② 一番重要なのは？</dt><dd>介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</dd>\n<dt>③ なぜ？</dt><dd>介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。</dd><dt>④ イメージ</dt><dd>65歳の人が日常生活に介助を必要とする場面。</dd>\n<dt>⑤ 具体例</dt><dd>申請→認定→ケアプラン等→サービス利用という流れをイメージし、自己負担割合は所得等で確認。</dd><dt>⑥ 注意</dt><dd>第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的介護保険＝介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "労災保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>労災保険</strong>です。」</p>\n<p>「一言でいうと――<strong>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>労災保険</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</p>\n<p>「先輩、ここで一回止めます。<strong>労災保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>労災保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>労災保険</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>労災保険料は原則として事業主が全額負担します。業務災害だけでなく通勤災害も対象ですが、通勤経路から逸脱・中断した場合の扱いなど、移動の合理性が論点になります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>通勤途中の合理的な経路で事故に遭う場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>労災保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>通勤途中の合理的な経路で事故に遭う場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>労災保険</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「労災保険を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『いつ・どこで・何のための移動か』を確認し、通勤災害に当たるか判断する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>自宅→会社の通常経路で事故なら通勤災害を検討。私的目的で大きく経路を外れた後の事故なら、その逸脱がどう扱われるかを確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。労災保険を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>労災保険</strong>を一言で説明してください。<details><summary>答え</summary>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 自宅→会社の通常経路で事故なら通勤災害を検討。私的目的で大きく経路を外れた後の事故なら、その逸脱がどう扱われるかを確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>労災保険料は原則として事業主が全額負担します。業務災害だけでなく通勤災害も対象ですが、通勤経路から逸脱・中断した場合の扱いなど、移動の合理性が論点になります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>労災保険と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>労災保険</dd><dt>② 一番重要なのは？</dt><dd>業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</dd>\n<dt>③ なぜ？</dt><dd>仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。</dd><dt>④ イメージ</dt><dd>通勤途中の合理的な経路で事故に遭う場面。</dd>\n<dt>⑤ 具体例</dt><dd>『いつ・どこで・何のための移動か』を確認し、通勤災害に当たるか判断する。</dd><dt>⑥ 注意</dt><dd>業務・通勤が原因なら、通常の私傷病として健康保険を使う話と分けて考えます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>労災保険＝業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "雇用保険", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>雇用保険</strong>です。」</p>\n<p>「一言でいうと――<strong>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>雇用保険</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</p>\n<p>「先輩、ここで一回止めます。<strong>雇用保険</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>雇用保険</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>雇用保険</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>基本手当では『失業している』だけでなく、働く意思と能力があり求職活動をしていることが重要です。自己都合か会社都合かなど離職理由によって給付制限等の扱いも変わります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社を退職し、次の仕事を探す場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>雇用保険</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社を退職し、次の仕事を探す場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>雇用保険</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「雇用保険を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『雇用保険＝失業手当だけ』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>退職しても、すぐ働く意思がなく長期休養だけを予定している状態を、そのまま求職中の失業と同一視しません。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。雇用保険を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>雇用保険</strong>を一言で説明してください。<details><summary>答え</summary>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『雇用保険＝失業手当だけ』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 退職しても、すぐ働く意思がなく長期休養だけを予定している状態を、そのまま求職中の失業と同一視しません。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>基本手当では『失業している』だけでなく、働く意思と能力があり求職活動をしていることが重要です。自己都合か会社都合かなど離職理由によって給付制限等の扱いも変わります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>雇用保険と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>雇用保険</dd><dt>② 一番重要なのは？</dt><dd>失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</dd>\n<dt>③ なぜ？</dt><dd>仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。</dd><dt>④ イメージ</dt><dd>会社を退職し、次の仕事を探す場面。</dd>\n<dt>⑤ 具体例</dt><dd>離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。</dd><dt>⑥ 注意</dt><dd>『雇用保険＝失業手当だけ』ではありません。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>雇用保険＝失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>就職促進給付と教育訓練給付</strong>です。」</p>\n<p>「一言でいうと――<strong>就職促進給付は早期再就職などを後押しし、教育訓練給付は指定された学び直しの費用を支援します。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>就職促進給付と教育訓練給付</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>失業状態を長引かせないための『就職するインセンティブ』と、職業能力を高めるための『学ぶ支援』という別の役割があります。</p>\n<p>「先輩、ここで一回止めます。<strong>就職促進給付と教育訓練給付</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>就職促進給付と教育訓練給付</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>就職促進給付と教育訓練給付</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>就職促進給付は基本手当を全部受け切るより早く安定就職することを促す設計です。教育訓練給付は厚生労働大臣指定講座等を通じた能力開発を支援します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>基本手当を受け切る前に再就職する人／資格講座を受ける人。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>就職促進給付と教育訓練給付</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>基本手当を受け切る前に再就職する人／資格講座を受ける人。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>就職促進給付と教育訓練給付</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「就職促進給付と教育訓練給付を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>再就職手当などは就職の話、教育訓練給付は講座受講の話です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>『残りの基本手当日数がある状態で再就職』なら再就職手当等の条件へ、『指定講座の受講費』なら教育訓練給付へ視点を切り替えます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。就職促進給付と教育訓練給付を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>就職促進給付と教
