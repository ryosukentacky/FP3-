す。」</p>\n<p>「一言でいうと――<strong>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>障害厚生年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</p>\n<p>「先輩、ここで一回止めます。<strong>障害厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>障害厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>障害厚生年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>初診日に厚生年金加入中なら厚生年金側の障害給付を検討します。障害基礎年金が1・2級なのに対し、障害厚生年金には3級もあるなど給付構造が異なります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>障害厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>障害厚生年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「障害厚生年金を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>初診時は会社員、その後退職してから障害が重くなった場合でも、現在の職業ではなく初診日の加入制度が重要になります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。障害厚生年金を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>障害厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 初診時は会社員、その後退職してから障害が重くなった場合でも、現在の職業ではなく初診日の加入制度が重要になります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>初診日に厚生年金加入中なら厚生年金側の障害給付を検討します。障害基礎年金が1・2級なのに対し、障害厚生年金には3級もあるなど給付構造が異なります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>障害厚生年金と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>障害厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</dd><dt>④ イメージ</dt><dd>会社員時代に初診日のある病気で障害状態になった場面。</dd>\n<dt>⑤ 具体例</dt><dd>現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</dd><dt>⑥ 注意</dt><dd>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>障害厚生年金＝厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>遺族基礎年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</p>\n<p>「先輩、ここで一回止めます。<strong>遺族基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>遺族基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>遺族基礎年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>遺族基礎年金では『子のある配偶者』または『子』という子要件が核です。ここでいう子には年齢等の要件があります。配偶者だけが残ったから自動的に支給、とは考えません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>遺族基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>遺族基礎年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「遺族基礎年金を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。妻45歳・子なしなら遺族基礎年金では別の判断になります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。遺族基礎年金を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>遺族基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。妻45歳・子なしなら遺族基礎年金では別の判断になります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>遺族基礎年金では『子のある配偶者』または『子』という子要件が核です。ここでいう子には年齢等の要件があります。配偶者だけが残ったから自動的に支給、とは考えません。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>遺族基礎年金と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>遺族基礎年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</dd>\n<dt>③ なぜ？</dt><dd>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</dd><dt>④ イメージ</dt><dd>小学生の子がいる家庭で父または母が死亡する場面。</dd>\n<dt>⑤ 具体例</dt><dd>死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</dd><dt>⑥ 注意</dt><dd>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>遺族基礎年金＝国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "寡婦年金と死亡一時金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>寡婦年金と死亡一時金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>寡婦年金と死亡一時金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</p>\n<p>「先輩、ここで一回止めます。<strong>寡婦年金と死亡一時金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>寡婦年金と死亡一時金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>寡婦年金と死亡一時金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。死亡一時金は保険料納付済期間等に応じた一時金。両方を同時にもらう前提ではなく選択関係も確認します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>寡婦年金と死亡一時金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>寡婦年金と死亡一時金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「寡婦年金と死亡一時金を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>夫死亡時の妻が55歳なら、寡婦年金はすぐ支給開始ではなく60歳からの期間を意識します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。寡婦年金と死亡一時金を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>寡婦年金と死亡一時金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 夫死亡時の妻が55歳なら、寡婦年金はすぐ支給開始ではなく60歳からの期間を意識します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。死亡一時金は保険料納付済期間等に応じた一時金。両方を同時にもらう前提ではなく選択関係も確認します。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>寡婦年金と死亡一時金と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>寡婦年金と死亡一時金</dd><dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</dd>\n<dt>③ なぜ？</dt><dd>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</dd><dt>④ イメージ</dt><dd>自営業だった夫が老齢基礎年金受給前に死亡した場面。</dd>\n<dt>⑤ 具体例</dt><dd>婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</dd><dt>⑥ 注意</dt><dd>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>寡婦年金と死亡一時金＝国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>遺族厚生年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</p>\n<p>「先輩、ここで一回止めます。<strong>遺族厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>遺族厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>遺族厚生年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>遺族厚生年金は死亡した人の厚生年金加入に基づきます。遺族には順位や年齢等の要件があり、妻・夫・子・父母等を全部同条件で扱うわけではありません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社員の夫が死亡し妻と子が残る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>遺族厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員の夫が死亡し妻と子が残る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>遺族厚生年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「遺族厚生年金を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>子のある妻なら遺族基礎年金と遺族厚生年金の両方が関係する場合があります。子がいない妻なら遺族厚生年金側を中心に要件を確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。遺族厚生年金を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>遺族厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 子のある妻なら遺族基礎年金と遺族厚生年金の両方が関係する場合があります。子がいない妻なら遺族厚生年金側を中心に要件を確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>遺族厚生年金は死亡した人の厚生年金加入に基づきます。遺族には順位や年齢等の要件があり、妻・夫・子・父母等を全部同条件で扱うわけではありません。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>遺族厚生年金と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>遺族厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</dd><dt>④ イメージ</dt><dd>会社員の夫が死亡し妻と子が残る場面。</dd>\n<dt>⑤ 具体例</dt><dd>まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。</dd><dt>⑥ 注意</dt><dd>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>遺族厚生年金＝厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "中高齢寡婦加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>中高齢寡婦加算</strong>です。」</p>\n<p>「一言でいうと――<strong>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>中高齢寡婦加算</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</p>\n<p>「先輩、ここで一回止めます。<strong>中高齢寡婦加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>中高齢寡婦加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>中高齢寡婦加算</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>中高齢寡婦加算は、夫死亡後の妻について、遺族基礎年金がない・なくなった時期から自分の老齢基礎年金までの所得保障を補うイメージです。年齢要件を時系列で見ると覚えやすくなります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>中高齢寡婦加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>中高齢寡婦加算</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「中高齢寡婦加算を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>40歳台の妻が子を育て、子が年齢要件から外れて遺族基礎年金が終了した後、65歳までの間をどう支えるかという『谷間』をイメージします。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。中高齢寡婦加算を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>中高齢寡婦加算</strong>を一言で説明してください。<details><summary>答え</summary>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 40歳台の妻が子を育て、子が年齢要件から外れて遺族基礎年金が終了した後、65歳までの間をどう支えるかという『谷間』をイメージします。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>中高齢寡婦加算は、夫死亡後の妻について、遺族基礎年金がない・なくなった時期から自分の老齢基礎年金までの所得保障を補うイメージです。年齢要件を時系列で見ると覚えやすくなります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>中高齢寡婦加算と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>中高齢寡婦加算</dd><dt>② 一番重要なのは？</dt><dd>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</dd><dt>④ イメージ</dt><dd>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</dd>\n<dt>⑤ 具体例</dt><dd>妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。</dd><dt>⑥ 注意</dt><dd>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>中高齢寡婦加算＝一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的年金等控除", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的年金等控除</strong>です。」</p>\n<p>「一言でいうと――<strong>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>公的年金等控除</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</p>\n<p>「先輩、ここで一回止めます。<strong>公的年金等控除</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的年金等控除</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>公的年金等控除</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>所得税計算では、まず年金の『収入金額』と『所得金額』を分けます。公的年金等収入から公的年金等控除額を引いたものが雑所得です。その後、他の所得と合わせて所得控除などへ進みます。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>老齢年金を受け取る人の所得税計算をする場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的年金等控除</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>老齢年金を受け取る人の所得税計算をする場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>公的年金等控除</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「公的年金等控除を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>年金収入200万円だから所得200万円、ではありません。まず公的年金等控除を差し引いて雑所得を出します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。公的年金等控除を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的年金等控除</strong>を一言で説明してください。<details><summary>答え</summary>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 年金収入200万円だから所得200万円、ではありません。まず公的年金等控除を差し引いて雑所得を出します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>所得税計算では、まず年金の『収入金額』と『所得金額』を分けます。公的年金等収入から公的年金等控除額を引いたものが雑所得です。その後、他の所得と合わせて所得控除などへ進みます。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>公的年金等控除と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的年金等控除</dd><dt>② 一番重要なのは？</dt><dd>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</dd>\n<dt>③ なぜ？</dt><dd>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</dd><dt>④ イメージ</dt><dd>老齢年金を受け取る人の所得税計算をする場面。</dd>\n<dt>⑤ 具体例</dt><dd>公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。</dd><dt>⑥ 注意</dt><dd>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的年金等控除＝公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "確定拠出年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>確定拠出年金</strong>です。」</p>\n<p>「一言でいうと――<strong>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>確定拠出年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</p>\n<p>「先輩、ここで一回止めます。<strong>確定拠出年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>確定拠出年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>確定拠出年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。一方、運用商品を自分で選ぶため、運用リスクも加入者側にあります。元本確保型を選ぶか投資信託を選ぶかで結果は変わります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>確定拠出年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>確定拠出年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「確定拠出年金を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">月2万円なら年24万円を拠出。運用利回りが違えば同じ掛金でも将来残高は変わる。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>月2万円を30年なら拠出元本720万円。同じ720万円でも運用利回り0%と3%では将来残高が大きく異なります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。確定拠出年金を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>確定拠出年金</strong>を一言で説明してください。<details><summary>答え</summary>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 月2万円を30年なら拠出元本720万円。同じ720万円でも運用利回り0%と3%では将来残高が大きく異なります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>確定拠出年金は拠出時・運用時・受取時それぞれに税制上の扱いがあります。一方、運用商品を自分で選ぶため、運用リスクも加入者側にあります。元本確保型を選ぶか投資信託を選ぶかで結果は変わります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>確定拠出年金と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>確定拠出年金</dd><dt>② 一番重要なのは？</dt><dd>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</dd>\n<dt>③ なぜ？</dt><dd>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</dd><dt>④ イメージ</dt><dd>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</dd>\n<dt>⑤ 具体例</dt><dd>月2万円なら年24万円を拠出。運用利回りが違えば同じ掛金でも将来残高は変わる。</dd><dt>⑥ 注意</dt><dd>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>確定拠出年金＝拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "小規模企業共済等掛金控除", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>小規模企業共済等掛金控除</strong>です。」</p>\n<p>「一言でいうと――<strong>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>小規模企業共済等掛金控除</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</p>\n<p>「先輩、ここで一回止めます。<strong>小規模企業共済等掛金控除</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>小規模企業共済等掛金控除</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>小規模企業共済等掛金控除</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>所得控除なので、掛金24万円なら税金が24万円減るわけではありません。課税対象となる所得が24万円減り、その人の税率に応じて税負担が軽くなります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>小規模企業共済等掛金控除</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>小規模企業共済等掛金控除</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「小規模企業共済等掛金控除を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>課税所得に対する税率を仮に10%と単純化すれば、24万円の所得控除による所得税軽減効果は約2.4万円というイメージです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。小規模企業共済等掛金控除を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>小規模企業共済等掛金控除</strong>を一言で説明してください。<details><summary>答え</summary>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 課税所得に対する税率を仮に10%と単純化すれば、24万円の所得控除による所得税軽減効果は約2.4万円というイメージです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>所得控除なので、掛金24万円なら税金が24万円減るわけではありません。課税対象となる所得が24万円減り、その人の税率に応じて税負担が軽くなります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>小規模企業共済等掛金控除と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>小規模企業共済等掛金控除</dd><dt>② 一番重要なのは？</dt><dd>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</dd>\n<dt>③ なぜ？</dt><dd>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</dd><dt>④ イメージ</dt><dd>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</dd>\n<dt>⑤ 具体例</dt><dd>年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。</dd><dt>⑥ 注意</dt><dd>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>小規模企業共済等掛金控除＝小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "中退共（中小企業退職金共済制度）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>中退共（中小企業退職金共済制度）</strong>です。」</p>\n<p>「一言でいうと――<strong>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>中退共（中小企業退職金共済制度）</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</p>\n<p>「先輩、ここで一回止めます。<strong>中退共（中小企業退職金共済制度）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>中退共（中小企業退職金共済制度）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>中退共（中小企業退職金共済制度）</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>中退共では事業主が掛金を負担し、退職金は原則として機構から退職した従業員へ直接支払われます。企業内で退職金原資を抱える方式との違いです。国による掛金助成がある場合も制度の特徴です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>従業員20人の中小企業が退職金制度を整える場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>中退共（中小企業退職金共済制度）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>従業員20人の中小企業が退職金制度を整える場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>中退共（中小企業退職金共済制度）</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「中退共（中小企業退職金共済制度）を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">事業主が従業員ごとに掛金を納付→機構が管理→退職時に機構から従業員へ退職金、というお金の流れ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>会社→毎月掛金→中退共→従業員退職→機構から本人へ退職金、という矢印を描くと誰のお金か迷いません。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。中退共（中小企業退職金共済制度）を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>中退共（中小企業退職金共済制度）</strong>を一言で説明してください。<details><summary>答え</summary>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 会社→毎月掛金→中退共→従業員退職→機構から本人へ退職金、という矢印を描くと誰のお金か迷いません。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>中退共では事業主が掛金を負担し、退職金は原則として機構から退職した従業員へ直接支払われます。企業内で退職金原資を抱える方式との違いです。国による掛金助成がある場合も制度の特徴です。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>中退共（中小企業退職金共済制度）と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>中退共（中小企業退職金共済制度）</dd><dt>② 一番重要なのは？</dt><dd>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</dd>\n<dt>③ なぜ？</dt><dd>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</dd><dt>④ イメージ</dt><dd>従業員20人の中小企業が退職金制度を整える場面。</dd>\n<dt>⑤ 具体例</dt><dd>事業主が従業員ごとに掛金を納付→機構が管理→退職時に機構から従業員へ退職金、というお金の流れ。</dd><dt>⑥ 注意</dt><dd>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>中退共（中小企業退職金共済制度）＝中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "分割払いとリボ払い", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>分割払いとリボ払い</strong>です。」</p>\n<p>「一言でいうと――<strong>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>分割払いとリボ払い</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</p>\n<p>「先輩、ここで一回止めます。<strong>分割払いとリボ払い</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>分割払いとリボ払い</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>分割払いとリボ払い</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>分割払いは購入ごとに支払回数が決まりやすく、リボ払いは複数の利用を残高としてまとめ、設定した支払方式で返していきます。リボは月額が一定に見えるため、追加利用で元本が減りにくいことに気づきにくい点がリスクです。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>分割払いとリボ払い</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>分割払いとリボ払い</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「分割払いとリボ払いを、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">分割は原則10回で終了が見える。リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。分割払いとリボ払いを使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>分割払いとリボ払い</strong>を一言で説明してください。<details><summary>答え</summary>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 残高10万円を月1万円ずつ返している途中で毎月5,000円追加利用すれば、元本の減りは見た目より遅くなり、さらに手数料もかかります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>分割払いは購入ごとに支払回数が決まりやすく、リボ払いは複数の利用を残高としてまとめ、設定した支払方式で返していきます。リボは月額が一定に見えるため、追加利用で元本が減りにくいことに気づきにくい点がリスクです。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>分割払いとリボ払いと似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>分割払いとリボ払い</dd><dt>② 一番重要なのは？</dt><dd>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</dd>\n<dt>③ なぜ？</dt><dd>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</dd><dt>④ イメージ</dt><dd>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</dd>\n<dt>⑤ 具体例</dt><dd>分割は原則10回で終了が見える。リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。</dd><dt>⑥ 注意</dt><dd>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>分割払いとリボ払い＝分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "キャッシングと総量規制", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>キャッシングと総量規制</strong>です。」</p>\n<p>「一言でいうと――<strong>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>キャッシングと総量規制</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</p>\n<p>「先輩、ここで一回止めます。<strong>キャッシングと総量規制</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>キャッシングと総量規制</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>キャッシングと総量規制</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>総量規制は貸金業者1社ごとに年収1/3ではなく、対象となる貸金業者からの借入残高を合算して考えるのがポイントです。また銀行貸付や住宅ローン等、対象外・除外・例外となるものがあります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>キャッシングと総量規制</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>キャッシングと総量規制</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div><div class=\"thick\"><h3>イメージ追加訓練</h3><p>「キャッシングと総量規制を、利用前→必要になる瞬間→利用後の3コマで再生してください。次に人物・金額・期間を一つずつ変え、どこで別の答えになるか探します。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。すでに80万円借りていれば、新規20万円で合計100万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>年収300万円でA社60万円、B社40万円なら対象借入は合計100万円。『B社はまだ40万円だから、B社からさらに60万円借りられる』とは考えません。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div><div class=\"thick\"><h3>条件変更トレーニング</h3><p>「基本例の①金額だけ2倍、②期間だけ変更、③人物・立場だけ変更、の3問を自分で作ります。キャッシングと総量規制を使い続ける条件と、別制度へ変わる条件を見つけてください。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>キャッシングと総量規制</strong>を一言で説明してください。<details><summary>答え</summary>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 年収300万円でA社60万円、B社40万円なら対象借入は合計100万円。『B社はまだ40万円だから、B社からさらに60万円借りられる』とは考えません。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>総量規制は貸金業者1社ごとに年収1/3ではなく、対象となる貸金業者からの借入残高を合算して考えるのがポイントです。また銀行貸付や住宅ローン等、対象外・除外・例外となるものがあります。</p></details></div><div class=\"thick\"><h3>実戦5問追加</h3><ol><li>人物を変えたら？</li><li>金額を2倍にしたら？</li><li>期間を変えたら？</li><li>キャッシングと総量規制と似た用語との違いは？</li><li>30秒で目的→仕組み→例→注意を説明してください。</li></ol></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>キャッシングと総量規制</dd><dt>② 一番重要なのは？</dt><dd>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</dd>\n<dt>③ なぜ？</dt><dd>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</dd><dt>④ イメージ</dt><dd>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</dd>\n<dt>⑤ 具体例</dt><dd>総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。すでに80万円借りていれば、新規20万円で合計100万円。</dd><dt>⑥ 注意</dt><dd>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>キャッシングと総量規制＝キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}],ch2:[{"title": "公的保険と私的保険", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</p><p>「注意は<strong>公的保障を無視して必要保障額を全額民間保険で用意しない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>会社員Aさんに健康保険・厚生年金等という土台があり、その上へ生命保険や医療保険を積む二階建てを想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>公的保険と私的保険が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">遺族生活費3,000万円に対し、公的保障等1,800万円なら不足1,200万円を私的保障で検討します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>公的保障を無視して必要保障額を全額民間保険で用意しない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。公的保障を無視して必要保障額を全額民間保険で用意しない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>会社員Aさんに健康保険・厚生年金等という土台があり、その上へ生命保険や医療保険を積む二階建てを想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>遺族生活費3,000万円に対し、公的保障等1,800万円なら不足1,200万円を私的保障で検討します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>公的保障を無視して必要保障額を全額民間保険で用意しない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>公的保険と私的保険</dd><dt>芯</dt><dd>公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</dd><dt>映像</dt><dd>会社員Aさんに健康保険・厚生年金等という土台があり、その上へ生命保険や医療保険を積む二階建てを想像します。</dd><dt>具体例</dt><dd>遺族生活費3,000万円に対し、公的保障等1,800万円なら不足1,200万円を私的保障で検討します。</dd><dt>注意</dt><dd>公的保障を無視して必要保障額を全額民間保険で用意しない。</dd></dl>", "M": "<div class=\"memory\"><strong>公的保険と私的保険：公的保険は社会全体で基本保障を支え、私的保険は不足分を任意で補うものです。</strong></div>"}}, {"title": "大数の法則", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</p><p>「注意は<strong>個人の事故発生日を予言する法則ではない。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>一人の事故は読めなくても、何万人という大集団なら『何人くらい事故に遭うか』が安定して見える巨大な観察箱を想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>大数の法則が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">1,000人中10人程度が事故、1件100万円なら期待保険金は約1,000万円という集団計算です。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>個人の事故発生日を予言する法則ではない。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。個人の事故発生日を予言する法則ではない。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>一人の事故は読めなくても、何万人という大集団なら『何人くらい事故に遭うか』が安定して見える巨大な観察箱を想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>1,000人中10人程度が事故、1件100万円なら期待保険金は約1,000万円という集団計算です。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>個人の事故発生日を予言する法則ではない。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>大数の法則</dd><dt>芯</dt><dd>観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</dd><dt>映像</dt><dd>一人の事故は読めなくても、何万人という大集団なら『何人くらい事故に遭うか』が安定して見える巨大な観察箱を想像します。</dd><dt>具体例</dt><dd>1,000人中10人程度が事故、1件100万円なら期待保険金は約1,000万円という集団計算です。</dd><dt>注意</dt><dd>個人の事故発生日を予言する法則ではない。</dd></dl>", "M": "<div class=\"memory\"><strong>大数の法則：観察する集団が大きくなるほど事故・死亡などの発生率が一定の確率へ近づく考え方です。</strong></div>"}}, {"title": "収支相等の原則", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</p><p>「注意は<strong>会社経費は付加保険料と区別する。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>100人が共同の箱へお金を入れ、事故に遭った5人へ箱から給付する場面です。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>収支相等の原則が必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">100人×1万円=100万円を集め、5人×20万円=100万円を支払うと釣り合います。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>会社経費は付加保険料と区別する。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。会社経費は付加保険料と区別する。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>100人が共同の箱へお金を入れ、事故に遭った5人へ箱から給付する場面です。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>100人×1万円=100万円を集め、5人×20万円=100万円を支払うと釣り合います。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>会社経費は付加保険料と区別する。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>収支相等の原則</dd><dt>芯</dt><dd>保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</dd><dt>映像</dt><dd>100人が共同の箱へお金を入れ、事故に遭った5人へ箱から給付する場面です。</dd><dt>具体例</dt><dd>100人×1万円=100万円を集め、5人×20万円=100万円を支払うと釣り合います。</dd><dt>注意</dt><dd>会社経費は付加保険料と区別する。</dd></dl>", "M": "<div class=\"memory\"><strong>収支相等の原則：保険集団全体で受け取る純保険料総額と支払う保険金等総額が釣り合うよう設計する原則です。</strong></div>"}}, {"title": "クーリングオフ", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><span>保障</span><b>→</b><span>事故等</span><b>→</b><span>給付</span></div><p>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</p><p>「注意は<strong>クーリングオフは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong>です。」</p>", "C": "<h3>① 映像にする</h3><p>Aさんを主人公にして、クーリングオフが必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</p><h3>② 人物を動かす</h3><p>「Aさん本人、配偶者Bさん、子Cさんを置きます。誰が契約し、誰に事故が起き、誰がお金を受け取るのかを矢印で描いてください。」</p><h3>③ 時間を動かす</h3><div class=\"flow\"><span>制度利用前</span><b>→</b><span>クーリングオフが必要</span><b>→</b><span>給付・保障</span><b>→</b><span>家計の変化</span></div><p>「次に人物・期間・事故原因を一つだけ変えます。答えが変わるところが、この用語の境界です。」</p><h3>④ 記憶の映像</h3><p>「名称が出なくても、“誰から誰へ何が動いた？”から制度名を復元してください。」</p>", "D": "<h3>基本例</h3><div class=\"example\">契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、クーリングオフでは人物・期間・事故原因のどれが答えを決めるか確認します。</div><h3>条件変更① 人物</h3><p>「契約者A・被保険者B・受取人Cの一人を入れ替えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>クーリングオフは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。クーリングオフは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、クーリングオフが必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、クーリングオフでは人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>クーリングオフは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>クーリングオフ</dd><dt>芯</dt><dd>クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、クーリングオフが必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、クーリングオフでは人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>クーリングオフは名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>クーリングオフ：クーリングオフについて、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></div>"}}, {"title": "保険契約者保護機構", "content": {"A": "<p>「先輩、まず芯です。」</p><p><strong>保険契約者保護機構について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</strong></p><p>「最初に目的・対象・お金の方向を押さえます。」</p>", "B": "<p>「仕組みは、契約→保険料→保障→事故・満期→給付・税務の順で追います。」</p><div class=\"flow\"><span>契約</span><b>→</b><span>保険料</span><b>→</b><spa えます。給付対象や税区分が変わらないか確認してください。」</p><h3>条件変更② 金額</h3><p>「保険金1,000万円を2,000万円へ変えたら、制度自体が変わるのか、金額だけ変わるのかを考えます。」</p><h3>条件変更③ 時間</h3><p>「契約直後・払込中・事故発生時・満期時へ時点を動かします。」</p><h3>間違いやすい例</h3><p><strong>少額短期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</strong></p><h3>試験での読み方</h3><p>「①人物 ②原因・目的 ③期間 ④金額 ⑤お金の行き先、の順で線を引きます。数字から先に計算しないでください。」</p>", "Q": "<p>「ここから10問。読むのではなく、自分で取り出してください。」</p><ol>\n<li>一文で説明してください。<details><summary>答え</summary>少額短期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>○×：名称が似ていれば対象者が違っても同じ制度である。<details><summary>答え</summary>×。少額短期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>契約者・被保険者と、もう一人まず確認する人物は？<details><summary>答え</summary>受取人。</details></li>\n<li>この制度が必要になる直前の出来事を説明してください。<details><summary>ヒント</summary>Aさんを主人公にして、少額短期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</details></li>\n<li>数字を使って説明してください。<details><summary>模範例</summary>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、少額短期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</details></li>\n<li>最も間違いやすいポイントは？<details><summary>答え</summary>少額短期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</details></li>\n<li>人物を一人変えると何が変わり得ますか？<details><summary>答え</summary>給付対象・税・契約上の権利など。</details></li>\n<li>金額を2倍にすると制度も変わりますか？<details><summary>答え</summary>金額だけでは変わらない場合も多く、制度固有の上限・条件を確認します。</details></li>\n<li>「なぜこの制度が必要？」を説明してください。<details><summary>答えの芯</summary>少額短期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li>\n<li>30秒で「誰が→何のために→どうなる」を説明してください。<details><summary>模範の芯</summary>少額短期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</details></li></ol>", "R": "<dl><dt>何の話？</dt><dd>少額短期保険</dd><dt>芯</dt><dd>少額短期保険について、誰が対象で、どんなリスクを、どのような給付・保障・税務で処理するかを整理するテーマです。</dd><dt>映像</dt><dd>Aさんを主人公にして、少額短期保険が必要になる直前→制度が働く瞬間→その後のお金の動きを3コマで想像します。</dd><dt>具体例</dt><dd>契約者A、被保険者B、受取人C、保険金1,000万円という仮の条件を置き、少額短期保険では人物・期間・事故原因のどれが答えを決めるか確認します。</dd><dt>注意</dt><dd>少額短期保険は名称だけでなく、契約者・被保険者・受取人、期間、原因、金額のどれが決定条件かを確認します。</dd></dl>", "M": "<div class=\"memory\"><strong>少額短期保険：少額短期保険について、誰が対象で、どんなリスクを、どのような給
