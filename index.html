<script>const chapterData={ch1:[{"title": "FPが守るべき3つのこと", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>FPが守るべき3つのこと</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は FPが守るべき3つのこと です。</p><p>仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 その情報を並べると、 FPが守るべき3つのこと が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。FPが守るべき3つのこともその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④FPが守るべき3つのことのルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>FPが守るべき3つのこと</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 相続相談で『この制度は一般にこうです』と説明した後、具体的な税務申告は税理士につなぐ場面。 その情報を並べると、 FPが守るべき3つのこと が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだFPが守るべき3つのことによる結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そしてFPが守るべき3つのことの条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件がFPが守るべき3つのことの守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は FPが守るべき3つのこと です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実をFPが守るべき3つのことの条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「FPが守るべき3つのことについて相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>FPが守るべき3つのことで最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は FPが守るべき3つのこと です。<br><br><b>解説：</b>仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → FPが守るべき3つのことのルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理することとは別です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 顧客の資料を見て相続税の一般的な仕組みを説明→個別申告の作成依頼は税理士へ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文にFPが守るべき3つのことと関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、FPが守るべき3つのことの要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>FPが守るべき3つのことは「」 結論 今日は FPが守るべき3つのこと です。」。仕組みは「仕組みを最初から説明 FPは家計全体を整理する専門家ですが、資格が必要な個別具体的な法律・税務行為まで何でも代行できるわけではありません。 FPが守るべき3つのこと が必要になる前に、何が起きているか分かります？ 現実の問題 → FPが守るべき3つのこと → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとでFPが守るべき3つのことの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般的な税制説明はできても、税理士資格なしに顧客の確定申告を代理 あとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「キャッシュフロー表について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>キャッシュフロー表で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。<br><br><b>解説：</b>仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → キャッシュフロー表のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文にキャッシュフロー表と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、キャッシュフロー表の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>キャッシュフロー表は「」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。」。仕組みは「仕組みを最初から説明 進学、住宅購入、退職などを年表に置き、その年の収支を計算して貯蓄残高へつなげることで『いつ資金不足になるか』が見えます。 キャッシュフロー表 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシュフロー表 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシュフロー表の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 年間収支はその年のプラス・マイナス、貯蓄残高はそれまでの蓄積です。」。代表例では「具体例1｜基本ケース 前年貯蓄500万円、今年収入600万円、支出550万円なら年間収支+50万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>キャッシュフロー表＝」 結論 一言でいうと―― 家計の将来を、年ごとの収入・支出・年間収支・貯蓄残高で見える化する表です。</strong></p>"}}, {"title": "終価係数", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>終価係数</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</p><p>仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 今100万円を持っていて、5年後の金額を知りたい場面。 その情報を並べると、 終価係数 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。終価係数もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④終価係数のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>終価係数</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 今100万円を持っていて、5年後の金額を知りたい場面。 その情報を並べると、 終価係数 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ終価係数による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして終価係数の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 年3％で5年なら 100万円×1.03^5≒115.9万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が終価係数の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を終価係数の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「終価係数について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>終価係数で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。<br><br><b>解説：</b>仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 終価係数のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 年3％で5年なら 100万円×1.03^5≒115.9万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に終価係数と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、終価係数の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>終価係数は「」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。」。仕組みは「仕組みを最初から説明 元本だけでなく前年までの利息にも次の利息が付くのが複利です。 毎年掛け算を繰り返す代わりに、期間と利率に対応する終価係数を一度掛けます。 終価係数 が必要になる前に、何が起きているか分かります？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」。代表例では「具体例1｜基本ケース 年3％で5年なら 100万円×1.03^5≒115.9万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>終価係数＝」 結論 一言でいうと―― 今ある一括資金を複利運用したとき、将来いくらになるかを求める係数です。</strong></p>"}}, {"title": "現価係数", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>現価係数</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</p><p>仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 現価係数 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 現価係数 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。現価係数もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④現価係数のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>現価係数</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 現価係数 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 現価係数 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ現価係数による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金 最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。<br><br><b>解説：</b>仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 現価係数のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に現価係数と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、現価係数の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>現価係数は「」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。」。仕組みは「仕組みを最初から説明 現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 終価係数が『今→将来』なら、現価係数は『将来→今』です。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 終価係数が『今→将来』なら、現価係数は『将来→今』です。」。代表例では「具体例1｜基本ケース 年3％で5年後100万円なら 100万円÷1.03^5≒86.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>現価係数＝」 結論 一言でいうと―― 将来必要な一括金額から、今いくら用意すればよいかを逆算する係数です。</strong></p>"}}, {"title": "年金終価係数", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>年金終価係数</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。</p><p>仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 その情報を並べると、 年金終価係数 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。年金終価係数もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④年金終価係数のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>年金終価係数</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 毎年20万円ずつ積み立てて10年後いくらになるか知りたい場面。 その情報を並べると、 年金終価係数 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ年金終価係数による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして年金終価係数の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 年3％・10年の年金終価係数を約11.464とすると、20万円×11.464≒229.3万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が年金終価係数の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を年金終価係数の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金終価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 減債基金係数は目標将来額から毎年の積立額を逆算します。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「年金終価係数について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>年金終価係数で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。<br><br><b>解説：</b>仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ 定義だけでなく、何のためにこの仕組みがあるのかまでセット 」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 退職時の1,000万円を10年間で均等に取り崩す場面。 その情報を並べると、 資本回収係数 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。資本回収係数もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④資本回収係数のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>資本回収係数</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 退職時の1,000万円を10年間で均等に取り崩す場面。 その情報を並べると、 資本回収係数 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ資本回収係数による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして資本回収係数の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで資本回収係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 年3％・10年の年金現価係数を約8.530とすると、1,000万円÷8.530≒117.2万円/年。 この例で大事なのは、答えそのものよ どこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に年金現価係数と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、年金現価係数の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>年金現価係数は「」 結論 一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。」。仕組みは「仕組みを最初から説明 将来の年金の『今の値段』を求める感覚です。 年金現価係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 年金現価係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで年金現価係数の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 資本回収係数は現在元本から毎年額。」。代表例では「具体例1｜基本ケース 年3％・10年の年金現価係数を約8.530とすると、100万円×8.530≒853万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>年金現価係数＝」 結論 一言でいうと―― 将来、毎年一定額を受け取るために、今いくら元本が必要かを求める係数です。</strong></p>"}}, {"title": "こども保険（学資保険）", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>こども保険（学資保険）</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は こども保険（学資保険） です。</p><p>仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて こども保険（学資保険） が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。こども保険（学資保険）もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④こども保険（学資保険）のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>こども保険（学資保険）</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 こども保険（学資保険） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて こども保険（学資保険） が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだこども保険（学資保険）による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そしてこども保険（学資保険）の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 18歳時に200万円受け取る設計でも、途中解約なら払込総額を下回る可能性があるため条件確認が必要。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件がこども保険（学資保険）の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は こども保険（学資保険） です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実をこども保険（学資保険）の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「こども保険（学資保険）について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>こども保険（学資保険）で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は こども保険（学資保険） です。<br><br><b>解説：</b>仕組みを最初から説明 教育費が必要になる時期は比較的予測しやすいので、保険料を積み立て、進学時期に合わせて受け取る設計をします。 商品によって契約者死亡時の保険料払込免除など保障もあります。 こども保険（学資保険） が必要になる前に、何が起きているか分かります？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → こども保険（学資保険）のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでこども保険（学資保険）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 預金と違い保険契約なので、保障・途中解約時の返戻金・払込免除条件も見ます。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないこ 育一般貸付（国の教育ローン） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 教育一般貸付（国の教育ローン） が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。教育一般貸付（国の教育ローン）もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④教育一般貸付（国の教育ローン）のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>教育一般貸付（国の教育ローン）</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 教育一般貸付（国の教育ローン） が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 教育一般貸付（国の教育ローン） が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ教育一般貸付（国の教育ローン）による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして教育一般貸付（国の教育ローン）の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が教育一般貸付（国の教育ローン）の守備範囲に入っていることを確認してから、金額や期間を て金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に教育一般貸付（国の教育ローン）と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、教育一般貸付（国の教育ローン）の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>教育一般貸付（国の教育ローン）は「」 結論 今日は 教育一般貸付（国の教育ローン） です。」。仕組みは「仕組みを最初から説明 教育一般貸付（国の教育ローン） が必要になる前に、何が起きているか分かります？ 現実の問題 → 教育一般貸付（国の教育ローン） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 教育一般貸付（国の教育ローン） 固有の条件と照らします。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで教育一般貸付（国の教育ローン）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」。代表例では「具体例1｜基本ケース 入学前にまとまった資金が必要なら、融資限度・所得要件・金利・返済期間を確認して利用可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>教育一般貸付（国の教育ローン）＝」 結論 今日は 教育一般貸付（国の教育ローン） です。</strong></p>"}}, {"title": "奨学金制度", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>奨学金制度</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。</p><p>仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 奨学金制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 奨学金制度 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。奨学金制度もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④奨学金制度のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>奨学金制度</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 奨学金制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 奨学金制度 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ奨学金制度による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして奨学金制度の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 月5万円を4年間貸与なら元本だけで240万円。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が奨学金制度の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を奨学金制度の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「奨学金制度について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>奨学金制度で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 学生の修学を支える制度で、返済不要の給付型と、卒業後などに返還する貸与型があります。<br><br><b>解説：</b>仕組みを最初から説明 学生本人の学費や生活費を支援するため、在学中に給付または貸与を受けます。 奨学金制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 奨学金制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 奨学金制度のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで奨学金制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題 将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。元利均等返済と元金均等返済もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④元利均等返済と元金均等返済のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>元利均等返済と元金均等返済</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 元利均等返済と元金均等返済 が候補に上がってくる。 難しい言葉を見たら、 住宅ローンの返済方式を選ぶ場面。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ元利均等返済と元金均等返済による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして元利均等返済と元金均等返済の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで元利均等返済と元金均等返済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 元金3,000万円・300回なら元金均等の元金部分は毎回10万円。 これに残高に応じた利息が加わり、返済額は徐々に減る。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が元利均等返済と元金均等返済の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではな 宅ローンへ繰上げ返済する場面。 その情報を並べると、 繰上げ返済（期間短縮型・返済額軽減型） が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。繰上げ返済（期間短縮型・返済額軽減型）もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④繰上げ返済（期間短縮型・返済額軽減型）のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ボーナス100万円を住宅ローンへ繰上げ返済する場面。 その情報を並べると、 繰上げ返済（期間短縮型・返済額軽減型） が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ繰上げ返済（期間短縮型・返済額軽減型）による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして繰上げ返済（期間短縮型・返済額軽減型）の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が繰上げ返済（期間短縮型・返済額軽減型）の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を繰上げ返済（期間短縮型・返済額軽減型）の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「繰上げ返済（期間短縮型・返済額軽減型）について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>繰上げ返済（期間短縮型・返済額軽減型）で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。<br><br><b>解説：</b>仕組みを最初から説明 期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 繰上げ返済（期間短縮型・返済額軽減型）のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に繰上げ返済（期間短縮型・返済額軽減型）と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、繰上げ返済（期間短縮型・返済額軽減型）の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>繰上げ返済（期間短縮型・返済額軽減型）は「」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。」。仕組みは「仕組みを最初から説明 期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ返済（期間短縮型・返済額軽減型）の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 期間短縮型は月額を大きく変えず完済を早め、返済額軽減型は期間を維持して月額を下げます。」。代表例では「具体例1｜基本ケース 家計に余裕があり利息削減重視なら期間短縮型、毎月負担を下げたいなら返済額軽減型を検討。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>繰上げ返済（期間短縮型・返済額軽減型）＝」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。</strong></p>"}}, {"title": "財形住宅融資", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>財形住宅融資</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。</p><p>仕組みを最初から説明 財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 財形住宅融資 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 財形住宅融資 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。財形住宅融資もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④財形住宅融資のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>財形住宅融資</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 財形住宅融資 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 財形住宅融資 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ財形住宅融資による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして財形住宅融資の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 財形貯蓄残高だけで即決せず、加入期間・残高・融資上限など受験年度の要件を確認。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が財形住宅融資の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を財形住宅融資の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形住宅融資の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「財形住宅融資について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>財形住宅融資で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 財形貯蓄をしている勤労者が、一定条件のもと住宅取得・改良資金を借りられる制度です。<br><br><b>解説：</b>仕組みを最初から説明 財形住宅融資 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形住宅融資 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 財形住宅融資 固有の条件と照らします。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 財形住宅融資のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは る前に、何が起きているか分かります？ 現実の問題 → フラット35 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 将来の金利上昇を避け、返済額を安定させたい場面。 その情報を並べると、 フラット35 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。フラット35もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④フラット35のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとでフラット35の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>フラット35</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 将来の金利上昇を避け、返済額を安定させたい場面。 その情報を並べると、 フラット35 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだフラット35による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そしてフラット35の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとでフラット35の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 3,000万円を35年で借りた後に市場金利が上がっても、契約した固定金利条件で返済を続ける。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件がフラット35の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になって 蓄制度 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。財形貯蓄制度もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④財形貯蓄制度のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形貯蓄制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 住宅財形・年金財形は目的が限定されます。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>財形貯蓄制度</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 給与から毎月2万円を天引きして将来の住宅資金を作る場面。 その情報を並べると、 財形貯蓄制度 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ財形貯蓄制度による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして財形貯蓄制度の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形貯蓄制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 住宅財形・年金財形は目的が限定されます。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が財形貯蓄制度の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に財形貯蓄制度と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、財形貯蓄制度の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>財形貯蓄制度は「」 結論 一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。」。仕組みは「仕組みを最初から説明 住宅財形・年金財形には一定の税制上の扱いがあります。 財形貯蓄制度 が必要になる前に、何が起きているか分かります？ 現実の問題 → 財形貯蓄制度 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで財形貯蓄制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 住宅財形・年金財形は目的が限定されます。」。代表例では「具体例1｜基本ケース 住宅目的なら住宅財形、老後目的なら年金財形というように目的から種類を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>財形貯蓄制度＝」 結論 一言でいうと―― 勤労者が給与天引きなどで計画的に財産形成する制度で、一般・住宅・年金の3種類があります。</strong></p>"}}, {"title": "団体信用生命保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>団体信用生命保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</p><p>仕組みを最初から説明 住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 住宅ローン返済中の世帯主が死亡する場面。 その情報を並べると、 団体信用生命保険 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。団体信用生命保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④団体信用生命保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>団体信用生命保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 住宅ローン返済中の世帯主が死亡する場面。 その情報を並べると、 団体信用生命保険 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ団体信用生命保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして団体信用生命保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が団体信用生命保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を団体信用生命保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「団体信用生命保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>団体信用生命保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。<br><br><b>解説：</b>仕組みを最初から説明 住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 団体信用生命保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に団体信用生命保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、団体信用生命保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>団体信用生命保険は「」 結論 一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。」。仕組みは「仕組みを最初から説明 住宅ローンは長期債務なので、返済者に万一があると家族に大きな負担が残ります。 団信はその残債リスクを保険で消す役割を持ちます。 団体信用生命保険 が必要になる前に、何が起きているか分かります？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで団体信用生命保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一般の死亡保険は遺族が生活費等に使う保険金。」。代表例では「具体例1｜基本ケース 死亡時のローン残高が2,000万円なら、契約条件に該当すれば保険金で残高が返済される。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>団体信用生命保険＝」 結論 一言でいうと―― 住宅ローン債務者が死亡・所定の高度障害等になった場合、保険金で住宅ローン残高を返済する仕組みです。</strong></p>"}}, {"title": "住宅ローンの借り換え", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>住宅ローンの借り換え</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は 住宅ローンの借り換え です。</p><p>仕組みを最初から説明 住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 住宅ローンの借り換え が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 住宅ローンの借り換え が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。住宅ローンの借り換えもその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④住宅ローンの借り換えのルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>住宅ローンの借り換え</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 住宅ローンの借り換え が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 住宅ローンの借り換え が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ住宅ローンの借り換えによる結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして住宅ローンの借り換えの条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が住宅ローンの借り換えの守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は 住宅ローンの借り換え です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満 <b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、住宅ローンの借り換えの要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>住宅ローンの借り換えは「」 結論 今日は 住宅ローンの借り換え です。」。仕組みは「仕組みを最初から説明 住宅ローンの借り換え が必要になる前に、何が起きているか分かります？ 現実の問題 → 住宅ローンの借り換え → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 住宅ローンの借り換え 固有の条件と照らします。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで住宅ローンの借り換えの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」。代表例では「具体例1｜基本ケース 借換えで利息が80万円減っても諸費用が50万円なら、実質効果は単純計算で30万円程度。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>住宅ローンの借り換え＝」 結論 今日は 住宅ローンの借り換え です。</strong></p>"}}, {"title": "埋葬に関する給付", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>埋葬に関する給付</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</p><p>仕組みを最初から説明 死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 埋葬に関する給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 埋葬に関する給付 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。埋葬に関する給付もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④埋葬に関する給付のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>埋葬に関する給付</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 埋葬に関する給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 埋葬に関する給付 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ埋葬に関する給付による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして埋葬に関する給付の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が埋葬に関する給付の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を埋葬に関する給付の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「埋葬に関する給付について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>埋葬に関する給付で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。<br><br><b>解説：</b>仕組みを最初から説明 死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 埋葬に関する給付のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に埋葬に関する給付と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、埋葬に関する給付の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>埋葬に関する給付は「」 結論 一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。」。仕組みは「仕組みを最初から説明 死亡後には埋葬費用が発生するため、健康保険から一定の給付を行います。 誰が死亡したか、誰が埋葬したかで給付名や扱いを整理します。 埋葬に関する給付 が必要になる前に、何が起きているか分かります？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで埋葬に関する給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 被保険者本人の死亡と被扶養者の死亡、埋葬料と埋葬費を混同しないことがポイントです。」。代表例では「具体例1｜基本ケース 『死亡したのは誰か→埋葬したのは誰か』の順に問題文を読み、該当する給付を選ぶ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>埋葬に関する給付＝」 結論 一言でいうと―― 健康保険では被保険者等が死亡したとき、条件に応じて埋葬料・埋葬費などが支給されます。</strong></p>"}}, {"title": "任意継続被保険者", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>任意継続被保険者</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。</p><p>仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意継続被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 任意継続被保険者 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 任意継続被保険者 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。任意継続被保険者もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④任意継続被保険者のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だ に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を任意継続被保険者の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意継続被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「任意継続被保険者について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>任意継続被保険者で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 退職後も一定要件を満たせば、退職前の健康保険を原則最長2年間継続できる制度です。<br><br><b>解説：</b>仕組みを最初から説明 退職すると会社の健康保険資格を失いますが、すぐ国保へ移る以外に、一定期間これまでの健康保険を継続する選択肢があります。 任意継続被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意継続被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 任意継続被保険者のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意継続被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 在職中は事業主と分担していた保険料が、任意継続では原則全額自己負担になる点が重要です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 退職後は任意継続と国保の保険料等を比較。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p ・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで国民健康保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 国民健康保険を使い続ける条件と、別制度へ変わる条件を見つけてください。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>国民健康保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 国民健康保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民健康保険 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ国民健康保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして国民健康保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで国民健康保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 国民健康保険を使い続ける条件と、別制度へ変わる条件を見つけてください。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が国民健康保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 会社の健康保険など他の公的医療保険に加入していない住民を主な対象とする公的医療保険です。 という核心と、この仕組みでは、最初に現実の目的や は①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的介護保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>公的介護保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 公的介護保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 公的介護保険 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ公的介護保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして公的介護保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的介護保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が公的介護保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的介護保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合
