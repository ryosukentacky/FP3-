つ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実をかんぽ保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「かんぽ保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>かんぽ保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br><br><b>解説：</b>仕組みを最初から説明 条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → かんぽ保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文にかんぽ保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、かんぽ保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>かんぽ保険は「」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」。仕組みは「仕組みを最初から説明 条件確認 → かんぽ保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとでかんぽ保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → かんぽ保険 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」を思い出します。</p>", "M": "<p><strong>かんぽ保険＝」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</strong></p>"}}, {"title": "共済", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>共済</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。共済もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④共済のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>共済</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 共済が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ共済による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして共済の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が共済の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を共済の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「共済について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>共済で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br><br><b>解説：</b>仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 共済のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に共済と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、共済の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>共済は「」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」。仕組みは「仕組みを最初から説明 条件確認 → 共済 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで共済の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 共済 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『保険期間と保険料払込期間、死亡保険金と満期保険金を混同しない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」を思い出します。</p>", "M": "<p><strong>共済＝」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</strong></p>"}}, {"title": "災害割増特約と傷害特約", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>災害割増特約と傷害特約</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。災害割増特約と傷害特約もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④災害割増特約と傷害特約のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>災害割増特約と傷害特約</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害割増特約と傷害特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ災害割増特約と傷害特約による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして災害割増特約と傷害特約の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害割増特約と傷害特約が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が災害割増特約と傷害特約の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を災害割増特約と傷害特約の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「災害割増特約と傷害特約について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>災害割増特約と傷害特約で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 災害割増特約と傷害特約のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害割増特約と傷害特約が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に災害割増特約と傷害特約と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、災害割増特約と傷害特約の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>災害割増特約と傷害特約は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害割増特約と傷害特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害割増特約と傷害特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害割増特約と傷害特約が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>災害割増特約と傷害特約＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "災害入院特約・疾病入院特約・生活習慣病入院特約", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>災害入院特約・疾病入院特約・生活習慣病入院特約</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。災害入院特約・疾病入院特約・生活習慣病入院特約もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④災害入院特約・疾病入院特約・生活習慣病入院特約のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>災害入院特約・疾病入院特約・生活習慣病入院特約</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 災害入院特約・疾病入院特約・生活習慣病入院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ災害入院特約・疾病入院特約・生活習慣病入院特約による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害入院特約・疾病入院特約・生活習慣病入院特約が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が災害入院特約・疾病入院特約・生活習慣病入院特約の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を災害入院特約・疾病入院特約・生活習慣病入院特約の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「災害入院特約・疾病入院特約・生活習慣病入院特約について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>災害入院特約・疾病入院特約・生活習慣病入院特約で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 災害入院特約・疾病入院特約・生活習慣病入院特約のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害入院特約・疾病入院特約・生活習慣病入院特約が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に災害入院特約・疾病入院特約・生活習慣病入院特約と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、災害入院特約・疾病入院特約・生活習慣病入院特約の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>災害入院特約・疾病入院特約・生活習慣病入院特約は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで災害入院特約・疾病入院特約・生活習慣病入院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 災害入院特約・疾病入院特約・生活習慣病入院特約が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>災害入院特約・疾病入院特約・生活習慣病入院特約＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "退院特約", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>退院特約</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。退院特約もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④退院特約のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>退院特約</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 退院特約が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ退院特約による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして退院特約の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が退院特約の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を退院特約の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「退院特約について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>退院特約で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 退院特約のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に退院特約と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、退院特約の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>退院特約は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで退院特約の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース6｜誤答を作る 「わざと『原理・法律・会社指標を全部『保険の仕組み』として一括りにしない』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」を思い出します。</p>", "M": "<p><strong>退院特約＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</p><p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。<br><br><b>解説：</b>仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険は「」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。」。仕組みは「仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険＝」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。</strong></p>"}}, {"title": "払済保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>払済保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。</p><p>仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。払済保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④払済保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>払済保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 払済保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ払済保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして払済保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『延長保険と逆に覚えない』というミスをします。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が払済保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。 という核心と、そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を払済保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「払済保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>払済保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 払済保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『延長保険と逆に覚えない』というミスをします。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に払済保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、払済保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>払済保険は「」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。」。仕組みは「仕組みを最初から説明 Aさんが『一生涯の保障期間は残したいが、今後の保険料は払えない』と相談する。 条件確認 → 払済保険 → お金・保障の変化 保険料支払を止め、保障期間を原則残しながら保障額を小さくする。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで払済保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 払済保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 払済保険 を具体例に落とします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『延長保険と逆に覚えない』というミスをします。」を思い出します。</p>", "M": "<p><strong>払済保険＝」 結論 保険料支払を止め、保障期間を原則残しながら保障額を小さくする 「比較軸は 払済=期間を残して額を下げる／延長=額を原則残して期間を短く 。</strong></p>"}}, {"title": "延長保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>延長保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。</p><p>仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。延長保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④延長保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>延長保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 延長保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ延長保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして延長保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『払済保険と逆に覚えない』というミスをします。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が延長保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。 という核心と、そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を延長保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「延長保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>延長保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 延長保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『払済保険と逆に覚えない』というミスをします。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に延長保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、延長保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>延長保険は「」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。」。仕組みは「仕組みを最初から説明 Aさんが『今の1,000万円保障は必要だが、今後の保険料は払えない』と相談する。 条件確認 → 延長保険 → お金・保障の変化 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで延長保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 延長保険 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 延長保険 を具体例に落とします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 ケース6｜誤答を作る 「わざと『払済保険と逆に覚えない』というミスをします。」を思い出します。</p>", "M": "<p><strong>延長保険＝」 結論 保険料支払を止め、死亡保険金額を原則残しながら保障期間を短くする 「比較軸は 延長=額を残して期間短縮／払済=期間を残して額縮小 。</strong></p>"}}, {"title": "契約転換制度", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>契約転換制度</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約転換制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。契約転換制度もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④契約転換制度のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>契約転換制度</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 契約転換制度が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ契約転換制度による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして契約転換制度の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約転換制度が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が契約転換制度の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を契約転換制度の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「契約転換制度について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>契約転換制度で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 契約転換制度のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約転換制度が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に契約転換制度と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、契約転換制度の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>契約転換制度は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 契約転換制度 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで契約転換制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 契約転換制度 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 契約転換制度が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>契約転換制度＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "付加・追加・減額", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>付加・追加・減額</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</p><p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 付加・追加・減額が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。付加・追加・減額もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④付加・追加・減額のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>付加・追加・減額</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ ② 3コマで動かす 出来事の前 → 付加・追加・減額が必要 → 保障・給付後 「前後で何が変わったかを言います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ付加・追加・減額による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして付加・追加・減額の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 付加・追加・減額が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が付加・追加・減額の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 という核心と、そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を付加・追加・減額の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「付加・追加・減額について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>付加・追加・減額で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。<br><br><b>解説：</b>仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 付加・追加・減額のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 付加・追加・減額が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に付加・追加・減額と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、付加・追加・減額の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>付加・追加・減額は「」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。」。仕組みは「仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 付加・追加・減額 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで付加・追加・減額の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 付加・追加・減額 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 付加・追加・減額が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>付加・追加・減額＝」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。</strong></p>"}}, {"title": "生命保険料控除", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>生命保険料控除</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。生命保険料控除もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④生命保険料控除のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>生命保険料控除</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生命保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ生命保険料控除による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして生命保険料控除の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料控除が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が生命保険料控除の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を生命保険料控除の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「生命保険料控除について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>生命保険料控除で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。<br><br><b>解説：</b>仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 生命保険料控除のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料控除が働く時点を特定します。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に生命保険料控除と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、生命保険料控除の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>生命保険料控除は「」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。」。仕組みは「仕組みを最初から説明 条件確認 → 生命保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。」。比較では「そのあとで生命保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 生命保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。」。代表例では「具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 生命保険料控除が働く時点を特定します。」を思い出します。</p>", "M": "<p><strong>生命保険料控除＝」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</strong></p>"}}, {"title": "個人年金保険料控除", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>個人年金保険料控除</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。</p><p>仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 条件確認 → 個人年金保険料控除 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。個人年金保険料控除もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④個人年金保険料控除のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>個人年金保険料控除</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 個人年金保険料控除が必要 → 保障・給付後 「前後で何が変わったかを言います。 手元資金、保障期間、受取人、税負担、損害の穴――テーマによって変化するものが違います。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ個人年金保険料控除による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして個人年金保険料控除の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 制度自体は同じなのか、上限・割合・課税計算によって結果が変わるのかを分けます。 個人年金保険料控除が働く時点を特定します。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が個人年金保険料控除の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 という核心と、そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を個人年金保険料控除の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。そのあとで個人年金保険料控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 個人年金保険料控除 → 金額や権利の結果 です。 ケース5｜似た制度と対決 「比較の軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「個人年金保険料控除について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。F
