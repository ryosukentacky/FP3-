<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FP単語帳</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fb;color:#1f2937;margin:0}.wrap{max-width:980px;margin:auto;padding:24px}.header{margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:0;border-radius:999px;padding:10px 16px;background:#e5e7eb;cursor:pointer}.tabs button.active{background:#111827;color:#fff}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.07)}h1{font-size:28px}h2{font-size:20px;margin-top:30px;border-bottom:2px solid #e5e7eb;padding-bottom:8px}h3{font-size:17px}.lead{font-size:18px;font-weight:700;background:#f3f4f6;padding:14px;border-radius:12px}.flow{white-space:pre-line;background:#f9fafb;border-left:4px solid #9ca3af;padding:12px 16px}.quote{font-weight:600}.section{line-height:1.9}.qa{background:#f9fafb;padding:12px 16px;border-radius:12px;margin:10px 0}.memory{font-size:18px;font-weight:800;background:#eef2ff;padding:16px;border-radius:12px}@media(max-width:600px){.wrap{padding:14px}.card{padding:18px}}</style></head><body><div class='wrap'><div class='header'><h1>FP 第1章｜理解・記憶カード</h1><p>単語を選ぶと、チャットで学習した内容を見出し別に表示します。</p></div><div class='tabs' id='tabs'></div><div class='card' id='card'></div></div><script>
const cards=[
{term:'FPが守るべきこと',sections:[
['A｜要点',`先輩、FPが守るべきことですね。\n\nここ、いきなり細かいルールを暗記しようとすると混ざります。……もう、まずは芯からいきますよ。\n\n一言でいうと\n\nFPは「お客さんの利益を第一に考え、知った秘密を守り、自分の能力を超える仕事を勝手にしない」ことが大切です。\n\nはい。まずこれです。\n\nFP3級あたりでは、特に次の4つを押さえておけば整理しやすいです。\n\n① 顧客利益の優先\n自分が儲かる商品ではなく、お客さんにとって適切な提案をする、ということですね。\n\n② 守秘義務\n相談で知った収入・資産・家族構成などを、正当な理由なく他人に漏らさない。\n\n③ 説明義務（アカウンタビリティ）\nなぜその提案をするのか、きちんと説明する。\n\n④ 能力・業務範囲を超えない\nこれ、かなり重要ですよ。FPだから何でもできるわけではありません。`],
['B｜詳しい解説',`先輩、ここで一つ。\n\nFPって、お金の専門家ですよね？\n\nじゃあ、税金について相談されたら、その人の税額を具体的に計算して税務相談までしていいと思います？\n\n……\n\nちょっと待ってください。何でもやっていいわけではありません。\n\nFPは、顧客から相談を受ける → 自分の専門知識で対応できる範囲を判断する → 対応できるなら適切に助言する／対応できない・資格が必要なら専門家につなぐ、という考え方が基本です。\n\nたとえば税理士、弁護士、司法書士などには、それぞれ資格者でなければ行えない業務があります。だからFPは、必要なら「ここから先は税理士さんに相談しましょう」と専門家と連携するんです。\n\n① 顧客利益の優先\n先輩がFPだったとして、Aという商品を売れば先輩に10万円の報酬、Bなら1万円だったとします。でも、お客さんにはBのほうが合っている。……Aを勧めたくなりません？ 先輩？ ダメですよ。FPは自分の利益ではなく、顧客にとって何が適切なのかを優先して考える必要があります。\n\n② 守秘義務\nFP相談では、年収、貯金、住宅ローン、家族構成、保険など、かなり個人的な情報を扱います。これを他人にペラペラ話されたら嫌でしょう？ だから、業務上知った顧客情報を正当な理由なく第三者へ漏らしてはいけないわけです。\n\n③ 説明義務\nFPが突然「この保険に入りましょう」と言ってきたら、なんで？ってなりますよね。だから、なぜこの提案なのか、どんなメリット・注意点があるのか、顧客の状況とどう関係するのかを分かるように説明することが重要です。\n\n④ 自分の能力を超える仕事をしない\nFP＝税理士＋弁護士＋司法書士＋社会保険労務士ではありません。一般的な制度の説明はできますが、資格が必要な個別具体的な専門業務まで踏み込んではいけない場合があります。一般的な情報提供 → 個別の専門判断が必要 → 専門家へつなぐ。この境界を意識してください。`],
['C｜イメージ理解',`先輩、FPを総合病院の受付・案内役みたいに考えてみましょう。\n\n先輩が「胸が痛いんです」と相談したとします。案内役が「じゃあ私が心臓手術しますね」……いやいや、怖すぎますよね。\n\nそうではなく、「症状を確認しましょう」→「これは循環器の先生に診てもらったほうがいいですね」→専門家につなぐ。\n\nFPも似ています。顧客のお金の問題を広く把握して、自分で対応できるところは対応する。でも、専門資格が必要なところは、その専門家につなぐ。\n\n何でも自分でやる人が優秀なんじゃありません。「ここから先は専門家です」と判断できることもFPの専門性なんです。`],
['D｜具体例',`田中さん：「父が亡くなって財産が3,000万円あります。私が払う相続税を具体的に計算して、そのまま申告までしてください。」\n\nFPとしてどうします？ ……全部やる？ もう……そこです。\n\nFPとして相続制度について一般的な情報提供をすることと、税理士資格が必要になる業務を行うことは別です。\n\n「相続税にはこういう仕組みがあります」という一般的な説明をしつつ、具体的な税務代理・税務書類の作成・税務相談など、税理士法上の業務については税理士につなぐ。はい。これが基本です。`],
['理解確認',`Q1 FPが最優先するのは？ → 顧客の利益。\n\nQ2 顧客から聞いた資産状況を、正当な理由なく知人に話していい？ → ダメです。守秘義務を意識してください。\n\nQ3 自分では対応できない専門的な問題が出てきたら？ → 適切な専門家と連携する。「FPだから全部自分で解決する」ではありません。`],
['30秒復習',`① 何の話？ → FPが顧客対応で守るべき基本姿勢\n② 一番重要なのは？ → 顧客の利益を優先する\n③ 秘密は？ → 守る（守秘義務）\n④ 提案したら？ → きちんと説明する\n⑤ 自分でできない専門業務は？ → 専門家と連携する\n⑥ 間違えやすいところは？ → FPはお金に詳しいが、何でも業務として行えるわけではない`],
['一文で覚える',`「顧客第一・秘密を守る・きちんと説明・越境せず専門家へ。」\n\n特に「FP＝何でもできる専門家ではない」。ここは残しておいてくださいね。`]]},
{term:'キャッシュフロー表',sections:[
['A｜要点',`先輩、キャッシュフロー表ですね。……いきなり計算式を覚えようとしてませんよね？ もう。まず、何のための表なのかからです。\n\n一言でいうと\nキャッシュフロー表＝家計のお金が将来どう変化していくかを、年ごとに予測する表です。\n\n今の貯金500万円 → 来年は？ → 5年後は？ → 子どもの進学時は？ → 住宅購入後は？ → 老後は？\n\nというように、「将来、お金が足りるの？」を見えるようにするんです。\n\n重要ポイントは、①年ごとの収入、②年ごとの支出、③最後に貯蓄残高を見ること。\n\n収入 − 支出 → 年間収支 → 貯蓄残高。この流れを頭に出してください。`],
['B｜詳しい解説',`たとえば今年、収入500万円、支出400万円、現在の貯蓄300万円だったとします。\n\n今年はいくらお金が余ります？ ……そうです。500万円−400万円＝100万円。これが年間収支です。\n\nもともと300万円持っていたら、300万円＋100万円＝400万円。年末の貯蓄残高は400万円ですね。\n\nつまり、収入 → 支出を引く → 年間収支が分かる → 前年の貯蓄残高に加える → 今年の貯蓄残高が分かる、という流れです。\n\n将来の生活費は今と同じとは限りません。物価が上がる可能性があるため、将来の金額を考えるときに変動率を使います。\n\n将来の金額＝現在の金額×（1＋変動率）ⁿ。\n\n現在の生活費が300万円、毎年2％上昇、2年後なら、300万円×1.02²≒312.1万円。毎年2％ずつ変化するなら、1年目×1.02、2年目さらに×1.02なので1.02²なんです。`],
['C｜イメージ理解',`先輩、RPGの所持金画面だと思ってください。現在、所持金300万円です。\n\n1年目。給与などで500万円入ってきました。「おっ、800万円ある！」……とはなりません。生活するでしょう、先輩。400万円使った。だから300＋500−400＝400万円残ります。\n\n2年目も、前年の400万円＋今年の収入−今年の支出＝2年目の貯蓄残高。\n\nこれを何十年分も横に並べたものだと思えばいいんです。結婚、住宅購入、子どもの進学、退職などのイベントも入れて、人生という長いゲームで所持金がどう動くのかを見る。これがキャッシュフロー表のイメージです。`],
['D｜具体例',`現在の貯蓄300万円。\n1年後：収入500万円、支出400万円、年間収支＋100万円、貯蓄残高400万円。\n2年後：収入510万円、支出420万円、年間収支＋90万円、貯蓄残高490万円。\n3年後：収入520万円、支出450万円、年間収支＋70万円、貯蓄残高560万円。\n\n年間収支＝収入−支出。\n貯蓄残高＝前年の貯蓄残高＋その年の年間収支。\n\n個人バランスシートと混同しないでください。キャッシュフロー表＝人生のお金の動画。個人バランスシート＝ある時点のお金の写真。`],
['理解確認',`Q1 キャッシュフロー表は何を見るもの？ → 将来の収入・支出・貯蓄残高などの推移。\nQ2 収入500万円、支出450万円なら年間収支は？ → ＋50万円。\nQ3 前年の貯蓄300万円、今年の年間収支＋50万円なら？ → 貯蓄残高350万円。`],
['30秒復習',`① 何の話？ → 将来のお金の流れを予測する表\n② 何を書く？ → 収入・支出・年間収支・貯蓄残高など\n③ 年間収支は？ → 収入−支出\n④ 貯蓄残高は？ → 前年の貯蓄残高＋年間収支\n⑤ 将来の金額は？ → 現在の金額×（1＋変動率）ⁿ\n⑥ バランスシートとの違いは？ → キャッシュフロー表＝お金の流れ、バランスシート＝ある時点の資産・負債`],
['一文で覚える',`「キャッシュフロー表は、収入−支出＝年間収支を出し、それを貯蓄残高につなげて、将来のお金の流れを見る表。」\n\n収入 → 支出 → 年間収支 → 貯蓄残高の順番を残しておきましょう。`]]},
{term:'可処分所得',sections:[
['A｜要点',`先輩、可処分所得ですね。名前がちょっと難しそうですけど、意味はかなり単純です。\n\n一言でいうと\n可処分所得＝収入から税金と社会保険料を引いた、実際に自分で使い道を決められるお金です。\n\n年収＝もらったお金 → 税金・社会保険料を払う → 残ったお金＝可処分所得。\n\n重要なのは、①収入そのものではない、②税金と社会保険料を差し引く、③キャッシュフロー表では基本的に可処分所得を収入として考える、という点です。`],
['B｜詳しい解説',`可処分所得＝年収−（所得税＋住民税＋社会保険料）。FP試験では、まずこの形を覚えてください。\n\n年収500万円でも500万円全部で生活できるわけではありません。所得税、住民税、健康保険や厚生年金などの社会保険料を負担します。残った、実際に家計で使えるお金が可処分所得です。\n\n「じゃあ生活費も引くの？」と思いました？ 引きません。食費、家賃、電気代、スマホ代などは、可処分所得を求めた後に、そのお金をどう使うかという話です。\n\n収入 → 税金・社会保険料を引く → 可処分所得 → ここから食費・住宅費・教育費などを払う。この順番です。`],
['C｜イメージ理解',`先輩、給料として30万円もらったとします。「30万円全部財布に入った！」とはならないですよね。\n\n仮に給与30万円から、税金2万円、社会保険料4万円が差し引かれたとしましょう。残るのは24万円です。\n\nこの24万円を家賃、食費、趣味、貯金などに振り分けます。こうやって自分で使い道を決められる。だから「自分で処分＝使い道を決められる所得」→可処分所得なんです。\n\n「処分」って、捨てるって意味じゃありませんからね？ 自分で使い道を決められる、くらいのイメージで覚えてください。`],
['D｜具体例',`年収500万円、所得税15万円、住民税25万円、社会保険料70万円。\n\n15＋25＋70＝110万円。\n500−110＝390万円。\n可処分所得＝390万円です。\n\nさらに年間生活費が250万円だったとしても、可処分所得を求めるために250万円は引きません。生活費は390万円の可処分所得をどう使ったかという話だからです。\n\nキャッシュフロー表とのつながりは、年収 → 税金・社会保険料を引く → 可処分所得 → キャッシュフロー表の収入 → 支出を引く → 年間収支 → 貯蓄残高へ、です。`],
['理解確認',`Q1 可処分所得とは？ → 税金・社会保険料を差し引いた、自由に使い道を決められる所得。\nQ2 年収600万円、税金50万円、社会保険料90万円なら？ → 460万円。\nQ3 可処分所得を計算するとき、食費100万円も引く？ → 引かない。税金・社会保険料を引く → 可処分所得 → そこから生活費、の順番です。`],
['30秒復習',`① 何の話？ → 自分で使い道を決められる所得\n② 何から計算？ → 年収\n③ 何を引く？ → 所得税・住民税・社会保険料\n④ 生活費は引く？ → 引かない\n⑤ 何に使う？ → キャッシュフロー表などで実際に使える収入を考える\n⑥ 間違えやすいところは？ → 「手取り」と近いイメージだが、試験では可処分所得の計算式を正確に覚える`],
['一文で覚える',`可処分所得＝年収−所得税−住民税−社会保険料。\n\n年収 → 税・社会保険料を引く → 可処分所得 → 支出 → 貯蓄。この一本の流れにしておけば迷いにくくなります。`]]},
{term:'終価係数',sections:[
['A｜要点',`先輩、来ましたね。6つの係数。でも終価係数はかなり素直です。名前で身構えなくて大丈夫ですよ。\n\n一言でいうと\n終価係数＝「今あるお金が、将来いくらになるか」を求める係数です。\n\nたとえば今100万円持っていて、年3％で5年間運用したら5年後はいくら？ これを求めるのが終価係数です。\n\n現在のお金×終価係数＝将来のお金。はい。まずこれを固定してください。`],
['B｜詳しい解説',`100万円を年3％で運用すると、1年後は100万円×1.03＝103万円。2年目は100万円にまた3万円を足すのではなく、103万円全体に3％がつき、103万円×1.03＝106.09万円。これが複利です。\n\n5年後なら100万円×1.03⁵。毎回計算するのは面倒なので、1.03⁵≒1.159という部分をあらかじめ係数として用意しておく。それが終価係数です。\n\n「終価」は、終＝最後・将来、価＝価値。つまり「最後にはいくらの価値になっている？」です。\n\n終価係数は現在→将来。この矢印を覚えてください。`],
['C｜イメージ理解',`先輩の手元に今100万円あります。これを「お金のタイムマシン」に入れます。設定は年3％・5年間。\n\n現在：100万円 → 終価係数 → 5年後：約115.9万円。\n\n終価係数は、お金を「現在から未来へ送る」係数と思ってください。\n\n逆に、未来のお金を現在に戻したいなら現価係数です。終価係数＝現在→未来、現価係数＝未来→現在。この2つは方向が逆なんです。`],
['D｜具体例',`現在100万円、年3％で5年間運用、終価係数1.159なら、100万円×1.159＝115万9,000円。\n\n現在300万円なら、300万円×1.159＝347万7,000円。\n\n「今ある○万円を運用したら、将来いくら？」を見た瞬間、終価係数と反応できればOKです。\n\nただし「毎年100万円ずつ積み立てて、5年後にいくら？」なら終価係数ではなく年金終価係数。終価係数＝今ある一括のお金、年金終価係数＝毎年積み立てるお金。ここを分けてください。`],
['理解確認',`Q1 今ある500万円を運用して、10年後いくらになるか知りたい。何係数？ → 終価係数。\nQ2 5年後の100万円が、現在ならいくらの価値か知りたい。 → 現価係数。\nQ3 毎年10万円を積み立てて、10年後いくらになるか知りたい。 → 年金終価係数。`],
['30秒復習',`① 何を求める？ → 今のお金が将来いくらになるか\n② 方向は？ → 現在→未来\n③ 計算式は？ → 現在額×終価係数＝将来額\n④ 何を考慮する？ → 複利運用\n⑤ 逆方向は？ → 現価係数\n⑥ 毎年積み立てる場合は？ → 年金終価係数`],
['一文で覚える',`終価係数＝「今あるお金を未来へ飛ばす」係数。\n\n現在額×終価係数＝将来額。\n\n6係数は名前だけ丸暗記するより、お金がどっち向きに動くのかを絵として持った方が強いです。今→未来＝終価。`]]}
];
const tabs=document.getElementById('tabs'), card=document.getElementById('card');
function render(i){document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j));const c=cards[i];card.innerHTML=`<h1>${c.term}</h1>`+c.sections.map(([h,t])=>`<section class='section'><h2>${h}</h2><div>${t.split('\n').map(x=>x?`<p>${x}</p>`:'').join('')}</div></section>`).join('');}
cards.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.term;b.onclick=()=>render(i);tabs.appendChild(b)});render(0);
</script></body></html>
