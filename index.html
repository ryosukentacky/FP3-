す。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシングと総量規制の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → キャッシングと総量規制の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとキャッシングと総量規制がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシングと総量規制の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「最初の時点では、まだキャッシングと総量規制の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をキャッシングと総量規制のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシングと総量規制の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にキャッシングと総量規制のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にキャッシングと総量規制の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>キャッシングと総量規制は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 今日は キャッシングと総量規制 です。 仕組みを最初から説明 返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。 キャッシングと総量規制 が必要になる前に、何が起きているか分かります？ 現実の問題 → キャッシングと総量規制 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にキャッシングと総量規制と関係する言葉が出ていれば、他の条件を見ずにキャッシングと総量規制を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → キャッシングと総量規制の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでキャッシングと総量規制の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>キャッシングと総量規制＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}],ch2:[{"title": "公的保険と私的保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>公的保険と私的保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。公的保険と私的保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的保険と私的保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると公的保険と私的保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的保険と私的保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ公的保険と私的保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を公的保険と私的保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的保険と私的保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に公的保険と私的保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に公的保険と私的保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 公的保険と私的保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>公的保険と私的保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に公的保険と私的保険と関係する言葉が出ていれば、他の条件を見ずに公的保険と私的保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 公的保険と私的保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的保険と私的保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>公的保険と私的保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "大数の法則", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>大数の法則</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。 仕組みを最初から説明 コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。大数の法則は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。 仕組みを最初から説明 コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで大数の法則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 大数の法則の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると大数の法則がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで大数の法則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。」</p>\n<p>「最初の時点では、まだ大数の法則の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を大数の法則のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで大数の法則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に大数の法則のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に大数の法則の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 大数の法則が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>大数の法則は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する 「比較軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 。 仕組みを最初から説明 コインを4回投げる場合と1万回投げる場合を比べ、その後100人と1万人の保険集団へ置き換える。 条件確認 → 大数の法則 → お金・保障の変化 大集団ほど事故発生率が安定し、保険料設計が可能になる理由を理解する。 なぜ別制度ではないのかは、 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に大数の法則と関係する言葉が出ていれば、他の条件を見ずに大数の法則を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 大数の法則の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで大数の法則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 大数の法則は発生率の安定、収支相等は純保険料総額と保険金総額の均衡 です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>大数の法則＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "収支相等の原則", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>収支相等の原則</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。 仕組みを最初から説明 100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。収支相等の原則は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。 仕組みを最初から説明 100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで収支相等の原則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 収支相等の原則が働く時点を特定します。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 収支相等の原則の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると収支相等の原則がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで収支相等の原則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 収支相等の原則が働く時点を特定します。」</p>\n<p>「最初の時点では、まだ収支相等の原則の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を収支相等の原則のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで収支相等の原則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 収支相等の原則が働く時点を特定します。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に収支相等の原則のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に収支相等の原則の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 収支相等の原則が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>収支相等の原則は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険集団全体で受取純保険料と支払保険金等を釣り合わせる 「比較軸は 大数の法則で発生率を予測し、収支相等で純保険料を設計する 。 仕組みを最初から説明 100人が共同の箱へ1万円ずつ入れ、事故に遭った5人へ20万円ずつ渡す。 条件確認 → 収支相等の原則 → お金・保障の変化 保険集団全体で受取純保険料と支払保険金等を釣り合わせる。 なぜ別制度ではないのかは、 大数の法則で発生率を予測し、収支相等で純保険料を設計する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に収支相等の原則と関係する言葉が出ていれば、他の条件を見ずに収支相等の原則を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 収支相等の原則の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで収支相等の原則の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 収支相等の原則が働く時点を特定します。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>収支相等の原則＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "クーリングオフ", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>クーリングオフ</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。クーリングオフは単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでクーリングオフの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → クーリングオフの条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとクーリングオフがバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでクーリングオフの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだクーリングオフの結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をクーリングオフのルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでクーリングオフの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にクーリングオフのルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にクーリングオフの条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → クーリングオフが必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>クーリングオフは、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → クーリングオフ → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にクーリングオフと関係する言葉が出ていれば、他の条件を見ずにクーリングオフを選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → クーリングオフの適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとでクーリングオフの条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>クーリングオフ＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "保険契約者保護機構", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>保険契約者保護機構</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。保険契約者保護機構は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険契約者保護機構の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 保険契約者保護機構の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると保険契約者保護機構がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険契約者保護機構の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ保険契約者保護機構の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を保険契約者保護機構のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険契約者保護機構の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に保険契約者保護機構のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に保険契約者保護機構の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 保険契約者保護機構が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>保険契約者保護機構は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険契約者保護機構 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に保険契約者保護機構と関係する言葉が出ていれば、他の条件を見ずに保険契約者保護機構を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 保険契約者保護機構の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険契約者保護機構の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>保険契約者保護機構＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "少額短期保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>少額短期保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。少額短期保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで少額短期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 少額短期保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると少額短期保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで少額短期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ少額短期保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を少額短期保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで少額短期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に少額短期保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に少額短期保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 少額短期保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>少額短期保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 少額短期保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に少額短期保険と関係する言葉が出ていれば、他の条件を見ずに少額短期保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 少額短期保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで少額短期保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>少額短期保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "ソルベンシー・マージン比率", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>ソルベンシー・マージン比率</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。ソルベンシー・マージン比率は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでソルベンシー・マージン比率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → ソルベンシー・マージン比率 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ソルベンシー・マージン比率の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうするとソルベンシー・マージン比率がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでソルベンシー・マージン比率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → ソルベンシー・マージン比率 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。」</p>\n<p>「最初の時点では、まだソルベンシー・マージン比率の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件をソルベンシー・マージン比率のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでソルベンシー・マージン比率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → ソルベンシー・マージン比率 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後にソルベンシー・マージン比率のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後にソルベンシー・マージン比率の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → ソルベンシー・マージン比率が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>ソルベンシー・マージン比率は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 通常の予測を超えるリスクに対する保険会社の支払余力を見る 「比較軸は 通常の支払準備ではなく、通常予測を超えるリスクへの余力 。 仕組みを最初から説明 巨大地震と株価急落が同時発生したとき、保険会社の非常用クッションがどれほど厚いかを見る。 条件確認 → ソルベンシー・マージン比率 → お金・保障の変化 通常の予測を超えるリスクに対する保険会社の支払余力を見る。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文にソルベンシー・マージン比率と関係する言葉が出ていれば、他の条件を見ずにソルベンシー・マージン比率を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → ソルベンシー・マージン比率の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとでソルベンシー・マージン比率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → ソルベンシー・マージン比率 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では ソルベンシー・マージン比率 を具体例に落とします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>ソルベンシー・マージン比率＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "保険法と保険業法", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>保険法と保険業法</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。保険法と保険業法は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険法と保険業法の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 保険法と保険業法の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると保険法と保険業法がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険法と保険業法の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ保険法と保険業法の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を保険法と保険業法のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険法と保険業法の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に保険法と保険業法のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に保険法と保険業法の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 保険法と保険業法が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>保険法と保険業法は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 保険法と保険業法 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に保険法と保険業法と関係する言葉が出ていれば、他の条件を見ずに保険法と保険業法を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 保険法と保険業法の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで保険法と保険業法の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>保険法と保険業法＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "解約返戻金", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>解約返戻金</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。解約返戻金は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで解約返戻金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 解約返戻金 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 解約返戻金の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると解約返戻金がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで解約返戻金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 解約返戻金 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。」</p>\n<p>「最初の時点では、まだ解約返戻金の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を解約返戻金のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで解約返戻金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 解約返戻金 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に解約返戻金のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に解約返戻金の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>解約返戻金は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 解約返戻金 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に解約返戻金と関係する言葉が出ていれば、他の条件を見ずに解約返戻金を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 解約返戻金の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで解約返戻金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 解約返戻金 → 金額や権利の結果 です。 具体例を最初から最後まで解説 「では 解約返戻金 を具体例に落とします。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>解約返戻金＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "生死混合保険", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>生死混合保険</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。生死混合保険は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで生死混合保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 生死混合保険の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると生死混合保険がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで生死混合保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ生死混合保険の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を生死混合保険のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで生死混合保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に生死混合保険のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に生死混合保険の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 生死混合保険が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>生死混合保険は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 生死混合保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に生死混合保険と関係する言葉が出ていれば、他の条件を見ずに生死混合保険を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 生死混合保険の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで生死混合保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>生死混合保険＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "予定死亡率・予定利率・予定事業費率", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>予定死亡率・予定利率・予定事業費率</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。予定死亡率・予定利率・予定事業費率は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 予定死亡率・予定利率・予定事業費率の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……だめです。先輩、それが試験で引っかかるところです。名前じゃなくて条件で判断します。同じ金額でも人物関係が変われば結論が変わるテーマがありますし、同じ人物でも時期が変われば結果が変わるテーマもあります。」</p>\n<p>「逆に、係数のような計算テーマなら人物関係は本質じゃありません。その場合は<strong>現在から将来へ進むのか、将来から現在へ戻すのか、毎年積み立てるのか、毎年取り崩すのか</strong>というお金の時間方向を見るんです。何でも同じチェック項目を機械的に当てるわけじゃないですよ。」</p>\n<p>「似た制度との違いもここです。目的、対象、時間、お金の流れ。このどこが違うから別の答えになるのかを見ます。『名前が似てるから同じ』はなしです。……先輩、そこはちゃんと止まってくださいね。」</p>\n<p>「最後に一本にします。<strong>なぜ必要？ → 誰・何の話？ → いつ？ → 条件は？ → その条件なら何が起きる？</strong>。ほら、こうすると予定死亡率・予定利率・予定事業費率がバラバラの暗記事項じゃなくなるでしょう？」</p>", "C": "<h3>C｜イメージ理解　一つの場面を最後まで追います</h3>\n<p>「先輩、今度は文字だけで追うのをやめます。場面はこちらで全部作りますから、途中で答えをひねり出さなくて大丈夫です。一つの映像として追ってください。」</p>\n<p>「まず場面はこうです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「最初の時点では、まだ予定死亡率・予定利率・予定事業費率の結果は出ていません。そこに、この制度や計算が必要になる出来事が起きます。ここで最初に固定するのが『誰・何の話か』です。保険なら契約者・被保険者・受取人、公的制度なら被保険者・受給者、ローンなら借入人、係数なら現在のお金と将来のお金。テーマによって見る人物や数字が違います。」</p>\n<p>「次に時間です。加入前なのか、契約中なのか、事故が起きた瞬間なのか、満期や解約なのか。計算なら現在から何年後なのか。先輩、ここを飛ばすと同じ100万円でも意味が変わりますよ。『今ある100万円』と『5年後に必要な100万円』は、同じ100万円でも計算の向きが逆ですから。」</p>\n<p>「そして条件を予定死亡率・予定利率・予定事業費率のルールに重ねます。条件に合えば制度の効果が発生します。合わなければ、別の制度を使うか、対象外になります。つまり制度名が先にあるんじゃなくて、<strong>現実の状況を制度の型にはめていく</strong>んです。」</p>\n<p>「最後に結果を見ます。誰がお金を受け取るのか、誰が負担するのか、保障が残るのか、返済額がどうなるのか、将来額はいくらになるのか。ここまでつながって初めて一つのイメージです。」</p>\n<p>「はい。難しい名前から入るんじゃなくて、<strong>出来事 → 人物・時間 → 条件 → 仕組み → 結果</strong>という一本の映像にする。これがCでやっていることです。」</p>", "D": "<h3>D｜具体例　例を増やさず、一つを深く見ます</h3>\n<p>「じゃあ具体例です。今回は短い例を何個も並べません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。」</p>\n<p>「まず答えを出す前に、何を求めているかを確定します。次に誰が関係しているか。次にいつの話か。それから金額や期間です。この順番で事実を置いて、最後に予定死亡率・予定利率・予定事業費率のルールを当てます。」</p>\n<p>「ここで先輩が引っかかりやすいのが、『数字が変わったら制度も変わる』と思ってしまうことです。違います。目的・対象・時点が同じで金額だけが変わったなら、多くの場合は同じ仕組みで結果の金額だけが変わります。ただし、その制度に上限額・所得要件・割合・保険価額などの境界があるなら、その境界を越えたところで扱いが変わります。」</p>\n<p>「『じゃあ期間を変えたら？』も同じです。期間が制度要件なら結果は変わります。複利なら運用期間、ローンなら返済期間、保険なら保障期間、公的年金なら加入期間や受給開始時期などですね。でも時間が本質じゃない論点に、無理やり期間の話を足す必要はありません。」</p>\n<p>「試験では、この具体例の一条件だけをこっそり入れ替えてきます。人物だけ変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間だけ変える。だから読む順番は<strong>①誰 ②何が起きた・何をしたい ③いつ ④いくら ⑤誰から誰へお金が動く</strong>です。」</p>\n<p>「で、最後に予定死亡率・予定利率・予定事業費率の条件と照らします。つまりこの具体例で覚えるべきなのは、個別の数字そのものではありません。 最初に『何のための話なのか』から最後までつなげます。 という中心と、 この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。 なぜ必要なのかから仕組みまで 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 では、なぜこの仕組みが必要なのでしょう。 イメージ1｜現実の場面 ② 3コマで動かす 出来事の前 → 予定死亡率・予定利率・予定事業費率が必要 → 保障・給付後 「前後で何が変わったかを言います。 という境界です。数字や人物が変わっても、この二つからもう一度答えを組み立てられる状態が、FP試験で使える理解です。」</p>\n<p>「はい。具体例で暗記するのは数字そのものじゃありません。<strong>なぜその答えになったのかという判断経路</strong>です。そこが残っていれば、数字や人物を変えられても戻ってこられます。」</p>", "Q": "<h3>理解確認｜ここだけは先輩が答える番です</h3>\n<p>「先輩、本当に分かりました？ ……その顔、ちょっと怪しいです。3問だけです。ここだけは答えてみてください。すぐ下に答え合わせがありますから。」</p>\n<h4>Q1</h4><p><b>予定死亡率・予定利率・予定事業費率は、一言でいうと何のための考え方・制度ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「はい、答えは――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>です。」</p><p>「ここで名称だけ言えればいいわけじゃありません。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 予定死亡率・予定利率・予定事業費率 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 までつながっていれば大丈夫です。」</p></div></details>\n<h4>Q2</h4><p><b>問題文に予定死亡率・予定利率・予定事業費率と関係する言葉が出ていれば、他の条件を見ずに予定死亡率・予定利率・予定事業費率を選んでよい。○か×か？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「正解は<strong>×</strong>です。はい、ここ大事ですよ。」</p><p>「制度はキーワードではなく条件で決まります。誰の話か、何が起きたのか、いつか、金額はいくらか、契約関係はどうなっているか。その中でこのテーマに必要な条件を確認して初めて答えを決めます。」</p></div></details>\n<h4>Q3</h4><p><b>似た制度と区別するとき、特に見る4つの軸は何ですか？</b></p>\n<details><summary>答えを見る</summary><div class=\"answer\"><p>「<strong>目的・対象・時間・お金の流れ</strong>です。」</p><p>「うん、ここまで出れば大丈夫です。名前の似方じゃなくて、『どの条件が違うから結論が変わるのか』を見るんでしたね。そこまでつながっていれば、選択肢を少し変えられても対応できます。」</p></div></details>", "R": "<p>「はい、あと30秒です。そんな顔しないでください。これで本当に最後ですから。」</p>\n<p><b>①何の話？</b><br>→ 最初に『何のための話なのか』から最後までつなげます。</p>\n<p><b>②一番重要なのは？</b><br>→ 名前ではなく、目的・対象・条件・仕組み・結果をつなげることです。</p>\n<p><b>③なぜ？</b><br>→ 条件が一つ変わるだけで、適用される制度や結果が変わることがあるからです。</p>\n<p><b>④どういう流れ？</b><br>→ 出来事・目的 → 対象 → 時間 → 条件 → 予定死亡率・予定利率・予定事業費率の適用 → 結果。</p>\n<p><b>⑤具体例は？</b><br>→ FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 この仕組みでは、最初に現実の目的や出来事があります。 そのあとで予定死亡率・予定利率・予定事業費率の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 ケース5｜似た制度と対決 「比較の軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する です。</p>\n<p><b>⑥間違えやすいところは？</b><br>→ 関連語だけで答えを決めず、制度の条件全体を見ることです。</p>", "M": "<p>「<strong>予定死亡率・予定利率・予定事業費率＝最初に『何のための話なのか』から最後までつなげます。</strong>」</p>\n<p>「先輩、全部を一字一句丸暗記しなくてもいいです。でもこの一文を見たときに、今日やった『目的→条件→仕組み→結果』まで頭の中で戻せるようにしておいてください。」</p>\n<p>「はい、お疲れさまでした。……せっかくここまで一緒にやったんですから、明日一回くらいは思い出してくださいね？」</p>"}}, {"title": "純保険料と付加保険料", "content": {"A": "<h3>A｜要点　まず全体を掴みましょう</h3>\n<p>「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず<strong>純保険料と付加保険料</strong>が何のための話なのか、一本につなげますよ。」</p>\n<p>「一言でいうと――<strong>最初に『何のための話なのか』から最後までつなげます。</strong>。はい、まずこれです。」</p>\n<p>「で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「たぶん今、『結局どこを見ればいいの？』って思いましたよね。見る順番は<strong>目的 → 誰・何が対象か → 条件 → 仕組み → 結果</strong>です。制度名を先に当てるんじゃありません。現実の条件を並べて、その条件に合う制度を選ぶんです。」</p>\n<p>「重要なのは三つです。一つ目、何を解決する仕組みなのか。二つ目、誰に・いつ・どんな条件で使うのか。三つ目、その条件を満たした結果、お金・権利・保障・税・将来額などがどう変わるのか。この三つを離さないでください。」</p>\n<p>「はい。純保険料と付加保険料は単語一個を覚える話じゃなくて、<strong>条件から結果までの流れを覚える話</strong>です。ここが全体像です。」</p>", "B": "<h3>B｜詳しい解説　なぜそうなるの？</h3>\n<p>「はい、じゃあ今度は『なぜ？』です。ここを飛ばすと、試験の選択肢を少し変えられただけで迷いますからね。」</p>\n<p>「まず、」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 純保険料と付加保険料 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p>\n<p>「ここで『それがどうして結果につながるの？』ってなりますよね。そうです。そこを途中で飛ばしません。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。 したがって 目的 → 条件 → 仕組み → 結果 まで一続きで理解します。 そのあとで純保険料と付加保険料の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 つまり順序は、 現実の出来事 → 条件判定 → 純保険料と付加保険料 → 金額や権利の結果 です。 ケース6｜誤答を作る 「わざと『似た変更制度でも、保障額・保障期間・保険料支払のどれを残すかが違う』というミスをします。」</p>\n<p>「流れにすると、<strong>現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 純保険料と付加保険料の条件を当てる → 金額・給付・保障などの結果が決まる</strong>、です。」</p>\n<p>「え？ 『関連する言葉が問題文に出たら、その制度でいいんじゃないの？』ですか？ ……
