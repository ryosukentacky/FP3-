summary>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。原因語を拾えば混同しにくくなります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>高年齢雇用継続給付は60歳以降の賃金低下と雇用継続、介護休業給付は対象家族の介護による休業が中心です。制度改正の影響を受けやすい分野なので、支給率など数字は受験年度基準で確認します。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>高年齢雇用継続給付と介護休業給付</dd><dt>② 一番重要なのは？</dt><dd>前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</dd>\n<dt>③ なぜ？</dt><dd>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。</dd><dt>④ イメージ</dt><dd>60歳以降も勤務する人／親の介護で休業する人。</dd>\n<dt>⑤ 具体例</dt><dd>問題文の原因語を拾う。『60歳以降の賃金低下』と『介護休業』を同じ計算にしない。</dd><dt>⑥ 注意</dt><dd>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>高年齢雇用継続給付と介護休業給付＝前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>公的年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</p>\n<p>「先輩、ここで一回止めます。<strong>公的年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>公的年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>公的年金は老齢だけでなく障害・遺族も含む社会保険です。国民年金は基礎年金として広く共通し、厚生年金は会社員等へ上乗せされます。保険料を『自分の老後貯金』だけと捉えると障害・遺族給付が理解しにくくなります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社員が65歳になり老齢年金を受ける場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員が65歳になり老齢年金を受ける場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>公的年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">会社員なら老齢基礎年金だけでなく、加入記録・報酬に応じた老齢厚生年金も考える。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。障害年金という現役期の保障もあります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 30歳で重い障害になった場合、65歳まで待たないと何も出ない制度ではありません。障害年金という現役期の保障もあります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>公的年金は老齢だけでなく障害・遺族も含む社会保険です。国民年金は基礎年金として広く共通し、厚生年金は会社員等へ上乗せされます。保険料を『自分の老後貯金』だけと捉えると障害・遺族給付が理解しにくくなります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</dd>\n<dt>③ なぜ？</dt><dd>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</dd><dt>④ イメージ</dt><dd>会社員が65歳になり老齢年金を受ける場面。</dd>\n<dt>⑤ 具体例</dt><dd>会社員なら老齢基礎年金だけでなく、加入記録・報酬に応じた老齢厚生年金も考える。</dd><dt>⑥ 注意</dt><dd>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的年金＝国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "任意加入被保険者", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>任意加入被保険者</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>任意加入被保険者</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</p>\n<p>「先輩、ここで一回止めます。<strong>任意加入被保険者</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>任意加入被保険者</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>任意加入被保険者</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>任意加入は、強制加入が終わった後などに本人の意思で加入期間を補う仕組みです。ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>60歳になったが満額に必要な納付月数が足りない場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>任意加入被保険者</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>60歳になったが満額に必要な納付月数が足りない場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>任意加入被保険者</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>任意加入被保険者</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 60歳で納付済月数が満額に足りない人が、65歳までの範囲などで条件を満たして任意加入し不足を補うイメージです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>任意加入は、強制加入が終わった後などに本人の意思で加入期間を補う仕組みです。ただし誰でも何歳まででも自由に入れるわけではなく、年齢・居住・受給資格等の条件があります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>任意加入被保険者</dd><dt>② 一番重要なのは？</dt><dd>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</dd><dt>④ イメージ</dt><dd>60歳になったが満額に必要な納付月数が足りない場面。</dd>\n<dt>⑤ 具体例</dt><dd>不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。</dd><dt>⑥ 注意</dt><dd>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>任意加入被保険者＝国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>国民年金保険料の免除・猶予制度</strong>です。」</p>\n<p>「一言でいうと――<strong>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>国民年金保険料の免除・猶予制度</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</p>\n<p>「先輩、ここで一回止めます。<strong>国民年金保険料の免除・猶予制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>国民年金保険料の免除・猶予制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>国民年金保険料の免除・猶予制度</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>免除は将来の老齢基礎年金額にも一定割合が反映されますが、納付猶予は追納しない限り年金額への反映が異なります。どちらも単なる未納より受給資格面で有利です。一部免除では残りの保険料を納めないと未納扱いになる点にも注意します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>失業などで所得が大きく下がった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>国民年金保険料の免除・猶予制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>失業などで所得が大きく下がった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>国民年金保険料の免除・猶予制度</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『払えないから放置』ではなく申請。全額免除・一部免除・猶予のどれか、所得要件等を確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>『全額払えない→何もしない』ではなく申請。10年以内の追納などを利用すれば将来額を増やせる場合があります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>国民年金保険料の免除・猶予制度</strong>を一言で説明してください。<details><summary>答え</summary>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 『全額払えない→何もしない』ではなく申請。10年以内の追納などを利用すれば将来額を増やせる場合があります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>免除は将来の老齢基礎年金額にも一定割合が反映されますが、納付猶予は追納しない限り年金額への反映が異なります。どちらも単なる未納より受給資格面で有利です。一部免除では残りの保険料を納めないと未納扱いになる点にも注意します。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>国民年金保険料の免除・猶予制度</dd><dt>② 一番重要なのは？</dt><dd>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</dd>\n<dt>③ なぜ？</dt><dd>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</dd><dt>④ イメージ</dt><dd>失業などで所得が大きく下がった場面。</dd>\n<dt>⑤ 具体例</dt><dd>『払えないから放置』ではなく申請。全額免除・一部免除・猶予のどれか、所得要件等を確認。</dd><dt>⑥ 注意</dt><dd>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>国民年金保険料の免除・猶予制度＝所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "老齢基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>老齢基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>老齢基礎年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</p>\n<p>「先輩、ここで一回止めます。<strong>老齢基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>老齢基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>老齢基礎年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>受給資格期間を満たすことと満額を受け取ることは別です。資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>65歳になった人が老齢基礎年金を請求する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>老齢基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳になった人が老齢基礎年金を請求する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>老齢基礎年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>10年以上の資格期間があれば受給権を得られても、40年すべて納付した人と同じ満額になるとは限らない、という二段階で考えます。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>老齢基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 10年以上の資格期間があれば受給権を得られても、40年すべて納付した人と同じ満額になるとは限らない、という二段階で考えます。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>受給資格期間を満たすことと満額を受け取ることは別です。資格期間には免除期間等が含まれる場合がありますが、年金額への反映は納付済期間と同じとは限りません。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>老齢基礎年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</dd>\n<dt>③ なぜ？</dt><dd>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</dd><dt>④ イメージ</dt><dd>65歳になった人が老齢基礎年金を請求する場面。</dd>\n<dt>⑤ 具体例</dt><dd>40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。</dd><dt>⑥ 注意</dt><dd>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>老齢基礎年金＝国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>繰上げ支給と繰下げ支給</strong>です。」</p>\n<p>「一言でいうと――<strong>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>繰上げ支給と繰下げ支給</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</p>\n<p>「先輩、ここで一回止めます。<strong>繰上げ支給と繰下げ支給</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>繰上げ支給と繰下げ支給</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>繰上げ支給と繰下げ支給</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>繰上げは早く受け取れる代わりに月額が減り、原則としてその減額は生涯続きます。繰下げは待つ代わりに増額します。増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>60代前半で受給を始めたい人／70歳まで待てる人。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>繰上げ支給と繰下げ支給</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>60代前半で受給を始めたい人／70歳まで待てる人。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>繰上げ支給と繰下げ支給</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>『60歳から5年だけ減って65歳から元に戻る』ではありません。繰上げによる調整後の額を生涯受けるイメージです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>繰上げ支給と繰下げ支給</strong>を一言で説明してください。<details><summary>答え</summary>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 『60歳から5年だけ減って65歳から元に戻る』ではありません。繰上げによる調整後の額を生涯受けるイメージです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>繰上げは早く受け取れる代わりに月額が減り、原則としてその減額は生涯続きます。繰下げは待つ代わりに増額します。増減率は生年月日や制度改正の影響があるため受験年度の数値確認が重要です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>繰上げ支給と繰下げ支給</dd><dt>② 一番重要なのは？</dt><dd>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</dd>\n<dt>③ なぜ？</dt><dd>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</dd><dt>④ イメージ</dt><dd>60代前半で受給を始めたい人／70歳まで待てる人。</dd>\n<dt>⑤ 具体例</dt><dd>受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。</dd><dt>⑥ 注意</dt><dd>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>繰上げ支給と繰下げ支給＝老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "付加年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>付加年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>付加年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</p>\n<p>「先輩、ここで一回止めます。<strong>付加年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>付加年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>付加年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>付加保険料は月400円、付加年金額は原則200円×納付月数なので、受給開始後おおむね2年で納めた付加保険料相当額に達する計算構造です。物価スライドの対象ではない点なども試験論点になります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>自営業者が老齢基礎年金を少し増やしたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>付加年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>自営業者が老齢基礎年金を少し増やしたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>付加年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">付加年金額は原則『200円×付加保険料納付月数』。10年=120月なら年2万4,000円の上乗せ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>10年=120月なら保険料総額4万8,000円、付加年金は年2万4,000円。単純計算では2年受給で4万8,000円です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>付加年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 10年=120月なら保険料総額4万8,000円、付加年金は年2万4,000円。単純計算では2年受給で4万8,000円です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>付加保険料は月400円、付加年金額は原則200円×納付月数なので、受給開始後おおむね2年で納めた付加保険料相当額に達する計算構造です。物価スライドの対象ではない点なども試験論点になります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>付加年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</dd>\n<dt>③ なぜ？</dt><dd>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</dd><dt>④ イメージ</dt><dd>自営業者が老齢基礎年金を少し増やしたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>付加年金額は原則『200円×付加保険料納付月数』。10年=120月なら年2万4,000円の上乗せ。</dd><dt>⑥ 注意</dt><dd>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>付加年金＝国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "老齢厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>老齢厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>老齢厚生年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</p>\n<p>「先輩、ここで一回止めます。<strong>老齢厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>老齢厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>老齢厚生年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>老齢厚生年金の中心は報酬比例部分です。厚生年金に加入していた期間と標準報酬等が年金額へ反映されるので、『会社員だった年数だけ』で金額が決まるわけではありません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>長年会社員として働いた人が65歳になる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>老齢厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>長年会社員として働いた人が65歳になる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>老齢厚生年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>同じ30年勤務でも標準報酬が異なる二人なら、報酬比例部分は同額とは限りません。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>老齢厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 同じ30年勤務でも標準報酬が異なる二人なら、報酬比例部分は同額とは限りません。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>老齢厚生年金の中心は報酬比例部分です。厚生年金に加入していた期間と標準報酬等が年金額へ反映されるので、『会社員だった年数だけ』で金額が決まるわけではありません。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>老齢厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</dd><dt>④ イメージ</dt><dd>長年会社員として働いた人が65歳になる場面。</dd>\n<dt>⑤ 具体例</dt><dd>同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。</dd><dt>⑥ 注意</dt><dd>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>老齢厚生年金＝厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "経過的加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>経過的加算</strong>です。」</p>\n<p>「一言でいうと――<strong>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>経過的加算</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</p>\n<p>「先輩、ここで一回止めます。<strong>経過的加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>経過的加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>経過的加算</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>経過的加算は、特別支給の老齢厚生年金の定額部分と老齢基礎年金との接続で生じる差を調整するものと捉えると位置づけが分かります。家族関係による加算ではありません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>経過的加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>経過的加算</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">試験では計算式丸暗記より『何の差を調整する加算か』をまず区別。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>問題文に配偶者が出てこなくても経過的加算は成立し得ます。逆に加給年金は配偶者等の要件が中心です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>経過的加算</strong>を一言で説明してください。<details><summary>答え</summary>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 問題文に配偶者が出てこなくても経過的加算は成立し得ます。逆に加給年金は配偶者等の要件が中心です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>経過的加算は、特別支給の老齢厚生年金の定額部分と老齢基礎年金との接続で生じる差を調整するものと捉えると位置づけが分かります。家族関係による加算ではありません。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>経過的加算</dd><dt>② 一番重要なのは？</dt><dd>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</dd>\n<dt>③ なぜ？</dt><dd>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</dd><dt>④ イメージ</dt><dd>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</dd>\n<dt>⑤ 具体例</dt><dd>試験では計算式丸暗記より『何の差を調整する加算か』をまず区別。</dd><dt>⑥ 注意</dt><dd>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>経過的加算＝老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "配偶者加給年金と振替加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>配偶者加給年金と振替加算</strong>です。」</p>\n<p>「一言でいうと――<strong>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>配偶者加給年金と振替加算</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</p>\n<p>「先輩、ここで一回止めます。<strong>配偶者加給年金と振替加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>配偶者加給年金と振替加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>配偶者加給年金と振替加算</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>加給年金は『厚生年金版の家族手当』のようにイメージすると入口は分かりやすいですが、年齢・加入期間など要件があります。配偶者が65歳になると加給年金が終了し、一定の世代・要件では配偶者自身の基礎年金へ振替加算が付く流れです。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>配偶者加給年金と振替加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>配偶者加給年金と振替加算</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>夫66歳・妻62歳なら夫側の加給を検討。妻65歳到達後は夫側に付いたままと考えず、振替加算の対象かを妻側で確認します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>配偶者加給年金と振替加算</strong>を一言で説明してください。<details><summary>答え</summary>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『誰の年金に付いているか』を追うのが最重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 夫66歳・妻62歳なら夫側の加給を検討。妻65歳到達後は夫側に付いたままと考えず、振替加算の対象かを妻側で確認します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>加給年金は『厚生年金版の家族手当』のようにイメージすると入口は分かりやすいですが、年齢・加入期間など要件があります。配偶者が65歳になると加給年金が終了し、一定の世代・要件では配偶者自身の基礎年金へ振替加算が付く流れです。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>配偶者加給年金と振替加算</dd><dt>② 一番重要なのは？</dt><dd>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</dd>\n<dt>③ なぜ？</dt><dd>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</dd><dt>④ イメージ</dt><dd>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</dd>\n<dt>⑤ 具体例</dt><dd>夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。</dd><dt>⑥ 注意</dt><dd>『誰の年金に付いているか』を追うのが最重要です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>配偶者加給年金と振替加算＝加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "在職老齢年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>在職老齢年金</strong>です。」</p>\n<p>「一言でいうと――<strong>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>在職老齢年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</p>\n<p>「先輩、ここで一回止めます。<strong>在職老齢年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>在職老齢年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>在職老齢年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>調整対象は老齢厚生年金です。賃金と年金の合計が基準を超えると超過部分に応じて支給停止が生じます。基準額は改正されるので固定暗記ではなく受験年度確認が必須です。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>65歳以降も会社員として高い賃金で働く場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>在職老齢年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳以降も会社員として高い賃金で働く場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>在職老齢年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『賃金相当額＋老齢厚生年金の基本月額』を受験年度の支給停止調整額と比較して停止額を判断する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>働いて月給が高いからといって老齢基礎年金まで同じ式で半分停止する、という理解は誤りです。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>在職老齢年金</strong>を一言で説明してください。<details><summary>答え</summary>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 働いて月給が高いからといって老齢基礎年金まで同じ式で半分停止する、という理解は誤りです。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>調整対象は老齢厚生年金です。賃金と年金の合計が基準を超えると超過部分に応じて支給停止が生じます。基準額は改正されるので固定暗記ではなく受験年度確認が必須です。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>在職老齢年金</dd><dt>② 一番重要なのは？</dt><dd>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</dd><dt>④ イメージ</dt><dd>65歳以降も会社員として高い賃金で働く場面。</dd>\n<dt>⑤ 具体例</dt><dd>『賃金相当額＋老齢厚生年金の基本月額』を受験年度の支給停止調整額と比較して停止額を判断する。</dd><dt>⑥ 注意</dt><dd>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>在職老齢年金＝働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "障害基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>障害基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>障害基礎年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</p>\n<p>「先輩、ここで一回止めます。<strong>障害基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>障害基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>障害基礎年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>障害年金は『現在重い障害がある』だけでは足りず、初診日要件・障害認定・保険料納付要件を確認します。20歳前傷病には納付要件の扱いが異なるなど例外もあります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>障害基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>障害基礎年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">初診日→保険料納付要件→障害認定日の等級、の順にチェック。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>障害基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 病気が悪化した日ではなく、原則としてその傷病で初めて医師等の診療を受けた初診日がどこにあるかが制度判定の出発点です。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>障害年金は『現在重い障害がある』だけでは足りず、初診日要件・障害認定・保険料納付要件を確認します。20歳前傷病には納付要件の扱いが異なるなど例外もあります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>障害基礎年金</dd><dt>② 一番重要なのは？</dt><dd>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</dd><dt>④ イメージ</dt><dd>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</dd>\n<dt>⑤ 具体例</dt><dd>初診日→保険料納付要件→障害認定日の等級、の順にチェック。</dd><dt>⑥ 注意</dt><dd>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>障害基礎年金＝一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "障害厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>障害厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>障害厚生年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</p>\n<p>「先輩、ここで一回止めます。<strong>障害厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>障害厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>障害厚生年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>初診日に厚生年金加入中なら厚生年金側の障害給付を検討します。障害基礎年金が1・2級なのに対し、障害厚生年金には3級もあるなど給付構造が異なります。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>障害厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>障害厚生年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>初診時は会社員、その後退職してから障害が重くなった場合でも、現在の職業ではなく初診日の加入制度が重要になります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>障害厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 初診時は会社員、その後退職してから障害が重くなった場合でも、現在の職業ではなく初診日の加入制度が重要になります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>初診日に厚生年金加入中なら厚生年金側の障害給付を検討します。障害基礎年金が1・2級なのに対し、障害厚生年金には3級もあるなど給付構造が異なります。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>障害厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</dd><dt>④ イメージ</dt><dd>会社員時代に初診日のある病気で障害状態になった場面。</dd>\n<dt>⑤ 具体例</dt><dd>現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</dd><dt>⑥ 注意</dt><dd>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>障害厚生年金＝厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>遺族基礎年金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</p>\n<p>「先輩、ここで一回止めます。<strong>遺族基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>遺族基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>遺族基礎年金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>遺族基礎年金では『子のある配偶者』または『子』という子要件が核です。ここでいう子には年齢等の要件があります。配偶者だけが残ったから自動的に支給、とは考えません。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>遺族基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>遺族基礎年金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。妻45歳・子なしなら遺族基礎年金では別の判断になります。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>遺族基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 夫死亡時、妻45歳・子10歳なら子要件を満たす可能性があります。妻45歳・子なしなら遺族基礎年金では別の判断になります。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>遺族基礎年金では『子のある配偶者』または『子』という子要件が核です。ここでいう子には年齢等の要件があります。配偶者だけが残ったから自動的に支給、とは考えません。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>遺族基礎年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</dd>\n<dt>③ なぜ？</dt><dd>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</dd><dt>④ イメージ</dt><dd>小学生の子がいる家庭で父または母が死亡する場面。</dd>\n<dt>⑤ 具体例</dt><dd>死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</dd><dt>⑥ 注意</dt><dd>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>遺族基礎年金＝国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "寡婦年金と死亡一時金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>寡婦年金と死亡一時金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>寡婦年金と死亡一時金</strong>でのお金・権利の方向を確認します。受け取る、払う、積み立てる、借りる、控除する――この動きまで言えれば、かなり強いです。」</p>\n<p>「Aでは<strong>①目的 → ②対象 → ③お金や権利の動き</strong>の3点を骨組みにしてください。」</p></div>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</p>\n<p>「先輩、ここで一回止めます。<strong>寡婦年金と死亡一時金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>寡婦年金と死亡一時金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p><div class=\"deep\"><h3>仕組みを分解して理解</h3>\n<p>「ここはもう少し掘ります。試験で強い人は答えだけじゃなく、<strong>その答えになる理由</strong>を持っています。」</p>\n<p>「問題文から、年齢・職業・加入制度・期間・収入や賃金・家族関係・金額を拾います。この時点ではまだ答えを決めません。」</p>\n<p>「次に、その事実を<strong>寡婦年金と死亡一時金</strong>固有の条件と照らします。条件を一つずつ通して、最後まで残った制度や計算方法を答えにするんです。」</p>\n<div class=\"flow\"><span>事実を拾う</span><b>→</b><span>目的</span><b>→</b><span>対象者</span><b>→</b><span>要件・期間</span><b>→</b><span>金額・効果</span></div>\n<p>「危ないのは『この単語知ってる』だけで即答すること。試験は似た制度や数字を混ぜてきます。」</p>\n<p>「比較するときは<strong>誰が対象か・何のためか・いつ使うか・何が増減するか</strong>の4軸です。共通点より“違う軸”を先に探してください。」</p>\n<p>「ここまで説明できれば、丸暗記ではなく初見の事例問題にも使える理解です。」</p></div><div class=\"topicdeep\"><h3>この用語だけの深掘り</h3><p>寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。死亡一時金は保険料納付済期間等に応じた一時金。両方を同時にもらう前提ではなく選択関係も確認します。</p>\n<p>「先輩、ここはそのまま覚えるより、<strong>なぜこの違いが生まれるのか</strong>を説明できるようにしてください。そこまで行けば、選択肢の言い換えにも対応できます。」</p></div>", "C": "<p>「今度は文字から離れます。<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>寡婦年金と死亡一時金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p><div class=\"deep\"><h3>頭の中で場面を動かす</h3>\n<p>「静止画じゃなく時間の流れで見ます。就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて<strong>寡婦年金と死亡一時金</strong>が必要になります。」</p>\n<p>「そして制度を使った後、何が変わるかまで想像してください。手元資金、将来負担、給付、税負担など、<strong>利用前 → 制度 → 利用後</strong>で映像にします。」</p>\n<p>「この前後関係が見えると、名称を忘れても仕組みから戻れます。先輩が目指すのはこっちです。」</p></div>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを最後にもう一度確認しておきましょう。」</p><div class=\"deep\"><h3>問題を解くときの手順</h3>\n<p>「まず数字をいったん隠してください。誰が、いつ、何をしたいのか。それだけで制度を選べるか確認します。」</p>\n<p>「制度を選べたら数字を戻す。そこで初めて金額・期間・割合・年齢を使います。<strong>制度選択と計算を二段階に分ける</strong>んです。」</p>\n<p>「さらに条件を一つ変えてみましょう。年齢が違ったら？ 会社員ではなく自営業なら？ 一括資金ではなく毎年積立なら？ こうすると似た制度との境界が見えます。」</p>\n<p>「正解を一回出すだけじゃなく、<strong>どの条件が変われば答えが変わるか</strong>まで考えられれば、本番でかなり強いですよ。」</p></div><div class=\"topicdeep\"><h3>もう一つ具体例</h3><p>夫死亡時の妻が55歳なら、寡婦年金はすぐ支給開始ではなく60歳からの期間を意識します。</p>\n<p>「じゃあ逆に、どの条件を変えたら答えが変わるでしょう？　そこを自分で一つ作ってみてください。これができると暗記から理解へ変わります。」</p></div>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>寡婦年金と死亡一時金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p><div class=\"deep\"><h3>追加の理解チェック</h3><ol start=\"4\">\n<li>この制度・用語が必要になる<strong>直前の出来事</strong>を説明できますか？</li>\n<li>似た制度と答えを分ける<strong>決定的な条件</strong>は何ですか？</li>\n<li>問題文の条件を一つ変えるなら、何を変えると別の答えになりますか？</li></ol>\n<p>「詰まったところが今の弱点です。そこだけA〜Dへ戻ればいいんです。」</p></div><div class=\"topicdeep\"><h3>先輩専用・仕上げ問題</h3>\n<p><strong>Q.</strong> 夫死亡時の妻が55歳なら、寡婦年金はすぐ支給開始ではなく60歳からの期間を意識します。 この例で、答えを決める条件を一つ挙げてください。</p>\n<details><summary>考え方を見る</summary><p>寡婦年金は一定の妻が60～65歳の間に受ける年金で、夫の第1号被保険者期間等の要件があります。死亡一時金は保険料納付済期間等に応じた一時金。両方を同時にもらう前提ではなく選択関係も確認します。</p></details></div>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>寡婦年金と死亡一時金</dd><dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</dd>\n<dt>③ なぜ？</dt><dd>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</dd><dt>④ イメージ</dt><dd>自営業だった夫が老齢基礎年金受給前に死亡した場面。</dd>\n<dt>⑤ 具体例</dt><dd>婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</dd><dt>⑥ 注意</dt><dd>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</dd></dl><div class=\"deep\"><h3>10秒でさらに圧縮</h3>\n<p>「最後は<strong>誰が・何のために・どうなる</strong>の3点だけで言ってみてください。この3点が口から出れば、細かい知識をぶら下げる土台はできています。」</p></div>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>寡婦年金と死亡一時金＝国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p><div class=\"deep\"><h3>ここでもう一段だけ整理</h3>\n<p>「先輩、この用語を見た瞬間に説明文を丸ごと思い出す必要はありません。まず<strong>何の分野の、何を解決する話か</strong>を取り出してください。」</p>\n<p>「次に問題文の主語です。会社員、自営業者、配偶者、遺族など、誰の話なのか。FPでは主語が変わると使う制度が変わります。」</p>\n<p>「最後に<strong>遺族厚生年金</strong>でのお金・権利
