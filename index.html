条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、公的介護保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>公的介護保険は「」 結論 一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。」。仕組みは「仕組みを最初から説明 介護費用を本人・家族だけで抱えず社会全体で支えるため、保険料を集め、認定された人のサービス費用を給付します。 公的介護保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的介護保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的介護保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」。代表例では「具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 第1号被保険者と第2号被保険者では、年齢だけでなく給付対象となる原因の条件が違います。」を思い出します。</p>", "M": "<p><strong>公的介護保険＝」 結論 一言でいうと―― 介護が必要になった人が、要介護・要支援認定を受けて介護サービスを利用するための社会保険です。</strong></p>"}}, {"title": "労災保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>労災保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</p><p>仕組みを最初から説明 仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 通勤途中の合理的な経路で事故に遭う場面。 その情報を並べると、 労災保険 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。労災保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④労災保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>労災保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 通勤途中の合理的な経路で事故に遭う場面。 その情報を並べると、 労災保険 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ労災保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして労災保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が労災保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を労災保険の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「労災保険について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>労災保険で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。<br><br><b>解説：</b>仕組みを最初から説明 仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 労災保険のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に労災保険と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、労災保険の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>労災保険は「」 結論 一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。」。仕組みは「仕組みを最初から説明 仕事のために生じた災害を労働者個人だけの負担にしないため、治療や休業、障害、遺族などの給付を行います。 労災保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 労災保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで労災保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 自宅→会社の通常経路で事故なら通勤災害を検討。」。代表例では「具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。」を思い出します。</p>", "M": "<p><strong>労災保険＝」 結論 一言でいうと―― 業務上または通勤による労働者の負傷・疾病・障害・死亡などを補償する制度です。</strong></p>"}}, {"title": "雇用保険", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>雇用保険</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</p><p>仕組みを最初から説明 仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『雇用保険＝失業手当だけ』ではありません。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 仕事を失ったときの基本手当だけでなく、再就職、教育訓練、育児・介護休業など、雇用を続けたり戻ったりするための給付があります。 雇用保険 が必要になる前に、何が起きているか分かります？ 現実の問題 → 雇用保険 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 雇用保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 雇用保険 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。雇用保険もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④雇用保険のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『雇用保険＝失業手当だけ』ではありません。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>雇用保険</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 雇用保険 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 雇用保険 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ雇用保険による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして雇用保険の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『雇用保険＝失業手当だけ』ではありません。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が雇用保険の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『雇用保険＝失業手当だけ』ではありません。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰 件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで雇用保険の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『雇用保険＝失業手当だけ』ではありません。」。代表例では「具体例1｜基本ケース 離職理由・被保険者期間・求職活動などの条件を確認して基本手当の受給可否を判断。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>雇用保険＝」 結論 一言でいうと―― 失業や休業などに備え、生活・雇用の安定と再就職を支援する制度です。</strong></p>"}}, {"title": "就職促進給付と教育訓練給付", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>就職促進給付と教育訓練給付</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は 就職促進給付と教育訓練給付 です。</p><p>仕組みを最初から説明 就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 就職促進給付と教育訓練給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 就職促進給付と教育訓練給付 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。就職促進給付と教育訓練給付もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④就職促進給付と教育訓練給付のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>就職促進給付と教育訓練給付</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 就職促進給付と教育訓練給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 就職促進給付と教育訓練給付 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ就職促進給付と教育訓練給付による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして就職促進給付と教育訓練給付の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が就職促進給付と教育訓練給付の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は 就職促進給付と教育訓練給付 です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を就職促進給付と教育訓練給付の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「就職促進給付と教育訓練給付について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>就職促進給付と教育訓練給付で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は 就職促進給付と教育訓練給付 です。<br><br><b>解説：</b>仕組みを最初から説明 就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 就職促進給付と教育訓練給付のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に就職促進給付と教育訓練給付と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、就職促進給付と教育訓練給付の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>就職促進給付と教育訓練給付は「」 結論 今日は 就職促進給付と教育訓練給付 です。」。仕組みは「仕組みを最初から説明 就職促進給付と教育訓練給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 就職促進給付と教育訓練給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで就職促進給付と教育訓練給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 再就職手当などは就職の話、教育訓練給付は講座受講の話です。」。代表例では「具体例1｜基本ケース 問題文で『就職した』なら就職促進給付、『厚労大臣指定講座を受講』なら教育訓練給付をまず連想。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>就職促進給付と教育訓練給付＝」 結論 今日は 就職促進給付と教育訓練給付 です。</strong></p>"}}, {"title": "育児休業給付と雇用継続給付", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>育児休業給付と雇用継続給付</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は 育児休業給付と雇用継続給付 です。</p><p>仕組みを最初から説明 育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 育児休業給付と雇用継続給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 育児休業給付と雇用継続給付 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。育児休業給付と雇用継続給付もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④育児休業給付と雇用継続給付のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>育児休業給付と雇用継続給付</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 育児休業給付と雇用継続給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 育児休業給付と雇用継続給付 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ育児休業給付と雇用継続給付による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして育児休業給付と雇用継続給付の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が育児休業給付と雇用継続給付の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は 育児休業給付と雇用継続給付 です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を育児休業給付と雇用継続給付の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「育児休業給付と雇用継続給付について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>育児休業給付と雇用継続給付で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は 育児休業給付と雇用継続給付 です。<br><br><b>解説：</b>仕組みを最初から説明 育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 育児休業給付と雇用継続給付のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に育児休業給付と雇用継続給付と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、育児休業給付と雇用継続給付の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>育児休業給付と雇用継続給付は「」 結論 今日は 育児休業給付と雇用継続給付 です。」。仕組みは「仕組みを最初から説明 育児休業給付と雇用継続給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 育児休業給付と雇用継続給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで育児休業給付と雇用継続給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 給付名が似ていても、育児・高年齢など『何が原因で賃金が減るか』を分けます。」。代表例では「具体例1｜基本ケース 休業開始前賃金と休業中賃金、休業期間などを確認し、受験年度の支給率・上限を適用する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>育児休業給付と雇用継続給付＝」 結論 今日は 育児休業給付と雇用継続給付 です。</strong></p>"}}, {"title": "高年齢雇用継続給付と介護休業給付", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>高年齢雇用継続給付と介護休業給付</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は 高年齢雇用継続給付と介護休業給付 です。</p><p>仕組みを最初から説明 60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 高年齢雇用継続給付と介護休業給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 高年齢雇用継続給付と介護休業給付 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。高年齢雇用継続給付と介護休業給付もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④高年齢雇用継続給付と介護休業給付のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>高年齢雇用継続給付と介護休業給付</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 高年齢雇用継続給付と介護休業給付 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 高年齢雇用継続給付と介護休業給付 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ高年齢雇用継続給付と介護休業給付による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして高年齢雇用継続給付と介護休業給付の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が高年齢雇用継続給付と介護休業給付の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 今日は 高年齢雇用継続給付と介護休業給付 です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を高年齢雇用継続給付と介護休業給付の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「高年齢雇用継続給付と介護休業給付について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>高年齢雇用継続給付と介護休業給付で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 今日は 高年齢雇用継続給付と介護休業給付 です。<br><br><b>解説：</b>仕組みを最初から説明 60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。 高年齢雇用継続給付と介護休業給付 が必要になる前に、何が起きているか分かります？ 現実の問題 → 高年齢雇用継続給付と介護休業給付 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 高年齢雇用継続給付と介護休業給付のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで高年齢雇用継続給付と介護休業給付の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 もう一つ具体例 『60歳になり賃金が低下』なら高年齢側、『母の介護で2か月休業』なら介護休業側。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 そこで初めて金額・期間・割合・年齢を使 にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④公的年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>公的年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 会社員が65歳になり老齢年金を受ける場面。 その情報を並べると、 公的年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ公的年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして公的年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が公的年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 国 うと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意加入被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を任意加入被保険者の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意加入被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「任意加入被保険者について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>任意加入被保険者で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。<br><br><b>解説：</b>仕組みを最初から説明 60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。 任意加入被保険者 が必要になる前に、何が起きているか分かります？ 現実の問題 → 任意加入被保険者 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 任意加入被保険者のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで任意加入被保険者の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるか 件で、どの程度の金銭や権利を動かすのかを決めています。国民年金保険料の免除・猶予制度もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④国民年金保険料の免除・猶予制度のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで国民年金保険料の免除・猶予制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>国民年金保険料の免除・猶予制度</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 国民年金保険料の免除・猶予制度 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 国民年金保険料の免除・猶予制度 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ国民年金保険料の免除・猶予制度による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして国民年金保険料の免除・猶予制度の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで国民年金保険料の免除・猶予制度の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 受給資格期間への算入や年金額への反映、追納の扱いが異なります。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が国民年金保険料の免除・猶予制度の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を 題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。老齢基礎年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④老齢基礎年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>老齢基礎年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 65歳になった人が老齢基礎年金を請求する場面。 その情報を並べると、 老齢基礎年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ老齢基礎年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして老齢基礎年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が老齢基礎年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を老齢基礎年金の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「老齢基礎年金について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>老齢基礎年金で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。<br><br><b>解説：</b>仕組みを最初から説明 老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 老齢基礎年金のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に老齢基礎年金と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、老齢基礎年金の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>老齢基礎年金は「」 結論 一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。」。仕組みは「仕組みを最初から説明 老齢基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 老齢基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。」。代表例では「具体例1｜基本ケース 40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>老齢基礎年金＝」 結論 一言でいうと―― 国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong></p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>繰上げ支給と繰下げ支給</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 今日は 繰上げ支給と繰下げ支給 です。</p><p>仕組みを最初から説明 繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ支給と繰下げ支給の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 繰上げ支給と繰下げ支給 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 繰上げ支給と繰下げ支給 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。繰上げ支給と繰下げ支給もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④繰上げ支給と繰下げ支給のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ支給と繰下げ支給の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>繰上げ支給と繰下げ支給</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 繰上げ支給と繰下げ支給 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 繰上げ支給と繰下げ支給 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ繰上げ支給と繰下げ支給による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして繰上げ支給と繰下げ支給の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ支給と繰下げ支給の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が繰上げ支給と繰下げ支給の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合に ます。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に繰上げ支給と繰下げ支給と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、繰上げ支給と繰下げ支給の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>繰上げ支給と繰下げ支給は「」 結論 今日は 繰上げ支給と繰下げ支給 です。」。仕組みは「仕組みを最初から説明 繰上げ支給と繰下げ支給 が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ支給と繰下げ支給 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで繰上げ支給と繰下げ支給の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。」。代表例では「具体例1｜基本ケース 受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>繰上げ支給と繰下げ支給＝」 結論 今日は 繰上げ支給と繰下げ支給 です。</strong></p>"}}, {"title": "付加年金", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>付加年金</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</p><p>仕組みを最初から説明 基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 自営業者が老齢基礎年金を少し増やしたい場面。 その情報を並べると、 付加年金 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。付加年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④付加年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>付加年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 自営業者が老齢基礎年金を少し増やしたい場面。 その情報を並べると、 付加年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ付加年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして付加年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 付加年金額は原則『200円×付加保険料納付月数』。 10年=120月なら年2万4,000円の上乗せ。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が付加年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を付加年金の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「付加年金について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>付加年金で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。<br><br><b>解説：</b>仕組みを最初から説明 基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。 付加年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 付加年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 付加年金のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで付加年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 付加年金額は原則『200円×付加保険料納付月数』。 10年=120月なら年2 切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④老齢厚生年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>老齢厚生年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 長年会社員として働いた人が65歳になる場面。 その情報を並べると、 老齢厚生年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ老齢厚生年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして老齢厚生年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで老齢厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が老齢厚生年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例か うと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで経過的加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を経過的加算の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで経過的加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「経過的加算について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>経過的加算で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。<br><br><b>解説：</b>仕組みを最初から説明 制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。 経過的加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 経過的加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 経過的加算のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで経過的加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</ 果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④配偶者加給年金と振替加算のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで配偶者加給年金と振替加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『誰の年金に付いているか』を追うのが最重要です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>配偶者加給年金と振替加算</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 年上の夫が老齢厚生年金を受け、年下の妻がいる場面。 その情報を並べると、 配偶者加給年金と振替加算 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ配偶者加給年金と振替加算による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして配偶者加給年金と振替加算の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで配偶者加給年金と振替加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『誰の年金に付いているか』を追うのが最重要です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が配偶者加給年金と振替加算の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりま ><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に配偶者加給年金と振替加算と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、配偶者加給年金と振替加算の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>配偶者加給年金と振替加算は「」 結論 今日は 配偶者加給年金と振替加算 です。」。仕組みは「仕組みを最初から説明 厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。 配偶者加給年金と振替加算 が必要になる前に、何が起きているか分かります？ 現実の問題 → 配偶者加給年金と振替加算 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで配偶者加給年金と振替加算の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 『誰の年金に付いているか』を追うのが最重要です。」。代表例では「具体例1｜基本ケース 夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>配偶者加給年金と振替加算＝」 結論 今日は 配偶者加給年金と振替加算 です。</strong></p>"}}, {"title": "在職老齢年金", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>在職老齢年金</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</p><p>仕組みを最初から説明 高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。 在職老齢年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 在職老齢年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで在職老齢年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 老齢基礎年金はこの支給停止調整の対象ではありません。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。 在職老齢年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 在職老齢年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 在職老齢年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 在職老齢年金 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。在職老齢年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④在職老齢年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで在職老齢年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 老齢基礎年金はこの支給停止調整の対象ではありません。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>在職老齢年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 在職老齢年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 在職老齢年金 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ在職老齢年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして在職老齢年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで在職老齢年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 老齢基礎年金はこの支給停止調整の対象ではありません。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 『賃金相当額＋老齢厚生年金の基本月額』を受験年度の支給停止調整額と比較して停止額を判断する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が在職老齢年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期 ・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。障害基礎年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④障害基礎年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>障害基礎年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。 その情報を並べると、 障害基礎年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ障害基礎年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして障害基礎年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 初診日→保険料納付要件→障害認定日の等級、の順にチェック。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が障害基礎年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動 したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に障害基礎年金と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、障害基礎年金の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>障害基礎年金は「」 結論 一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。」。仕組みは「仕組みを最初から説明 障害基礎年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害基礎年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 次に、その事実を 障害基礎年金 固有の条件と照らします。」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。」。代表例では「具体例1｜基本ケース 初診日→保険料納付要件→障害認定日の等級、の順にチェック。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>障害基礎年金＝」 結論 一言でいうと―― 一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong></p>"}}, {"title": "障害厚生年金", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>障害厚生年金</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</p><p>仕組みを最初から説明 会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。 障害厚生年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 障害厚生年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 その情報を並べると、 障害厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 障害厚生年金 が必要になります。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。障害厚生年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④障害厚生年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>障害厚生年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 障害厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 障害厚生年金 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ障害厚生年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして障害厚生年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで障害厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース 現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が障害厚生年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これも ルが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。遺族基礎年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④遺族基礎年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで遺族基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>遺族基礎年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 遺族基礎年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族基礎年金 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ遺族基礎年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして遺族基礎年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで遺族基礎年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が遺族基礎年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時 ・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで遺族厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>遺族厚生年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 その情報を並べると、 遺族厚生年金 が候補に上がってくる。 就職、退職、病気、老後、住宅購入、教育費などの出来事が起きて、そこで初めて 遺族厚生年金 が必要になります。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ遺族厚生年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして遺族厚生年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで遺族厚生年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が遺族厚生年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 厚生年金の被保険者・受給権者等が死亡し一 ことは、」 結論 一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金等控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 社会保険料控除は支払った保険料の所得控除。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を公的年金等控除の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金等控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 社会保険料控除は支払った保険料の所得控除。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「公的年金等控除について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>公的年金等控除で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。<br><br><b>解説：</b>仕組みを最初から説明 年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 公的年金等控除のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金等控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 社会保険料控除は支払った保険料の所得控除。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース 公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b>問題：</b>問題文に公的年金等控除と関係するキーワードがあれば、その制度を選んでよい。○か×か。</p>\n<div class=\"answer\"><b>答え：×。</b><br><br><b>理由：</b>FP問題では一条件だけを入れ替えた選択肢が使われます。誰・目的・時期・金額・契約関係を確認し、公的年金等控除の要件全体に一致して初めて選びます。</div>", "R": "<p><b>30秒復習：</b>公的年金等控除は「」 結論 一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。」。仕組みは「仕組みを最初から説明 年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。 公的年金等控除 が必要になる前に、何が起きているか分かります？ 現実の問題 → 公的年金等控除 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？」。比較では「この仕組みでは、最初に現実の目的や出来事があります。 そのあとで公的年金等控除の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 だから、 社会保険料控除は支払った保険料の所得控除。」。代表例では「具体例1｜基本ケース 公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。 この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。」を思い出します。</p>", "M": "<p><strong>公的年金等控除＝」 結論 一言でいうと―― 公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</strong></p>"}}, {"title": "確定拠出年金", "content": {"A": "<h3>まず、このテーマを一本の話にします</h3>\n<p>「先輩、<strong>確定拠出年金</strong>は細切れに覚えません。最初に『何のための話なのか』から最後までつなげます。」</p>\n<p>」 結論 一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</p><p>仕組みを最初から説明 確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</p>\n<p>ここで大事なのは、用語の定義だけを覚えて終わらないことです。FPの問題では、現実の出来事が先に示され、その出来事にどの制度・計算・保障・税務上の扱いを当てはめるかを判断します。したがって<strong>目的 → 条件 → 仕組み → 結果</strong>まで一続きで理解します。</p>\n<p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>この項目を読み終えた時点で、「何の話か」「なぜ必要か」「どう動くか」「似たものと何が違うか」を自分で補わなくても本文から確認できるようにします。</p>", "B": "<h3>なぜ必要なのかから仕組みまで</h3>\n<p>仕組みを最初から説明 確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</p>\n<p>では、なぜこの仕組みが必要なのでしょう。イメージ1｜現実の場面 iDeCoで毎月2万円を投資信託等へ積み立てる場面。 その情報を並べると、 確定拠出年金 が候補に上がってくる。</p>\n<p>現実では、将来のお金、病気や死亡、事故、退職、住宅、教育、借入れ、保険契約などについて「今の状態のままでは処理できない問題」が発生します。そこで法律・制度・契約・計算ルールが、誰を対象にし、どの条件で、どの程度の金銭や権利を動かすのかを決めています。確定拠出年金もその流れの中にあります。</p>\n<h3>因果関係を切らずに見る</h3>\n<p><strong>①原因・目的が生じる → ②対象者や契約関係を確認する → ③時期・期間を確認する → ④確定拠出年金のルールを適用する → ⑤給付・保障・返済・積立・税・将来額などの結果が決まる</strong>、という順です。</p>\n<p>この順番が重要なのは、試験では⑤だけを聞くように見えても、答えを決めているのは①〜④だからです。たとえば金額が同じでも対象者が違えば制度が変わることがありますし、同じ人でも時期が違えば受けられる給付や契約上の扱いが変わることがあります。逆に、係数計算のように人物属性が結果へ影響しないテーマもあります。</p>\n<h3>似たものとの違い</h3><p>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。</p>\n<p>似た制度を区別するときは名前の似方ではなく、<strong>目的・対象・時間・お金の方向</strong>を比べます。この4点のうちどこが違うのかまで分かれば、選択肢の一語だけを入れ替えた問題にも対応できます。</p>", "C": "<h3>一つの場面を最初から最後まで追う</h3>\n<p>「ここでは場面を何個も増やしません。<strong>確定拠出年金</strong>が現実でどう見えるのか、一つの流れを最後まで追います。」</p>\n<p>イメージ1｜現実の場面 iDeCoで毎月2万円を投資信託等へ積み立てる場面。 その情報を並べると、 確定拠出年金 が候補に上がってくる。</p>\n<p>まず制度を使う前の状態があります。この時点では、まだ確定拠出年金による結果は出ていません。そこへ、このテーマが扱う資金需要・事故・病気・死亡・退職・契約変更・将来資金の準備などの出来事が発生します。</p>\n<p>次に「誰の話か」を固定します。公的制度なら被保険者や受給者、保険なら契約者・被保険者・受取人、ローンなら借入人と金融機関、計算問題なら現在の金額と将来の金額です。人物関係が結果に影響するテーマでは、ここを取り違えるだけで結論が変わります。</p>\n<p>その次に時間を置きます。加入前なのか加入中なのか、事故発生時なのか、満期・解約時なのか、現在から将来を求めるのか将来から現在へ戻すのか。時間軸を置くことで、同じ数字が登場しても意味が違うことが見えてきます。</p>\n<p>そして確定拠出年金の条件を当てはめます。条件を満たせば制度上の効果が生じ、満たさなければ別制度を検討するか、そもそも給付・控除・保障などを受けられません。ここで初めてお金や権利が動きます。</p>\n<p>最後に利用後を見ます。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 この「前→出来事→条件判定→結果→似た制度との比較」までが一つの映像です。用語だけを暗記するより、この映像を持っているほうが事例問題から答えを戻しやすくなります。</p>", "D": "<h3>具体例1｜代表例を深く読む</h3>\n<p>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</p>\n<p>この例で最初に見るのは数字ではありません。まず「何を解決したいのか」を確定し、その次に対象者・契約関係を確認します。その条件が確定拠出年金の守備範囲に入っていることを確認してから、金額や期間を処理します。</p>\n<p>ここで数字だけを変えてみると、制度の本質が見えます。金額が2倍になっても目的・対象・時期が同じなら、通常は同じ制度や計算原理を使います。ただし上限額、割合、所得要件、保険価額など制度固有の境界がある場合には、そこで結果が変わります。つまり「数字が変わったから制度も変わる」のではなく、<strong>その数字が制度の要件に含まれているか</strong>が判断点です。</p>\n<p>次に期間を変えるとどうなるか。利率計算なら運用・割引期間が変わり、ローンなら返済期間、保険なら保障期間、公的年金なら加入・受給時期などが変わります。一方、時間が要件に含まれない論点では、期間を動かしても基本原理は変わりません。これもテーマごとに見分けます。</p>\n<p>この代表例から覚えるべきことは、」 結論 一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。 という核心と、この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という境界です。具体例はこの二つを現実の場面に落としたものだと考えてください。</p>\n<h3>具体例2｜試験で間違える形まで掘る</h3>\n<p>試験では、上の代表例をそのまま出すだけではなく、一条件だけを入れ替えます。対象者だけを変える、現在と将来を逆にする、契約者と受取人を入れ替える、期間を変更する、似た制度名へ差し替える、といった形です。</p>\n<p>そこで、問題文を<strong>①誰 → ②何が起きた／何をしたい → ③いつ → ④いくら → ⑤誰から誰へお金が動く</strong>の順に読みます。その事実を確定拠出年金の条件と照合します。</p>\n<p>典型的な誤答は、関連する単語を見つけた瞬間に制度名を決めることです。正解はキーワードではなく条件の組合せで決まります。この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。 という違いを説明できれば、この種のひっかけをかなり避けやすくなります。</p>\n<p>実務でも同じです。相談者は「確定拠出年金について相談したい」と正確な制度名を言うとは限りません。「将来のお金が足りない」「保険料を払えなくなった」「事故が起きた」「家族が亡くなった」と状況を話します。FPはその事実を整理し、どの制度・計算ルールに当たるかを判断します。だからこの具体例では、答えだけではなく<strong>答えに到達するまでの判断経路</strong>まで覚えることが重要です。</p>", "Q": "<h3>確認問題1｜核心</h3>\n<p><b>問題：</b>確定拠出年金で最も重要な考え方は何ですか。</p>\n<div class=\"answer\"><b>答え：</b>」 結論 一言でいうと―― 拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。<br><br><b>解説：</b>仕組みを最初から説明 確定拠出年金 が必要になる前に、何が起きているか分かります？ 現実の問題 → 確定拠出年金 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ だからこそ、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。 定義だけでなく、何のためにこの仕組みがあるのかまでセットで理解します。</div>\n<h3>確認問題2｜因果関係</h3>\n<p><b>問題：</b>このテーマを問題文で判断するとき、どの順番で見ますか。</p>\n<div class=\"answer\"><b>答え：</b>原因・目的 → 対象者・契約関係 → 時期・期間 → 確定拠出年金のルール → 金銭・権利などの結果、の順です。<br><br><b>なぜ：</b>最後の金額や給付だけを見ても、前提条件が違えば別の制度・別の答えになるからです。</div>\n<h3>確認問題3｜比較</h3>\n<p><b>問題：</b>似た制度と区別するポイントは何ですか。</p>\n<div class=\"answer\"><b>答え：</b>この仕組みでは、最初に現実の目的や出来事があります。 そのあとで確定拠出年金の条件に当てはめ、条件を満たす場合に計算・給付・保障・返済・税務などの結果が生じます。 そこで初めて金額・期間・割合・年齢を使います。<br><br><b>間違いやすい点：</b>名称や関連語が似ているだけで同じ仕組みだと判断しないことです。目的・対象・時間・お金の方向のどこが違うかを確認します。</div>\n<h3>確認問題4｜具体例</h3>\n<p><b>問題：</b>代表例から何を読み取るべきですか。</p>\n<div class=\"answer\"><b>答え：</b>具体例1｜基本ケース この例で大事なのは、答えそのものより なぜその制度・係数を選んだか です。 だから、 『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。<br><br><b>解説：</b>数字そのものを暗記するのではなく、その数字を使う前にどの条件を確認したか、数字を変えたとき何が変わるかまで理解するのがポイントです。</div>\n<h3>確認問題5｜ひっかけ</h3>\n<p><b
