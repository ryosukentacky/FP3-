が積み上がります。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。現価係数は逆に『5年後100万円必要→今いくら必要？』を求めます。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>終価係数を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「今あるお金を一定利率で複利運用したら、将来いくらになるかを求める係数です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「元本だけでなく過去についた利息にも次の利息がつくため、年数が長いほど複利効果が積み上がります。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「現価係数は逆に『5年後100万円必要→今いくら必要？』を求めます。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 今あるお金を一定利率で複利運用したら、将来いくらになるかを求める係数です。</p><p>②なぜ？ → 元本だけでなく過去についた利息にも次の利息がつくため、年数が長いほど複利効果が積み上がります。</p><p>③イメージ → 100万円を年3%で運用すると1年後103万円。2年目は100万円ではなく103万円に3%がつきます。</p><p>④具体例 → 5年後なら100万円×1.03^5≒115.9万円です。『今100万円ある→5年後いくら？』が典型です。</p><p>⑤違い → 現価係数は逆に『5年後100万円必要→今いくら必要？』を求めます。</p>", "M": "<p>「一文で覚えるなら――<strong>今あるお金を一定利率で複利運用したら、将来いくらになるかを求める係数です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "現価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>現価係数</strong>はまずこれです。<strong>将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。</strong>」</p><p>「はい。用語だけで終わらせません。将来額を現在へ割り戻すので、終価係数の逆方向です。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。終価係数=現在→将来、現価係数=将来→現在です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。将来額を現在へ割り戻すので、終価係数の逆方向です。」</p><p>「ここで『具体的には？』って思いますよね。5年後に100万円必要でも、年3%で運用できるなら今100万円全部を持つ必要はありません。」</p><p>「つまり、<strong>将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。終価係数=現在→将来、現価係数=将来→現在です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。5年後に100万円必要でも、年3%で運用できるなら今100万円全部を持つ必要はありません。」</p><p>「この場面を最初から追うと、将来額を現在へ割り戻すので、終価係数の逆方向です。 その結果、<strong>将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、現価係数の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。100万円÷1.03^5≒86.3万円。約86.3万円を今運用すれば5年後約100万円になる計算です。」</p><p>「なぜこの結果になるかというと、将来額を現在へ割り戻すので、終価係数の逆方向です。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。終価係数=現在→将来、現価係数=将来→現在です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>現価係数を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「将来額を現在へ割り戻すので、終価係数の逆方向です。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「終価係数=現在→将来、現価係数=将来→現在です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。</p><p>②なぜ？ → 将来額を現在へ割り戻すので、終価係数の逆方向です。</p><p>③イメージ → 5年後に100万円必要でも、年3%で運用できるなら今100万円全部を持つ必要はありません。</p><p>④具体例 → 100万円÷1.03^5≒86.3万円。約86.3万円を今運用すれば5年後約100万円になる計算です。</p><p>⑤違い → 終価係数=現在→将来、現価係数=将来→現在です。</p>", "M": "<p>「一文で覚えるなら――<strong>将来必要な金額を得るために、今いくら用意すればよいかを求める係数です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "年金終価係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>年金終価係数</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 年金終価係数 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 年金終価係数の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。年金終価係数は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 年金終価係数 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 年金終価係数の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。年金終価係数は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 年金終価係数 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、年金終価係数の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 年金終価係数の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>年金終価係数を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 年金終価係数 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 毎年一定額を積み立てたとき、将来の積立総額を求める係数です。 仕組みを最初から説明 1年目の積立金は長く運用され、最後の積立金は短く運用されます。 その複数の終価をまとめて計算するのが年金終価係数です。 年金終価係数 が必要になる前に、何が起きているか分かります？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><d 」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。単純に300万円÷10年とすると運用益を無視します。最初の積立金ほど長く運用されるので、その複利効果を含めて毎年額を求めます。」</p><p>「なぜこの結果になるかというと、将来額が先に決まっていて、複利運用を利用しながら必要な毎年積立額を逆算します。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>減債基金係数を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「将来額が先に決まっていて、複利運用を利用しながら必要な毎年積立額を逆算します。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</p><p>②なぜ？ → 将来額が先に決まっていて、複利運用を利用しながら必要な毎年積立額を逆算します。</p><p>③イメージ → 10年後に車購入資金300万円が必要だとします。今300万円あるのではなく、毎年いくら積めば10年後に300万円へ届くかを求めます。</p><p>④具体例 → 単純に300万円÷10年とすると運用益を無視します。最初の積立金ほど長く運用されるので、その複利効果を含めて毎年額を求めます。</p><p>⑤違い → 年金終価係数は毎年積立額→将来額。減債基金係数は将来目標額→毎年積立額です。</p>", "M": "<p>「一文で覚えるなら――<strong>将来の目標額を作るために、毎年いくら積み立てればよいかを求める係数です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "資本回収係数", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>資本回収係数</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 資本回収係数 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを求める係数です。 仕組みを最初から説明 元本を単純に年数で割るだけでなく、残っている資金が運用益を生む前提で毎年の受取額を計算します。 資本回収係数 が必要になる前に、何が起きているか分かります？ 現実の問題 → 資本回収係数 → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 資本回収係数の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 一言でいうと―― 今ある元本を運用しながら一定期間で取り崩すとき、毎年いくら受け取れるかを す。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。『返済額が一定』が元利均等、『返す元金が一定』が元金均等です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>元利均等返済と元金均等返済を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「元利均等は毎回の元金＋利息をほぼ一定にし、元金均等は毎回返す元金を一定にする返済方式です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「元金均等は最初から元金を速く減らすため、当初返済額は大きい一方、残高にかかる利息が早く減り総利息を抑えやすくなります。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「『返済額が一定』が元利均等、『返す元金が一定』が元金均等です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 元利均等は毎回の元金＋利息をほぼ一定にし、元金均等は毎回返す元金を一定にする返済方式です。</p><p>②なぜ？ → 元金均等は最初から元金を速く減らすため、当初返済額は大きい一方、残高にかかる利息が早く減り総利息を抑えやすくなります。</p><p>③イメージ → 3,000万円を借りた場合、元利均等は家計の毎月負担を平らにしやすく、元金均等は最初が重く徐々に返済額が下がります。</p><p>④具体例 → 利息はローン残高に対してかかります。元金均等では残高が早く減るので、その後に計算される利息も小さくなりやすいのです。</p><p>⑤違い → 『返済額が一定』が元利均等、『返す元金が一定』が元金均等です。</p>", "M": "<p>「一文で覚えるなら――<strong>元利均等は毎回の元金＋利息をほぼ一定にし、元金均等は毎回返す元金を一定にする返済方式です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "繰上げ返済（期間短縮型・返済額軽減型）", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>繰上げ返済（期間短縮型・返済額軽減型）</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 繰上げ返済（期間短縮型・返済額軽減型） が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。 仕組みを最初から説明 期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の問題 → 繰上げ返済（期間短縮型・返済額軽減型） → 条件を確認 → 結果を判断 「で、『でも似たやつもあるよね？ ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 繰上げ返済（期間短縮型・返済額軽減型）の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 今日は 繰上げ返済（期間短縮型・返済額軽減型） です。 仕組みを最初から説明 期間短縮型は返済期間そのものも削るため、同額・同時期なら一般に利息軽減効果が大きいです。 繰上げ返済（期間短縮型・返済額軽減型） が必要になる前に、何が起きているか分かります？ 現実の のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。公的保険と私的保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 公的保険と私的保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。公的保険と私的保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 公的保険と私的保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、公的保険と私的保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事 ゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 公的保険と私的保険 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 公的保険と私的保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 公的保険と私的保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "大数の法則", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>大数の法則</strong>はまずこれです。<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>」</p><p>「はい。用語だけで終わらせません。保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。」</p><p>「ここで『具体的には？』って思いますよね。事故率が2%でも100人なら0件=0%や5件=5%と大きく振れます。でも1万人なら198件=1.98%、205件=2.05%で、2%付近に安定しやすくなります。」</p><p>「つまり、<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。事故率が2%でも100人なら0件=0%や5件=5%と大きく振れます。でも1万人なら198件=1.98%、205件=2.05%で、2%付近に安定しやすくなります。」</p><p>「この場面を最初から追うと、保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 その結果、<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、大数の法則の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。1万人×事故率2%=約200件。1件100万円なら期待保険金は約2億円です。個人の事故時期を予言する法則ではありません。」</p><p>「なぜこの結果になるかというと、保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>大数の法則を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</p><p>②なぜ？ → 保険会社は一人ひとりの事故を当てるのではなく、大きな集団で事故率を安定して見積もるために使います。</p><p>③イメージ → 事故率が2%でも100人なら0件=0%や5件=5%と大きく振れます。でも1万人なら198件=1.98%、205件=2.05%で、2%付近に安定しやすくなります。</p><p>④具体例 → 1万人×事故率2%=約200件。1件100万円なら期待保険金は約2億円です。個人の事故時期を予言する法則ではありません。</p><p>⑤違い → 大数の法則は事故率を予測しやすくする土台。収支相等の原則は、その予測を使って純保険料総額と保険金等総額を釣り合わせる原則です。</p>", "M": "<p>「一文で覚えるなら――<strong>試行数・対象数が増えるほど、実際に起きる割合が本来の確率に近づきやすくなる法則です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "収支相等の原則", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>収支相等の原則</strong>はまずこれです。<strong>保険集団全体で、純保険料の総額と支払う保険金・給付金の総額が等しくなるよう設計する原則です。</strong>」</p><p>「はい。用語だけで終わらせません。大数の法則で事故発生率を見積もり、その期待損失を契約者全体の純保険料で負担します。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。大数の法則=確率を安定させる考え方、収支相等=集団全体の収入と支出を釣り合わせる考え方です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。大数の法則で事故発生率を見積もり、その期待損失を契約者全体の純保険料で負担します。」</p><p>「ここで『具体的には？』って思いますよね。100人から純保険料1万円ずつ集めれば100万円。事故5件に20万円ずつ支払えば合計100万円で釣り合います。」</p><p>「つまり、<strong>保険集団全体で、純保険料の総額と支払う保険金・給付金の総額が等しくなるよう設計する原則です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。大数の法則=確率を安定させる考え方、収支相等=集団全体の収入と支出を釣り合わせる考え方です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。100人から純保険料1万円ずつ集めれば100万円。事故5件に20万円ずつ支払えば合計100万円で釣り合います。」</p><p>「この場面を最初から追うと、大数の法則で事故発生率を見積もり、その期待損失を契約 ent": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>告知義務</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 告知義務 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 告知義務の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。告知義務は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 告知義務 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 告知義務の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。告知義務は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別する 。 仕組みを最初から説明 Aさんが保険料負担に困り、『解約せずに保障を残す方法は？ 条件確認 → 告知義務 → お金・保障の変化 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 告知義務 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、告知義務の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 契約成立後の保険料支払・変更・失効・資金利用など、契約を維持・変更する仕組みを理解する 「比較軸は 契約を残す方法、保障額を変える方法、契約を終了する方法を区別す を最初から説明 条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 変額保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。変額保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 変額保険 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 変額保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。変額保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 変額保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、変額保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 変額保険 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から 、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。災害入院特約・疾病入院特約・生活習慣病入院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、災害入院特約・疾病入院特約・生活習慣病入院特約の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険 率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 災害入院特約・疾病入院特約・生活習慣病入院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 災害入院特約・疾病入院特約・生活習慣病入院特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "退院特約", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>退院特約</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 退院特約 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 退院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、保険料、支払保険金、事業費、健全性を順番に決める場面を想像する。 条件確認 → 退院特約 → お金・保障の変化 保険制度が成立する原理・規制・保険料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。退院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 退院特約 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 退院特約の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。退院特約は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険制度が成立する原理・規制・保険料設計の仕組みを理解する 「比較軸は 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する 。 仕組みを最初から説明 保険会社の会議室で、事故率、 料設計の仕組みを理解する。 なぜ別制度ではないのかは、 発生率の予測、保険料設計、会社健全性、契約者保護を役割別に比較する で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 特定疾病保障・リビングニーズ特約・先進医療特約・就業不能保険 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "払済保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>払済保険</strong>はまずこれです。<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>」</p><p>「はい。用語だけで終わらせません。保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。」</p><p>「ここで『具体的には？』って思いますよね。終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。」</p><p>「つまり、<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。」</p><p>「この場面を最初から追うと、保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。 その結果、<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、払済保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。新たな保険料を払うのではなく、今まで積み上がった解約返戻金を元手に小さい保険へ作り替えるイメージです。」</p><p>「なぜこの結果になるかというと、保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>払済保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</p><p>②なぜ？ → 保険料負担を続けられなくても、契約を全部解約せず保障を残すために使います。</p><p>③イメージ → 終身保険の保険料が払えなくなった人が、以後の支払いをゼロにし、その代わり死亡保障を1,000万円から小さくして一生涯の保障を残す場面です。</p><p>④具体例 → 新たな保険料を払うのではなく、今まで積み上がった解約返戻金を元手に小さい保険へ作り替えるイメージです。</p><p>⑤違い → 払済=期間を残して金額を下げる。延長=金額を原則残して期間を短くする、で対比します。</p>", "M": "<p>「一文で覚えるなら――<strong>保険料の払込みを止め、解約返戻金を一時払保険料に充てて、保険期間を原則そのままに保障額を小さくする変更です。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "延長保険", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>延長保険</strong>はまずこれです。<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>」</p><p>「はい。用語だけで終わらせません。保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。」</p><p>「ここで『具体的には？』って思いますよね。死亡保障1,000万円の契約を維持できなくなった人が、1,000万円という金額を原則残す代わりに保障期間を短くします。」</p><p>「つまり、<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。払済=期間を原則維持して保障額減、延長=保障額を原則維持して期間短縮です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。死亡保障1,000万円の契約を維持できなくなった人が、1,000万円という金額を原則残す代わりに保障期間を短くします。」</p><p>「この場面を最初から追うと、保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 その結果、<strong>保険料の払込みを止め、解約返戻金を使って、元の保険金額を原則維持しながら保障期間を短くする定期保険へ変更する方法です。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、延長保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。解約返戻金という限られた元手で同じ保障額を買うため、一生涯ではなく一定期間の定期保障になります。」</p><p>「なぜこの結果になるかというと、保険料はもう払えないが、一定額の死亡保障をできるだけ残したい場合に使います。 だからです。答えだけじゃなく、この因果関係まで残してください 丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "事業保障資金の準備", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>事業保障資金の準備</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 事業保障資金の準備 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 事業保障資金の準備の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。事業保障資金の準備は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 事業保障資金の準備 が何のための話なのか、一本につなげますよ。</strong>という結論には、今の理由と仕組みがあるんです。」</p><p>「え？ 似たものと同じじゃないのか、ですか？ そこは違います。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 事業保障資金の準備の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ……はい、ここを混ぜないでくださいね。」</p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。事業保障資金の準備は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 事業保障資金の準備 が何のための話なのか、一本につなげますよ。</strong>という 険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。事業保障資金の準備は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → 事業保障資金の準備 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 事業保障資金の準備の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 事業保障資金の準備 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "生命保険料の経理処理", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>生命保険料の経理処理</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 生命保険料の経理処理 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 生命保険料の経理処理の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 生命保険料の経理処理 → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「ここで『具体的には？』って思いますよね。はい。生命保険料の経理処理は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「つまり、<strong>先輩、いき ランの経理処理の条件を当てる → 金額・給付・保障などの結果が決まる 、です。」</div></details>", "R": "<p>「30秒復習です。」</p><p>①何の話？ → 先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ハーフタックスプランの経理処理 が何のための話なのか、一本につなげますよ。</p><p>②なぜ？ → で、ここから少しだけ丁寧にします。」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>③イメージ → はい。ハーフタックスプランの経理処理は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。</p><p>④具体例 → まず、」 」 結論 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する 「比較軸は 個人税務と法人経理、死亡保険金と満期保険金などを分ける 。 仕組みを最初から説明 Aさん個人の契約と株式会社Xの法人契約を並べ、同じ保険でも誰が保険料を負担し誰が受け取るかを変える。 条件確認 → ハーフタックスプランの経理処理 → お金・保障の変化 保険に関する受取・支払を、個人・法人、契約関係、税務上の扱いから整理する。 なぜ別制度ではないのかは、 個人税務と法人経理、死亡保険金と満期保険金などを分ける で説明します。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。</p><p>⑤違い → 流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → ハーフタックスプランの経理処理の条件を当てる → 金額・給付・保障などの結果が決まる 、です。</p>", "M": "<p>「一文で覚えるなら――<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず ハーフタックスプランの経理処理 が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。今回はこの一文から具体例まで戻れれば大丈夫です。……ちゃんと用語そのものを覚えて帰ってくださいね？」</p>"}}, {"title": "定期保険・第三分野保険に関わる保険料の取扱い", "content": {"A": "<h3>A｜要点</h3><p>「先輩、<strong>定期保険・第三分野保険に関わる保険料の取扱い</strong>はまずこれです。<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 定期保険・第三分野保険に関わる保険料の取扱い が何のための話なのか、一本につなげますよ。</strong>」</p><p>「はい。用語だけで終わらせません。で、ここから少しだけ丁寧にします。」 」 結論 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ 「比較軸は 定期・終身・養老などは保障期間と生存給付の有無で比較する 。 仕組みを最初から説明 条件確認 → 定期保険・第三分野保険に関わる保険料の取扱い → お金・保障の変化 家族の死亡・生存・老後という時間軸の中で、保障期間と受取方法を選ぶ。 なぜ別制度ではないのかは、 定期・終身・養老などは保障期間と生存給付の有無で比較する で説明します。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからこの考え方・制度が必要なんです。」</p><p>「似たものとの境界も押さえます。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 定期保険・第三分野保険に関わる保険料の取扱いの条件を当てる → 金額・給付・保障などの結果が決まる 、です。 ここまでセットです。」</p>", "B": "<h3>B｜詳しい解説</h3><p>「じゃあ、なぜそうなるかを順番につなぎます。で、ここから少しだけ丁寧 </p>", "C": "<h3>C｜イメージ理解</h3><p>「先輩、場面は一つだけです。はい。損害保険は単語一個を覚える話じゃなくて、 条件から結果までの流れを覚える話 です。ここが全体像です。」</p><p>「この場面を最初から追うと、で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 その結果、<strong>先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険 が何のための話なのか、一本につなげますよ。</strong>という仕組みにつながります。」</p><p>「つまり難しい名前を思い出せなくても、この場面から『あ、損害保険の話だ』と戻れれば大丈夫です。」</p>", "D": "<h3>D｜具体例</h3><p>「じゃあ一つを深く見ます。まず、」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</p><p>「なぜこの結果になるかというと、で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。 だからです。答えだけじゃなく、この因果関係まで残してください。」</p><p>「そして比較です。流れにすると、 現実の目的・出来事 → 対象者や契約関係の確認 → 時期・期間の確認 → 損害保険の条件を当てる → 金額・給付・保障などの結果が決まる 、です。 条件を一つ入れ替えた問題では、この違いが答えを分けます。」</p>", "Q": "<h3>理解確認</h3><p>「ここだけ先輩の番です。答えはすぐ下に置きます。」</p><h4>Q1</h4><p><b>損害保険を一言でいうと？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「先輩、いきなり細かい条件から暗記しようとしてませんか？ ……もう。そこから入ると、似た制度が出た瞬間に混ざります。まず 損害保険 が何のための話なのか、一本につなげますよ。」</div></details><h4>Q2</h4><p><b>なぜその仕組みが必要？</b></p><details><summary>答えを見る</summary><div class=\"answer\">「で、ここから少しだけ丁寧にします。」 」 結論 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する 「比較軸は 人・物・自分の車・自分の身体を分けて補償対象を比較する 。 仕組みを最初から説明 Aさんの車で事故が起き、人のけが、相手の車、自分の車という3種類の損害を別々の箱へ入れる。 条件確認 → 損害保険 → お金・保障の変化 事故によって生じた損害について、何を・誰を・どこまで補償するかを判断する。 この仕組みでは、最初に現実の目的や出来事があります。 ここで大事なのは、用語の定義だけを覚えて終わらないことです。」</div></details><h4>Q3</h4><p><b>似た概念との違いは？</b></p> function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
document.getElementById("chapter").onchange=e=>{cards=chapterData[e.target.value];cur=0;tab="A";fill();render()};sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
