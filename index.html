<summary>答え</summary>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>高年齢雇用継続給付と介護休業給付</dd><dt>② 一番重要なのは？</dt><dd>前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</dd>\n<dt>③ なぜ？</dt><dd>60歳以降も働き続ける人の賃金低下と、家族介護で一時的に働けない人では、困っている理由がまったく違うため別の給付があります。</dd><dt>④ イメージ</dt><dd>60歳以降も勤務する人／親の介護で休業する人。</dd>\n<dt>⑤ 具体例</dt><dd>問題文の原因語を拾う。『60歳以降の賃金低下』と『介護休業』を同じ計算にしない。</dd><dt>⑥ 注意</dt><dd>『本人が高齢』なのか『家族を介護して休む』のかを最初に切り分けます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>高年齢雇用継続給付と介護休業給付＝前者は高齢期の雇用継続、後者は家族介護のための休業中の所得を支える雇用保険給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</p>\n<p>「先輩、ここで一回止めます。<strong>公的年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社員が65歳になり老齢年金を受ける場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員が65歳になり老齢年金を受ける場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">会社員なら老齢基礎年金だけでなく、加入記録・報酬に応じた老齢厚生年金も考える。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</dd>\n<dt>③ なぜ？</dt><dd>現役世代が保険料を負担し、老齢だけでなく障害や死亡で生活基盤が失われたときにも給付する社会保険です。</dd><dt>④ イメージ</dt><dd>会社員が65歳になり老齢年金を受ける場面。</dd>\n<dt>⑤ 具体例</dt><dd>会社員なら老齢基礎年金だけでなく、加入記録・報酬に応じた老齢厚生年金も考える。</dd><dt>⑥ 注意</dt><dd>国民年金＝1階、厚生年金＝会社員等の2階という二階建てで整理すると分かりやすいです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的年金＝国民年金を基礎に、会社員等には厚生年金が上乗せされ、老齢・障害・遺族という生活リスクを保障します。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "任意加入被保険者", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>任意加入被保険者</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</p>\n<p>「先輩、ここで一回止めます。<strong>任意加入被保険者</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>任意加入被保険者</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>60歳になったが満額に必要な納付月数が足りない場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>任意加入被保険者</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>60歳になったが満額に必要な納付月数が足りない場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>任意加入被保険者</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>任意加入被保険者</dd><dt>② 一番重要なのは？</dt><dd>国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>60歳時点で納付期間が十分でないなど、強制加入終了後も年金額や受給資格を補いたい人に加入の余地を設けています。</dd><dt>④ イメージ</dt><dd>60歳になったが満額に必要な納付月数が足りない場面。</dd>\n<dt>⑤ 具体例</dt><dd>不足月数を確認し、年齢・国内居住・厚生年金加入状況など受験年度の任意加入要件に当てはめる。</dd><dt>⑥ 注意</dt><dd>強制加入ではなく『本人が希望して加入』する点が名前の通りです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>任意加入被保険者＝国民年金の強制加入対象外でも、一定条件を満たす人が本人の申出で加入できる仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "国民年金保険料の免除・猶予制度", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>国民年金保険料の免除・猶予制度</strong>です。」</p>\n<p>「一言でいうと――<strong>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</p>\n<p>「先輩、ここで一回止めます。<strong>国民年金保険料の免除・猶予制度</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>国民年金保険料の免除・猶予制度</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>失業などで所得が大きく下がった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>国民年金保険料の免除・猶予制度</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>失業などで所得が大きく下がった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『払えないから放置』ではなく申請。全額免除・一部免除・猶予のどれか、所得要件等を確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>国民年金保険料の免除・猶予制度</strong>を一言で説明してください。<details><summary>答え</summary>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>国民年金保険料の免除・猶予制度</dd><dt>② 一番重要なのは？</dt><dd>所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</dd>\n<dt>③ なぜ？</dt><dd>払えない人を単なる未納にすると将来の年金権が失われやすいため、申請に基づき保険料負担を軽くしつつ年金制度とのつながりを残します。</dd><dt>④ イメージ</dt><dd>失業などで所得が大きく下がった場面。</dd>\n<dt>⑤ 具体例</dt><dd>『払えないから放置』ではなく申請。全額免除・一部免除・猶予のどれか、所得要件等を確認。</dd><dt>⑥ 注意</dt><dd>未納と免除・猶予は別物。受給資格期間への算入や年金額への反映、追納の扱いが異なります。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>国民年金保険料の免除・猶予制度＝所得低下などで国民年金保険料を払うのが難しい人について、一定要件で免除または納付猶予を認める制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "老齢基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>老齢基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</p>\n<p>「先輩、ここで一回止めます。<strong>老齢基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>老齢基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>65歳になった人が老齢基礎年金を請求する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>老齢基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳になった人が老齢基礎年金を請求する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>老齢基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>老齢基礎年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</dd>\n<dt>③ なぜ？</dt><dd>20歳から60歳までを中心とする加入記録を老後の基礎的な所得保障へつなげます。受給できるかと、満額かどうかは別の論点です。</dd><dt>④ イメージ</dt><dd>65歳になった人が老齢基礎年金を請求する場面。</dd>\n<dt>⑤ 具体例</dt><dd>40年間すべて納付した人と未納期間がある人では、受給資格を満たしていても年金額が同じとは限らない。</dd><dt>⑥ 注意</dt><dd>『受給資格期間』と『年金額に反映される納付済・免除期間』を混同しないこと。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>老齢基礎年金＝国民年金の老齢給付で、受給資格期間を満たした人が原則65歳から受け取ります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "繰上げ支給と繰下げ支給", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>繰上げ支給と繰下げ支給</strong>です。」</p>\n<p>「一言でいうと――<strong>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</p>\n<p>「先輩、ここで一回止めます。<strong>繰上げ支給と繰下げ支給</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>繰上げ支給と繰下げ支給</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>60代前半で受給を始めたい人／70歳まで待てる人。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>繰上げ支給と繰下げ支給</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>60代前半で受給を始めたい人／70歳まで待てる人。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>繰上げ支給と繰下げ支給</strong>を一言で説明してください。<details><summary>答え</summary>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>繰上げ支給と繰下げ支給</dd><dt>② 一番重要なのは？</dt><dd>老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</dd>\n<dt>③ なぜ？</dt><dd>早く受ければ受給期間が長くなる可能性があるため月額を下げ、遅く受ければ受給開始を待つ分だけ月額を増やす設計です。</dd><dt>④ イメージ</dt><dd>60代前半で受給を始めたい人／70歳まで待てる人。</dd>\n<dt>⑤ 具体例</dt><dd>受給開始年齢から増減率を計算する問題では、受験年度の月当たり増減率を使い、適用世代にも注意。</dd><dt>⑥ 注意</dt><dd>一時的な前借り・後払いではなく、受給開始後の年金額そのものが調整されます。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>繰上げ支給と繰下げ支給＝老齢年金を原則の65歳より早く受けると減額、遅く受けると増額され、その調整は原則生涯続きます。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "付加年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>付加年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</p>\n<p>「先輩、ここで一回止めます。<strong>付加年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>付加年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>自営業者が老齢基礎年金を少し増やしたい場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>付加年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>自営業者が老齢基礎年金を少し増やしたい場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">付加年金額は原則『200円×付加保険料納付月数』。10年=120月なら年2万4,000円の上乗せ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>付加年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>付加年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</dd>\n<dt>③ なぜ？</dt><dd>基礎年金だけではなく少額の追加保険料で老後給付を上乗せしたい人向けの仕組みです。</dd><dt>④ イメージ</dt><dd>自営業者が老齢基礎年金を少し増やしたい場面。</dd>\n<dt>⑤ 具体例</dt><dd>付加年金額は原則『200円×付加保険料納付月数』。10年=120月なら年2万4,000円の上乗せ。</dd><dt>⑥ 注意</dt><dd>国民年金基金との併用制限など、『誰でも自由に付けられる』わけではない点に注意します。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>付加年金＝国民年金第1号被保険者などが付加保険料を上乗せして納め、老齢基礎年金を増やす制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "老齢厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>老齢厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</p>\n<p>「先輩、ここで一回止めます。<strong>老齢厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>老齢厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>長年会社員として働いた人が65歳になる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>老齢厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>長年会社員として働いた人が65歳になる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>老齢厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>老齢厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等は基礎年金に加えて報酬に応じた保険料を負担しているため、その加入実績が老後の報酬比例部分などに反映されます。</dd><dt>④ イメージ</dt><dd>長年会社員として働いた人が65歳になる場面。</dd>\n<dt>⑤ 具体例</dt><dd>同じ加入期間でも標準報酬等が異なれば、老齢厚生年金の報酬比例部分は同額とは限らない。</dd><dt>⑥ 注意</dt><dd>老齢基礎年金は基礎部分、老齢厚生年金は厚生年金加入者の上乗せ部分です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>老齢厚生年金＝厚生年金の加入期間や報酬等に応じ、原則として老齢基礎年金に上乗せされる年金です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "経過的加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>経過的加算</strong>です。」</p>\n<p>「一言でいうと――<strong>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</p>\n<p>「先輩、ここで一回止めます。<strong>経過的加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>経過的加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>経過的加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">試験では計算式丸暗記より『何の差を調整する加算か』をまず区別。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>経過的加算</strong>を一言で説明してください。<details><summary>答え</summary>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>経過的加算</dd><dt>② 一番重要なのは？</dt><dd>老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</dd>\n<dt>③ なぜ？</dt><dd>制度移行の過程では、厚生年金の定額部分に対応する期間と基礎年金へ反映される期間が完全には一致しない場合があります。その差を埋める役割です。</dd><dt>④ イメージ</dt><dd>厚生年金の加入歴と基礎年金の計算対象期間にズレがある場面。</dd>\n<dt>⑤ 具体例</dt><dd>試験では計算式丸暗記より『何の差を調整する加算か』をまず区別。</dd><dt>⑥ 注意</dt><dd>配偶者の存在で付く加給年金・振替加算とは目的が違い、『本人の年金制度上の差の調整』です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>経過的加算＝老齢厚生年金と老齢基礎年金の制度上の差を調整するため、老齢厚生年金に加算される部分です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "配偶者加給年金と振替加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>配偶者加給年金と振替加算</strong>です。」</p>\n<p>「一言でいうと――<strong>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</p>\n<p>「先輩、ここで一回止めます。<strong>配偶者加給年金と振替加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>配偶者加給年金と振替加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>配偶者加給年金と振替加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『誰の年金に付いているか』を追うのが最重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>配偶者加給年金と振替加算</strong>を一言で説明してください。<details><summary>答え</summary>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『誰の年金に付いているか』を追うのが最重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>配偶者加給年金と振替加算</dd><dt>② 一番重要なのは？</dt><dd>加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</dd>\n<dt>③ なぜ？</dt><dd>厚生年金受給者が家族を扶養する時期に加給し、配偶者が自分の老齢基礎年金を受ける年齢になると、条件により配偶者側へ振替加算が付くという時系列で理解します。</dd><dt>④ イメージ</dt><dd>年上の夫が老齢厚生年金を受け、年下の妻がいる場面。</dd>\n<dt>⑤ 具体例</dt><dd>夫側の加給年金→妻が65歳→条件を満たせば妻側の老齢基礎年金に振替加算、という流れ。</dd><dt>⑥ 注意</dt><dd>『誰の年金に付いているか』を追うのが最重要です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>配偶者加給年金と振替加算＝加給年金は一定の配偶者等がいる老齢厚生年金受給者側への加算、振替加算は条件を満たす配偶者側の老齢基礎年金への加算です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "在職老齢年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>在職老齢年金</strong>です。」</p>\n<p>「一言でいうと――<strong>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</p>\n<p>「先輩、ここで一回止めます。<strong>在職老齢年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>在職老齢年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>65歳以降も会社員として高い賃金で働く場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>在職老齢年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>65歳以降も会社員として高い賃金で働く場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">『賃金相当額＋老齢厚生年金の基本月額』を受験年度の支給停止調整額と比較して停止額を判断する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>在職老齢年金</strong>を一言で説明してください。<details><summary>答え</summary>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>在職老齢年金</dd><dt>② 一番重要なのは？</dt><dd>働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>高い賃金を得ながら厚生年金も満額受給するケースについて、一定基準を超えると老齢厚生年金の一部または全部を支給停止する仕組みです。</dd><dt>④ イメージ</dt><dd>65歳以降も会社員として高い賃金で働く場面。</dd>\n<dt>⑤ 具体例</dt><dd>『賃金相当額＋老齢厚生年金の基本月額』を受験年度の支給停止調整額と比較して停止額を判断する。</dd><dt>⑥ 注意</dt><dd>老齢基礎年金はこの支給停止調整の対象ではありません。基準額は改正されるため受験年度確認が必要です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>在職老齢年金＝働きながら老齢厚生年金を受ける人について、賃金と老齢厚生年金の額に応じて年金を調整する仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "障害基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>障害基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</p>\n<p>「先輩、ここで一回止めます。<strong>障害基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>障害基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>障害基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">初診日→保険料納付要件→障害認定日の等級、の順にチェック。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>障害基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>障害基礎年金</dd><dt>② 一番重要なのは？</dt><dd>一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>老後を待たず、病気やけがで生活・就労能力が大きく損なわれたときの所得保障です。だから年齢だけでなく初診日、障害状態、納付要件を順番に確認します。</dd><dt>④ イメージ</dt><dd>国民年金加入中に病気の初診日があり、後に重い障害状態になった場面。</dd>\n<dt>⑤ 具体例</dt><dd>初診日→保険料納付要件→障害認定日の等級、の順にチェック。</dd><dt>⑥ 注意</dt><dd>障害者手帳の等級と障害年金の等級は別制度なので、そのまま一致すると考えません。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>障害基礎年金＝一定の障害状態にあり、初診日や保険料納付などの要件を満たす場合に支給される国民年金の障害給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "障害厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>障害厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</p>\n<p>「先輩、ここで一回止めます。<strong>障害厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>障害厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>障害厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員時代に初診日のある病気で障害状態になった場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>障害厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>障害厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等は厚生年金にも加入しているため、障害基礎年金に加えて厚生年金側の保障が設けられています。</dd><dt>④ イメージ</dt><dd>会社員時代に初診日のある病気で障害状態になった場面。</dd>\n<dt>⑤ 具体例</dt><dd>現在の職業ではなく『初診日に厚生年金加入中だったか』から制度を判定する。</dd><dt>⑥ 注意</dt><dd>障害基礎年金と比べて等級・給付構造が異なり、初診日にどの年金制度へ加入していたかが重要です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>障害厚生年金＝厚生年金加入中に初診日がある傷病などで一定要件を満たす場合に支給される障害給付です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族基礎年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族基礎年金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</p>\n<p>「先輩、ここで一回止めます。<strong>遺族基礎年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>遺族基礎年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>遺族基礎年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>小学生の子がいる家庭で父または母が死亡する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>遺族基礎年金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>遺族基礎年金</dd><dt>② 一番重要なのは？</dt><dd>国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</dd>\n<dt>③ なぜ？</dt><dd>被保険者が死亡した後、養育すべき子がいる家庭の生活を支えることが中心なので、『子』の要件が制度の核になります。</dd><dt>④ イメージ</dt><dd>小学生の子がいる家庭で父または母が死亡する場面。</dd>\n<dt>⑤ 具体例</dt><dd>死亡した人の納付要件等に加え、残された配偶者に対象となる子がいるか確認。</dd><dt>⑥ 注意</dt><dd>『配偶者なら子がいなくても必ず遺族基礎年金』ではありません。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>遺族基礎年金＝国民年金の遺族給付で、主に子のある配偶者または子を対象とします。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "寡婦年金と死亡一時金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>寡婦年金と死亡一時金</strong>です。」</p>\n<p>「一言でいうと――<strong>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</p>\n<p>「先輩、ここで一回止めます。<strong>寡婦年金と死亡一時金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>寡婦年金と死亡一時金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>寡婦年金と死亡一時金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>自営業だった夫が老齢基礎年金受給前に死亡した場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>寡婦年金と死亡一時金</strong>を一言で説明してください。<details><summary>答え</summary>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>寡婦年金と死亡一時金</dd><dt>② 一番重要なのは？</dt><dd>国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</dd>\n<dt>③ なぜ？</dt><dd>保険料を長く納めたのに老齢基礎年金を受ける前に死亡した場合などに、一定の遺族へ給付を設ける考え方です。</dd><dt>④ イメージ</dt><dd>自営業だった夫が老齢基礎年金受給前に死亡した場面。</dd>\n<dt>⑤ 具体例</dt><dd>婚姻期間、夫の納付期間、妻の年齢などを寡婦年金要件に当てはめ、該当しなければ死亡一時金の要件も確認。</dd><dt>⑥ 注意</dt><dd>寡婦年金は一定の妻への年金、死亡一時金は一定の遺族への一時金。両者の併給関係にも注意します。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>寡婦年金と死亡一時金＝国民年金第1号被保険者に関係する独自の遺族給付で、寡婦年金と死亡一時金は対象者・要件・支給方法が異なります。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "遺族厚生年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>遺族厚生年金</strong>です。」</p>\n<p>「一言でいうと――<strong>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</p>\n<p>「先輩、ここで一回止めます。<strong>遺族厚生年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>遺族厚生年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>会社員の夫が死亡し妻と子が残る場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>遺族厚生年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>会社員の夫が死亡し妻と子が残る場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>遺族厚生年金</strong>を一言で説明してください。<details><summary>答え</summary>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>遺族厚生年金</dd><dt>② 一番重要なのは？</dt><dd>厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</dd>\n<dt>③ なぜ？</dt><dd>会社員等が死亡すると、その人の厚生年金加入実績に基づく所得保障を遺族へつなげます。</dd><dt>④ イメージ</dt><dd>会社員の夫が死亡し妻と子が残る場面。</dd>\n<dt>⑤ 具体例</dt><dd>まず遺族基礎年金の子要件、次に遺族厚生年金の遺族要件を確認し、併給できる組合せを整理。</dd><dt>⑥ 注意</dt><dd>遺族基礎年金より対象遺族の範囲・子の有無の扱いが異なるため、両制度を別々に判定します。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>遺族厚生年金＝厚生年金の被保険者・受給権者等が死亡し一定要件を満たすと、所定の遺族に支給される年金です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "中高齢寡婦加算", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>中高齢寡婦加算</strong>です。」</p>\n<p>「一言でいうと――<strong>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</p>\n<p>「先輩、ここで一回止めます。<strong>中高齢寡婦加算</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>中高齢寡婦加算</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>中高齢寡婦加算</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>中高齢寡婦加算</strong>を一言で説明してください。<details><summary>答え</summary>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>中高齢寡婦加算</dd><dt>② 一番重要なのは？</dt><dd>一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</dd>\n<dt>③ なぜ？</dt><dd>子が成長して遺族基礎年金がなくなってから、自分の老齢基礎年金を受けるまでの期間などに所得保障の空白が生じやすいため、その谷間を補う役割があります。</dd><dt>④ イメージ</dt><dd>夫死亡後、子が成長して遺族基礎年金が終了した中高齢の妻の場面。</dd>\n<dt>⑤ 具体例</dt><dd>妻の年齢、夫の厚生年金加入要件、遺族基礎年金との関係を時系列で確認。</dd><dt>⑥ 注意</dt><dd>遺族基礎年金そのものでも、振替加算でもありません。遺族厚生年金への加算です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>中高齢寡婦加算＝一定要件を満たす中高齢の妻について、遺族厚生年金に加算される仕組みです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "公的年金等控除", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>公的年金等控除</strong>です。」</p>\n<p>「一言でいうと――<strong>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</p>\n<p>「先輩、ここで一回止めます。<strong>公的年金等控除</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>公的年金等控除</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>老齢年金を受け取る人の所得税計算をする場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>公的年金等控除</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>老齢年金を受け取る人の所得税計算をする場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>公的年金等控除</strong>を一言で説明してください。<details><summary>答え</summary>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>公的年金等控除</dd><dt>② 一番重要なのは？</dt><dd>公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</dd>\n<dt>③ なぜ？</dt><dd>年金収入の全額をそのまま課税所得にするのではなく、年齢や収入等に応じた公的年金等控除を差し引いて雑所得を求めます。</dd><dt>④ イメージ</dt><dd>老齢年金を受け取る人の所得税計算をする場面。</dd>\n<dt>⑤ 具体例</dt><dd>公的年金等収入－公的年金等控除額＝公的年金等に係る雑所得、という順序。</dd><dt>⑥ 注意</dt><dd>社会保険料控除は支払った保険料の所得控除。公的年金等控除は年金収入から雑所得を計算する仕組みです。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>公的年金等控除＝公的年金等の収入から一定額を差し引き、公的年金等に係る雑所得を計算するための控除です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "確定拠出年金", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>確定拠出年金</strong>です。」</p>\n<p>「一言でいうと――<strong>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</p>\n<p>「先輩、ここで一回止めます。<strong>確定拠出年金</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>確定拠出年金</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>確定拠出年金</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">月2万円なら年24万円を拠出。運用利回りが違えば同じ掛金でも将来残高は変わる。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>確定拠出年金</strong>を一言で説明してください。<details><summary>答え</summary>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>確定拠出年金</dd><dt>② 一番重要なのは？</dt><dd>拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</dd>\n<dt>③ なぜ？</dt><dd>将来受取額を制度側が約束するのではなく、掛金を積み立て、加入者等が商品を選んで運用するため、成果によって老後資産が変わります。</dd><dt>④ イメージ</dt><dd>iDeCoで毎月2万円を投資信託等へ積み立てる場面。</dd>\n<dt>⑤ 具体例</dt><dd>月2万円なら年24万円を拠出。運用利回りが違えば同じ掛金でも将来残高は変わる。</dd><dt>⑥ 注意</dt><dd>『確定』しているのは基本的に拠出のルール側で、将来給付額が固定されている確定給付年金とは違います。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>確定拠出年金＝拠出した掛金を加入者等が運用し、運用成果によって将来の給付額が変わる年金制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "小規模企業共済等掛金控除", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>小規模企業共済等掛金控除</strong>です。」</p>\n<p>「一言でいうと――<strong>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</p>\n<p>「先輩、ここで一回止めます。<strong>小規模企業共済等掛金控除</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>小規模企業共済等掛金控除</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>小規模企業共済等掛金控除</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>小規模企業共済等掛金控除</strong>を一言で説明してください。<details><summary>答え</summary>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>小規模企業共済等掛金控除</dd><dt>② 一番重要なのは？</dt><dd>小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</dd>\n<dt>③ なぜ？</dt><dd>老後・退職資金を自助努力で積み立てる人を税制面で支援するため、対象掛金を課税所得の計算前に控除します。</dd><dt>④ イメージ</dt><dd>iDeCoへ毎月2万円拠出する人の所得税計算の場面。</dd>\n<dt>⑤ 具体例</dt><dd>年間掛金24万円なら、要件を満たす対象掛金24万円を小規模企業共済等掛金控除として所得から差し引く。</dd><dt>⑥ 注意</dt><dd>税額控除のように税金そのものから直接引くのではなく、所得控除として課税所得を減らします。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>小規模企業共済等掛金控除＝小規模企業共済やiDeCoなど対象制度の掛金を所得から差し引ける所得控除です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "中退共（中小企業退職金共済制度）", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>中退共（中小企業退職金共済制度）</strong>です。」</p>\n<p>「一言でいうと――<strong>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</p>\n<p>「先輩、ここで一回止めます。<strong>中退共（中小企業退職金共済制度）</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>中退共（中小企業退職金共済制度）</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>従業員20人の中小企業が退職金制度を整える場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>中退共（中小企業退職金共済制度）</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>従業員20人の中小企業が退職金制度を整える場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">事業主が従業員ごとに掛金を納付→機構が管理→退職時に機構から従業員へ退職金、というお金の流れ。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>中退共（中小企業退職金共済制度）</strong>を一言で説明してください。<details><summary>答え</summary>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>中退共（中小企業退職金共済制度）</dd><dt>② 一番重要なのは？</dt><dd>中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</dd>\n<dt>③ なぜ？</dt><dd>自社だけで退職金制度を維持しにくい中小企業でも、外部の共済制度を利用すれば計画的に従業員の退職金を準備できます。</dd><dt>④ イメージ</dt><dd>従業員20人の中小企業が退職金制度を整える場面。</dd>\n<dt>⑤ 具体例</dt><dd>事業主が従業員ごとに掛金を納付→機構が管理→退職時に機構から従業員へ退職金、というお金の流れ。</dd><dt>⑥ 注意</dt><dd>小規模企業共済は経営者・個人事業主等の退職金づくり。中退共は従業員の退職金です。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>中退共（中小企業退職金共済制度）＝中小企業の事業主が従業員のために掛金を負担し、勤労者退職金共済機構から従業員へ退職金を支払う制度です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "分割払いとリボ払い", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>分割払いとリボ払い</strong>です。」</p>\n<p>「一言でいうと――<strong>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</p>\n<p>「先輩、ここで一回止めます。<strong>分割払いとリボ払い</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>分割払いとリボ払い</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>分割払いとリボ払い</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">分割は原則10回で終了が見える。リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>分割払いとリボ払い</strong>を一言で説明してください。<details><summary>答え</summary>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>分割払いとリボ払い</dd><dt>② 一番重要なのは？</dt><dd>分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</dd>\n<dt>③ なぜ？</dt><dd>分割払いは購入時に『何回で終わるか』が見えやすい一方、リボ払いは追加利用しても月額が大きく変わりにくく、残高と返済期間が膨らみやすい特徴があります。</dd><dt>④ イメージ</dt><dd>10万円の商品を10回払いにする場合と、リボで月1万円程度ずつ返す場合。</dd>\n<dt>⑤ 具体例</dt><dd>分割は原則10回で終了が見える。リボ中にさらに5万円使えば残高が増え、完済が後ろへ延びやすい。</dd><dt>⑥ 注意</dt><dd>『毎月同じくらいだから安心』ではなく、リボは残高・手数料・完済時期を見る必要があります。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>分割払いとリボ払い＝分割払いは支払回数を決めて返し、リボ払いは利用残高に対して毎月の支払額を一定程度に抑えながら返す方式です。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}, {"title": "キャッシングと総量規制", "content": {"A": "<p>「先輩、まず名前を見て覚えようとしないでください。今日は<strong>キャッシングと総量規制</strong>です。」</p>\n<p>「一言でいうと――<strong>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</strong>」</p>\n<p>「はい。まずここです。で、たぶん今『結局、試験では何を見ればいいの？』って思いましたよね。」</p>\n<p>「見るのは<strong>何のための仕組みか・誰に使うか・何と間違えやすいか</strong>です。特にこのテーマでは、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>。ここを外さないでください。」</p>\n<p>「細かい数字を覚える前に、まずこの骨組みです。数字は改正されても、制度の役割が分かっていれば修正できますから。」</p>", "B": "<p>「はい。じゃあ『なぜ？』まで行きます。ここからが本体ですよ。」</p>\n<p>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</p>\n<p>「先輩、ここで一回止めます。<strong>キャッシングと総量規制</strong>が必要になる前に、何が起きているか分かります？」</p>\n<p>「そうです。まず現実の問題があります。そこに制度や計算方法を当てるんです。制度名から現実を逆算しないでください。」</p>\n<div class=\"flow\"><span>現実の問題</span><b>→</b><span>キャッシングと総量規制</span><b>→</b><span>条件を確認</span><b>→</b><span>結果を判断</span></div>\n<p>「で、『でも似たやつもあるよね？』ですか？　あります。だからこそ、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>という違いを使って切り分けます。」</p>\n<p>「はい。今ので『定義』じゃなく『仕組み』としてつながりました。」</p>", "C": "<p>「今度は文字から離れます。<strong>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</strong>を想像してください。」</p>\n<p>「この人が相談に来たとして、最初に制度名を聞きます？　違いますよね。まず『何に困っているのか』『いつお金が必要なのか』『誰のお金なのか』を聞きます。」</p>\n<p>「その情報を並べると、<strong>キャッシングと総量規制</strong>が候補に上がってくる。つまり、資格試験の問題文も相談場面と同じなんです。」</p>\n<p>「難しい言葉を見たら、<strong>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</strong>という映像に戻してください。文字だけよりずっと残ります。」</p>", "D": "<p>「じゃあ先輩、具体例です。ここは実際に手を動かすつもりで見てください。」</p>\n<div class=\"example\">総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。すでに80万円借りていれば、新規20万円で合計100万円。</div>\n<p>「この例で大事なのは、答えそのものより<strong>なぜその制度・係数を選んだか</strong>です。」</p>\n<p>「もし問題文の数字だけ変わっても、考え方は同じです。逆に、対象者や目的が変わったら、同じ数字でも別制度になることがあります。」</p>\n<p>「だから、<strong>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</strong>。ここを最後にもう一度確認しておきましょう。」</p>", "Q": "<p>「先輩、本当に分かりました？　……3問だけです。」</p>\n<ol><li><strong>キャッシングと総量規制</strong>を一言で説明してください。<details><summary>答え</summary>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</details></li>\n<li>なぜこの仕組みが必要ですか？<details><summary>答え</summary>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</details></li>\n<li>何と区別しますか？<details><summary>答え</summary>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</details></li></ol>\n<p>「3問目まで自分の言葉で言えたら、かなりいいです。言えなかったところだけBに戻ってください。」</p>", "R": "<p>「はい、あと30秒です。これで終わりですから。」</p>\n<dl><dt>① 何の話？</dt><dd>キャッシングと総量規制</dd><dt>② 一番重要なのは？</dt><dd>キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</dd>\n<dt>③ なぜ？</dt><dd>返済能力を超える過剰貸付を防ぐため、貸金業者による個人向け貸付に年収を基準とした上限を設けています。</dd><dt>④ イメージ</dt><dd>年収300万円の人が消費者金融やカード会社のキャッシングを利用する場面。</dd>\n<dt>⑤ 具体例</dt><dd>総量規制対象の貸金業者からの借入残高は原則合計100万円までが目安。すでに80万円借りていれば、新規20万円で合計100万円。</dd><dt>⑥ 注意</dt><dd>銀行からの借入れ等は貸金業法上の総量規制の対象外です。『すべての借金が年収の3分の1』ではありません。</dd></dl>", "M": "<p>「最後に一文だけ残します。」</p><div class=\"memory\"><strong>キャッシングと総量規制＝キャッシングは現金を借りること。総量規制では貸金業者から個人への借入残高は原則として年収の3分の1までです。</strong></div>\n<p>「全部を丸暗記しなくていいです。でも、この一文を見た瞬間に、さっきの場面と仕組みが戻ってくるようにしてください。」</p>\n<p>「……はい。今回はこれで大丈夫です。次に見たとき、名前だけじゃなく『なぜ』まで言えたら合格ですよ。」</p>"}}],ti=[["A","A 要点"],["B","B 詳細"],["C","C イメージ"],["D","D 具体例"],["Q","理解確認"],["R","30秒復習"],["M","一文記憶"]];let cur=0,tab="A";const $=x=>document.getElementById(x),sel=$("sel"),q=$("quick"),search=$("search"),tabs=$("tabs");
cards.forEach((c,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${c.title}`;sel.appendChild(o)});ti.forEach(([k,l])=>{let b=document.createElement("button");b.className="tab";b.textContent=l;b.onclick=()=>{tab=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function quick(f=""){q.innerHTML="";let s=f.toLowerCase().trim();cards.forEach((c,i)=>{if(s&&!c.title.toLowerCase().includes(s))return;let b=document.createElement("button");b.textContent=c.title;b.className=i===cur?"on":"";b.onclick=()=>{cur=i;render()};q.appendChild(b)})}
function render(){let c=cards[cur];$("count").textContent=`${cur+1} / ${cards.length}`;$("title").textContent=c.title;$("content").innerHTML=c.content[tab];[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tab));sel.value=cur;$("prev").disabled=cur===0;$("next").disabled=cur===cards.length-1;$("status").textContent=`全${cards.length}項目｜キャッシングと総量規制まで`;quick(search.value)}
sel.onchange=()=>{cur=+sel.value;render()};search.oninput=()=>quick(search.value);$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<cards.length-1){cur++;render()}};render();</script></body></html>
